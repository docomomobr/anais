name: Deploy Hugo site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct database from SQL dump
        run: sqlite3 anais.db < anais.sql

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Generate Hugo content from database
        run: |
          for s in sdbr01 sdbr02 sdbr03 sdbr04 sdbr05 sdbr06 sdbr07 sdbr08 sdbr09 sdbr10 sdbr11 sdbr12 sdbr13 sdbr14 sdbr15; do
            python3 scripts/db2hugo.py --seminar $s --outdir site/content
          done

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.123.7'
          extended: true

      - name: Build Hugo site
        working-directory: site
        run: hugo --gc --minify

      - name: Build Pagefind search index
        run: npx pagefind --site site/public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
