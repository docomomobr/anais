- id: 'sdbr07-061'
  title: Conjunto Habitacional Presidente Getúlio Vargas
  subtitle: da proposta monumental à sobrevivência nos dias atuais
  authors:
  - givenname: Luciana
    familyname: Nemer Diniz
    email: null
    affiliation: null
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  section: Residência
  abstract: |-
    O presente artigo baseia-se no texto da Tese de Doutorado intitulada: Estudo de Exemplos Paradigmáticos como contribuição para a solução dos problemas da habitação popular na cidade do Rio de Janeiro defendida na COPPE – UFRJ. Esta Tese apresenta um panorama da habitação popular no Rio de Janeiro dos séculos XIX e XX. Dentre os exemplos citados, três foram considerados paradigmáticos por retratarem em suas soluções o pensamento político, as questões sociais, as determinantes econômicas, a linguagem arquitetônica e a implantação urbanística adequados aquele momento.
    O segundo exemplo paradigmático foi o Conjunto Habitacional Presidente Getúlio Vargas do arquiteto Flávio Marinho Rego que formalizou os princípios da arquitetura moderna bem como suas expectativas socialistas. O conjunto é um exemplo significativo das tendências de vanguarda da época, por sua concepção arquitetônica e urbanística, pelo porte (1314 unidades), pela complexidade do empreendimento e pelos programas assistenciais.
    A obra de 1953/1954, inspirada, para BONDUKI, no Pedregulho, possuía um programa com espaços de uso comum, áreas verdes, parques esportivos, escola, posto de saúde, mercado e administração que lhe conferiam autonomia. A moradia era reduzida às funções essenciais dentro de uma área mínima. Também conhecido como Conjunto Deodoro foi construído pela Fundação da Casa Popular e em 2002 foi feito um levantamento de sua história que incluiu: uma contextualização temporal, um estudo da sua localização, o agente promotor, o público alvo, os aspectos funcionais e formais que definiram o partido bem como as condições em que se encontra atualmente.
    Foram as imagens obtidas no local bem como a quantidade de informações com moradores e membros de associações locais que permitiram uma análise criteriosa da obra que levou as conclusões finais. E, é este levantamento que pretende-se apresentar: da proposta monumental a sobrevivência nos dias atuais.
  keywords:
  - arquitetura
  - habitação popular e moderno
  - 'Key words: architectural'
  - low income housing and modern
  abstract_en: |-
    This paper is based on a doctorate Thesis named: Paradigmatic examples study as contribution for low income housing program solution in Rio de Janeiro city defended in COPPE – UFRJ. This Thesis gives an overview about the low income housing program developed in Rio de Janeiro, during the XIX and XX centuries. Among the examples cited in this study, three of them were considered paradigmatics for portray in their solutions the political thought, the social questions, the economic determinations, the architectural language and the solution urbanization appropriate of that moment.
    The second paradigmatic example was the: Group of residence President Getúlio Vargas of architect Flávio Marinho Rego who forms the beginnings of modern architectural as well their socialist expectations. The group is an important example of vanguard tendencies in that period, by its conception architectural and urbanization, by its capacity (1314 units), by complexity of interprise and by assistance programmes.
    The building of 1953/1954, inspirited, for BONDUKI, in Pedregulho, was a programme with public spaces, land scapes, sports centre, scholl, a small hospital, market and office that brought to it self-government. The home was limited of essential functions in a small area. Also knows by Group of Deodoro was built by Foundatiton of Casa Popular and by the year of 2002 was made an uprising of this history which include: a worldly contents, a location study, the promoter agent, the public target, the formal and functional aspects which defined the decision as well the conditions in this moment.
    The pictures obtained in site as well the quantity of informations with residents and members of site associations which let an criterion analysis of the building that took of end conclusions. And, this uprising which going to claim show: from monumental proposal to current days surviving.
