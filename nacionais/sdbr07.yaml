  section: 'Paisagem, Transporte e Mercado'
  abstract: 'O texto expõe aspectos culturais da concepção e restauração de um jardim moderno, a Praça Faria Neves, projetada pelo paisagista Roberto Burle Marx em 1958 a convite do prefeito Pelópidas Silveira, após sua atuação no Recife a partir de 1935. Segundo princípios formulados desde a década de 1930, o jardim moderno dotava a cidade de um espaço de recreação, educação, higiene e arte, expresso na variedade vegetal. Também conhecida como Praça de Dois Irmãos, a praça localiza-se no Bairro de Dois Irmãos, no largo do antigo engenho homônimo, num dos subúrbios tradicionais do Recife. É delimitada por uma vila popular, pelas antigas instalações do engenho e pelo Horto Zoobotânico, numa área de Mata Atlântica. A concepção de Burle Marx era a de um jardim recreativo cujo motivo principal era o playground, garantido um espaço lúdico para as crianças. A partir da década de 1980, o uso da praça como estacionamento de veículos e a realização do Festival da Criança ocasionaram grandes modificações do projeto de Burle Marx. O mobiliário foi, em parte, destruído, a vegetação foi danificada e o terreno passou por um processo de erosão, agravados pela presença de um terminal de ônibus e de um bar. A partir de 2001, a elaboração do projeto de restauração foi iniciada através de uma parceria entre o Laboratório da Paisagem da UFPE e a Prefeitura do Recife, cujos técnicos foram estimulados à reconstituição da planta, uma vez que o projeto original não foi localizado nos arquivos do Recife ou no Escritório Burle Marx, conduzida nos moldes na Carta de Florença. Incluiu levantamento de documentos históricos, comparação de iconografia, identificação de componentes do projeto no local, estudo de outros projetos do paisagista, discussão com instituições e consulta a técnicos e à população do entorno, de cuja imaginação e acervo fotográfico renasciam as linhas do desenho de Burle Marx.'
  keywords:
  - restauração
  - jardim moderno
  - Praça Faria Neves
  abstract_en: 'This paper deals with cultural contents of the creation and restoration of the Faria Neves Square a modern garden designed by Roberto Burle Marx in 1958. The restoration was a partnership between the Federal University of Pernambuco and Recife City Council. After his 1935 landscape designs projects, Burle Marx returned to Recife invited by Pelópidas Silveira mayor. The modern garden since 1930 has given to Recife a recreational, educational, hygienic and artistic space, by different vegetation. The Faria Neves Square, also known as Dois Irmãos Square was located on the surroundings of a popular village, an old sugar cane mill and the Dois Irmãos Protected Area or Dois Irmãos Park, a forest. Burle Marx created a recreation garden for children of the village with sculptural play ground equipment to attract people near large benches and coconut trees and fruit trees. In the 1980s the lack of maintenance has changed the character of this public space. It became a parking for tourist buses, car and other transport which brought visitants to the park. In addition there was a famous Child Festival that took place every October leaving damage vegetation and open space. There was a bus terminal with some kiosks where the drivers took a break. The restoration project started in 2001 as a result of a workshop landscape design course provided by the Landscape Architecture Laboratory of the university. Burle Marx original project was not founded either in the Burle Marx office in Rio de Janeiro nor in the City Council archives in Recife. The restoration followed the Florence Charter principles including the journal search, interviews with the old residents, and old photographs beside an oral history elaborated considering resident memory which was important to reconstitute a similar original project. It was the great contribution of the surrounding population.'
