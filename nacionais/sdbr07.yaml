- id: 'sdbr07-034'
  title: 'Um encontro, um desencontro'
  subtitle: 'Lucio Costa, Raul Lino e Carlos Ramos'
  authors:
  - givenname: Madalena Cunha
    familyname: Matos
    email: 'mcunhamatos@fa.utl.pt'
    affiliation: null
    orcid: '0000-0003-1779-3855'
