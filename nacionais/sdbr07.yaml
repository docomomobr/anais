- id: 'sdbr07-025'
  title: Um caminho para a Glória
  subtitle: 'Lucio Costa: a construção do passado e mais um milagre'
  authors:
  - givenname: Gustavo
    familyname: 'Rocha-Peixoto'
    email: null
    affiliation: null
    orcid: '0009-0004-0554-3052'
    bio: null
    country: BR
