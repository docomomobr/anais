- id: 'sdbr07-003'
  title: A Praça e a Piazza
  subtitle: transitoriedade e permanência no esquema clássico de cidade
  authors:
  - givenname: Ana Carolina Santos
    familyname: Pellegrini
    email: 'pellegrini@exemplo.com'
    affiliation: null
    orcid: '0000-0001-7389-8577'
    bio: null
    country: BR
    primary_contact: false
  - givenname: Andréa Soler
    familyname: Machado
    email: 'andreasolermachado@gmail.com'
    affiliation: null
    orcid: '0000-0003-0243-7946'
    bio: null
    country: BR
    primary_contact: false
  section: Praça e Palácio
  abstract: 'A cidade é resultado do esforço coletivo do homem a fim de garantir o domínio permanente de um território. Suas transformações, ao longo do tempo, implicam dinamismo e transitoriedade e evocam sempre, paradoxalmente, os seus começos, reforçando ou transgredindo seus traçados fundacionais. Este trabalho pretende analisar a relativa efemeridade do espaço urbano à luz de dois exemplos: a Praça da Matriz, em Porto Alegre, e a Pizza do Campidoglio, em Roma, espaços pertencentes a locais distintos e distantes, criados em tempos diferentes, mas com topografia análoga e baseados em esquema compositivo, caráter, usos e relevância urbana semelhantes. Ambas as praças assumiram, ao longo dos anos, um papel determinante na memória e na imagem de suas respectivas cidades, e são espaços usualmente tidos como consolidados na paisagem urbana. Essa noção de estabilidade, entretanto, não resiste a um distanciamento temporal e espacial do objeto estudado. Tanto a Praça da Matriz como a Piazza do Campidoglio passaram, desde suas fundações, por processos de transformação que determinaram não apenas a modificação da moldura do espaço aberto, mas sua relação com a cidade que o circunda. Substituição de edificações, reformulações do traçado urbano, requalificação de fachadas, acréscimo e subtração de monumentos são alguns dos exemplos que podem ilustrar o tema. O estudo pretende abordar o desenho da cidade sob uma ótica diversa da habitual, visando à reflexão a respeito da relativa estabilidade aspirada pela intervenção urbanística clássica em relação ao tempo e o impacto das transformações aportadas pela modernidade. Não se inteciona avaliar o que pode ser determinado a priori pelo projetista. Mas sim, as modificações, renovações e rearquiteturas impressas pelo tempo e pela instabilidade inerente à condição urbana.'
  abstract_en: 'The city is the result of the collective endeavor to guarantee the permanency of a certain territory. Along the time its transformation requires dynamism and transitoriness which always calls forth paradoxically its begins, reinforcing or transgressing its early foundations. This work intends to analyse the transitoriness of the urban space concerning two examples: Matriz Square in Porto Alegre and Piazza di Campidoglio in Rome. This spaces in two different and distinct places were created in unequal epochs. Nevertheless they have similarities, like monumental character, uses, urban design, classical composition and topography: both are built on a hill. Both squares played a determinant part in the memory and image of their cities, and they are spaces usually thought as consolidated in the urban landscape. This idea of stability, however, doesn’t resist to a temporal and special distance of the object analyzed. Both squares suffered transformations along the time, which determined not only the modification of the borders of the open space as well as its relationship with the city in its surroundings. Substitution of constructions, reformulation on the urban project, requalification of façades, adding or subtracting monuments, are some examples which may illustrate the subject. The work intends to approach the design of the city under a distinct point of view, leading to a reflection as to the relative stability desires by the classic urbanistic intervention in relation to the time and the impact of transformations due to modernity.'
  references:
  - 'ARGAN, Giulio Carlo. História da arte como história da cidade. São Paulo: Martins Fontes, 1995.'
  - 'ARGAN, Giulio Carlo. Projeto e Destino. São Paulo: Ática, 2001.'
