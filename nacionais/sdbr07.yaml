    familyname: Vasconcellos
    email: null
    affiliation: UFT
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  section: Urbanismo
  abstract: 'Em Palmas, a capital projetada do Estado do Tocantins, conta-se como verídica a seguinte história. Vindos de pequena cidade do interior do estado, uma criança de seus oito anos, acompanhada do pai, observava atentamente a capital. De repente faz a pergunta: “pai, porque nesta cidade tem tanto cemitério?” Como na história do rei nu, a criança percebeu o que há muito a corporação profissional dos arquitetos parece não perceber. Ou se percebem, consideram o que estão a fazer como o melhor padrão. Parece não se darem conta dos efeitos maléficos para os espaços urbanos que projetam. Palmas é constituída por grandes quadras “introspectivas”, projetadas ou não por arquitetos brasileiros de renome. As edificações são voltadas para o interior das quadras. Para fora (para os espaços urbanos além da mera vizinhança, ou seja, para as principais avenidas) voltam-se apenas as paredes de fundo das edificações. As quadras são cercadas por muros contínuos de centenas de metros, salvo as poucas entradas para seu interior. “Cemitérios”, portanto, na lúcida leitura da criança. Palmas foi projetada a toque de caixa em 1988 e implementada a partir de 1989. Resgata muitos dos aspectos típicos do urbanismo moderno mas tem especificidades que merecem reflexão detida. (É uma grande injustiça, com Brasília, compará-la à capital brasileira.) O texto reflete sobre as especificidades, particularmente como a “modernidade” em Palmas está a ser subvertida, requalificada portanto, em algumas quadras onde predominam famílias de mais baixo poder aquisitivo. Uma das mudanças morfológicas mais importantes é a “extroversão” das quadras – elas têm os seus paredões de contorno “furados” por edificações dos mais diversos tipos, particularmente as comerciais e de serviços, que passam a se voltar para as vias arteriais. Exemplo claro de duas lógicas espaciais contraditórias a conviver na mesma cidade (como ademais sói acontecer em qualquer lugar). Se é verdade que, para os carteiros, as quadras “introspectivas” são verdadeiro pesadelo, pelo caráter labiríntico da configuração viária interna e pela falta de referências visíveis da cidade maior que as cerca, é também verdade que ela não desgosta boa parte da população que as habita. Há muito o seu caráter condominial semi-fechado faz parte dos valores de grande parcela das populações urbanas, no Brasil e alhures, particularmente relacionados a classes médias e altas – mas que, lamentavelmente, tende a se generalizar. O texto analisa essa dinâmica e coloca o projeto de Palmas no contexto maior das discussões acerca da configuração dos espaços públicos nas cidades contemporâneas.'
  keywords:
  - Palmas
  - configuração urbana
  - guetos urbanos
  abstract_en: 'In Palmas, the new capital designed for the State of Tocantins, Brazil, people tell as a truth story the following. When a small child and his father came to the city from the provinces of the State, after having observed carefully the townscape, he asked: “Dad, why does this city has so many graveyards?” As in the story of the naked king, the child has perceived something that the professional corporation does not seem to have perceived so far. Or, if they have, they consider what they are making as something of good quality. They seem not to be aware of the bad effects of their actions for the urban spaces they design. Palmas is constituted by large “introspective” superblocks, designed by well-known Brazilian architects or otherwise. The buildings open to the interior of the superblocks. Only the back blank walls of the houses face the urban areas of the external surroundings and the main avenues. The exception to this are the small number of entrances for the interior of the superblocks – usually 2, sometimes 3. “Graveyards”, therefore, in the intelligent perception of the child. Palmas was designed quickly in 1988 and implemented from 1989 onwards. It rescues many of the typical aspects of the modern urban design but it also presents specificities that deserve careful attention. (It is a great injustice to Brasilia, the National Capital, to compare Palmas with the former.) The text reflects about the specificities, particularly as the “modernity” in Palmas is being subverted, thus re-qualified, in some superblocks where lower income families predominate. One of the most important morphological changes is the “extrospection” of some blocks – they have their external blank walls perforated by apertures (doors, windows) in buildings of varied types, particularly of commercial and services uses, which now open to the main avenues. This is a clear example of two contradictory logics coexisting in the same city (as it happens more often than not in other cities). It is true that, for postmen, the “introspective” superblocks are a true nightmare, because of the labyrinthine character of their street system and the lack of visual references towards the external urban spaces that surround them. But it is also true that they do not displease a good part of the people that inhabit them. It has been some time now that the semi-enclosed, gated-condominium-like configuration of such places, is part of the values of much of the urban populations in Brazil and elsewhere, particularly when high middle-classes (but not only that) are concerned – the trend tends to generalize. The text analyses this dynamic and considers the Palmas project in the wider context of the discussions about the configuration of public spaces in contemporary cities.'
