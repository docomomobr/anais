- id: 'sdbr07-050'
  title: Considerações sobre o debate dos conjuntos residenciais modernos e as questões de conservação e reabilitação
  authors:
  - givenname: Sálua
    familyname: Kairuz Manoel
    email: null
    affiliation: null
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  section: Residência
  abstract: |-
    O presente trabalho tem como finalidade apresentar as discussões correntes sobre os conjuntos habitacionais modernos e as questões enfrentadas atualmente pelo poder público e pela iniciativa privada para a reabilitação e conservação de áreas residenciais.
    As experiências mais conhecidas e difundidas no Brasil sobre áreas habitacionais dizem respeito principalmente à recuperação e requalificação de áreas centrais, como é o caso, entre outros, do Corredor Cultural no Rio de Janeiro, do Pelourinho em Salvador, ou do projeto Viva o Centro, em São Paulo. Outro exemplo emblemático de preservação de grandes áreas residências é o caso do Plano Piloto de Brasília, considerada como Patrimônio Cultural da Humanidade, que se destaca da discussão proposta neste trabalho por se tratar de uma cidade inteira preservada que desde sua concepção é acompanhada de uma legislação rígida que tem por intuito engessar qualquer modificação nos projetos das "superquadras" e edificações previstas.
    Pouco se tem estudado sobre a produção habitacional de caráter modernista promovida pelo poder público no Brasil, portanto, pouco se tem discutido sobre formas de conservação desses sítios, que um dia constituíram as periferias de grandes centros urbanos e hoje, em sua grande maioria, fazem parte da malha urbana consolidada.
    O mapeamento e sistematização da documentação referente aos conjuntos habitacionais promovidos pelo poder público coletada pela pesquisa "Habitação Econômica e Arquitetura Moderna no Brasil (1930-1964)" coordenada pelo Prof. Dr. Nabil Bonduki, no que se refere à promoção pública da moradia econômica, é um importante documento revelador da abragência e importância dessa produção em território nacional. As visitas aos conjuntos, contudo, também revelaram um caráter desolador das condições atuais desses sítios e principalmente as dificuldades de manutenção das áreas comuns por parte dos moradores atuais. Poucas experiências foram encontradas no sentido de se recuperar e conservar características originais desses grandes conjuntos, como é o caso da Vila IAPI de Porto Alegre, objeto de um minucioso estudo coordenado pelo escritório de arquitetura Carlos Maximiliano Fayet, "Vila do IAPI: Patrimônio Cultural da Cidade", que tem o intuito de dar subsídios para um projeto de lei municipal de preservação do sítio.
    Em vista da escassez de discussão sobre o assunto no Brasil, a proposta desse trabalho é buscar na literatura internacional exemplos de enfrentamento dos problemas de preservação de sítios habitacionais modernos, que dêem subsídios para estudos de casos brasileiros. Alguns exemplos dessa tentativa são os trabalhos de investigação dos Quartieri produzidos pelo INA-Casa na Itália, e os módulos de unidades de vizinhança na Holanda e em países em desenvolvimento, pesquisada pelo projeto temático The New Town, em Rotterdam, entre outros.
    Embora a discussão em torno da preservação e reabilitação de áreas residências envolva características peculiares a cada sítio, e a produção brasileira tenha um caráter bastante heterogêneo, com influências dos princípios do CIAM, da arquitetura e urbanismo de Le Corbusier, do movimento Cidade Jardim e mesmo do urbanismo formal, as metodologias de análise e as políticas propostas para outras realidades podem, sem prejuízo, servirem de norte para o desenvolvimento de estudos e propostas pertinentes a nossa realidade, assim como os próprios princípios de arquitetura moderna o foram em outro momento de nossa história.
    Neste sentido, o presente trabalho pretende apresentar essa discussão sobre a seleção e preservação de sítios históricos modernos residenciais num âmbito mais generalista, sem perder de vista nossa realidade política e econômica e as expectativas e necessidades para a cidade brasileira do século XXI.
  keywords:
  - arquitetura moderna
  - conjuntos habitacionais
  - preservação de sítios residências
  abstract_en: 'The present work has as purpose to present the current discussion about the modern housing and the subjects faced now by the Brazilian government and by the private initiative for the rehabilitation and conservation of residential areas. The most known experiences in Brazil on residential areas concern, mainly, the recuperation and rehabilitation of central areas, like the Corredor Cultural in Rio de Janeiro, the Pelourinho in Salvador, or the project Viva o Centro, in Sao Paulo. Another emblematic example of preservation of huge residential areas is the Plano Piloto of Brasília, considered as Cultural Patrimony of the Humanity, that stands out of the discussion proposed in this work by treating of a whole preserved city that since its conception is accompanied by a rigid legislation that has for intention to prevent any modification in the projects of the superquadras and others predicted constructions. Little have being studied about the residential production of modernist character promoted by the government in Brazil, therefore, little have been discussed on ways of conservation of those sites, that one day constituted the suburbs of great urban centers and today, in the majority, are part of the consolidated urban net. The mapping and organization of the documentation regarding the housing promoted by the government collected by the research "Economical House and Modern Architecture in Brazil (1930-1964)" coordinated by Phd. Nabil Bonduki, in what it refers to the public promotion of the economical home, is an important document that shows the range and importance of that production in national territory. The visits to these residential areas, however, also revealed the decadent character of the current conditions of those sites and mainly the difficulties of maintenance of the common areas by the current residents. Few experiences were found where the main goals were to recover and to conserve originals characteristics of those great groups, like the case of the Vila IAPI of Porto Alegre, object of a meticulous study coordinated by Carlos Maximiliano Fayet''s architecture office, " Vila do IAPI: Patrimônio Cultural da Cidade ", that has the intention of giving subsidies for a municipal bill for the preservation of the site. As this subject is very little discussed in Brazil, the proposal of this paper is to look for in the international literature examples of the preservation problems of modern housing sites that could give subsidies for studies of Brazilian cases. Some examples of that attempt are the works of investigation of the Quartieri, produced by the INA-Casa in Italy, and the modules of neighborhood’s unit in Holland and countries in development, researched by the thematic project The New Town, in Rotterdam, among others. Although the discussion around the preservation and rehabilitation of residential areas involves peculiar characteristics in each site, and the Brazilian production has a quite heterogeneous character, with influences of the principles of CIAM, of the architecture and urbanization of Le Corbusier, of the movement Garden Cities and even of the formal urbanization, the methodological analysis and the politics proposed for other realities can be seen as a reference, without damage, for the development of studies and pertinent proposals for our reality, as the principles of modern architecture had being in another moment of our history. In this way, the present work intends to present that discussion about the selection and preservation of modern historical residences sites in an ambit more generalist, in conjunction with our political and economical reality and the expectations and needs for the Brazilian cities of the XXI century.'
