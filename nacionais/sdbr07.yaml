- id: 'sdbr07-001'
  title: A praça do maquis
  authors:
  - givenname: Andrey Rosenthal
    familyname: Schlee
    email: 'andreysc@terra.com.br'
    affiliation: null
    orcid: '0000-0003-1190-4534'
    bio: null
    country: BR
    primary_contact: false
  - givenname: Lila
    familyname: Donato
    email: null
    affiliation: null
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  section: Praça e Palácio
  abstract: 'Em 1957, Lucio Costa venceu o concurso do Plano Piloto da nova capital do Brasil. Em seu Relatório explicou como, apoiado na ordenação e no senso de conveniência, garantiu ao conjunto projetado o “desejável caráter monumental”; explicou também a concepção da Praça dos Três Poderes e sua importância para a construção da civitas como um espaço público igualmente “consciente daquilo que vale e significa”. Já nos primeiros croquis do arquiteto para o Plano Piloto a configuração espacial da Praça dos Três Poderes aparece claramente esboçada; contudo, em função dos aterros feitos para acomodar a implantação dos edifícios do Congresso Nacional, do Supremo Tribunal Federal e do Palácio do Planalto, foi necessário introduzir algumas alterações no projeto original, o que resultou na perda da apreensão de sua planta triangular -- que, mesmo assim, mostrou-se apropriada para as funções previstas. Logo, já no período de implantação da cidade, seu desenho original começou a ser modificado, ganhando novos contornos e dimensões: em 1960, a Praça estava quase pronta, elevada e aberta em relação ao cerrado circundante, como que dialogando com a natureza (fora desenhada na melhor tradição, como suas precedentes hierarquicamente diretas: a Praça do Comércio -- de Lisboa, a Praça do Governador -- de Salvador, a Praça XV -- do Rio de Janeiro), no entanto, como peça fundamental da estrutura representativa da capital federal moderna, não foi entendida; e, como monumento, não foi respeitada. Com o passar dos anos, foi ganhando adereços: em 1969, a concepção original foi desrespeita, com a construção do Mastro da Bandeira Nacional, de Sérgio Bernardes; já em 1985, Oscar Niemeyer desenhara o Panteão que, tal qual o “bandeirão, foi um erro; por fim, as perspectivas da Praça foram comprometidas. Niemeyer projetou o anexo II do Supremo Tribunal Federal (1990) e a Sede da Procuradoria Geral da República (1995-02). Os novos edifícios – ambos espelhados e curvos – contrastam em todos os sentidos com a primeira arquitetura da cidade, a da arquitetura da Praça. Enquanto o Plano Piloto de Brasília completa em 2007 cinqüenta anos; e a data sugere reflexão. O Docomomo sugere cautela. Sabemos que, nos dias de hoje, cada vez mais, projetar é atuar no pré-existente. Mas o que estamos fazendo com o nosso patrimônio moderno?'
  abstract_en: 'In 1957, Lucio Costa won the Pilot Plan concurrence for the new Brazilian capital. In his report, he explained how, supported on ordering and convenience sense, he assured the projected set to have the “desired monumental feature”. He also explained the Conception of the Três Poderes Square and its importance for the construction of the civitas. A public space equally “conscious of what it means and is worth of”. The spatial configuration of the Três Poderes Square already appears clearly sketched in the first Lucio Costa’s layouts for the Pilot Plan construction. However, in function of landfills performed to receive the National Congress, Supreme Court and Palácio do Planalto buildings, it was necessary to make some alterations in the original projects, what resulted in loss of the apprehension of its triangle plant. Nevertheless, it seemed to be adequate to fulfill its functions. Thus, during the period that the city was constructed, its original project started being modified, resulting in new contours and dimensions. In 1960, the Square was almost ready, raised and opened in relation to the surrounding savannah, as if dialoguing with nature. In other words, it was projected at the best tradition, as its direct hierarchical precedents: the Commerce Square (Lisbon), the Governor Square (Salvador, Brazil) and the XV Square (Rio de Janeiro). However, the Square – fundamental part of the representative structure of the modern federal capital – was not understood. And as a monument, it was not respected. As years went by, the square was progressively decorated. However, in 1969, the original conception was in fact disrespected with the construction of the National Flagstaff of Sérgio Bernardes. In 1985, Oscar Niemeyer outlined the Pantheon. It was a mistake, as the “bandeirão”. Finally, the Square perspectives were mistaken. Niemeyer projected the annex II of the Supreme Court (1990) and the Brazilian Office of the Solicitor General (1995-02). The new buildings – both mirrored and curve – contrast in all aspects with the first architecture of the city: the Square architecture. The year of 2007 is the fifty-year anniversary of the Brasilia Pilot Plan. The date suggests reflection. The Docomomo suggests caution. Everyone knows that, nowadays, to project is more and more to act on what pre-exists. What have we done to our modern inheritance?'
