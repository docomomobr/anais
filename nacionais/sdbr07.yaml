- id: 'sdbr07-006'
  title: Peter Scheier
  subtitle: visões urbanas de um fotógrafo moderno na América
  authors:
  - givenname: Anat
    familyname: Falbel
    email: 'falbel@exemplo.com'
    affiliation: null
    orcid: '0009-0009-3934-9537'
    bio: null
    country: BR
    primary_contact: false
  section: Cultura e Educação
  abstract: 'Conforme mostram os levantamentos e a reavaliação dos acervos e depoimentos deixados pelos fotógrafos atuantes especialmente entre os anos de 1930 e 1960, foi a partir das primeiras décadas do século 20 que as relações entre a arquitetura moderna e a fotografia se fizeram tão imbricadas que esta acabou por transformar-se em um paradigma da representação da modernidade arquitetônica. Mais que uma simples documentação a serviço da história da arquitetura e do ambiente construído, a fotografia tornou-se parte do discurso e o instrumento pelo qual os arquitetos modernos comunicaram as suas idéias sobre a arquitetura e a cidade. Essa simbiose identificada na América do Norte entre fotógrafos e arquitetos modernos como Julius Schulman e Richard Neutra, ou o fotógrafo Ezra Stoller e seus arquitetos comitentes pode ser encontrada no Brasil entre o fotógrafo francês Marcel Gautherot e o arquiteto Oscar Niemeyer. Em São Paulo, profissionais da arquitetura como Rino Levi e Gregori Warchavchik - ele mesmo um apaixonado pela fotografia e retratista sensível -, já reconheciam a importância da imagem como mediadora do objeto arquitetônico controlando a sua produção e reprodução. A partir do trabalho de recuperação e identificação de um conjunto de mais de vinte mil negativos desenvolvido junto ao acervo do fotógrafo imigrante Peter Scheier (1908-1979). O presente artigo pretende lançar algumas hipóteses para uma reflexão sobre as relações que uniram fotógrafos e arquitetos modernos no Brasil desde a primeira metade do século 20. Para tanto utilizaremos uma série de imagens produzidas por Peter Scheier ao longo das décadas de 1940 e 1950 nas cidades de São Paulo, Rio de Janeiro e Brasília, buscando interpretá-las no contexto da formação do fotógrafo e sua adesão à modernidade e ao projeto moderno.'
  keywords:
  - fotografia
  - arquitetura
  - movimento moderno
  - documentação
  abstract_en: 'According to the research and reassessment of photographic archives as well as the testimony given by photographers who worked mainly between the 30s and the 60s, it was in the first decades of the 20th century that the relation between modern architecture and photography became so intricate that the latter became a paradigm of representation for the architectural modernity. More than just documentation to serve architecture history and the built environment, the photographic image has become part of the discourse and the tool through which the modern architects and architecture historians would communicate their ideas about architecture and the city. This symbiosis identified in North America between photographers and modern architects such as Julius Shulman and Richard Neutra or Ezra Stoller and his clients may be found in Brazil between the French photographer Marcel Gautherot and the architect Oscar Niemeyer. In the city of Sao Paulo, professionals of architecture such as Rino Levi and Gregori Warchavchik – the latter being also a sensible photographer -, already recognized the importance of the image as a mediator of the architectural subject, controlling its production and reproduction. Taking from a variety of images chosen from the Peter Scheier archive, images that were produced by the immigrant photographer Peter Scheier (1908-1979) along the 40s and the 50s in the cities of Sao Paulo, Rio de Janeiro and Brasilia, and New York the present article intends to display some hypothesis for an analysis of the deep relation that brought together photographers and modern architects in Brazil, starting in the first half of the 20th century.'
  keywords_en:
  - photography
  - architecture
  - modern movement documentation
