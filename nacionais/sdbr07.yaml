  - 'HEGEL, Friedrich. Estética: o belo artístico ou o ideal. São Paulo: Nova Cultural, 1999. (Coleção Pensadores).'
  - 'LE GOFF, Jacques. História e Memória. 2.ed. Campinas: UNICAMP, 1992.'
