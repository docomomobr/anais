- id: 'sdbr07-059'
  title: Os novos apartamentos velhos
  authors:
  - givenname: Marta Silveira
    familyname: Peixoto
    email: 'marta@martapeixoto.com.br'
    affiliation: null
    orcid: '0000-0002-2213-7740'
    bio: null
    country: BR
    primary_contact: false
  section: Palácio e Residência
  abstract: 'OS NOVOS APARTAMENTOS VELHOS O edifício Armênia, do arquiteto Ari Canarim, foi projetado em 1955. Nesta época eram construídos os primeiros edifícios residenciais modernos em Porto Alegre, no centro da cidade ou perto dele. Moderno, neste caso, são edifícios altos, de estrutura independente de concreto armado, revestimento de pastilhas e grandes panos de vidro. O Armênia tem 14 andares tipo com dois apartamentos diferentes em cada, de 130m2, aproximadamente, distribuídos entre sala de estar, sala de jantar, três dormitórios, um banheiro social, lavanderia, dormitório e banheiro de serviço, numa planta que pode ser considerada compartimentada. Os primeiros moradores eram gente de dinheiro do interior, na sua maioria, que usava o apartamento como uma base para visitas esporádicas à capital. Hoje, passados mais de 50 anos, o edifício ainda mantém poucos moradores originais, mas naquelas três unidades em que houve mudança de proprietário mais recententemente é possível notar algumas algumas coincidências. Dois deles foram comprados por arquitetos. Dos três, um é habitato por uma pesssoa solteira; outro por um casal sem filhos e o terceiro por uma mãe com dois filhos intinerantes, típicos das separações contemporâneas. A média, então, é de dois moradores por apartamento, ou seja, 65m2/pessoa. Este não é um fenômeno restrito ao Armênia, exclusivamente; alguns dos edifícios do centro e arredores da cidade estão sofrendo uma injeção de sangue novo. E de um mesmo grupo sanguíneo, pois se é verdade que vários destes edifícios têm alguma característica especial, como o Sulacap, o Santa Cruz, o Armênia, o Linck e o Santa Tecla, também é preciso ter alguma educação ou sensibilidade especiais para perceber as prováveis vantagens de morar em um velho apartamento, onde é difícil dispor de vagas de garagem, onde o encamento e a fiação estão envelhecidos, além do desagaste geral da idade. Mas existem as compensações, como a relação custo x benefício, no que se refere à área privativa; o ponto, geralmente central, em zonas que hoje são mistas, e oferecem tanto comércio quanto serviços; a segurança de áreas movimentadas associada ao conforto de portarias 24hs; a claridade dos panos de vidro e belas vistas, possíveis em edifícios mais altos, ainda mais se no topo dos morros da cidade como é boa parte do centro, da Independêcia e do Moinhos de Vento. Isto tudo suportado pelo concreto armado, o quê possibilita as necessárias adaptações de programa. O único limite é o envelope externo.'
  keywords:
  - 'Arquitetura moderna brasileira-edifícios residenciais Edifícios reciclados'
  abstract_en: |-
    The building Armenia, from the architect Ari Canarim, was designed in 1955. At the time the first modern residential buildings in Porto Alegre were being built, located downtown of nearby. Modern, in that case, are tall buildings, of independent structure of concrete, covered with with pastilles and big glass plans.
    The Armenia has 14 floors with two different apartments in each, of 130 square meters, approximately, distributed in living room, dining room, three bedrooms, a bathroom, laundry, service bedroom and bathroom, in a plant that can be considered compartmentalized.
    The first inhabitants were rich people from the countryside, mostly, that used the apartment as a base for sporadic visits to the capital.
    Today, more than 50 years have passed, the building still has few original inhabitants, but in those three units that had recentry changed the owners it is possible to notice some coincidences. Two of them were bought by architects. Of the three, one is occupied by a single person; the other one by a couple without children and the third one by a mother with two itinerant children, typical of the contemporary divorces. The average, then, is of two inhabitants by apartment, which means, 65 square meters per person.
    This it is not a phenomenon restricted to the Armenia, exclusively; some of the buildings located downtown and on the outskirts of the city are receiving an injection of new blood. And from the same blood type, because if it is true that several of these buildings have some special characteristic, such as the Sulacap, the Santa Cruz, the Armênia, the Linck and the Santa Tecla, it is also necessary to have some special education or sensibility for perceiving the probable advantages of living in an old apartment, where it is difficult to arrange parking spaces, where the plumbing and the spinning are aged, besides the general corrosion of age.
    But there are the compensations, like the cost x benefit relation, when it comes to the private area; the location, usually central, in areas that today are mixed, and offer commerce as much as service; the security of busy areas associated to the comfort of entrances that are protected 24 hours a day; the brightness of the glass plans and beautiful views, which are possible in higher buildings, even more if they are on top of the city hills, which correspond to a great part of the central area, on Independêcia Street and in Moinhos de Vento. All that supported by the armed concrete, which enables the necessary adaptations of program. The only limit is the external envelope.
