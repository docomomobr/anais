- id: 'sdbr07-058'
  title: Inconstantes cidades inversitárias
  subtitle: um estudo da Universidade de Brasília
  authors:
  - givenname: Klaus Chaves
    familyname: Alberto
    email: 'klauschavesalberto@gmail.com'
    affiliation: null
    orcid: '0000-0003-2845-8307'
    bio: null
    country: BR
    primary_contact: false
  section: Cultura e Educação
  abstract: |-
    As cidades universitárias no Brasil sofrem constantes revisões em seus projetos iniciais em função tanto da sua dinâmica educacional e política quanto tecnológica. Neste sentido, estes equipamentos tornam-se fontes importantes para estudos de requalificação no âmbito da arquitetura e do urbanismo.
    Este artigo tem por objetivo analisar o caso exemplar de campus universitário no Brasil: a Universidade de Brasília - UnB. Esta universidade, como se sabe, surge em paralelo à criação de Brasília com o ideal de se construir uma nova universidade modelo para o país e para a América Latina. De forma semelhante aos grandes projetos para cidades universitárias no Brasil, o projeto para a UnB passou pela mão de arquitetos modernistas e, nesta empreitada, encontramos Lúcio Costa em um primeiro momento e Oscar Niemeyer no desenvolvimento do projeto definitivo. No campo da educação, um dos principais mentores foi o já experiente Anísio Teixeira que havia criado, em 1935, a Universidade do Distrito Federal – instituição paradigmática fechada pelo Ministro Capanema em 1939 por motivos políticos. Outro importante ator nesta área foi Darcy Ribeiro, assumindo a linha de frente dos debates e da formalização da idéia. Ele ainda se destaca pelo empenho em reunir, com o apoio da Sociedade Brasileira para o Progresso da Ciência (SBPC), a comunidade científica do País em torno do projeto da nova universidade.
    Desta forma a Unb destaca-se pela escala do empreendimento, pelos atores e os debates desenvolvidos nos campos da ciência e da educação, da arquitetura e do urbanismo e o conseqüente desejo de se fazer o melhor em todos os campos envolvidos nesta empreitada.
    Desde sua formatação original feita por Lúcio Costa (1962), a cidade universitária sofreu diversas revisões. Ainda na etapa de projeto, em 1964, Niemeyer assumiu a responsabilidade pela definição do Instituto Central de Ciências e pela Praça Maior, o que praticamente redefiniu o caráter do campus. Posteriormente, quando partes significativas de seu corpo já estavam construídas, continuou sofrendo alterações que ora comprometem e ora ratificam a proposta inicial - em resumo podemos destacar as seguintes intervenções: Proposta do CEPLAN – Centro de Planejamento, em 1969; Proposta de Zoneamento, em 1970; Proposta de eixos de expansão, em 1971; Proposta de eixos de Vivência, em 1987/88.
    Uma análise destas intervenções, sempre tendo como base o plano inicial visto sob o duplo aspecto arquitetônico e educacional, contribui para o entendimento da dinâmica própria das cidades universitárias brasileiras.
    Vale ainda ressaltar que a Universidade de Brasília, além de ser uma icônica reflexão sobre as universidades precedentes, tornou-se uma forte referência nas décadas seguintes no campo projetual e mesmo no campo educacional. Sua requalificação não ocorre apenas no campo arquitetônico e urbanístico, é o reflexo de mudanças no campo educacional e político tornando a análise da representação arquitetônica mais complexa e instigante.
  keywords:
  - Arquitetura
  - Educação
  - Cidade Universitária
  abstract_en: |-
    University cities in Brazil have been subject to frequent revisions on their original projects, largely because of changes in related fields such as education, politics, and technology. On this sense, university cities are important sources for studies of readjustment in the scope of architecture and urbanism.
    The objective of this article is to analyze the exemplary case of a university campus in Brazil: the University of Brasilia - UnB. That university develops in parallel to the creation of Brasilia with the ideal of building a new model university for the country and Latin America. Similarly to the creation of other big university cities in Brazil, modernistic architects were involved. At first, Lúcio Costa worked on UnB's project and, latter, Oscar Niemeyer developed the final project. In the educational field, Anísio Teixeira was one of the main mentors. He had a large previous experience and had been involved in the creation of the University of the Federal District. That was a paradigmatic university, it was closed by the Education Minister, Gustavo Capanema, in 1939 for political reasons. Another important actor in this area was Darcy Ribeiro, who led the debates about the importance of building UnB and he was successful in getting the support of the Brazilian scientific community and the Brazilian Society for the Development of Science (SBPC) for his project.
    UnB's project gained importance for the scale of this enterprise, the actors involved, and the debates developed in the fields of science, education, architecture, and urbanism. It was clear a strong commitment to do the best in all fields related to this task.
    Since its original form designed by Lúcio Costa (1962), the university city suffered several revisions. Still in the stage of a project, in 1964, Niemeyer assumed the responsibility for the definition of the Central Institute of Sciences and for the Main Square, what practically redefined the campus' character. Later, even when significant UnB's parts had already been constructed, it continued suffering changes. Those changes sometimes compromised and sometimes ratified the initial proposal. In summary we can highlight the following interventions: Proposal for the CEPLAN - Center of Planning, in 1969; Proposal of Zoning, in 1970; Proposal of expansion axles, in 1971; Proposal of axles of Experience, in 1987/88.
    The study of these interventions on the initial project, under the educational and architectonic focus, contributes to the understanding of the dynamics proper to Brazilian university cities.
    It is worth to note that University of Brasilia, besides being an emblematic reflection about preceding universities, it became a major reference in project and education in the following decades. Its readjustments have not happened only in architectonic and urbanistic fields, they are consequences of changes in the educational and political fields, making the analysis of architectural representation more complex and exciting.
