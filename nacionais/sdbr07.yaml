  section: Praça e Palácio
  abstract: 'Construído na Praça da Matriz, entre 1953 e 1968, o Palácio da Justiça de Porto Alegre, projeto de Luis Fernando Corona e Carlos Maximiliano Fayet, foi uma das mais importantes obras da arquitetura contemporânea brasileira realizadas no Estado. Todavia, o longo processo de construção e a escassez de recursos alteraram o projeto original, suprimindo diversos elementos importantes para o caráter de Palácio e para o próprio conforto de seus ocupantes. Além disso, ao longo dos anos, várias alterações e deformações ocorreram pelo uso cotidiano e pela falta de critérios de ocupação. Alterações essas que descaracterizaram e até suprimiram espaços importantes do edifício, como o do restaurante no último andar. Cinqüenta anos após o Concurso Publico Nacional de Anteprojetos realizado em 1952 que escolheu o projeto do Palácio da Justiça, o co-autor remanescente, Carlos M. Fayet, foi contratado pelo Tribunal de Justiça do Estado para recuperar, restaurar e readequar o prédio às necessidades atuais da Justiça. O objetivo deste artigo, feito por integrantes da equipe de projeto e fiscalização da recuperação do Palácio da Justiça, é realizar um relato das etapas, critérios e escolhas que nortearam os trabalhos de 2002 a 2006 que, além de recuperar o prédio, completou o projeto original cinqüenta e três anos após sua concepção. Entre as referências utilizadas estão o Projeto Original do Concurso de 1952, o Projeto Executivo das décadas de 1950 e 1960, o Projeto Executivo da Recuperação de 2002 a 2006, os contratos de execução da obra original e da recuperação, amplo levantamento fotográfico do período da construção e da recuperação, cadernos da obra, trabalhos acadêmicos sobre o prédio, diversas obras que serviram como referenciais teóricos dos co-autores, dentre os quais o Realismo Socialista e registros diversos incluindo entrevistas com o arq. Carlos M. Fayet, que permitirão analisar a contradição entre o existente e o proposto. Mesmo que controlada pela interferência direta do co-autor original no projeto, surgem as diferenças entre o arquiteto de 22 anos, com forte influência da escola moderna carioca e de Le Corbusier, e o arquiteto maduro de 72 anos.'
  keywords:
  - Arquitetura Moderna
  - Restauração
  - Palácio da Justiça
  abstract_en: 'Built in the Praça da Matriz, between 1953 and 1968, the Palácio da Justiça de Porto Alegre, project by Luis Fernando Corona and Carlos Maximiliano Fayet, is one of the most important buildings of contemporary Brazilian architecture in the State. However, the long construction process and the scarcity of resources had modified the original project, suppressing several important elements for the character of the Palace and the proper comfort of its occupants. Moreover, throughout the years, some alterations and deformations had been made due to daily use and due to lack of occupation criteria. These alterations have changed the characteristics and also have suppressed important spaces of the building, as the restaurant located on the last floor. Fifty years after the Competition, in 1952, the remaining co-author, Carlos M. Fayet, was hired by the Tribunal de Justiça do Estado do RS to rehabilit the building to the current Justice. The goal of this work, prepared by integrants of the Palácio da Justiça rehabilitation crew, is to present the stages, criteria and choices that have guided the works of rehabilitation, restoring and completing the original project fifty-three years after its conception. References include the 1952 Original Project of the Competition, the Executive Project of the 1950 and 1960 decades, the 2002-2006 Executive Project of the Rehabilitation, original building and rehabilitation contracts of execution, ample photographic survey from the construction and rehabilitation periods, academic projets about the building, and several historical records including interviews with architect Carlos M. Fayet, that allow us to analyze the contradictions between the current building and the conceived one. Although these contraditions in the project are limited due to direct interference of the original co-author, differences appear from the 22 year old architect, strongly influenced by the modern Carioca school and the Le Corbusier, to the mature 72 year old architect.'
