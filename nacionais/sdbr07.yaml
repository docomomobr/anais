- id: 'sdbr07-012'
  title: O Trapiche à beira da Baía
  subtitle: a restauração do Unhão por Lina Bo Bardi
  authors:
  - givenname: Carla Brandão
    familyname: Zollinger
    email: 'zollinger@exemplo.com'
    affiliation: null
    orcid: '0000-0001-5945-5390'
    bio: null
    country: BR
    primary_contact: false
  section: Cultura e Educação
  abstract: |-
    Lina Bo Bardi referia-se ao Conjunto do Unhão como «Trapiche Unhão». O seu deslumbramento por aquele edifício em ruínas situado à beira-mar, às margens da Baía de Todos os Santos, data de antes da fundação do Museu de Arte Moderna da Bahia que, posteriormente, após a restauração dirigida por Lina, se instalaria no Conjunto reciclado.
    Nas suas viagens à Bahia em 1959, Lina Bo Bardi empenhou-se em um projeto pessoal: a recuperação do Conjunto do Unhão em ruínas. Foi nessa ocasião que ela recebeu o convite para fundar e dirigir o Museu de Arte Moderna da Bahia. Dois anos depois, ela conseguiria do governador do estado baiano a desapropriação e compra do Conjunto do Unhão para instalar nele o museu e para abrigar um ambicioso projeto que ela desenhou entre 1960 e 1964, durante os anos em que viveu na Bahia: construir no entorno do Unhão o Museu de Arte Popular e a Universidade Popular.
    O trabalho de Lina Bo Bardi com o complexo, engenho ou trapiche do Unhão se convertiria em uma obra de restauração ímpar que até hoje continua influenciando o campo da rearquitetura. Lina Bo Bardi introduziu elementos transformadores que reciclaram o edifício original, traduzindo-se numa intervenção moderna e inovadora.
    O projeto de Lina Bo Bardi foi ambivalente, sem negar o edifício original, ela o reinventou, descobrindo novas analogias na construção, com o mar, com as fortalezas portuguesas e com a herança industrial, e introduzindo elementos como a escada helicoidal de madeira e as janelas pintadas de vermelho, que tiveram a força de transformar o edifício e o lugar e continuar até hoje como referências da arquitetura contemporânea.
  keywords:
  - Restauração
  - moderno
  - popular
  - museu
  abstract_en: |-
    "Trapiche Unhão", that's the way how Lina Bo Bardi mentioned the Conjunto do Unhão. Her interest for that building in ruins at sea side, on the Bay of Todos os Santos, precedes the foundation of the Museum of Modern Art of Bahia, that later, after the restoration directed by Lina Bo Bardi, would be installed in the recycled building.
    Travelling to Bahia in 1959, Lina Bo Bardi pledged herself in a personal project: the recovery of the Conjunto do Unhão in ruins. It was in this occasion that she received the invitation to establish and to direct the Museum of Modern Art of the Bahia. Two years later, she would obtain of the governor of Bahia the offer of the Conjunto do Unhão to install in it the museum and to shelter an ambitious project that she designed between 1960 and 1964: to construct in the site of Unhão a Museum of Popular Art and a Popular University.
    The work of Lina Bo Bardi with the Trapiche of Unhão would become a master-piece of restoration that until today continues influencing the field of the re-architecture. Lina Bo Bardi introduced transforming elements that recycled the original building, producing a modern and innovative intervention.
    The project by Lina Bo Bardi was ambivalent, without denying the original building, she reinvented it, discovering new analogies in the construction, with the sea, the Portuguese fortifications and the industrial inheritance, introducing elements as the stairs and windows in red, that had the power to transform the building and to continue until today as references of contemporary architecture.
  keywords_en:
  - Restauration
  - modern
  - popular
  - museum
