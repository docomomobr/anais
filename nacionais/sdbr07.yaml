  section: 'Paisagem, Transporte e Mercado'
  abstract: 'A Reciclagem da Estação Ferroviária de Brasília A Estação Ferroviária de Brasília (EFB) foi construída na década de 70 pela empresa Soares Leone S.A. segundo o traço original de Oscar Niemeyer. Sua localização pré-estabelecida no projeto do Plano Piloto de Brasília, de Lucio Costa. Esta proposta prevê o restauro da edificação, parte de um processo histórico buscando compreender a construção moderna em seu período transitório, agressivamente modificada e necessitando da reformulação do seu espaço original. Ou seja: restaurar a condição espacial perdida, a ser atualizada com as adequações programáticas e tecnológicas da contemporaneidade. Assim a reflexão arquitetônica sobre a obra já concebida é tida como ação de caráter sócio-econômico, político e cultural, pois engloba fatores que influenciaram e motivaram a sua construção desde aquele tempo até os dias atuais. Com isso o projeto de restauro e intervenção redefinirá de maneira respeitosa a qualidade da obra deturpada pelo tempo e pelas tomadas de decisões que deformaram a edificação. Esta, deixada ao acaso das intervenções adaptadas a funções para as quais não se prestava. A EFB desvirtuada exemplarmente para fim análogo – o de rodoferroviária – oferece um caso sui generis para o exercício simulado do restauro de obra moderna. A intervenção no processo de reciclagem da EFB trata da atitude consciente face a uma obra relevante, de reconhecido valor arquitetural, cujo potencial da edificação permite o reaproveitamento para fins objetivos, com ganhos sócio-culturais e econômicos previsíveis; a começar pela ação de impedir o avanço da condição degradante. Portanto, é sugerido neste trabalho final de graduação, a relação entre a intervenção nova nessa existência construída também restaurada, como exposição do seu reuso adaptável.'
