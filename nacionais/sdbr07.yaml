- id: 'sdbr07-066'
  title: Difusão da Arquitetura Moderna Brasileira
  subtitle: 'o caso do plano de ação do governo do Estado de São Paulo (1959-1963)'
  authors:
  - givenname: Miguel Antônio
    familyname: Buzzar
    email: 'm.buzzar@sc.usp.br'
    affiliation: null
    orcid: '0000-0001-6251-0338'
