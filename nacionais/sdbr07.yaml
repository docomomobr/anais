  abstract: 'Museu das Missões (1937) e Casa do Benim (1987) tem em comum mais que o programa expositivo acomodado com reciclagem de matéria antiga. Projetos do Lucio carioca em terra sulista e da Lina paulistana no nordeste, seu exotismo face ao eixo Rio- São Paulo inclui a evocação de cultura índia ou afro. Suas partes não se confundem, a datação diversa enfatizada como persistência do passado no presente. Com base na Carta Italiana do Restauro (1932), seu heteromorfismo é moderno porque produto e retrato da consciência simultânea de muitas épocas, característica duma época intrinsecamente diferente. Desvalorizando a unidade estilística e preconizando a conservação de todas as fases que definiram um monumento, a Carta se opõe à expressão unívoca do espírito da época, cuidado confesso da vanguarda arquitetônica na década anterior.1 Substitui a idéia de tempo linear e universal pela de espaçotempo híbrido, já explorada pela vanguarda literária até no Brasil.2 O Museu é manifestação precursora desse heteromorfismo moderno. A Casa assinala o momento em que vira normal porque a reciclagem ganha ímpeto no país. De permeio, outras realizações de qualidade o referendam: os demais projetos de Lina em Salvador e seu SESCPompéia além de projetos de Alcides Rocha Miranda no Rio de Janeiro4. O trabalho proposto pretende revisar os projetos mencionados dentro desse marco de simultaneidade, que intermedia valores do passado local (o material pré-existente) e do presente universal (a arquitetura moderna). Serão consideradas, de um lado, as estratégias de composição literária e artística do entre-guerras, tanto as comentadas por Mário de Andrade em seus textos como a collage e a assemblage. De outro, os exemplos de heteromorfismo moderno na Europa e nos Estados Unidos pós-45, em particular as intervenções no patrimônio arquitetônico italiano de Scarpa, da firma BBPR e de Franco Albini, compatriota e contemporâneo de Lina.'
