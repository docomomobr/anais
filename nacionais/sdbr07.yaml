- id: 'sdbr07-051'
  title: A modernidade figurativa da Casa Curutchet
  authors:
  - givenname: Sílvia Lopes Carneiro
    familyname: Leão
    email: 'silvia-leao@uol.com.br'
    affiliation: null
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  section: Casa
  abstract: 'A Casa Curutchet, situada em La Plata, Argentina, foi projetada por Le Corbusier em 1948-49 e representa um caso particular dentro da obra do arquiteto. Inserida em malha urbana perfeitamente constituída, sobre um bulevar e em frente a uma praça, é a única casa do arquiteto construída na América Latina. Além disso, implantada em lote estreito e profundo entre medianeiras, flanqueado por casas contíguas de diferentes épocas, a residência é um típico exemplo de arquitetura moderna perfeitamente ajustada a um contexto urbano figurativo. Encomendado a Le Corbusier por importante cirurgião da cidade, o projeto despertou o interesse do arquiteto, que havia estado na Argentina em 1929 e esboçara um plano urbanístico para a capital. Sem conhecer o terreno, Le Corbusier mantém intensa correspondência com o cliente, que o alimenta com informações a respeito do programa de necessidades, da legislação urbana da cidade e com material fotográfico do lote e seu entorno. Duas exigências programáticas básicas eram solicitadas pelo Dr. Curutchet: consultório independente da residência e principais ambientes com vista para a praça em frente. A solução dada por Le Corbusier mostra-se primorosa tanto espacial como contextualmente. O consultório, espaço de uso mais público, é separado da casa e situado num volume frontal menor, junto à rua; liga-se ao volume residencial posterior por uma rampa, que fica num pátio intermediário, alusivo à colonização espanhola do lugar. No que diz respeito às relações com o entorno, a casa Curutchet pode ser considerada contextual sob quatro pontos de vista. No urbanístico, em primeiro lugar, o arquiteto a integra à malha urbana de La Plata, cidade planejada no final do século XIX e caracterizada pela superposição de duas tramas, uma em xadrez e outra em diagonal. O terreno situa-se sobre um trecho em diagonal, e a fachada da casa, mas apenas ela, assume a inclinação da via. Em segundo lugar, sob o critério ambiental, o forte sol de verão platense é amenizado pelos profundos brise-soleils em forma de grelhas de concreto, frontais ao consultório e à casa, que, além de funcionais, têm forte caráter expressivo. Quanto ao aspecto visual, em terceiro lugar, o arquiteto logra perfeita relação com a praça pública em frente, permitindo que seja contemplada tanto do consultório como da residência, de todos os ambientes principais. Por fim, no âmbito arquitetônico, há perfeita integração do edifício com sua vizinhança, constituída por uma residência protomoderna à direita, de baixa altura e recuada do alinhamento frontal, e uma casa do início do século XX à esquerda, com pé-direito alto e fachada eclética de vertente italiana sobre o alinhamento. Sem tentar qualquer tipo de mimetismo, ou, ao contrário, caracterizando as diferenças, Le Corbusier propõe relações de ordem geométrica, criando um escalonamento de alturas que demonstra forte sensibilidade para com o contexto. As três casas representam e revelam três épocas, mas a inserção corbusiana as relaciona de forma harmoniosa. Outras obras corbusianas anteriores, fossem residências unifamiliares ou não, também se implantavam em lotes urbanos, mas Curutchet é, talvez, o exemplo em que a “inserção” é levada a cabo com maior completude. Sem abandonar os principais pressupostos dos anos 20, tais como o uso dos cinco pontos e da rampa, que encaminha a promenade architecturale através do pátio, e acrescentando elementos de seu repertório pós-guerra – brise-soleil, teto pára-sol, uso do Modulor – Le Corbusier enfrenta o problema da inserção urbana com maestria, provando que modernidade arquitetônica não é incompatível com urbanismo figurativo pré-moderno. Antes pelo contrário.'
  abstract_en: 'The Curutchet House, in La Plata, Argentina, designed by Le Corbusier in 1948-49, represents a particular case of the architect’s work. Inserted in the perfectly built urban fabric on a boulevard facing a square, this is the only project by the architect built in Latin America. Built on a deep narrow plot, with contiguous houses from different periods on both sides, the residence is also a typical example of modern architecture perfectly adjusted to a figurative urban context. Commissioned by an important local surgeon, the project caught Le Corbusier’s interest, who had visited Argentina in 1929 and sketched an urban plan for the capital. Le Corbusier never visited the site, but kept up an intense correspondence with his client, who fed him with information about the needs assessment, the city’s urban legislation and with photographic material of the site and surroundings. Dr. Curutchet had two basic programmatic demands: medical practice separated from the family house and main areas with a view to the square. 2 The solution found by Le Corbusier was spatial and contextually perfect. The medical practice, a more public space, is separated from the house and located in a smaller frontal volume next to the street, connected to the rear residential volume by a ramp over an intermediate courtyard, allusive to the local Spanish colonization. Regarding the relationship with the surroundings, the Curutchet House can be considered contextual from four points of view. First of all, from an urbanistic perspective, the house is integrated within the urban fabric of La Plata, a city planned in the late 19th century and characterized by a superposition of two grids, a checkered one and a diagonal one. The plot is located on a diagonal section and only the façade of the house follows the inclination of the street. Second, from an environmental standpoint, the effects of the strong summer sun of La Plata are minimized by the deep concrete grid brise-soleils on the façades of both the medical practice and the residence, which, besides the functionality, have a deep expressive character. Third, regarding the visual aspect, the architect achieves a perfect relationship with the public square facing the house, which can be contemplated from all the main areas of the clinic and residence alike. Finally, from an architectural perspective, there is perfect integration between the house and its neighbouring buildings. On the right, there is a proto-modern residence of low height, set back from the front property line; on the left, a house from the early 20th century, with high floor-to-ceiling height and an eclectic façade of Italian influence. Far from trying any kind of mimetism, but rather characterizing the differences, Le Corbusier proposes geometrical relationships, creating a scaling of heights that demonstrates strong sensitivity to the context. The three houses represent and reveal three different periods; yet, the Corbusian insertion creates a harmonious relationship between them. Other previous works by le Corbusier, either single-family houses or not, were also built on urban sites, but the Curutchet House is perhaps the example where the “insertion” was most thoroughly accomplished. Without abandoning the main principles of the 20’s, such as the use of the five points and the ramp that allows the promenade architecturale through the courtyard, and adding elements of his post-war repertoire – brise-soleil, skylights, use of the Modulor – Le Corbusier deals with the problem of the urban insertion masterly, proving that architectural modernity is not incompatible with pre-modern figurative urbanism. Quite the opposite.'
