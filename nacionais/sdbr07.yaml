- id: 'sdbr07-010'
  title: In Memoriam
  subtitle: o trabalho de recuperação e atualização do passado em obra já demolida — a casa Nordschild
  authors:
  - givenname: Beatriz Santos de
    familyname: Oliveira
    email: 'oliveira.b@exemplo.com'
    affiliation: null
