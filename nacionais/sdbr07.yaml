- id: 'sdbr07-037'
  title: 'Pelas ruas do mercado, o pulsar de velhos costumes e novos anseios'
  subtitle: o desafio da requalificação do Mercado Central de João Pessoa — PB
  authors:
  - givenname: Marco Antonio
    familyname: Coutinho
    email: null
