- id: 'sdbr07-067'
  title: O resgate da unidade perdida
  subtitle: 'o Teatro do Museu de Arte Moderna de Affonso Eduardo Reidy. Rio de Janeiro, 2007'
  authors:
  - givenname: Roberto
    familyname: Segre
