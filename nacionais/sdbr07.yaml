  section: Cultura e Educação
  abstract: 'O Museu de Arte Moderna do Rio Janeiro é um ícone da Arquitetura Moderna carioca, desenhado por Affonso Eduardo Reidy (1909-1964). No terreno do Aterro do Flamengo doado em 1953 pela prefeitura, foi situado o projeto e inaugurado parcialmente em 1958, com a construção do Bloco Escola, no período da presidência de Juscelino Kubitschek. Em 1968, foi á vez do volume principal do Salão de Exposições, entretanto faltaria ainda o teatro, que constituía o maior volume do conjunto e que estabelecia o vínculo com a cidade, ao ficar situado no acesso principal desde a Avenida Beira Mar. Em 1978, ocorreu um grave incêndio que destruiu quase a totalidade do acervo de uma exposição itinerante do pintor uruguaio Torres Garcia. O Museu voltou a funcionar em 1982 e a reforma não foi totalmente bem sucedida, o que motivou que em 1999 teve que se desenvolver um trabalho de restauração para recuperar as características do desenho original. Em 2002, houve uma tentativa de viabilizar a construção do teatro do Museu, previsto no projeto do conjunto, através de negociações entre a prefeitura da cidade do Rio de Janeiro e a direção do Museu. Em 2007, foi aberto ao público o teatro e a sua construção respeitou a volumetria definida por Reidy no projeto original. Neste ensaio será apresentado como aconteceu o processo de “rearquitetura” no Museu de Arte Moderna do Rio de Janeiro. Do ponto de vista da sua significação cultural, cabe verificar as características dos espetáculos que o teatro abriga. Em relação a sua Arquitetura, será analisado o desenho interior do conjunto funcional do teatro, verificando se o “espírito” da obra atual se corresponde com a qualidade do projeto original de Reidy. Ao longo de 50 anos, este museu sempre foi assimilado sem o volume do teatro pela sociedade carioca. A nova articulação de formas estabelece uma percepção social e arquitetônica diferenciada para os habitantes da cidade, que deve ser amadurecida para substituir a imagem precedente. E também analisar como mudou o sistema de prioridades e de intensidades no uso do conjunto, especialmente com apresentações – como Rio Show – e celebrações festivas que introduziram elementos arquitetônicos de precária qualidade estética e construtiva alheios ao projeto original. Esta dinâmica de sucessivas transformações do edifício a fim de resgatar a forma e a função definitivas, estabelecida no desenho de Reidy confirma a validade de uma imagem que elaborada no passado atinge a sua concretização no presente, e recupera a unidade por longo tempo inconclusa.'
  keywords:
  - Arquitetura Moderna
  - Affonso Eduardo Reidy
  - Arquitetura Brasileira Contemporânea
  - 'Key Words: Modern Architecture'
  - Contemporary Brazilian Architecture
  abstract_en: 'The Museum of Modern Art designed by Affonso Eduardo Reidy (1909-1964) is an icon of modern architecture in Rio de Janeiro. It was built on a site offered by the Municipal Government in the "Aterro de Flamengo" park, and was partially inaugurated, with the School Building, in 1958, during the presidency of Juscelino Kubitschek. In 1968, the museum main building, where the exhibition hall is, was finished; however, the theater building was left unfinished, and as it was the major volume, it established a link with the city, as it was located in front of Beira Mar Avenue. In 1978, occurred a great fire that destroyed almost all the collection of an itinerant exhibition of the Uruguayan painter Joaquín Torres Garcia. The museum opened again in 1982 and the renovation was not totally well done, what motivated that, in 1999, another renovation work had to be done in order to recuperate the original design. In 2002, an opportunity aroused to turn the construction of the museum theater viable, as it was proposed in the original design, through negotiations between the municipal authorities of Rio de Janeiro and the museum direction. In 2007, the theater was opened to the public and its construction respected the volume defined by Reidy in its original design. In this essay it will be presented how the process of ‘rearchitecture’ happened in the Museum of Modern Art of Rio de Janeiro. From the point of view of its cultural meaning, it is worth mentioning the shows that the theater shelters. In what it concerns to its architecture, it will be analyzed the interior design of the theater, verifying if the ‘spirit’ of the actual building corresponds to the quality of the original design proposed by Reidy. Along the last fifty years, this museum was always perceived by the carioca society without the theater volume. The new articulation of forms establishes a social and architectonic perception different from the one which the inhabitants of the city were accustomed to, that has to age in order to substitute the precedent image. It will also be analyzed how the system of priorities and intensities in the use of the ensemble have changed, specially with the organization of shows – like the Rio Show – celebrations and parties that introduced architectonic elements of precarious esthetic and constructive qualities, disconnected of the original design. This dynamic of successive transformations of the building, in search of rescuing its definite form and function, proposed in Reidy´s design, confirms the validity of an image elaborated in the past that reaches its concretization in the present, and recuperates the unity for a long time unconcluded.'
  keywords_en:
  - Modern Architecture
  - Affonso Eduardo Reidy
  - Contemporary Brazilian Architecture
  references:
