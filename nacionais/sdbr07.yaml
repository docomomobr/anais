- id: 'sdbr07-020'
  title: Arquitetura dos anexos na Praça dos Três Poderes
  subtitle: o caso do Congresso Nacional
  authors:
  - givenname: Elcio Gomes da
    familyname: Silva
    email: 'elcio.gomes@camara.gov.br'
    affiliation: UnB
    orcid: '0000-0003-2684-9945'
    bio: null
    country: BR
    primary_contact: false
  - givenname: José Manoel Morales
    familyname: Sánchez
    email: null
    affiliation: UnB
    orcid: '0000-0003-0426-8090'
    bio: null
    country: BR
    primary_contact: false
  section: Praça e Palácio
  abstract: 'Os edifícios anexos na arquitetura da Praça dos Três Poderes, ao absorverem as demandas por novas ocupações, podem contribuir para a manutenção e a preservação das características da Arquitetura Moderna dos edifícios principais: os palácios do Planalto, do Supremo Tribunal Federal e o Congresso Nacional, executados entre 1958 e 1960. A construção dos anexos - quatro no Palácio do Planalto, dois no Supremo Tribunal Federal e seis no Congresso Nacional (dois no Senado Federal e quatro na Câmara dos Deputados) – ocorre entre 1965 e 1993. Ao contrário dos edifícios principais, a maioria deles não compõe diretamente a arquitetura da Praça, apesar da proximidade com as primeiras edificações. As pressões sofridas pelos palácios por abrigar novas áreas e o crescimento do número de servidores levaram à configuração de anexos cujo somatório de área construída supera a edificação principal: duas vezes no caso do Palácio do Planalto e do Senado Federal, cinco vezes na Câmara dos Deputados e oito vezes no Supremo Tribunal Federal. O caso do Congresso Nacional adquire configuração própria, pois, diferente dos outros palácios, é conjunto arquitetônico submetido ao controle do Senado Federal e da Câmara dos Deputados, independentes entre si e com atuações específicas em relação aos espaços dos edifícios. Nestes órgãos, a requalificação de espaços nobres e o resgate das funções originalmente previstas têm sido obtidos a partir da liberação de áreas anteriormente ocupadas, possibilitada pela construção dos edifícios anexos. O artigo aborda os aspectos históricos do surgimento destes anexos e traz a análise das ações ocorridas no Congresso Nacional: as causas das intervenções, as intenções previstas e as conseqüências na edificação principal. São apresentadas as características dos anexos da Câmara dos Deputados e Senado Federal, além de documentação gráfica de projetos construídos e exemplos de propostas não executadas.'
  keywords:
  - Praça dos Três Poderes
  - Oscar Niemeyer
  - Edifícios Anexos
  abstract_en: 'The buildings annexes to the Three Power Square palaces, absorbing the new occupations demands, can contribute to the preservation of the Modern Architecture characteristics of the main buildings: Planalto Palace (government), Supreme Court Palace, and the National Congress, all built from 1958 to 1960. The construction of the annexes – four at the Planalto Palace, two at the Supreme Court Palace, and six at National Congress (two at the Federal Senate and four at the Chamber of Deputies) – occurred from 1965 to 1993. On the contrary of the main buildings, most of the annexes, despite the proximity, are not part of the Square architecture.  The pressure over the palaces to shelter new areas and the increasing number of civil servants lead to  configurations of annexes whose total area amount greatly surpass the main buildings: two times in the Planalto Palace and Federal Senate cases, five times in the Chamber of Deputies case, and eight times in the Supreme Federal Court case. The National Congress case acquires peculiar characteristics, considering that, on the contrary of the other palaces, it is an architectonic complex under the control of both the Federal Senate and the Chamber of Deputies, which are independent and with specific actions in relation to the building spaces. In these institutions, the noble spaces rehabilitation and the regain of prior original functions have been obtained starting with the liberation of areas previously occupied, enabled by the construction of the annexes buildings. This article approaches the historical aspects of the arising of these annexes and contains an analysis of the actions occurred at the National Congress: the intervention causes, the forecasts intentions and the consequences in the main buildings. The characteristics of the Chamber of Deputies and Senate annexes, and furthermore a graphic documentation of built designs and samples of unbuilt proposals are presented.'
  keywords_en:
  - Three Powers Square
  - Oscar Niemeyer
  - Annex Buildings
