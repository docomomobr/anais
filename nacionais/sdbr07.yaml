  section: 'Paisagem, Transporte e Mercado'
  abstract: 'Pelas ruas do mercado, o pulsar de velhos costumes e novos anseios. O desafio da requalificação do Mercado Central de João Pessoa - PB. O presente artigo trata do projeto de requalificação do Mercado Central de João Pessoa, Paraíba. Construído entre 1943 e 1948, o mercado conta com cinco edifícios dispersos em três quadras, servidos por rua interna em forma de “Y”. Os galpões em estrutura modulada de concreto armado recebem vedações em alvenaria de tijolos e marquises laterais em toda sua extensão. Afora o galpão da entrada principal, destinado aos produtos industrializados, os demais têm silhueta típica das construções fabris, com cobertas inclinadas e sheds à guisa de exaustão e fechamento em forma de brise-soleil horizontal. O programa de custos reduzidos gerou uma tipologia rústica, porém amplamente embasada no ideário moderno. Pensado para garantir o abastecimento da capital, era o único equipamento do gênero, contando a cidade também, com feiras livres na periferia. De localização estratégica, o conjunto contribuiu para consolidação da urbanização do Centro em torno da Lagoa do Parque Solon de Lucena. A falta de gerenciamento ao longo do tempo levou o equipamento a receber grande população adicional de feirantes que construiu aleatoriamente em seu interior, desfigurando o projeto inicial. Mediante um quadro de total abandono e visando evitar a sua interdição, em 2006, a Prefeitura Municipal resolve requalificar o Mercado Central, desordenado espacialmente, com funções desvirtuadas e instalações sanitárias em colapso. O projeto preserva o conjunto existente, valorizando-o por sua importância arquitetônica, histórica, cultural e econômica e propõe a inserção de novos edifícios que dialoguem de maneira digna e sem afetação. O que se pretende é devolver à cidade um equipamento condizente com a sua época, uma opção de comércio, serviços, cultura e lazer, uma vez que a dinâmica urbana pede cada vez mais espaços flexíveis capazes de absorver as atividades de encontro.'
  keywords:
  - Ideário moderno – Requalificação – Mercado Central de João Pessoa – PB
  abstract_en: 'This paper deals with the requalification project for the Central Market of João Pessoa, Paraíba. It was constructed between 1943 and 1948. The market is composed by five buildings distributed in three street blocks unified by a “Y” shaped street. The pavilions have a modulated structure of reinforced concrete, closures in masonry bricks and lateral marquees in all its extension. Apart from the main entrance block, reserved for industrialized products, the four other have a typical factory silhouette, with inclined roof, sheds for exhaustion and horizontal brise-soleil closures. The program had a reduced budget, which generated a rustic ensemble, however widely based on modern ideals. Conceived to provide supplies for the capital, it was then the only equipment of its kind: the city had only peripheral open-air markets. Its strategic location contributed to consolidate the urbanization of the city’s central area around the Lagoon of the Solon de Lucena Park. The lack of management throughout time lead to an increased number of merchants, who promoted aleatory constructions, devoiding it of its original characteristics. Instigated by its abandonment and imminent interdiction, in 2006, the municipality decided to intervene in the Central Market and recover it from its deranged spaces, with defiled functions and precarious sanitary installations. The project preserves the original ensemble, which has a high architectural, historical, cultural and economic importance and proposes the insertion of new buildings that will coexist in harmony with the existing ones. The project intends to give back to the city an equipment in consonance with its time; an option of commerce, services, culture and leisure, since urban dynamics request for more flexible spaces, capable of absorbing these collective activities.'
