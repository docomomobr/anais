- id: 'sdbr07-027'
  title: Restauração do Complexo da Reitoria da UFRGS
  authors:
  - givenname: Janaína
    familyname: Carla Dalarosa
    email: null
    affiliation: null
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  section: Cultura e Educação
  abstract: 'Apresentação da Universidade e histórico da Reitoria A UFRGS, uma das mais antigas universidades públicas do Brasil, possui um acervo edificado dos mais significativos no contexto urbano da cidade de Porto Alegre. Representa uma síntese da trajetória construtiva do Estado nos períodos de 1898 a 1928, e de 1951 a 1964. Este patrimônio possui inúmeros significados identificados nas realizações de arte, ciência, conhecimento, política e humanismo de diferentes gerações, caracterizando uma parte importante da memória da sociedade gaúcha e brasileira.O setor administrativo se encontrava originalmente segmentado junto às edificações de ensino. Com a federalização da Universidade, foram instituídos novos setores tornando-se evidente a falta de espaço. O desenvolvimento da Universidade exigia maiores e melhores condições administrativas, culturais e sociais. A centralização dos serviços administrativos, da unidade cultural da Instituição e da vida associativa de seus professores, funcionários e alunos eram fatores que deveriam determinar a existência de um prédio adequado com salão de festas e auditório. As formaturas eram realizadas em locais pequenos e as festas e bailes em locais públicos, previamente alugados. Por esses motivos, impunha-se um local associativo, necessariamente, nas dependências do edifício que a Reitoria projetava construir. Fernando Lunardi fez o projeto, concretizado em dois edifícios, o da Reitoria e o do Salão de Atos. O edifício da Reitoria pode ser dividido inicialmente em base e corpo. A base, de formato retangular, é composta por dois pavimentos abrigando as atividades sociais. O corpo, de formato retangular, é composto por cinco pavimentos abrigando as atividades administrativas. Esta leitura perde-se quando o projeto é analisado com maior profundidade. Percebe-se uma descontinuidade na altura da base quando esta encontra o corpo do edifício gerando uma segunda leitura. Nesta, defini-se uma edificação a qual unem-se dois blocos lateralmente. No edifício destacam-se elementos da arquitetura moderna tais como: estrutura independente; pé-direito elevado na base; uso de pilotis; parede com tijolo de vidro; brises horizontais fixos na fachada nordeste, brises verticais móveis na fachada noroeste; presença de terraço com pergolado em concreto; uso de pinturas murais e telas em espaços de destaque.Sobre o edifício do Salão de Atos, seu formato é em leque e se conecta à Reitoria por meio de pilotis. Abriga o auditório concluído em 1957 e reformado na década de 80 visando sua ampliação. A alteração descaracterizou parcialmente o conjunto, uma vez que lhe conferiu maior diâmetro externo. Por meio desta breve análise do conjunto Reitoria e Salão de Atos, verifica-se que as edificações possuem elementos suficientes que lhe insiram no hall de exemplares da arquitetura moderna em nosso Estado, porém é evidente também a falta de pureza em alguns aspectos compositivos. Proposta de Intervenção e critérios de análise O projeto visa atender a duas demandas: uma de caráter arquitetônico no qual se buscará identificar e exaltar as características que tornam o conjunto um exemplar arquitetônico de valor histórico-cultural para a arquitetura moderna produzida no Estado na década de 50. Isso implicará na recuperação de espaços e materialidade originais; a outra constitui o redimensionamento dos espaços dos setores administrativos. A Secretaria do Patrimônio Histórico procura seguir, em seus projetos, as orientações e preceitos da Preservação de Edificações e Sítios Históricos difundidos através de Cartas, Declarações e Tratados Nacionais e Internacionais. A partir desses documentos e da orientação dos órgãos responsáveis pela preservação do patrimônio nas instâncias federal, estadual e municipal - IPHAN, IPHAE e EPAHC, o Departamento de Projetos determina os critérios a serem seguidos no desenvolvimento dos projetos. Os critérios das analises por mim desenvolvidas também contarão com tais argumentos para seu desenvolvimento. O trabalho aqui brevemente apresentado será desenvolvido com o apoio da SPH/UFRGS.'
  locale: 'pt-BR'
  file: 'sdbr07-027.pdf'
  pages: null
  doi: 10.5281/zenodo.19072692

- id: 'sdbr07-029'
  title: La vivienda moderna en el centro de Santiago
  authors:
  - givenname: José
    familyname: Rosas Vera
    email: null
    affiliation: null
    orcid: '0000-0001-9775-1051'
    bio: null
    country: BR
    primary_contact: false
  - givenname: Magdalena
    familyname: Vicuña
    email: null
    affiliation: null
    orcid: '0000-0002-9476-396X'
    bio: null
    country: BR
    primary_contact: false
  section: Palácio e Residência
  abstract: null
  keywords:
  - Vivienda Moderna
  - Santiago
  abstract_en: |-
    This paper finds its origin in the research about modern housing in Santiago's downtown, realized between 1985 and 1987, by professors of Universidad Católica. The objective of this research was to learn about the most significant housing experience, registered within urban form, which also respond to Karl Brünner's recommendations and modernization proposal between 1930 and 1960. This period corresponds to the stage in which high density and edification structures and consolidates in downtown Santiago.
    Identification of housing as a constitutive element of the process of configuration and consolidation of downtown Santiago, demands to accept that centric housing, without abandoning modern principles nor eluding high densities introduced by tall buildings, continued a searching of higher consistency with the urban grid.
    This paper analyzes how urban block comprises an entity adaptable enough to offer new solutions within density and diversity of land uses, representing a manifestation that modern architecture not always simplified, in form and substance, the complexity and historical transposition of existing urban form. This will not represent an easy problem to resolve within the logic and restrictions of the closed block.
    It can also be observed how Brunner's proposal reinforces the search of solutions within the downtown block, which would permit the coexistence of housing with commerce and service activities, resolved in height and density, through a new use of block's interior spaces. In consequence, while first floors will allocate commerce with interior galleries and shops facing the street, second floors will allocate offices and upper floors, housing.
    This paper presents a series of cases that evidence the opening of existing urban form through tall buildings, considering housing as the land use of new centralities that this zone promotes. Block opening will represent an operation that allows pursuing higher construction and density indexes in downtown blocks, as well as in "interior residential zones". Consequently, development will make use of excellent existing infrastructure. Brünner will impulse block decomposition trough the introduction of streets and public spaces. Decomposition will serve interior block communication and a better subdivision of buildings so as to get better ventilation and lighting conditions. This operation will represent a response to added value tax maximization and profitability of developers, new construction technologies and C.I.A.M. recommendations.
    Case study analysis allows understanding that Brünner's proposal represents an urban process that did not unbalanced colonial grid, which also combines modern urbanism with nineteen century's urbanism. It can also be observed that the application of the outlines of modern movement did not operate through the approach of tabula rasa proposed by those vanguards. On the contrary, modern movement's outlines were utilized by alternative streams, which adapted new functional ideas with old formal solutions.
    In conclusion, most notable advances introduced in architecture production of downtown Santiago were: block rationalization and new ways of giving form to its edges and interior patios; highest utilization of land; the search of fold in built form in order to get the most favourable lighting and ventilation; the achievement of certain ideas related to comfort; and, finally, the logic in the constructive process and its structural correspondence as a means of lowering costs.
  abstract_es: 'Este trabajo se origina en la investigación sobre vivienda moderna en el centro de Santiago, realizado entre 1985 y 1987, por profesores de la Universidad Católica, cuyo objetivo era investigar aquellos episodios residenciales más significativos registrados dentro de la forma urbana general, a partir de las recomendaciones y propuesta de modernización impulsadas por Karl Brünner entre 1930 y 1960. Este período corresponde a la etapa en que se estructura y consolida la edificación en altura y la forma densa y urbana del centro de Santiago. La identificación de la vivienda como elemento constitutivo del proceso de configuración y consolidación del centro Santiago exige aceptar que la residencia céntrica, sin renunciar a los principios modernos, ni eludir las fuertes densidades que la altura introdujo, prosiguió una búsqueda de mayor cohesión con el tejido urbano. Este artículo analiza cómo la manzana constituyó una entidad lo suficientemente adaptable para ofrecer nuevas soluciones entre densidad y diversidad de usos, constituyendo una demostración que la arquitectura moderna no siempre simplificó, en el fondo y en la forma, la complejidad y superposiciones históricas de los tejidos urbanos precedentes. Esto no constituiría un problema fácil de resolver dentro de la lógica y restricciones de la manzana cerrada. Se observa también cómo Brunner fortalece la búsqueda de soluciones en el manzanero central que permitieran la coexistencia de la residencia con actividades de comercio, oficinas y administración pública, resueltas en altura y alta densidad, mediante un nuevo aprovechamiento de los espacios interiores en las unidades de relleno. Es así como mientras en el primer piso se ubicará el comercio, en galerías interiores y locales hacia la calle, en el segundo piso se ubicarán oficinas y en los pisos restantes se ubicará vivienda. Este artículo presenta una serie de casos en los cuales se evidencia la apertura del tejido existente a través de la edificación en altura, considerando a la vivienda como programa de las nuevas centralidades que esta zona promueve. La apertura de la manzana se constituirá como una operación que permite conseguir mayores índices de edificabilidad y densidad, tanto en las unidades de relleno de la denominada "city", como de las "zonas residenciales interiores", con el consecuente aprovechamiento de la excelente infraestructura existente. Brünner impulsará la descomposición de la manzana mediante la introducción de calles y espacios libres interiores en los terrenos, los cuales servirán a la comunicación interior de la manzana y a una mejor subdivisión de los bloques con fines de iluminación y ventilación. Esta operación constituirá una respuesta a la maximización de plusvalías y rentabilidad de las operaciones inmobiliarias, las nuevas tecnologías de construcción y las recomendaciones de los C.I.A.M. Del análisis de los casos estudiados se desprende que la propuesta de Brünner representa una operación urbana de naturaleza no traumática con la trama colonial, que combina dosis de urbanismo moderno con urbanismo decimonónico. Se observa que la aplicación de los lineamientos del movimiento moderno no operó por la vía de tabla rasa que esas vanguardias propugnaban, sino a través de unas corrientes subterráneas, las cuales adaptaron nuevas ideas funcionales con viejas soluciones formales. En conclusión, los avances más notables que se introducen en la producción arquitectónica del Centro, fueron: la racionalización de la manzana y nuevos modos de formalización de los bordes y del patio interior; el máximo aprovechamiento del suelo asignado; la búsqueda de pliegues en la forma edificada a objeto de garantizar óptima iluminación y ventilación y el logro de ciertas ideas de confort o comodidad, y, finalmente, la lógica en el proceso constructivo y su correspondencia estructural como modalidad de abaratamiento de costos y economía de recursos.'
  keywords_es:
  - Vivienda Moderna
  - Santiago
  references:
