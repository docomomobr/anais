- id: 'sdbr07-053'
  title: Cinquenta anos depois
  subtitle: 'a atuação do IPESP e dos arquitetos modernos paulistas na construção de edifícios escolares em São Paulo de 1959-1962'
  authors:
  - givenname: André Augusto de Almeida
    familyname: Alves
    email: 'alves@exemplo.com'
    affiliation: null
    orcid: '0000-0001-7953-9372'
    bio: null
    country: BR
    primary_contact: false
  section: Cultura e Educação
  abstract: 'Como primeiro passo para a definição de diretrizes para a conservação e preservação do significativo acervo de prédios escolares públicos modernos produzidos pelo Ipesp – Instituto de Previdência do Estado de São Paulo – com a participação de muitos dos mais importantes arquitetos paulistas atuantes em São Paulo nos anos de 1950 e 1960, o artigo busca efetuar uma caracterização global das condições atuais de conservação e preservação desses edifícios, a serem encontradas por arquitetos, usuários e demais agentes sociais envolvidos na tarefa de intervir nestes espaços. Após uma breve introdução sobre a atuação do Ipesp e dos arquitetos modernos paulistas na produção de edifícios escolares, o artigo apresenta os resultados dos esforços de documentação do acervo que incluem novos dados quantitativos, de localização e autoria de projetos arquitetônicos, que demonstram a diversidade de proposições arquitetônicas elaboradas e discutidas naqueles anos. Esta diversidade de proposições é o principal objeto de análise do artigo, do ponto de vista de suas implicações na apropriação do edifício pelo usuário e no estado de conservação do conjunto de edifícios, abrangendo, por exemplo, concepções espaciais, plásticas e construtivas baseadas na aliança entre arquitetura moderna e técnicas construtivas tradicionais; concepções modernas marcadas por alto grau de estilização, propostas pragmáticas baseadas em técnicas e materiais amplamente experimentados, soluções formais de influência carioca ou baseadas no uso extensivo do concreto armado aparente. Para tanto, concentra-se em exemplares emblemáticos estudados a partir de fac-similes dos projetos, da documentação arquivada pelo Ipesp sobre cada uma das etapas de projeto, construção e ocupação dos prédios e de visitas a eles realizadas. Finalmente, procura-se construir um panorama das principais questões verificadas, visando fornecer subsídios iniciais para a discussão sobre estratégias projetuais, de intervenção e gestão deste patrimônio histórico e artístico moderno.'
  abstract_en: 'As a first step toward the definition of directions for the conservation and preservation of the significant collection of public modern school buildings produced by the Ipesp - Instituto de Previdência do Estado de São Paulo – with the participation of many of the most important architects in São Paulo in the 1950’s and 1960’s, the article longs for a global characterization of the actual conditions of conservation and preservation to be found by architects, users and other social agents involved in the task to intervine in these spaces. After a brief introduction about Ipesp and the modern “paulista” architects’ action in the production of school buildings, the article presents the results of efforts of documentation that include new data about quantities, localization and authorship of projects, that demonstrate the diversity of architectural proposals discussed in those years. This diversity of proposals constitutes the focus of the analysis, which privileges its implications in the appropriation of the building by the user and in the state of conservation of the buildings, enclosing, for example, space, plastic and constructive conceptions based in the alliance between modern architecture and traditional techniques and materials; highly stylized modern designs; pragmatic proposals based in widely tried techniques and materials; designs of marked “carioca” influence or based in the extensive utilization of apparent reinforced concrete. In this way, emblematic exemplars are studied through facsimiles of original designs, Ipesp’s documentation files about each stage of the design, construction and occupation process and visits carried through them. Finally, the article includes a panorama of the main verified questions, aiming at to supply initial subsidies for the discussion about strategies for design, intervention and management of this historic and artistic modern heritage.'
