- id: 'sdbr07-065'
  title: As múltiplas dimensões da reciclagem e requalificação do Edifício Brigadeiro Tobias no Centro Histórico de São Paulo
  authors:
  - givenname: Jardiel
    familyname: Sampaio Oliveira
    email: null
    affiliation: null
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  - givenname: Rosío Fernández Baca
    familyname: Salcedo
    email: 'salcedo@exemplo.com'
    affiliation: null
