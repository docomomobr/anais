- id: 'sdbr07-023'
  title: A tectônica na reciclagem e requalificação de obras arquitetônicas modernas
  authors:
  - givenname: Germana Costa
    familyname: Rocha
    email: 'germana.rocha@exemplo.com'
    affiliation: UFPB
    orcid: '0000-0001-6794-8953'
    bio: null
    country: BR
    primary_contact: false
  section: Agência e Consideração
  abstract: 'Este trabalho discute a relevância da abordagem tectônica na reciclagem e requalificação de objetos arquitetônicos modernos nos dois momentos do processo de intervenção: o prospectivo e o propositivo. A discussão é feita com base na noção de tectônica resgatada da teoria alemã do século XIX por Kenneth Frampton e que tem ressoado fortemente no discurso arquitetural atual. Na cultura tectônica a dimensão estética da arquitetura encontra sua força e autenticidade no potencial expressivo dos elementos construtivos e da estrutura, priorizando a poética da construção. Esse interesse fenomenológico pela “coisidade” na arquitetura, ou seja, a busca de significado na própria materialidade do objeto arquitetônico, também constitui a base teórica da metodologia de intervenção em edifícios existentes ressaltada nos trabalhos de Giorgio Grassi, Rafael Moneo, Carlo Scarpa, oposta ao idealismo praticado por Viollet-le-Duc, como observa Solà-Morales. Para este autor o reconhecimento das estruturas significativas manifestadas no material histórico existente e o seu uso são marcos analógicos para a nova construção, bem como suporte para que a proposta de intervenção, enquanto operação estética possa ser livre, arbitrária e imaginativa. A tectônica como categoria analítica, instaurada por Frampton, tem como premissa a existência, em arquitetura, de um juízo estético inerente ao ato construtivo. Ele se apoia na tese de Semper de que o elemento constitutivo básico da arte de construir é a junção. A junção, longe de ser um detalhe gratuito, é elemento tectônico primordial e constitui o nexo em torno do qual o edifício começa a existir e se articular como presença. Nas obras arquitetônicas, portanto, se verifica uma articulação de espaços e de elementos materiais estruturantes que implicam, em uma sintaxe tectônica. Nesta, a articulação construtiva gera uma subdivisão espacial e vice-versa. A partir das categorias analíticas dessa sintaxe tectônica se analisa, neste trabalho, as intervenções realizadas em duas obras modernistas brasileiras: o Pavilhão Luiz Nunes-Sede IAB, antigo Pavilhão Verificação de Óbitos do arquiteto Luiz Nunes, na cidade do Recife – PE; e a Igreja de São Francisco - Pampulha, do arquiteto Oscar Niemeyer, em Belo Horizonte – MG.'
  keywords:
  - Tectônica
  - Reciclagem
  - Arquitetura Moderna
  abstract_en: 'This work argues the relevance of the tectonic approach on the recycling and new qualification of modern architectural builds at the two moments of the intervention process: the prospective and the projection. The discussion lays on the notion of tectonic rescued from the German theory of century XIX by Kenneth Frampton and that it has resounded strong in the current architectural speech. In the tectonic culture the aesthetic dimension of the architecture finds its force and authenticity on the expressive potential of the constructive elements and the structure, giving preference to the poetics of construction. This phenomenolgic interest on the “thingness” in architecture, that is, the search of meaning in the proper materiality of the architectural object, also constitutes the theoretical base of the intervention methodology on the existing buildings pointed out in the works of Giorgio Grassi, Rafael Moneo, Carlo Scarpa, opposing to the idealism exercised by Viollet-le-Duc, as Solà-Morales observes. For this author the recognition of the significant structures revealed in the existing historical material and its use is analogical sign for the new construction, as well as support so that the proposal of intervention, while aesthetic operation can be free, arbitrary and imaginative. The tectonic as analytical category, restored for Frampton, has as premise the existence, in architecture, of an aesthetic judgment inherent to the constructive act. He leans on Semper thesis in which the basic constituent element of the art of construct is the junction. The junction, far from being a gratuitous detail, is primordial tectonic element and constitutes the nexus around which the building starts to exist and to articulate as presence. On the architectural builds, therefore, we can verify an articulation of spaces and arranging material elements that imply in a tectonic syntax. In this, the constructive joint generates a space subdivision and vice versa. From the analytical categories of this tectonic syntax this work analyses the interventions carried out on two Brazilian modernist works: the Luiz Nunes Pavilion - situated in Recife - PE; and the San Francisco Church – in Pampulha, Oscar Niemeyer’s conception, situated in Belo Horizonte MG.'
