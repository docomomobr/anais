  section: 'Hotel, Escritório e Expansão'
  abstract: 'Park Hotel: o regionalismo crítico de Lúcio Costa e o desafio da rearquitetura em obras modernas Entender a concepção projetual. Assim se iniciou uma extensa pesquisa realizada a partir de compilações de textos e trabalhos acadêmicos realizados em disciplinas relativas à conservação e restauração, sendo nosso objeto de estudo, o Park Hotel, projetado por Lúcio Costa. Concebido no início da década de 40, com caráter provisório, na cidade de Nova Friburgo/RJ, o Park Hotel é considerado uma das obras mais importantes do arquiteto Lúcio Costa na fase anterior à concepção de Brasília. Por sua significação, em 1985 o Park Hotel foi declarado parte do patrimônio histórico artístico e nacional, reconhecido por Bruandi como um marco introdutório da arquitetura moderna no Brasil. A proposta desta pesquisa ganha relevância por se desdobrar em duas vertentes. A primeira diz respeito à concentração de informações que servem de suporte para a segunda, que possui um caráter mais interpretativo dos dados. A partir disso, reunimos documentos e iconografias que se encontravam dispersas, somando hoje um número expressivo de material. Este ensaio traz consigo uma contribuição à reflexão sobre o desafio de intervenção e de uma rearquitetura da arquitetura moderna, já que a sua demanda original foi superada há algumas décadas. Para isso fazemos aportes teóricos no que diz respeito ao conceito de restauro crítico e a textos escritos por Lúcio Costa, em que ele reaviva a contribuição do regionalismo crítico.'
  keywords:
  - modernidade
  - regionalismo critico
  - rearquitetura
  abstract_en: 'Lucio Costa: the critical regionalism and the challenge of re-archicteture in modern constructions Aimming to understand the projectual conception, an extensive research was achieved from compiled texts and academical works related to conservation and restoration subjects focusing on Park Hotel planned by Lúcio Costa. At the beginning of the 40 decade, although the provisional character, in the city of Nova Friburgo/RJ, the Park Hotel is considered one of the greatest projects of the archictect Lucio Costa before the conception of Brasilia. In 1985 due to the significance, the Park Hotel was declared as historical, artistical and national property and considered by Bruandi a landmark introducing the modern archicteture in Brazil. The proposal of this research is relevant because it is shared in two steps.The first concerns to the data collection that is the support for the second step which character is more interpretative. Based on these information reuniting meaningful documents and icnographies, summing an expressive number of data. This essay contributes to the reflexion about the challenge of the intervention re- archicteturing the modern archicteture since the original demand was overcome some decades ago.For that reason, theoretical aportes were made concerning the critical restoration concept and articles written by Lucio Costa where he highlights the contribution of the critical regionalism.'
