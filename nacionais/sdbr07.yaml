- id: 'sdbr07-004'
  title: A transformação do espaço nas áreas centrais das grandes cidades e a nova arquitetura hoteleira
  subtitle: 'caso dos hotéis Plaza Marabá, Novotel Jaraguá e Normandie Design Hotel, em São Paulo'
  authors:
  - givenname: Ana Paula
    familyname: Garcia Spolon
    email: null
    affiliation: null
    orcid: '0000-0001-7125-5877'
    bio: null
    country: BR
    primary_contact: false
  - givenname: Paulo César
    familyname: Xavier Pereira
    email: null
    affiliation: null
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  section: 'Hotel, Escritório e Expansão'
  abstract: 'Este trabalho discute os programas de renovação dos edifícios do Novotel Jaraguá, Normandie Design Hotel e Plaza Marabá, importantes exemplares da arquitetura modernista que continuam funcionando como meios de hospedagem, mostrando que a relação das edificações hoteleiras com o centro de São Paulo pode ser rica, pois estabelece "uma imagem privilegiada, sintética e de certa forma magnificada, das dificuldades e contradições com as quais se confrontam a valorização do patrimônio arquitetônico em geral, e em especial sua reutilização ou, em outras palavras, sua integração na vida contemporânea" (CHOAY, 2006, p. 222). Esta discussão pode também encontrar referências em várias outras cidades brasileiras e mesmo mundiais, nas quais originalmente o centro era o lugar onde estavam instaladas as atividades mais importantes (equipamentos de poder, de lazer, de comércio e de serviços, além de núcleos residenciais) e onde foram registradas importantes transformações. Este trabalho insere-se na discussão sobre as práticas de intervenção urbana nas áreas centrais, conduzidas especialmente nas grandes cidades, na tentativa de interromper o processo de declínio e erosão dos espaços urbanos. A temática da intervenção em centros urbanos, segundo Smith (2006, p. 75), faz hoje parte de uma "aliança concertada e sistemática do urbanismo público e do capital, privado e público, (e) preencheu o vazio deixado pelo retraimento das políticas urbanas progressistas". Este movimento de reabilitação dos espaços urbanos se dá em diversas escalas. Neste processo de desenho e redesenho da cidade, as transformações atingem desde o território como um todo até as escalas mais pontuais, como a paisagem e o edifício, na produção de cenários urbanos diferenciados, a partir dos quais se estabelecem os produtos, ou as mercadorias que serão "consumidas" pelos cidadãos, visitantes e turistas. Estas mercadorias urbanas são (re)criadas, entre outras práticas, pela recuperação do patrimônio edificado. No espaço do centro de São Paulo, algumas destas práticas de intervenção aconteceram, nos anos recentes, em edificações de hotéis construídos no período moderno, com reconhecida significação estética. Canova (2004, p. 12) aponta que embora a hotelaria já se tenha espalhado por toda São Paulo, o centro ainda concentra o maior número de hotéis da cidade e que "muitos passaram por recente processo de modernização tanto da arquitetura quanto de serviços".'
  keywords:
  - renovação
  - centralidade
  - hospitalidade
  abstract_en: 'This program discusses Novotel Jaraguá, Normandie Design Hotel and Plaza Marabá buildings renewal as important samples of modern architecture that continue working as hotels, showing that the relation of their buildings with São Paulo center can be rich, once it establishes "a synthetic, privileged and somehow magnified image of difficulties and contradictions with which architectural patrimony valuation in general faces itself and particularly its reusing or, in other words, integration in contemporary life" (CHOAY, 2006, p. 222). This discussion can also find references in several or even worldwide Brazilian cities in which their center has originally been the place where the most important activities have been installed (power equipments, leisure, commerce and services, plus residential nucleus) and significant changes have been registered. This work is inserted in the discussion on urban intervention practices in central areas, particularly conducted in big cities, in an attempt of interrupting the decline and erosion process of urban spaces. The theme of urban centers intervention, according to Smith (2006, p. 75), is nowadays part of a "forged and systematic covenant of public urbanism and of private and public capital, (and) has fulfilled the void left by progressive urban refrain policies". This movement of urban spaces rehabilitation occurs in different levels. In this process of designing and redesigning the city, the transformations reach this territory as a whole up to the most specific levels as the landscape and the building in the production of differentiated urban scenarios from which products or commodities "consumed" by citizens, visitors and tourists are established. These urban commodities are (re)created, among other practices, by built patrimony recovering. Within the space of São Paulo center some of these intervention practices have taken place in recent years, in hotel edifications built in the modern period, with recognized esthetic signification. Canova (2004) points that although the hotel industry has already spread all over São Paulo, its center concentrates the biggest number of hotels in the city and "many have passed by a recent process of modernization of both architecture and services".'
