- id: 'sdbr07-031'
  title: Centro Cultural FIESP
  subtitle: o aço requalificando o espaço
  authors:
  - givenname: Juliano Caldas de
    familyname: Vasconcellos
    email: 'vasconcellos@exemplo.com'
    affiliation: Feevale
    orcid: '0000-0002-4281-8199'
    bio: null
    country: BR
    primary_contact: false
  section: 'Hotel, Escritório e Expansão'
  abstract: 'A intervenção tem autoria de Paulo Mendes da Rocha e consiste na inserção de uma nova obra na porção térrea da sede da Federação das Indústrias do Estado de São Paulo. A partir da demolição de um trecho da laje do projeto vencedor do concurso de 1969 (de autoria de Roberto Cerqueira César e Luis Roberto Carvalho Franco), abre-se espaço para a reorganização das atividades que estavam mal instaladas: galeria de arte, biblioteca, teatro, foyer e espaço para a fila de retirada de ingressos; protocolo, recepção e acessos aos elevadores. A estes foram acrescidos um salão de atos e um palco para atividades cívicas, e um café, junto ao foyer do teatro. Ao se eliminar parte dessa laje, eliminando-se também um forro existente e que escondia uma altíssima viga sobre a qual está apoiado o edifício e que faz a transição para um número menor de pilares, foi liberada uma ampla área de grande altura voltada para a fachada da avenida. Abriu-se então a calçada, visual e efetivamente, para um amplo espaço semi-público de transição que requalifica o edifício no seu sítio. O que se produziu foi um aumento das áreas de uso público, deslocando parte da recepção da FIESP (o setor de protocolo) para novas acomodações no subsolo, e concentrando o sistema de controle e separação da entrada nos recintos do elevador, que agora organiza a entrada no térreo superior e a saída no térreo inferior. Com a demolição da laje de entrada, a calçada da Avenida Paulista aumentou de 7 para 20 m, criando um espaço generoso de acolhimento, o que possibilitou uma visão nítida dos dois térreos (da galeria e da biblioteca). O artigo busca descrever a caixa miesiana de aço encaixada dentro da estrutura agigantada de concreto através da análise tridimensional de dois componentes: do espaço de transição urbana antes e depois da intervenção. Interessa também um estudo mais atento da leve estrutura de aço e a colaboração desta técnica com as efetivas possibilidades construtivas e arquitetônicas, além da articulação entre o existente e o inédito, que - além do seu próprio valor como acrescido - confere nova característica ao existente.'
  keywords:
  - inserção
  - aço
  - revitalização
  abstract_en: 'The intervention of Pablo Mendes da Rocha consists of the insertion of a new building in the first floor of the headquarters of the Federação das Indústrias do Estado de São Paulo. From the demolition of a piece of the flagstone of the winning project of the 1969 competition, space for the reorganization of the activities confides that badly were installed. This article inside describes steel the incased box of the huge structure of concrete through the three-dimensional analysis of two components: the space of urban transition before and after the intervention. It also interests a more intent study of the light steel structure and the contribution of this technique with the effective constructive possibilities and architectural, the joint between existing and the unknown one, that - beyond its proper value as increased - new characteristic to the existing one confers.'
  keywords_en:
