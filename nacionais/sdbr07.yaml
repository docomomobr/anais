- id: 'sdbr07-074'
  title: Arquitetura Moderna e reciclagem do patrimônio edificado
  subtitle: a contribuição baiana de Diógenes Rebouças
  authors:
  - givenname: Nivaldo Vieira de
    familyname: Andrade Junior
    email: 'nivandrade@gmail.com'
    affiliation: null
    orcid: '0000-0001-9543-8432'
    bio: null
    country: BR
    primary_contact: false
  - givenname: João
    familyname: Legal Leal
    email: null
    affiliation: null
    orcid: '0000-0002-0513-103X'
    bio: null
    country: BR
    primary_contact: false
  section: Autor e Consideração
  abstract: 'Diógenes Rebouças foi, inquestionavelmente, um dos principais responsáveis pela consolidação da arquitetura moderna na Bahia e o mais prolífico arquiteto baiano entre o final da década de 1940 e meados dos anos 1960. Neste período, Diógenes produziu algumas de suas obras mais significativas, como o Estádio da Fonte Nova (1942-51) e o Hotel da Bahia (com Paulo Antunes Ribeiro – 1947-52). O Edifício do IPASE (1952-53), deste mesmo período, é um verdadeiro manifesto da filiação do autor à chamada escola carioca e à sua matriz corbusiana. Apesar de estar situado no Centro Histórico de Salvador, ao lado do Mirante do Saldanha – monumento já então tombado pelo SPHAN – e embora Rebouças tivesse atuado como colaborador daquele órgão entre 1947 e 1952, o Edifício do IPASE não apresenta qualquer tentativa de contextualização com o seu entorno, comportando-se mais como um manifesto dos cinco pontos preconizados por Le Corbusier: pilotis, planta livre, terraço-jardim, fachada livre e janelas em fita, aqui substituídas pelos brise-soleil e pelos combogós como elementos de controle da luminosidade e da ventilação. A partir de meados dos anos 1960, Rebouças passa a projetar cada vez menos, se dedicando às atividades de ensino e consultoria. Entre 1982 e 1990, porém, é novamente contratado como consultor técnico do SPHAN na Bahia e tem oportunidade de elaborar diversos projetos de recuperação, requalificação e ampliação de edifícios tombados, bem como propostas de novas construções em conjuntos históricos. Este trabalho tem como objetivo analisar os diversos projetos de intervenção sobre o patrimônio edificado elaborados por Diógenes Rebouças entre as décadas de 1950 e 1990, buscando compreender as complexas relações que sua produção estabelece com as preexistências edificadas ao longo destes mais de quarenta anos de atividade projetual. O conjunto analisado inclui diversos níveis de intervenção sobre preexistências arquitetônicas, com destaque para as propostas desenvolvidas para edifícios pré-modernos tombados ou localizados em sítios históricos urbanos desenvolvidas pelo arquiteto nos anos 1980, tais como a adaptação do Solar Berquó em Sede do SPHAN na Bahia (1982-1988); a recuperação do Paço do Saldanha (1990-1995) e a revitalização do Mosteiro de São Bento (1994). Além destas intervenções, o arquiteto elaborou muitos outros projetos nos anos 1980 com características semelhantes, embora não executados, como a ampliação da Santa Casa de Misericórdia de Cachoeira; a adaptação da Casa dos Sete Candeeiros em Museu do SPHAN; a adaptação de um sobrado em Cachoeira na sede do Museu Hansen Bahia; a recuperação da Igreja da Barroquinha; e a recuperação do Engenho Vitória do Paraguaçu. Somem-se a estas as intervenções realizadas por Rebouças em edifícios modernos de sua própria autoria, como a segunda fase do projeto da Escola-Parque (1959-1963); a ampliação do Complexo Esportivo da Fonte Nova (1968-1971) e a reforma e ampliação do Hotel da Bahia (1981-1984). No panorama dos projetos de requalificação elaborados por Rebouças, são significativos ainda os novos edifícios projetados na década de 1980 para sítios históricos urbanos ou nas proximidades de monumentos tombados, como o Centro Cívico e Cultural na Ladeira da Praça em Salvador; a Casa de Cultura da Bahia próxima à Igreja da Barroquinha; o Mercado do Peixe ao lado do Forte de Santa Maria; e a Capela de Santa Bárbara em São Félix, o único destes efetivamente construído.'
  keywords:
  - Diógenes Rebouças
  - Bahia
  - Arquitetura Moderna
  abstract_en: 'Diógenes Rebouças was, doubtlessly, one of the most important personalities in the process of consolidation of the Modern Architecture in Bahia and its most prolific architect between the late 1940’s and the mid 1960’s. In this period, Diógenes has produced some of his most expressive works, such as the Fonte Nova Stadium (1942-51) and the Hotel da Bahia (with Paulo Antunes Ribeiro – 1947-52). The IPASE Building (1952-53), built at the same time, is a real manifest of the author’s filiation to the so called carioca school and its corbusian matrix. Even so it was built in Salvador’s Historic Center, beside the Mirante do Saldanha – a building already listed by SPHAN at that time – and although Rebouças also worked, between 1947 and 1952, as a collaborator to that agency, the IPASE Building doesn’t feature any attempt to adapt itself to the surroundings, preferring to openly make reference to the five points preconized by Le Corbusier: pilotis, free plan, roof garden, free façade and fenêtres en longueur, here replaced by the brise-soleil and the combogós as means of controlling light and wind exposure. From the mid 1960’s, Rebouças constructs each time less, devoting himself to teaching and consulting activities. Between 1982 e 1990, although, he is hired again as IPHAN’s technical consultant in Bahia and has the opportunity to develop some projects of recuperation and extension of listed buildings, as much as designing new buildings in historical centers. This paper aims to analyze Rebouças projects for existing buildings between the 1950’s and the 1990’s, investigating the complex relationship established by its production and the built preexistences in more than forty years of designing activity. The analyzed projects comprise different levels of intervention over architectural preexistences, underlining the designs developed by the architect in the 1980’s to pre-modern buildings individually listed or placed inside urban historic sites, such as the adaptive reuse of Solar Berquó into SPHAN Headquarters in Bahia (1982-1988); the recuperation of Paço do Saldanha (1990-1995) and revitalization of Mosteiro de São Bento (1994). Beside those interventions, Rebouças developed many others studies in the 1980’s with similar characteristics, though not carried out, such as the extension of Santa Casa de Misericórdia in Cachoeira; the adaptive reuse of Casa dos Sete Candeeiros into SPHAN’s Museum; the adaptive reuse of an ancient building in Cachoeira into Museu Hansen Bahia; the recuperation of Igreja da Barroquinha; and the recuperation of Engenho Vitória do Paraguaçu. Beside those, Rebouças accomplished many interventions on modern buildings previously designed by himself, such as the second phase of the Escola-Parque project (1959-1963); the extension of Fonte Nova Stadium (1968-1971); and the extension of Hotel da Bahia (1981-1984). In the scenery of the requalification developed by Rebouças, there are some important projects carried out in the 1980’s for new buildings inside urban historic sites or in the neighborhood of listed buildings, such as the Centro Cívico e Cultural at Ladeira da Praça in Salvador; the Casa da Cultura da Bahia close to the Igreja da Barroquinha; the Fish Market beside the Forte de Santa Maria; and the Santa Barbara Chapel in São Félix, the only one of these projects that was effectively built.'
  keywords_en:
  - Diógenes Rebouças
  - Bahia
  - Modern Architecture
