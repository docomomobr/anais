- id: 'sdbr07-052'
  title: A mão e sua impressão
  authors:
  - givenname: Silvio Belmonte de Abreu
    familyname: Abreu Filho
    email: 'silvio.abreu.arq@gmail.com'
    affiliation: null
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  section: Praça e Palácio
  abstract: |-
    No final dos anos 20, confrontavam-se no Rio de Janeiro duas visões do urbanismo e da cidade, ilustrando exemplarmente os dois paradigmas modernos que coexistiam à época. O Plano de Agache e a proposta de Le Corbusier para o Rio de Janeiro de 1929 não são apenas "projetos" distintos, mas estratégias frente à cidade e à natureza com divergências fundamentais, que permitem a analogia entre a mão e sua impressão. Nos anos 40, um urbanista que trabalhou com Agache no Plano do Rio e um arquiteto que trabalhou com Le Corbusier na equipe do MES vão igualmente confrontar-se com propostas para o Centro Cívico na Praça da Matriz, em Porto Alegre. Os projetos de Arnaldo Gladosch para o Centro Administrativo do Estado e de Jorge Moreira para o Centro Cívico revelam as mesmas divergências, que não se limitam à usual dicotomia entre um Gladosch "acadêmico" ou "conservador" e um Moreira "moderno" e "inovador".
    Gladosch foi contratado pelo Prefeito Loureiro da Silva no final de 1938 para elaborar o Plano Diretor de Porto Alegre, credenciado pelo trabalho com Agache no Rio de Janeiro. Desenvolveu uma série de estudos até a definição do Anteprojeto, e projetos urbanísticos especiais, apresentados sucessivamente ao Conselho do Plano Diretor, em evidente procura da adesão pelo convencimento, na tradição da Societé Française des Urbanistes. O Centro Cívico na Praça da Matriz foi apresentado ao Conselho em meados de 1939, e detalhado até 1943, pelos seis desenhos disponíveis em Um Plano de Urbanização. Jorge Moreira apresentou seu estudo para o Centro Cívico de Porto Alegre em 1943, provavelmente por iniciativa própria, quando estava envolvido com o projeto para o Hospital de Clínicas da Universidade. Pode ter contado com a colaboração de Affonso Eduardo Reidy, pouco depois seu parceiro no projeto para a sede da VFRGS em Porto Alegre. O estudo explora duas variantes, apresentadas em apenas quatro figuras no livro organizado por Jorge Czajkowski.
    A comparação dos dois projetos procura compensar a parca documentação disponível com a "intensidade da mirada", emprestada a Hélio Piñon. Na análise, afloram as contradições e similaridades entre os dois paradigmas urbanísticos em convivência na época, ambos comprometidos com o moderno, embora de formas distintas. As referências de Moreira remetem aos projetos para a Universidade do Brasil, de Le Corbusier e da equipe de Lucio Costa, da qual fazia parte, à Ville Radieuse corbusiana dos anos 30 e ao "Ilot Insalubre nº 6", prenunciando tanto o projeto para o centro de Saint-Dié quanto o projeto de Reidy para a Esplanada de Santo Antonio, no Rio. As estratégias compositivas e os desenhos de Gladosch revelam sua formação no urbanismo alemão e a tradição da SFU, através de Agache, com referências específicas ao Stile Littorio de Marcello Piacentini e ao projeto de Piacentini e Morpurgo para a Praça da Reitoria da Universidade do Brasil. Assim, o confronto que já se estabelecia entre os dois paradigmas, nos projetos para a Cidade Universitária da Universidade do Brasil, se transfere a Porto Alegre, tendo o Centro Cívico como arena.
    As propostas de Gladosch e Moreira para o Centro Cívico da Praça da Matriz não exibem a homotetia quase absoluta dos projetos de Agache e Le Corbusier – não chegam a representar literalmente a analogia da mão e sua impressão, mas ilustram um peculiar "sincretismo urbanístico", com dois paradigmas apanhados em raro momento de equilíbrio, mesmo instável. Seu estudo traz ensinamentos preciosos para o projeto da cidade contemporânea, especialmente na inserção de edifícios modernos em tecido tradicional, onde o novo e o velho se fornecem referências mútuas, revigorando-se numa relação cheia de tensão e significado.
  keywords:
  - Urbanismo Moderno
  - Gladosch e Moreira
  - Porto Alegre
  abstract_en: |-
    In the late 20s, two visions of urbanism and city, which demonstrated the two modern paradigms coexisting at that time, were in confrontation in Rio de Janeiro. Agache's Plan and Le Corbusier's 1929 proposal for Rio de Janeiro are not just distinct "projects", but strategies facing city and nature with fundamental differences, that allow the use of "the hand and its print" analogy. In the 40s, an urbanist who had worked with Agache in Rio's Plan and an architect who had worked with Le Corbusier in the MES team will also confront proposals for the Porto Alegre Civic Center at Praça da Matriz. Arnaldo Gladosch's and Jorge Moreira's projects for the Civic and Government Center reveal the same divergences, overcoming the usual dichotomy between "academic" or "conservative" Gladosch and "modern" or "innovative" Moreira.
    Gladosch was hired by Mayor Loureiro da Silva in late 1938 to work in a Master Plan for Porto Alegre, with his experience with Agache being his main credential. He worked in several Plan studies and urban design pieces presented to the City Planning Council in an open search for public support in the SFU tradition. The Civic Center design was presented to the Council in mid-1939, and developed until 1943, according to the six drawings available in the book "Um Plano de Urbanização". Moreira presented his study for the same place in 1943, probably by his own, when working in his project for the State University's Hospital. He may have had support from Affonso Eduardo Reidy, his partner in the VFRGS Building project some time later. The study explores two options presented in a few drawings found in Jorge Czajkowski's book on Moreira.
    Comparisons between the two projects seek to overcome the sparse documentation available with an "intensification of viewing" borrowed from Helio Piñon. In the analysis, contradictions and similarities emerge between two urbanistic paradigms in use at the time, both of them committed to the modern, but in different ways. Moreira's references lay in Le Corbusier's and Lucio Costa's distinct projects to Universidade do Brasil, the corbusian Ville Radieuse of the 30s and the "Ilôt Insalubre # 6", preannouncing both LC's reconstruction of Saint-Dié city center and Reidy's Esplanada de Santo Antonio scheme in Rio. Gladosch's composition strategies and designs show his background in German urbanism and the French SFU tradition, through Agache, and also specific references to Marcello Piacentini's Stile Littorio and Piacentini and Morpurgo's Rectory square project for Universidade do Brasil. Thus, the already settled struggle between the two paradigms in Universidade do Brasil Campus projects in Rio moved to Porto Alegre, taking the Civic Center as arena.
    Gladosch's and Moreira's proposals for the Civic Center in Praça da Matriz don't display the almost absolute homothety of Agache's and Le Corbusier's projects – they don't represent so literally the hand and its print analogy; but they show a peculiar "urbanistic syncretism", catching two paradigms in a rare moment of balance, even unstable. His study brings precious learning to contemporary city project, specially the insertion of modern buildings in traditional urban fabric, where new and old share mutual references, strengthening each other in a plentiful correlation of tension and meaning.
  keywords_en:
  - Modern Urbanism
  - Gladosch and Moreira
  - Porto Alegre
