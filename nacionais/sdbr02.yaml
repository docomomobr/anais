    affiliation: 'MDU-UFPE'
    orcid: '0000-0003-3367-9657'
    bio: null
    country: BR
    primary_contact: false
  section: null
  abstract: 'Este trabalho procura analisar a produção de um conjunto urbanístico-arquitetônico moderno durante o Estado Novo, a abertura da Av. 10 de Novembro, atual Guararapes. Esta intervenção, feita de uma ampla discussão sobre o urbanismo moderno no Recife, configurou uma nova imagem de cidade e de estética urbana e foi influenciada pelas idéias de modernização e embelezamento vigentes na época, podendo ser associada ao ideário de Alfred Agache, em seu Plano do Rio de Janeiro e sua ênfase na conformação de conjuntos monumentais nas áreas centrais. Após uma breve apresentação da obra de Agache, procuramos refazer a trajetória de influências e transferências dos ideários urbanísticos, analisando a discussão do urbanismo moderno no Recife dos anos 20, o plano de Nestor de Figueiredo, o processo de abertura da referida Avenida, o regulamento imposto e o conjunto arquitetônico e urbanístico gerado.'
