  abstract: 'Este texto não pretende comunicar resultados de um trabalho concluído mas antes relatar alguns aspectos do estágio atual da pesquisa sobre "A constituição da Arquitetura Moderna em São Paulo 1930-70", em desenvolvimento pelo Grupo de Pesquisa em Arquitetura e Urbanismo da USP de São Carlos. Na fase atual da pesquisa o trabalho está concentrado na tentativa de caracterização do ambiente arquitetônico paulista durante os anos 40 e 50. Mais especificamente trata-se de identificar as condições econômicas e sociais, o ambiente cultural e os agentes arquitetônicos que contribuíram para a configuração de um contexto arquitetônico específico a partir do qual poderá ser reavaliada a emergência da chamada "escola paulista".'
