    familyname: Oliveira
    email: null
    affiliation: UNITAU
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  section: null
  abstract: 'Esse texto apresenta o trabalho do CPEU - FAUUSP, Centro de Pesquisas e Estudos Urbanísticos da Faculdade de Arquitetura e Urbanismo da Universidade de São Paulo, realizado nos idos de 1958 à 1963 em Campos do Jordão, Sp. Aponta-se os antagonismos existentes entre as idéias do CPEU (tributárias do CIAM e da democracia cristã do Padre Lebret) e as propostas para transformar essa estância em centro turístico internacional. Destaca-se as contradições entre a previsão de expansão urbana ante ao ambiente dessa região da Mantiqueira, impróprio à concentração urbana. E, revela-se a dicotomia entre os diagnósticos e a fragilidade das intenções sociais diante da realidade de miséria social no município.'
