- id: 'sdbr02-017'
  title: Tradição e Modernidade no Desenho da cidade estadonovista brasileira
  subtitle: a avenida Guararapes no Recife
  authors:
  - givenname: Fernando Diniz
    familyname: Moreira
    email: 'fmoreira@hotlink.com.br'
    affiliation: 'MDU-UFPE'
    orcid: '0000-0002-1387-4036'
    bio: null
