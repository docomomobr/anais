- id: 'sdbr02-005'
  title: O arquivo da City em São Paulo
  authors:
  - givenname: Silvia Ferreira Santos
    familyname: Wolff
    email: 'wolff@exemplo.com'
    affiliation: 'UPPH-SEC-SP'
    orcid: '0000-0001-7538-2750'
    bio: null
    country: BR
    primary_contact: false
  section: null
  abstract: 'Dentro da perspectiva proposta pelo temário deste encontro do DOCOMOMO, o presente relato insere-se no grupo 3 relativo à preservação da arquitetura moderna. Trata-se de pesquisa documental realizada junto ao arquivo de uma empresa particular de extensa ação urbanizadora na história da cidade de São Paulo, a Cia. City. Esta pesquisa desenvolveu-se como parte integrante da Tese de Doutoramento "O bairro Jardim América e sua arquitetura" que vem sendo realizada na Faculdade de Arquitetura e Urbanismo da Universidade de São Paulo. O aspecto que se optou por enfatizar no encontro foi o do desenvolvimento das etapas da pesquisa em uma situação em que se alia grande riqueza documental pouco explorada às condições adversas de se trabalhar em um arquivo que não prevê este tipo de consulta. Infelizmente esta situação não é de excepcionalidade. Como arquiteta ligada à preservação do patrimônio cultural paulista no CONDEPHAAT, tenho consciência das dificuldades para obtenção de documentos sobre a cidade de São Paulo.'
  references:
  - 'BACELLI, Ronei. A presença da Cia. City em São Paulo (1915-1940) e a implantação do Primeiro Bairro-Jardim. São Paulo. Dis. Mestrado, Depto. de História, FFLCUSP, 1982.'
  - 'HOWARD, Ebenezer. Garden cities of to-morrow. 1902 (cuja primeira versão com outro nome é de 1898). A versão da Faber & Faber de 1944 tem a vantagem de apresentar introdução de OSBORN, seu colaborador, e prefácio de Lewis MUMFORD.'
  - 'SOUZA, M. Cláudia Pereira. O capital imobiliário e a produção do espaço urbano: o caso da Cia. City. São Paulo. Dis. Mestrado. FGV/EASP, 1988.'
  - 'TAGLIAVENTI, Gabriele (cura). Città giardino. Garden city. Roma: Gangemi, 1994.'
  locale: 'pt-BR'
  file: 'sdbr02-005.pdf'
  pages: '42-51'

- id: 'sdbr02-006'
  title: Lina Bo Bardi
  subtitle: a casa Valéria Cirell e a poética do abrigo
  authors:
  - givenname: Maria de Fátima
    familyname: Campello
    email: null
    affiliation: 'DAU-UFAL'
    orcid: '0000-0001-6979-1478'
    bio: null
    country: BR
    primary_contact: false
  section: null
  abstract: 'Entre os vários projetos de arquitetura que Lina Bo Bardi realiza entre 1949 e 1958 apenas dois são construídos no período: a Casa de Vidro - residência da Arquiteta - e a Casa Valeria Piacentini Cirell - residência de uma amiga muito próxima de Lina Bo Bardi. Essas duas casas - uma aérea, leve e totalmente transparente e a outra opaca e pesada, atada ao chão - representam duas tendências na obra da Arquiteta. Enquanto uma é a “casa do ar”, a outra é a “casa da terra”. Acreditamos que, essas duas expressões tão contrastantes entre si, estão presentes em todo o desenvolvimento futuro da sua obra.'
  references:
  - 'CAMPELLO, Maria de Fátima de Mello Barreto (1997). Lina Bo Bardi: as moradas da alma. São Carlos. Dissertação (Mestrado) — EESC-USP, Depto de Arquitetura e Planejamento.'
  - 'HABITAT (1952±). Arquitetura e jardinagem. São Paulo, n. 6, p. 71, s/d, s/mês.'
  locale: 'pt-BR'
  file: 'sdbr02-006.pdf'
  pages: '52-63'

