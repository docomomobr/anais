- id: 'sdbr02-003'
  title: Vertentes da Modernidade no Brasil
  authors:
  - givenname: Hugo
    familyname: Segawa
    email: 'segawa@exemplo.com'
    affiliation: 'EESC-USP'
    orcid: '0000-0002-2532-4664'
    bio: null
    country: BR
    primary_contact: false
  section: null
  abstract: 'A arquitetura moderna tem sido objeto de preocupação por parte das instituições de preservação de bens culturais em todo o mundo. O DOCOMOMO vem promovendo gestões no sentido de estabelecer critérios de elaboração de listagens de bens arquitetônicos a se preservar, em meio ao debate acerca da normalização dos procedimentos para essas finalidades e as diferenças emergentes entre as várias regiões do planeta. Este trabalho busca uma discussão preliminar da questão dos critérios de avaliação de modernidade arquitetônica no âmbito brasileiro a partir de sucintos estudos de caso, com realizações nem sempre julgadas como manifestações modernas: arquiteturas de ensino, hospitalar, aeroportuário, habitacional, do sistema de correios e telégrafos; e concluindo com a singularidade de obras de Lucio Costa e Lina Bo Bardi como firmas de modernidades heterodoxas.'
  references:
  - 'AZEVEDO, Paulo Ormindo de. Crise e modernização, a arquitetura dos anos 30 em Salvador. In: SEGAWA, Hugo (ed.). Arquiteturas no Brasil/Anos 80. São Paulo, Projeto, p. 14-18, 1988.'
  - 'MARTINS, Carlos A. F. Um parecer arquitetônico. A/U Arquitetura e Urbanismo, São Paulo, n. 20, p. 86-96, out./nov. 1988.'
  - 'MONTANER, Josep Maria. La modernidad superada: arquitectura, arte y pensamiento del siglo XX. Barcelona, Gustavo Gili, 1997.'
  - 'OLIVEIRA, Beatriz Santos de. Modernidade oficial: a arquitetura das escolas públicas do Distrito Federal (1936-1940). Dissertação (Mestrado — Arquitetura e Urbanismo) — Faculdade de Arquitetura e Urbanismo, Universidade de São Paulo, 1991.'
  - 'SEGAWA, Hugo. Modernidade programática: uma arquitetura dos anos 1930/40 fora dos manuais. Projeto, São Paulo, n. 131, p. 73-84, mar. 1990.'
  - 'SILVA, Geraldo Gomes da. Marcos da arquitetura moderna em Pernambuco. In: SEGAWA, Hugo (ed.). Arquiteturas no Brasil/Anos 80. São Paulo, Projeto, p. 19-27, 1988.'
