- id: 'sdbr02-004'
  title: Paradoxos entrelaçados
  subtitle: as Torres para o futuro e a Tradição nacional
  authors:
  - givenname: Cêça
    familyname: Guimaraens
    email: 'guimaraens@exemplo.com'
    affiliation: 'PROURB-UFRJ'
    orcid: '0000-0003-1889-7883'
    bio: null
    country: BR
    primary_contact: false
  section: null
  abstract: 'A comunicação apresenta a delimitação de um cenário onde se verifica os acontecimentos arquitetônicos que antecederam e decorreram da participação dos arquitetos do Patrimônio na configuração do espaço contemporâneo do Centro do Rio de Janeiro. Retoma-se uma determinada estória na tentativa de alinhar e avaliar atos e fatos que caracterizaram os períodos onde ocorreram as principais formas de verticalização do espaço "histórico" da cidade. A integração entre o Estado e o poder econômico no Brasil estabelece a outra pauta do trabalho. As torres de escritórios são produtos da expansão / concentração financeira; expressão e registro de manifestações culturais essas formas constituem "pistas" para o estudo do desenvolvimento da "indústria da preservação".'
  references:
  - 'AMARAL, Aracy. A Arquitectura neocolonial. São Paulo: Memorial/Fondo de Cultura Económica, 1994.'
  - 'AMARAL, Aracy. Arte p''rá quê? São Paulo: Edusp/Nobel, 1988.'
