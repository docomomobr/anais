- id: 'sdbr06-031'
  title: Os projetos para Brasília e a construção da identidade nacional
  authors:
  - givenname: Jeferson Cristiano
    familyname: Tavares
    email: null
    affiliation: null
    orcid: '0000-0003-2285-0367'
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'O objetivo é analisar as características urbanísticas dos projetos para Brasília e identificar sua contribuição para a construção da identidade nacional. Foram propostos, para a Nova Capital, 32 projetos entre 1927 e 1957, dos quais 25 deles recuperados. A análise desses projetos é elaborada a partir de suas referências e de suas matrizes urbanísticas. A vinculação com a construção da identidade nacional dá-se a partir de sua contextualização e da caracterização desses projetos. Essa relação é marcada por um elemento comum presente nos projetos assim como na construção da identidade nacional: a dialética, ou seja, a ação de promover o diálogo entre elementos contraditórios, opostos. O texto, assim, introduz o tema, aborda os valores contextuais da dialética presente na cultura nacional e expõe os projetos urbanísticos e suas características. Cabe à conclusão, a relação entre as soluções propostas para a Nova Capital e a forma como contribuíram com a construção da identidade nacional.'
  keywords:
  - 'Urbanismo - Brasília – Projetos'
  abstract_en: 'The objective is to analyse the urbanistics projects to Brasilia and identify its contribuition to the nacional identity construction. Have been proposed to the New Capital 32 projects between 1927 and 1957 (25 of them were recoveredand analysed). These projects´analyses is worked out from its reference and urbanistics sources. The link with a national identity construction is the contextualization and characterization of these projects. The relation between the moments is marked for a comum element that is clear in the projects for Brasilia and on the nacional identity construction - the dialectic, the action to cause a dialogue between opositte elements. The text introduces the theme, boards context values from the dialectic clear on national culture and shows the urbanistics projects and its characteristics. The conclusion do the relation between the solutions proposed and how they contribute with the national identity construction.'
  references:
  - 'ARANTES, Otília Beatriz Fiori. Sentido da Formação: Três estudos sobre Antonio Candido, Gilda de Mello e Souza e Lúcio Costa. Rio de Janeiro: Paz e Terra, 1997.'
