- id: 'sdbr06-006'
  title: Sérgio Ferro
  subtitle: a construção de uma teoria
  authors:
  - givenname: Angélica Irene da
    familyname: Costa
    email: null
    affiliation: null
    orcid: '0009-0004-2350-9624'
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'O objetivo desse trabalho é interpretar e relacionar as duas principais vertentes da produção de Sérgio Ferro: sua obra arquitetônica, representada aqui pelas residências Bernardo Issler e Boris Fausto e seus escritos teóricos, que são resultado de seu envolvimento na cena política e cultural, no período delimitado entre o final dos anos 1950 e o início da década de 1970. Desse cenário surgiram seus conceitos e suas propostas, que primavam pelo engajamento crítico em relação à realidade social brasileira, o que levou ao questionamento das concepções e modelos de desenvolvimento e a um contato mais direto com os problemas da construção civil, particularmente, com a realidade do canteiro de obras e levando-o a propor o uso de materiais e técnicas mais acessíveis à população, um relacionamento diferente com os trabalhadores e formas arquitetônicas compatíveis com esses materiais, técnicas e com as preocupações com o trabalho, ou melhor, com a forma que o trabalho adquiria na indústria da construção civil, vale dizer, no canteiro de obras. Nesse sentido, se mostra de extrema importância a relação do arquiteto com os principais fatos que marcaram essa época e conseqüentemente influenciaram sua produção, como o seu engajamento político-partidário junto ao PCB, o golpe de 1964, a crítica à linha política do partido e a ruptura com ela, a relação com a intelectualidade e as conseqüências do endurecimento do regime com perseguições e prisões, inclusive a sua própria. Com isso, pretende-se estabelecer uma interlocução entre conceitos e obras, verificando as concordâncias e contradições desse arquiteto que marcou profundamente a arquitetura moderna brasileira.'
  abstract_en: 'The purpose of this work is to understand and settle relationships between the two main realm of Sérgio Ferro’s production: his architectonic work, presented here through Bernardo Issler and Boris Fausto’s Houses and his theoretical writings, which can be seen as the result of his commitment to the political and cultural Brazilian background, inscribed within the period between the end of the 1950’s decade and the beginning of the 1970’s. From this very background arouse his concepts and proposals, which indicated a critical engagement with the social Brazilian environment, leading the discussion to questioning the conceptions and patterns of social development and to a more direct contact to the civil construction, particularly the reality of the site construction, leading to the proposition of more accessible materials uses and techniques to the population, to a different relation among the workers and architectonics shapes more compatible with those materials and techniques and preoccupations to the work, better saying, to the relations that were taking place in the industry of civil construction, meaning in the site construction. In this sense becomes extremely important the relation between the architect and the main historical facts that were taking place in those times and consequently influenced his production, such as his political engagement to the PCB, the 1964 military taking over the political power, the critics to the political thinking of the party and the further break up, his relationship with the intellectuality and the consequences of the militaries persecutions and arrestments, including his own. The intention of this work is the establishment of an interlocution between concepts and work, verifying the common grounds and contradictions of this professional that set the rules for the Brazilian modern architecture.'
