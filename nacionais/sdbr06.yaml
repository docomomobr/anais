- id: 'sdbr06-030'
  title: Os Irmãos Roberto
  subtitle: poética urbana da forma e virtuosismo do elemento
  authors:
  - givenname: Fabiana Geneoso
    familyname: De Izaga
    email: null
    affiliation: null
    orcid: '0000-0001-5375-4859'
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'Os Irmãos Roberto fazem parte do primeiro grupo de arquitetos que opera as transformações para a estética e espaço modernos na cidade do Rio de Janeiro no início do século XX. Apresentam uma produção significativa, caracterizada principalmente por suas propostas para o programa do edifício urbano comercial e residencial, e pela noção da importância da relação do edifício com a paisagem natural. Destacam-se também pelo cuidadoso e habilidoso desenvolvimento de elementos de proteção contra insolação, os brises-soleil. A sua produção evidencia seu lugar de destaque no quadro da Arquitetura Moderna Brasileira ao efetivar uma passagem importante de um quadro complexo de influências para uma realidade local.'
  keywords:
  - Arquitetura Moderna Brasileira
  - Rio de Janeiro
  - Escola Carioca
  abstract_en: 'The Roberto Brothers take part of the first group of architects that undertake the transformations to modern space and aesthetics in the beginning of the 20th century in the city of Rio de Janeiro. They present a consistent work, which is mainly characterized by the proposals for the urban building, commercial and residential, and for the notion of the importance of the relation of the building with the natural landscape. They are also known by their careful development of elements of protection against the sun, the brises-soleil. Their work evidences their prominent place in Brazilian Modern Architecture as they effectuate an important passage of a complex theoretical framework to a local reality.'
