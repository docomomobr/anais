- id: 'sdbr06-009'
  title: Análise arquitetônica de uma residência moderna na cidade de João Pessoa/PB
  authors:
  - givenname: Carolina
    familyname: Costa
    email: null
    affiliation: null
    orcid: '0000-0001-7571-9341'
    bio: null
    country: BR
    primary_contact: false
  - givenname: Raoni
    familyname: Lima
    email: null
    affiliation: null
    orcid: '0000-0003-2527-1758'
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'Este artigo tem o objetivo de analisar a arquitetura de uma residência moderna, construída no ano de 1968, com projeto de Acácio Gil Borsói, na cidade de João Pessoa/PB. Primeiramente, é realizada a contextualização do objeto no processo de desenvolvimento da cidade. Em seguida, são analisados separadamente a implantação, composição volumétrica e organização espacial, a fim de investigar a função que cada parte cumpre, isolada e em conjunto com as demais. Ao longo do trabalho, são identificadas as características que prestam referência às propostas modernistas e é verificado sobre que aspectos as críticas à arquitetura moderna se aplicam.'
  keywords:
  - Arquitetura
  - Moderna
  abstract_en: 'This paper intends to study the architectural aspects of a modern house, built in 1968, designed for Acácio Gil Borsói in the city of João Pessoa/PB. Firstly, we present the context of the object in the development process of the city. Secondly, we analyze separately the zoning in the site, volumetric composition and distribution of spaces, in a way to investigate the function of each part, isolated and combined with others. During this paper, we identify the modern aspects and if the criticism of some aspects of the modern architecture can be applied in the case studied.'
  keywords_en:
  - Architecture
  - Modern
  references:
  - 'BRUAND, Yves. Arquitetura Contemporânea no Brasil. São Paulo: Perspectiva, 2002.'
  - 'FRAMPTON, Kenneth. História Crítica da Arquitetura Moderna. São Paulo: Martins Fontes, 1997.'
