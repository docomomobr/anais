- id: 'sdbr06-028'
  title: A Modernidade das salas de cinema do Recife
  authors:
  - givenname: Isabella Leite
    familyname: Trindade
    email: null
    affiliation: null
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  section: A preservação e o moderno
  abstract: 'No início do século XX, quando começam a surgir as primeiras salas de cinema a palavra de ordem era modernizar. Era necessário um ‘cenário’ atraente para se adequar a essa metrópole moderna com os novos espaços públicos dentro dos padrões civilizados. Um dos símbolos dessas transformações da cidade moderna, sem dúvida, foram as salas de cinema, com sua arquitetura expressiva, volumes puros, sem ornamentação historicista, os letreiros luminosos, sinônimo de modernidade e progresso. O presente trabalho trata de como a arquitetura das salas de cinema revelavam uma modernidade sobretudo a arquitetura dos cinemas de bairro e como a decadência dos cinemas levou a destruição de parte deste acervo desta arquitetura.'
  keywords:
  - arquitetura moderna
  - cinema
  - preservação
  abstract_en: 'When the first movies’s theatres appears, in the beginning of the 20th century, it should reveal the latest architecture. The theatres should be an actrative place to a modern metropolis that was coming into sigth, and suitable to new standards of the urban spaces. Hence, it’s architecture should be a reflection of this modernity and progress, with characteristics such as an expressionism forms, rectangular volumes, ornamental-free formal language. This paper lies on how the architecture of the movies theatre reveal a modernity, specially in the neighbourhood’s theatre and how these theatres had been destroied through the last years.'
  keywords_en:
  - Modern architecture
  - movies theatre
  - preservation
  references:
