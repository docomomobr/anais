- id: 'sdbr06-021'
  title: Plástica e Tradição
  subtitle: uma aproximação entre Lucio Costa e Fernando Távora
  authors:
  - givenname: Felipe de Souza
    familyname: Noto
    email: null
    affiliation: null
    orcid: '0000-0001-9927-9037'
    bio: null
    country: BR
    primary_contact: false
  section: A preservação e o moderno
  abstract: 'Lucio Costa e Fernando Távora desenvolveram métodos de projeto que coincidem no apelo à tradição para a criação de arquitetura Moderna. O que revela este trabalho são dois desdobramentos deste método: o primeiro recorre a símbolos que representam tanto a tradição como a Modernidade e que, lidos ao mesmo tempo, realizam a pretendida integração dos dois momentos; o segundo parte para um complexo trabalho de síntese em que a construção Moderna, tomando parte em um contexto construído de importância histórica, recria o processo gerador daquele espaço, constituindo um conjunto em que coexistem de maneira não hierárquica as construções novas e as que são essencialmente a tradição. Como leitura desses dois processos, o que se revela é, no fundo, uma determinação em realizar a arte em arquitetura, isto é, em consolidar a intenção plástica na obra construída.'
  keywords:
  - Arquitetura Moderna
  - Tradição
  - Plástica
  abstract_en: 'Lucio Costa e Fernando Távora had developed project methods that have in common the claim for tradition to create Modern architecture. This paper tells us about two unfoldings of this coincident method: the first one use traditional or Modern represetative simbols, that, when traduced at the same time, carry the intended integration of two moments out; the second one goes for a complex work os synthesis in which Modern construction, taking place in a historical built context, recreates the process that´s generated that space, building a new situation where coexist, in a not hierarchic way, Modern architecture and the ones considered tradition. By comprehending both processes, shows up a wish to cary art out of architecture, to set plastic intention in the building.'
