    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'Este trabalho enfoca os primórdios da verticalização residencial na cidade de São Paulo, destacando a introdução dos princípios modernos de moradia vertical e o papel de alguns arquitetos modernistas em sua afirmação. No momento em que se defrontavam diferentes visões a respeito do adensamento urbano e dos arranha-céus, e surgiam também os marcos legislativos que balizariam a construção de prédios, a arquitetura racionalista permitiu conciliar o aproveitamento intensivo do solo e a provisão de espaços de qualidade, trazendo uma estética coerente com as aspirações de modernidade urbana, industrial e metropolitana que legitimavam o recurso à moradia em altura. Nesse quadro destaca-se, já na década de 1930, as realizações pioneiras de Rino Levi (Edifício Columbus) e Álvaro Vital Brazil (Edifício Esther).'
  keywords:
  - arquitetura
  - modernismo
  - edifícios residenciais
  abstract_en: 'The present paper focuses on the introduction of high-rise residential buildings in the city of São Paulo, and on the role of modernist architecture in their affirmation as a viable housing solution. At a moment when different vision of skyscrapers and urban density were being debated, and a legal framework regulating vertical building was established, rationalist architecture managed to reconcile the intensive use of urban plots with the provision of highquality living spaces, launching a new visual aesthetic in accordance with then current aspirations of modernity in its urban, metropolitan and industrial aspects, validating the option for high-rise apartment buildings. Dating from the 1930s, two pioneering examples are discussed: the Columbus building by Rino Levi and the Esther building by Álvaro Vital Brazil.'
  keywords_en:
  - architecture
  - modernism
  - residential buildings
