- id: 'sdbr06-007'
  title: A visão estrangeira sobre a arquitetura brasileira nos anos 1950
  authors:
  - givenname: Antônio Renato
    familyname: Guarino Lopes
    email: null
    affiliation: null
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  section: A construção da história
  abstract: 'Nos anos de 1953 e 1954 vieram ao Brasil cinco arquitetos estrangeiros que escreveram textos críticos sobre a arquitetura brasileira. Dentre estes, foi o arquiteto e artista suíço Max Bill, devido ao caráter contundente de suas críticas, aquele cujo discurso gerou maior polêmica e atraiu maior atenção por parte dos arquitetos, críticos e a imprensa local. No entanto, os outros quatro arquitetos, o alemão Walter Gropius, o italiano Ernesto Nathan Rogers, o japonês Hiroshi Ohye e o inglês Peter Craymer, mesmo se tocando em pontos negativos característicos da produção arquitetônica brasileira, expuseram de forma mais moderada seus pensamentos, oferecendo um painel que ajuda a compreender a justeza ou não das críticas de Max Bill. Aspectos como o formalismo excessivo e a negligência por parte dos arquitetos brasileiros frente aos aspectos sociais do país foram abordados nestas críticas. Os comentários correspondiam a temas anteriormente discutidos entre os arquitetos locais e, ao intensificar o debate crítico interno, foram importantes para o posterior desdobramento da arquitetura brasileira. Serão analisados neste texto aspectos presentes no texto destes quatro arquitetos.'
  keywords:
  - Crítica
  - Arquitetura
  - Gropius
  abstract_en: 'Five foreign architects - the Swiss Max Bill, the German Walter Gropius, the Italian Ernesto Nathan Rogers, the Japanese Hiroshi Ohye and the English Peter Craymer - came to Brazil in 1953 and 1954 and wrote criticisms on Brazilian modern architecture. Among them, architect and artist Max Bill wrote the most polemical criticism and attention turned to him. The four other architects, even when touching negative aspects of Brazilian architecture, took a more moderate way, which might help to understand how fair Bill''s criticism was. Aspects as excessive formalism and an architecture devoid of social responsibility were developed in those criticisms. The discussion of these themes, already performed among local architects, enhanced the internal debate and, therefore, the development of architecture itself. This text analyses aspects in the criticisms wrote by those four architects.'
