- id: 'sdbr06-037'
  title: A obra de Severiano Porto na Amazônia
  authors:
  - givenname: Leticia de Oliveira
    familyname: Neves
    email: null
    affiliation: null
    orcid: '0000-0002-5935-911X'
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'O artigo realiza uma investigação histórica do período em que o arquiteto Severiano Mário Porto produziu sua arquitetura, com o objetivo de contextualizar suas obras, de acordo com os acontecimentos políticos, econômicos e sociais do período e as tendências arquitetônicas da época, tanto brasileiras como mundiais. A abordagem se dá por décadas, abrangendo desde o período de sua formação, na década de 1950, até a década de 1990, quando ele reduziu suas atividades de projeto e fechou seu escritório em Manaus-AM. Através disto, procura mostrar que a obra do arquiteto é fruto de experiência única vivida na região amazônica, e não deve ser inserida em um determinado rótulo ou escola arquitetônica.'
  keywords:
  - Região amazônica. Arquitetura regional
  abstract_en: 'The article presents an historical investigation of the period when the Brazilian architect Severiano Porto produced his architecture. Aims to contextualize his work by the political, economical and social happenings of the period, and also the Brazilian and world architectonical inclinations of the time. The work is divided in decades, including since 1950, period of his graduation, till 1990, when he reduced his work activities and closed his office in Manaus-AM. Finally, shows that the architect’s work is the result of a single experience lived in the Amazonian region, and mustn’t be included in certain label or architectonic school.'
  keywords_en:
  - Amazonian region. Regional architecture
