- id: 'sdbr06-053'
  title: A flexibilidade da planta livre moderna para novos usos
  authors:
  - givenname: Renato Luiz Sobral
    familyname: Anelli
    email: 'anelli@exemplo.com'
    affiliation: null
    orcid: '0000-0002-2036-5897'
    bio: null
