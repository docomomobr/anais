  - 'AMORIM, Luiz Manuel do Eirado Amorim. Arquitetura-Pernambuco In: Pernambuco 5 décadas de Arte. Coord. André Rosemberg. Recife: Quadro Publicidade e Design Ltda., 2003. 224p. pp.59-125.'
