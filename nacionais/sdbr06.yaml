- id: 'sdbr06-055'
  title: Modernismo e urbanidade
  subtitle: os pioneiros da moradia vertical em São Paulo
  authors:
  - givenname: René
    familyname: Galesi
    email: 'galesi@exemplo.com'
    affiliation: null
    orcid: null
