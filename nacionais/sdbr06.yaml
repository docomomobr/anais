- id: 'sdbr06-043'
  title: 'O moderno regional?'
  subtitle: considerações sobre um patrimônio em extinção
  authors:
  - givenname: Marcos Paulo
    familyname: Cereto
    email: 'cereto@exemplo.com'
    affiliation: null
    orcid: '0000-0002-2320-5741'
    bio: null
    country: BR
    primary_contact: false
  section: A preservação e o moderno
  abstract: 'O ensaio estuda a obra do Arquiteto Severiano Mário Porto com destaque na produção arquitetônica brasileira no século XX, com enfoque para o período da implantação da Zona Franca de Manaus. Resgata sua obra como ponto de partida para um discurso modernista com raízes locais. Identifica as principais obras e alerta com pesar a demolição de alguns edifícios premiados, evidenciado a necessidade de preservação do patrimônio moderno. Apresenta a necessidade de preservação diferenciada para edificações com condicionamento natural para clima tropical úmido. Gera um ponto de partida para a discussão sobre o patrimônio moderno manaura em extinção.'
  keywords:
  - Arquitetura Moderna
  - Arquitetura em Manaus
  - Severiano Porto
  abstract_en: 'The essay studies the workmanship of Architect Severiano Mário Port with prominence in the production Brazilian architectural in century XX, with approach for the period of the implantation of the Zona Franca of Manaus. It rescues its workmanship as starting point for a modernist speech with local raízes. It identifies the main workmanships and alert with weighing the demolition of some buildings awardees, evidenced the necessity of preservation of the modern patrimony. It presents the necessity of preservation differentiated for constructions with natural conditioning for humid tropical climate. Manaura in extinguishing generates a starting point for the quarrel on the modern patrimony.'
  keywords_en:
  - Modern Architecture
  - Architecture in Manaus
  - Severiano Porto
