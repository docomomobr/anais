- id: 'sdbr06-005'
  title: Arquitetos imigrantes no Brasil
  subtitle: uma questão historiográfica
  authors:
  - givenname: Anat
    familyname: Falbel
    email: 'falbel@exemplo.com'
    affiliation: null
    orcid: '0009-0009-3934-9537'
    bio: null
    country: BR
    primary_contact: false
  section: A construção da história
  abstract: 'Nos últimos anos intensificaram-se os estudos sobre a atuação dos imigrantes nos mais diversos campos da expressão artística - das artes até a literatura passando pela arquitetura. Identificados como agentes no processo de construção da modernidade dos países latino americanos, sua participação marcou ainda o empresariado industrial, e a esfera pública através da política. Nesse contexto, a contribuição dos arquitetos imigrantes ainda é matéria recente da historiografia da arquitetura brasileira, que permaneceu, até os inícios da década de 1980, circunscrita principalmente aos seus personagens principais ligados a Escola Carioca. Associados a investidores nacionais e estrangeiros, os arquitetos imigrantes foram agentes importantes na transformação da paisagem dos grandes centros urbanos do Brasil, exercendo sua influência na formação de duas gerações de arquitetos, entre os anos de 1950 e 1960, seja através das atividades didáticas exercidas nas principais escolas do país, seja nos escritórios de arquitetura, nos quais iniciaram dezenas de jovens arquitetos recém formados. O presente texto pretende sugerir algumas hipóteses referentes ao diálogo que envolveu arquitetos nacionais e imigrantes e sua influência sobre a historiografia durante a intensa fermentação cultural que se deu entre as décadas de 1930 e 1950, sob o governo autoritário e populista do Estado Novo, e aqueles que seguiram a sua ótica de uma cultura de massas.'
  keywords:
  - arquitetos
  - imigrantes
  - historiografia
  abstract_en: 'The last years testify the escalation of the studies concerning the interaction of the immigrants in Latin America in the most diverse fields of the artistic expressions – from arts to literature, also including architecture. Identified as agents in the construction of our modernity their presence stamped the industrial development of Latin American countries, and their involvement reached the public realm through politics. In this context, the awakening for the contribution of the immigrants architects is a recent topic of the historiography of the Brazilian Modern architecture that till the beginning of the 80’s remain specially confined to a restricted number of persona related to the Carioca School. Associated with Brazilian and foreigner investors the immigrant architects play an outstanding role in the transformation of the Brazilian urban centers’ landscape, and exerted their influence over two generations of architects between the 1950s and 1960s, to whom they teach in the main architecture schools of the country and whom they also introduced in the professional life in their own architecture offices. This text’s purpose is suggests some hypothesis regarding the dialogue forged between nationals and foreigners and its influences over the architectural historiography during the intense cultural fermentation period that took place between the decades of 1930 and 1950, during the dictatorial and populist government of the Estado Novo, and those who proceed with his mass culture political perspective.'
