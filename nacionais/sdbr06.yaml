- id: 'sdbr06-045'
  title: Lucio Costa e a Escola Nacional de Belas Artes
  authors:
  - givenname: Maria Lúcia
    familyname: Bressan Pinheiro
    email: null
    affiliation: null
    orcid: '0000-0001-6269-8756'
    bio: null
    country: BR
    primary_contact: false
  section: A construção da história
  abstract: 'O presente trabalho pretende abordar um episódio da maior importância para o devir do Movimento Moderno no Brasil: a meteórica passagem de Lúcio Costa pela diretoria da Escola Nacional de Belas Artes (ENBA), entre 1930 e 1931. Não bastasse o significado do episódio em si, sobejamente destacado em depoimentos de arquitetos considerados pioneiros da arquitetura moderna brasileira, ele implica em questionamentos sobre outro fenômeno fundamental do período: o engajamento – até então imprevisível - de Lúcio Costa entre os partidários do modernismo arquitetônico. Por outro lado, ambos os aspectos da questão apresentam-se surpreendentemente carentes de pesquisas aprofundadas. Assim, procuraremos contribuir para o esclarecimento das muitas lacunas existentes, apresentando alguns resultados de pesquisa empreendida com auxílio FAPESP em fontes primárias livros de registros e de atas da própria ENBA -, complementados por artigos de revistas e jornais de época.'
  keywords:
  - modernismo
  - história da arquitetura brasileira
  - neocolonial
  abstract_en: 'The following paper intends to discuss a very important episode for the outcome of the Modern Movement in Brazil – namely, the short period during which Lucio Costa was nominated director of Escola Nacional de Belas Artes (ENBA) - the School of Architecture of Rio de Janeiro -, between 1930 and 1931. Besides the importance of the episode in itself, which has been frequently pointed by architects considered to be the pioneers of Brazilian modern architecture, it also raises some questions about another fundamental fact of the same period: the unforeseen, sudden engagement of Lúcio Costa in modernism. Surprisingly, the manifold aspects of these developments still lack further understanding. Therefore, the results of recent research work carried out in primary sources – registers and official documents of ENBA – complemented with newspaper and magazine articles of the period will be presented. The studies were sponsored by FAPESP, the State of São Paulo Research Funding Agency.'
  references:
  - 'Architecture Internationale Moderne. Expositions Internationales d’Anvers et de Liège. Paris : Éditions d’Art Charles Moreau, s/d.'
