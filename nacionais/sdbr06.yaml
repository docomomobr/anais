  section: A preservação e o moderno
  abstract: 'As obras de recuperação dos edifícios construídos de 1947 a 1953 no campus da Fundação Oswaldo Cruz em Manguinhos, e que hoje compõem parte do acervo modernista desta instituição, foram iniciadas em meados da década de 1990. Entretanto, estas primeiras obras ocorreram em função de uma demanda de serviços que não contemplavam sua restauração estilística, o que motivou o pedido de tombamento, como forma de salvaguarda e proteção patrimonial. Em novembro de 2004 foi iniciada a obra de reforma mais completa do Refeitório Central, um dos edifícios contemplados pelo tombamento, a cargo da Diretoria de Administração de Obras (DIRAC) com supervisão do Departamento de Patrimônio Histórico (DPH). Este projeto que ora se realiza, com previsão de término ainda para 2005, ou mesmo para os primeiros meses de 2006, representa uma primeira etapa de um projeto global que pretende devolver ao edifício sua unidade estética original. O que objetivamos com este trabalho é mostrar o final da primeira etapa de execução dos serviços de restauração deste pavilhão, projetado por Jorge Ferreira, da equipe de arquitetos da Divisão de Obras do Ministério da Educação e Saúde.'
  keywords:
  - preservação patrimonial
  - arquitetura moderna
  - Rio de Janeiro
  abstract_en: 'The repairs of the buildings constructed from 1947 to 1953 in the Campus of the Fundação Oswaldo Cruz in Manguinhos neighborhood, in Rio de Janeiro, which are part of the modernist monuments of that institution, started in the middle nineties. However, those first repairs took place following a service order that did not observe their stylistic restoration. This fact led to a request to consider those buildings as listed ones, as a way of shielding and protecting the patrimony. On November 2004 a broader repair of the Main Restaurant (Refeitório Central), which was considered as one of the listed buildings, in charge of the Diretoria de Administração de do Campus (DIRAC), the Administrative Boarding, was initiated under the supervision of the Departamento do Patrimônio Histórico (DPH) the Historical Heritage Department. This project, now under development, with the conclusion foreseen in this very year of 2005 or on the first months of 2006, stands for the first stage of a global project which intends to bring the building back to its original aesthetic unity. With this present work, we are aiming to show the results of the first stage of this pavilion repairs, designed by Jorge Ferreira, from the staff of architects of the Divisão de Obras do Ministério de Educação e Saúde (Architectural and Engeneering Division of the Education and Health Ministry).'
