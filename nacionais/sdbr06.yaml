- id: 'sdbr06-044'
  title: A afirmação de uma feição nacional e outros caminhos
  authors:
  - givenname: Maria Alice
    familyname: Junqueira Bastos
    email: null
    affiliation: null
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  section: A construção da história
  abstract: 'Trata-se de uma reflexão acerca de alguns aspectos da arquitetura brasileira que foi produzida num recorte histórico de aproximadamente vinte anos: entre o final dos anos 50 e final dos 70. O trabalho enfoca, por um lado, a orientação crítico teórica dominante no período, responsável pela afirmação de uma arquitetura moderna “oficial” brasileira, e seus esforços em defender uma identidade nacional baseada no uso do concreto armado dentro da sua expressividade plástica e, por outro, um dos caminhos ao longo dos quais a prática mostrou uma renovação no período e que não foi devidamente avaliado na ocasião.'
  abstract_en: 'The aim of the study is a reflection about some aspects of the architecture produced in Brazil from the mid- to late-fifties and the mid-seventies. The work focus, on the one hand, the main critical and theoretical orientation, responsible for the affirmation of an official Brazilian modern architecture, and its efforts to defend a national identity based upon the plastic expressive use of the reinforced concrete and, on the other hand, one of the paths along with the practice showed a renewal, which wasn’t corrected valued at the time.'
