- id: 'sdbr06-023'
  title: 'Urbanismo, Modernidade e projeto nacional'
  subtitle: reflexões em torno do Plano Agache
  authors:
  - givenname: Fernando Diniz
    familyname: Moreira
    email: 'fmoreira@hotlink.com.br'
    affiliation: null
    orcid: '0000-0002-1387-4036'
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'Enquanto que urbanismo na Europa nasceu no bojo de um processo de modernização e reforma social, no Brasil ele encontrou um país que não era verdadeiramente urbano e industrial. Portanto, teorias européias desenvolvidas em resposta à modernização chegaram ao Brasil antes que a modernização acontecesse. Este descompasso levanta uma série de questões. Se tomarmos como verdadeira a recorrente afirmação que a modernização brasileira é incompleta, já que as elites locais procuraram modernizar o país sem uma correlata transformação na estrutura social, pode-se argumentar que o urbanismo, assim como fábricas, redes de transportes e arranha-céus, assumiu uma natureza marcadamente simbólica. Argumentamos que o projeto do urbanismo no Brasil procurou criar espaços para uma sociedade moderna que ainda não existia, terminando por reduzirse à imagens fragmentadas de modernidade. Não obstante, muitas dessas imagens sugerem uma forma de comportamento para as futuras massas brasileiras e são reveladoras sobre as concepções que a sociedade brasileira detinha para seu futuro. Este texto reflete sobre estes temas tomando como exemplo o plano de Alfred Agache para o Rio de Janeiro, elaborado entre 1928 e 1930. O plano Agache foi um marco na evolução do urbanismo brasileiro e um dos exemplos máximos do urbanismo defendido pela Societé Française des Urbanistes (SFU). Seu objetivo era resolver os problemas funcionais do Rio de Janeiro, dar-lhe uma feição de capital e incutir na mente de seus habitantes um ideal social de vida moderna, sem descurar de requerimentos funcionais, como zoneamento e tráfego. Além de uma análise do processo de contratação de Agache e de seu relacionamento com as elites locais, que são bastante ilustrativos da discussão entre nacionalismo e internacionalismo, a ênfase recairá sobre os grandes espaços urbanos projetados por Agache, a Entrada do Brasil e a Praça do Castello.'
  keywords:
  - Urbanismo
  - Projeto Nacional
  - Rio de Janeiro
  abstract_en: 'Urbanism was born in the midst of a social modernization context in Europe, but in Brazil it found a country which was neither urban nor industrial. Therefore, European theories that were developed in response to modernization began arriving in Brazil even before the country’s actual political and social modernization. This gap provokes many questions. If we accept that Brazilian modernization is incomplete, as local elites attempted to modernize the country without transforming its social structure, we can argue that urbanism− as well as factories, networks of transportation and skyscrapers − acquired a patently symbolic nature. My argument is that the project of urbanism attempted to create spaces for a modern society that did not exist yet, reducing itself to fragmentary images suggesting modernity. However, these images suggested a way of behaving for the future Brazilian masses and illuminates the conceptions Brazilian society held for its future. This paper reflects on these topics taking into consideration Alfred Agache’s plan for Rio de Janeiro, elaborated between 1928 and 1930. This plan was a hallmark in the evolution of Brazilian urbanism and one of the best examples of the urbanism proposed by the Societé Française des Urbanistes (SFU). Its objective was to solve the city’s functional problems, to provide it with an expression of a capital, and to inculcate Rio’s inhabitants with a social ideal of modern life, while still considering functional requirements, such as zoning and traffic. In addition to the analysis of the commissioning of Agache and his relationship with local elites, I will emphasize the great urban spaces designed by Agache, the Gateway of Brazil and the Castello Square.'
