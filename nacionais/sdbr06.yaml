- id: 'sdbr06-052'
  title: Ideologia moderna de uma civilização do projeto
  authors:
  - givenname: Pedro da Luz
    familyname: Moreira
    email: null
    affiliation: null
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'As idéias aqui apresentadas pretendem discutir a inserção dos arquitetos, como ideólogos do habitar, em nossa sociedade contemporânea a partir de sua prática de projeto. Nesta prática cada vez mais interagem atores e intermediações diferenciadas, fazendo do projeto um processo inserido num contexto social concreto. Dentro destas interações os conceitos, civilização e modernidade cumprem um papel relevante, que precisa ser discutido, construído e aprimorado constantemente. O movimento moderno nacional possuía uma construção ideológica destas duas premissas – civilização e modernidade – que foi capaz de conformar um projeto coletivo. As discussões travadas na academia, nos escritórios de arquitetura, na produção ideológica da própria cidade interagiram com a cultura geral do construir no Brasil, com a cidade genérica e anônima que então se expandia. Em nossa atual condição de país urbano é absolutamente prioritário voltar a discutir os conceitos de modernidade e civilização para promover uma nova conciliação da sociedade em torno da questão de seu habitat. Neste presente os papéis desempenhados tanto pela modernidade, quanto pela civilização parecem variar de uma maneira que pretende reinstituir uma impossibilidade de antevisão do futuro. A discussão dos significados de moderno e civilização assumem um papel fundamental neste contexto, capaz de fazer retornar arquitetos e urbanistas a uma atitude ao mesmo tempo crítica e operativa, capaz de influir sobre um campo tão vasto como o habitar humano, de forma a promover a reversão do quadro de desalento e ao mesmo tempo contaminar a cidade genérica e impessoal. Não basta apenas criticar, mas também operar uma crítica que demonstre a viabilidade da civilização humana sobre o país. O arquiteto precisa ao mesmo tempo demonstrar precisão/adequação à realidade, mas principalmente capacidade de contaminar as mentalidades mais diversas para um projeto de futuro.'
  keywords:
  - 'Projeto – Moderno - Civilização'
  abstract_en: 'The ideas here presented intend to discuss the architects insert, as ideologists of inhabiting, in our contemporary society starting from his project practice. In this practice actors and differentiated intermediations interact more and more, doing a process of the project inserted in a concrete social context. Inside of these interactions the concepts of civilization and modernity accomplish a relevant paper, that needs to be discussed, built and constantly perfected. The national modern movement possessed an ideological construction of these two premises civilization and modernity - that was capable to conform a collective project. The discussions locked in the academy, in the architecture offices, in the ideological production of the own city they interacted with the general knowledge of building in Brazil, with the generic and anonymous city that then expanded. In our current condition of urban country it is quite priority discuss the modernity concepts and civilization to promote a new conciliation of the society around the subject of his habitat again. In this present the papers carried out so much by the modernity, as for the civilization they seem to vary in a way that intends an impossibility of the future. The discussion of the meanings of modern and civilization assumes a fundamental paper in this context, capable to do the return architects and town planners at the same time to an attitude critic and operative, capable to influence on a field as vast as inhabiting human, in way to promote the reversion of the discouragement picture and at the same time to contaminate the generic and impersonal city. It just is not enough to criticize, but also to operate a critic that demonstrates the viability of the human civilization on the country. The architect needs at the same time to demonstrate accuracy/appropriate to the reality, but mainly capacity to contaminate the most several mentalities for a future project.'
