- id: 'sdbr06-029'
  title: Mies van der Rohe no Brasil
  subtitle: 'projeto para o Consulado dos Estados Unidos em São Paulo, 1957-1962'
  authors:
  - givenname: Ítalo
    familyname: Galeazzi
    email: null
    affiliation: null
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'No arquivo Garland Mies van der Rohe do Museu de Arte Moderna de Nova York, estão publicados uma série de croquis, anotações e documentos técnicos, referentes ao projeto de 1957 de Mies van der Rohe para o consulado dos Estados Unidos em São Paulo. A análise e organização de todo material publicado no catálogo permitiram algumas conclusões importantes sobre a evolução das propostas e reconhecimento das decisões técnicasconstrutivas para o projeto do edifício consular. Através da análise do material gráfico, desde os primeiros croquis até as fases de detalhamento da proposta final, foram estabelecidas referências importantes com projetos já conhecidos de Mies, que certamente serviram de base para o projeto do arquiteto no Brasil. Como parte do processo analítico, redesenhou-se boa parte do projeto arquitetônico. A procura de referências em projetos desenvolvidos, simultaneamente, ou já existentes, permitiu aceder-se a uma esfera de relações “construtivas” já bastante referidas pela crítica durante anos, mas que nunca deixa de ser surpreendente, sobretudo porque se acredita que aí pode residir um dos grandes valores para o projeto arquitetônico.'
  keywords:
  - Mies van der Rohe
  - Brasil
  abstract_en: 'In the Mies van der Rohe’s Garland archive of the Museum of Modern Art of New York, is published a series of sketches, notes and technical documents, referring to the 1957 Mies van der Rohe’s project for the consulate of the United States in São Paulo. The analysis and organization of all material published in the catalogue, had allowed to some important conclusions about the evolution of the proposals and recognition of the techniqueconstructive decisions for the project of the consular building. Through the analysis of the graphical material, since the first sketches until the detailing phases of the proposal final, important references of already knew Mies’s projects had been established, that had certainly served as base for the project of the architect in Brazil. As analytical party to suit, good part of the project was redesigned architectural. The search for references in developed projects, simultaneously, or already existing, allowed to accede to a sphere of "constructive" relations already sufficiently related by the critical ones during years, but that never it leaves of being surprising, over all because it gives credit that there one of the great values for the project architectural can inhabit.'
  keywords_en:
  - Mies van der Rohe
  - Brazil
  references:
  - 'CARTER, Meter. Mies van der Rohe at work. London: Phaidon, 1999.'
  - 'GUIMARAENS, Ceça de. Lúcio Costa: um certo arquiteto em incerto e secular roteiro. Rio de Janeiro: Relume Dumara, 1996.'
  - 'LAMBERT, Phyllis. Mies in America, Montreal, New York: Canadian Centre for Arquitecture, Whitney Museum of American Art, 2001.'
