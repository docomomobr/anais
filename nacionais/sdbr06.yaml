- id: 'sdbr06-049'
  title: Arquitetura moderna em João Pessoa
  title_en: Modern Architecture in João Pessoa
  subtitle_en: The Local and Modern Memory of an International Movement
  authors:
  - givenname: Nelci
    familyname: Tinem
    email: 'ntinem@uol.com.br'
    affiliation: null
    orcid: '0000-0003-3202-0906'
    bio: null
    country: BR
    primary_contact: false
  - givenname: Lia
    familyname: Tavares
    email: null
    affiliation: null
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  - givenname: Marieta Dantas Tavares de
    familyname: Melo
    email: null
    affiliation: null
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  section: A preservação e o moderno
  abstract: 'O tema aqui proposto se enquadra tanto na sessão um como na sessão dois. Se por um lado, trata de um exemplo local das diversas aclimatações/adaptações regionais dos princípios gerais da arquitetura moderna, dando a dimensão da difusão desse movimento por todo o país, trata também do moderno como patrimônio nacional e é resultado de um trabalho conjunto desenvolvido na universidade no sentido de registrar, conservar, proteger, propor tombamento e elaborar projetos de restauração do patrimônio moderno da Paraíba. A proteção da arquitetura e dos sítios modernos, mais que os exemplares mais antigos, demorou a ser assimilada. Brasília foi a primeira a ser cogitada e a mais difícil de ser entendida pelo seu pioneirismo, pela sua ‘pouca idade’, pelas suas dimensões e por ser uma cidade jovem em plena atividade. Ainda hoje é difícil de falar em preservar o moderno, ainda não existe o ‘hábito’ de pensá-lo como patrimônio, principalmente em um país que, apesar das estatísticas, ainda se considera ‘jovem’. Mais difícil ainda é tratar desse tema nas cidades menores e mais periféricas. Até os anos 1950, as cidades conhecidas pela produção moderna, fora do eixo Rio de Janeiro, São Paulo e Minas Gerais eram, além de capitais como Recife e Salvador, exemplos isolados e circunstanciais, como Cataguazes. Nas duas últimas décadas cresce o número de trabalhos que resgatam a arquitetura moderna, nos mais diversos lugares do país, e aparecem arquitetos e engenheiros cuja produção merece registro. É o caso de Moacir Gomes e Arialdo Pinho em Natal, de Geraldino Pereira Duda em Campina Grande e de Clodoaldo Gouveia e Mário de Láscio em João Pessoa. Nesse sentido o objetivo desta comunicação é fazer um balanço dos trabalhos já realizados sobre arquitetura moderna na Paraíba e divulgar uma pesquisa em andamento que, a partir de uma listagem preliminar dos exemplares encontrados na cidade de João Pessoa, está realizando um inventário, que se consubstancia em registros gráficos, históricos e analíticos dessa produção.'
  keywords:
  - arquitetura moderna
  - preservação arquitetônica
  - inventário
  abstract_en: 'The subject proposed can be classified in the session one or two. If on the other hand, it deals with a local example of the diverse regional acclimatization and adaptation of the modern architecture general principles, giving the dimension of the diffusion of this movement for all the country, it also deals with the modern as national patrimony and is a result of a joint work developed in the university in the direction to register, to conserve, to protect, to consider falling and to elaborate Paraiba''s modern patrimony restoration projects. The protection of the architecture and the modern urban places, more than the oldest units, it delayed to be assimilated. Brasilia was first city to be cogitated for conservation and the more difficult subject of being understood by its pioneer condition, for its ‘little age’, for its dimensions and for being a young city in full activity. Still today it is difficult speaking about modern conservation, it is not used to think the modern as patrimony, mainly in a country that, despite the statistics, still is considered young. More difficult still it is to deal with this subject in the little and peripheral cities. Until the years 1950, the cities known for the modern production, except Rio de Janeiro, São Paulo and Minas Gerais, they were, beyond capitals as Recife and Salvador, isolated and circumstantial examples as Cataguazes. In the two last decades the number of works grows and rescue the modern architecture in most places of the country and reveals architects and engineers whose production deserves register, it is the case of Moacir Gomes and Arialdo Pinho in Natal, Geraldino Pereira Duda in Campina Grande and Clodoaldo Gouveia and Mário de Lascio in João Pessoa. In this direction the objective of this communication is to make a rocking of the works already carried through on modern architecture in Paraíba and to divulge a research in progress that, from a preliminary listing of the examples found in the city of João Pessoa, it is carrying through an inventory, that consists in graphical registers, descriptions and analytical papers of this production.'
  keywords_en:
  - modern architecture
  - architectural conservation
  - inventory
  references:
  - 'BRUAN, Yves. Arquitetura Contemporânea no Brasil. São Paulo, Perspectiva, 2003.'
