    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'A partir da pesquisa de fontes primárias dos arquivos do Instituto Lina Bo e P. M. Bardi, este estudo pretende interpretar o percurso de elaboração do projeto da “Casa de Vidro”. Documentos textuais e desenhos originais constituem as fontes analisadas. A seguir, a solução adotada é examinada em seus vários aspectos, confrontando as limitações de sua realização. Por fim, o trabalho busca explorar o sentido mais profundo da concepção da obra.'
  abstract_en: 'Starting from a research work developed at Instituto Lina Bo e P. M. Bardi, this paper tried to follow the “Casa de Vidro” designing itinerary. Textual documents and original drawings are the main sources examined. Focusing the final design, the result achieved is confronted to the conditions of its realization. Finally the research work tries to explore the very meaning of the “Casa de Vidro” conception.'
