- id: 'sdbr06-024'
  title: Modernidade arquitetônica e internacionalismo nos Trópicos
  authors:
  - givenname: Francisco Sales
    familyname: Trajano Filho
    email: 'sales@sc.usp.br'
    affiliation: null
    orcid: '0000-0003-3594-6878'
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'Diretoria de Viação e Obras Públicas (DVOP) entre 1936 e 1939. Subjacente a isso, está a intenção de investigar os percursos, projetuais e discursivos, trilhados pela arquitetura moderna no Brasil nos anos 1930, atentando para o que esta década guarda de peculiar enquanto momento de experimentação, marcado pela dispersão de iniciativas e a diversidade de posturas e manifestações de modernidade arquitetônica, em plena e acirrada disputa pelo espaço arquitetural. Longe de ser considerada um destino exótico onde surpreender obras extemporâneas de modernidade arquitetônica, pitorescas pelo inusitado das circunstâncias em que se realizaram, a Paraíba é vista como mais um lugar possível para observação dos embates travados em defesa da causa moderna na arquitetura, sua lógica, sentido e primazia, frente à necessidade de legitimidade sobre as demais propostas em disputa. Como mais um campo de teste em que se averiguar a validade universal dessa arquitetura; uma espécie de prova dos nove, agora, nessa “periferia da periferia”.'
  keywords:
  - 'Internacionalismo - Arquitetura tropical - Diretoria de Viação e Obras Públicas'
  abstract_en: 'This paper aims to analyze the Edifício Central do Instituto de Educação da Paraíba, designed and built by Diretoria de Viação e Obras Públicas (Transportation and Public Work Division) – DVOP – between 1936 and 1939. This analyzis is based on the peculiarities, ambiguities and contradictions of Modern architecture in the 1930s in Brazil, as well as the dilemmas which stem from the relations of this architecture with the particular characteristics of a tropical country. In addition, we aim to shed some light on the course of Brazilian Modern architecture – in terms of the design and the discourse – in the 1930s, a decade marked by a momentum of experimentation. This period was characterized by dispersed initiatives and a diversity of manifestations in the middle of disputes for the architectural space. Instead of considering Paraíba as an exotic destination of extemporal Modern buildings – picturesque for the unexpected way in which they arise – we rather see it as another place where to observe the debates in favour of Modern architecture, its logics, meanings and primacy, in the needs of legitimating itself against other proposals. Paraíba is, therefore, seen as an important field-test for a universal validity of Modern architecture, now in the “fringe of the periphery”.'
