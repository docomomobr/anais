- id: 'sdbr06-033'
  title: O Movimento Moderno e a arquitetura residencial de Florianópolis
  authors:
  - givenname: Josicler Orbem
    familyname: Alberton
    email: 'arquiteta.josicler@yahoo.com.br'
    affiliation: null
    orcid: '0000-0001-8645-2013'
    bio: null
    country: BR
    primary_contact: false
  - givenname: Carolina Palermo
    familyname: Szücs
    email: null
    affiliation: null
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  section: A preservação e o moderno
  abstract: 'Passadas algumas décadas, é possível afirmar que o Movimento Moderno marcou de fato a história da arquitetura e que tal influência tem importância inquestionável. As primeiras discussões modernistas tratavam da questão habitacional e já na década de 20, chegou-se a padrões de moradia que visavam novos processos construtivos, voltados à realidade industrial da época. Este novo modo de ver a habitação chegou rápido ao Brasil e teve boa aceitação entre os profissionais da época que passaram a aplicar preceitos da arquitetura modernista que surgia na Europa. A nova arquitetura, em poucas décadas, estava presente em muitos lugares do Brasil e não tardou a chegar a Florianópolis, onde foram construídos, já na década de cinqüenta, importantes prédios públicos cujos projetos apresentavam muitos princípios modernistas. Ainda nesta década apareceram os primeiros projetos residenciais que buscavam os conceitos da casa funcional e que na Ilha1 foram aplicados na arquitetura intimista das residências dos mais abastados, que eram as pessoas voltadas a tudo que havia de moderno da época. O presente trabalho procura destacar alguns exemplares de residências unifamiliares, localizados na área central de Florianópolis, cujos projetos foram construídos nas décadas de 50, 60 e 70 e que retratam a arquitetura modernista residencial que foi realizada na cidade. O objetivo é resgatar a importância destes projetos para Florianópolis não só pelo que representam historicamente, mas também por constituir um registro importante que retrata a difusão da arquitetura modernista no país, feita da forma possível e não da maneira que se pretendia.'
  keywords:
  - Movimento Moderno
  - arquitetura residencial
  - Florianópolis
  abstract_en: 'A few decades after the Modern Moviment, we can assure it has been extremely remarkable to the history of architecture, and the importance of such influence is unarguable.'
