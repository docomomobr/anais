- id: 'sdbr06-002'
  title: Um estudo sobre o mestre Artigas e o aprendiz Jorge Caron
  authors:
  - givenname: Amanda Saba
    familyname: Ruggiero
    email: 'ruggiero@exemplo.com'
    affiliation: null
    orcid: '0000-0001-8483-0359'
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'Nas décadas de 50 e 60 a Faculdade de Arquitetura e Urbanismo de São Paulo foi ambiente disseminador de uma série de princípios éticos e estéticos, tendo a figura do mestre João Batista Vilanova Artigas como eixo difusor e grande condutor destes ideais. A tese de Artigas se referenciava na responsabilidade social do arquiteto, que vislumbrava como seu instrumento de emancipação política e ideológica o conceito do projeto e do desenho. Os textos de Vilanova Artigas analisados aqui são discursos de formatura escritos em 1955, 1958 e 1964, dirigidos diretamente aos seus alunos, futuros arquitetos. O interesse é ressaltar as principais idéias e preocupações que nortearam as palavras do mestre paraninfo aos jovens arquitetos, além de elucidar sua contribuição ao debate da formação entre estudantes, profissionais e especialistas. Aluno e estagiário de Artigas, o arquiteto Jorge Caron (1936/2000) respondeu ao perfil do "arquiteto completo" idealizado por este grupo da FAU-USP, trabalhou como arquiteto e urbanista, educador, paisagista, designer, cenógrafo, cineasta e agitador cultural, sem dúvida alguma foi personagem de fundamental importância, tendo trabalhado intensamente no campo constitutivo deste rico ambiente de luta pela formação cultural do país. É muito provável que Caron comportou-se como ouvinte de Artigas em alguns momentos destes discursos. Trata-se aqui de traçar as relações existentes nos textos de Jorge Caron e nos discursos de Vilanova Artigas, em que ambos discutem a profissão, o trabalho e a organização dos arquitetos, procurando identificar e entender as posições convergentes, comuns e assimiladas diretamente do mestre para o aprendiz. É interessante notar e compreender alguns desdobramentos, e certos avanços na temática muito discutida e polemizada: o campo de atuação do arquiteto.'
  keywords:
  - Mestre
  - 'Ensino de Arquitetura (FAU-USP)'
  - Jorge Caron
  abstract_en: 'During the years of 1950 and 1960, the Faculty of Architecture and Urbanism of Sao Paulo (FAU-USP) was a scattering center of some ethics and esthetics principles, guided by the master João Batista Vilanova Artigas as diffuser and great leader of these ideals. Artigas’ thesis was based on the architect social responsibility that looked for the concept of project and design as instrument of politic and ideology emancipation. The texts of Vilanova Artigas considered here are speeches written to his students, future architects, in 1955, 1958 and 1964. The point is to stand out the main ideas and concerns that had guided the words of the master paranymph to the young students, besides explain his contribution to the debate of the formation of students, professionals and specialists. Student and trainee of Artigas, the architect Jorge Caron (1936/2000) is the profile of the “complete architect” idealized by this group from FAUUSP. He worked as an architect and urban planner, educator, landscape worker, designer, scenographist, movie director and cultural agitator. He was undoubtly an important professional, having worked intensely for the cultural formation of this country. At some moments of these speeches, Caron behaved as a listener of Artigas. In this work, we study the existing relations between the texts of Jorge Caron and the speeches of Artigas, focusing in the profession, work and architects organization. We try to identify and understand the converging point of view absorbed directly from the master to the apprentice. It is also interesting to notice developments and advances in the very argued thematic: the architect activity field.'
