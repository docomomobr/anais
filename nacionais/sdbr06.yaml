- id: 'sdbr06-027'
  title: A leitura do ambiente urbano e a construção de uma identidade nacional
  authors:
  - givenname: 'Inês El-Jaick'
    familyname: Andrade
    email: 'andrade@exemplo.com'
    affiliation: null
    orcid: '0000-0001-9012-6421'
    bio: null
    country: BR
    primary_contact: false
  section: A preservação e o moderno
  abstract: 'A permanência do patrimônio cultural construído é uma fonte muito rica de leitura e de análise histórica. A interpretação do que é representativo culturalmente estará sempre relacionada à época e aos agentes (elite intelectual, Estado, grupos étnicos marginalizados) envolvidos no processo. Neste contexto, os processos de tombamento (1938) constituem uma prática muito significativa da política de preservação, bem como registro dos confrontos e conflitos de interesse da sociedade civil brasileira. Na chamada fase heróica (1938-1960) do Instituto do Patrimônio Histórico e Artístico Nacional, os agentes autorizados do patrimônio nacional contribuíram na construção de uma tradição brasileira com base na noção moderna de progresso e nacionalismo. O objetivo deste artigo é investigar nos processos de tombamento federal de jardins e parques públicos da cidade do Rio de Janeiro os conflitos de interesse político, econômico e ideológico que pontuaram as medidas de preservação desde a implantação do serviço de preservação no Brasil.'
  keywords:
  - 'patrimônio cultural- identidade nacional - jardim histórico'
  abstract_en: 'The building heritage wich has reached us through time should be considered by its richness value, as a testimony wich is a mural history of humanity wich all can read. The different interpretations of the heritage have their roots in the culture of the time and reflects the principles and reality of its society context. Therefore, the brazilian legislation of cultural heritage (1938) is a important framework wich also deals with confront and conflict of different natures. The practices of the preservation experts, of the early years (1938-1960) of the creation of the National Commitee of Historical and Artistic Heritage, will establish the brazilian identity with the combined of the international modern style concept of progress and nationalism. The goal of this paper is to understand the political, economic and ideal conflicts wich have guided the cultural heritage policies in historic garden in Rio de Janeiro.'
  keywords_en:
  - 'cultural heritage - national identity - historical garden'
  references:
  - 'ANDRADE, Rodrigo Melo Franco. Rodrigo e o SPHAN: coletânea de textos sobre patrimônio cultural. 1.ed. Rio de Janeiro: Publicação SPHAN: Ministério da Cultura: Fundação Pró-Memória, 1987.'
