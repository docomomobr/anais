- id: 'sdbr06-056'
  title: A década ausente
  subtitle: reconhecimento necessário da Arquitetura Brasileira do Brutalismo Paulista
  title_en: The missing decade
  subtitle_en: 'Acknowledgment of another Brazilian architecture: the Paulista Brutalism'
  authors:
  - givenname: Ruth Verde
    familyname: Zein
    email: 'rvzein@gmail.com'
    affiliation: null
    orcid: '0000-0003-0923-4914'
    bio: null
    country: BR
    primary_contact: false
  section: A construção da história
  abstract: 'A arquitetura brasileira moderna até os anos 1960 é um mito; a arquitetura brasileira dos anos 1960 é um mistério. O que aconteceu depois de Brasília e antes da reflexão crítica do pósBrasília (1975)? Trata-se de período obscuro na historiografia da arquitetura brasileira e internacional, apesar de ter havido uma intensa produção arquitetônica moderna e radical de alto interesse, que cumpre rever - ou seguirá faltando um capítulo sem o qual não é completa a compreensão do presente. Este trabalho pretende iniciar uma análise das razões que levaram a essa ausência buscando ampliar seu reconhecimento da arquitetura brasileira dos anos 1960; a qual, embora não se limite ao Brutalismo paulista, tem no seu estudo isento uma tarefa imprescindível. A inauguração de Brasília e o esgotamento das pautas da escola carioca marcam o nascimento dessa arquitetura em fins dos anos 1950, paralelamente a manifestações assemelhadas em todo o mundo, mas guardando características arquitetônicas próprias, ancoradas no panorama cultural nacional e internacional daquele período.'
  keywords:
  - arquitetura brasileira
  - brutalismo
  - arquitetura paulista
  - identidade cultural
  abstract_en: 'Brazilian Modern architecture until 1960 is a myth: Brazilian architecture of the 1960''s is a mystery. What has happened after Brasilia and before the Post Brasilia critical revisions (1975)? Despite the intensive architecture production, with several important radical and high quality modern works, that moment still remains obscure in Brazilian and in international architectural historiography. Without revising it there will always be a missing chapter that would elude a comprehensive view of the present. This paper aims to analyze the reasons of such absence, and to try to increase the recognition of Brazilian architecture of the 1960''s which, even if including other trends, has had in the Paulista Brutalism one of its most important attributes. The inauguration of Brasilia and the wearing down of the Carioca School set up the birth of that trend in the end of the 1950''s, synchronizing with the world-wide brutalist trend, but with its own characteristics, related to the local and the international cultural panorama of that moment.'
  keywords_en:
  - Brazilian architecture
  - brutalism
  - Paulista architecture
  - cultural identity
  locale: 'pt-BR'
  file: 'sdbr06-056.pdf'
  pages: null
  doi: 10.5281/zenodo.19072516

- id: 'sdbr06-057'
  title: 'Colonialismos y españolismos, todos son modernismos'
  authors:
  - givenname: Silvia
    familyname: Arango
    email: null
    affiliation: null
    orcid: '0009-0001-7314-4043'
    bio: null
    country: BR
    primary_contact: false
  section: Conferências
  abstract: null
  abstract_es: 'Estilo e influencia son dos de las categorías más problemáticas de la historiografía arquitectónica. A pesar de todos los intentos por destruírlas (desde el pretendido no estilo del movimiento moderno hasta la globalización del interconectado mundo actual), siguen "gozando de cabal salud". Su terca permanencia en los discursos historiográficos y críticos, viene, posiblemente, de ser categorías íntimas al ser mismo de la arquitectura como manifestación cultural. En este artículo no intentamos destruir estas dos nociones, sino algo más modesto: problematizarlas. Para ello, más que una discusión teórica, se ha escogido la re-interpretación de una aventura histórica, que recoge tres décadas (de los 1920''s a los 1950''s), una arquitectura ambigua -la "neo-colonial" o "española"- y las complejas relaciones entre España y sus antiguas colonias americanas. En el período en que se gestó la arquitectura moderna en América Latina- es decir en los años 20, una de las corrientes estilísticas más utilizadas fue los revival de estilos del pasado propio, por diferencia a los revival académicos de los pasados ajenos. En los años 30 y 40, junto a los estilos "cubista" y "moderno", se siguieron haciendo y se llamaban colonial, mestizo, barroco, nacional o maya sin que antecediera el "neo" : las denominaciones como neo-colonial o neoindígena son apelativos posteriores. Todavía en los años 50 se hacían hoteles en estos estilos y los barrios suburbanos de las distintas ciudades se seguían poblando de casas "neo-coloniales"'
  locale: 'pt-BR'
  file: 'sdbr06-057.pdf'
  pages: null
  doi: 10.5281/zenodo.19072520

- id: 'sdbr06-058'
  title: Recepção da Arquitectura Moderna Brasileira em Portugal
  authors:
  - givenname: Tânia Beisl
    familyname: Ramos
    email: 'taniabeislramos@clix.pt'
    affiliation: null
    orcid: '0000-0002-6102-7288'
    bio: null
