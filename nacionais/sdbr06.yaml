    primary_contact: false
  - givenname: Madalena Cunha
    familyname: Matos
    email: 'mcunhamatos@fa.utl.pt'
    affiliation: null
    orcid: '0000-0003-1779-3855'
    bio: null
    country: BR
    primary_contact: false
  section: A construção da história
  abstract: 'O artigo consiste em apresentar a divulgação da arquitectura moderna brasileira em Portugal com enfoque nos artigos publicados nas revistas periódicas portuguesas especializadas, assim como na bibliografia não periódica – estrangeira e nacional – presente no país. A década de 30 marca o arranque do estudo que se estende até à época da concepção do projecto de Brasília. São identificadas quatro fases na análise. A primeira fase implica o reconhecimento alcançado no cenário internacional das produções realizadas no Brasil. Está voltada para o impacto que a nova arquitectura moderna brasileira causa em Portugal, e apoia-se na divulgação das obras realizadas no Brasil evidenciando as características plásticas inovadoras então definidas. A segunda fase significa uma adesão máxima às inovações, formais, construtivas e espaciais contidas nos programas da arquitectura moderna brasileira por parte dos arquitectos portugueses. A busca das raízes culturais da modernidade brasileira alicerçou uma maior identidade arquitectónica entre os dois países. Na terceira fase detecta-se um decréscimo de interesse nessa relação, ao mesmo tempo que a historiografia portuguesa procede ao reconhecimento da influência anteriormente recebida. Analisaram-se as diferentes visões dos autores portugueses sobre o tema. Uma quarta fase implicaria um reatar do interesse português pela arquitectura brasileira, incluindo agora novas formas de produção, comunicação e recepção.'
  keywords:
  - recepção
  - Brasil
  - Portugal
  abstract_en: 'This paper aims to present the diffusion of Brazilian modern architecture in Portugal, stressing the articles which were published in Portuguese professional periodicals, as well as in the non-periodical bibliography, both of national and international origin, which were present in Portugal at the time. The study starts in the 30’s and it is extended up to Brasilia’s Master Plan conception. Four phases are identified by the analysis. The first phase is concerned which the assumption of the impact caused at a worldwide scale by the built work of early Brazilian Modern architecture. It focuses in the particular impact it causes in Portugal, and is based on the diffusion in this country of the building’s plastic characteristics then defined. The second phase means a maximum proximity from Portuguese architects to the formal, constructive and spatial innovations, which were brought by the programs then built in Brazil. The search for cultural roots of Brazilian modernity strengthened a larger architectural identity between thee two countries. In the third phase, is noticeable a decrease of interest in this relationship, at the same time as Portuguese historiography writes an acknowledgement of the prior influences received from Brazil. The different approaches by Portuguese authors and publications. A new phase has started, which means a renewal of the interest from the Portuguese towards Brazilian Architecture, including this time now forms of production, communication and of reception.'
  keywords_en:
  - reception
  - Brazil
  - Portugal
