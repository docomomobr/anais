- id: 'sdbr06-060'
  title: A noção de adaptabilidade ao meio no discurso modernista
  authors:
  - givenname: Telma de Barros
    familyname: Correia
    email: null
    affiliation: null
    orcid: '0000-0001-8002-8748'
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'De forma recorrente ao longo do século XX a arquitetura moderna brasileira tem surgido na voz de historiadores de arquitetura e de arquitetos, como tendo entre suas qualidades e particularidades fundamentais sua adaptabilidade ao meio. No Brasil, a preocupação com a adaptação da arquitetura às condições locais já se fazia presente no século XIX e nas primeiras décadas do século XX, quando se torna, inclusive, um dos eixos de fundamentação da arquitetura neocolonial. Vinculado ao movimento neocolonial na década de 1920 e principal ideólogo do Movimento Moderno no Brasil, após 1930, o arquiteto Lucio Costa lançou as bases do discurso modernista sobre a compatibilidade desta arquitetura com as demandas adaptação ao meio. Este texto discute, a gênese e a difusão da noção de adaptabilidade da arquitetura às condições locais no Brasil, bem como a forma como esta noção se reflete na produção de arquitetos nacionais.'
  keywords:
  - adaptabilidade
  - arquitetura moderna
  - meio tropical
  abstract_en: 'During the XXth century, brazilian modern architecture has appeared in the writings of architectural historians and architects, with its adaptability to the environment frequently cited among its basic particularities and qualities. In Brazil, the concern with the adaptation of the architecture to the local conditions had already appeared in the century XIX and in the first decades of the XXth century, when it also became one of the justifications of neocolonial architecture. With his roots in the neocolonial movement in the decade of 1920, the main ideologist of the Modern Movement in Brazil, after 1930, the architect Lucio Costa launched the bases of the modernist discourse on the compatibility of this architecture with the demands of adaptation to the environment. This text discusses the origin and the diffusion of the notion of adaptability of the architecture to local conditions in Brazil, and also the way in which this notion was reflected in the actual production of many national architects.'
  references:
  - 'ARANTES, Pedro Fiori. Arquitetura Nova: Sérgio Ferro, Flávio Império e Rodrigo Lefèvre, de Artigas aos Mutirões. São Paulo: Ed. 34, 2002.'
