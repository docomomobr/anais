- id: 'sdbr06-048'
  title: Histórias e memórias de um arquiteto
  subtitle: a breve trajetória de Carlos Barjas Millan
  authors:
  - givenname: Mônica Junqueira de
    familyname: Camargo
    email: 'junqueira.monica@uol.com.br'
    affiliation: null
    orcid: '0000-0002-2625-5074'
    bio: null
    country: BR
    primary_contact: false
  section: A construção da história
  abstract: 'O arquiteto Carlos Barjas Millan (1927-1964), apesar da consagrada relevância de sua obra para a arquitetura paulista, ainda não foi alvo de estudos mais aprofundados, exceção feita ao doutorado do Prof. Dr. Carlos Augusto Mattei Faggin, de 1992. Mais recentemente, com o estudo sistemático da arquitetura paulista e dada a qualidade da contribuição de Millan, fica evidente a necessidade de uma análise mais profunda e da divulgação de sua arquitetura. Resultado de um esforço coletivo para a pesquisa e divulgação da obra de Millan, este trabalho apresenta uma pequena parcela do trabalho que vem sendo desenvolvido. Adotou-se como estratégia para a recuperação de parte das informações, o método de memória oral. Foram programadas 19 entrevistas entre pessoas identificadas em estreita relação com o arquiteto, cujas gravações foram digitadas e alguns trechos estão aqui reproduzidos. A formação no Mackenzie, a participação na JUC, o desempenho como professor, os parceiros, as idéias de arquitetura, as suas obras e, sobretudo, o seu modo muito particular de ser, incluindo sua súbita saída de cena foram os assuntos mais recorrentes em todos os entrevistados. Selecionamos para esta comunicação os fragmentos que recuperam as suas idéias de arquitetura: a racionalidade, o didatismo, a obsessão pela arquitetura, o rigor construtivo, o refinamento do detalhe e as suas referências, e que são reveladores da sua importância no panorama da arquitetura brasileira. Informações que associadas ao acervo de desenhos, hoje sob custodia da FAU, algumas de suas obras ainda existentes e praticamente inalteradas, permitirão uma melhor exploração de sua contribuição.'
  abstract_en: 'Architect Carlos Barjas Millan (1927-1964), although with works of distinguished relevance for São Paulo''s architecture, has not been studied deeply enough, with the exception of Prof. Dr. Carlos Augusto Mattei Faggin'' thesis, written in 1992. With the new and systematic research about São Paulo''s architecture, and considering the high quality of Millan''s contribution, it comes out very clearly the need to analyze deeper and divulgate his architecture. This paper presents a small part of his strength, as a collective effort to study Millan''architecture still being developed. We choose the oral history''s method to obtain part of the information. Nineteen interviews were recorded, identified among his friends, pupils, partners and others in a close relation to him. The subjects most explored by the interviewers were: his graduation''s activities at Mackenzie School, his Young Catholic Association''s activities; his academic experiences, his architectural ideas, his buildings and over all, his very special way of being, including his sudden disappearance. We selected for this presentation some fragments that explain better his architecture''s ideas like: the rationalism; the didactic performance; the architecture''s obsession; the austerity, the detail''s care and his influences, which reveal his importance to the Brazilian architecture. This information increased by the design''s collection, under the FAU control, to the buildings that still remain much the same, will aloud a better comprehension of his contribution.'
  references:
  - 'ACAYABA, Marlene M. Branco & Preto: uma história do design brasileiro nos anos 50. São Paulo, FAU/USP, 1991. Tese de doutorado.'
  - 'ACAYABA, Marlene M. Residências em São Paulo. São Paulo: Projeto, 1986.'
  - 'TAFURI, Manfredo. Teorias e História da Arquitetura. Lisboa: Editorial Presença ltda, 1979.'
