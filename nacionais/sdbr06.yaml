- id: 'sdbr06-047'
  title: Arquitetura Moderna Brasileira como representação
  subtitle: o caso da FAUUSP
  authors:
  - givenname: Miguel Antônio
    familyname: Buzzar
    email: 'm.buzzar@sc.usp.br'
    affiliation: null
    orcid: '0000-0001-6251-0338'
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'O Movimento Moderno Brasileiro alimentou fortes laços com o projeto de construção de um estado nacional. Neste projeto a cultura tinha o papel específico de contribuir para a formação da identidade nacional. A Arquitetura moderna fez parte desta operação simbólica. Ainda que fosse apresentada pela historiografia como homogênea a Arquitetura Moderna Brasileira conheceu diferenciações que se manifestavam também na forma da construção da identidade nacional. A obra de Vilanova Artigas, particularmente, o edifício da FAUUSP expressa bem a representação do desenvolvimento nacional conforme Artigas o interpretava, implementando questões próprias para a formulação da identidade nacional.'
  keywords:
  - Moderno. Identidade Nacional. Representação
  abstract_en: 'The Brazilian Modern Movement had strong bonds with the project of construction of a national state. In this project the culture had the specific paper of contribute for the identity of the national formation. The modern Architecture it was part of this symbolic operation. Still that the Brazilian Modern Architecture was presented by the history as homogeneous it knew differentiations that if also revealed in the form of the construction of the national identity. The Vilanova Artigas works, particularly, the building of FAUUSP express well the representation of the national development as Artigas interpreted, implementing proper questions for the formularization of the national identity.'
