- id: 'sdbr06-050'
  title: Arquitetura Moderna e preexistência edificada
  subtitle: intervenções sobre o Patrimônio Arquitetônico de Salvador
  authors:
  - givenname: Nivaldo Vieira de
    familyname: Andrade Junior
    email: 'nivandrade@gmail.com'
    affiliation: null
    orcid: '0000-0001-9543-8432'
    bio: null
    country: BR
    primary_contact: false
  section: A preservação e o moderno
  abstract: 'Este trabalho pretende analisar algumas das principais intervenções de arquitetura moderna realizadas sobre o patrimônio edificado em Salvador a partir do início da década de 1950, visando identificar quais as possíveis abordagens projetuais contemporâneas sobre a preexistência arquitetônica no Brasil. Desta forma, analisamos as mais significativas intervenções projetuais em edifícios existentes, bem como as novas construções em terrenos vazios do Centro Histórico de Salvador, destacando-se aquelas realizadas por Lina Bo Bardi (1914-92), Diógenes Rebouças (1914-94), João Filgueiras Lima “Lelé” (n. 1932) e Paulo Ormindo de Azevedo (n. 1937).'
  keywords:
  - Arquitetura Moderna
  - Patrimônio Arquitetônico
  - Centro Histórico de Salvador
  abstract_en: 'This paper aims to analyze some of the most important projects of modern architecture designed for listed buildings or sites in Salvador, Bahia, since the early 1950’s, trying to understand which are the possible contemporary design approaches on preexisting architecture in Brazil. Thus, we have identified the most significant recycling projects of listed buildings and new buildings designed for unoccupied sites inside Salvador’s Historic Center, particularly those designed by Lina Bo Bardi (1914-92), Diógenes Rebouças (1914-94), João Filgueiras Lima “Lelé” (born 1932) and Paulo Ormindo de Azevedo (born 1937).'
