- id: 'sdbr06-015'
  title: Riposatevi
  subtitle: a Tropicália de Lucio Costa na XIII Trienal de Milão
  authors:
  - givenname: Eduardo Pierrotti
    familyname: Rossetti
    email: 'rossettifau@unb.br'
    affiliation: null
    orcid: '0000-0002-0678-1659'
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'Este artigo explora o projeto de Lucio Costa para o pavilhão brasileiro na XIII Trienal de Milão, em 1964. Este projeto evidencia as questões e as crises do campo arquitetônico brasileiro e apontam pertinências atuais. O artigo também revela a atualidade do arquiteto ao dialogar com diferentes vertentes arquitetônicas, além de estabelecer um diálogo surpreendente com Hélio Oiticica e Caetano Veloso.'
  keywords:
  - Lucio Costa
  - pavilhão
  - Trienal de Milão
  abstract_en: 'This article explores the Lucio Costa''s project for the Brazilian pavilion at the 13th Milan Triennial, in 1964. This project brings such important questions about Brazilian architectural field crisis and points out actual pertinences. The article also reveals the architect''s contemporary position among many different architectural strategies, besides establishing an extraordinary dialogue between Hélio Oiticica, Caetano Veloso and himself.'
