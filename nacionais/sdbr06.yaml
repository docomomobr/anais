- id: 'sdbr06-001'
  title: A arquitetura moderna de Heitor Maia Neto em Recife nos anos 50
  authors:
  - givenname: Alcília Afonso de Albuquerque e
    familyname: Melo
    email: 'kakiafonso@hotmail.com'
    affiliation: null
    orcid: '0000-0002-6344-9329'
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'Este texto pretende apresentar a produção arquitetônica do arquiteto Heitor Maia Neto durante os anos 50 na cidade de Recife e suas contribuições no sentido de propor uma arquitetura moderna adaptada aos trópicos, trabalhando com um material de projeto e soluções técnico-construtivas decorrentes de influências do mestre napolitano Mario Russo e da Escola Carioca. Graduado em arquitetura pela Escola de Belas do Recife em 1952, Heitor fez parte de uma turma composta por nomes como Mauricio Castro e Everaldo Gadelha. Nos primeiros anos de sua atuação profissional, trabalhou com Russo no Escritório Técnico da Cidade Universitária do Recife, absorvendo a base racionalista do professor napolitano. Em 1952, ganha seu primeiro concurso, com o projeto da Biblioteca Pública de Casa Amarela, onde aplica o vocabulário arquitetônico moderno. Participa em 1956, do concurso nacional para a construção do Monumento aos Pracinhas, obtendo o segundo lugar, e em 1959, propõe uma solução arquitetônica chamada “laje dupla”, que buscava solucionar os problemas climáticos criados a partir do uso de lajes planas nos projetos modernos, experimentando-a pela primeira vez na residência Zildo Andrade e posteriormente nas casas José Cordeiro e Tubal Valença. Paralelamente a tal sistema, o arquiteto propôs outras soluções climáticas, baseado em experiências contemporâneas de arquitetos como Oscar Niemeyer e Lúcio Costa, sempre na busca por adaptar a linguagem moderna à realidade local. Será analisada aqui, sua produção residencial, tipologia mais construída pelo arquiteto no período estudado, como as casas Márcio Araújo, Sérgio Morel, Torquato Castro, Zildo Andrade, José Cordeiro,Gilberto Botelho, Tubal Valença . A importância do papel de Heitor para a consolidação da arquitetura moderna na cidade de Recife tem sido pouco estudada, sendo por este motivo, objeto de investigação que desenvolvo a cerca dos principais personagens responsáveis por este processo.'
  keywords:
  - Arquitetura moderna Recife
  - modernidade arquitetônica nordestina
  abstract_en: 'This paper tries to present the production architectural of Heitor Maia Neto in the fifties in the city of Recife and his contributions in order to consider a suitable modern architecture to the tropics, working for this with a material of project and decurrent technician-constructive solutions of its influences of the napolitano master Mario Russo and the “ Escola Carioca”. Graduated architecture at the “Escola de Belas Artes de Recife” in 1952, Heitor was part of a composed group for names as Mauricio Castro and Everaldo Gadelha. In the first years of its professional performance, he worked with Russo in the University City Technician Office of the of Recife, absorbing of exactly, all the “racionalista” base that the napolitano teacher . In 1952, he was his first award , with the project for the Public Library of “Casa Amarela”, which applies the vocabulary architectural of modernity. He participates, in 1956,at the national competition for the construction of the “Monumento aos Pracinhas”, getting the second place, and in 1959, he considers a solution called architectural "double flagstone", that he searched to solve the climatic problems bred from the plain flagstone use in the modern projects, trying it for the first time in the residence Andrade and later in the “Cordeiro” and “Valença” houses. At the same time to such system, the architect considered others climatic solutions based in experiences contemporaries of architects as Niemeyer and Costa, always in the search for adapting the modern language to the local reality. It will be analyzed here, his residential production, tipologia more constructed by the architect in the studied period, as the “Araújo”, “ Morel”, “Castro”, ”Andrade”, ”Cordeiro”, ”Botelho”, ”Valença” houses. The importance of the work of Heitor for the consolidation of the modern architecture in the city of Recife has been briefly studied, being for this reason, inquiry object who I develop about the main responsible personages for this process.'
  keywords_en:
  - Modern architecture Recife
  - modernity architectural northeastern
