  section: A preservação e o moderno
  abstract: 'O estudo tem como tema a habitação, especificamente a casa unifamiliar. Em se tratando do universo modernista, o tema tem especial significado no contexto brasileiro, pois representa um espaço de avanços programáticos em relação ao período anterior e de interpretação local do Movimento Moderno. No entanto, no âmbito brasileiro, existe uma quantidade enorme de edificações residenciais modernistas ainda não estudadas, merecedoras de atenção, tanto pelos seus valores projetuais, quanto patrimoniais. Diante disso, são estudadas quatorze casas construídas em Caxias do Sul, de 1940 a 1970. Concebidas para uma elite, geralmente estavam localizadas na proximidade de parques, influenciadas pela experiência americana da cidade-jardim. Trata-se de edifícios relevantes no contexto caxiense, mas completamente anônimos à cultura oficial e que vem sendo gradativamente destruídos pela especulação imobiliária. Assim, o estudo objetiva inventariar e analisar a casa unifamiliar modernista em Caxias do Sul. Este estudo segue a metodologia proposta pela pesquisa intitulada Inventário da Arquitetura Modernista na Serra Gaúcha, destacando os aspectos organizativos, ordenativos e tecnológicos dos edifícios. Inicialmente, de modo a subsidiar essa análise, aborda as estratégias compositivas recorrentes no modernismo e sua relação com a experiência residencial modernista brasileira. Também faz uma breve contextualização do programa residencial unifamiliar caxiense, a fim de diagnosticar aspectos sedimentados, hibridizados ou transformados ao longo do tempo. Por fim, em caráter conclusivo, a produção caxiense é confrontada com a produção brasileira e mundial.'
  keywords:
  - modernismo
  - habitação unifamiliar
  - Caxias do Sul
  abstract_en: 'This paper is about housing, especially the one-family house. Concerning to modernist universe, this subject has a special meaning in Brazilian context, representing a space of programming advances and of local interpretation of Modern Movement. In Brazil, there is a huge number of modern residential buildings not studied yet, deserving attention, as much for their arquitectural values as for their patrimonial values. Due that, fourteen houses built in Caxias do Sul from 1940 to 1970 are studied. Conceived for high-class people, theses houses used to take place next to parks, being influenced by town-garden American experiment. They are relevant buildings in Caxias do Sul context but anonymous for official culture and they have been gradually destroyed by commercial interest. So, this study aims to make the inventory and to analyze such houses. It follows the method proposed by the research Inverntário da Arquitetura Modernista na Serra Gaúcha, detaching organizative, ordenative and technological aspects of the buildings. At first, to subsidize this analysis, it broaches the compositive strategies of modernism and its relationship with Brazilian modernist residential experiment. It also makes a brief contextualization of residential program in Caxias do Sul, in order to diagnose consolidated, hybridized and transformed aspects through out the times. At last, to conclude it, this production is faced to the world and Brazilian one.'
  keywords_en:
  - modernism
  - 'one-family house'
  - Caxias do Sul
