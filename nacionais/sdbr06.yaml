- id: 'sdbr06-059'
  title: Arquitetura moderna em São José dos Campos
  subtitle: a representação de uma identidade
  authors:
  - givenname: Tatiana Macedo
    familyname: Otta
    email: null
    affiliation: null
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  section: A preservação e o moderno
  abstract: 'Este trabalho é um apelo à consciência de toda uma geração de Arquitetos atuantes em São José dos Campos. Próspera cidade média do Estado de São Paulo, situada no Vale do Paraíba, cortada pela Rodovia Presidente Dutra no eixo São Paulo - Rio de Janeiro. Trata-se especificamente, da arquitetura Moderna produzida na cidade - por grandes arquitetos como Oscar Niemeyer, Carlos Barjás Millan, Rino Levi, além de José Zanine Caldas e do paisagista Roberto Burle Marx - e das articulações necessárias à sua conservação e requalificação. Pesquisa-se o meio urbano do Município e suas principais mudanças de uso, que contribuíram para a descaracterização de edifícios que fazem parte do patrimônio histórico local. É intenção do trabalho, além de valorizar a arquitetura moderna da cidade, despertar a consciência de que a Arquitetura e o Urbanismo são relatos da manifestação cultural e social da cidade. Portanto, aponta-se a importância tanto na preservação da memória do Município através da conservação dos bens, quanto no cuidado com a formação de um futuro que inexoravelmente virá a ser memória, contribuindo para a afirmação da identidade cultural local.'
  keywords:
  - memória
  - requalificação
  - sustentabilidade
  abstract_en: 'This research is an appeal to the conscience off all architects of São José dos Campos. Prosperous median city of São Paulo State. It is about the modern Architecture produced in this city – by great architects as Oscar Niemeyer, Carlos Barjás Millan, Rino Levi, besides José Zanine Caldas and Roberto Burle Marx- and the necessarie articulation for your maintenance and valorization. The research is about the district’s urban enviroment and its meaningful changes of use that contributes for the lost of its peculiarities- which are a part of the local’s heritage buildings. It is this works intention, besides the appreciation of the town’s modern architecture , to awere the concience that architecture and urbanism are reported to the social and cultural production of the city. Meanwhile, even the importance of engaging in building preservation activities, than a commitment in rising a future that necessarily will become memory, will contribute to affirm the town’s cultural identity.'
