- id: 'sdbr06-012'
  title: Entre o chão e o céu
  subtitle: as rampas em Artigas
  authors:
  - givenname: Clevio Dheivas
    familyname: Nobre Rabelo
    email: null
    affiliation: null
    orcid: '0000-0002-3423-314X'
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'Freqüentemente presente na obra do arquiteto antes mesmo do debate sobre a acessibilidade, em Vilanova Artigas, a rampa é um elemento estruturante do espaço. Seu objetivo é unir, realizando a perfeita promenade, da qual se vislumbra a paisagem interna ou externa. Assim, realiza a utopia moderna da função “circular”, humanizando-a. Ela está entre o chão, onde o apoio canta, e o céu, morada dos deuses. O tema desse trabalho é investigar de que forma a rampa participa de um arranjo espacial específico criado por Artigas - blocos funcionais independentes em meios-níveis, abertos para um vazio central sob uma cobertura única -; um “tipo arquitetônico” que encontra no edifício da FAUUSP seu expoente máximo, mas cuja raiz data dos anos de 1940.'
  keywords:
  - Vilanova Artigas
  - rampas
  - arquitetura moderna brasileira
  abstract_en: 'Frequently presented in the work of the architect Vilanova Artigas even before the discussion about acessibility, the ramp structures the space. It is meant to join different levels, creating the perfect “promenade”, from where one can appreciate both the inside or outside views. The ramp humanizes the “circulate” modern function, connecting the ground, where the structure “sings”, to heaven, home of the gods. This study´s goal is investigate the ramp´s role in a especific spacial structure created by Artigas. This structure consists of independent functional blocks situated in half levels (middle levels), thus opening to a central space under a single cover. Although the major example of this structure is undoubtedly the FAUUSP building, such architectural style dates back to the 1940´s.'
  keywords_en:
  - Vilanova Artigas
  - ramps
  - brazilian modern architecture
  references:
