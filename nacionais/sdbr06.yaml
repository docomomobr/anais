- id: 'sdbr06-038'
  title: 'A cidade antiga nos CIAM 1950-59'
  authors:
  - givenname: Lia
    familyname: Mayumi
    email: null
    affiliation: null
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  section: A preservação e o moderno
  abstract: 'Este trabalho procura analisar, no âmbito do universo das discussões teóricas dos CIAM, o surgimento de uma conscientização sobre a importância do caráter dos centros antigos das cidades, na contramão do esforço que os próprios CIAM vinham empreendendo, desde a década de 1930, para a implantação do ideário urbanístico expresso na Carta de Atenas. As visões de Ernesto Nathan ROGERS e Sir James Maude RICHARDS sobre o “coração” da cidade, no VIII Congresso, ocorrido em 1951 em Hoddesdon, reconhecendo o valor das “pré-existências” e do “caráter do lugar”, resgatam o papel da “história” e do “passado”, recolocando-os como personagens vivos do presente e não apenas uma variante dentro do projeto moderno.'
  abstract_en: 'This article analyses the arise of a concern about the importance of the character of the cities’ old centers, in the context of the theoretical debates held by the CIAMs. This concern arises in opposition to the efforts that the very same CIAMs had been undertaking since the 1930s to foster and implement the conception of cities according to those urban patterns expressed by the ‘Charter of Athens’. The 8th. CIAM (Hoddesdon, 1951) tackled the question of the ‘city core’. In Hoddesdon, through defending the importance, for the contemporary city, of both the ‘existing environment’ and the ‘character of the place’, Ernesto Nathan ROGERS and Sir James Maude RICHARDS restore the roles of ‘history’ and ‘past’ by redeeming them from their secondary stance in the modern project.'
