- id: 'sdbr06-035'
  title: Continuidades e dissonâncias na arquitetura industrial de Hans Broos
  authors:
  - givenname: Karine
    familyname: Daufenbach
    email: 'daufenbach@exemplo.com'
    affiliation: null
    orcid: '0000-0002-2292-8219'
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'Este artigo se fundamenta na análise de duas obras industriais: a Hering Matriz de Blumenau, Santa Catarina, construída em 1968 e o projeto da Hering Nordeste, que data de 1975, localizada na cidade de Paratibe Paulista, Pernambuco. Este estudo parte de reflexões que as unem e distanciam ao mesmo tempo: ambas são do arquiteto Hans Broos e construídas em um curto intervalo de tempo; porém localizadas em regiões diferentes e situação diversa e apresentam características formais divergentes. Deste modo, a análise busca verificar qual o papel da crítica na apreciação das obras e quais as condicionantes que guiaram os projetos.'
  keywords:
  - arquitetura industrial
  abstract_en: 'This paper is based in the analysis of two industrial works: Hering Matriz, Blumenau, Santa Catarina, built in 1968 and Hering Nordeste, built in 1975, located in the city of Paratibe Paulista, Pernambuco. Many criterias are observed: both belong to architect Hans Broos and built in a short interval of time; however located in different areas and several situation and they present distinct formal characteristics. This way, the analysis intends to verify the discuss about these works and which parameters are most relevant in the projects.'
