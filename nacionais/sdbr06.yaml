- id: 'sdbr06-034'
  title: O IAPI de Belo Horizonte
  subtitle: entre proposta social e propaganda ideológica
  authors:
  - givenname: Juliana Cardoso
    familyname: Nery
    email: 'jcnery19@yahoo.com.br'
    affiliation: null
    orcid: '0000-0002-8476-5339'
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'Este trabalho visa compreender as ambíguas motivações e os princípios que regeram a construção do Bairro Popular, conhecido como Conjunto IAPI em Belo Horizonte, dentro das iniciativas modernizadoras da administração de Juscelino Kubitschek. Busca mapear o panorama político e o modelo estético que possibilitaram tal intervenção, assim como analisar a vertente ideológica em sua face silenciosa que cerca tal idealização. Dissimulado por um discurso de cunho social e progressista, o IAPI serve de instrumento para a remoção de uma população carente para dar lugar a um elemento de construção da imagem moderna de Belo Horizonte nos anos 40 no percurso que culminava no Complexo da Pampulha. Poderia uma tão grandiosa realização como a Pampulha ter como portal de entrada na avenida aberta para dar acesso a ela a maior favela da capital na época? A questão coloca em evidência a complexa ligação entre o movimento moderno no Brasil, a construção da imagem de uma nação progressista e a propaganda ideológica de uma classe dominante e seus políticos para marcarem e perpetuarem seu poder.'
  keywords:
  - IAPI
  - ideologia
  - habitação popular
  abstract_en: 'This paper aims to comprehend the ambiguous motivations and the principles behind the construction of “Bairro Popular”, also known as IAPI Complex in Belo Horizonte, as part of the modernizing projects of Juscelino Kubitschek’s administration. Its goal is to analyze the political situation and aesthetic model that made this intervention possible, as well as to examine the silent ideological line that surrounded it. Dissimulated by a social and progressionist discourse, the IAPI Building was, in fact, an instrument for the removal of poor people to make way for an element that helped create the modern image of Belo Horizonte in the 40’s, in the path that led to the Pampulha Complex. How could such a grandiose project as the Pampulha have the biggest slum of the capital at its entrance? This question put in evidence the complex link between Brazil’s Modern Movement, a progressionist nation’s image construction and the ideological propaganda of a dominant class, represented by politicians, to create landmarks and perpetuate its power.'
  references:
