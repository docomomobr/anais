- id: 'sdbr06-010'
  title: Flávio de Carvalho
  subtitle: cidade e habitação
  authors:
  - givenname: Carolina Pierrotti
    familyname: Rossetti
    email: 'rossetti@exemplo.com'
    affiliation: null
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  section: A construção da história
  abstract: 'A arquitetura desenvolvida por Flávio de Carvalho, ao que parece, não pretende apresentar vínculos institucionais com o Estado vigente e nem com o próprio “projeto moderno”. A questão de identidade nacional está mais vinculada às questões discutidas no início de 1920, com Oswald de Andrade e a Antropofagia discutida em São Paulo. Assim, sua arquitetura não procura representar e muito menos “mitificar” determinada força política, mas procura as questões sociais fora do campo político. As questões sociais aparecem em suas discussões sobre cidade, sociedade e habitação, além da própria concepção de homem moderno. A preocupação com a formação de uma sociedade moderna está mais vinculada à idéia de progresso e de vida do que a concepção desenvolvimentista da sociedade apresentada pelo projeto moderno. É uma outra visão de identidade nacional, que não afirma uma determinada força política, mas busca características e valores brasileiros. A única preocupação política apresentada em seus textos aparece quando ele discute a formação de uma sociedade a partir de um Estado forte, que pode organizar o sistema econômico e produtivo, capaz de se responsabilizar pela reformulação de uma sociedade nova. Isso se reflete consequentemente aos seus trabalhos onde discute a cidade e a casa do homem moderno. Essa postura apresentada por Flávio de Carvalho aparece tanto em alguns textos desenvolvidos na década de 1920 e 30, como em projetos arquitetônicos desenvolvidos no mesmo período. Os textos e projetos a serem apresentados para esta análise serão respectivamente: A cidade do homem nu (1930), Uma concepção da cidade do amanhã (1932), o folheto explicativo do conjunto de casas da Alameda Lorena (1938), A casa do homem do século XX (1938), Projeto para o Palácio do Governo do Estado de São Paulo (1927) e Projeto de uma Vila na Alameda Lorena (1936-38).'
  keywords:
  - Flávio de Carvalho
  - 'arquitetura moderna, homem moderno'
  abstract_en: 'The architecture developed by Flávio de Carvalho doesn’t intend to present an institutional linked either with the effective State or with the “modern project”. The question about national identity was more linked to the questions that Oswald de Andrade and the Anthropophagi discussed in 1920, in São Paulo. Thus, his architecture neither seeks to represent nor mythify a political force, but it looks for social questions out of political interest. The social questions appear in his discussions about the city, society and habitation, mainly the conception of the modern man. The search for the formation of the modern society is closer to the progress ideas and the life progress than developmental vision of the modern project. It’s another vision about national identity that doesn’t agree with a determinate political force, but he looks for Brazilian characteristics and values. The only political preoccupation that he shows in his texts appears in his discussions about a society formation with a strong State. This may not only organize the economical and productive systems, but also reformulate a new society. This discussion is reflected in his works in which he discusses the city and the modern man’s house. Flávio de Carvalho’s point of view was presented not only in his texts, but also in his architectural projects, developed in 1920’s and 1930’s. The texts and projects that are analyzed in this work are: “The naked man’s city” (1930), “A tomorrow city’s conception” (1932), Lorena Lane project’s folder (1938), “The 20th century man’s house” (1938), the project elaborated to the Palace of São Paulo State (1927) and the project of the houses of Lorena Lane (1936-38).'
  keywords_en:
  - Flávio de Carvalho
  - modern architecture
  - modern man
