- id: 'sdbr06-018'
  title: Espaços modernos cariocas
  subtitle: por uma monumentalidade peculiar
  authors:
  - givenname: Evelyn Furquim Werneck
    familyname: Lima
    email: 'evelyn.lima@unirio.br'
    affiliation: null
    orcid: '0000-0002-2578-6180'
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'A presente comunicação revela que o arquiteto brasileiro soube captar o espírito do funcionalismo corbusieriano, conferindo-lhe novos moldes estéticos que se tornaram peculiares à nossa arquitetura e adaptando-os, e fazendo reviver elementos arquitetônicos típicos de nossos colonizadores, como as treliças, os azulejos e criando os cobogós cerâmicos, que possibilitaram a aclimatação das edificações às nossas características regionais, às nossas vivências e às tradições culturais do nosso povo. A falta de recursos técnicos iniciais em tecnologia do aço foi rapidamente suprida com o desenvolvimento de leves estruturas de concreto. Após a Segunda Guerra o Funcionalismo, já então instaurado como Estilo Internacional, passou a ser adotado como um dogma academizado pelos governos e pelas grandes corporações, perdendo seu caráter de vanguarda. Sua intenção inicial era de subversão contra a tradição, visando à ruptura com os valores acadêmicos. Era a utopia da máquina a serviço da socialização do homem, enquanto indivíduo. Contudo, nem Le Corbusier nem os outros pioneiros da modernidade poderiam prever o espírito aproveitador das classes dominantes, que em próprio benefício promoveriam a ocupação desenfreada das cidades.'
  keywords:
  - 'Movimento Moderno – estética autóctone - Rio de Janeiro'
  abstract_en: 'This essay aims to prove that the Brazilian architect captured the spirit of Le Corbusier''s Functionalism, adapting and modifying it, in order to obtain a new esthetical appearance and turning it into an architecture that included treliças, ceramic tiles and cobogós which made possible to adapt the imported model to the necessities of our climate, and Portuguese traditions. The initial lack of technology based on iron frames was supplied with the light structures of concrete. After World War II, Functionalism has turned into the International Stile and was used as a dogma by the government and great corporations, loosing its avantgarde character. The original aim was to abandon tradition and the Beaux-Arts Academy. But neither Le Corbusier nor the other pioneers of the Modern Movement could foresee the aim for profit of the dominant classes that would promote the chaotic occupation of the cities.'
  references:
