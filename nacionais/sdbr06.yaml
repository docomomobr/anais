  section: A construção da história
  abstract: 'Pela construção de um cenário marcado pelo embate entre dois tipos de arquitetura, aqui, denominadas como “Street Dog”, que se trata da arquitetura moderna, e os “lulus” ou a arquitetura eclética; poderíamos entender um momento norteado pela procura por uma linguagem arquitetônica representativa da nação brasileira e de seu homem. Vários personagens se envolveram nessa discussão, do lado dos modernos, todos tinham formação em Escolas estrangeira. E do lado dos ecléticos, existia uma mescla entre engenheiros-arquitetos formados nas escolas de engenharia de São Paulo – Politécnica e Mackenzie – e arquitetos formados em escolas no exterior. Jayme da Silva Telles se insere nesse cenário pela peculiaridade ser formado arquiteto na Escola Nacional de Belas Artes, localizada no Rio de Janeiro. Assim, é interessante pensar o papel dos atores individuais nos debates estabelecidos em um determinado período, na produção arquitetônica e na construção das cidades para verificar como estas relativizam ideologias pretensamente totalizadoras e flexibiliza a unanimidade no discurso. Essa abordagem mostra como no caso do I Congresso de Habitação não havia uma única proposta que reivindica o papel de solucionar o problema da habitação, e, concomitantemente, havia diversas modernidades pretendidas. Este trabalho propõe, portanto, sobre este aspecto, uma análise das propostas projetual e idéias publicadas sobre a provisão de habitações para os operários de São Paulo por Silva Telles. Adiantaremos que estas são calcadas nas proposições pretendidas por Le Corbusier, publicadas inicialmente na revista l’Esprit Nouveau e depois agrupadas no livro: “Vers une Architecture”, com as quais Silva Telles teve contato nos anos de formação. O texto remete inicialmente ao ambiente cultural em que se deu a formação deste arquiteto, suas referências e interlocutores, como a atuação projetual no âmbito da habitação e sua proposta, um tanto ousado, de “street dogs” para os operários do Cotonifício Rodolfo Crespi, concurso ocorrido em 1925.'
  keywords:
  - modernidade
  - arquitetura
  - habitação operária
  abstract_en: 'By the construction of a marked set by the collision among two architecture types, here, denominated like "Street Dog", that''s treated the modern architecture, and the "lulus" or eclectic architecture; we could understand the moment orientated by the search for a architectural language representative of the Brazilian nation and the Brazilian man. Several characters took part of this discussion, beside the modern ones, all were graduated in Schools foreigner. And beside the eclectic, a mixture existed among engineer-architects graduated at the schools of engineering of São Paulo - Polytechnic and Mackenzie College and architects graduated from schools in other countries. Jayme of Silva Telles included himself in this set by the peculiarity of being an architect graduated from National School of Beaux Arts, located in Rio de Janeiro. Then, it is interesting to think the individual actors paper in the established debates in a certain period, in the architectural production and in the cities plannings to verify as these ideologies are relatived by supposedly added up and make flexible the unanimity in the idea. That approach shows as in the case of the I Congress of House (1931) there was not only one proposal that demands the paper of solving the problem of the house, but, concomitant, there were several intended modernities. This work proposes, therefore, on this aspect, an analysis of the proposals at the projects and ideas published on the provision of houses for the workers of São Paulo by Silva Telles. We will put forward that these are based in the propositions intended by Le Corbusier, published initially in the magazine l''Esprit Nouveau and later, in the book: "Vers une Architecture", which Silva Telles had contact from graduation. The text sends initially to the cultural atmospher where this architect''s formation, their references and speakers, as the project performance in the extent of the house and his proposal, a daring amount, of "street dogs" for the workers of the Cotonifício Rodolfo Crespi, contest happened in 1925.'
