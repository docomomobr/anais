- id: 'sdbr06-019'
  title: Siegfried Giedion e o caso brasileiro
  subtitle: uma aproximação historiográfica
  authors:
  - givenname: Fabiano Lemes de
    familyname: Oliveira
    email: null
    affiliation: null
    orcid: '0000-0001-5785-1920'
    bio: null
    country: BR
    primary_contact: false
  section: A construção da história
  abstract: 'Este trabalho analisa a importância do olhar de Siegfried Giedion em relação ao surgimento e propagação da arquitetura moderna brasileira. Como ator fundamental na defesa e divulgação do movimento moderno na Europa, Giedion se interessa também por casos “excêntricos”, como o da Finlândia e o do Brasil, em especial no pós-guerra, momento de questionamento do racionalismo arquitetônico e de dúvidas em relação à crença, até então entusiástica, no progresso e no papel da máquina como meios de promoção de uma melhor condição social. Neste caminho de distintas fases de seus posicionamentos, nos moveremos para identificar como a produção nacional é entendida e como há uma relação entre sua mudança de postura, já em meados dos anos 40, e a contribuição brasileira no cenário internacional. Portanto, o texto se pautará no estudo comparado de algumas de suas principais contribuições específicas em relação ao caso brasileiro, como também analisará seus textos clássicos, em seus aspectos gerais e também de posicionamento metodológico. Neste caso, ressaltaremos de que modo suas posturas perante a história estão presentes nas bases da historiografia sobre a produção moderna brasileira em arquitetura, urbanismo e paisagismo do período. Iniciaremos por sua primeira aproximação às obras de Warchavchik, para em seguida discorrermos sobre os escritos dos anos 40 e 50.'
  keywords:
  - Historiografia
  - Movimento moderno
  - Giedion
  abstract_en: 'This work studies the importance of Siegfried Giedion’s approach in relationship with the appearance and propagation of the Brazilian modern architecture. As a main actor in the defense and divulgation of the modern movement in Europe, Giedion were also interested in “eccentric” cases like Finland and Brazil, especially in the post-war, moment of questioning architectural rationalism and of doubting the enthusiastic faith in progress and of believing in the machine as a mean of promoting a better social condition. In his different phases of contributions, we’re going to identify how the national works are understood and how there’s a relationship between his change of mind, already in the forties, and the brazilian contribution in the international context. So, this text is a study of Giedion’s main specific contributions in the Brazilian case, and at the same time a particular approach of his “classic” works, in its general aspects and methodological positions. In this moment, we’re going to show how his attitudes about history are in the basis of the historiography about the brazilian production in architecture, urbanism and landscape design of the period. It starts by his first approach of Warchavchik’s works, and then focus in Giedion’s writings of the 40s and 50s.'
  references:
