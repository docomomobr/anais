- id: 'sdbr06-022'
  title: 'Arquitetura no Brasil no segundo Pós-Guerra'
  subtitle: a síntese das artes
  authors:
  - givenname: Fernanda
    familyname: Fernandes
    email: 'feufernandes@terra.com.br'
    affiliation: null
    orcid: '0000-0001-5416-5765'
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'Este trabalho pretende refletir sobre o tema da síntese das artes, fundamental na constituição da Arquitetura Moderna no Brasil, que se caracterizou pelo trabalho integrado de pintores, escultores, arquitetos e paisagistas. Esta arquitetura é devedora da estadia de Le Corbusier no Brasil (1936) e sua participação no projeto para o edifício do Ministério da Educação e Saúde, onde destaca-se as contribuições de Lúcio Costa e Oscar Niemeyer. No segundo pós-guerra o tema da síntese das artes ganha nova ênfase no Brasil sendo objeto de debate nos Congressos de Arquitetura e Arte realizados durante a década de 1950 e assim estabelecendo conexões com o debate internacional que ocorre no período principalmente através do CIAM, tendo como principais protagonistas Giedion e Sert, que colocam a integração entre as artes na elaboração de centros cívicos voltados para experiências coletivas. Daremos especial atenção ao Congresso Internacional de Críticos de Arte, realizado em 1959, às vésperas da inauguração de Brasília, que tem como tema central “ A cidade nova, síntese das artes”. Este congresso é organizado pelo crítico de arte Mário Pedrosa, com a participação de estudiosos nacionais e internacionais como Lúcio Costa, André Bloc, Meyer Shapiro e Gillo Dorfles, e tem como objetivo analisar a experiência de Brasília a partir do tema da síntese das artes.'
  abstract_en: 'This paper is meant to discuss the “synthesis of the arts”, fundamental for the constitution of Modern Architecture in Brazil, characterized by an integrated work of painters, sculptors and landscapists. This arquitecture is owed to Le Corbusier’s presence in Brazil in 1936 and to his participation in the design of Ministério da Educação e Saúde’building, featuring Lúcio Costa’s and Oscar Niemeyer’s contributions. In the second postwar period the theme “synthesis of the arts” gained a new emphasis in Brazil becoming an object of debate in the Architecture and Arts Congresses held during the 1950s, thus establishing connections with the international debate taking place in the period; this happened especially through CIAM, having Giedion and Sert as the main protagonists who placed art integration in the eleboration of civic centers oriented to colective experiments. We will give special attention to the International Congress of Art Critics, held in 1959, on the eve of Brasilia’s inauguration, whose motto was “The new city, synthesis of the arts”. This congress was organized by art critic Mario Pedrosa, with the participation of brazilian and international scholars, as Lúcio Costa, André Bloc, Meyer Shapiro and Gillo Dorfles, and has as its objective to analyse Brasilia’s experience from the synthesis of the arts theme.'
  references:
  - 'ANAIS do Congresso Internacional Extraordinário de Críticos de Arte. Brasília - São Paulo - Rio de Janeiro, 17 a 25 de setembro de 1959.'
