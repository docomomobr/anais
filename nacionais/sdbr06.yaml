- id: 'sdbr06-062'
  title: Tradição e contradições na arquitetura religiosa brasileira dos anos 1950
  authors:
  - givenname: Valdir
    familyname: Arruda
    email: null
    affiliation: null
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'É possível caracterizar a produção arquitetônica brasileira contemporânea no que diz respeito aos edifícios religiosos? Esta é uma pergunta difícil, pois em um levantamento efetuado junto aos Índices de Arquitetura Brasileira (de 1950 a 1970), encontraremos apenas 101 registros sobre o tema “edifícios religiosos”, coletados nos periódicos especializados, dos quais as revistas Acrópole e Habitat constituem as principais fontes de informação. Esse panorama é instigante porque os exemplares brasileiros significativos dessa produção, ainda que poucos, constituem um objeto apropriado para o estudo do efeito das mudanças que as idéias, as formas e as modas produzem na arquitetura. Com base nesses exemplares, é que iremos evidenciar os confrontos entre intimismo e monumentalidade, tradição e inovação, unidade e diversidade, temas que marcam toda a produção arquitetônica contemporânea, religiosa e/ou laica.'
  keywords:
  - História
  - Moderno
  - Religião
  abstract_en: 'Is it possible to signalize contemporary brazilian architectural production in the religious domain? This is such a hard question. In a survey at “Índice de Arquitetura Brasileira” (1950-1970), it will be found only 101 records on the subject religious buildings, collected in brazilian architectural magazines like “Acrópole” and “Habitat”, the main reference library source. The panorama is instigating because there are very few notable pieces, but they could be a proper subject to study the effect of transformations made by ideas, shapes and fashion in the architectural fields. These buildings, as groundwork, are able to show oppositions between intimacy and monumentality, tradition and innovation, unity and diversity; main themes which sign all contemporary architectural production religious and/or laic.'
  keywords_en:
  - History
  - Modern
  - Religion
  references:
  - 'ACRÓPOLE. Igreja de São Pancrácio. 1951, São Paulo, n.159.'
