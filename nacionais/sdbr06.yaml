- id: 'sdbr06-051'
  title: Conservação de residências de linguagem moderna construídas na década de 50
  authors:
  - givenname: Paula Merlino
    familyname: Machado
    email: 'machado@exemplo.com'
    affiliation: null
    orcid: '0009-0002-1083-5303'
    bio: null
    country: BR
    primary_contact: false
  - givenname: Rosina Trevisan Martins
    familyname: Ribeiro
    email: null
    affiliation: null
    orcid: '0000-0001-5578-7419'
    bio: null
    country: BR
    primary_contact: false
  section: A preservação e o moderno
  abstract: 'Por representar a consolidação de uma arquitetura moderna tipicamente brasileira, que conseguiu atingir quase todos os setores da sociedade da época, o estudo da arquitetura da década de 1950 no Brasil se mostra de grande relevância para o entendimento deste importante momento da história do país. Desta maneira, através do estudo apresentado, pretende-se diagnosticar os principais problemas de conservação encontrados nos revestimentos externos de obras residenciais construídas no período, de maneira a traçar parâmetros que permitam compreender os principais processos de deterioração nos materiais de emprego mais freqüente em função da linguagem utilizada e das condições sob as quais se encontram. A partir da análise de um dos principais exemplares da arquitetura residencial da época, a residência de Walter Salles, poderá ser feita uma comparação com os problemas encontrados em outros exemplares, construídos pela classe média carioca que utilizam a mesma linguagem. Este diagnóstico, realizado através de visitas e observação aos exemplares escolhidos de maneira a identificar os danos, comparar os resultados e entender suas causas, certamente irá contribuir para os processos de conservação, uma vez que, traçando um padrão dos principais problemas, pode-se encontrar a melhor maneira de trata-los.'
  keywords:
  - Conservação
  - Residências
  - Arquitetura Moderna
  abstract_en: 'Because Brazilian architecture of the 50''s represents the consolidation of a typically Brazilian modern architecture that reached almost all sectors of Brazilian society of that time, its study is of paramount relevance to a better understanding of that important moment in the history of the country. This paper aims at a diagnosis of the main conservation problems found in the external coverings of the residential buildings of the aforementioned period, and a subsequent outline of parameters that will aid in the understanding of the main deterioration processes of the most frequently used materials, according to the architectural style and environmental conditions of the buildings under study. From the analysis of one of the main samples of residential architecture of the period, the Walter Salles home, a comparison will be made with middle-class buildings of the same period and same architectural style, in order to identify these conservation problems. Such diagnoses, carried out through visits and observation of the chosen samples to identify damages, compare results and understand the damage process, can greatly contribute to the establishment of better conservation measures, once these problems can be better dealt with if a common damage pattern is identified.'
