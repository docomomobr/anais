- id: 'sdbr06-017'
  title: 'Influências estrangeiras e afirmação nacional no espaço urbano do Rio de Janeiro, 1922/1940'
  authors:
  - givenname: Eduardo Cezar
    familyname: Siqueira
    email: null
    affiliation: null
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'O Modernismo é considerado um dos capítulos mais decisivos da construção de uma identidade nacional brasileira durante o século XX, mas existiu também um outro processo, em paralelo àquele capítulo, que importou idéias estrangeiras para nossa Arquitetura e Urbanismo. Esta Modernização, presumida então como necessária por seus arautos, funcionou frequentemente em competição com nosso Modernismo porque atendia outros interesses e foi típico daqueles dias entre a Primeira e a Segunda Guerras Mundiais. Este texto reflete, através de exemplos tirados de discursos de época, como o conflito entre imagens diferentes afetou nosso panorama urbano e nossa profissão.'
  keywords:
  - 'Modernismo – Nacionalismo - Estrangeirismo'
  abstract_en: 'Modernism is considered one of most decisive chapters to build a brazilian national identity in XXth Century, but it happened other process too, in parallel to that chapter, bringing ideas from foreign countries to our Architecture and Urbanism. This Modernization, presumed as necessary then by their defensors, worked frequently in competition with our Modernism because was attending other interests and was typical of those days between First and Second World Wars. This text thinks, with examples from words of those times, how the conflict between different images affected our urban landscape and our profession.'
