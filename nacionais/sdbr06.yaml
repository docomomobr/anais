- id: 'sdbr06-026'
  title: Ensinando a morar
  subtitle: a busca pelo homem novo através da arquitetura no conjunto do Pedregulho
  authors:
  - givenname: Helga Santos da
    familyname: Silva
    email: null
    affiliation: null
    orcid: '0000-0003-3191-6292'
    bio: null
    country: BR
    primary_contact: false
  - givenname: Mauro Cesar de Oliveira
    familyname: Santos
    email: null
    affiliation: null
    orcid: '0000-0002-4093-0830'
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'Este trabalho se refere à proposta de transformação social, através da arquitetura e urbanismo, presente no discurso dos arquitetos modernos, principalmente dos expoentes da Corrente Funcionalista, ou Racionalista. O estudo de caso, o objeto de análise é o do Conjunto Residencial Prefeito Mendes de Moraes, ou Pedregulho. Para tanto, essa leitura é aqui apresentada a partir das duas formas eleitas pelos idealizadores do projeto do Conjunto para a realização da dita transformação: o projeto arquitetônico e o estabelecimento de normas para habitá-lo. Para complementar, apresentase também a opinião dos moradores. Assim, pode-se discutir, a respeito de uma obra realizada, a intenção de construir o novo homem da era da máquina, tendo como pano de fundo a política propagandista da Era Vargas; a concepção dos Idealizadores do projeto do Conjunto, Affonso Eduardo Reidy e Carmen Portinho; bem como a opinião dos que efetivamente foram alvo dessa intenção: os moradores.'
  keywords:
  - Arquitetura Moderna
  - Habitação Popular
  abstract_en: 'This work refers to the proposal of the social transformation, through architecture and urbanism presented in the modern architects’ speech, mainly the Functionalit’s or Rationalist’s exponents. The example brought here is Prefeito Mendes de Moraes Housing, or Pedregulho. This reading is presented here through two elected ways by the idealizers of the Housing’s project to cause the social transformation: the architecture and the rules to live in the Housing. As a complement, we can read the inhabitant’s opinion about the architecture and the Social Assistance. So we will be able to conclude if it had this social transformation or not. In this way, we can discuss about a construction made, the proposal of constructing a new man living in the Machine Era, based on the propagandist politics of Vargas Era; the conception of the project’s idealizers , Affonso Eduardo Reidy and Carmen Portinho; and the opinion of the inhabitants.'
  references:
