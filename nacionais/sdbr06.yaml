- id: 'sdbr06-061'
  title: De mocinho a bandido
  subtitle: mudanças e continuidades no modelo espacial modernista dos grandes conjuntos
  authors:
  - givenname: Thereza Carvalho
    familyname: Santos
    email: null
    affiliation: null
    orcid: null
    bio: null
    country: BR
    primary_contact: false
  - givenname: Marcelle da Silva
    familyname: Araújo
    email: null
    affiliation: null
    orcid: '0000-0001-5968-8135'
    bio: null
    country: BR
    primary_contact: false
  section: A problemática do moderno nacional
  abstract: 'O trabalho trata dos propósitos e conteúdos ideológicos originalmente atribuídos ao modelo espacial dos grandes conjuntos habitacionais, as reinterpretações, ao longo do tempo, quanto aos significados percebidos dessas formas arquitetônicas e urbanísticas. Examina o conceito modernista de habitação popular quanto ao contexto em que foi gerado, tendo por base - a eficácia funcional apreendida da arquitetura popular rural e a lógica mecanicista da linha de produção automobilística – e por propósito a promoção social das classes operárias. Analisa os resultados dessa ‘soma’ na França e no Brasil, as mudanças significativas nos contextos político, econômico, cultural, social e político que marcaram, diferentemente, do nascimento à condenção. O texto finaliza examinando o ‘culpado’, as críticas e questionamentos que se somaram como justificativa para a condenação, à luz da perda de legitimidade da premissa projetual inicial de inclusão social que marcou a ação governamental à época do seu nascedouro.'
  keywords:
  - Modernismo
  - Habitação Popular
  - Conjuntos Habitacionais
  abstract_en: 'This paper adresses the relationship between the Modern Movement and mass housing provision focusing on the large-scale housing estate model. It examines the ideological values underlying the roles of the State and of the working classes, how they were, originally, knitted together into specific spatial patterns characteristic of the modern movement. Those shapes and forms were then associated with the positive expectations of significant social, economic, environmental and political changes following the two world wars. The paper analyses the profound changes that the modernist mass-housing estates have, since then, undergone and the series of criticisms that followed, in the light of the also profound changes in the role of the State. Obsolescence of space and societies having, apparently, become part of the process, there is no more need of redemption, no more rebel cause to fight for. The Modern Movement lost its drive and the working classes part of its conquests. What next?'
  references:
  - 'ARAGÃO, José Maria. Sistema Financeiro da Habitação. Curitiba: Juruá, 1997.'
  - 'BENÉVOLO, Leonardo. Histoire de la Ville. Roquevaire: Éditions Parenthèses, 1983.'
