- id: 'sdbr06-004'
  title: Pernambuco falando para o mundo
  authors:
  - givenname: Ana Elisabete de Almeida
    familyname: Medeiros
    email: 'ana@unb.br'
    affiliation: null
    orcid: '0000-0003-3248-4399'
    bio: null
    country: BR
    primary_contact: false
  section: A preservação e o moderno
  abstract: 'Em um momento em que a comunidade (inter)nacional reconhece e valoriza, cada vez mais, o caráter memorial do patrimônio modernista, bem como o impacto do Movimento Moderno brasileiro na construção social da prática preservacionista verde e amarela, permitir que Pernambuco fale para o mundo, nas páginas que se seguem, significa buscar uma comprovação dessas afirmações no cenário local. Para tanto, o artigo encontra-se estruturado em três partes. Em “Antecedentes”, procura-se vislumbrar, no contexto recifense, a relação, então antagônica, entre modernidade (desenvolvimento) e preservação. Os primeiros passos no sentido da institucionalização da prática patrimonial, em meio aos contextos histórico, econômico, político, social e cultural nacionais pretendem estabelecer o “Marco Inicial do Diálogo” entre o Estado, a Nação e o mundo. Por fim, “Com a palavra: o 10 Distrito” retorna com maior ênfase ao âmbito local, de modo a demonstrar a força do Movimento Moderno recifense na reprodução da política nacional de salvaguarda, ainda às voltas com o embate entre modernidade e preservação – embate esse que cede lugar a movimentos conciliatórios apenas um pouco mais à frente, com o advento da pósmodernidade.'
  keywords:
  - Patrimônio cultural
  - Modernismo e Recife
  abstract_en: 'Nowadays, the national and international communities recognize and value of the memorial character of the modern heritage and also the impact of the Brazilian Modern Movement into the social construction of the green and yellow preservationist practice. In this context, to let Pernambuco speak to the world means to look for the confirmation to those statements on the local scenario. In order to attend this goal, this article is structured in three parts. In "Antecedents" we try to see, in the Recife''s context, the antagonistic relationship between modernity (development) and preservation. "Initial Marc of the Dialogue" analyses the very first steps towards the institutionalization of the preservationist practices among the national historical, economical, political, social and cultural scenarios between the Pernambuco State, the Nation and the world. At last, "With the word: the 10 District" returns to the local level to demonstrate the force of Recife''s Modern Movement on the reproduction of the national preservation policy, still on the same context of the battle between modernity and preservation — a battle that finds its end with the conciliatory movements of post-modernity.'
  references:
  - 'BATTAGLIA, Dominique. (1993). Modalités Réglementaires de Protection du Patrimoine Urbain. Grenoble: IUG. 1993, 48 p. BRASIL. (1934). Constituição Federal de 16 de Julho de 1964.'
