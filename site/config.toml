baseURL = "https://anais.docomomobrasil.com/"
languageCode = "pt-BR"
title = "Anais Docomomo Brasil"
titleCaseStyle = "none"
enableGitInfo = true

[taxonomies]
  autores = "autores"
  "palavras-chave" = "palavras-chave"
  keywords = "keywords"
  "palabras-clave" = "palabras-clave"

[sitemap]
  changefreq = "monthly"
  priority = 0.5

[outputs]
  home = ["HTML", "signmap"]
  section = ["HTML"]
  page = ["HTML"]

[outputFormats.signmap]
    mediaType = "application/xml"
    baseName = "signmap"
    isPlainText = true
    notAlternative = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  description = "Anais dos seminários Docomomo Brasil — nacionais e regionais"
  ogImage = "/img/og-default.png"
