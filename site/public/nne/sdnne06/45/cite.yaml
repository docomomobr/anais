abstract: "Este artigo possui como objeto de estudo, o edifício sede do Tribunal de Justiça do Estado do Piauí, localizado no bairro Cabral, zona centro-norte de Teresina, PI, projetado em 1972 pelo arquiteto Acácio Gil Borsoi. Objetiva-se analisar uma proposta de intervenção nesta obra, referente à construção de um anexo situado entre o recuo da fachada sudoeste do edifício original e a rua Gov. Tibério Nunes. Este exemplar, em associação a outras produções modernas, constituem o patrimônio arquitetônico recente da cidade, sendo, ainda, considerada obra prima da produção arquitetônica de Borsoi, por consolidar um método projetual extremamente sensível ao lugar. Justifica-se a elaboração deste artigo pela necessidade de se averiguar, tecnicamente, a proposta deste anexo mediante a relevância da obra em questão para o patrimônio estadual. A metodologia empregada seguiu duas linhas de investigação: direcionou-se a primeira à análise do caso, desenvolvida através da coleta de dados referentes aos processos administrativos gerados para o licenciamento da obra. Ao passo que na segunda, buscou-se qualificar os impactos da proposta de intervenção através de simulações volumétricas e estudos das Cartas Patrimoniais. O valor arquitetônico da produção moderna piauiense é inquestionável, dessa forma, medidas preservacionistas devem ser tomadas urgentemente a fim de se proteger tal acervo, que a qualquer momento pode sofrer descaracterizações ou mesmo, demolições."
keyword: "Teresina; patrimônio recente; intervenções"
