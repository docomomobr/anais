abstract: "Este artigo tem como objetivo apresentar algumas das questões levantadas pela pesquisa da minha tese de doutorado, realizada no PPGH-UFG, apresentadas no exame de qualificação. Tem como objeto a leitura de indícios sobre a cidade de Goiânia, projetada nos moldes conceituais de cidade moderna para ser a capital do estado de Goiás, em 1933, e se fundamenta na hipótese da cidade como lugar de segregação social e espacial urbana, desde a sua fundação, mediante estudo do objeto casa, do “morar ordinário” do “homem comum” e do morar erudito “qualificado”. A escrita narrativa percorre o processo de desconstrução da historiografia oficial goianiense, para reconstruir diferentes perspectivas, interpretações dos fragmentos, das imagens do passado e à luz do presente, investigando identidades e valores sociais construídos historicamente, em diversos campos e temporalidades. Este artigo aborda, brevemente, os modelos iniciais de casas, destinadas aos funcionários do Governo de Goiás, que adquirem a terminologia peculiar “Casas-Tipo”; explana sobre as manifestações das linguagens estéticas arquitetônicas, que representam o morar erudito e as casas dos operários, que coexistem no tempo e no espaço da construção de Goiânia. Um lugar que pode demonstrar as relações simbólicas e culturais como lugar de embate, de apagamento da memória cultural patrimonial."
keyword: "cidade moderna; casa erudita; casa ordinária; usos da memória; Goiânia"
