abstract: "A arquitetura modernista e o movimento moderno foram responsáveis por uma grande revolução a nível mundial, nas camadas econômicas, culturais e sociais. Dentre esta mudanças, uma das mais significativas foi a inserção da mulher no mercado de trabalho, ainda que de maneira inapropriada, mas que futuramente culminaram na maior representatividade e posicionamento da mulher na arquitetura. Esta pesquisa teve por objetivo a valorização, a contextualização e o mapeamento das obras femininas modernistas na cidade de São Luís, nos séculos XX. Os resultados foram obtidos por meio do estudo de bases bibliográficas que contextualizassem o movimento moderno em si e a mulher na arquitetura, entrevistas com arquitetas ludovicenses, pesquisas de campos em órgãos públicos, levantamentos fotográficos e busca dos arquivos originais das produções arquitetônicas."
