abstract: A arquitetura colonial luso-brasileira dos séculos XVIII E XIX presente
  na cidade de São Luís possuem características únicas, como os telhados, paredes,
  terraços, denunciando os colonizadores da região. Com o passar do tempo, as influências
  modernistas também adentram o conceito arquitetônico da grande ilha, somando para
  o surgimento de um grande centro de investigação e um campo de estudo rico para
  a arquitetura e urbanismo. Dentro dessas linguagens modernistas, destacamos a arquitetura
  moderna rural vernacular, presente na capital, em uma escala menor, mas muito presente
  outras cidades do estado, em maior escala. Partindo disso, o principal objetivo
  desde trabalho criar um banco de dados a partir da catalogação de detalhes arquitetônicos
  da produção moderna vernacular, regional e rural no interior do Maranhão, com ênfase
  em nas áreas de Barreirinhas e Atins. O estudo segue uma linha metodológica de caráter
  qualitativo, utilizando-se de levantamento bibliográfico, de pesquisa documental,
  de levantamentos físicos arquitetônicos de moradias vernaculares na zona rural do
  Maranhão, e com a produção de fonte de dados do material levantado. A relevância
  desse estudo é cultura pois está centrado na manutenção e preservação da arquitetura
  como marco histórico.
keyword: Arquitetura Moderna; Vernacular; Maranhão
