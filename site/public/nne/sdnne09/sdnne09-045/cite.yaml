abstract: "Este artigo trata de uma reflexão sobre as modernidades na cidade de Alcântara - MA, através de uma análise do Plano de Recuperação da cidade elaborado pelos arquitetos Pedro e Dora Alcântara entre os anos de 1963- 1971, em diálogo com uma visita técnica realizada pelos alunos do Curso de Arquitetura e Urbanismo da UEMA na cidade em junho de 2022, na perspectiva de estabelecer uma comparação entre as ideias e projetos dos arquitetos com a situação atual da cidade com um olhar moderno sobre a cidade-museu. O trabalho tem a pretensão de estabelecer um paralelo entre as Alcântaras histórica e hodierna, com o fito de suscitar reflexões acerca dos mecanismos de preservação das entidades arquitetônicas e urbanísticas do município, vide sua importância histórica e cultural e seu potencial como impulsionador da esfera econômica local, que orbita em torno do turismo comercial focado no circuito de patrimônios que pontuam a Cidade Monumento."
