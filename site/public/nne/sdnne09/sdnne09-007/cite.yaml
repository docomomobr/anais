abstract: "ocupa lugar de destaque no panorama da arquitetura argentina. Dada a sua longa produção arquitetônica, pode-se afirmar que a mesma é composta por fases distintas. Este ensaio considera importante valorizar o primeiro período da carreira do arquiteto, às vésperas da comemoração de 100 anos de seu nascimento. Para exemplificar este momento, destacam-se as obras projetadas entre os anos 50 e 70 que impulsionaram o seu reconhecimento profissional, tanto na Argentina, quanto internacionalmente, sendo elas: o Centro Cívico de Santa Rosa (1955), o Banco de Londres (1960) e a Biblioteca Nacional (1961). Essas obras estão localizadas na Argentina e foram premiadas em concursos de anteprojetos. Além disso, é característica marcante entre elas a utilização do concreto aparente. Neste sentido, acredita-se que a cada novo projeto desenvolvido pelo arquiteto, valendo-se do uso do material, ele avança seus estudos sobre o mesmo, principalmente no que tange aos princípios de resistência e plasticidade, culminando em projetos onde a forma, a estrutura e a funcionalidade se ajustam e criam edificações de caráter próprio. Sendo assim, o presente trabalho tem por objetivo principal apresentar Clorindo Testa, desvelar a arquitetura produzida nos primeiros anos de sua carreira através da aproximação dos três projetos supracitados."
keyword: "Clorindo Testa; Centro Cívico de Santa Rosa; Banco de Londres; Biblioteca Nacional"
