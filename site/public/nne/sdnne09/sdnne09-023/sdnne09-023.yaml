abstract: O objetivo deste trabalho é discutir o processo de modelagem digital da
  Residência José Macedo (⁕1957 - †2000), de autoria do arquiteto Acacio Gil Borsoi
  por meio da tecnologia HBIM (Historic Building Information), com o intuído de compor
  o Obituário Digital da Arquitetura Moderna em Fortaleza. Trata-se de um esforço
  de ressuscitar a memória do arquiteto e da obra que já foi demolida no ano 2000,
  entendendo que o redesenho e a documentação digital possuem potencial de resgatar
  o valor dessas residências modernas em Fortaleza e no Nordeste em um contexto de
  voraz e predatória dinâmica imobiliária. A metodologia se sustenta na definição
  de pressupostos teóricos e práticos, bem como a sistematização de fontes para viabilizar
  a modelagem. A relevância do trabalho se refere ainda à produção de conhecimento
  no campo da historiografia da arquitetura moderna e a possibilidade de se valer
  da parametrização do edifício como subsídios para práticas de ensino, pesquisa e
  extensão.
