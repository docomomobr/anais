abstract: 'A análise da arquitetura moderna sob uma perspectiva da invisibilização
  feminina é um assunto que vem sendo tratada por diversos estudos. Em paralelo a
  cidade de São Luís, capital do Maranhão, tem um acervo arquitetônico moderno marcante,
  principalmente pelo seu contraste com a arquitetura colonial, predominante em seu
  centro histórico reconhecido como patrimônio mundial da UNESCO. A documentação dessas
  novas linguagens que começam a surgir a partir da década de 1930, demonstram as
  principais manifestações arquitetônicas desatreladas aos moldes coloniais. Esse
  artigo, aborda a necessidade de uma expansãp e revisão no campo da historiografia
  arquitetônica da cidade, de forma que busque a valorização da presença das mulheres,
  profissionais da arquitetura e do urbanismo dentro da cidade ludovicense. Objetivando
  a superação do problema de invisibilidade feminina a partir de um ponto inicial,
  o principal objetivo desse arquiteto é inserir o tema às pesquisas, instigar e incentivar
  novos pesquisadores a abordarem as trajetórias de arquitetas e urbanistas que colaboraram
  para a linguagem arquitetônica da cidade, com a exposição de nomes de mulheres formadas
  em arquitetura e urbanismo durante o século XX, que ajudaram a construir o acervo
  moderno, urbano e arquitetônico da capital. Dividindo-as em três categorias: oriundas,
  migrantes e peregrinas, apenas como meio metodológico de entender a circulação das
  profissionais no território brasileiro.'
