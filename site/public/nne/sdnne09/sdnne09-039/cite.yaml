abstract: "O presente artigo visa analisar o estilo modernista presente no Centro Histórico de São Luís, com foco no Edifício Colonial. Para isso, inicialmente, será estudado o contexto histórico de surgimento do Modernismo no continente europeu e seu estabelecimento como um dos principais estilos arquitetônicos do século XX, e também será feita uma análise de como ele chegou ao Brasil e, mais especificamente, na cidade de São Luís. Foi ainda realizada uma entrevista com um profissional renomado da área de conservação urbana e patrimônio histórico, a fim de entender sua perspectiva em relação a visão da população e dos profissionais sobre o modernismo no Centro Histórico de São Luís. Por fim, como estudo de caso, foi trabalhado o Edifício Colonial, apresentando sua história, analisando sua tipologia arquitetônica e problemas de conservação que o mesmo apresenta. Sendo assim, foram sugeridas diretrizes de intervenção para recuperar e valorizar essa edificação e seu entorno."
