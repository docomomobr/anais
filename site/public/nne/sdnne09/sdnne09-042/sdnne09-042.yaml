abstract: Este trabalho tem como objeto de estudo o pátio ferroviário da Estação Nova,
  mais especificamente o edifício da Estação que está localizado na cidade de Campina
  Grande, Paraíba. O mesmo foi construído entre 1957 e 1961 e faz parte do patrimônio
  protomoderno da cidade, tendo funcionado e composto durante décadas a linha de cargas
  e passageiros entre os estados de Pernambuco e Paraíba. Inserindo nesse contexto
  a discussão sobre patrimônio inteligente, busca-se apresentar aqui os resultados
  referentes à utilização de um veículo aéreo não tripulado (VANT) para imageamento
  e documentação do referido edifício. Ao permitir a produção de imagens e modelos
  tridimensionais com alta precisão, essa ferramenta pode auxiliar diretamente no
  estudo e conservação de obras em estado de degradação e abandono, assim como em
  outras áreas. Com isso, espera- se fomentar as potencialidades desse tipo de tecnologia,
  além de difundir sua utilização e estimular sua aplicação como instrumento de salvaguarda
  para o patrimônio e para a promoção de cidades mais inteligentes.
keyword: patrimônio inteligente; laser scanner; VANT; preservação
