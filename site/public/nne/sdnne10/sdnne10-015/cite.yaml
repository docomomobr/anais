abstract: "Monte Dourado (PA) é uma cidade-empresa que se destaca por sua arquitetura modernista com traços norte-americanos, sendo que sua estrutura inclui casas, escolas, comércio, hospital, igrejas e clubes numa área de 25.000m² aproximadamente, situada na região Norte do estado, na divisa com o Amapá. O objeto deste estudo é o reconhecimento documental projetual de sua arquitetura hospitalar, cuja sede atual foi estabelecida no início dos anos 90, mas que se originou ainda na década de 60 com uma pequena enfermaria em madeira às margens do Rio Jari. O Hospital enfrenta desafios significativos de conservação de sua estrutura e preservação dos arquivos relacionados ao projeto e execução, sobretudo, devido à decadência do Projeto Agroindustrial JARI e às transformações socioeconômicas na região. Objetiva-se assim, catalogar os arquivos existentes no acervo da instituição e documentar o edifício existente, compreendendo as modificações e adaptações do espaço e conservando a memória da população local e sua arquitetura. Através de pesquisa de caráter qualitativo, realizou-se a catalogação das peças gráficas 2D dos projetos de arquitetura e complementares por meio de registros fotográficos detalhados e levantamento bibliográfico para compreender e mapear a evolução do edifício ao longo do tempo, orientadas pelas pautas de pesquisa de Gastón e Rovira (2023). Os resultados incluem a criação de um acervo digital dos desenhos, permitindo análise acerca das técnicas de representação gráfica e das concepções projetuais, que servirão de base para a investigação do papel do hospital para a comunidade local do passado e do presente. Por fim, o trabalho contribui para a preservação da memória de Monte Dourado, visando subsidiar políticas preservacionistas e direcionando planos de investimentos para essa região que caminha rumo ao abandono. Além do que, a base de dados, integrada ao acervo do Laboratório de Memória e Patrimônio Cultural (LAMEMO/UFPA), possibilitará o desenvolvimento de pesquisas no campo que venham a revelar a identidade histórica e cultural que fazem parte das nuances da arquitetura moderna na região amazônica."
