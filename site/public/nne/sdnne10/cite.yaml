language: pt-BR
abstract: "Em 1982, a Projeto Editores Associados publicou, na série Cadernos Brasileiros de Arquitetura, dois volumes relativos ao Panorama da Arquitetura Cearense. No volume I foram divulgadas oito residências unifamiliares, projetos de professores e de egressos do curso de Arquitetura e Urbanismo da Universidade Federal do Ceará. As residências situam-se em Fortaleza, Sobral, Paracuru e Iracema. Os projetos são de autoria dos arquitetos Silvio Bandeira, Carlos Alberto da Cunha, José Capelo, Rui Mamede, Regis Freire, Gerhard Bormann, Nícia Bormann, Luiz Fiuza, Ione Fiuza, Francisco Veloso, Joaquim Cartaxo, Rosário Veloso e Prisco Bezerra. Ainda que pequena, a amostra é significativa das preocupações dos arquitetos cearenses no processo de projetação das casas modernistas do Ceará na década de setenta do século XX. O estudo das soluções arquitetônicas e a divulgação de arquitetos, não conhecidos pela historiografia, justifica o trabalho. Metodologicamente, a análise das obras tem como premissa a definição de arquitetura empreendida por Lúcio Costa. A arquitetura como construção com intenções plásticas adaptada aos condicionantes físicos e sociais. Neste sentido, persegue o sentido das problemáticas locais para a análise das arquiteturas, tal como propõe Marina Waisman. O artigo objetiva analisar as residências modernistas do Panorama atento aos condicionantes locais, regionais, que permearam o processo de projetação das obras. O retorno ao Panorama será feito pela vetorização do desenho impresso, pelas fotografias, elaboração de maquetes digitais, visitas as obras ainda existentes e entrevistas, quando possível, com os arquitetos. Os projetos reverberam uma multiplicidade de soluções com variações volumétricas, de distribuição espacial interna, de técnicas construtivas e materiais de construção. Invariavelmente, os memoriais justificativos de apresentação das obras iluminam preocupações relativas aos condicionantes físico sociais, como o uso de técnicas construtivas tradicionais, e climáticos. Reverberam inquietações quanto a orientação dos edifícios nos lotes para melhor captação de ventos. Também em relação à insolação, iluminação e criação de sombras. Algumas fazem uso de elementos tradicionais como o madeiramento de carnaúba e telha cerâmica. Noutras, as proposições fazem vibrar o concreto em vigas e pilares aparentes, brise-solei, pérgulas em jardins internos e lajes inclinadas corroborando com a captação dos ventos. Na maioria das vezes, prevalece o uso de esquadrias de venezianas em madeira. É possível afirmar que o risco proposto para residências resulta de um aprendizado onde o ensino dos pressupostos da arquitetura moderna brasileira entrou em contato com o estudo sistemático da arquitetura tradicional cearense."
keyword: "Arquitetura Moderna; Residência; Ceará"
