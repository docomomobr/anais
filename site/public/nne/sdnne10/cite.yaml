language: pt-BR
abstract: "Da pré-fabricação e da racionalização o arquiteto João Filgueiras Lima, o Lelé, molda o conhecimento construtivo a partir de um caminho profissional fundamentado em um sólido domínio no campo da construção civil, cuja produção envolve uma gama de atores decisivos para a realização de suas experiências a partir de uma metodologia participativa. Diante disso questionamo-nos como preservar esse legado arquitetônico considerando que transcende até mesmo a sua forma? Na busca por resposta, o presente artigo tem como objetivo apresentar uma breve descrição da obra de Lelé de forma a conhecer a inovação presente nos métodos de produção estabelecidos e desenvolvidos pelo arquiteto ao longo de sua trajetória profissional. Entendemos que tão importante quanto o tombamento das edificações projetadas por Lelé é a preservação do seu pensamento, por um lado racional / industrial, presente fundamentalmente nas fábricas de pré-moldados originadas pelo próprio arquiteto, e por outro lado na busca sensível e constante pelo aprimoramento de sua arquitetura, que caminhou da argamassa armada à hegemonia do aço. Dessa forma, é justo envolver nas ações de salvaguarda tanto as fábricas como sua postura presente nos modelos de produção. Diante disso, por meio de pesquisa bibliográfica fundamentada em autores referência na vida e na obra de Lelé, este artigo cruza os posicionamentos destes pesquisadores com questionamentos que instigam a temática. Resgatar e manter os núcleos fabris em funcionamento significa recuperar os princípios e objetivos da própria obra, no que diz respeito à manutenção e produção dos elementos pré-fabricados; e proporcionar um cenário de constante desenvolvimento tecnológico, encarando a fábrica como espaço de experimentação e criação de novos métodos racionalizados. Nesse sentido, três aspectos se tornam fundamentais na narrativa profissional do arquiteto: os atores que trabalharam com Lelé e que ofereceram contribuições significativas ao campo da racionalização; o conhecimento técnico e construtivo do arquiteto, consolidando-se com o tempo e, simultaneamente, em constante : Fabricar para Preservar Raony Rodrigues Bernardo André Araújo Almeida evolução; e as diversas relações que Lelé constrói com as empresas construtoras, o que corrobora a dinamização industrial do arquiteto. Como resultado espera-se compreender a postura didática/metodológica de Lelé, eficiente e educativa, a qual dialoga com as técnicas construtivas, com as preocupações de custo, de material e de impacto social."
