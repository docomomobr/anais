language: pt-BR
abstract: "Este estudo investiga a aplicação da inteligência artificial generativa (IAG), especificamente o modelo Stable Diffusion, na modernização e preservação da arquitetura amazônica, utilizando a obra Chapéu de Palha de Severiano Porto como objeto de estudo. O objetivo é analisar a eficácia da IAG na criação de recriações digitais precisas e detalhadas de patrimônios arquitetônicos. A justificativa para este trabalho está na necessidade de preservar digitalmente obras importantes que enfrentam desafios de conservação. A metodologia envolveu a construção de um banco de dados com 50 imagens da obra, a preparação dessas imagens para o treinamento do modelo, e a instalação da interface Automatic1111 em um computador equipado com hardware avançado. Foram utilizadas versões do MidJourney para gerar imagens que foram analisadas quanto à precisão na representação dos materiais, formas e contexto cultural da obra original. Os resultados mostraram variações significativas na qualidade e precisão das recriações digitais. A versão 1 do MidJourney apresentou limitações na compreensão do contexto e forma, enquanto a versão 5.2 mostrou uma evolução considerável, embora ainda apresentasse um viés artístico. A utilização do recurso /blend do MidJourney v5.2 resultou na representação mais fiel dos materiais e do contexto cultural. Este estudo destaca os desafios de implementação, como a necessidade de profissionais conhecedores da história e cultura locais e o treinamento contínuo das ferramentas. Conclui-se que a IAG possui um potencial significativo para a prototipação e preservação de patrimônios arquitetônicos na Amazônia, oferecendo maior eficiência, sustentabilidade e qualidade, mas exige abordagens cuidadosas para superar os desafios identificados."
