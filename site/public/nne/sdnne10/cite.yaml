ISBN: "978-65-272-1054-2"
language: pt-BR
abstract: "Fortaleza, entre as décadas de 1930 e 1960, experimentou um processo de modernização e incremento da população significativos, resultando na expansão do tecido urbano, no início da verticalização e na produção arquitetônica em razão do emprego de novos materiais construtivos e tecnologias, como o concreto armado e o elevador, respectivamente. Esses avanços tecnológicos repercutiram ainda na linguagem formal dos edifícios, que se afastam das tendências historicistas e incorporam influências de estéticas racionalizantes, como o Art Déco, identificando-se como uma “modernidade pragmática”. Trata-se de um acervo construído identificado como uma primeira modernidade arquitetônica na capital cearense de significativo valor cultural. No entanto, apesar da importância desse patrimônio cultural edificado para a história de Fortaleza, o que se observa atualmente é a ineficiência e a falta de efetividade de uma ação mais abrangente para a preservação e conservação dessas obras por parte do poder público e do setor privado. A recente ordem de demolição de uma das edificações mais relevantes e representativas desse período, na orla marítima da cidade, o Edifício São Pedro (1951) – tombado provisoriamente desde 2006, pela Lei Municipal nº 11.960 – evidencia a situação de risco e a ineficácia das políticas de tombamento. Além disso, em um levantamento feito com 50 obras relevantes, conforme foi documentado no Guia da Arquitetura (Proto)moderna de Fortaleza (1932-1960), apenas cinco apresentam instruções de tombamento, e reduz-se para três as edificações das quais os processos são definitivos. Assim, neste trabalho objetiva-se analisar e discutir as políticas e ações do Estado em relação aos processos de preservação do patrimônio, elencando o caso de algumas das obras produzidas no recorte temporal supracitado. O texto apoia-se em um referencial teórico que discute as manifestações de outras modernidades arquitetônicas em contextos espaciais e temporais distintos, com base em trabalhos acadêmicos e publicações. Os pressupostos práticos se ancoram em fontes primárias e secundárias, nas iconografias relativas ao período abordado, visitas técnicas e, ainda, faz uso da sistematização e documentação de 50 obras. Isto posto, como resultados esperados, busca-se promover um debate sobre a importância da conservação, para além da documentação, para a preservação desse acervo moderno em Fortaleza. Como efeito colateral, os resultados podem servir como base para possíveis instruções de tombamento. Por fim, faz-se necessário, de um lado, ressignificar esse acervo por meio de projetos de intervenção e estratégias de reuso; de outro, investir em educação patrimonial, de forma a contribuir para a conscientização sobre o valor arquitetônico, cultural e histórico destas obras."
