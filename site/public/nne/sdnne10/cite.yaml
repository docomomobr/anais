abstract: "Este trabalho possui como objeto de estudo a antiga Boate Cartola, inserida no Centro de Treinamento Renato Cunha Lima - o Renatão – pertencente ao Campinense Clube, localizado em Campina Grande, cidade do agreste paraibano, no nordeste brasileiro. O projeto foi desenvolvido pelo arquiteto Tertuliano Dionísio, e foi construído entre os anos de 1973 e 1974, no bairro da Bela Vista. A Boate Cartola funcionou durante décadas, sendo um local relevante para os eventos da cidade no final do século XX. O texto objetiva apresentar as experiências e investigações que foram desenvolvidas na disciplina de Projeto de Arquitetura V, vinculada ao curso de Arquitetura e Urbanismo da Universidade Federal de Campina Grande/UFCG – em prol da documentação e resgate patrimonial do conjunto arquitetônico. Justifica-se a abordagem dessa temática, considerando que a edificação em questão é de grande relevância para a arquitetura moderna campinense e de autoria de um arquiteto notável para a região, entretanto, a boate encontra-se em risco de demolição sem a devida manutenção e conservação pela gestão do Clube Campinense. Para apresentar tal levantamento, será utilizada uma proposta metodológica desenvolvida por AFONSO (2019), que propôs o estudo das dimensões arquitetônicas para a compreensão do objeto: Dimensão normativa; Dimensão histórica; Dimensão espacial (i. O espaço externo; ii. O espaço interno); Dimensão tectônica; Dimensão funcional; Dimensão formal; Dimensão da conservação do objeto. Desse modo, torna-se fundamental promover a intervenção adequada para possibilitar a reutilização eficiente do espaço."
