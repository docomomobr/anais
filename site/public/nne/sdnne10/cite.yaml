abstract: "O objetivo deste trabalho é destacar a importância e influência da produção arquitetônica e urbanística de Renato Azevedo em Campina Grande na década de 1970 a 1980, por meio da documentação dos seus projetos. Ao longo deste período, Azevedo desempenhou um papel crucial na formação do panorama urbano e arquitetônico da cidade, contribuindo significativamente para o desenvolvimento campinense. Justifica-se devido a importância da documentação do planejamento urbano moderno, que em parte, está esquecido nas prateleiras do acervo público municipal e que pode vir a contribuir com o planejamento urbano contemporâneo. Como metodologia foi adotada a pesquisa qualitativa, através de textos narrativos, matrizes e diagramas. Baseando-se em fontes primárias e secundárias, disponíveis nos arquivos públicos e privados, textos acadêmicos, como teses e dissertações, jornais, etc. Os resultados obtidos são descritos de maneira concisa, os projetos elaborados no período moderno que compreendem parte das duas décadas em que o arquiteto e urbanista atuou fortemente na cidade, com o apoio do Plano de Desenvolvimento do Local Integrado, contando com treze projetos de espaços livres que criam um sistema de espaços abertos na cidade, chamados de Áreas Para Fins Recreativos – APFR. O estudo constatou que o planejador urbano Renato Azevedo, especialmente durante a gestão da Companhia de Pró-desenvolvimento de Campina Grande – COMDECA, apresentou projetos que seriam de suma importância para Campina Grande, projetos estes que tiveram grande impacto no entretenimento, mas também na culturalmente, embora alguns não tenham sido implementados, o que teria reforçado o potencial educacional e esportivo para cidade. Com a socialização desta pesquisa, subsidiada pela dissertação de mestrado intitulada “Resgate da Documentação da Produção Arquitetônica e Urbanística de Renato Azevedo. Campina Grande (1968 - 1997)”, o planejamento urbano contemporâneo pode avaliar e compreender os princípios que regiam o pensamento do PDLI na década 1970."
