abstract: "O presente artigo discorre sobre o patrimônio modernista da cidade do Crato, localizada no Cariri cearense. Como um dos primeiros assentamentos urbanos do estado do Ceará, o município, devido à sua relevância histórica e belezas naturais, é popularmente conhecido como a \"Princesa do Cariri”. No entanto, o Crato abriga um patrimônio modernista pouco conhecido. Este trabalho, enquanto parte de uma pesquisa de mestrado em desenvolvimento no âmbito da Pós-graduação em Arquitetura e Urbanismo e Design da Universidade Federal do Ceará (PPGAU+D UFC), tem como objetivo identificar e inventariar, ainda que de forma panorâmica, obras representativas que dialogam com os princípios da arquitetura moderna na cidade do Crato. As edificações estão situadas no núcleo do seu centro histórico. A justificativa do estudo reside na necessidade de documentar e valorizar esses exemplares arquitetônicos, além de assegurar seu reconhecimento como de interesse cultural e fortalecer a memória coletiva da urbe. A metodologia empregada, a fim de descrever o cenário modernista do centro histórico cratense, envolve o levantamento de dados arquitetônicos e históricos, utilizando fontes diversas, tais como pesquisas de campo, material iconográfico e revisão bibliográfica; segue com a catalogação e identificação das edificações por meio da elaboração do inventário; e por fim, os dados são organizados digitalmente e analisados com a linguagem de programação Python©. Os principais resultados indicam que, apesar da variabilidade no estado de conservação, os edifícios com viés modernistas do Crato possuem um significativo valor arquitetônico e histórico. Destacam-se construções que refletem influências do modernismo brasileiro, adaptadas ao contexto local. A contribuição deste estudo é fornecer uma base sólida para futuras pesquisas sobre o patrimônio modernista da cidade e promover a conscientização acerca da importância do registro e preservação desses edifícios."
