language: pt-BR
abstract: "O presente artigo propõe a análise do Cine Capitólio, emblemático símbolo arquitetônico do período de modernização de Campina Grande foi inaugurado no ano de 1934, localizado na atual Praça Clementino Procópio, foi o primeiro cinema de rua a se instalar na cidade e gerou grandes transformações culturais e no desenho urbano central, com seu entorno sendo alterado e adaptado aos ideais de modernidade da época, passando por intervenções no período de 1962 para adaptarse aos ideias arquitetônico que pairavam na época, o Art Déco, o Cine Capitólio ainda mostrava-se como um local de reuniões e encontros na região central da cidade. Nos dias atuais, o local que um dia abrigou o cinema de destaque, encontra-se deteriorado e subutilizado na paisagem urbana, tornando sua intervenção um tópico crescente nas discussões entre intelectuais e entre camadas da população. O objetivo do presente estudo é propor a análise das propostas de intervenção direcionadas à edificação realizadas até os dias atuais, avaliando-as de acordo com os pináculos da intervenção do patrimônio construído e compreender as inadequações presentes em cada uma delas que as impediram de serem colocadas em prática. Para isso, a metodologia utilizada para embasar a presente pesquisa será a de Tinoco (2009) para compreensão dos danos presentes na edificação e as condutas a serem adotadas, juntamente da análise dos projetos de intervenção levados oficialmente à PMCG tendo como embasamento a Teoria do Restauro de Cesari Brandi estudada por Kuhl (2007). O debate atual busca compreender formas de intervir na edificação sem comprometer seu caráter histórico e patrimonial, girando em torno de promover o reavivamento da edificação e de sua história."
keyword: "Patrimônio Arquitetônico; Arquitetura Pragmática; Intervenção no Patrimônio Construído"
