abstract: "Antes mesmo da construção de Brasília, a Universidade Federal da Bahia já construía seus primeiros edifícios modernos e propunha um campus com inspirações corbusianas de generosos espaços livres e adensamento vertical. Apesar de um importante acervo eclético de edifícios adquiridos pela instituição, a esmagadora maioria de seu patrimônio é de expressão moderna, mesmo que de matrizes variadas. Esse patrimônio moderno, de iniciativa e construção da própria UFBA, embora pouco conhecido, começou desde 2013 a ser motivo de registro e atualmente a instituição vem trabalhando em ações em prol da preservação de seu patrimônio construído, incluindo suas significativas obras modernas. Pertencente a este patrimônio, a Casa da França, atual Instituto de Saúde Coletiva, foi o quinto edifício construído pela UFBA. Objeto deste artigo, o prédio teve diferentes usos ao decorrer do tempo, sendo Biblioteca Central e Faculdade de Comunicação e Biblioteconomia. A influência estrangeira na primeira metade do século XX no Brasil contribuiu para a consolidação da recém fundada Universidade da Bahia por meio da criação de institutos de extensão cultural. Fundados ainda na década de 1940, na Faculdade de Filosofia, tinham como objetivo o fomento à cultura e divulgação desses países por meio do ensino do idioma, das artes e de intercâmbios. Entre estes, há o Instituto Franco-Brasileiro, oriundo do Instituto Francês e criado pelo cônsul e professor francês Raymond Van der Haegen. Logo esse Instituto ganhou sede própria e a obra foi inaugurada em 1955, projeto dos arquitetos Wladimir Alves de Sousa e Geraldo Rapôso da Câmara, ambos formados na Escola Nacional de Belas Artes e professores da UFRJ, também autores das primeiras propostas para o Campus do Canela da UFBA. Com uma volumetria robusta e horizontalizada, o prédio tem a fachada principal envolta por paredes inclinadas que direcionam a laje à frente como uma marquise e parecem recuar a fachada sob esse grande pórtico. Além disso, essa mesma fachada é marcada por elementos verticais proeminentes que, apesar de verticais, acentuam a horizontalidade do edifício, devido a sua repetição e ritmo. O edifício apresenta elementos típicos do discurso modernista. Nele estão presentes a planta livre e a fachada livre pois, apesar de estarem entre os pilares, as aberturas se diferenciam da estrutura na fachada por estarem em planos distintos. A despeito das alterações, internas e externas, ele ainda guarda suas principais características e é passível de restauração – intervenção que vem sendo desenvolvida no Mestrado Profissional MP-CECRE/UFBA. Esse artigo busca então contribuir para o conhecimento, compreensão e valorização dessa obra exemplar do primeiro momento do modernismo ções do Moderno na Bahia: Casa da França Juliana Cardoso Nery e Clara Rachel Reis na Bahia, dando visibilidade e ratificando seu reconhecimento como patrimônio construído da Universidade."
