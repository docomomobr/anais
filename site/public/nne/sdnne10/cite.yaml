id: sdnne10-067
type: paper-conference
title: "Questões sobre a conservação do moderno e o autêntico, o heroico e o tardio"
container-title: "10º Seminário Docomomo Norte/Nordeste, Campina Grande, 2024"
event-title: "10º Seminário Docomomo Norte/Nordeste, Campina Grande, 2024"
event-place: "Campina Grande, PB"
publisher-place: "Campina Grande, PB"
issued:
  date-parts:
    - [2024, 11, 11]
ISBN: "978-65-272-1054-2"
language: pt-BR
abstract: "O artigo discute como a noção de conservação tem sido considerada e mobilizada em relação à produção modernista no Nordeste do Brasil. Para tanto, parte-se da noção da “Teoria Contemporânea da Conservação”, de Muñoz-Viñas, no contexto de discussão sobre as ações necessárias para conservação do acervo modernista em meio aos avanços das noções de patrimônio. Contexto também de perda expressiva e reconhecida de espaços e edifícios modernistas nas últimas décadas. Assim, para além dos importantes trabalhos de documentação (de projetos, obras, processos, trajetórias intelectuais e institucionais) que marcaram e ainda marcam a produção exposta e discutida nos seminários DOCOMOMO Brasil (desde 1992) e Norte/Nordeste (desde 2006), este artigo busca fazer uma revisão sistemática sobre os trabalhos apresentados nos eventos que tiveram o tema da conservação e do restauro/intervenção como norte principal, procurando identificar tendências, pressupostos teóricos e metodológicos e caminhos e contribuições. É possível categorizar essa produção científica em três grupos: dos textos que discutem questões mais teóricas; dos que discutem casos de projetos e obras de intervenção em bens modernistas de interesse patrimonial; e dos que focam nos esforços de preservação da arquitetura moderna (desde as lutas preservacionistas, as experiências de sensibilização e educação patrimonial até as ações projetuais e institucionais de conservação). Antes de mais nada, deve-se observar que os trabalhos que apresentaram relação direta com esse norte proposto são uma minoria dentro das discussões dos seminários DOCOMOMO. E das três categorias elencadas, predominam os estudos de caso de projetos e obras. Por outro lado, discussões mais embasadas teoricamente sobre conservação e restauro são pouco expressivas quantitativamente, embora os poucos textos apresentados apontem caminhos mais atualizados para pensar o acervo modernista do ponto de vista patrimonial. Percebe-se a superação da valorização apenas das obras do período heroico, inclusive porque parte significativa da produção modernista no Norte e Nordeste aconteceria no pós-Segunda Guerra. Ainda assim, as obras do chamado “modernismo tardio” enfrentam mais dificuldades de reconhecimento (e, por conseguinte, de receber ações de preservação)."
keyword: "conservação; historiografia; valor; DOCOMOMO; princípios teóricos"
