ISBN: "978-65-272-1054-2"
language: pt-BR
abstract: "Ao longo de quase 4 décadas na Amazônia brasileira, Severiano Mário Porto desenvolveu mais de 200 projetos, em uma manifestação genuína entre o regional e o moderno. A análise de sua obra, assim como todo exercício de olhar para os projetos de arquitetura, em suas múltiplas formas, tem valor inestimável, sendo um conjunto de processos de investigações nas quais o pensamento projetual é apreciado a partir de reflexão, escrita, teste, verificação, debate, divulgação, entre tantos, o que pode oferecer lampejos criativos e valiosos, com potencial para impacto científico e social. Contudo, é preciso adotar filtros analíticos para destacar aspectos permanentes de um projeto, evidenciando um ou mais elementos específicos na sua concepção, o que demanda a decomposição de suas múltiplas camadas. Nesse sentido, esse artigo documenta e apresenta a produção de espaços de educação que compõem a obra do arquiteto brasileiro Severiano Mário Porto no estado setentrional do Brasil, Roraima, ainda pouco observado e discutido, com o resgate do projeto original por meio do redesenho. A metodologia engloba o levantamento documental no acervo do referido arquiteto, junto ao Núcleo de Pesquisa e Documentação da FAU UFRJ (NPD FAU UFRJ), e análise a partir de sua concepção original, adotando o redesenho a nível de planta baixa e cortes, com ferramentas computacionais para a reprodução da forma. Como resultado, foram identificados 3 projetos educacionais no estado de Roraima, todos na capital, a cidade de Boa Vista, sendo eles: Escola de 2° grau, identificada como Escola Gonçalves Dias (1974), Escola Oswaldo Cruz (1974) e Escola Modulada de 1º Grau, identificada como Escola 31 de Março (1976). Pelos desenhos de planta baixa, verifica-se que a forma é caracterizada por modelos retangulares, organizados em blocos (pavilhões), com a presença de átrios internos e jardins, separados por funções administrativas, serviço, uso pedagógico ou esportivo. Nas salas de aula, o sistema de envoltória apresenta disposição que sucinta o uso de elementos adequados para lidar com o contexto climático local. Nos desenhos de corte, verificam-se soluções de cobertura similares entre os projetos, com beirais prolongados e vedações com elementos vazados, além de uma clara conexão entre projeto e topografia. Apresentar projetos ainda pouco explorados de Severiano Mário Porto é sempre uma oportunidade relevante, tendo em vista a singularidade de sua obra. Espera-se que este trabalho contribua com novas investigações a partir de um lugar apresentado e documentado da obra educacional de Porto no estado de Roraima."
keyword: "Análise de projeto de arquitetura; projeto bioclimático; Amazônia brasileira"
