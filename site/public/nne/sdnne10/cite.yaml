abstract: "A produção do arquiteto Sérgio Bernardes na cidade de João Pessoa, o Hotel Tambaú e o Espaço Cultural José Lins do Rêgo, construídos na segunda metade do século XX, configuram elementos de destaque no imaginário e na paisagem da cidade, pela forma e estrutura, mas também pela espacialidade proposta. Assim, orbita nessa chave, também, a importância de seus interiores, sobretudo do mobiliário empregado, em parte, desenhado pelo próprio arquiteto. Reconhecendo o elemento da cadeira como um ponto de interesse entre arquitetos desde os princípios do movimento moderno, este artigo tem como objetivo refletir sobre as abordagens de intervenção realizadas ao longo do tempo no interior do Espaço Cultural José Lins do Rêgo, discutindo especialmente a ação realizada na década de 1990 que promoveu a retirada dos bancos/jardineiras em concreto da Praça do Povo e a posterior substituição das cadeiras desenhadas por Bernardes para as plateias do teatro, do planetário e do cinema (hoje, sala de concertos), ocorrida no âmbito da extensa intervenção concluída em 2014. Propõe-se que os argumentos para intervir sobre os dois elementos apresentam motivações e resultados distintos e passíveis de discussão, com a remoção dos bancos resultando na conformação de um espaço aberto e livre de obstáculos, o que ampliou as possibilidades de uso da Praça e apropriação por parte dos usuários, enquanto a retirada das cadeiras das referidas plateias, apontando para uma desconsideração da relevância deste mobiliário enquanto parte integrante da arquitetura, e portanto, digno de esforços para sua conservação. Tal incompreensão conduziu a um caminho mais fácil – o da substituição de um item singular, concebido em articulação com aqueles ambientes – O Espaço Cultural de João Pessoa (PB): sobre concessões e dilemas no trato do espaço interno. Guilherme Amorim Cavalcanti; Wylnna Carlos Lima Vidal por poltronas, sim, confortáveis, mas genéricas, como foi realizado. Pretende-se contribuir com as discussões acerca da conservação da arquitetura moderna em João Pessoa, bem como do papel que o mobiliário desempenha na composição de um conjunto coeso a ser preservado, sobretudo, no caso do Espaço Cultural, em que tais elementos fazem parte do discurso tecnológico e inovador presente nas obras e marcante na trajetória do arquiteto."
