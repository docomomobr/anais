abstract: "O Campus Norte da Universidade teve seu desenvolvimento iniciado em 1973 com as obras realizadas na década seguinte e que, ainda hoje, seguem em construção. A presente pesquisa pretende investigar as mudanças entre o projeto arquitetônico original da Faculdade de Tecnologia, localizada no Campus Norte, e o projeto construído e seus usos até a presente data. A importância da pesquisa se dá tendo em vista o peso da concepção do projeto feito pelo arquiteto Severiano Mario Porto (1930 - 2020), projetista de obras que marcam a história da arquitetura na Amazônia, unindo técnicas locais e processos oriundos do canteiro de obras com tecnologias em ascensão na época. Dentre suas diversas obras icônicas, o Campus Universitário da UFAM - Universidade Federal do Amazonas se implanta capaz de travar um diálogo profundo com o clima local. Serão investigados os fatores relacionados às modificações de uso dos edifícios após sua construção para o cumprimento de demandas distintas àquelas que foram concebidas, além das mudanças nos materiais de revestimento e compartimentação dos edifícios que vão de encontro aos ideais de Severiano para uma Cidade Universitária, sempre influídos da arquitetura moderna brasileira."
