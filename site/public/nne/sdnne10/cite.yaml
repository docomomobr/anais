abstract: "Com o intuito de proporcionar uma perspectiva informativa e reflexiva acerca do patrimônio moderno campinense, o presente estudo documenta e explora em abordagem descritiva e crítica da Residência Sebastião Pedrosa — projeto de autoria do arquiteto pernambucano Tertuliano Dionísio, em conjunto com José Luiz Menezes e Edy Marreta —, através de uma análise arquitetônica da obra em questão. Desta forma, oferece-se um exemplo de como o patrimônio moderno da cidade tem sofrido com o impacto da desvalorização e descaracterização no decorrer dos anos, ao mesmo tempo que o trabalho revisita o material do projeto original por meio de um redesenho, com princípios modernos da obra estudada. A metodologia adotada, é utilizada por AFONSO (2019), que examina as dimensões normativa, histórica, espacial, tectônica, funcional, formal e de conservação. O estudo tem aporte teórico principal o E-book Campina Grande Moderna (AFONSO, 2022), que serve de modelo e direção para o presente trabalho. Destarte, o estudo mostra-se relevante ao abordar o patrimônio moderno campinense em seu estado atual; patrimônio este que devido à falta de proteção, vem sofrendo com reformas descaracterizantes, patologias nãosolucionadas e até mesmo demolições. Expõe-se, então, a visível importância de resgatar a memória da Arquitetura Moderna em sua integridade antes que a carência de medidas conservacionistas a tornem irrecuperável."
