abstract: "Esse resumo trata-se de uma análise sobre a conservação do patrimônio do Ginásio César Ribeiro, projetado no ano de 1963, pelo arquiteto carioca Hugo Marques. Com isso, o estudo busca realizar uma análise acerca do estado de preservação dessa obra moderna, situada no atual Centro de Treinamento do Campinense Clube, no bairro Bela Vista, em Campina Grande–PB, tratando-se dos aspectos de preservação, manutenção e valorização do edifício. Tendo em vista a sua importância arquitetônica para o clube e para a cidade, a socialização do atual descaso dessa obra enfatiza o compromisso de buscar valorizar a história e a cultura local, uma vez que o clube, enquanto ambiente de encontro, evoca memórias afetivas para a população campinense, e atualmente, infelizmente o encontramos desativado e sendo invadido por jovens que praticam o uso indevido e inseguro do local. A análise desse artigo se baseia na metodologia de LICHTENSTEIN (1986) e TINOCO (2009), que norteou o desenvolvimento de fichas e mapas de danos, identificando as principais patologias presentes na edificação, contemplando a tectônica (estrutura e cobertura), as peles, a materialidade e os detalhes construtivos, além de propor diretrizes para a sua revitalização. A necessidade de reconstituir esse patrimônio moderno campinense é inegável, mas, até quando será permitido que crianças e adolescentes das comunidades circunvizinhas, como o Pedregal, irão ficar sem um espaço de lazer e prática esportiva devido ao descaso na manutenção e da administração deste edifício?"
