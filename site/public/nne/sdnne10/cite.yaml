abstract: "Tendo em vista a importância do arquiteto Lelé tanto para as pesquisas e o desenvolvimento da tecnologia da pré-fabricação com argamassa armada, quanto para o cenário na arquitetura brasileira, esta pesquisa acolhe como objeto de estudo o CAIC (Centro de Atenção Integrada à Criança e ao Adolescente), mais precisamente o CAIC Maria Alves Carioca, localizado no bairro Granja Lisboa, na cidade de Fortaleza, no Ceará, e que atualmente funciona como uma escola de ensino público (EEMTI - Escola de Ensino Médio em Tempo Integral). A questão a ser tratada fundamenta-se no fato de que pouco se é falado ou discutido a respeito da arquitetura de Lelé na cidade de Fortaleza e, para além disso, a temática do patrimônio moderno ainda está a passos iniciais, exclusos a certos núcleos que não levam a discussão ao público mais leigo, sendo necessária a aplicação de abordagens e práticas mais diversificadas que envolvam educação patrimonial. Ademais, há uma desapreciação ao se tratar dos CAIC’s, banalizando e marginalizando a imagem do edifício até mesmo dentro do cenário Moderno, ainda que muitas unidades estejam em pleno funcionamento e necessitando de restauro e manutenção. Portanto, este artigo busca contribuir com o desenvolvimento de metodologias projetuais que estejam comprometidas à preservar e conservar o bem edificado, por meio de experimentações práticas com a pré-fabricação, de diálogos com a população e de aplicações participativas e democráticas de um método que tenha como uma das finalidades aproximar os mais leigos dessa temática. Diante disso, a metodologia que guia esta intenção pode ser dividida em quatro etapas: 1. Pesquisa bibliográfica com o intuito de fundamentar o discurso do trabalho em questão, fazendo o uso de livros, artigos e sites; 2. Realização de entrevistas, e análise de documentos e desenhos, com intuito de investigar a vida e obra do arquiteto João da Gama Filgueiras Lima, o Lelé; 3. Estudo aproximado do CAIC em questão; 4. Elaboração de um projeto, à nível conceitual, propondo diretrizes que orientem a reforma do edifício, apoiadas nas técnicas de restauro abordando o material e seus processos de fabricação (no caso, a argamassa armada), as técnicas de pré-fabricação, além do processo de intervenção que será orientado a partir de uma oficina participativa com os usuários do CAIC."
