ISBN: "978-65-272-1054-2"
language: pt-BR
abstract: "Incorporar os edifícios históricos às novas dinâmicas urbanas é essencial para salvaguardar e transmitir a identidade cultural de uma sociedade, pois eles são testemunhas de gerações. Alinhado aos princípios da sustentabilidade, surge a importância de intervir e reabilitar, garantindo sua segurança e durabilidade com a menor agressão aos valores do patrimônio. Este artigo apresenta o prédio da antiga Reitoria da UFPB (1963-1966), projetado originalmente por Leonardo Stuckert. Situase na Avenida Getúlio Vargas, em Área de Preservação Rigorosa, do Centro Histórico Inicial de João Pessoa, delimitado pelo Decreto Estadual 25.138/2004. O imóvel modernista abrigou diferentes instituições ao longo do último meio século, e foi objeto de intervenções internas para assegurar sua funcionalidade. Por outro lado, elementos de fachada, como revestimentos e esquadrias, alcançaram um precário estado de conservação, impactando na estanqueidade e na usabilidade do edifício, e motivaram a realização de um retrofit (2014-2016). Este contemplou a substituição das instalações, esquadrias e revestimentos, tendo como premissa o alinhamento às recomendações básicas face à sua proteção decorrente do Decreto Estadual 7.819/1978, pela Lei 9.040/2004, e a sua classificação como Conservação Parcial. Diante da relevância do edifício na difusão da arquitetura moderna em João Pessoa (1950-1970), bem como no seu impacto na paisagem urbana da área onde se insere, este trabalho tem como objetivo explorar aspectos relevantes do retrofit executado para a documentação da intervenção no edifício, com ênfase à sua usabilidade e à sua preservação. Para tanto, foram realizadas revisão bibliográfica, levantamento documental e fotográfico, antes, durante e após a intervenção. Dentre os documentos, destacam-se o Projeto Executivo de Reforma, As-Built, Especificações Técnicas, Laudos, Pareceres e Deliberações do Instituto do Patrimônio Histórico e Artístico do Estado da Paraíba. Como principais resultados, são analisadas as modificações internas em relação ao projeto original, observando as características : Resgate da memória de um edifício moderno no nordeste brasileiro Lumy Noda, Amanda V.P. Lima, Mayara C. B. Sousa arquitetônicas, tecnologias e materiais empregados, identificando, no processo, as qualidades intrínsecas ao repertório moderno que facilitam a adequação ao uso. São mapeados desafios encontrados nos processos de desenvolvimento do projeto e da execução, com ênfase no resgate das características originais da fachada original. A relevância deste artigo parte de uma estratégia de valorização e preservação do patrimônio modernista, a partir da exposição de desafios encontrados no retrofit, contribuindo em futuras ações de proteção, conservação e memória da arquitetura moderna no Nordeste brasileiro."
