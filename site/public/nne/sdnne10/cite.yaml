id: sdnne10-063
type: paper-conference
title: "Patrimônio industrial em projeto: a Fazenda Raposa na região metropolitana de Fortaleza"
container-title: "10º Seminário Docomomo Norte/Nordeste, Campina Grande, 2024"
event-title: "10º Seminário Docomomo Norte/Nordeste, Campina Grande, 2024"
event-place: "Campina Grande, PB"
publisher-place: "Campina Grande, PB"
issued:
  date-parts:
    - [2024, 11, 11]
ISBN: "978-65-272-1054-2"
language: pt-BR
abstract: "O objeto desta pesquisa é o patrimônio industrial, considerando a sua dialética de valorização simbólica e de ocupação física do território urbano. Mais especificamente trataremos do conjunto industrial edificado da Fazenda Raposa no Município de Maracanaú, Região Metropolitana de Fortaleza, construído pela empresa estadunidense S. C. Johnson \u0026 Son em 1937, onde houve a produção de cera de carnaúba até 1969, mas hoje em desuso e em avançado estado de arruinamento. Objetivo deste trabalho é contribuir para a reflexão crítica a respeito dos motivos axiológicos que suportam a ideia de proteção e salvaguarda do patrimônio industrial e, diante disto, pretende-se investigar a sua “potencialidade de projeto”, como meio principal para garantir a sobrevivência destes conjuntos na nova realidade urbana onde se inserem. A sobrevivência destes grandes conjuntos fabris não é fácil no âmbito da trama urbana que avança e os envolve com interesses especulativos próprios, guiada por um “Plano Diretor” que normalmente os ignora. Não é possível nem mesmo considerar óbvio o interesse político sobre eles já que, por outro lado, estão sujeitos a certa invisibilidade social e midiática, não cumprindo com os ideais axiológicos clássicos do restauro, ligados ao valor histórico e ao valor estético. De fato, o interesse e o reconhecimento dos objetos arquitetônicos industriais como patrimônio é bastante recente, e vem ligado ao conceito de arqueologia industrial, a partir da segunda metade do século passado. Nesta primeira fase, o patrimônio industrial se relaciona a edificações como “estações” e “pontes” e, mais raramente, a verdadeiros complexos fabris, que serão valorizados como objetos de patrimônio muito mais tarde. O fato que o reconhecimento de um valor patrimonial destes complexos arquitetônicos ser tão recente comporta mais uma complicação: as teorias patrimoniais e as normativas locais ainda são carentes em relação ao assunto de salvaguarda dos conjuntos industriais, havendo mais incertezas do que certezas. Metodologicamente falando, este trabalho tenciona analisar a Fazenda Raposa, objeto desta pesquisa, pelos vieses da História da Teoria da Salvaguarda do Patrimônio Industrial, frente às expectativas de uso por parte da Universidade Federal do Ceará e da Prefeitura de Maracanaú, além do resultado do último levantamento realizado no terreno em abril de 2024. Hoje a Fazenda Raposa é de propriedade da Universidade Federal do Ceará e existe, portanto, um renovado interesse de uso ao qual este artigo quer contribuir revelando o “potencial de projeto” deste complexo industrial."
