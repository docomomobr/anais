title: "A arte azulejar de Athos Bulcão no Parque Histórico Nacional dos Guararapes-PE: um estudo sob a perspectiva do design de superfície das peças de azulejo do parque"
container-title: "10º Seminário Docomomo Norte/Nordeste, Campina Grande, 2024"
event-title: "10º Seminário Docomomo Norte/Nordeste, Campina Grande, 2024"
event-place: "Campina Grande, PB"
publisher-place: "Campina Grande, PB"
issued:
  date-parts:
    - [2024, 11, 11]
ISBN: "978-65-272-1054-2"
language: pt-BR
abstract: "O presente trabalho busca elucidar aspectos compositivos dos murais azulejares, enaltecendo sua relevância como patrimônio material e imaterial representados por suas composições gráficas. O produto azulejar transcendeu sua função primária de proteção contra as intempéries, transformando-se em um símbolo cultural de diversas regiões. Neste contexto, a investigação visa contribuir para a visibilidade do produto azulejar, destacando as noções compositivas que nortearam a concepção dos grafismos presentes na face vitrificada deste produto. Diante do exposto, o objeto de estudo deste artigo consiste nos murais azulejares modernos idealizados pelo artista Athos Bulcão para adornar uma das obras mais conhecidas do arquiteto pernambucano Armando de Holanda: o Parque Nacional Histórico dos Guararapes, em Pernambuco. Perante tal proposição, torna-se pertinente o uso do material desenvolvido pelo grupo de pesquisa Arquitetura e Lugar (GRUPAL) da Universidade Federal de Campina Grande (UFCG), destacando as constatações dos pesquisadores para embasar e fortalecer as discussões sobre os azulejos modernos presentes no parque. Tais estudos apontam uma elevada degradação das obras do parque citado. Para viabilizar a análise dos grafismos do produto azulejar, foram tomadas como base as noções norteadoras do Design de Superfície, em conjunto com noções pertinentes da compreensão teórica da linguagem visual. Serão elucidados os aspectos compositivos dos motivos, somados à compreensão do rapport proposto na obra de Athos Bulcão, com o intuito de ampliar a percepção do observador sobre os detalhes dos elementos do painel. Além desta discussão sobre os aspectos compositivos, o estudo também busca reconstruir em modelagem bidimensional e tridimensional os grafismos das peças e suas aplicações, no intuito de preservar a memória azulejar do parque, dado o estado de degradação em que se encontram os painéis azulejares do Parque Nacional Histórico dos Guararapes."
keyword: "Athos Bulcão; murais azulejares; arquitetura moderna"
