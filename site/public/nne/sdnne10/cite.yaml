language: pt-BR
abstract: "Dentre as várias características da arquitetura moderna há a “imagem fotográfica”, passível de revelar o potencial estético da edificação no contexto urbano. Com o avanço tecnológico, os equipamentos fotográficos tornaram-se um instrumento importante para representar a vida moderna no século XX. A exemplo da ligação entre o artista plástico e fotógrafo russo Alexander Rodchenko e o designer e professor da Bauhaus László Moholy-Nagy, que defendiam a fotografia como uma ampliação da visão humana. Observa-se que nos livros e revistas especializadas, a fotografia está presente para apresentar a arquitetura moderna e sua expressão estética, sendo um forte instrumento de disseminação. Compreendendo a importância do recurso fotográfico e da necessidade de ampliar a divulgação da arquitetura moderna na região Nordeste do Brasil, mais precisamente na cidade de Maceió-AL. Esta pesquisa tem como objetivo explorar através da fotografia a representatividade da arquitetura moderna no bairro do Centro da capital alagoana, destacando sua influência na construção da imagem do lugar, utilizando a fotografia urbana como forma de registro, inicialmente para descobrir e posteriormente documentar. A metodologia utilizada parte de uma abordagem qualitativa, bibliográfica e principalmente dos dados obtidos em campo, a partir de uma fotoetnografia, permeado entre as fronteiras do conhecimento científico e fotográfico, as entendendo como uma forma de liberdade criativa, documental e interpretativa. Diante disto, as discussões apresentadas ao longo deste texto procuram evidenciar como a documentação imagética torna-se um recurso de linguagem expressiva, resultando no ato de desvelar edificações modernas para além das já apresentadas em referências locais sobre a temática e àquelas veiculadas em portais digitais sobre a história de Maceió/AL. Desta forma, este artigo busca contribuir não só para pesquisas acadêmicas, como também um potencial de divulgação e ampliação de acesso social à arquitetura moderna da cidade."
keyword: "Arquitetura Moderna; Documentação; Fotografia; Maceió/AL"
