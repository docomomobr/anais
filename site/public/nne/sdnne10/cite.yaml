abstract: "A revista Técnica, criada em 1940 pelo Sindicato de Engenheiros da Bahia, por sua vez, vinculada à Escola Politécnica da então Universidade da Bahia, constituiu-se na única revista especializada em engenharia, arquitetura e urbanismo na cidade de Salvador, à época. A sua importância tem sido valorada por alguns pesquisadores por ser considerada como fonte categórica para entender não só os processos de transformação da capital baiana, mas também como termômetro da presença da arquitetura moderna soteropolitana. Apesar disso, a revista em si, não tem sido devidamente estudada de forma mais ampla e detalhada. Assim, neste artigo, propomos debruçar-nos sobre o conteúdo da revista, tendo alguns questionamentos como fios condutores: quem formou o corpo editorial da revista? Como foi estruturada? Qual a linha editorial da revista? Quais as profissões dos autores e qual a importância que eles desempenharam no desenvolvimento urbano? Quais as temáticas que foram favorecidas? Qual o espaço, de fato, que a revista deu para temas voltados para arquitetura e urbanismo? Que arquitetura foi divulgada? Onde estavam localizados os projetos divulgados? É possível afirmar que a revista privilegiou os exemplares modernos? Uma análise preliminar nos mostra algumas características relevantes. A revista Técnica teve duas fases: uma de 1940 a 1950 e outra que vai de 1955 até a sua extinção, em 1959 (ela deixou de ser publicada entre 1951 e 1954). Esse fato se deu por causa de sua venda para o órgão da Fundação para o Desenvolvimento da Ciência na Bahia, que deu um viés mais científico e intelectual, onde a arquitetura desaparece. Outra questão importante tem a ver justamente com seu conteúdo; apesar de o período de circulação coincidir, como falado anteriormente, com os processos de “modernização” da capital baiana, o que se percebe é, no entanto, um viés muito mais eclético, que mostra uma Salvador, também eclética, onde existiam mudanças, mas também permanências."
