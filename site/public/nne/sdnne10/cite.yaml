title: "Áreas verdes no projeto de Oswaldo Bratke no Amapá: análise do processo de transformação dos espaços de jardins no conjunto operário da Vila Amazonas"
container-title: "10º Seminário Docomomo Norte/Nordeste, Campina Grande, 2024"
event-title: "10º Seminário Docomomo Norte/Nordeste, Campina Grande, 2024"
