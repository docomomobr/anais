language: pt-BR
abstract: "O presente artigo apresenta a investigação realizada através de estudos desenvolvidos para a disciplina Arquitetura Contemporânea Brasileira, ofertada em 2021, através de uma parceria entre os Programas de Pós-Graduação da FAU-USP, PPGDU MDU/UFPE e PROPAR/UFRGS. Parte-se da compreensão de que o Movimento Moderno, ainda que tenha sido um ideal difundido no Brasil na década de 1960, até hoje encontra um lugar de inspiração e referência em diversas obras contemporâneas. O objeto de estudo desta pesquisa são as obras Academia-escola Unileão e o Hospital Veterinário Escola Unileão, ambos projetos do escritório Lins Arquitetos Associados, localizados na cidade de Juazeiro do Norte, Cariri do Ceará. Ambas as obras têm em comum as principais diretrizes do escritório que flertam diretamente com os preceitos do Movimento Moderno, quais são: o respeito ao local de intervenção, a adaptação do edifício ao clima e a utilização de materiais presentes na região. Os membros do Lins Arquitetos Associados se apresentam assumidamente como leitores da obra do arquiteto pernambucano Armando de Holanda, posto isso, o artigo traz como objetivo a análise de duas obras do Lins a partir dos princípios propostos por Holanda, em 1976, no “Roteiro para construir no Nordeste: arquitetura como lugar ameno nos trópicos ensolarados”. Dessa forma, o artigo estrutura-se em três partes: 1. panorama geral do movimento moderno e suas contribuições para a contemporaneidade; 2. Apresentação do Lins Arquitetos Associados e das obras escolhidas para análise; e 3. Análise das obras por meio dos parâmetros de Holanda (1976). Os procedimentos metodológicos se sustentam no levantamento bibliográfico sobre o Movimento Moderno, no levantamento e análise do material gráfico e técnico dos projetos e do uso de uma entrevista realizada com uma das arquitetas do escritório Lins Arquitetos Associados. Por fim, o trabalho busca contribuir para a leitura de um campo de ideias - do Movimento Moderno - que ultrapassa os limites do tempo e encontra nas entrelinhas da contemporaneidade um espaço de atualização de repertório, de técnicas construtivas e de estética, como é o caso das obras do Lins Arquitetos Associados."
