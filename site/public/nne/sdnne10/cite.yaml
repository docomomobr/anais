language: pt-BR
abstract: "O objeto de estudo dessa pesquisa consiste em uma análise experimental de um conjunto de técnicas que subsidiem a reprodução de elementos pré-moldados de argamassa armada utilizados nos Centros de Atenção Integral à Criança e ao Adolescente/CAIC. O arquiteto João da Gama Filgueiras Lima (1932-2014), Lelé, foi o responsável por liderar uma equipe, no início dos anos 1990, que desenvolveu o projeto piloto para os CAICs. A meta inicial do projeto baseava-se na construção de 5.000 unidades para atender aproximadamente seis milhões de crianças por todo país, contudo apenas 7% das construções foram efetivamente implantadas (350), mas enfrentam uma série de dificuldades para a manutenção de sua conservação física. Sendo assim, o objetivo geral dessa pesquisa é investigar técnicas de modelagem e fabricação digital, para o estudo de componentes que apresentaram não conformidades e a fabricação de seus respectivos moldes, visando à facilitação da reprodução desses componentes no contexto das obras que adotam o sistema construtivo dos CAICs. Tirando partido disso, justifica-se inicialmente a abordagem dessa temática ao incorporar o caráter propositivo em estruturas pré-existentes visando salvaguardar esse patrimônio arquitetônico tecnológico da contemporaneidade que adota princípios da modernidade do mestre Lelé. Além disso, a busca de métodos de reprodução de componentes visando a sua substituição na estrutura dos CAICs, tem amparo em recentes iniciativas. A exemplo da recuperação do módulo Iansã, antiga sede do programa de pós-graduação da Faculdade de Arquitetura da Universidade Federal da Bahia/FAUFBA, que teve parte de seus componentes substituídos sem comprometer a integridade do edifício. A abordagem metodológica dessa pesquisa partiu da concepção digital da peça (modelagem paramétrica), que passa pela transição ao modelo físico reduzido para estudos (prototipagem), e finalmente é adaptado para fôrmas que possibilitem sua reprodução na matriz cimentícia (fabricação de moldes). Contudo, esse artigo utiliza enquanto escopo de investigação os processos realizados na etapa de concepção e elaboração dos moldes, que exploram as técnicas de processo subtrativo (usinagem) e conformativo (termoformagem à vácuo). Enquanto resultados foram realizados testes conceituais para produção digital das fôrmas de três componentes (sapata de fundação, segmento da laje de cobertura e a grelha da canaleta de drenagem), após isso deu-se a montagem dos moldes para subsidiar o seu desenvolvimento em pequena escala enquanto contribuição do estudo."
