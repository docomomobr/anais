abstract: "O presente trabalho tem como objeto de estudo a análise formal das obras modernas construídas que compõem o complexo esportivo do Clube Campinense, localizado no bairro da Bela Vista da cidade de Campina Grande - PB, com enfoque na Boate Cartola e Ginásio Poliesportivo Cezar Ribeiro, obras importantes para o conjunto arquitetônico, observando influências nos partidos adotados nesses edifícios. A justificativa se dá a partir da importância de documentar e resgatar a memória desse projeto tão importante para a cidade e, assim, contribuir com sua conservação, uma vez que vem sofrendo uma série de descaracterizações devido à falta de manutenção e de reformas inadequadas. Dessa forma, a metodologia se desdobra a partir da análise da dimensão formal proposta por Afonso (2019) baseado nos conceitos aprimorados por Montaner (2002) e Mahfuz (2004) dos edifícios que compõem o complexo esportivo. Ao expor lacunas relativas à construção das edificações e problemáticas evidenciadas pelo tempo, má adequação construtiva e má gestão, tal artigo traz à tona a falta de conhecimento e a negligência ao patrimônio moderno campinense. Afinal, esquecer a materialidade patrimonial de um local, é como desaprender a própria história, e, portanto, é indispensável este tipo de pesquisa para a preservação e valorização do patrimônio cultural, garantindo que as futuras gerações possam compreender e apreciar a história e a identidade do Clube Campinense."
