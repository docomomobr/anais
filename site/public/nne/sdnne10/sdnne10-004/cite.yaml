abstract: "A tipologia residencial desempenha um papel essencial na vida humana, no entanto, as habitações têm apresentado aumento significativo no consumo de energia elétrica, com crescente demanda por refrigeração e iluminação interna. Neste contexto, o atendimento às exigências mínimas de desempenho ambiental pode resultar na redução do uso excessivo de mecanismos artificiais, promovendo uma arquitetura adequada e adaptada ao meio, o que integra conceitos de conforto e qualidade ambiental e eficiência energética. Severiano Mário Porto é apontado como um arquiteto que trabalhou com maestria atributos de projeto associados à essa arquitetura, dita bioclimática, conectando homem, espaço construído e o meio em que está inserido. Todavia, seu legado no recorte roraimense permanece pouco explorado. Esse artigo propõe apresentar e documentar a arquitetura residencial de Porto no estado de Roraima, analisando o viés do desempenho ambiental nesses exemplares de sua obra. A metodologia inclui o levantamento documental no acervo do referido arquiteto, junto ao Núcleo de Pesquisa e Documentação da FAU UFRJ (NPD FAU UFRJ) e a análise dos projetos residenciais a partir das diretrizes construtivas indicadas para a região, além da aplicação de uma ferramenta de análise de projeto baseado na concepção original, em que, inicialmente, é caracterizado o clima local, seguido de análises na escala do edifício (forma, fachada e cobertura) e, por fim, selecionado um ambiente representativo para determinar sua disposição interna e as soluções a nível dos aspectos térmico e visual. Os resultados apontam 18 residências projetadas por Severiano em Roraima, sendo 17 na capital, Boa Vista, e 1 residência no interior, em Caracaraí. A análise dos projetos, com viés do desempenho ambiental, indica o atendimento às questões de ventilação cruzada permanente, a implantação privilegiando a orientação dos ventos predominantes e a aplicação de vedações externas com paredes e coberturas leves refletoras. Com a ferramenta de análise a partir da concepção, sistema de envoltória (fachada e cobertura) das residências pesquisadas apontam para um modelo adequado e adaptado ao contexto climático local, em que estratégias passivas de climatização, iluminação e distribuição de ambientes bem atendem as recomendações. O trabalho pondera, por fim, sobre alguns limites entre considerações atuais do desempenho ambiental de edificações e o resgate de projetos da arquitetura, como os exemplares da obra de Porto. Espera-se que esta pesquisa auxilie no conhecimento e prática da arquitetura, através de bons caminhos acentuados por Severiano Mário Porto."
