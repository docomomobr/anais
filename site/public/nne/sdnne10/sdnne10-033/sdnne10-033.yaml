abstract: 'A década de 1930 no Brasil foi um período caracterizado por fortes práticas
  estatais para modernizar o país, e nesse âmbito a arquitetura moderna foi adotada
  como símbolo de progresso que se almejava. Assim, edifícios escolares públicos foram
  construídos sob um discurso de defesa da arquitetura moderna, que considerava-se
  a ideal para abrigar as práticas pedagógicas de um ensino mais ativo e igualitário.
  Assim, este trabalho teve como objetivo geral verificar se os edifícios escolares
  dos anos 1930 atenderam às expectativas sociais acerca da modernização da arquitetura
  escolar para implantação de um novo modelo pedagógico. Como objeto de estudo foram
  selecionados os edifícios escolares que resultaram das reformas educacionais para
  aplicação das ideias da Escola Nova no Rio de Janeiro (1934-1937), em São Paulo
  (1936-1939) e na Paraíba (19361939). Para realizar a pesquisa, confrontamos o conteúdo
  dos discursos sobre essas escolas, encontrados em documentos oficiais e periódicos
  (publicados entre 1930-1945, presentes na Hemeroteca digital Nacional), com a análise
  espacial e da fisionomia dos edifícios escolares selecionados. Os resultados indicam
  que os projetos atendem em vários aspectos os discursos em defesa de uma nova arquitetura
  para abranger métodos de ensino ativo. A organização em planta das escolas modernas
  estudadas foge do modelo das escolas tradicionais, ao serem mais abertas e conectadas
  ao exterior, surgem novos ambientes ao programa, como oficinas e ateliês, e a fisionomia
  das escolas não faz referência a estilos do passado, como ocorria até então: passam
  a apresentar formas geometrizadas, elementos padronizados como as janelas basculante
  em ferro e vidro, e marquises em concreto armado.'
