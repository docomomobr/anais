abstract: A Arquitetura Moderna foi primeiramente divulgada no Brasil através da Escola
  de Belas Artes do Rio de Janeiro, entre as décadas de 1930 a 1950. No Piauí, mais
  especificamente em sua capital Teresina, ela foi produzida a partir de meados dos
  anos 1950. Esta arquitetura adotou a modernidade nos seus projetos como cinemas,
  aeroportos, edifícios governamentais e instalações educacionais. Temos como arquitetos
  responsáveis pelo desenvolvimento do modernismo em Teresina nomes como Antônio Luiz
  Dutra de Araújo, Acácio Gil Borsói e Miguel Caddah, sendo, este último, importante,
  dentre outras obras, pela sua grande contribuição na arquitetura modernista escolar
  no estado do Piauí. O presente trabalho trata-se de uma análise de duas de suas
  obras educacionais de caráter modernistas, a Unidade Escolar Paulo Ferraz e a Unidade
  Escolar João Clímaco D´Almeida, ambas situadas na cidade de Teresina, com grande
  importância no cenário educacional da capital piauiense.
keyword: Modernismo; Miguel Caddah; Arquitetura educacional
