abstract: O presente trabalho é resultado da disciplina de Conservação da Arquitetura
  Moderna, parte do currículo do curso de pós - graduação em Desenvolvimento Urbano,
  da Universidade Federal de Pernambuco. Apresenta como objetivo elaborar um esboço
  de um Plano de Conservação para o edifício da Escola Alberto Torres, situado em
  Pernambuco, considerado ícone da arquitetura moderna no Estado. Projetado pelo arquiteto
  Luiz Nunes, na década de 30, o edifício integra princípios da arquitetura moderna
  aos ideais políticos da época. O esboço do Plano de Conservação utiliza a metodologia
  DRAPI e apresenta como objetivo orientar ações de intervenções que procurem recuperar,
  na medida do possível, os conceitos utilizados na construção da Escola, promovendo
  a melhoria das condições físico-materiais e mantendo os aspectos originais e os
  valores identificados. Para tanto, foram resgatados os principais elementos historiográficos,
  projetos arquitetônicos originais, além de toda uma análise da situação atual do
  imóvel, da identificação dos valores atribuídos – Declaração de Significância –
  e das normas legais incidentes na referida escola.
keyword: Arquitetura Moderna; Conservação; Plano de Conservação
