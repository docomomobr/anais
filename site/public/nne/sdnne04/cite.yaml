title: "Arquitetura de Transição: elementos modernistas nas edificações residenciais do Centro de Teresina-PI"
container-title: "4º Seminário Docomomo Norte/Nordeste, Natal, 2012"
event-title: "4º Seminário Docomomo Norte/Nordeste, Natal, 2012"
