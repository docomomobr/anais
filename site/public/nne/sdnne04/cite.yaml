id: sdnne04-042
type: paper-conference
title: "Clube Líbano Brasileiro em Recife: um registro dos últimos suspiros"
container-title: "4º Seminário Docomomo Norte/Nordeste, Natal, 2012"
event-title: "4º Seminário Docomomo Norte/Nordeste, Natal, 2012"
event-place: "Natal, RN"
publisher-place: "Natal, RN"
