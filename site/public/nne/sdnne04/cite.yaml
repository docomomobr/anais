id: sdnne04-039
type: paper-conference
title: "Catedral Metropolitana de Natal X Capela Ecumênica do Campus da UFRN: uma análise comparativa sob a ótica do Movimento Moderno"
container-title: "4º Seminário Docomomo Norte/Nordeste, Natal, 2012"
event-title: "4º Seminário Docomomo Norte/Nordeste, Natal, 2012"
event-place: "Natal, RN"
publisher-place: "Natal, RN"
issued:
  date-parts:
    - [2012, 5, 29]
ISBN: "978-85-63014-05-4"
language: pt-BR
abstract: "Com o tema das expressões da arquitetura modernista, privilegiando edifícios\nreligiosos potiguares, este trabalho propõe uma análise comparativa entre a Catedral\nMetropolitana de Natal, de autoria do Arquiteto Marconi Grevi, e a Capela Ecumênica da\nUFRN, do Arquiteto João Maurício Fernandes de Miranda. A escolha dessas duas\nedificações se deu por um recorte temporal, especificamente a década de 1970. E também\npela dissonância visual existente entre as duas edificações, o que geraria uma discussão\ninteressante, tendo foco direcionador o Movimento Moderno. Apesar de possuírem a mesma\nfunção, detém porte e focos diferentes, o que torna o estudo ainda mais interessante. Sendo\nassim, para a leitura morfológica da arquitetura das edificações foram eleitos critérios, os\nquais são: impacto da obra arquitetônica, forma, organização do espaço, sistema estrutural,\ntransparência x opacidade e materiais de revestimento. Esses critérios estão associados à\nrelevância deles em cada edificação e a sua relação com o Movimento Moderno Brasileiro,\nem especial com os desenvolvimentos do período pós-Brasília. Logo, há inicialmente uma\nespecificação desses critérios, expondo a sua importância na edificação e também evolução\ndo processo projetual. Durante essa análise, as edificações mostram-se mais semelhantes\ndo que o esperado. As duas edificações detêm planta baixa trapezoidal, estrutura de\nconcreto armado e materiais de revestimentos na sua forma mais pura. Com isso a Catedral\ne a Capela, apesar de levarem a percepções visuais tão distintas, demonstraram mais\nsemelhanças do que o esperado previamente. Essa percepção visual está estritamente\nrelacionada com a função das duas edificações. Obviamente a função primordial é religiosa,\nporém com focos diferentes. A Catedral tem como função atender a todos os fiéis da região\nmetropolitana de Natal, enquanto a Capela Ecumênica à instituição de ensino superior\nUFRN. Essa diferença induz, também, a monumentalidade da Catedral em relação à\nCapela, já que na sua origem funcional primordial possuem capacidades desproporcionais\nentre si."
