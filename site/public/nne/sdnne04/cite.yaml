ISBN: "978-85-63014-05-4"
language: pt-BR
abstract: "A preservação patrimonial no Brasil nasce alicerçada pelo binômio CIAM \u0026 SPHAN porquanto representantes brasileiros nos Congressos Internacionais da Arquitetura Moderna foram também construtores de políticas de conservação do patrimônio cultural brasileiro. É natural, portanto, que surjam no Brasil as primeiras medidas institucionais de preservação do patrimônio moderno no universo mundial através dos tombamentos da Igreja de Pampulha, do edifício do MES, entre outros. Importante também era a inserção da nova arquitetura em núcleos antigos materializando a idealizada dialética costiana entre a arquitetura do período colonial e a expressão construtiva do Brasil moderno, tanto determinada pelo próprio Costa (Grande Hotel Ouro Preto) como por JK, então governador de Minas Gerais (Hotel Tijuco, Diamantina). Na ausência do Mestre, que se retira do SPHAN na década de 1970, posições confrontadoras de delegados regionais da instituição em PE e AL, que não reconhecem a até então meritória convivência entre o colonial e o moderno, ignoram o valor artístico do Hotel São Francisco em Penedo, AL, edifício representativo do ideário arquitetônico moderno, o consideram um elemento destruidor da paisagem urbana e impedem o tombamento da cidade. Este artigo discute criticamente a intolerância refratária do SPHAN à arquitetura moderna em Penedo na década de 1980 e registra as qualidades arquitetônicas deste patrimônio histórico e artístico do Estado de Alagoas."
keyword: "Tombamento; preservação; Penedo"
