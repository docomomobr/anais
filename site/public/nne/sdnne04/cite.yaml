id: sdnne04-043
type: paper-conference
title: "De poema a \"poeira\": Estádio Machadão, Natal/RN — a decretação da obsolescência de uma referência modernista"
container-title: "4º Seminário Docomomo Norte/Nordeste, Natal, 2012"
event-title: "4º Seminário Docomomo Norte/Nordeste, Natal, 2012"
event-place: "Natal, RN"
publisher-place: "Natal, RN"
issued:
  date-parts:
    - [2012, 5, 29]
ISBN: "978-85-63014-05-4"
language: pt-BR
abstract: "O artigo discorre sobre o processo de transformação do estádio João Cláudio de Vasconcelos\nMachado - o Machadão – marco da arquitetura modernista natalense, em elemento de obsolescência,\ntendo em vista a sua não adequação aos padrões atuais exigidos pela FIFA, como uma das arenas\nde esporte que receberão o evento Copa do Mundo de Futebol de 2014. Nossa análise é realizada\nem duas etapas, que se complementam: primeiramente, buscamos relacionar a idealização e\nconstrução do edifício ao contexto político e social da época, em que o Estado passa a financiar a\nconstrução de vários estádios, na perspectiva de utilização do esporte como canal de aproximação\ncom o povo, em busca da legitimação de suas ações. Analisamos o edifício enquanto objeto\narquitetônico – revelador de uma linguagem modernista comum aos estádios à época, e cuja forma é\nresultante de uma relação entre público e prática futebolística bastante particular, bem como sob o\nponto de vista urbano, através do qual constatamos que o edifício torna-se uma referência na\npaisagem natalense. Em seguida, analisamos o processo que desencadeará na opção pela\ndemolição do edifício, tendo em vista a preparação da cidade para sediar o evento Copa do Mundo\nde Futebol 2014. Observamos a construção de um discurso que atribui ao evento um caráter\n“redentor”, de requalificação do espaço urbano. Para que seja alcançado esse objetivo, portanto,\ntorna-se necessário a adequação dos espaços às exigências impostas pelo padrão FIFA, tanto em\nnível da obra arquitetônico, quanto em nível do espaço urbano. Neste âmbito, as justificativas para\ndemolição do edifício e construção de um novo espaço – que não deverá ser somente um complexo\nesportivo, mas uma Arena –, estão predominantemente ancoradas na relação de contraponto entre\nobsolescência do existente e caráter requalificador, do novo. Para montarmos esse quadro de análise\ne reflexão crítica, utilizamos dados extraídos de pesquisas em documentos, textos acadêmicos,\nrelatórios de grupos de pesquisa, realizados em atividades vinculadas à Universidade Federal do Rio\nGrande do Norte; pesquisas em jornais, livros, revistas e periódicos; teses, dissertações a artigos\napresentados em eventos acadêmicos; apresentações dos representantes dos órgãos\ngovernamentais em audiências públicas."
