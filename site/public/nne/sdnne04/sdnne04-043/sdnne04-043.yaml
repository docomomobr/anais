abstract: 'O artigo discorre sobre o processo de transformação do estádio João Cláudio
  de Vasconcelos

  Machado - o Machadão – marco da arquitetura modernista natalense, em elemento de
  obsolescência,

  tendo em vista a sua não adequação aos padrões atuais exigidos pela FIFA, como uma
  das arenas

  de esporte que receberão o evento Copa do Mundo de Futebol de 2014. Nossa análise
  é realizada

  em duas etapas, que se complementam: primeiramente, buscamos relacionar a idealização
  e

  construção do edifício ao contexto político e social da época, em que o Estado passa
  a financiar a

  construção de vários estádios, na perspectiva de utilização do esporte como canal
  de aproximação

  com o povo, em busca da legitimação de suas ações. Analisamos o edifício enquanto
  objeto

  arquitetônico – revelador de uma linguagem modernista comum aos estádios à época,
  e cuja forma é

  resultante de uma relação entre público e prática futebolística bastante particular,
  bem como sob o

  ponto de vista urbano, através do qual constatamos que o edifício torna-se uma referência
  na

  paisagem natalense. Em seguida, analisamos o processo que desencadeará na opção
  pela

  demolição do edifício, tendo em vista a preparação da cidade para sediar o evento
  Copa do Mundo

  de Futebol 2014. Observamos a construção de um discurso que atribui ao evento um
  caráter

  “redentor”, de requalificação do espaço urbano. Para que seja alcançado esse objetivo,
  portanto,

  torna-se necessário a adequação dos espaços às exigências impostas pelo padrão FIFA,
  tanto em

  nível da obra arquitetônico, quanto em nível do espaço urbano. Neste âmbito, as
  justificativas para

  demolição do edifício e construção de um novo espaço – que não deverá ser somente
  um complexo

  esportivo, mas uma Arena –, estão predominantemente ancoradas na relação de contraponto
  entre

  obsolescência do existente e caráter requalificador, do novo. Para montarmos esse
  quadro de análise

  e reflexão crítica, utilizamos dados extraídos de pesquisas em documentos, textos
  acadêmicos,

  relatórios de grupos de pesquisa, realizados em atividades vinculadas à Universidade
  Federal do Rio

  Grande do Norte; pesquisas em jornais, livros, revistas e periódicos; teses, dissertações
  a artigos

  apresentados em eventos acadêmicos; apresentações dos representantes dos órgãos

  governamentais em audiências públicas.'
