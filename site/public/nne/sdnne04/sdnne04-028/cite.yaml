abstract: "Este artigo propõe-se a mostrar dois tempos de UM LUGAR - de sua origem como arcabouço do Presídio de Punta Carretas da cidade de Montevidéu UY, até então, associado com a IMAGEM DA DOR e por décadas segregador do Bairro onde se inseriu, e sua reativa transformação física e funcional originada pela estratégia projetual da rearquitetura, em um lugar plural e de intensa dinâmica social - o Shopping Center Punta Carretas, identificado na atualidade com a IMAGEM DO PRAZER, propagador de energia, de dinâmica urbana e indutor de uma nova Centralidade – o Bairro Punta Carretas da Montevidéu Contemporânea."
