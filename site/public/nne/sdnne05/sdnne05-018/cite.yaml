title: "A (in) sustentável adaptação do poema: considerações sobre a proposta – não concretizada – de adequação do Estádio Machadão ao padrão FIFA/Copa 2014"
container-title: "5º Seminário Docomomo Norte/Nordeste, Fortaleza, 2014"
