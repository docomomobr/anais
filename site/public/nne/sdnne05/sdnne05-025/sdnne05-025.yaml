abstract: 'O objetivo do presente trabalho é analisar interferências existentes entre
  a preservação do patrimônio cultural moderno e as normas de acessibilidade e desenho
  universal. Para verificar essas questões foram analisadas três obras localizadas
  na cidade de Fortaleza: a Rodoviária Engenheiro João Tomé, o Edifício C. Rolim e
  o DNOCS (Departamento Nacional de Obras Contra as Secas). Esse acervo localizado
  na capital cearense possui um caráter público ou institucional e sofreu intervenções
  que visavam à adaptação de novos usos ou à adequação dos espaços no que tange as
  recomendações da acessibilidade universal. Identificar as interferências das recomendações
  das normas de acessibilidade com a de preservação do patrimônio cultural tornou-se
  imperativa no contexto atual, em que há a obrigatoriedade em tornar acessíveis as
  edificações de uso coletivo, inclusive as com valor patrimonial. Em caso de bens
  tombados, A NBR9050 recomenda que os parâmetros de acessibilidade devem ser atendidos,
  porém respeitando-se os critérios específicos que devem ser aprovados pelos órgãos
  preservacionistas. Nas edificações estudadas, fez-se uma analise das intervenções
  realizadas, com o nível de cumprimento com a Norma Brasileira de Acessibilidade,
  confrontando com aspectos estruturais do prédio, e os impactos das intervenções.
  A grande parte dos edifícios datados do período modernista em Fortaleza não é tombada,
  apesar de seus reconhecidos valores patrimoniais e da importância cultural para
  a cidade. Isto se deve a diversos fatores: por serem recentes, pela dificuldade
  em estimar o real valor patrimonial destes bens e pelo tipo de ocupação dos edifícios.
  Porém, ressalta-se que, nestes edifícios, em casos de reformas, é demandada uma
  postura diferenciada a ser adotada para adaptação, pois se deve preservar a integridade
  do bem devido ao seu valor cultural.'
keyword: Acessibilidade; Patrimônio moderno em Fortaleza; Interferências
