language: pt-BR
abstract: "A experiência da arquitetura moderna no Brasil possui dois traços marcantes: a participação do olhar estrangeiro e o pacto entre o local e o global. Assim, a produção arquitetônica moderna no Nordeste brasileiro consolida-se pela ação dos profissionais instalados na região, mas também é conformada pelos viajantes que acessam essas terras e requalificam a cultura local através dos crivos da Modernidade. Nesse contexto insere-se Lina Bo Bardi, arquiteta italiana que transforma essa tensão moderno-popular na questão fundamental de sua obra, revelando outros parâmetros para pensar o fazer arquitetônico e as expressões do lugar. Esta comunicação versa sobre a conduta prática e teórica de Lina, especialmente quando sua obra é atravessada pelo impacto do patrimônio nordestino vernáculo – as conversações entre sistemas construtivos, entre temporalidades, resultando no amalgamento de condutas a princípio antitéticas, como a do vigor clássico, da prática transparente moderna versus a volubilidade orgânica das paredes de terra. Pretende-se observar como Lina ajudou a construir um outro olhar sobre a cultura nordestina atravessando barreiras de tempos e espaço, retirando o vernáculo da companhia do banal e da tradição conservadora."
