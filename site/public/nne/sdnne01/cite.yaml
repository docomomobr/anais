language: pt-BR
abstract: "O debate sobre a arquitetura e o urbanismo moderno no Ceará, encontra referências na obra do arquiteto Neudson Bandeira Braga para o campus da Universidade Federal do Ceará (UFC) em Fortaleza, que retornando a terra natal na década de 50, após sua formação na Escola de Belas Artes no Rio de Janeiro, contribui para disseminar e fomentar discussões conceituais e projetuais realizadas aqui e nas grandes cidades mundiais. Passando a integrar o corpo técnico da UFC, irá influenciar decisivamente, na produção arquitetônica desta Universidade, introduzindo princípios modernistas no projeto e na implantação de novos edifícios que viriam a compor a estrutura física da Instituição. Esta mudança encontra identidade nas diretrizes da Reforma Universitária de 1968, marcada entre outros aspectos, por fatores de racionalização e de flexibilidade pedagógica. Braga desenvolveu tipologias de edificações que se caracterizaram pela proposta da planta-livre, projetada sobre malha modular associada ao módulo estrutural, introduzindo assim o moderno conceito de flexibilidade de arranjos espaciais, como forma de permitir o atendimento de diversas funções de acordo com as solicitações pedagógicas. A forma arquitetônica resultou da planta funcional, representada na composição de volumes puros geométricos destituídos de ornamentação, e de um sistema de cobertura com telhas planas, numa clara alusão à laje plana preconizada nos princípios modernos da nova arquitetura. A metodologia de projeto utilizada consistia em tipificar e ordenar as necessidades funcionais dos espaços conforme o programa de necessidades, resultando na esquematização de blocos padronizados, implantados segundo os limites e as possibilidades fixadas na malha quadrangular. A articulação entre blocos foi viabilizada por passarelas. Merecendo debates e reflexões sobre a expressividade e a representatividade dessa produção arquitetônica, a obra no seu conjunto constitui referência arquitetônica e urbanística para a cidade e para o ensino superior."
keyword: "campus universitário; arquitetura moderna; projeto"
