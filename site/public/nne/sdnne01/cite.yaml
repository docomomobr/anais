abstract: "nasceu em 25 de setembro de 1934, na cidade de Belo Horizonte. De 1958 a 1962 cursou a Escola de Arquitetura da Universidade de Minas Gerais e, em 1963, escolheu trabalhar como arquiteto na Sudene, transferindo-se para a Recife. Até então, não havia tido experiências profissionais concretas, mas optara por enfrentar e contribuir para amenizar a mais dura realidade da miséria nacional. Na Sudene, pode desenvolver alguns projetos significativos e de grande alcance social, como a rede de Escolas Primárias padrão para as cidades do interior nordestino; o Centro de Treinamento para Professoras Leigas e Centro de Supervisão de Ensino, de São Luis do Maranhão; e os projetos dos núcleos populacionais de Bebedouro e de Mandacarú, respectivamente, em Pernambuco e na Bahia. Simultaneamente ao trabalho desenvolvido na Sudene, projetou e construiu sua própria residência e, a partir de então, contando com a colaboração permanente do arquiteto Marcos Domingues da Silva, atuou como profissional liberal criando o Templo Evangélico de Recife; o Centro Cívico de Patos, Paraíba; o Ginásio de Paulista, Pernambuco; a Residência de Enário de Castro, em Recife; a Residência de Zenaldo Rocha, em Recife; e a importante e premiada Sede da Rede Ferroviária Federal SA de Recife, entre outras obras. Como conseqüência do Golpe Militar de 1964, transferiu-se para Brasília e, em fevereiro de 1971, foi admitido no Departamento de Arquitetura e Urbanismo da UnB. No entanto, no início de 1973, foi enquadrado na \"odiosa lei de exceção 477\", sendo proibido de lecionar. Não havendo mais condições de trabalho no Brasil, optou por partir para o exílio, colocando sua profissão e capacidade de luta a serviço de causas absolutamente nobres na França, Argélia, Suécia, Angola entre outros países. Anistiado, voltou para Brasília, sendo responsável por um intenso trabalho de reflexão sobre o papel da história e da teoria na formação dos arquitetos e urbanistas. Tal atividade resultou em um significativo esforço editorial. Em 2001, foi aposentado do serviço público. Trata-se, sem dúvida alguma, de um dos mais importantes pensadores da arquitetura brasileira. Um dos poucos a conseguir, de fato, conciliar ideologia e produção arquitetônica."
