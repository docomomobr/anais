id: sdnne01-031
type: paper-conference
title: "Recepção e difusão da Arquitetura Moderna: norte-nordeste do Brasil nas revistas francesas, inglesas e italianas entre 1940 e 1960"
container-title: "1º Seminário Docomomo Norte/Nordeste, Recife, 2006"
event-title: "1º Seminário Docomomo Norte/Nordeste, Recife, 2006"
event-place: "Recife, PE"
publisher-place: "Recife, PE"
issued:
