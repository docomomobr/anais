abstract: "Estudos recentes acerca da paisagem investigam as atividades impactantes que contribuem para a sua modificação e buscam melhor compreender a sociedade através das marcas do cotidiano nela impressas. Entende-se que paisagens singulares se constituem em patrimônios culturais das cidades, na medida em que fazem parte do cotidiano dos cidadãos e estão presentes nas representações sociais. Alguns autores contemporâneos defendem a preservação da paisagem natural e urbana buscando, acima de tudo, sua importância para os habitantes do lugar. Natal é uma cidade com qualidades ambientais marcantes e se destaca pela beleza do sítio onde está assentada. Encravada num encontro de rio e mar, a cidade se desenvolveu tomando a forma determinada pelo suporte físico. O Rio Potengi, o Oceano Atlântico e o vasto ecossistema dunar existente representaram limites à expansão urbana, ao mesmo tempo em que possibilitaram a configuração de uma paisagem marcada pela dialética entre os elementos naturais e os construtos humanos. Os elementos naturais, hoje inseridos na malha urbana, representam fortes referências visuais, fornecem identidade ao tecido urbano, fazem parte do imaginário coletivo e se destacam no contexto social da cidade. Esta questão remete ao enfoque da paisagem como patrimônio coletivo, alertando que alguns atributos estéticos e paisagísticos, carregados de significados, devem ser preservados como um legado para as gerações futuras."
keyword: "Paisagem; Planos Urbanísticos; Higienismo"
