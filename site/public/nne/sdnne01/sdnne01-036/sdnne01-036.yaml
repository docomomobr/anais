abstract: Abordagem sobre a origem, influências, características e localização dos
  bangalôs e de alguns exemplares da arquitetura moderna em São Luís. Inicia-se a
  pesquisa com o entendimento do contexto político e econômico do Maranhão no século
  XX e a relação com as construções, dando ênfase as modernizações promovidas pelo
  Governo do Interventor Paulo Ramos ilustradas pela expansão da malha urbana na cartografia.
  O trabalho busca compreender os conceitos de eclético, bangalôs e arquitetura moderna
  relacionando com os exemplares cadastrados através do levantamento fotográfico e
  das imagens reveladas pela pesquisa nos álbuns de 1908, 1923 e 1950. As entrevistas
  realizadas na academia maranhense de letras apontaram a influencia do cinema nas
  construções comprovadas pelas imagens da revista Cruzeiro. Finaliza-se a pesquisa
  com uma reflexão sobre o estado de conservação dos exemplares, seus usos atuais
  e políticas de preservação ressaltando a necessidade de aprofundamento no estudo
  da arquitetura do século XX.
keyword: Século XX; Bangalô; Modernismo
