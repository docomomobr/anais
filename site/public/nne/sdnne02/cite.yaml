language: pt-BR
abstract: "Este texto explora as repercussões na arquitetura pernambucana de dois temas fundamentais no debate\narquitetônico nacional e internacional dos anos 50 e 60: a emergência de uma sensibilidade dita brutalista e a\nretomada das preocupações com a integração entre arte e arquitetura. A arquitetura da chamada escola\npernambucana consolidou-se nos anos 50, embasada nos ensinamentos e nas atividades projetuais de Delfim\nAmorim e Acácio Gil Borsoi. No entanto, os próprios mestres com seus discípulos, figuras como Frank Svensson,\nReginaldo Esteves, Glauco Campello, Wandenkolk Tinoco e Vital Pessoa de Melo, provaram que este grupo não\nestava isolado e cristalizado, mas continuamente aberto a assimilação de impulsos nacionais e internacionais. A\nobra deste último é o objeto de análise deste trabalho. Nascido em 1936, Vital Pessoa de Melo formou-se na\nFaculdade de Arquitetura da Universidade do Recife (hoje UFPE) em 1961, tendo sido aluno de Borsoi, com que\ntrabalhou por vários anos. Vital teve uma sólida formação humanista que incluiu um grande interesse pela arte\nmoderna e contemporânea. Em conjunto com sua prática arquitetônica, ele dedicou-se com afinco a atividades\ncomo o design gráfico e ao patrimônio. Toda essa complexa formação foi sintetizada na sua forma de fazer\narquitetura. Os projetos de Vital são investigações com grande teor lógico, matemático e geométrico. Seus\nvolumes puros e imponentes são marcados por arestas bem definidas e contornos precisos. Evidenciando as\ninfluências do Brutalismo, o tratamento das fachadas é claro e objetivo, com texturas fortes, justaposições\nvigorosas, encaixes expostos e materiais utilizados de forma aparente, sem nenhum tipo de mascaramento. Um\noutro aspecto de sua obra é  relação com as artes plásticas. Em seus edifícios, ele procura integrar painéis,\nesculturas e vitrais de artistas, como Anchises Azevedo, Athos Bulcão e João Câmara, além de seus próprios\npainéis. Argumentamos que mais do que a incorporação de peças de arte nos edifícios, a arte está inserida no\ncerne do processo projetual de Vital que, como seu livro Tramas atesta, sofreu influência de artistas como Max\nBill, Lygia Clark e Franz Weismann. Como objeto de análise para este estudo foram selecionados algumas obras\nque melhor refletem estas investigações como as residências Vital Pessoa de Melo (1968) e Emir Glasner\n(1972), o edifício-sede da CELPE (1972), e os edifícios residenciais Sahara (1973), Jean Mermoz (1975),\nGropius (1976) e Aristeu Chaves (1982). A análise será pautada por dois eixos: um enfatizando os materiais,\ntécnicas e superfícies, e o outro as interlocuções com as artes plásticas. Dessa forma, procuraremos estabelecer\nrelações entre a ética/estética do Brutalismo e os jogos geométricos e espaciais das vanguardas modernas e\nmostrar como estes se integram em uma arquitetura carregada de sentido ético, artístico e cultural."
