abstract: "A configuração moderna do Recife se dá fortemente a partir da década de 1930, com a execução da renovação urbana de Santo Antônio e, por coincidência, com a regulamentação da preservação do patrimônio histórico e artístico nacional: a presença dos modernos nos dois âmbitos do pensamento (preservação x renovação, com base no repertório moderno) criou as bases tanto para a configuração do solo do edifício moderno de grande altura ora por substituição do traçado urbano existente ora pela regulamentação da estrutura fundiária da expansão urbana, como também para a configuração de ‘uma nova ordem que deveria construir-se sobre os escombros dos arranha-céus de Deus’ 1 ou o edifício vertical de expressão moderna. A significativa participação dos técnicos do SPHAN, atual IPHAN, e o comprometimento destes com o pensamento moderno, jogaram um papel decisivo na configuração do Recife, em grande parte resultante da transformação da cidade existente: substituição do edifício, da estrutura fundiária e do traçado urbano do passado. A construção do edifício moderno se dá sobre os escombros da cidade barroca ou eclética, ato legitimado nas práticas urbanísticas locais e vigentes nos dias atuais. O que se pretende no trabalho proposto é responder as seguintes questões: qual a lógica da intervenção no Recife, através da ação do SPHAN na construção do edifício moderno sobre os escombros da cidade existente e como esta prática se perpetua nos dias atuais."
