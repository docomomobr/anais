abstract: Os jardins se constituem numa importante expressão do movimento moderno
  brasileiro, pois a vegetação nativa se tornou um ícone de modernidade e brasilidade.
  Antes mesmo que Roberto Burle Marx homenageasse biomas brasileiros nas Praças Euclides
  da Cunha e Casa Forte, no Recife, o uso das plantas tropicais já manifestava nosso
  sentimento nativista – seja nas composições paisagísticas de Mina Klabin para as
  casas modernistas de Gregori Warchavchik, seja na trajetória pictórica de Tarsila
  do Amaral, Anita Malfatti e Lasar Segal. Considerado o criador do “jardim brasileiro”,
  Burle Marx espalhou sua obra pelo país, incluindo o Rio Grande do Norte. Os jardins
  concebidos para Natal, citados por autores como Jacques Leenhardt (2000) e Flávio
  Motta (1984), são hoje desconhecidos e inexistentes. Este trabalho resulta do esforço
  empreendido para registrar e inventariar essa obra de Morte Prematura. A passagem
  de Burle Marx deixou poucos registros na historiografia local e segue ignorada pela
  população. Os autores estudados registram três projetos, dentre os quais se destaca
  o Parque das Dunas-Via Costeira, de 1981 – comparado ao Parque do Flamengo por Lauro
  Cavalcanti e Farès El-Dahdah (2009), que os citam como os dois projetos mais significativos
  da parceria com o botânico Luiz Emygdio de Mello Filho. Essa investigação, em andamento
  desde 2007, busca resgatar e ressaltar as idéias do paisagista para Natal a partir
  da pesquisa bibliográfica, documental e entrevistas. Até o momento, suscitou debates,
  resultou na localização de parte dos registros gráficos e na descoberta de um projeto
  paisagístico concebido em 1976 para o Pátio Interno da Biblioteca Central do Campus
  da UFRN, cujo Estudo de Caso é aqui apresentado. Uma vez que existem indícios de
  que o jardim de fato existiu, este estudo tem como um dos principais objetivos sensibilizar
  a comunidade universitária no sentido do seu resgate, priorizando a reconstituição
  virtual como recurso didático-metodológico.
keyword: Jardins de Burle Marx; Projeto Paisagístico Modernista
