abstract: A idéia que sustenta as reflexões presentes nesta comunicação é a de investigar
  os fatores políticos e ideológicos de constituição do discurso moderno em João Pessoa,
  que tornou fecundo o cenário para difusão da arquitetura moderna, e cuja paisagem
  urbana foi renovada por uma arquitetura de linhas “modernas” e “funcionais”, palavras
  recorrentes nas notícias de jornais locais na segunda metade do século XX. A análise
  se fundamenta na articulação entre Arquitetura e Estado em João Pessoa utilizando
  como documento primário de estudo notícias publicadas nos números do jornal governista,
  A União, veiculados entre 1950 e 1970.
