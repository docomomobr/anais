abstract: Este trabalho analisa a arquitetura moderna sob o ponto de vista das interações
  entre a experiência espacial e a expressão estético-construtiva, a fim de trazer
  reflexões sobre a contribuição dos princípios estruturais para o resultado formal-espacial
  da arquitetura moderna, em particular a brasileira. O estudo dessas interações resulta
  diretamente do conceito de tectônica resgatado por estudiosos como Frampton (2001)
  e Sekler (1965), onde a dimensão estética da arquitetura encontra sua força e autenticidade
  no potencial expressivo dos elementos construtivos e da estrutura, priorizando a
  poética da construção. O domínio da tecnologia do concreto pelos engenheiros e arquitetos
  brasileiros do período heróico, usado num processo artesanal sem necessariamente
  utilizar uma tecnologia avançada — e talvez por isso mesmo — possibilitou uma expressão
  plástica específica da arquitetura moderna brasileira, que reflete o seu caráter
  tectônico. Esse caráter tectônico, predominante no moderno brasileiro nessa fase,
  também predomina e qualifica parte da arquitetura moderna produzida nas décadas
  seguintes, tanto na fase de mutação como no período de transição (1970-1980) caracterizado,
  conforme Spadoni (2003), pela reflexão sobre o ideário moderno e, sobretudo, por
  uma "continuação da aventura moderna" em algumas das trajetórias por ele identificadas,
  porém em contexto diferente. Este é o caso do Espaço Cultural José Lins do Rego
  projetados por Sérgio Bernardes e o Terminal Rodoviário de João Pessoa de autoria
  de Glauco Campelo, objetos de estudo desta pesquisa. A investigação parte ainda
  da inserção dos autores do ponto de vista das gerações e classificações consagradas
  pela historiografia com vistas a situar a produção paraibana e discute sobre a ênfase
  dada na relação entre conceitos técnico/estruturais — como modulação, momento de
  inércia e variação de esforços — e o resultado formal-espacial da arquitetura, como
  uma determinante na origem da ação projetual moderna.
keyword: Tectônica; Estrutura; Arquitetura Moderna
