abstract: A paisagem dos centros históricos é marcada por uma pluralidade de temporalidades.
  As abordagens atuais nos remetem para a compreensão de um constructo em permanente
  transformação, constituída por fragmentos de tempos lineares ou sobrepostos, dependendo
  de como a analisamos. Logo, essa paisagem se constitui também do moderno enquanto
  história que marca a sua leitura. Os modernos que no Brasil se preocuparam com a
  salvaguarda do patrimônio, mediante a consolidação do IPHAN, em contraponto, inseriram
  intervenções novas modernistas articulando com a preexistência nessa paisagem (COMAS,
  2007). A paisagem histórica de João Pessoa, salvaguardada pelo tombamento federal,
  mediante inscrição nos livros do Tombo Histórico, Arqueológico, Etnográfico e Paisagístico,
  traz fato relevante, ao recortar o núcleo inicial da ocupação urbana, protegido
  de forma rigorosa, contemplando as edificações dentro do período que se estende
  até o início do século XX, exclui o patrimônio moderno. Muito embora, a área de
  entorno de vizinhança inclui alguns exemplares da arquitetura modernista, o que
  não garante a sua preservação. Desta forma, o objetivo da presente pesquisa é estudar
  a paisagem do centro histórico de João Pessoa, observando a inserção dos edifícios
  modernistas na sua configuração tipo-morfológica. Uma vez que, como enfatiza Amorim
  (2007, pág. 18), a “necessidade da preservação de uma cultura arquitetônica e todas
  as manifestações humanas abrigadas, reveladas e simbolizadas por ela”, na paisagem,
  constructo em constante transformação, o desafio é a sobrevivência dos exemplares
  modernistas que estabelecem os elos de coesão no espaço e no tempo.
keyword: paisagem; preservação; arquitetura modernista
