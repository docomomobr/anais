abstract: As Casas Modernistas, antigas moradias, de autoria do arquiteto Augusto
  Reynaldo (1924-1958), são dois imóveis geminados que fazem parte do acervo da arquitetura
  moderna recifense. Mesmo sendo protegidos pela lei municipal, os imóveis encontram-se
  numa situação vulnerável, sofrendo constantes ações de depredação, que põe em risco
  esse patrimônio material. Busca-se, nesse texto, explanar os desafios existentes
  que envolvem esferas teóricas da conservação da arquitetura moderna e as lacunas
  da legislação. Além disso, este trabalho, a partir de textos basilares sobre o tema,
  se propõe a construir um diagnóstico preliminar da edificação nº 625 que subsidiará
  posterior proposta de intervenção, alinhada à via crítica do restauro, a ser elaborada
  em etapa subsequente.
