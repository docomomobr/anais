abstract: "O artigo se propõe a observar a relação entre tectônica e modernidade, analisando a poética da construção residencial moderna que foi produzida na cidade de Campina Grande, Paraíba, durante os anos 60 a 70. O objetivo é analisar a dimensão tectônica de três exemplares residenciais modernos produzidos pelo engenheiro civil e arquiteto autodidata campinense Geraldino Duda; e pelo arquiteto pernambucano Augusto Reynaldo. Serão analisadas as soluções projetuais, técnicas e construtivas empregadas, os materiais usados nas peles, como revestimento e soluções construtivas, a fim de se detectar, e registrar o conteúdo dessas obras, sob o olhar de dimensão construtiva da modernidade. A metodologia da pesquisa se apoia em textos de SEKLER (1965), FRAMPTON (1995), MONTANER (2002) - que são autores que trabalharam os conceitos norteadores do artigo que estão voltados para a tectônica, modernidade arquitetônica, a relação arquitetura e estrutura, materialidade e construção. Justifica-se a apresentação do mesmo nesse evento, pela necessidade de se discutir mais e procurar relacionar a importância do diálogo entre processo construtivo e a arquitetura, e a necessidade de análises voltadas para a dimensão construtiva da arquitetura: a tectônica."
keyword: "tectônica; construção; materialidade; arquitetura moderna; arquitetura residencial"
