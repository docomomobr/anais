abstract: 'O presente artigo discute o parecer de indeferimento elaborado pelo Departamento
  de Patrimônio Material (DEPAM/ IPHAN) em resposta à solicitação de tombamento federal
  do Hotel Internacional Reis Magos (HIRM). Apesar de apontar para a consistência
  e o cuidado do Estudo de Tombamento, o parecer abre questionamentos sobre a “representatividade
  nacional” do bem em questão. O “caráter excepcional” é uma prerrogativa que tem
  sido cada vez menos evidenciada como determinante nos processos relativos ao patrimônio.
  O próprio IPHAN, nos últimos anos, tem se aberto à ampliação do conceito. Como delimitado
  desde a Carta de Veneza (1964), a preservação deve considerar a significação cultural
  que as obras adquirem ao longo do tempo. Se, como apontam diversos estudos, o HIRM
  é não apenas um dos exemplares mais significativos do modernismo em Natal e no Nordeste,
  mas, sim, um marco cultural importante para a cidade entre os anos 1960 e 1990 e,
  ainda hoje, referência na paisagem urbana, nos interessa indagar: será este o capítulo
  derradeiro de uma novela que envolveu diversos segmentos da sociedade natalense
  em prol da preservação e reusos do bem? Que chance o IPHAN deixa passar pelas suas
  mãos ao não encampar um reconhecimento mais amplo do patrimônio moderno brasileiro?'
keyword: preservação; tombamento; significação cultural; modernismo
