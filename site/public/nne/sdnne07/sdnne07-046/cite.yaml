abstract: "O texto traz uma reflexão sobre a edificação de um importante complexo educacional realizado em Salvador durante o período Vargas: o Instituto Central de Educação Isaías Alves (ICEIA). O projeto é atribuído a Alexander Büddeus e a obra foi realizado pela Christiani \u0026 Nielsen (1936-1939). Pretende-se examinar o ICEIA a partir das suas principais características arquitetônicas, assinalando as suas concepções iniciais, suas principais transformações e suas circunstâncias atuais. Tem-se a intenção de conectar o ICEIA com outras experiências arquitetônicas, como as escolas construídas no Rio de Janeiro durante o mesmo momento, projetadas pelo arquiteto Enéas Silva."
