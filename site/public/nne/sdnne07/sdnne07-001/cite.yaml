abstract: "Este artigo apresenta e analisa as qualidades históricas e arquitetônicas do edifício Maria Joaquina de Morais, primeiro condomínio residencial vertical de Cuiabá, projetado pelo Engenheiro Cássio Veiga de Sá, na década de 1960. Situado na área de entorno do centro histórico da cidade, o edifício de 15 andares segue uma série de preceitos da corrente da arquitetura moderna brasileira desenvolvida entre os anos 1930 e 1960, comumente designada de Escola Carioca. Dentre as justificativas deste estudo, ressalta-se a importância de pesquisar e divulgar o acervo arquitetônico modernista do estado de Mato Grosso, com vistas ao seu reconhecimento e preservação. Busca-se, assim, estabelecer relações entre o ideário da linguagem modernista e as transformações urbanas de Cuiabá, intensificadas com a construção de Brasília e a expansão das fronteiras agrícolas rumo ao norte do Estado, nas décadas de 1960 e 1970. Como metodologia de investigação, a pesquisa serve-se de dados coletados em visitas técnicas, levantamentos in loco e entrevistas com os residentes e funcionários do edifício. Recorreu-se, a título de comparação, a obras referenciais e antecedentes históricos significativos para a compreensão das matrizes cariocas e corbusianas do edifício cuiabano, resultando em uma breve compilação da história da arquitetura moderna de Cuiabá."
keyword: "Escola Carioca; Cuiabá; Modernismo"
