abstract: 'A arquitetura moderna chegou no centro Histórico de São Luís através de
  edifícios institucionais em 1930 e se consolidou com as novas construções de edifícios
  púbicos e residências nos eixos de expansão da cidade. Dentre os programas do moderno,
  destacamos neste artigo, a construção, na década de 50, de dois grandes clubes que
  marcaram a cidade de São Luís do Maranhão: O Grêmio Litero Recreativo Português
  e o Clube Recreativo Jaguarema. Até hoje são lembrados pelos seus antigos frequentadores,
  pelas festas e eventos que esses espaços sediavam. Não é raro escutar, nas entrevistas
  com moradores, as histórias dos bailes de carnaval, bailes beneficentes e até dos
  programas de domingo. Atualmente, esses edifícios, encontram-se em um severo estado
  de degradação, abandono e ruinas. O que torna difícil o processo de identificação
  de como esses clubes se estruturavam e funcionavam. Pensando na importância histórica,
  arquitetônica e cultural desses edifícios, tomamos como objetivo deste artigo resgatar
  os traços arquitetônicos desses clubes modernos utilizando como referencial teórico
  Bruand e Cavalcanti. Através da análise de cartões postais que circularam na segunda
  metade do século XX, fotos antigas dos clubes, publicações de artigos de jornais
  e entrevistas com seus antigos frequentadores, foi possível a identificação de elementos
  da arquitetura moderna, bem como a importância e os valores dos mesmos para a população
  ludovicense. Foram utilizados como base teórica o álbum de Antônio Guimarães de
  Oliveira, o acervo da biblioteca Pública Benedito Leite e o Acervo da Biblioteca
  Nacional.'
