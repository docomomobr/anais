abstract: "O presente trabalho pretende analisar o projeto urbano de Palmas, capital do estado do Tocantins e a mais nova das capitais brasileiras, que emergiu em menos de um ano em um território imaculado, entre 1989 e 1990, um período entre a permanência do modernimo e a absorção das posturas pós-modernas. A abordagem se dará a partir do discurso de seus autores (arquitetos e urbanistas) e responsáveis pelo escritório GRUPOQUATRO e das possíveis referências urbanísticas (morfológicas) que teriam influenciado a proposta. Palmas, enquanto cidade nova, atraiu pesquisadores para seu projeto urbanístico, que se assemelha, em vários aspectos, ao proposto por Le Corbusier para Chandigarh, na Índia, ou Brasília, de Lucio Costa. Desse modo, interessa saber como os autores se apropriaram da proposta específica de Chandigarh em sua concepção ou se se trata apenas de pressupostos modernos. Outros projetos, como Milton Keynes e o Plano de Doxiádis acrecentam elementos às análises da solução adotada. Assim, discursos e projetos se confrontam na busca de uma complementaridade acerca da história da arquitetura e do urbanismo de Palmas."
keyword: "Palmas; GRUPOQUATRO; Arquitetura e Urbanismo; morfologia urbana"
