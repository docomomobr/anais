abstract: "O artigo propõe-se a observar a trajetória profissional e a relação da produção arquitetônica de dois arquitetos modernos: Cléon Furtado em São Luís do Maranhão e Alcyr Meira em Belém do Pará, tomando como ponto de partida a trajetória destes profissionais e a análise de suas residências modernistas, em suas similaridades e modernidades, analisando os elementos de fachada e escadas internas de suas casas, que dialogam e expressam peculiaridades. Analisaremos ainda uma obra institucional de cada arquiteto, avaliando sua obra em outra dimensão. Os arquitetos são protagonistas da rede da modernidade amazônica produzindo cada um em seus respectivos Estados obras residências e institucionais que representam a modernidade de cada cidade. Ressaltamos que São Luís e Belém guardam conexões históricas, desde a Companhia Grão-Pará e Maranhão, no período do apogeu colonial e também buscamos, no âmbito da rede amazônica, resgatar novas conexões pesquisando estas equivalências nas obras desses dois importantes arquitetos e desenhando a tessitura de uma rede de profissionais que disseminaram a arquitetura moderna na região. A metodologia da pesquisa será de análise comparativa entre as obras, através de fotografias, jornais e depoimentos dos arquitetos e o referencial teórico será construído na contextualização do moderno na Amazônia e nordeste em autores como em Segawa (2014), Bruand (2016), Cavalcanti (2001) e Segre (2013). O artigo propõe-se a compreender as trajetórias e valorizar a obra desses autores do moderno em suas cidades."
keyword: "arquitetura moderna em São Luís e Belém; residências modernistas; Alcyr Meira e Cléon Furtado"
