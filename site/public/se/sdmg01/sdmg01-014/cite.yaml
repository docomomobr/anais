abstract: "Há uma peculiaridade do Edifício Niemeyer, construído até o ano de 1960 na cidade de Belo Horizonte, que se apresenta como novidade tanto no contexto arquitetônico em que se situa como na literatura especializada. Trata-se do fato de seu pilotis ter uma configuração que conecta visual e espacialmente duas referências fundamentais da paisagem urbana: a Serra do Curral pode ser vista através do edifício desde a Praça da Liberdade. Tal conexão espacial permite recuperar um tema que valoriza tanto esta importante obra do modernismo brasileiro como a cidade onde se situa. Na identificação desse peculiar motivo arquitetônico, foi fundamental um estudo do edifício em seu contexto urbano e paisagístico. Lançou-se mão de uma documentação que, apesar de escassa, revelou relações espaciais essenciais para o entendimento da obra. A paisagem através da arquitetura, contudo, já não é visível na atualidade, devido ao adensamento e a verticalização construtiva do entorno ocorridos nos últimos tempos. Portanto, considera-se essencial verificar sua origem e situá-la no contexto da cidade. Procede-se, assim, ao estudo da evolução do tecido urbano e arquitetônico como subsídio para um maior esclarecimento do edifício. Com vistas a ampliar as referências e verificar a manifestação do tema em outros contextos, faz-se ainda uma incursão por outras obras de Oscar Niemeyer. Como considerações finais, destacam-se a importância do contexto e da formação evolutiva do tecido urbano como subsídios para a pesquisa arquitetônica, as relações locais e globais do território que concorrem no processo de criação projetual, e a importância da conservação e divulgação de documentos históricos."
