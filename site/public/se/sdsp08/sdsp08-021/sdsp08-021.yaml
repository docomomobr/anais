abstract: Apresentação e análise do projeto original da casa do arquiteto Hans Broos
  no Morumbi (São Paulo, 1972-83), e sua comparação com a situação atual da construção,
  através dos desenhos da residência que se encontram no acervo do arquiteto. Ainda
  que a casa já foi estudada por outros pesquisadores, sua particular distribuição
  interna, usos e cômodos, sempre levantou questionamentos sobre sua conformação.
  O estudo aqui apresentado se debruça sobre o longo processo de projeto da casa,
  mais de 10 anos, analisando os documentos gráficos do acervo, especialmente as plantas
  em suas diferentes versões, desde 1972 até 1983, para entender, e explicar, as transformações
  que deram origem à casa como é hoje. O estudo comprova que a experiência de projeto
  da casa Broos deve ser assumido como um projeto de vida em relação com a arquitetura,
  ou, vice-versa, assumido como uma comprovação da capacidade da arquitetura para
  atender à vida.
