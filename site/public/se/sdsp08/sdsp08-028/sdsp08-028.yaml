abstract: O texto pretende expor dois estudos de casos de intervenções em residências
  modernas projetadas e construídas na cidade de Campina Grande, agreste da Paraíba,
  para exemplificar as investigações que vêm sendo desenvolvidas pelo grupo de pesquisa
  arquitetura e lugar, vinculado à UFCG/ Universidade Federal de Campina Grande. Justifica-se
  a apresentação do trabalho nesse seminário, como uma maneira de refletir sobre os
  desafios encontrados para a documentação e conservação do patrimônio residencial
  moderno no nordeste brasileiro, onde a falta de uma política preservacionista municipal
  vem dando espaço à demolições e descaracterizações de um acervo ainda não inventariado
  e desprotegido, e que a cada dia se apaga na paisagem urbana e na memória dos cidadãos.
  Como metodologia da pesquisa, esta se apoia em autores que discutem sobre a documentação
  patrimonial, o projeto de restauro, os estudos de patologias construtivas – que
  dão o suporte aos projetos de intervenção no patrimônio edificado, conforme será
  visto.
keyword: Arquitetura moderna; Intervenção; Conservação
