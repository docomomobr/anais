abstract: "Este artigo apresenta o Teatro Clodoaldo Medina construído entre 1974 e 1977 em Araraquara, São Paulo. A partir do acesso aos acervos de seus autores, os arquitetos Francisco José Santoro (1944) e Arnaldo Gonzales Palamone Lepre (1924-2001), a documentação inédita dessa obra lança olhar para a produção moderna no interior paulista e busca somar esforços aos seus processos de documentação e divulgação."
