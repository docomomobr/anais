abstract: O artigo tem por objetivo apresentar o portal de difusão dos acervos da
  Faculdade de Arquitetura e Urbanismo da Universidade de São Paulo. Desenvolvido
  com a plataforma Omeka S, a partir do qual se pode fazer o compartilhamento e a
  colaboração na organização dos dados e das informações organizadas e estruturadas.
  Como parte da discussão, apresenta o histórico do acervo e discute a importância
  dos arquivos e coleções de Design e Arquitetura. Apresenta também um tópico especial
  de metadados, especificamente o Dublin Core, padrão adotado pela FAUUSP. Os resultados
  são discutidos e as perspectivas para a continuidade da plataforma também são comentadas.
