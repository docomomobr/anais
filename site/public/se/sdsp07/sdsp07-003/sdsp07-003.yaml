abstract: As escolas padrão Art Déco no Rio Grande do Sul, projetadas na década de
  1940, estão relacionadas a uma época de transformações históricas, políticas e sociais,
  sendo o prédio educacional um símbolo de valor material que incorpora recordações
  e saberes imateriais. Através de análise documental e exploratória, pode-se identificar
  que as instituições de ensino pertencentes a esse modelo estão passando por reformas
  e descaracterizações. Dessa maneira, se faz de extrema importância o debate sobre
  como intervir em obras que possuam curto distanciamento temporal. Assim, o presente
  trabalho tem o intuito de apresentar e valorizar a arquitetura escolar Art Déco,
  conscientizando e colaborando com ações de preservação.
