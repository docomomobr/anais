abstract: "Esse texto faz parte de um conjunto de artigos a partir do conteúdo da dissertação de mestrado \"Uma análise gráfica sobre a obra residencial de Joaquim Guedes\" defendida pela autora em 2018. Uma forma de leitura da obra arquitetônica é por meio do estudo de seu projeto, analisando suas diversas camadas como: fluxos, insolação, estrutura, ect. a partir dessa observação é possível estabelecer algumas relações interessantes entre estes elementos e o desenvolvimento formal das edificações. As residências modernas são um campo vasto de estudo de projeto, possuem maior liberdade projetual por possuírem menor escala e custo e foram tema de estudo e projeto para diversos arquitetos entre eles Joaquim Guedes, um dos grandes nomes da Escola Paulista. Neste trabalho será apresentado um estudo investigativo sobre uma de suas casas mais famosas a Residência Cunha Lima construída na cidade de São Paulo entre os anos de 1958 e 1963 e ganhadora do prêmio especial na Exposição Internacional de Arquitetura da VIII Bienal de São Paulo em 1965."
