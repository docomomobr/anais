abstract: 'O artigo registra um edifício comercial concebido, em meados dos anos 1970,
  por uma equipe de jovens arquitetos selecionada por uma empresa do setor moveleiro
  de São Bernardo do Campo, no ABC paulista. Desenvolve referências sobre características
  de edifícios destinados à comercialização de móveis e registra a intenção inovadora
  dos irmãos Todesco ao encomendar o projeto de uma loja de grandes dimensões, exclusiva
  para tal finalidade. Discute como, na obra produzida, atributos da chamada arquitetura
  paulista foram utilizados de modo propositivo dentro de um repertório formal, técnico
  e compositivo estabelecido: o edifício como estrutura, os espaços fluídos, os ambientes
  interligados por promenade, vistos não apenas como ecos de um repositório, mas como
  entendimento de uma espacialidade e de uma linguagem que tiveram serventia para
  outros propósitos.'
