abstract: Abrão Assad é um dos mais importantes arquitetos das primeiras gerações
  paranaenses da arquitetura moderna. Sua obra não se restringe somente ao espaço
  arquitetônico, mas também se dedicou a elaboração de projetos de equipamentos públicos,
  intervenções urbanas e obras de arte, principalmente nas esculturas e painéis em
  concreto e em madeira. Este trabalho documenta uma obra pouco publicada do arquiteto
  paranaense, o projeto de sua própria residência. Obra de 1973 está situado em um
  grande terreno, circundado por um bosque nativo e se caracteriza pelo uso de componentes
  estruturais em madeira. Além da materialidade, a obra também se destaca pelo partido
  arquitetônico adotado, solução que remete ao sistema Dom-ino de Le Corbusier e as
  “casas apartamentos” da escola paulista. Para a documentação da obra, são apresentadas
  imagens ainda não publicadas e que foram cedidas pelo acervo do arquiteto, além
  do redesenho do projeto original. Também é retratado uma breve descrição sobre o
  início da arquitetura moderna em Curitiba, a biografia do arquiteto, suas referências
  e outros projetos realizados.
