abstract: José Zanine Caldas (1919-2001) foi um arquiteto autodidata, maquetista e
  designer de móveis reconhecido no cenário arquitetônico brasileiro por representar
  a síntese entre os saberes empírico e erudito na construção. Os anos entre 1964
  e 1980 destacam-se em sua carreira como arquiteto, pois Zanine projetou e coordenou
  a construção de uma série de residências no Bairro do Joá, na cidade do Rio de Janeiro.
  Apesar de ser essa figura multifacetada, atuando em áreas como design, urbanismo
  e arquitetura, Zanine é pouco reconhecido e existe reduzida quantidade de registros
  do período em que o arquiteto atuou no Rio de Janeiro. Com isso, o proposto artigo
  tem como objetivo documentar a Casa Leite Barbosa (1968), uma das residências que
  José Zanine Caldas projetou no Bairro do Joá, e relacionar o saber-fazer como processo
  projetual com a arquitetura de princípios modernos. Como resultado desse breve estudo,
  é possível perceber como o saber-fazer do arquiteto reflete-se diretamente no processo
  de projeto e na obra concluída, tanto nas estruturas em madeira quanto na espacialidade
  moderna.
keyword: Estrutura em Madeira; Modernidade; Arquitetura Vernacular
