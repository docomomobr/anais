abstract: O objetivo deste trabalho é apresentar a obra do arquiteto Márlio Raposo
  Dantas, pernambucano radicado em Santos desde 1962, por meio de um recorte de sua
  vida e obra, destacando suas referências históricas. De formação modernista, Márlio
  teve influência da Escola Carioca nos anos 1960 quando frequentou a Faculdade Nacional
  de Arquitetura, no Rio de Janeiro. A partir de então desenvolve uma linguagem própria,
  utilizando o concreto aparente, técnica ainda praticamente inédita na região, que
  pode ser facilmente identificada em suas obras.
