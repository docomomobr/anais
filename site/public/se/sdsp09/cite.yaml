id: sdsp09-008
type: paper-conference
title: "Arquitetura educadora: formação de público e preservação da sede do MAC USP"
container-title: "9º Seminário Docomomo São Paulo, Santos, 2024"
event-title: "9º Seminário Docomomo São Paulo, Santos, 2024"
issued:
  date-parts:
