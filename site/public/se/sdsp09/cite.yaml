abstract: "Este artigo apresenta como tema o processo de verticalização da cidade de São Vicente, SP nos anos de 1950 e 1960. O contexto é de crescimento urbano da cidade, que coincide com um momento singular da produção arquitetônica atrelada ao desenvolvimento do mercado imobiliário nacional, sob essa ótica, é evidenciado a materialização das transformações dos aspectos formais da cultura e do espaço. Objetiva-se por intermédio das obras do engenheiro-arquiteto Lauro da Costa Lima (1917-2006), esboçar as relações entre arquitetura e cidade, bem como seus rebatimentos no ambiente construído em meio a dualidade do morar moderno da capital e litoral paulista. Para tanto, em meio a exemplares da produção de Costa Lima, no recorte espacial citado, o estudo apoia-se na análise do Edifício Marahú, 1959."
