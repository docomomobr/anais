abstract: 'Este artigo analisa o aparecimento, a consolidação e a preservação do edifício
  Metrópole. Projetado pelos arquitetos Giancarlo Gasperini e Salvador Candia, em
  1959, o conjunto transformou-se em símbolo da dinâmica urbana e da forte rede de
  sociabilidade que caracterizou a região em meados do século XX. Este conjunto é
  formado por dois volumes interligados: uma galeria comercial com cinco pavimentos
  que ocupa todo o lote e uma torre de escritórios de 23 andares. Atualmente, problemas
  de gestão e conservação da galeria e da torre de escritórios reforçam a necessidade
  urgente de compreender aspectos projetuais e construtivos do edifício para sua preservação
  e reconhecimento de seus valores culturais. O trabalho se articula a partir de pesquisa
  histórica, bibliográfica, iconográfica, levantamento de artigos de jornais e análise
  do estado atual de conservação a partir do trabalho de campo.'
keyword: Galerias modernas; Conservação; Patrimônio cultural
