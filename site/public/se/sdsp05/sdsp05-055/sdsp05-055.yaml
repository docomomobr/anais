abstract: A obra do arquiteto Alcides Rocha Miranda em São Paulo é pouco reconhecida,
  apesar de sua atuação acadêmica como professor da Faculdade de Arquitetura e Urbanismo
  da USP, do seu trabalho à frente da diretoria regional do Sphan e, especialmente,
  de seus projetos para o Centro Educacional de Leme (1953) e para o Instituto do
  Professor Primário (IPP-1951) na Cidade Universitária em São Paulo. O presente trabalho
  apresenta o projeto que desenvolvemos para a recuperação e ampliação do IPP, atual
  Faculdade de Educação da USP, entre setembro de 2012 e maio de 2014, resultado de
  concorrência pública promovida pela Superintendência do Espaço Físico da USP. Nosso
  relato situa, em primeiro lugar, a obra de Rocha Miranda em São Paulo em relação
  à sua produção e à produção da Arquitetura Paulista, o que nos permite identificar
  parte significativa de suas características e singularidades. Em seguida, descrevemos
  o projeto de recuperação e ampliação que desenvolvemos no contexto do Plano Diretor
  da Cidade Universitária e do Plano Diretor da Faculdade de Educação. Ao final, apresentamos
  um conjunto de considerações que, ao nortearem nosso projeto, podem ser úteis em
  processos investigativos de projetos semelhantes de intervenção.
keyword: Alcides Rocha Miranda; Arquitetura da Universidade de São Paulo
