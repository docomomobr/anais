title: "O projeto arquitetônico como laboratório experimental na Arquitetura Paulista: Vilanova Artigas e as casas Olga Baeta e Rubens de Mendonça na década de 1950"
container-title: "5º Seminário Docomomo São Paulo, São Paulo, 2017"
event-title: "5º Seminário Docomomo São Paulo, São Paulo, 2017"
issued:
  date-parts:
    - [2017, 10, 16]
