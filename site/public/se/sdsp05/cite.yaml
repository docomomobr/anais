title: "Edificar parques/parquear a cidade: uma reflexão sobre o processo de habitar a 'natureza' urbana no final do século 20 a partir do Parc de la Villette e dois predecessores referenciais, o Parc des Buttes-Chaumont e o Parque Ibirapuera"
container-title: "5º Seminário Docomomo São Paulo, São Paulo, 2017"
event-title: "5º Seminário Docomomo São Paulo, São Paulo, 2017"
issued:
  date-parts:
