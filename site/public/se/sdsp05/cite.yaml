title: "A turma de 1930 do Mackenzie: Bratke, Capua e Fonseca Rodrigues. Ensino e Arquitetura em São Paulo nos anos 1920–1930"
container-title: "5º Seminário Docomomo São Paulo, São Paulo, 2017"
