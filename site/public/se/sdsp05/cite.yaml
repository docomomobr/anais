ISBN: "978-85-88157-16-3"
page: "881-901"
language: pt-BR
abstract: "O presente trabalho propõe a análise comparativa de duas obras paulistas concebidas no início dos anos 70 do século XX, que têm em comum sua estrutura formal: uma grande abóbada cobre todo o espaço e funciona simultaneamente como estrutura, cobertura e vedação. São duas casas unifamiliares emblemáticas da arquitetura moderna paulista, ambas na cidade de São Paulo: a Casa Dino Zammataro, de 1970, é de autoria do arquiteto Rodrigo Lefèvre; a Casa Marcos Acayaba, de 1972-75, é assinada pelo arquiteto Marcos Acayaba. Ambas são concebidas como um grande abrigo, com espacialidade fluida, perfeitamente enquadradas na arquitetura paulista moderna do período. A primeira, em lote pequeno, com programa restrito e dirigida a usuário de poder aquisitivo limitado, faz parte de uma experimentação de Lefèvre, que identifica a abóbada com o uso de técnicas populares e econômicas, voltadas à solução de problemas sociais. Já na segunda, em lote de grandes dimensões, com programa amplo e dirigida a usuário de alto poder aquisitivo, sobressaem mais fortemente a ambição plástica e o impulso experimental do autor. Na Casa Zammataro, Lefèvre utiliza a curva parabólica, construída com vigas de concerto e tijolos cerâmicos. Além do baixo custo, outra vantagem do uso da abóbada seria a proteção do canteiro de obras, abrigando os operários da intempérie. Marcos Acayaba opta pela curva catenária, construída em concreto armado, bem mais cara e sofisticada. Em ambas as residências, além de estrutura e solução formal serem coincidentes, a espacialidade é semelhante, baseada na fluidez espacial. Mas essa mesma estrutura formal é dirigida a estratos econômicos diferentes e usada com propósitos bem distintos: uma é concebida com conotações de ordem social, com materiais e técnicas que visam a economia; a outra, com intenções primordialmente plásticas, faz uso de técnicas e materiais mais caros e sofisticados."
