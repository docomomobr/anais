language: pt-BR
abstract: "O presente artigo procura evidenciar as transformações que o edifício Esther passou ao longo dos anos. Desde sua concepção em 1932 até os dias atuais, quando após anos em esquecimento retorna para o cenário paulistano através de outro agente privado. Desta maneira, o texto se divide em quatro momentos e uma possível especulação sobre o surgimento de um novo agente privado. Primeiro, são introduzidos os ideais de modernidade da família Nogueira, membros da aristocracia agricultora paulista. Posteriormente, apresenta-se o concurso como instrumento para conformação de um projeto que tornasse concreto os anseios da família. O terceiro momento se qualifica pelo período de prestígio do edifício que abrigou moradores ilustres como Rino Levi, Di Cavalcanti entre outros e por fim, o quarto período, de degradação e esquecimento com o deslocamento das atividades comerciais e de serviço da área central para outros eixos da cidade, como avenida Paulista e avenida Faria Lima. A especulação a qual se encerra o artigo tenta pressupor indícios sobre um possível segundo agente privado, estimulando novas transformações para o edifício. Assim, o artigo percorre as transformações do Esther ao longo dos anos permeando fatos históricos da evolução paulista e o papel dos agentes privados como promotores da imagem de modernização da cidade de São Paulo nas décadas de 1920 e 1930."
