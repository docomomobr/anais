abstract: "O edifício do Instituto de Arquitetos do Brasil (IAB-SP) foi construído nos anos 1950 na área central da cidade de São Paulo, com projeto de uma equipe de arquitetos coordenada por Rino Levi, vencedores de um concurso. Essa construção representou a efervescência cultural dos anos 60, concentrando uma grande parte dos artistas e discussões de vanguarda no seu subsolo, no Clubinho dos Artistas. O local sempre foi importante para a discussão da arquitetura e da cidade, tanto pela presença da sede do IAB-SP, quanto pelos escritórios que ali se estabeleceram, como, por exemplo, os de Vilanova Artigas, Paulo Mendes da Rocha e Rino Levi. O edifício foi reconhecido como Patrimônio Cultural do Estado pelo Condephaat em 2002. A grande marquise em balanço sobre a calçada apresentou sinais de problemas estruturais no início dos anos 2010 e, devido à urgência em recuperá-la, foi elaborada a primeira parte de um projeto de restauro, iniciado em 2014. O projeto de restauro se desenvolveu a partir do estudo aprofundado do projeto executivo de arquitetura original e de prospecções in loco que serviram de base para o processo de restauro. O resultado dos trabalhos, além de tratar da estrutura, recupera o sistema de captação de águas pluviais, utilizando de linguagem contemporânea."
