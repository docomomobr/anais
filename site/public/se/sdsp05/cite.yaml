title: "Influência de Vilanova Artigas na Arquitetura Escolar Paulista contemporânea: Escola Estadual, Conjunto Habitacional Campinas F1 e Escola Estadual Jardim Ataliba Leonel"
container-title: "5º Seminário Docomomo São Paulo, São Paulo, 2017"
