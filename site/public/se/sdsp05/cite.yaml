language: pt-BR
abstract: "Este artigo reflete sobre o projeto de arquitetura moderna do Clu-\nbe Paineiras do Morumby, na cidade de São Paulo, Brasil, um projeto\niniciado na década de 1960, âncora para a ocupação do bairro. Em ter-\nreno inicial com área aproximada de 80.000 m2, posteriormente agre-\ngou lotes vizinhos, endereçado para a avenida Doutor Alberto Pente-\nado 605, está na cota 798 metros acima do nível do mar, o declive\nde 50 metros de altura definiu a implantação na extensão longitudinal\n(Norte-Sul) de cerca 400 metros, constituindo o plano diretor inicial. Os\narquitetos Carlos Barjas Millan e Paulo de Mello Bastos, seu sucessor,\nseguiram com rigor a proposta inicial, inclusive o partido arquitetônico\ndas edificações. O partido definiu plataformas para as diversas ativida-\ndes sociais e esportivas (piscinas com o pavilhão da fisioterapia, ves-\ntiários, tênis). Uma grande edificação para a sede social emerge com\nelegância na paisagem, enfatiza a circulação vertical e conecta com as\ndiferentes cotas das plataformas. Inserido em um talude da plataforma\ndas quadras de tênis está o ginásio poliesportivo do vale, há ainda ou-\ntros dois ginásios menores. Na cota inferior estão os dois campos de\nfutebol: oficial e society. Os documentos originais - desenhos, projetos,\nexistentes na Biblioteca da Faculdade de Arquitetura e Urbanismo da\nUniversidade de São Paulo - foram a base para escrever este artigo,\ncomplementado pela iconografia e informações oficiais contidas nos\nprocessos de aprovação disponíveis no arquivo municipal. Os docu-\nmentos registram os fatos, além de estudada a bibliografia resultante\nde pesquisas realizadas por outros arquitetos. Este material é relevante\npois poderá ser útil para uma futura restauração desse conjunto de\nedifícios e desenvolver um plano de conservação e tutela, de modo a\nresgatar o plano diretor. O clube teve seu valor cultural arquitetônico\nreconhecido pela legislação de abertura de tombamento em junho de\n2012. Isto revela o quanto é importante preservar este patrimônio cul-\ntural no presente para as gerações futuras."
