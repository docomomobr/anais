abstract: "A modernização da sociedade brasileira, expressa nos novos padrões de produção e consumo e novas classes sociais do segundo pós-guerra, resultou em uma nova percepção de atividade de projetação pelos arquitetos paulistas, transformando o projeto da casa em verdadeiro laboratório experimental. Neste contexto, Vilanova Artigas procurou experimentar novas soluções formais e tecnológicas em seus projetos residenciais, acabando por nelas imprimir as possibilidades e contradições da modernização brasileira, conforme se vê nas casas Olga Baeta (1956) e Rubens de Mendonça (1958)."
