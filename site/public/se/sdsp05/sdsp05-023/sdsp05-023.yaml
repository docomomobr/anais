abstract: 'A documentação da produção material e escrita que envolve a arquitetura
  moderna brasileira recebeu importantes contribuições vindas do arquiteto e professor
  Alberto Xavier, que reuniu, em livros referenciais, seleções abrangentes e criteriosas
  de textos e obras que, por décadas, têm servido como guia a estudantes e pesquisadores.
  O reconhecimento e difusão de tais volumes e suas reedições – Lúcio Costa: sobre
  arquitetura (1962; 2002); a série Arquitetura moderna – paulistana (1983), em Curitiba
  (1985), em Porto Alegre (1987) e no Rio de Janeiro (1991); o levantamento Brasília
  e arquitetura moderna brasileira - bibliografia selecionada (1977; 2002), a coletânea
  Depoimento de uma geração. Arquitetura moderna brasileira (1987; 1991; 2003) e,
  mais recentemente, Brasília: antologia crítica (2012) – só fazem confirmar sua importância.
  Pretende-se, com esta pesquisa, recompor a trajetória e estabelecer um panorama
  das publicações de Alberto Xavier, por vezes, associado a outros autores, evidenciando
  o pioneirismo das ações na pesquisa histórica da arquitetura moderna brasileira,
  na relevância dos recortes atribuídos pelo autor para a seleção e organização do
  material levantado, e nos cuidados com precisão e métodos utilizados que validam
  e legitimam o material reunido.'
keyword: Publicações sobre arquitetura moderna; Antologia crítica; Pesquisa em arquitetura
  e urbanismo
