abstract: Na metade do século XX foram construídos bons exemplos de edifícios residenciais
  modernos em áreas centrais de algumas capitais brasileiras, como São Paulo e Porto
  Alegre. Eram edifícios altos, de estrutura independente de concreto armado, unidades
  muito amplas com grandes panos de vidro e algumas inovações interessantes tecnológicas.
  Os primeiros compradores eram famílias da elite econômica que trocava suas grandes
  casas burguesas pelo apartamento, tentando acompanhar a tendência dos novos tempos.
  Internamente, porém, seguiam fazendo ambientações de maneira bastante tradicional.
  Passados 50 anos, na primeira década do século XXI, em ambas as cidades citadas,
  uma notável renovação de público acontece nesses edifícios; os antigos proprietários
  dão lugar a um novo cliente, mais jovem, geralmente solteiro ou recém-casado, disposto
  a enfrentar uma reforma considerável e encaram essa aventura amparados no que vêm
  como vantagens na proposta destes edifícios. E o resultado dessas transformações,
  geralmente, atingem um resultado mais uniforme e coerente do que a ocupação original.
keyword: Arquitetura Moderna; Ambientação de interiores; Reforma de interiores
