abstract: 'O artigo trata dos edifícios habitacionais localizados no Guarujá, lito-

  ral do estado de São Paulo, projetados por Paulo Mendes da Rocha em

  1983. Como parte do restrito rol de projetos de habitações coletivas ver-

  ticais executados do arquiteto, explicita que soluções projetuais desen-

  volvidas ou exploradas por Mendes da Rocha ao longo de mais de qua-

  tro décadas permanecem sendo utilizados em suas obras mais recentes.

  Assim, a opção por determinado mecanismo, ainda que aprimorado ou

  readequado, concorre para o fortalecimento da solução. Por outra via, os

  eventos ímpares, como algumas propostas da década de 1980, deno-

  tam uma concessão deliberada às especificidades do contexto.'
