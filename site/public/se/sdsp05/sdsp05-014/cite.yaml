abstract: "O artigo trata dos edifícios habitacionais localizados no Guarujá, lito-\nral do estado de São Paulo, projetados por Paulo Mendes da Rocha em\n1983. Como parte do restrito rol de projetos de habitações coletivas ver-\nticais executados do arquiteto, explicita que soluções projetuais desen-\nvolvidas ou exploradas por Mendes da Rocha ao longo de mais de qua-\ntro décadas permanecem sendo utilizados em suas obras mais recentes.\nAssim, a opção por determinado mecanismo, ainda que aprimorado ou\nreadequado, concorre para o fortalecimento da solução. Por outra via, os\neventos ímpares, como algumas propostas da década de 1980, deno-\ntam uma concessão deliberada às especificidades do contexto."
keyword: "Paulo Mendes da Rocha; Habitações coletivas; Habitação vertical"
