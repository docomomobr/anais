abstract: A arquitetura religiosa é um tema de menor destaque dentro do movimento
  moderno, embora tenha sido abordado de forma bastante interessante por diversos
  arquitetos como a capela de Ronchamp (1955) de Le Corbusier, Sinagoga Beth Sholom
  (1954) de Frank Lloyd Wright e a catedral de Brasília de Oscar Niemeyer são exemplos
  do desenvolvimento das questões religiosas dentro da lógica racional e laica do
  movimento moderno. Notre Dame du Raincy (1924) do arquiteto francês Auguste Perret
  é pioneira no uso escultórico e estrutural do concreto para este programa. Dentro
  do caso brasileiro, uma das primeiras igrejas da arquitetura moderna é a Igreja
  da Vila Madalena (1955) em São Paulo do arquiteto Joaquim Guedes que possui características
  brutalistas e que trabalha de forma pouco convencional as questões do programa religioso
  e os conceitos modernos. Considerando o pioneirismo da obra da de Guedes nesse contexto,
  é proposto um paralelo entre a Notre Dame du Raincy e a Igreja da Vila Madalena,
  buscando a presença do arquiteto francês no caso brasileiro para além do uso do
  concreto aparente.
