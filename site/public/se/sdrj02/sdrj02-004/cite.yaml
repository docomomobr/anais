abstract: "Muito além de noticiar os bastidores da primeira bienal paulistana, inaugurada em setembro de 1951, periódicos de grande tiragem sublinharam a magnitude do evento e sua importância para a difusão de conhecimentos. Em contrapartida, algumas publicações tão somente questionaram os resultados do júri de premiação, deliberadamente mais favorável aos trabalhos de caráter não figurativo, alimentando o acalorado debate entre figuração e abstração. Ao longo do período de funcionamento das primeiras bienais, revistas e diários veicularam ilustrações satíricas capazes de sinalizar uma peculiar interpretação das obras expostas na seção de artes e na mostra de arquitetura. A partir dos dados levantados no Arquivo Histórico Wanda Svevo, esta comunicação pretende ressaltar o teor dos artigos publicados sobre as obras expostas nas cinco primeiras edições da bienal paulistana, colocando-se em evidência os limites entre o visível e o legível, bem como a recorrente dificuldade de aceitação ante o desconhecido."
