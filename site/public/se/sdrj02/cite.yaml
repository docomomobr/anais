id: sdrj02-006
type: paper-conference
title: "As perspectivas e desafios institucionais frente à nova lei de abertura dos acervos"
container-title: "2º Encontro Docomomo Rio, Rio de Janeiro, 2012"
event-title: "2º Encontro Docomomo Rio, Rio de Janeiro, 2012"
issued:
  date-parts:
