abstract: "Pretende-se, com este artigo, apresentar o Pavilhão Arthur Neiva, os principais estudos e intervenções realizados desde sua construção, e a análise do seu estado de conservação, a fim de contribuir para os recentes debates sobre os riscos, vulnerabilidades e desafios que envolvem a preservação do patrimônio moderno no Brasil na atualidade."
