abstract: "O local onde hoje funciona o Instituto Municipal de Assistência à Saúde Nise da Silveira acompanhou as transformações nos conceitos relativos aos tratamentos psiquiátricos ao longo do século XX e foi, a partir de 1944, o principal centro de assistência a cidadãos com transtornos mentais no Brasil. A instituição é atualmente um dos cinco polos municipais de referência para emergência e internação, sendo responsável pela assistência à saúde mental no subúrbio carioca.\n\nO presente trabalho pretende discutir o momento de transição da arquitetura brasileira ocorrido entre as duas grandes guerras, em que a produção arquitetônica passou dos modelos do ecletismo, até então predominante no país, para os esquemas do modernismo, utilizando as edificações existentes no local, especialmente as modernistas, de forma a resgatar o processo de desenvolvimento da arquitetura hospitalar durante o século XX, e considerando as diferentes propostas municipais de reformulação da instituição.\n\nAlém disso, o trabalho pretende avaliar as alterações já introduzidas pela Prefeitura carioca nessa unidade de atendimento, que, entre outras medidas, suprimiu uma edificação construída no período mencionado, o Hospital de Neuropsiquiatria Infantil, para introdução de containers que compõem uma UPA (Unidade de Pronto-atendimento)."
keyword: "Modernismo; protomodernismo; psiquiatria"
