abstract: "Este artigo busca construir um comparativo entre duas residências: a Casa Lota (Arq. Sérgio Bernardes) e a Casa Varanda (Arq. Carla Juaçaba). A primeira, considerada exemplar da arquitetura moderna, e a segunda, uma referência contemporânea carioca. O método de comparação possibilitou observar as aproximações entre as duas residências, bem como a relação entre arquiteturas modernas e contemporâneas, através de análise gráfica e textual. Autores como Ching (1993), Clark \u0026 Pause (1997) e Florio (2002) serviram de base para esta investigação. O redesenho dos projetos e a análise dos princípios de forma, espaço e ordem auxiliaram na elaboração de diagramas sintéticos interpretativos, sobre os quais foram desenvolvidos textos que explicam e questionam os aspectos de cada proposta. O discurso dos problemas, das soluções, bem como das lições de arquitetura de cada estudo de caso permitiu a apreciação do papel do projeto como portador de ideias e intenções. Assim, podese dizer que a relevância deste estudo não reside somente na pesquisa histórica, crítica e projetual, mas também em um contexto mais amplo da arquitetura moderna brasileira."
keyword: "Arquitetura Residencial Moderna; Sérgio Bernardes; Análise Gráfica"
