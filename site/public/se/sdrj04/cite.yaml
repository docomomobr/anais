ISBN: "978-85-88027-42-8"
page: "201-217"
language: pt-BR
abstract: "A presente comunicação pretende contribuir para o debate sobre os desafios relacionados à preservação da arquitetura moderna, a partir da apresentação do estudo que vem sendo realizado sobre o antigo Pavilhão da Febre Amarela (atual Pavilhão Henrique Aragão), construído entre 1954 e 1960, no campus da Fundação Oswaldo Cruz (Fiocruz) em Manguinhos, no Rio de Janeiro.\n\nO estudo parte da análise do projeto original, das intervenções ocorridas ao longo do tempo e do seu atual estado de conservação. Através desse diagnóstico, busca-se identificar os valores que podem ser atribuídos ao edifício e propor diretrizes para garantir a permanência dos elementos que justificaram essa valoração. Importante ressaltar a importância do conhecimento do bem cultural para orientar ações preventivas que possam minimizar os processos de deterioração dos materiais que o constituem e assim garantir a conservação destes bens de forma mais sustentável.\n\nO diagnóstico ora em curso pretende subsidiar a elaboração de um plano de conservação preventiva buscando definir diretrizes que orientem o planejamento das ações necessárias à sua preservação, baseadas na mínima intervenção e uso compatível do edifício."
keyword: "patrimônio moderno; conservação preventiva; Pavilhão da Febre Amarela"
