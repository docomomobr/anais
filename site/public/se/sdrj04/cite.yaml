abstract: "O artigo analisa o início da produção de edifícios de apartamentos pela iniciativa privada no município do Rio de Janeiro, ao longo da década de 1920. Serão analisados os projetos das unidades habitacionais do Edifício Praia do Flamengo (1923), Edifício Glória (1924), Edifício Tamandaré (1928), Edifício Itaoca (1928), Edifício Barão de São Félix (1929), Edifício Paissandú (1929) e Edifício Morro de Santo Antônio (1929). A organização funcional das plantas aponta para a existência de um período de definição programática e de especialização nos espaços internos dos apartamentos, que nas décadas seguintes se consolidou e foi amplamente difundido com o padrão burguês de tripartição em áreas social, íntima e de serviços. Especialmente, o artigo analisará o projeto do Edifício Morro de Santo Antônio, de autoria do arquiteto Marcelo Roberto. Estilisticamente vinculado à produção internacional do modernista, o edifício de sete pavimentos, térreo comercial e unidades duplex reflete de maneira emblemática as contradições e inovações que marcaram o período inicial de produção de apartamentos na cidade."
keyword: "apartamento; habitação coletiva; Rio de Janeiro"
