abstract: "As Cidades Universitárias no Brasil foram um grande campo de experimentação e atuação da arquitetura moderna. A Universidade do Brasil é um marco nessa trajetória, pois configura o ponto de partida do projeto educacional e político na tentativa da criação de um modelo para as Cidades Universitárias Brasileiras, encampado pelo Ministro Gustavo Capanema quando a frente do Ministério da Educação.\n\nA Cidade Universitária da Universidade Federal do Rio de Janeiro é um dos conjuntos modernistas mais importantes da cidade do Rio de Janeiro, tanto do ponto de vista histórico-político, como do ponto de vista da qualidade arquitetônica. Esta pesquisa procurou, através da vasta documentação existente, resgatar a historiografia da Cidade Universitária, seu processo de projeto e construção, os agentes históricos envolvidos e seus valores artísticos e arquitetônicos, buscando assim identificar, dentro do contexto geral da preservação do patrimônio cultural, os valores para sua preservação, tanto do ponto de vista de seu traçado urbano como do seu edifício moderno mais emblemático — a Faculdade Nacional de Arquitetura."
keyword: "Preservação; Arquitetura Moderna; Cidade Universitária"
author:
  - family: "Cordeiro"
    given: "Patricia Cavalcante"
