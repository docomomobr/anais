id: sdrj04-016
type: paper-conference
title: "Parque do Flamengo: patrimônio moderno, possibilidades contemporâneas através das estruturas paisagísticas"
container-title: "4º Seminário Docomomo Rio, Rio de Janeiro, 2017"
event-title: "4º Seminário Docomomo Rio, Rio de Janeiro, 2017"
issued:
  date-parts:
    - [2017, 10, 31]
ISBN: "978-85-88027-42-8"
page: "257-274"
language: pt-BR
abstract: "O presente trabalho desenvolve um ensaio sobre o processo de preservação do patrimônio moderno e dinâmicas paisagísticas através do Parque do Flamengo. O objetivo da reflexão de construir argumentos para defender uma mudança no processo de tombamento do espaço livre público, a fim de promover sua potencialização e a vitalidade social na contemporaneidade, mantendo as premissas políticas e projetuais do projeto moderno, bem como preservar o traço original de Burle Marx. Este trabalho tem como objetivo então estudar o parque como uma paisagem contemporânea, entendendo quais são os elementos originais do projeto da década de 1960, quais são as variações posteriores ao projeto que geraram a paisagem atual, quais são os problemas paisagísticos gerados pelo abandono e quais seriam as transformações necessárias ao parque para potencializar os ideais projetuais de espaço público sem descaracterizar os padrões do desenho moderno. Por esta razão trabalha-se o conceito de estrutura paisagística, identificando os elementos espaciais em camadas articuladas, comparando o projeto original ao estado atual da paisagem. A hipótese defendida pelo estudo é a de que a manutenção, o aprofundamento quanto às qualidades paisagísticas e a consolidação quando ao ideal projetado destes elementos espaciais seria uma possibilidade mais eficiente para a preservação do patrimônio moderno paisagístico, se comparados a abordagens teóricas similares à analise de estruturas arquitetônicas. O problema da preservação fica claro ao longo do debate público quanto a Marina da Glória, onde os órgãos de patrimônio defendiam a conversão do espaço, mesmo que não atendidas as previsões conceituais do projeto original, frente a uma pressão política e econômica pela transformação de um trecho do parque, que no fim das contas ocorreu também sem considerar as estruturas projetadas e as existentes."
author:
  - family: "Mattos"
    given: "Vinicius Ferreira"
    ORCID: "https://orcid.org/0000-0001-6050-4487"
