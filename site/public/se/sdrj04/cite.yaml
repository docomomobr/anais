id: sdrj04-009
type: paper-conference
title: "Riscos para o Patrimônio Moderno na cidade do Rio de Janeiro influenciados pelas mudanças climáticas"
container-title: "4º Seminário Docomomo Rio, Rio de Janeiro, 2017"
event-title: "4º Seminário Docomomo Rio, Rio de Janeiro, 2017"
issued:
  date-parts:
    - [2017, 10, 31]
ISBN: "978-85-88027-42-8"
page: "134-149"
language: pt-BR
abstract: "O tema das mudanças climáticas tem sido foco de pesquisas em vários campos do conhecimento, como saúde e meio ambiente, mas em relação ao patrimônio cultural as discussões no cenário nacional ainda se encontram muito restritas. O objetivo do presente trabalho é apresentar os cenários previstos para a cidade do Rio de Janeiro considerando os impactos das mudanças climáticas e analisar de que forma as alterações podem afetar os edifícios e sítios históricos modernos existentes na cidade, levando em conta suas características e vulnerabilidades. As pesquisas indicam a possibilidade de aumento da temperatura do ar, da intensidade e quantidade de chuva, da frequência de eventos meteorológicos extremos e do nível do mar. A combinação entre os cenários previstos e as características específicas da arquitetura moderna carioca – tais como a ausência de elementos tradicionais de proteção contra as intempéries; o uso extensivo de concreto armado; a combinação de técnicas modernas e materiais tradicionais; e a proximidade com o mar – representam ameaças que podem impactar significativamente esses bens. Nesse contexto, a adoção de abordagens preventivas focadas na gestão dos riscos identificados revela-se fundamental para garantir a conservação do patrimônio moderno carioca."
keyword: "Arquitetura moderna; gestão de riscos; mudanças climáticas"
author:
  - family: "Coelho"
    given: "Carla Maria Teixeira"
    ORCID: "https://orcid.org/0000-0002-2293-8054"
