title: "Arquitetura em risco: um estudo sobre a obra de Antonio Virzi no Rio de Janeiro e sua importância como patrimônio de uma moderna Arquitetura Carioca"
container-title: "4º Seminário Docomomo Rio, Rio de Janeiro, 2017"
event-title: "4º Seminário Docomomo Rio, Rio de Janeiro, 2017"
issued:
  date-parts:
    - [2017, 10, 31]
ISBN: "978-85-88027-42-8"
page: "65-81"
language: pt-BR
abstract: "Antonio Virzi (1882-1954) contribuiu enormemente para o desenvolvimento arquitetônico e cultural do Rio de Janeiro no início do século XX. Pioneiro na construção de uma estética inovadora e original em consonância com o espírito de um novo tempo, seus projetos romperam com o academicismo historicista dominante e estabeleceram uma importante transição entre dois séculos. Apesar disso, o arquiteto ainda recebe pouco destaque na historiografia arquitetônica disponível. Desse modo, este trabalho pretende lançar luz à sua produção arquitetônica, contribuindo para a divulgação e preservação de sua obra e o reconhecimento da mesma como patrimônio (ameaçado) de uma moderna arquitetura carioca. Para isso, o artigo foi elaborado em três etapas distintas: a primeira apresenta um panorama geral sobre Antonio Virzi e seu tempo; a segunda ressalta a influência do movimento Arts and Crafts, do Art Nouveau e do Art Déco em sua obra, destacando sua importância na passagem do Ecletismo em direção ao Modernismo; a terceira e última realiza um estudo de caso do Villino Silveira (1915), abrindo perspectivas sobre a sua preservação."
keyword: "Antonio Virzi; Arquitetura; Rio de Janeiro"
