abstract: Partindo de um sincretismo arquitetônico luso-ameríndio, São Paulo passou
  de vila à cidade influenciada pelo avanço das tecnologias construtivas europeias.
  Com a chegada do século XX, uma nova geração de arquitetos passa a mesclar o estilo
  e os métodos do modernismo às possibilidades construtivas do período. Destacando-se,
  dentre estes, Lina Bo Bardi e Oswaldo Bratke, partimos deste contexto e destes arquitetos,
  tendo por objetivo a realização de uma análise reflexiva sobre suas próprias residências.
  Construídas na década de 1950, através destas, eles instalaram a linguagem da Arquitetura
  Moderna Brasileira, propondo um novo modo de morar, marcado pela fluidez entre interior-exterior,
  eficiência construtiva e setorização funcional.
