abstract: O presente artigo apresenta as unidades habitacionais projetadas e construídas
  por Joaquim Guedes em Caraíba, atualmente distrito de Pilar, município de Jaguarari,
  BA, cidade nova de mineração projetada para a companhia Vale do Rio Doce no final
  dos anos 70. As unidades, divididas entre casas, apartamentos e alojamentos de diferentes
  níveis, e sua distribuição no espaço, sintetizam algumas propostas do arquiteto
  para o desenvolvimento do núcleo, dentre as quais o convívio comunitário e a transição
  de uma sociedade rural para a modernidade. O artigo também faz alguns apontamentos
  sobre as alterações sofridas por esses edifícios nos últimos anos, especialmente
  após a privatização da companhia mineradora, a Mineração Caraíba, quando a propriedade
  dos imóveis, até então mantidos como propriedade da companhia, foi transferida para
  os trabalhadores.
