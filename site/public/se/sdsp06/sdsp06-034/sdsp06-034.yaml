abstract: Através da análise de duas obras construídas recentemente, o Museu Oscar
  Niemeyer e o Museu Nacional dos Coches, o artigo reflete sobre a condição contemporânea
  da obra de dois epígonos da arquitetura moderna brasileira, Oscar Niemeyer e Paulo
  Mendes da Rocha. Considera-se que os museus selecionados são representativos das
  permanências e transformações observadas ao longo da trajetória de ambos, refletidas
  nos procedimentos projetuais e na própria significação das obras na atualidade.
  A escolha de dois museus como objeto de análise também é indicativa de parte dessa
  nova condição, na qual a consagração de suas obras incorre em um expressivo aumento
  de encomendas para equipamentos culturais. Finalmente, o texto aborda a vigência
  e o legado de pensamentos que marcaram a arquitetura do século XX na atualidade.
