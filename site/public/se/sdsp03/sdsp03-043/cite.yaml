abstract: "Ao investigar a arquitetura industrial paulistana nas duas primeiras décadas do século XX – inventariando as obras mais relevantes e buscando, sobre as mesmas, informações documentais em acervos públicos – deparamo-nos com a inesperada referência a Victor Dubugras como autor de um conjunto de armazéns no bairro da Mooca. Esta comunicação pretende analisar o projeto destes armazéns no contexto da obra de Victor Dubugras. O resgate deste projeto também deverá contribuir para a valorização da arquitetura industrial paulista e para a conscientização sobre a importância de sua preservação."
