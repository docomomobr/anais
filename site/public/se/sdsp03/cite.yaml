abstract: "Gregori Warchavchik, considerado o introdutor da arquitetura moderna no Brasil, produziu em seus primeiros anos de atuação neste país um conjunto de casas econômicas na rua Barão de Jaguara, na Mooca – tradicional bairro operário de São Paulo. Este tipo de construção, bastante comum na região, traz elementos da arquitetura moderna, mesclado com algumas resistências do “morar” nacional."
