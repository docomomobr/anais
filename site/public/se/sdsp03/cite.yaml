id: sdsp03-058
type: paper-conference
title: "Casa Modernista da Rua Santa Cruz: Gregori Warchavchik levantamento histórico com ênfase no período de seu tombamento (década de 80) até os dias atuais"
container-title: "3º Seminário Docomomo São Paulo, São Paulo, 2005"
event-title: "3º Seminário Docomomo São Paulo, São Paulo, 2005"
issued:
