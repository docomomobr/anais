id: sdsp03-026
type: paper-conference
title: "Destruição e descaracterização da Arquitetura Moderna em São José dos Campos"
container-title: "3º Seminário Docomomo São Paulo, São Paulo, 2005"
event-title: "3º Seminário Docomomo São Paulo, São Paulo, 2005"
issued:
  date-parts:
    - [2005, 8, 17]
language: pt-BR
abstract: "Preservar e conservar os patrimônios arquitetônicos, entre eles os exemplares da arquitetura moderna, é uma tarefa cada vez mais ardua diante da dinâmica e da estrutura sócio-econômica presentes nas cidades nos últimos anos. Este trabalho apresenta uma breve discussão desta atual situação e do desafio de preservar. Utilizando como objeto de estudo a cidade de São José dos Campos, que a partir do seu desenvolvimento econômico na década de 1950, houve um crescente interesse pela construção de obras modernas. Sendo possível identificar no tecido urbano uma quantidade considerável de obras com partido arquitetônico modernista, incluindo dois complexos importantes: o Centro Técnico Aeroespacial e a Tecelagem Parayba. Atualmente o que pode ser observado é uma perda contínua destes exemplares, principalmente dos residenciais. A ausência de iniciativas para a preservação e conservação destas edificações aliada à crescente valorização econômica, despertando o interesse pela especulação imobiliária, faz com que haja a total destruição e descaracterização das obras modernas. A pesquisa utiliza três exemplos de obras modernistas que sofreram algum tipo de intervenção de descaracterização e/ ou destruição. Sendo edificações que encontravam se em processo de preservação de instância municipal, estadual e federal. Diante dos acontecimentos e da dinâmica econômica atual, torna-se necessária a adoção de instrumentos que possibilitem a proteção e conservação dos patrimônios arquitetônicos."
keyword: "Arquitetura Moderna em São José dos Campos; preservação de patrimônios culturais; especulação imobiliária"
author:
