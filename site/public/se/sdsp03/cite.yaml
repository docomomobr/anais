language: pt-BR
abstract: "O presente artigo constituiu-se inicialmente numa reflexão sobre as possibilidades analítico-historiográficas do documento fotográfico do espaço urbano, considerando-se o grande potencial de informações implícitas à imagem. Tal reflexão visa subsidiar o embasamento para a compreensão do papel da fotografia na construção e fixação do conceito de modernidade, pretendido para a cidade de São Paulo como metrópole industrial representante do processo de transformações político-econômico advindo da crise de 1929 e a Revolução de 1930 no Brasil. Caráter relevante e pertinente do período compreendido entre as décadas de trinta e sessenta do século XX no Brasil, é a construção de uma estética arquitetônica nacional, pautada na produção européia do entre guerras, pelo novo estado e elites brasileiras. A cidade de São Paulo vai gradativamente adquirindo novas feições, aspecto de urbanidade norte-americana, verticalidade em expansão, sky-line emoldurando o contexto. São imagens deste momento, de fotógrafos diversos, que utilizaremos para demonstrarmos estas transformações da cidade e o estabelecimento dos novos paradigmas da modernidade."
keyword: "Modernidade paulistana; iconografia paulistana; fotografia paulistana"
