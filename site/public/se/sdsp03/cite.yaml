id: sdsp03-054
type: paper-conference
title: "Fé moderna: documentação preliminar sobre a Arquitetura Moderna em espaços religiosos no Estado de São Paulo"
container-title: "3º Seminário Docomomo São Paulo, São Paulo, 2005"
event-title: "3º Seminário Docomomo São Paulo, São Paulo, 2005"
issued:
  date-parts:
