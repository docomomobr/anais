id: sdsp03-039
type: paper-conference
title: "Arquitetura forense do Estado de São Paulo. Fórum do Município de Promissão: projeto de Vilanova Artigas e Carlos Cascaldi"
container-title: "3º Seminário Docomomo São Paulo, São Paulo, 2005"
event-title: "3º Seminário Docomomo São Paulo, São Paulo, 2005"
issued:
