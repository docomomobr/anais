id: sdsp03-007
type: paper-conference
title: "Do conceito de Centro Cívico ao projeto de paços municipais"
container-title: "3º Seminário Docomomo São Paulo, São Paulo, 2005"
event-title: "3º Seminário Docomomo São Paulo, São Paulo, 2005"
issued:
  date-parts:
    - [2005, 8, 17]
language: pt-BR
abstract: "O conceito de Centro Cívico pode ser definido como uma área da cidade onde estão reunidos, de acordo com um plano pré-concebido, os principais edifícios públicos. Constituirá, assim, um instrumento de determinação de uma unidade nacional, nos termos da administração pública, com base nos três poderes instituídos: Executivo, Legislativo e Judiciário, com suas atribuições e representação no âmbito municipal. Deverá então refletir o modo de organização pública e, no território da cidade, caracterizará o lugar e a representação dessa organização política; onde a idéia de reunião e composição entre seus elementos componentes dará ao centro cívico a sua característica mais fundamental. Trata-se de um estudo não só do ponto de vista da qualidade arquitetônica das edificações, como de sua relação com as comunidades regionais e locais às quais estão funcionalmente ligadas, com a estrutura pública administrativa e, finalmente, com a malha urbana da cidade. Na concepção do projeto, o Centro Cívico não foi considerado meramente como um conjunto de edifícios; foi tratado como centro de convergência da população, um centro destinado a atrair as pessoas e propiciar ambiente para o contato humano, a troca de idéias e as manifestações da vida em sociedade. Propõe, portanto, uma estrutura urbana moderna que articula as esferas políticas, cultural e cotidiana da vida pública"
keyword: "Centro Cívico; Paço Municipal; Planejamento urbano"
author:
  - family: "Zurron"
    given: "Denise Guedes"
