abstract: Este trabalho mostra o desenvolvimento de uma pesquisa que vem sendo conduzida
  por uma equipe de professores da Universidade Presbiteriana Mackenzie, com foco
  nos edifícios multifuncionais da cidade de São Paulo. Este interesse especial nessa
  tipologia específica – onde as áreas residenciais, comerciais e de serviços compartilham
  a mesma edificação – deve-se ao fato de que ela representa um novo paradigma do
  viver na cidade, trazido pela Revolução Industrial, que está sendo retomado em nossos
  dias também como solução para a revitalização e reocupação das áreas centrais das
  grandes cidades. O resultado deste trabalho será um website que pretende auxiliar
  a compreensão do desenvolvimento urbano de São Paulo e o significado deste tipo
  de edifício no contexto da cidade.
