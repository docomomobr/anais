abstract: Uma abordagem anatômica do problema da Unidade de Habitação implica diretamente
  em um ato de dissecação. Concentra-se aqui o interesse em conhecer-lhe o aspecto,
  a estrutura programática, a relação entre as partes e entre as partes e o todo.
  São apresentadas informações que pretendem subsidiar a reflexão sobre o procedimento
  projetual e de suas transformações no transcorrer do período de 1927 a 1972 na cidade
  de São Paulo.
