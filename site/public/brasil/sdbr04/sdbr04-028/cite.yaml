abstract: "Criado na década de 40, tendo como idealizadora e diretora a engenheira Carmen Portinho, o Departamento de Habitação Popular da Prefeitura do Distrito Federal - DHP - surgiu da necessidade de normatizar e interferir na cidade do Rio de Janeiro cujos problemas de crescimento desordenado aumentavam assustadoramente. As discussões sobre habitação popular já figuravam nos debates das elites intelectuais do Brasil desde inícios do século, mas é a partir do corte instaurado com a Revolução de 30 que o tema ganha força, e iniciam-se as realizações. Dentro do ideário trabalhista, caberia à habitação assegurar ao novo cidadão a moradia justa e merecida. Esta era tida como uma condição básica de reprodução da força de trabalho, como elemento de formação ideológica. O DHP foi responsável por idealizar e realizar algumas das mais significativas obras brasileiras no que se refere à habitação popular, tais como o Conjunto Residencial Mendes de Morais - o Pedregulho - e os Conjuntos Residenciais Paquetá, Vila Isabel e da Gávea, além de diversas moradias econômicas unifamiliares que se espalharam pelos subúrbios da cidade. Ainda que tenham sido apenas alguns dentre os conjuntos realizados no país, tornaram-se muito emblemáticos da relação entre modernismo e habitação econômica. Contou-se com uma equipe de ponta de arquitetos e engenheiros na produção arquitetônica modernista brasileira do período, como Affonso Eduardo Reidy, Francisco Bologna, Lygia Fernandes, Hélio Modesto, José Oswaldo Henriques, Nilza Mascarenhas, Gabriel Souza, Sidney Santos, Francisco Lopes e David Astracan, além de colaboradores como Roberto Burle Marx, Anísio Medeiros e Cândido Portinari. Seu papel era não só o de produzir as habitações, mas o de orientar a população carioca e o novo homem que a cada dia assumia novas posturas frente a um país que crescia economicamente e que se pretendia “do futuro”. O grupo do DHP toma para si este papel de reeducar as massas através da arquitetura, tal como vinha acontecendo em diversos países europeus, e implementa uma metodologia de atuação e desenvolvimento dos projetos que, para além da arquitetura, tinha a ambição de ajudar na transformação do país. A arquitetura era para o DHP o ponto final de um longo processo de elaboração de programas, seleção de candidatos e, posteriormente, do acompanhamento dos moradores em suas novas casas modernas, pois se julgava fundamental, e necessário, ensinar a população a “usar” tais casas. A historiografia da arquitetura nacional até recentemente pouco havia falado da produção habitacional. Os autores consagrados referem-se quase exclusivamente aos projetos de maior repercussão como os Conjuntos do Pedregulho e da Gávea, atribuídos com todo louvor a Affonso Eduardo Reidy, mas tais referências são feitas de forma isolada e desconectada de suas atribuições como funcionário da Prefeitura do então Distrito Federal. As referidas obras, por sua vez, não são vistas como sendo pertencentes a uma concepção maior de habitação e interligadas a um projeto nacional de modernização. Pretende-se com esta comunicação mostrar a experiência do DHP e suas formas de concepção e atuação no campo habitacional nacional."
