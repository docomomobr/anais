abstract: 'O trabalho parte da análise de três moradias projectadas pelo arquitecto
  paulista João Walter Toscano: as residências Jagle (1962), Carramenha (1964) e Toscano
  (1967). Estas casas, construídas na cidade de São Paulo, mostram o percurso deste
  arquitecto durante a década de 60 e a sua posição face às transformações que o conceito
  do habitar sofreu durante esse breve período. O tema é somente um pretexto para
  a discussão das abordagens que o Movimento Moderno introduziu, as modificações face
  aos modelos anteriores – designadamente as heranças do século XIX – , e sequente
  crítica de que foi alvo no momento de revisão dos seus postulados mais ortodoxos.
  Assim, a casa Jagle aproxima-se de um cumprimento mais escrupuloso do programa habitacional
  moderno; enquanto a Carramenha se situa numa integração das sensibilidades dos seus
  residentes/clientes, recuperando elementos arquitectónicos com valores mais próximos
  da tradição; e finalmente, a casa Toscano, que contempla já espaços funcionais que
  entretanto tinham sido recusados ou omitidos no discurso moderno. Ao longo destas
  três abordagens, a planta, interpretada como projecção abstracta do programa de
  necessidades, vai-se adaptando às formulações exigidas por uma alteração da sensibilidade
  que se adensa durante a década. A própria figuração da casa comunica essas inquietações,
  passando de uma abstracção compositiva dos seus elementos – ditados pela imposição
  dos cinco princípios – à expressão clara e inequívoca da função a que verdadeiramente
  correspondem. Esse processo é visível, por exemplo, no tratamento dado aos vãos,
  como janelas, que da sua definição longitudinal vão novamente aproximar-se da configuração
  tradicionalmente atribuída às janelas correntes. Todos estes ensinamentos são colhidos
  nos casos conhecidos da habitação plurifamiliar, já que nestes programas se manifestam
  com maior intensidade as preocupações dos arquitectos face à racionalização dos
  espaços e seu funcionamento, articulando-se com as técnicas construtivas, sempre
  num propósito de optimização de custos e meios. Paralelamente, o arquitecto Toscano
  inicia com estes projectos uma investigação sistemática sobre sistemas construtivos
  pré-fabricados que são testados ao longo das três casas, ainda que com recursos
  a métodos diferenciados. A sua pesquisa relaciona-se com a adequação programa funcional/técnicas
  de pré-fabricação. O objectivo seria o da experimentação com vista a um uso mais
  alargado a programas de maior escala, nomeadamente equipamentos públicos.'
