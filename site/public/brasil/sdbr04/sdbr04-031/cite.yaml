abstract: "Sigfrido Giedion, em seu livro Space, Time and Architecture: the growth of a new tradition , de 1941, afirma que, no projeto para Argel, \"Le Corbusier se baseia nos arranha-céus nos quais domina a linha orgânica dos \"Crescentes\" de Bath.\" Os Crescentes de Bath, Royal Crescent, de 1769 e o Lansdowne Crescent, de 1794, buscam a fusão dos edifícios com seu ambiente natural circundante, onde a natureza não está a serviço da arquitetura, e sim possuem, as duas - natureza e arquitetura -, a mesma importância. O Royal Crescent resulta numa suavidade ótica da ampla cortina elíptica que se utiliza do próprio declive do terreno como componente cênico do conjunto. O Lansdowne Crescent domina, com sua longa e serial serpentina, as alturas de Bath. Para o Plano Obus (Argel, 1931), Le Corbusier adota a mesma filosofia, onde natureza e arquitetura se complementam e se respeitam. As curvas projetadas em Argel, como em Bath, estão adaptadas aos acidentes do terreno, ainda que as variações de nível sejam mais exageradas que as que existem no traçado da cidade inglesa. Mas, anterior a Argel, o projeto de Le Corbusier para o Rio de Janeiro, de 1929, também apresenta uma proposta de um edifício-viaduto que, tendo o mar a frente e a mata atlântica ao fundo, se apóia nas curvas de nível e se desenvolve paralela a linha da baía de Guanabara. A proposta de Le Corbusier compõe-se de uma auto-estrada, localizada a 100m do solo, que atravessa a cidade, saltando obstáculos, contornando barreiras ou rompendo bloqueios. Na proposta são resolvidos os problemas de circulação, e também de habitação, com a criação de edifícios onde são projetadas habitações até 30m sobre o solo, sob a auto-estrada. Sendo o Plano Obus, para Argel, uma re-elaboração do projeto apresentado para o Rio de Janeiro, nos perguntamos se as referências históricas à forma urbana seriam as mesmas, ou seja, se a base do projeto do edifício-viaduto carioca, que segue a linha sinuosa das montanhas e se apóia na topografia, pode ser encontrada em Bath, principalmente no Lansdowne Crescent. A proposta deste texto é discutir a proposta de Le Corbusier para o Rio de Janeiro como uma forma moderna de criação de novos espaços na cidade que tem a história como base, fazendo uma releitura da forma urbana dos crescentes de Bath. GIEDION, Sigfrido. Espacio, Tiempo y arquitectura (el futuro de una nueva tradición) 2 ed. Barcelona: Hoepli, 1958, p. 161."
