abstract: 'Nos anos vinte, nas capitais da região SE, São Paulo, Rio de Janeiro, Belo
  Horizonte e Vitória (e também Recife, no NE), são modificadas as regras municipais
  quanto à construção dos edifícios, vigentes desde o final do século XIX. Os "Códigos
  de Obras", como vulgarmente foram denominados, trazem mudanças de critérios quanto
  a aspectos como altura dos edifícios, ocupação dos lotes, áreas de iluminação e
  ventilação, ou seja, no que denominamos potencial edilício (edificabilidade), e
  também quanto à utilização dos novos materiais, técnicas construtivas (concreto
  armado) e equipamentos, como o elevador mecânico. Estabelecem também a divisão das
  cidades em zonas diferenciadas quanto ao uso e o tipo de edifícios, e ainda exigências
  para os loteamentos, lançando o início de uma legislação de parcelamento.

  Este trabalho procura demonstrar que essas e outras modificações constituem uma
  ruptura em relação à regulamentação anterior e que, compreendidas como um fenômeno
  de escala nacional, trazem em seu cerne novos fundamentos teórico-metodológicos
  e novas técnicas de intervenção no ambiente construído da cidade, configurando a
  representação do espaço (no sentido proposto por Henri Lefebvre) que caracterizará
  a produção do espaço das grandes cidades brasileiras nas cinco décadas seguintes,
  com permanências ainda atuais.

  Esses regulamentos têm referências distintas e combinadas: o modelo norte-americano
  do Building Code (NY, 1916), e o urbanismo francês, do pós-1ª Guerra, enraizado
  na tradição urbana europeia do classicismo barroco. Constituem uma síntese antropofágica,
  embora não destituída de contradições.'
