abstract: Em 1952 quando é inaugurado o Conjunto Residencial de Paquetá, construído
  pela prefeitura do Rio de Janeiro através do Departamento de Habitação Popular (DHP)
  o debate sobre o habitar popular estava na ordem do dia. O grupo de arquitetos e
  engenheiros ligados às convicções modernas consegue um valioso espaço institucional
  assumindo a partir de 1946 o DHP da referida prefeitura. Sob a direção de Carmen
  Portinho, o grupo do DHP opta por uma arquitetura de massa que fosse capaz de dar
  a aclamada “solução definitiva” à crônica crise habitacional. No Conjunto Residencial
  de Paquetá de Francisco Bolonha, construído na ilha de mesmo nome, o projeto, a
  construção e a posterior ocupação e acompanhamento dos moradores em suas “casas
  modernas” são emblemáticos da metodologia adotada e da forma de trabalho da equipe.
  Composto inicialmente por dois blocos de sobrados enfileirados de 27 casas ao todo,
  acrescido de um outro bloco curvilíneo não executado, representa a riqueza de proposições
  dentro do próprio DHP. O Conjunto de Paquetá, de escala reduzida se comparado aos
  demais conjuntos do DHP é um exemplar estudo de caso da realização habitacional
  do pós- 1945, de suas múltiplas possibilidades arquitetônicas, urbanísticas e paisagísticas.
keyword: Paquetá; habitação popular; DHP
