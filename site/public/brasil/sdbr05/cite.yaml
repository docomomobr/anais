abstract: "Os documentos contidos nos acervos da construtora Azevedo Moura \u0026 Gertum e do fotógrafo João Alberto, doados à Faculdade de Arquitetura e Urbanismo Ritter dos Reis, registram importantes manifestações da modernidade no Rio Grande do Sul, entre as décadas de 1920 e 1980. Ao longo de cinco décadas, João Alberto documentou grande parte da produção de renomados arquitetos gaúchos, tais como Carlos Alberto de Holanda Mendonça, Ari Mazini Canarin, Irineu Breittman, Edgar Albuquerque Graeff, Claudio Luiz Araújo e Carlos Maximiliano Fayet, entre outros. Em trabalho conjunto com arquitetos, João Alberto busca determinados pontos de vistas e certos efeitos de luz para captar a imagem desejada. Suas fotografias, assim como toda a cultura visual de sua época, foram influenciadas pelo neo-realismo italiano. Elas são um poderoso instrumento no sentido de interpretar o objeto retratado, pois vibram no mesmo diapasão das intenções nele contidas. Fundada em 1924, pelos engenheiros Fernando de Azevedo Moura e Oscar Mostardeiro Gertum, a construtora AMG foi a responsável pela execução de reconhecidas obras de Porto Alegre, algumas delas hoje identificadas como patrimônio arquitetônico da cidade: o Hipódromo do Cristal, os edifícios Guaspari, Imperial, Jaguaribe, Esplanada e Sulacap. Na construtora AMG trabalharam, em determinados períodos, Fernando Corona e Egon Weindorfer. Outros, como Cláudio Araújo e Arnaldo Gladosch tiveram seus projetos executadas pela mesma. Além de conter um vasto registro gráfico, este acervo contém também o registro fotográfico de execução de muitas obras. Imagens de diferentes momentos, nas quais se procura exaltar a técnica e o sentido da construção no projeto, tão caros para a modernidade. A partir de dez exemplos selecionados, pretende-se demonstrar o quanto estes acervos se completam e são capazes de ilustrar, na passagem do tempo, as transformações pelas quais passou a arquitetura moderna em Porto Alegre. A ingenuidade, em ambos os casos, inexiste. Ler nas entrelinhas é um exercício que revela, aos poucos, o sentido daquele moderno, sentido que se faz claro na medida da elaboração de uma investigação criteriosa."
