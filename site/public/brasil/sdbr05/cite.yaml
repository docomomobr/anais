language: pt-BR
abstract: "Na produção pernambucana (1945-1970) os principais protagonistas que atuam em Pernambuco a partir de 1951 são os arquitetos Acácio Gil Borsoi (formado em 1949 na FNA) e Delfim Fernandes Amorim (português, formado na Escola do Porto, em 1947). Ambos ensinam na Escola de Belas Artes de Pernambuco e são responsáveis pela formação dos jovens arquitetos que vão atuar nas principais capitais do Nordeste. Nos anos 50, Borsoi influenciado pelos mestres cariocas (Oscar Niemeyer e Lúcio Costa), é o principal expoente em Pernambuco desta linguagem. Delfim Fernandes Amorim, tendo emigrado ainda sob a égide tardia do racionalismo moderno de origem corbusieriana é influenciado pela Arquitetura Moderna Brasileira. Borsoi e Amorim, em meados dos anos 50, buscam relações mais estreitas com o meio e a cultura locais. Amorim incute nos jovens arquitetos preocupações com a integração ao meio, humanismo, entre outros aspectos de valorização da cultura tradicional do período colonial, reflexo das preocupações do pós-guerra. Os modelos são próximos à arquitetura do período colonial. No final da década, os mestres tomam caminhos distintos e individuais: Acácio Gil Borsoi envereda por expressões brutalistas adequadas ao clima tropical e aos materiais regionais; ao passo que Delfim Amorim desenvolve um verdadeiro tipo de casas unifamiliares com telhados em laje de concreto pouco inclinadas cobertas com telhas cerâmicas (SILVA, 1994). As obras representativas da produção local são manifestações de regionalismos locais e objetos de interesse no panorama do patrimônio nacional? Que critérios utilizar para selecionar o que preservar? 1) as produções regionais semelhanças aos modelos paradigmáticos da Arquitetura Moderna Brasileira ou, 2) as especificidades regionais e contribuições individuais que atestam a riqueza e diversidade da cultura brasileira?"
keyword: "arquitetura moderna brasileira, arquitetura moderna pernambucana; arquitetura e identidade regional"
