abstract: "A arquitetura moderna firmada no Brasil pós Segunda Guerra, centrada no modernismo carioca e paulista, incorporou o ideal de modernização do país e contribuiu para uma identidade nacional. Na área escolar, a arquitetura moderna se destacou no Estado de São Paulo como parte de um sistema, o fenômeno dos três “S”. Assim, este trabalho aponta para pioneiras escolas modernas no SENAI e respectivos idealizadores. Paralelamente ao SESC-SENAC, foram concebidas como instrumentos pedagógicos ao ensino profissionalizante, proporcionado um caráter arrojado à imagem destes serviços educacionais. Como exemplos são apresentadas três escolas SENAI: João Martins Coube em Bauru, de Roberto José Goulart Tibau, Anchieta na Vila Mariana e Têxtil Central no Brás, ambas em São Paulo, de Hélio de Queiroz Duarte e Ernest Robert de Carvalho Mange. O SENAI é apresentado em suas principais características pedagógicas implantadas na década de 50. Os objetivos atingidos pela nova arquitetura deixaram marcas que ainda perduram em edifícios nos quais o como ensinar estava intimamente ligado ao como projetar. São relevantes identidades culturais no patrimônio histórico do Brasil fundamentadas em princípios necessários à atualidade."
