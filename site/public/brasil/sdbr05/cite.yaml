abstract: "O trabalho analisa o projeto do arquiteto uruguaio Román Fresnedo, visto como fecho de uma série que inclui o hipódromo carioca da Gávea, o San Isidro argentino, o hipódromo paulista de Cidade Jardim, o hipódromo montevideano de Maroñas e o hipódromo madrileno de La Zarzuela. O trabalho salienta a integração inovativa entre o complexo esportivo e a vila hípica, exemplo de projeto de setor urbano moderno. Ao mesmo tempo, destaca a integração das lajes planas em balanço, da cobertura de concreto protendido contrabalançada por tirantes de aço e da vedação envidraçada, exemplo de edifício tribuna moderno. O Hipódromo do bairro do Cristal se faz um Hipódromo de Cristal e a atualidade do empreendimento não inibe as conexões apropriadas com a paisagem porto-alegrense e a cultura brasileira."
