language: pt-BR
abstract: "Em meados do século XX a cidade de São Paulo experimentou, além de intenso crescimento e industrialização, radical reestruturação urbana, com a implantação de uma nova estrutura viária e amplas transformações no ambiente construído, com destaque para a verticalização intensiva da área central. Nas décadas de 1930 e 1940, quando se inauguravam as propostas modernistas no país, construíram-se edifícios pioneiros em termos de sistema construtivo, tipologia e linguagem. Tal verticalização, antes restrita ao uso terciário e ao centro histórico, atingiu bairros circunvizinhos como Higienópolis, num momento em que dispositivos legais preconizavam edifícios residenciais com recuos frontais e áreas livres no terreno, assegurando insolação e ventilação aos apartamentos. O Edifício Louveira, projetado por Vilanova Artigas, inovou ao trazer à cidade avanços da Arquitetura Moderna Brasileira, interpretando ensinamentos corbusianos e da “escola carioca”, bem como ao contribuir com ousada intervenção urbana, ao implantar entre dois blocos paralelos um espaço semi-público como local de convívio e prolongamento da praça lindeira. Os blocos possuem sete e oito andares, singularmente implantados em um terreno de esquina. Em vez de ter sua fachada principal voltada para a entrada, acompanham o alinhamento da rua lateral, com esguias empenas cegas voltadas para a Praça Vilaboim; entre eles surge um pátio ajardinado cortado por rampa curva, servindo como acesso e \"praça\" interna. Tombado e bem conservado, destaca-se ainda hoje, por sua inserção cuidadosa e diálogo com o entorno, como exemplo da contribuição possível do nosso acervo de arquitetura moderna na requalificação da cidade."
