abstract: Este ensaio tem como principal objetivo promover a discussão de um aspecto
  da arquitetura moderna (brasileira) totalmente negligenciado. Como notou Edwin Heathcote,
  é sintomático da inabilidade contemporânea para enfrentar a morte que o tema da
  arquitetura funerária tenha sido amplamente ignorado. Não obstante, como ponto de
  partida tanto quanto aproximação metodológica consciente, o texto estrutura- se
  em “shortcuts” e/ ou “close readings” de túmulos projetados por arquitetos modernos
  (brasileiros) como Rino Levi e Lina Bo Bardi, com uma adenda sobre a ideologia do
  “planejamento funerário”.
keyword: arquitetura moderna; morte; arquitetura funerária
