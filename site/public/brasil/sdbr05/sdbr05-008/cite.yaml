abstract: "Produto de um momento de desenvolvimento acelerado da indústria imobiliária, no qual a verticalização na área central da cidade era incentivada pela Administração Municipal, o edifício CBI-Esplanada, datado de 1946, foi empreendido por um grupo de investidores nacionais e imigrantes poloneses que escolheu como responsável pelo projeto o arquiteto Lucjan Korngold. Formado em Varsóvia, testemunha e partícipe das experimentações no campo da arquitetura do entre guerras, Korngold chegou ao país em 1940, refugiado do fascismo, com seu nome reconhecido entre os arquitetos modernos poloneses e uma maturidade profissional com a qual pode enfrentar os desafios de uma proposta inovadora como a do edifício CBI- Esplanada. O edifício que ora analisamos, não somente rompeu com a escala e o vocabulário historicista do entorno como inseriu-se no movimento da arquitetura moderna do pós guerra, seja pelo partido escolhido e linguagem formal, onde destaca-se o diálogo do vocabulário do estilo internacional com a arquitetura carioca, como pela ênfase nos aspectos tecnológicos e funcionalistas, soluções que a escala incomum de seu programa exigiu. O CBI-Esplanada, dessa maneira, acabou por tornar-se importante referencial para a aprovação de outros projetos modernos que viriam a ser implantados no centro da cidade nos anos seguintes."
keyword: "arquitetura moderna; verticalização; imigrantes; São Paulo"
