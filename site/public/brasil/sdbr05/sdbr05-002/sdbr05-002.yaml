abstract: 'A partir da vivência em um alojamento estudantil universitário durante
  o curso de arquitetura, desperta-se o interesse para outros projetos de moradia
  estudantil no Brasil e no Exterior. Assim, partindo das percepções da Casa do Estudante
  da Universidade de Brasília, busca-se a compreensão da história do Alojamento Estudantil
  na UnB, onde fatos, relatos e depoimentos mostram o quão cercado de fortes marcos
  políticos, ideológicos, econômicos e sociais esteve envolvida a inserção e localização
  da moradia estudantil daquela universidade. Para tanto se aborda questões de implantação
  do próprio campus da UnB, hoje campus Darcy Ribeiro. Tendo aprofundado essa questão,
  escolhe-se, dentre aqueles edifícios de mesma finalidade, alguns exemplos representativos
  do período moderno da arquitetura, tanto no âmbito nacional quanto internacional,
  que poderiam auxiliar no levantamento de subsídios necessários para uma análise
  comparativa, levando em consideração todas as variáveis de projeto até a conclusão
  dos mesmos. Após a aplicação de uma pesquisa qualitativa e exploratória, que envolveu
  entrevista a moradores de diversos alojamentos e também a arquitetos que projetaram
  alguns dos edifícios escolhidos, além de uma pesquisa bibliográfica sobre o assunto,
  conclui-se que os programas de necessidades de projetos dessa natureza devem avançar
  em três pilares: Convívio social, promovendo a necessária integração dos moradores;
  Serviço, prevendo a estrutura para atividades domésticas e Espaços específicos,
  prevendo a implantação de laboratórios, estúdios e ateliês que supram as necessidades
  extra-classe dos moradores.'
keyword: Alojamento estudantil; Universidade; Brasília; Modernismo
