abstract: Para compreensão da totalidade da obra (casas unifamiliares, conjuntos habitacionais,
  mobiliário, bairros, edifícios e Igrejas) do arquiteto português Fernando Ferreira
  de Pinho (1950-1990), foi necessário ultrapassar a distância temporal-territorial
  e concentrar a atenção sobre alguns temas com os quais ele se debate com empenho
  e continuidade. Seja no Porto, em São Paulo ou nas cidades "pioneiras" do oeste,
  à frente da construtora Martha & Pinho Ltda, ocupa-se do projeto 'a sua execução
  final, oscilando entre experimentação tecnológica e processo superado de características
  compositivas. Sua obra, ao mesmo tempo que o distancia da arquitetura compromissada
  com uma brasilidade, proveniente de Artigas ou de Niemeyer, filia-se aos princípios
  heróicos de uma modernidade do qual Rino Levi, em São Paulo, desponta como seu maior
  intérprete. Entretanto, se a seqüência das obras de Fernando Pinho delineia uma
  cidade nos cânones do estilo internacional, afirmada pela abstração técnica, ao
  remontarmos o momento histórico em que floresce sua obra, afirma-se uma nova estrutura
  urbana na cidade de Bauru. Esta, respaldada pelas condições políticas e organizacionais,
  que viriam consubstanciar uma nova lógica social, econômica e territorial para o
  país, priorizando as redes de transportes necessárias à articulação inter-regional,
  numa espécie de refundação rediscutindo os postulados fixados pela Carta de Atenas.
