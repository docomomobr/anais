abstract: "A arquitetura moderna em Curitiba desenvolveu-se durante os anos de 1950 a 1970 com exemplares significativos construídos pelo chamado Grupo do Paraná, equipes de arquitetos de destaque em premiações nacionais no período. Neste cenário o brutalismo arquitetônico implantou-se na capital paranaense e consolidou uma modernidade estampada na superfície envoltória de seus edifícios. A maior parte destes edifícios empregou o concreto bruto na tradição do movimento, com a textura lenhosa das formas registrando a manufatura da obra e impregnando rusticidade à sofisticação da forma. Este trato, porém, atinge um desenvolvimento mais apurado quando algumas obras adicionaram à plasticidade desta superfície composições artístico-decorativas elaboradas em baixos-relevos de temática abstrata. Tal plasticidade aproxima esta arquitetura de movimentos artísticos importantes como o neo-concretismo o que reforça o elo sempre almejado da arte com a arquitetura bem como retoma algumas premissas formais experimentadas durante o movimento art déco. Uma relação mais direta se estabelece entre este tipo de ornamentação e a produção do artista curitibano Poty Lazarotto que se destacou como muralista tendo executado uma série de obras em relevo de concreto. Esta linguagem bastante inusitada até então na cidade traz identidade própria aos edifícios indicando a criação de uma tipologia inédita que resgata a tradição do ornamento na superfície da caixa arquitetônica."
