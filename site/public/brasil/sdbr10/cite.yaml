DOI: "10.5281/zenodo.19074075"
ISBN: "978-85-60188-14-7"
page: "1-24"
URL: "https://zenodo.org/records/19074076/files/sdbr10-008.pdf"
language: pt-BR
abstract: "A ideia de Brutalismo em arquitetura está ligada à expressão dos materiais utilizados em seu estado natural. O que se espera desta arquitetura é que, através de sua apreciação, seja possível identificar os materiais que concretizam o projeto arquitetônico através da edificação. Os revestimentos são considerados como dissimuladores. A arquitetura brutalista demonstra os materiais utilizados, e a técnica que permite sua execução. Procura deixar bem claro o que é vedação ou estrutura. Não existe um critério seletivo do que deva ou não estar à vista. Tudo é aparente. Existe uma preocupação com a expressão dos materiais em detrimento de superfícies bem acabadas. A ideia de beleza é associada à verdade construtiva. A edificação deve ser honesta, demonstrando seus materiais assim como a técnica construtiva adotada. A polêmica sobre o Brutalismo, como uma tendência arquitetônica ligada à ética ou à estética, instigou autores como Banham, participante da formação do movimento. A difusão do movimento resultou em posturas diferenciadas: para alguns foi uma arquitetura com considerações principalmente éticas e para outros de cunho estéticas. Segundo Bruno Zevi, foi uma ética para os que pretendiam restaurar a integridade originária e agressiva do movimento moderno, e uma estética para quem buscasse um enriquecimento de superfícies e volumes. Na Inglaterra, nos primeiros anos da década de 50, surge em torno do casal Smithson um movimento crítico de uma vanguarda ligada à arte e a arquitetura, contra o que consideravam ser uma acomodação do Movimento Moderno. Em 1955 Reyner Banham referiu-se a esta iniciativa num artigo para a revista Architectural Review ao referenciá-lo como Novo Brutalismo Inglês. Posteriormente, na publicação The New Brutalism de 1966, Banham discorre sobre o Brutalismo dividindo-se entre atributos éticos e estéticos à produção dos Smithson. No Brasil, o Brutalismo Paulista foi uma arquitetura extremamente marcada por um discurso ético, sendo este seu ponto de contato com Novo Brutalismo Inglês. A ideologia deste movimento paulista, preocupado com questões sociais e com a \"verdade dos materiais\", tem a mesma postura ética da arquitetura inglesa que teve nos Smithson seus maiores defensores. Por outro lado, a influência formal está vinculada a Le Corbusier: ao concreto bruto aplicado aos prismas puros, e à busca da univolumetria utilizados pelo arquiteto franco-suíço. Influenciado por correntes estrangeiras, o brutalismo adquiriu características próprias no Brasil. Pelas semelhanças que manteve com suas origens é possível identificá-las. Pelas diferenças que desenvolveu conseguiu autonomia e afirmação. O desenvolvimento do trabalho está centrado num questionamento sobre princípios éticos e/ou estéticos presentes no Brutalismo Paulista, considerando os preceitos da doutrina moderna onde uma opção puramente estética seria inconsequente."
keyword: "Brutalismo; Concreto Bruto; Escola Paulista"
