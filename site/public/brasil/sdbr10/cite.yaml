abstract: "o requinte do monolito Com a instalação do Campus da Universidade Federal de Santa Catarina, em 1960, e da sede das Centrais Elétricas do Sul do Brasil, ELETROSUL, em 1978, houve significativo avanço espacial urbano, social e econômico em Florianópolis. Estas duas instituições federais localizadas em áreas vizinhas, no bairro Pantanal, impulsionaram a expansão desta área, então periférica ao centro fundacional. Nesse processo, no entorno, instalam-se no bairro do Itacorubi, as sedes de outras instituições estaduais com suas significativas edificações (TELESC em 1976, CREA-SC em 1978 e CELESC em 1988). A consequente vinda e atuação de profissionais de outros estados brasileiros para Florianópolis, introduziu a modernização tecnológica e novos parâmetros construtivos e arquitetônicos, vinculados então aos padrões nacionais e internacionais vigentes. Edificações e espaços urbanos que configuram hoje um patrimônio documental na paisagem da cidade. O edifício sede da ELETROSUL, de autoria de Luís Forte Netto e Orlando Busarello, foi o projeto vencedor do concurso público, realizado em 1975 e inaugurado em 1978. Concebido a partir de um volume externo maciço de concreto armado aparente, possui as fachadas protegidas em parte por brises metálicos horizontais e implanta-se sobre um patamar elevado que evidencia e monumentaliza a robusta horizontalidade do prisma quadrangular que se eleva do solo. O partido adota como elemento principal a distribuição dos acessos e do programa a partir de um hall central que permite a convivência e contato visual de seus pavimentos, conectando-os por quatro conjuntos de escadas e elevadores. Este grande vão é iluminado por uma cobertura modulada de treliça de alumínio, fechada por domos de vidro translúcido. A modulação da estrutura de pilares permite liberdade para a disposição dos diferentes espaços. O cuidado com a execução das peças em concreto e estruturas metálicas foi determinante para a qualidade final da obra, demonstrando que o domínio técnico foi preponderante na elaboração e especificação do projeto. Este fato, associado à permanente manutenção, proporcionou a preservação do edifício, mantendo a qualidade dos materiais construtivos originais, mesmo com algumas alterações e complementações realizadas ao longo do tempo. Inserida no contexto tardio das obras brutalistas brasileiras, o edifício da ELETROSUL enquadra-se como exemplar significativo de solução tipológica adequada ao contexto regional do uso do concreto aparente, construindo uma linguagem projetual que explora as vantagens da plasticidade do concreto em sua rigidez e aparência, para obter a expressão plástica monolítica associada ao requinte do acabamento e da qualidade dos espaços resultantes."
