abstract: "O arquiteto paulista Carlos Barjas Millan fez parte da primeira geração de arquitetos formados em escolas de arquitetura de São Paulo. Sua vida foi curta (1927-1964), abreviada por um trágico acidente de automóvel aos 37 anos de idade. Sua produção, entretanto, foi intensa durante 15 anos de atuação nas décadas de 1950 e 60 e repercute até hoje no panorama da arquitetura moderna brasileira. Formado na Universidade Mackenzie, atuou em entidades de classe como IAB e CREA; teve carreira docente na Mackenzie e na USP; foi sócio de uma loja de móveis contemporâneos; atuou politicamente junto à igreja dominicana; e, acima de tudo, dedicou-se intensamente à prática de arquitetura, com uma produção de aproximadamente 70 projetos, construídos ou não. A grande maioria foi de casas unifamiliares, dos mais diferentes tipos – isoladas, conjugadas, reformadas, urbanas ou não –, para vários tipos de clientes, em diferentes tipos de lotes, projetadas em parceria ou individualmente, muitas delas reconhecidas ainda hoje por seu valor arquitetônico. Após sua morte, o arquivo de seus projetos foi doado à biblioteca da FAU-USP. Mas, talvez pela brevidade de sua existência, pouco foi produzido e publicado sobre sua obra. Podem ser citados como relevantes: dois trabalhos acadêmicos de doutorado e mestrado (FAGGIN, 1992 e MATERA, 2005); publicações em revistas Acrópole (números 317 e 332) e AU (número 54); algumas publicações sobre obras paulistas que incluem casas de sua autoria (ACAYABA, 2011; XAVIER; LEMOS; CORONA, 1983); alguns textos disponíveis na internet (CAMARGO, 2013), etc.; afora farto material relativo ao Brutalismo Paulista (ZEIN, SANVITTO, ACAYABA, FUÃO, etc.). As casas mais conhecidas e publicadas são três: Roberto Millan (1960), premiada na IV Bienal de São Paulo; Nadyr de Oliveira (1960); e Antônio D’Elboux (1962-64). Todas se enquadram na fase final de sua breve carreira, quando sua arquitetura já apresentava com nitidez características de uma escola de arquitetos que se formava em São Paulo nos anos 50-60 e cuja produção ficou conhecida como Brutalismo Paulista. O arquiteto Vilanova Artigas, professor da FAU-USP, é considerado o principal mentor dessa escola. O objetivo deste trabalho é lançar um breve olhar sobre a produção residencial unifamiliar de Millan, desde suas origens nos anos 50, quando são propostas suas primeiras casas, até os anos 60, sua fase de maturidade. Em regra com telhados, beirais, plantas e volumes aditivos, as casas iniciais tinham influências de Wright, Neutra, Breuer e Rino Levi. Pelo final dos anos 50, com a Casa Oliva Feitosa (1957), observa-se uma transformação que se acentua nos anos 60, com o uso de coberturas planas e determinados materiais, técnicas e estratégias que passam a ser recorrentes. O foco do trabalho será sua produção unifamiliar dos anos 60, iniciada com a já citada casa para seu irmão, Roberto Millan, e encerrada com a casa na Praia da Lagoinha para Mario Masetti (1964). Essa série de casas pode ser enquadrada no Brutalismo Paulista, mas possui peculiaridades que são próprias de Carlos Millan, conhecido pelo alto nível de detalhamento de seus projetos. Além de arquitetos paulistas contemporâneos, entre eles Artigas, nesta fase Millan recebe influências de mestres internacionais, principalmente de Le Corbusier. As principais casas de Carlos Millan do período 1960-64 serão analisadas segundo aspectos formais e compositivos, considerando os seguintes critérios: volumetria, tipo de planta, base, coroamento, estrutura de suporte, elementos e materiais construtivos, sem perder de vista lote de implantação, programa de necessidades e influências constatadas. Pretende-se buscar certas regularidades e variantes dentro dos exemplos estudados, com base no material constante na bibliografia acima referida."
keyword: "Carlos Barjas Millan; Casas unifamiliares; Brutalismo Paulista"
