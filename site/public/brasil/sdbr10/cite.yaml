abstract: "A veintidós kilómetros de la ciudad de Valencia (España) desde 1970 está en uso un complejo educativo autosuficiente para cinco mil estudiantes en régimen de internado, sus profesores y el personal de mantenimiento. Este complejo educativo es conocido en la actualidad como Universidad Laboral de Cheste (Valencia) y el arquitecto que lo proyectó y dirigió su construcción fue Fernando Moreno Barberá (Ceuta, 1 1913- Madrid, 1998), bajo el mando de la dictadura franquista . Entendemos, consiguientemente, que para comprender y apoyar la preservación y revitalización de esta obra es también imprescindible poner en marcha una concertada revisión histórica sobre la segunda mitad del siglo XX, garantizando que su apreciación no se vea perjudicada por prejuicios y lugares-comunes de rasa profundidad, pero que se siguen adoptando genéricamente y de manera acrítica. Adoptamos como premisa que en los años 1955-1970, en la obra de Moreno Barberá, de muchos otros autores de su generación y en la mayor parte del mundo, surgen relevantes obras de sensibilidad brutalista - calificación esa a ser también revitalizada y revisada desde una mirada contemporánea, que sea crítica en relación a los mitos historiográficos, puestos en marcha por autores de mediados del siglo XX."
