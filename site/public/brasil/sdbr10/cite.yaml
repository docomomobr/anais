abstract: "A década ampliada de 1960 é o momento em que a consolidação da tecnologia construtiva do concreto armado possibilita a produção de obras grande impacto nas cidades brasileiras. Duas empresas construtoras se destacam nesse processo, a Companhia Construtora Nacional, que tem origens na construtora alemã Wayss \u0026 Freytag, e a dinamarquesa Christiani \u0026 Nielsen, como as únicas altamente especializadas na tecnologia construtiva do concreto armado. Apenas as duas foram habilitadas para a construção do edifício do Congresso Nacional, obra prima da interação da criatividade do arquiteto Oscar Niemeyer e da engenhosidade do cálculo estrutural de Joaquim Cardozo. Ambas, participaram das iniciativas em prol da racionalização da construção empreendidas nos edifícios do campus da Universidade de Brasília e na fabricação de habitações. Contudo, as bases de constituição da cultura técnica da tecnologia construtiva do concreto armado no Brasil são traçadas desde o início do século XX, quando essas empresas construtoras começam a introduzir o concreto armado fazendo obras, primeiro de edificações industriais e de infraestrutura urbana, possibilitando a modernização arquitetônica e urbana."
