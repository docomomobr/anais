URL: "https://zenodo.org/records/19074145/files/sdbr10-027.pdf"
language: pt-BR
abstract: "As décadas do pós-guerra foram marcadas, na cena internacional, por uma nova sensibilidade arquitetônica que advogava a exposição direta dos materiais e dos elementos tectônicos, o resgate de materiais tradicionais, a preferência por jogos de volumes mais dinâmicos e o uso extensivo do concreto, postura esta comumente chamada de Brutalismo. A partir de meados da década de 1960, os arquitetos que atuavam em Pernambuco passaram a utilizar aspectos dessa sensibilidade construtiva, influenciados tanto pela arquitetura internacional, particularmente pelos trabalhos de Breuer, Stirling, Rudolph e Le Corbusier, como pela arquitetura paulista, sem descartarem as heranças modernas locais desenvolvidas, particularmente por Delfim Amorim e por Acácio Borsoi, arquitetos que desde a década anterior tinham estabelecido as bases da arquitetura moderna local. A arquitetura produzida em Pernambuco entre 1965-1980 caracterizou-se pelo uso de materiais aparentes, particularmente o tijolo e o concreto; as reentrâncias, saliências e destaques volumétricos, e a exploração dos elementos construtivos e estruturais. Fazem parte desse universo, obras de Frank Svensson, Marcos Domingues, Reginaldo Esteves, Vital Pessoa de Melo, Sena Caldas \u0026 Polito e Maurício Castro, além, é claro, de trabalhos de Amorim e Borsoi. O trabalho procura demonstrar como essa nova sensibilidade construtiva se manifestou em Pernambuco por meio de dois aspectos: 1) as texturas e tratamento das superfícies e 2) a articulação e justaposição dos materiais. Em relação ao primeiro aspecto, o próprio Banham alertou que nesta arquitetura, os materiais eram empregados de forma bruta, ou seja, sem revestimentos ou demãos, uma qualidade também ressaltada por autores mais contemporâneos como Frampton ou Gregotti. Em Pernambuco, iremos enfocar a manipulação do tratamento do concreto exposto por parte dos arquitetos locais por meio de variadas texturas: com agregado exposto, rustificadas, onduladas, com grandes contrastes entre superfícies ásperas e lisas, que demonstram as enormes possibilidades expressivas do concreto. Em relação ao segundo aspecto, para Banham, a arquitetura brutalista adota uma postura ética no detalhamento dos materiais, pois valoriza e não esconde os detalhes gerados pela necessidade construtiva, posição próxima de autores mais recentes como Gregotti, Frascari e Hartoonian, que revalorizam o detalhe arquitetônico como uma manifestação do aspecto construtivo que, de acordo com eles, enriqueceria o significado da obra. Na arquitetura produzida em Pernambuco neste período, observa-se a ênfase no detalhe e o cuidado na justaposição de materiais, por meio de sutis encaixes em respaldos ou frisos. Os detalhes, muitas vezes, constituem pontos de encontro e de articulação de toda a construção e são elementos centrais na expressão projetual. Diante do enfoque deste artigo, fez-se válido considerar a abordagem tectônica, um instrumento de análise que se apoia na questão construtiva e encontra congruências com a arquitetura desse período em Pernambuco. A teoria da tectônica foi considerada por meio dos escritos de teóricos contemporâneos, como Frampton, Hartoonian, Frascari e Gregotti, assim como autores mais distantes que forneceram argumentos que estão na base da arquitetura moderna como John Ruskin e Adolf Loos."
keyword: "Justaposição e texturas de materiais; Brutalismo; Arquitetura de Pernambuco"
