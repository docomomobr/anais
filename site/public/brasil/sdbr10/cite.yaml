language: es
abstract: "La búsqueda de una valoración arquitectónica viene acompañada de un interés por la identidad, de un reconocimiento a las diferentes obras de la arquitectura como expresiones validadas en una comunidad, de momentos del espacio edilicio, materializados por los arquitectos en su desempeño como intérpretes de un conglomerado social y un contexto. Aunque en la historia escrita de la Arquitectura en Colombia se ha evaluado al Brutalismo en Medellín como una tendencia desafortunada, sus exponentes hacen parte de la identidad local que trasciende la comparación con otros desarrollos de ciudad. Este artículo pretende realizar una reflexión sobre ciertas obras que se consideran Brutalistas en Medellín, sobre su aporte cualitativo a la valoración del espacio arquitectónico y su influencia en la arquitectura actual; aproximándose al término Brutalista desde la misma dificultad de su definición en el contexto local. La producción y expresión concisa de la Arquitectura Brutalista en Medellín fue escasa pero valiosa, y como en otras ciudades latinoamericanas se definió a partir de la adopción de un tipo de lenguaje arquitectónico orientado a un discurso moral basado en la búsqueda de auténticos ideales modernos que se aplicaron en la nueva Arquitectura de una ciudad insistente en la idea de progreso. No es sorprendente que en Medellín el Brutalismo o Modernismo tardío no haya sido documentado, ya que además de su escasa aparición, referencias y estudio, la misma documentación de las obras del movimiento moderno en Colombia se ha realizado de forma amplia particularmente para la ciudad de Bogotá. Como referencias, la mayor parte de la producción Brutalista en Medellín apunta hacia un mismo Arquitecto, Laureano Forero Ochoa, quien trajo consigo las nuevas tendencias arquitectónicas “revolucionarias” luego de realizar sus estudios en Italia y el Reino Unido en la década del 60. Se recalcan estas aplicaciones que se realizaron en Medellín con el pleno apogeo de las nuevas tecnologías constructivas como aliciente en el diseño arquitectónico. Tanto el edificio de la Facultad de Arquitectura de la Universidad Nacional de Colombia, como el MiradorRestaurante del cerro Nutibara y la Capilla del Cementerio Campos de Paz son ejecuciones de la Arquitectura del Brutalismo en Medellín - Colombia y más allá de las consideraciones formales en ellas es evidente la monumentalidad ligada precisamente a su condición programática; edificios que fueron desarrollados para incursionar en la vida de la ciudad, casi inexistentes en ese momento, con al afán de expresar una intensión icónica, reclamando un espacio en el imaginario local y un peso en la identidad y el simbolismo citadino."
keyword: "Brutalismo; Identidad"
author:
  - family: "Vélez Santamaría"
    given: "David"
