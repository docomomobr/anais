abstract: "Na década de 1950, após estagiar seis meses no ateliê de Le Corbusier em Paris, o arquiteto mexicano Teodoro González de León retornou a seu país para desenvolver uma intensa atividade profissional – primeiramente em parceria com Armando Franco, e posteriormente com Abraham Zabludovsky – que acontece até hoje. A sua obra das décadas de 1950 a 1970 caracterizou-se pela apropriação de uma série de estratégias projetuais, reconhecidas pelo próprio arquiteto mexicano como típicas de uma arquitetura brutalista. O termo, adotado por González de León a partir de uma anedota na sua visita ao canteiro da Unidade de Habitação de Marselha – narrada por ele em vários artigos e entrevistas –, descreve um conjunto de lições formais, espaciais e técnicas decorrentes de sua experiência na construção de três projetos-chave na mudança de rumo no trabalho do mestre franco-suíço: a Unité d'Habitation de Marselha (1945-1952), a Usina Claude et Duval em Saint Dié (1948) e o próprio apartamento de Le Corbusier no Immeuble Molitor (1948). Este trabalho propõe-se apresentar as transformações do legado corbusiano na obra de González de León, necessárias para materializar uma de suas principais pretensões criativas: a recuperação do sentido de monumentalidade do objeto arquitetônico, característico das culturas pré-hispânicas, assentadas previamente na América Central e cuja perda, na arquitetura ocidental, foi uma das premissas do primeiro Movimento Moderno."
keyword: "Arquitetura moderna mexicana; influência corbusiana; Novo Brutalismo"
