language: pt-BR
abstract: "O florescimento do brutalismo como movimento arquitetônico de abrangência mundial, cujas origens remontam ao imediato pós-segunda guerra, decorreu, no Brasil, mais precisamente em São Paulo, da feliz coincidência de vários fatores que deu oportunidade à produção de um grupo de profissionais paulistas de grande talento, consagrando-os no panorama nacional e cujas obras se tornaram referências da história da arquitetura brasileira, contribuindo enormemente para a difusão da arquitetura moderna pelo Estado, com repercussão em todo o país. A partir da crítica inferencial de BAXANDALL e da arquitetura como documento histórico, queremos promover a leitura de um conjunto de obras contratadas pelo governo do Estado de São Paulo entre 1959 e 1963, de incontestável contribuição ao brutalismo no Brasil, buscando identificar a rede de relações que as viabilizou e que delas se estabeleceu. Considerando que alguns dos projetos paradigmáticos desse movimento: a sede da Faculdade de Arquitetura e Urbanismo da Universidade de São Paulo e os projetos do setor das Humanas, as escolas de Itanhaém e Guarulhos, os fóruns de Araras, Itapira revolucionaram os padrões funcionais, técnicos e estéticos de seu tempo, analisá-los, a partir do tripé - arquitetura, cultura e sociedade - identificando as condições que os tornaram possíveis, é a questão que nos interessa hoje, tendo em vista o conservadorismo que permeia a mentalidade atual, apesar do contexto socio-político e econômico aparentemente favorável. Para além da capacidade inventiva de alguns dos autores dos projetos em análise e de sua perspicácia em compreender as intenções de seu tempo, uma imbricada rede de conexões entre campos e agentes diversos foi determinante para a contratação e realização dessas obras, sendo o Plano de Ação do Governo Carvalho Pinto 1959-1963 - PAGE um dos mais significativos. Com referências teóricas no movimento Economia e Humanismo do Padre Lebret e com inspiração política no Plano de Metas do presidente Juscelino Kubitscheck, que teve na construção da nova capital a mais forte imagem do seu compromisso com a modernização do país, o PAGE propôs a modernização do estado, buscando equilibrar o desenvolvimento do interior com a região metropolitana, com a arquitetura como parte do planejamento estratégico. Responsável pela contratação de mais de mil projetos, centenas deles com arquitetos externos ao serviço público, através de um inédito e polêmico acordo do Instituto dos Arquitetos do Brasil - IABSP, o PAGE contribuiu à mudança de paradigma da arquitetura. Embora nem os arquitetos, com raras exceções, ao comentar essas obras enfatizem essa relação, tampouco os historiadores as associam como um conjunto de obras públicas, destacando quase sempre a contribuição de cada uma delas como se tivessem sido concebidas independentemente, reconhecer as imbricadas conexões entre elas e o contexto político, social e econômico de sua época é delinear a dimensão de seu significado histórico. Somente a partir da última década, algumas pesquisas acadêmicas têm se dedicado ao inventário de parte desse amplo conjunto, estabelecendo novas conexões, dos quais destacamos ALVES (2009) sobre as escolas; de BUZZAR orientando alguns trabalhos no grupo de pesquisa ArtArqBR, dos quais se destaca o trabalho de CORDIDO (2007) sobre os fóruns; de CABRAL (2005) um doutorado sobre a construção da cidade Universitária, no qual analisa a contribuição desse Plano de Ação, e da pesquisa de CAMARGO, no âmbito do Centro de Referência da Cultura Arquitetônica Paulista, com resultados parciais inseridos nas trajetórias dos vários profissionais envolvidos, aos quais tem se dedicado: Bratke, Penteado, Guedes, Millan, Botti\u0026Rubin. Ampliar e relacionar as fontes de referência bibliográfica: estudos panorâmicos sobre o período; trabalhos específicos sobre o brutalismo e/ou sobre os arquitetos envolvidos; periódicos, relatórios e mensagens do governo; atas do IAB confrontando-as com os levantamentos documentais parte do inventário já disponível constitui uma etapa fundamental do processo de leitura dessas obras e da sua contribuição à difusão do brutalismo no Brasil, que este trabalho pretende expor."
keyword: "Arquitetura Moderna; Brutalismo; Plano de Ação do Governo Carvalho Pinto"
