abstract: "“A rigor, o arquiteto, quando está preparado para o projeto de edifícios ou conjunto de edifícios, se defronta também, implícita ou explicitamente com o problema da correlação urbanística” . O projeto do antigo Banco do Estado da Guanabara (BEG), de 1963 construído em 1965 pela Companhia Construtora Nacional, marca um momento significativo na trajetória do arquiteto Henrique Ephim Mindlin (1911-1971). Realizado em colaboração com Giancarlo Palanti (1906-77), Walter L. Morrison (1926), Walmyr Lima Amaral (1931) e Marc D. Fondoukas, (1913-83) exigiu da equipe uma abordagem inovadora para as demandas programáticas e questões técnicas. Henrique Mindlin, espécie de embaixador da arquitetura moderna brasileira no exterior, tornou-se mais conhecido pela sua publicação Arquitetura Modernano Brasil (1956), do que pela própria obra arquitetônica, a qual atribuiu à prática coletiva do escritório. Filho de judeus russos emigrados em fuga dos pogroms, Mindlin recebeu uma refinada educação, voltada para valores humanísticos e artísticos. Comunicava-se em sete idiomas, e teve ampla ação internacional, participando de diversas instituições. Sua associação com o italiano Palanti desde 1956, além do grego Fondoukas e do escocês Morrison traduz o caráter cosmopolita do grupo, e foi responsável por edifícios paradigmáticos do penúltimo quartel do século XX construídos na cidade do Rio de Janeiro. Este trabalho analisa o edifício do BEG procurando compreendê-lo à luz do diálogo que Henrique Mindlin e seus associados estabeleceram com o debate internacional arquitetônico. Para avaliação do processo reflexivo do grupo, a obra em questão será comparada com outras de diferentes épocas do escritório, a saber: Edifício Avenida Central (1957) e Edifício-sede do Jornal do Brasil (1966-1973). Na historiografia corrente, o edifício Avenida Central é frequentemente associado ao Estilo Internacional e à arquitetura de Mies van der Rohe, nos Estados Unidos. O edifício do BEG teve suas qualidades relacionadas ao New Brutalism inglês, e o Ed. Jornal do Brasil aprofunda as questões técnicas. Cada um dos três edifícios apresenta particularidades na relação com a cidade. A resposta às demandas programáticas, assim como as soluções técnicas propostas, sobretudo as estruturais, representam momentos de transformação da arquitetura moderna brasileira."
keyword: "Banco do Estado da Guanabara; Edifício avenida Central; Edifício-sede Jornal do Brasil"
