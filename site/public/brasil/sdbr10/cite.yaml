abstract: "e geometrias As abordagens correntes sobre as origens da arquitetura paulista brutalista se concentram em demonstrar duas posições distintas e polarizadas em torno das mudanças ou das continuidades ocorridas com a arquitetura moderna em São Paulo no início dos anos 60. De um lado, está a ênfase no rompimento com a tradição de leveza e transparência, característicos da Escola brasileira de arquitetura moderna com base no Rio de Janeiro, mais conhecida como Escola carioca. Nesta abordagem, sublinha-se uma mutação notável em relação à arquitetura brasileira antecedente, associada a uma possível conexão internacional com as obras de Le Corbusier no período pós-guerra, pela preferência no emprego do concreto armado em estado bruto e, com as obras de Mies van der Rohe em sua fase norte-americana, pela substituição da pontuação colunar em busca de grandes vãos. Materialidades e geometrias são os principais rompimentos com a precedência brasileira e os principais vínculos com o cenário internacional. De outro lado, está a aceitação da continuidade à linha carioca, a partir da autocrítica de Oscar Niemeyer em 1958, como fator mais palpável para a concretização de uma arquitetura formalmente identificável como paulista. Em seu depoimento, Niemeyer declarava o seu interesse pelas soluções compactas e geométricas e pela eleição da estrutura como personagem principal, sem subordinação às imposições técnicas. Neste tipo de interpretação, as suas ideias e obras construídas nas mãos dos arquitetos paulistas se transformaram noutra arquitetura, sem perda da essência que a originou. Pode-se especular que tal transformação ocorreu a partir da forma dos elementos de arquitetura, ou seja, pilares, lajes e vedações. Quanto à essência original, é plausível a aceitação da mesma condição normativa dos edifícios do século vinte: o teto plano e os seus pontos de apoio. Portanto, se a arquitetura moderna brasileira da Escola carioca se fundamenta na estrutura tipo Dom-ino, esta permaneceria enquanto núcleo da arquitetura surgida em São Paulo, a despeito de variações na aparência dos seus elementos. O Palácio do Planalto (1958) de Oscar Niemeyer e o prédio da Faculdade de Arquitetura e Urbanismo da USP – FAU-USP (1961) de Vilanova Artigas são dois projetos que sintetizam estas duas vertentes da modernidade brasileira. Enquanto exemplos canônicos deste momento crucial de transformação, seu exame é revelador de aspectos variantes e invariantes, sob o enfoque da observação de um sistema arquitetônico em que Dom-ino é o cerne. A partir de tais exemplos, este artigo tem como objetivo analisar possíveis rupturas e continuidades da arquitetura considerada como cânone da arquitetura moderna brasileira, a partir de suas materialidades e geometrias. Consideram-se estes dois aspectos como cruciais para o entendimento da natureza dual do sistema, que se transforma a partir de pressões diversas, das quais se enfatiza neste artigo os aspectos construtivos e iconográficos. O entendimento dessas duas pressões, quando transpostas para as duas obras em questão, auxilia a derrubada de alguns mitos em torno do papel da estrutura e, consequentemente, da tecnologia da construção na arquitetura de Niemeyer em relação à Artigas. Debita-se ao último um apuro da técnica poucas vezes sublinhado ao primeiro, a partir de uma ênfase formal. A pesquisa pode permitir o reexame de tais discursos, a partir de uma investigação sobre a estrutura enquanto elemento-chave de um sistema arquitetônico em transformação, no qual a obtenção da leveza e das permeabilidades ou de seus opostos ocorre não apenas por mero capricho formal, mas por uma compreensão hábil e profunda de um sistema já entendido e expandido pela arquitetura moderna brasileira antecedente e que ecoa e se revalida em várias obras contemporâneas."
keyword: "Arquitetura Moderna Brasileira; arquitetura paulista brutalista; estrutura tipo Dom-ino"
