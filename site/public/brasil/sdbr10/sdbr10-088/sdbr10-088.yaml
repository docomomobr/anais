abstract: 'Arnaldo Martino faz parte de um grupo de arquitetos paulistas, cuja obra
  merece ser trazida ao debate. Formado em 1964, na Faculdade de Arquitetura e Urbanismo
  da Universidade de São Paulo, em seus primeiros quinze anos de carreira, o arquiteto
  projetará de maneira a explorar predominantemente a tecnologia do concreto armado,
  produzindo obras exemplares da arquitetura paulista denominada brutalista. Apresentaremos
  neste artigo seis residências unifamiliares, construídas em concreto armado, projetadas
  pelo arquiteto de 1965 à 1978. A saber: residência Tereza Martino, (primeira casa
  do arquiteto, 1965), Hélio França (1969), Antônio Ribeiro (1970), Robert Nicol (1971),
  e Donald Ting (1978), estas na cidade de São Paulo-SP, e a residência Casa da Árvore
  (1976), no loteamento Patrimônio do Carmo, em São Roque/SP. A partir do redesenho
  dos projetos originais (desenhados a mão pelo arquiteto), e de visitas “in loco”
  (que geraram um ensaio fotográfico atual das residências), pretendemos identificar
  alguns dos métodos projetuais do arquiteto entre o ano de sua formação, e o final
  dos anos 1970, quando Arnaldo passará a projetar edifícios em estruturas mistas.
  Com este trabalho pretendemos descortinar parte de uma vasta produção do arquiteto,
  de raro valor arquitetônico, e de uma pequena parte da historiografia e da iconografia
  da arquitetura paulista dos anos 60 e 70.'
