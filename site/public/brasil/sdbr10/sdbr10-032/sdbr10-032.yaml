abstract: A arquitetura de Severiano Mário Vieira de Magalhães Porto é constantemente
  reverenciada como um exemplo de manifestação artística onde o regionalismo crítico
  revela uma transigente abordagem mesológica. A atividade do arquiteto instaurou
  um processo de modernização na arquitetura amazonense, concebendo-a como expressão
  social baseada na localidade, adaptando técnica e formalismo àquela geografia. A
  busca de contemporaneidade à Amazônia foi refletida em projetos que oscilavam entre
  o ideário racionalista carioca e o brutalismo paulista, assumindo uma certa feição
  regionalizada. O desejo de austeridade absoluta e recusa de qualquer subterfúgio
  característico das produções da Escola Paulista, ficaram explícitos em obras com
  necessidades de uma imagem estatal, geralmente de grande porte e públicas. Os projetos
  desenvolvidos para o Estádio Vivaldo Lima (1965), a Superintendência da Zona Franca
  de Manaus (Suframa - 1971), os Reservatórios Elevados da Cosama (Companhia de Saneamento
  do Estado do Amazonas - 1972) e o Ambulatório do Instituto de Previdência e Aposentadoria
  do Estado do Amazonas (Ipasea - 1979) potencializam uma possível linguagem de vertente
  brutalista. O presente artigo, busca um estudo de reconhecimento, e possível reflexão
  da obra realizada pelo referido arquiteto para a Sede do Tribunal Regional Eleitoral
  do Amazonas (TRE - AM). O edifício apresenta o caráter técnico das construções que
  primam pela simplificação e economia do partido tão comuns às produções brutalistas
  realizadas a partir dos anos 1960.
keyword: Severiano Porto; Arquitetura amazônica; Brutalismo regional
