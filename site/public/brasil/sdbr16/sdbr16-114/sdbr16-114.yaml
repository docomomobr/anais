abstract: Na entrevista que acompanha a publicação do projeto do Centro Pompidou na
  Revista Caramelo, Paulo Mendes da Rocha afirma que fazer arquitetura é navegar “neste
  campo de construir alguma coisa que sonhamos”. Embora não seja necessariamente uma
  má definição de arquitetura, ela evoca, no contexto do Brutalismo brasileiro ao
  qual se havia filiado o primeiro Paulo, a intenção brutalista de criar um “mundo
  novo” (nas palavras de Vilanova Artigas), não somente através da arquitetura, mas
  concebendo a própria arquitetura como um pequeno grande mundo novo. Apesar de genérica,
  essa definição cabe perfeitamente no projeto do Centro Pompidou, proposto como uma
  pequena cidade utópica superior à cidade e ao centro histórico nos quais se insere,
  permeável, mas mais fechada que aberta (física e metaforicamente), mais bruta que
  encantadora. Entretanto, o projeto do Centro Pompidou é mais que uma simples materialização
  do sono dogmático da razão brutalista. Além de sonhar para si mesmo, ele também
  incorpora a realidade empírica, complexa e dinâmica, do contexto histórico da cidade
  que, por sua vez, pretende orgulhosamente, ou messianicamente superar. A fluidez
  do interior que, nas palavras do próprio Paulo, estabelecem a continuidade entre
  o interior e um exterior variado e dinâmico revelam que o Pompidou do Paulo bebeu
  também, e muito, na fonte da Arquitetura Moderna Brasileira, e no Niemeyer em particular,
  cujo museu de Caracas é igualmente a fonte bem evidente do volume em pirâmide invertida
  do Pompidou. Em suma, o projeto do Pompidou mostra claramente que Paulo Mendes da
  Rocha tinha aprendido e continuava aprendendo com a Arquitetura Moderna enquanto
  sonhava o sonho do Brutalismo. E também que era preciso continuar aprendendo com
  a Arquitetura Moderna para, quando o sonho acabasse, tornar-se “moderno e eterno
  ao mesmo tempo” (Carlos Eduardo Comas).
