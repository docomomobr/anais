abstract: 'O artigo examina parte da trajetória da pré-fabricação de concreto na arquitetura
  industrial do Rio Grande do Sul, destacando o percurso que vai do caráter experimental
  ao consolidado, sintetizado no paralelismo “do pretendido ao protendido”. O estudo
  trás dois marcos em contextos distintos da produção do mesmo escritório de arquitetura:
  os almoxarifados e oficinas da Refinaria Alberto Pasqualini (REFAP) juntamente com
  o Terminal Almirante Soares Dutra (TEDUT), projetados pela Equipe de Arquitetos
  nos anos 1960, e os pavilhões industriais da Tramontina, concebidos entre 1986 e
  1998. A análise evidencia a continuidade de princípios modernos como ordem formal,
  racionalidade e busca por inovação técnica aplicados em situações distintas: de
  um lado, a Petrobras, expressão do nacional-desenvolvimentismo, de outro, a Tramontina,
  que associou imagem corporativa à adoção da pré-moldagem e protensão. Os casos apresentados
  revelam a recorrência de soluções tipológicas semelhantes assim como a evolução
  de sistemas, do uso combinado de técnicas artesanais e pré-moldadas até a plena
  industrialização. Além da documentação, a reflexão busca compreender a dimensão
  cultural dessa trajetória, em que a pré-moldagem emerge como recurso construtivo
  e como a linguagem arquitetônica se tornou instrumento simbólico de identidade.'
