abstract: "O artigo analisa a trajetória da protensão no Brasil como processo histórico\
  \ de longa duração, articulado à tradição nacional do concreto armado e decisivo\
  \ para a modernização técnico-construtiva da arquitetura brasileira no pós-guerra.\
  \ Partindo das primeiras experiências em obras de infraestrutura, especialmente\
  \ pontes e viadutos protendidos das décadas de 1940 e 1950, o estudo demonstra que\
  \ a adoção da protensão no país não se configurou como mera importação tecnológica,\
  \ mas como adaptação progressiva de um saber técnico já em amadurecimento, moldado\
  \ por um contexto de industrialização incipiente e pela busca de soluções racionais\
  \ e economicamente viáveis. \nA pesquisa destaca o papel pioneiro do sistema Freyssinet\
  \ e a relevância de obras recordistas, como a Ponte do Galeão, que posicionaram\
  \ o Brasil na fronteira tecnológica internacional. Em seguida, analisa a Plataforma\
  \ Rodoviária de Brasília como ponto de inflexão, no qual a técnica se consolidou\
  \ como obra de grande escala e complexidade, combinando rapidez de execução, racionalização\
  \ construtiva e integração formal. O artigo enfatiza, por fim, a migração da pré-moldagem\
  \ protendida para os edifícios da Universidade de Brasília, onde a colaboração entre\
  \ Oscar Niemeyer e João Filgueiras Lima (Lelé) transformou a protensão em instrumento\
  \ central de concepção arquitetônica. Nesse contexto, a chamada “pré-fabricação\
  \ sem fábrica” permitiu a produção de elementos de grandes vãos no próprio canteiro,\
  \ integrando cálculo estrutural, desenho e execução, conferindo flexibilidade espacial,\
  \ economia de meios e expressividade formal. Conclui-se que a protensão desempenhou\
  \ papel fundamental na constituição de uma prática construtiva híbrida, na qual\
  \ a racionalidade estrutural avançada e procedimentos artesanais de obra se complementaram.\
  \ Esse percurso evidencia que a inovação técnica no Brasil resultou menos da adoção\
  \ tardia de modelos estrangeiros e mais da capacidade de adaptação e reinvenção\
  \ dos conhecimentos acumulados, contribuindo de forma decisiva para a afirmação\
  \ da arquitetura moderna brasileira em escala internacional."
keyword: Protensão; Arquitetura Moderna; Concreto Pré-Moldado
