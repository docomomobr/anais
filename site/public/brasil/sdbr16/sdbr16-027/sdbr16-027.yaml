abstract: Construído entre os anos de 1957 e 1960, o Edifício João Rique – originalmente
  denominado Edifício Banco Industrial de Campina Grande – consolida-se como o primeiro
  exemplar tipológico do edifício alto de uso misto, edificado na cidade. Erguido
  em um período áureo da arquitetura moderna local, o edifício simbolizou a chegada
  de uma nova forma de habitar, inaugurando, simultaneamente, novas escalas na produção
  imobiliária campinense. Convergente às intenções de verticalidade presentes em Campina
  Grande desde as reformas urbanas da primeira metade do século XX, o edifício também
  refletiu, os valores simbólicos e as aspirações de seus agentes produtores. Considerando
  sua relevância no contexto de modernização da cidade, o presente trabalho tem como
  objetivo apresentar os aspectos relativos às dimensões urbanas e residenciais observáveis
  no Edifício Rique. Para tanto, busca analisar, por um lado, as relações estabelecidas
  entre o edifício e a cidade, a partir de seus espaços comerciais no térreo, e de
  outro, compreender o perfil de suas unidades habitacionais presentes. A partir de
  redesenhos elaborados com base em visitas e levantamentos in loco, reconstitui-se
  o objeto arquitetônico, de modo a gerar materiais de apoio ao estudo proposto. Tal
  abordagem justifica-se pela relevância da edificação no âmbito da modernidade local,
  também constituindo sua salvaguarda projetual, visto que seus materiais de projeto
  originais não estão mais presentes nos arquivos locais. Conclui-se que a documentação
  resultante desse processo analítico, constitui um instrumento fundamental para a
  valorização do objeto edificado e do patrimônio moderno campinense frente ao seu
  contexto contemporâneo, evidenciando sua importância no cenário urbano atual e os
  desafios de sua conservação na contemporaneidade.
