abstract: No final do século XX, quando as preocupações com a conservação da arquitetura
  moderna tornaram-se centrais, surgiram os principais confrontos entre a história
  de diversas construções, suas relações com as intenções originais de projeto e sua
  efetiva condição material. Se, de um lado, a obsolescência dos materiais e seu estado
  de degradação acelerada convidavam a uma revisão crítica do ideário moderno — especialmente
  quanto à confiança no progresso técnico e na permanência das soluções construtivas
  —, de outro, o uso continuado de inúmeros edifícios desde sua construção revela
  uma dinâmica diferente. Intervenções voltadas a acrescentar ou adequar funções,
  restituir o desempenho físico de elementos, ou simplesmente responder a demandas
  alheias às intenções originais dos projetos, tornaram-se recorrentes. O reconhecido
  papel das comunidades na salvaguarda destes edifícios tem levado a favorecer a importância
  das chamadas “adaptações comunitárias” como atributos a serem preservados, temática
  que tem sobressaído nas últimas reuniões do DOCOMOMO Internacional. Esse cenário
  coloca em questão dimensões caras à arquitetura moderna como patrimônio cultural,
  reconfigurando critérios ligados à autenticidade projetual, integridade material
  e autoria — sobretudo em situações marcadas pela ausência ou fragmentação da documentação
  técnica e histórica. Enquanto estudos decoloniais têm fornecido, em parte, ferramentas
  conceituais para incorporar no quadro das obras consagradas aquelas produzidas no
  Sul Global — sobretudo reinvindicando “outras modernidades” —, ainda é rara a discussão
  de pesquisas que abordem a arquitetura moderna no Brasil como objeto histórico estratificado,
  sujeito, portanto, à conservação de marcas, alterações, transformações de uso e
  adaptações que carregam valores intrínsecos. Portanto, permanece em aberto campo
  fértil voltado à compreensão do acervo moderno a partir de suas camadas acumuladas
  ao longo do tempo, por vezes ainda a revelar pelo exame dos documentos, do corpo
  dos edifícios e das relações entre os atores sociais que os produziu sucessivamente
  até hoje. Isso se evidencia com particular força nos exemplares pouco conhecidos
  que compõem a vasta massa construída do modernismo brasileiro — muitas vezes à margem
  do reconhecimento no campo, mas cuja trajetória de transformações também se observa
  em obras de valor arquitetônico consagrado. A necessidade de adotar novas abordagens
  de conservação — especialmente em face da emergência climática, que exige soluções
  mais flexíveis e sustentáveis — abre espaço para reavaliações que incorporem, mesmo
  no âmbito da economia de recursos, da eficiência energética, e do projeto “baseado
  em valores”, novas estratégias de salvaguarda, documentação e gestão da conservação
  destas transformações, estimulando-se conceitos de “adaptação à mudança” como atributo
  cultural. Obras que permanecem em pé, mesmo com alterações, desafiam visões que
  ainda se orientam por ideias de pureza projetual ou retorno a um estado original.
  Esta sessão propõe o desafio de recuperar trabalhos e pesquisas que permitam identificar
  transições e metamorfoses da arquitetura moderna no uso, na linguagem, nas tecnologias
  construtivas, ou mesmo na incorporação de acréscimos e modificações ao longo do
  tempo. Propõe-se estimular o debate de casos no qual o exame das edificações modernas
  permitiu a incorporação e inclusão de novos valores, enquanto fases, etapas de construção,
  discursos e problemas para o enfrentamento de sua preservação no século XXI.
