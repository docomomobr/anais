abstract: O que resta quando a função desaparece? Este artigo parte dessa pergunta
  e investiga como estruturas técnicas se tornam lugares de vida. A pesquisa adota
  uma leitura comparativa de quatro obras em contextos e escalas distintas para entender
  as escolhas de projeto e seus efeitos no espaço urbano. Em Colônia, o Hotel im Wasserturm
  (1990) converte uma antiga torre d’água em hotel e transforma monumentalidade em
  experiência habitável. Em Buenos Aires, os Silos de Dorrego (1993) requalificam
  o complexo fabril e introduzem moradias e áreas de convívio, abrindo uma frente
  de uso residencial em invólucros industriais. Em Viena, o Gasômetro (2001) integra
  quatro cilindros preservados a um conjunto de usos mistos, com soluções autorais
  distintas que mantêm coesão e criam uma centralidade contemporânea. Em Xangai, o
  Tank Shanghai (2019) funde centro de arte e parque a partir de cinco tanques e articula
  topografia pública, percursos e novas relações com a paisagem do Huangpu. A comunicação
  apresenta uma análise que compara condições, decisões e resultados, permitindo reconhecer
  padrões de projeto sem prescrições fechadas. A pesquisa demonstra como o reuso adaptativo
  não é um ato de nostalgia, mas uma prática de projeto contemporânea, capaz de alinhar
  inteligência construtiva, responsabilidade climática e produção de sentido coletivo.
keyword: Tanques; Silos; reforma; reuso adaptativo
