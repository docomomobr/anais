abstract: O presente artigo tem como objetivo explorar o relevo O Sol faz a festa,
  de Athos Bulcão para o Teatro Nacional de Brasília (1958), a partir de uma leitura
  subjetiva e teatral. As obras de Bulcão estão presentes em diversos edifícios de
  Oscar Niemeyer para a capital do país, mas o relevo de 1966 destaca-se por sua escala
  monumental, formado por duas grandes fachadas, quase sem aberturas, com blocos de
  concreto que variam de tamanho e ritmo e voltam-se para a cidade. A forma de tronco
  de pirâmide desenhada por Niemeyer para o edifício resulta em firmeza e robustez.
  Niemeyer desejava introduzir leveza à composição através da intervenção de Bulcão.
  Ao escolher realizar a obra de arte com blocos, o artista criou um jogo de luz e
  sombra, a maneira de Le Corbusier; com volumes dispostos sob a luz. As duas grandes
  fachadas tornam-se, então, planos ativos e o teatro vira do avesso, transformando
  a cidade em palco e plateia, simultaneamente. Diferente dos tradicionais painéis
  cênicos do Renascimento, bidimensionais e pintados, O Sol faz a festa funciona como
  um plano tridimensional e interativo, manipulado tanto pelo sol quanto pelos corpos
  que se aproximam, contemplam ou escalam seus blocos. A relação com o objeto arquitetônico
  é intensificada pelo espaço que o circunda. O Teatro Nacional parte de uma forma
  geométrica simples e compacta, que ocupa o terreno com destaque para um grande e
  único volume. O vazio ao redor permite que o transeunte observe a arquitetura como
  espetáculo e escultura. A partir dessa interpretação, é possível aproximar-se do
  conceito de teatralidade explorado pelo crítico de arte Michael Fried, e também
  refletir sobre o vazio e o espaço que envolve os objetos arquitetônicos, conforme
  discutido por Niemeyer, Josep Montaner e Le Corbusier.
