abstract: 'O trabalho discute os planos e projetos turísticos para as estâncias hidrominerais
  paulistas elaborados ao longo da década de 1970 a pedido do FUMEST (1970-1989),
  destacando-se os edifícios para balneários que foram construídos no contexto.  O
  Fomento de Urbanização e Melhoria das Estâncias foi a autarquia responsável pelo
  planejamento turístico das estâncias - hidrominerais, climáticas, balneárias e turísticas
  - de São Paulo desde sua criação, durante o Regime Militar, até sua extinção no
  contexto da redemocratização nacional. Dotou diversas cidades de infraestrutura
  adequada ao turismo, configurando-se como importante agente difusor da arquitetura
  moderna paulista. Os balneários de Águas da Prata (1970) e Serra Negra (1978), de
  João Toscano (1933-2011) Ibirá (1976), de Bonilha e Sancovski, Águas de Santa Bárbara,
  de Eloisa Braga (1950-), são algumas das obras. Outros projetos como o Hotel Glória
  em Cananéia (1971-1972), de Botti e Rubin, a infraestrutura para a Ilha Anchieta
  (1974, não construído), de Luis Garcia Pardo, os terminais de turismo social para
  Ubatuba e Bertioga (1984-1985), de Abrahão Sanovicz, são outros exemplos. Reconhecidas
  ou não, devem ser creditados à atuação do FUMEST, pouco estudada pela historiografia
  da arquitetura. Deste modo, pretende-se explorar parte deste vasto acervo, focando
  em seu programa mais efetivo: a construção dos balneários para estâncias hidrominerais.
  Tais municípios, fundados a partir do termalismo, foram privilegiados, recebendo,
  também, hotéis, praças, centros recreativos e comerciais. Reconhecendo a escassez
  de trabalhos acadêmicos que tratem do FUMEST - lacuna que motivou o presente artigo
  -, foram mobilizadas fontes como periódicos de época e publicações organizadas pela
  própria autarquia, que, articulados a trabalhos que tratam da construção do turismo
  nacional e da produção de arquitetura turística, permitiram o mapeamento histórico
  e arquitetônico, contextualizando infraestruturas conhecidas e evidenciando as de
  menor visibilidade.'
keyword: Fumest; Balneários; Planejamento Turístico
