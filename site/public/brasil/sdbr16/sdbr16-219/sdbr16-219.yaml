abstract: 'O que levou na década de 70 - no contexto da copa do mundo do México e
  de “milagre econômico” - a uma capital no sul do país, com pouco mais de 600.000
  habitantes, a sonhar com um estádio olímpico que abrigasse quase um quarto de sua
  população? Este é um dos questionamentos levantados a partir da leitura da tese
  do arquiteto Paulo Pacheco, que se debruçou sobre os concursos de arquitetura desenvolvidos
  pelo Grupo do Paraná. Este trabalho, além de revisitar esta incógnita, trata das
  questões pretéritas e futuras relativas à ideação, concepção, projeto e construção
  interrompida do Estádio do Pinheirão, fruto de concurso de arquitetura em 1970,
  vencido pelos arquitetos José Hermeto Palma Sanchotene, Alfred Willer e Oscar Mueller,
  os colaboradores Ariel Stelle, Leonardo Oba e Rubens Sanchotene, e o engenheiro-arquiteto
  Hans Eger. O processo embrionário para um estádio olímpico em Curitiba, a teoria
  da concepção da proposta vencedora, seguido dos problemas da descaracterização e
  decadência da obra de arquitetura são abordados brevemente neste ensaio. Discorre-se
  efetivamente sobre as estratégias projetuais construtivas do projeto vencedor do
  concurso de arquitetura, ligando-as a prováveis referências de estádios anteriores,
  ainda que não constem abertamente na teoria arquitetônica que influenciava a equipe
  na época - uma teoria em parte explicitada pela tese de cátedra (1992) e em entrevista
  recentemente realizada (2025) com um dos vencedores do certame: o arquiteto José
  Hermeto Palma Sanchotene. Questionamos, por fim, o papel que a sua monumental ruína
  representa, tanto na utopia construtiva perdida (entendida como sonho realizável),
  como no descrédito atual dos concursos de arquitetura - uma vez que a nova proposta
  para a área, recém adquirida pelo estado, nasce num contexto sem ampla discussão
  pública de projetos de arquitetura.'
keyword: Concursos; Estádios; Curitiba
