abstract: Este artigo busca analisar o papel de ícones da modernidade como meios de
  transporte, produções audiovisuais e o ideário arquitetônico e urbanístico modernista
  na formação identitária de Brasília. Entende-se que o plano de desenvolver o interior
  do país e promover uma mudança política e econômica trouxe grandes transformações
  no território brasileiro durante o período JK, relacionando-se com a construção
  da nova capital. Sob a influência dos conceitos de planejamento urbano e arquitetura
  modernos, Brasília representou a materialização de uma utopia em diferentes âmbitos.
  Os meios de comunicação direcionavam esforços para a construção da ideia da nova
  capital como símbolo de progresso e modernidade, enquanto políticas rodoviaristas
  em escala nacional promoviam sua integração com o resto do território, popularizando
  a ideia de uma nova vida possível no centro do país. Assim, busca-se explorar como
  a modernidade em suas múltiplas formas desempenhou papel fundamental na criação
  de uma nova identidade, trazendo Brasília como a concretização de um projeto político-ideológico
  de integração e modernização nacional. 1. INTRODUÇÃO O presente artigo busca analisar
  o papel de ícones da modernidade como meios de transporte, produções audiovisuais
  e o ideário arquitetônico e urbanístico modernista na formação identitária de Brasília,
  a partir do entendimento de que a monumentalidade e o rodoviarismo foram protagonistas
  na construção da paisagem simbólica da capital. Ao longo do século XX, a difusão
  dos conceitos de planejamento urbano e arquitetura modernos potencializou o uso
  da paisagem como expressão identitária. No Brasil, o plano de desenvolver o interior
  do país, aliado a mudanças políticas e econômicas, motivou o então presidente Juscelino
  Kubitschek a erguer Brasília, a nova capital, entre 1957 e 1960. Para concretizar
  uma paisagem simbólica e empoderadora, foi elaborado um concurso para o projeto
  urbano de Brasília. O arquiteto Oscar Niemeyer foi encarregado de conceber os monumentos
  que dariam destaque ao caráter cerimonial do locus do poder, enquanto o Plano Piloto
  de Lucio Costa foi escolhido pelo júri por incorporar a ideia de uma capital moderna
  e simbólica. Técnicas rodoviaristas e setorizações conferiram ao projeto de Lucio
  Costa extrema racionalidade, coerência e simplicidade. Com o cruzamento de dois
  eixos — Monumental e Rodoviário — foi concebido o partido de Brasília, cujo processo
  de construção foi amplamente divulgado e financiado pelo próprio Estado. A materialização
  da utopia moderna convidava pessoas de todo Brasil e do mundo a conhecerem Brasília.
  A evolução dos meios de comunicação e de tecnologias como revistas, rádio e televisão
  permitiu que a imagem de “capital do futuro” se consolidasse rapidamente. Paralelamente,
  grandes investimentos rodoviaristas viabilizavam o deslocamento até Brasília, popularizando
  uma nova vida possível na capital. Portanto, Brasília exemplifica como o espaço
  simbólico construído pode revelar a paisagem urbana como transmissora de ideais.
  A modernidade em suas múltiplas formas desempenhou papel fundamental na criação
  de uma nova identidade atrelada a grandes transformações, trazendo Brasília como
  a concretização de um projeto político-ideológico de integração nacional.
