abstract: Este artigo trata do acervo arquitetônico do século XX constitutivo da paisagem
  do Centro Antigo de Manaus – AM, considerando em recorte, o Edifício Ajuricaba,
  inaugurado como Hotel Amazonas em 1951. Trata-se de um exemplar significativo que
  sobrevive, documentando a história de Manaus e da arquitetura local, sendo sua preservação,
  desafiada pelo impacto de transformações sedimentadas durante os anos de sua existência.
  A partir deste caso em específico, o trabalho objetiva contribuir para a discussão
  em torno da presença de imóveis de caráter moderno no contexto manauense, na condição
  de bens culturais, desde a leitura de seu transcurso no tempo. Para tanto, considera
  os efeitos advindos de sua trajetória histórica, sejam os relativos ao fluxo dos
  significados socialmente atribuídos a esses objetos, à sua reconfiguração física,
  aos sinais de degradação. A análise documental e os levantamentos fotográficos atuais,
  sob interesse nas transformações na imagem pública do imóvel, deram a ver em perspectiva
  histórica, a superposição de sucessivas intervenções, ampliações irreversíveis ou
  formas de uso e ocupação resultantes de demandas contingentes e desregradas, frente
  ao desinteresse comum em preservá-lo materialmente. Ademais, o edifício, em suas
  intensas dinâmicas de uso, abriga no presente, uma população significativa de comerciantes,
  moradores, trabalhadores, visitantes. Estes fatores complexificam a preservação
  do bem, caso pautada exclusivamente em noções estritas originalidade, que desconsiderem
  sua história e respectivas estratificações, além das práticas sociais ambientadas
  no Centro Antigo de Manaus e a necessidade de participação da comunidade no reconhecimento
  de valores relacionados a tal bem imóvel, sustentados sobretudo pela sua importância
  para a paisagem e memória urbanas da cidade no presente.
keyword: Patrimônio Moderno; preservação; Centro Histórico de Manaus; Hotel Amazonas
