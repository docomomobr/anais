abstract: Este trabalho propõe mapear criticamente as principais trajetórias do arquiteto
  italiano Gio Ponti (1891–1979) no continente latino-americano entre 1950 e 1960,
  com foco em suas viagens e interlocuções com Brasil, México e Venezuela, além de
  interesses na Argentina e no Chile. Mais do que episódios isolados, essas passagens
  revelam uma rede de trocas que desafia leituras lineares de sua carreira. Suas correspondências
  e editoriais da Domus sugerem um campo de ensaio no qual o arquiteto negocia princípios
  projetuais em diálogo com interlocutores e realidades culturais brasileiras e latino-americanas.
  Ao reunir fragmentos dessas viagens por meio da análise de cartas e publicações,
  esta pesquisa visa reposicionar a América Latina e em especial o Brasil e a Venezuela
  como mais um território de formulação ativa na trajetória de Ponti. A articulação
  entre episódios e documentos ainda pouco examinados em chave comparativa, assim
  como artigos autorais sobre o tema, delineia um arranjo crítico alternativo, ampliando
  o escopo da historiografia pontiana e lançando nova luz sobre os processos de intercâmbio
  e tradução cultural na arquitetura moderna. Ao lado das visitas, escritos, correspondências
  e projetos latino-americanos e brasileiros, Ponti reverbera conexões culturais,
  mantendo a América Latina e o Brasil em sua memória.
