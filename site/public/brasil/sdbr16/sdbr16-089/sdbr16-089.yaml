abstract: 'Concebido para ser o maior estádio de futebol do mundo, o Maracanã rapidamente
  se tornou uma referência marcante na cultura e na história do país. Porém, para
  além de seu amplamente reconhecido impacto esportivo e cultural, o estádio também
  introduziu inovações arquitetônicas: sua forma elipsóide, destacada pelo anel elíptico
  superior definido por uma marquise de concreto em balanço e pelos pórticos estruturais
  que distinguiam a fachada, representava uma inovação que se tornaria influente nas
  décadas seguintes; além disso, o projeto incluiu a criação de um setor popular,
  chamado de “Geral”, no qual os torcedores assistiam às partidas de pé, sem conforto
  mas muito próximos ao campo. A Geral, e principalmente os geraldinos, se tornariam
  elementos fundamentais na construção da identidade do Maracanã.


  Porém, embora o complexo esportivo do estádio tenha sido tombado pelo IPHAN em 2000,
  as estruturas que introduziram estas inovações foram destruídas pelas reformas realizadas
  entre 2010 e 2014—apenas a fachada do estádio foi “preservada”. A realização de
  tais modificações em um bem tombado foi justificada por demandas estruturais e de
  segurança, além da necessidade de adequação aos parâmetros da FIFA. Estes fatores
  subjugaram os argumentos e apelos de especialistas que defendiam a preservação do
  estádio, revelando como, apesar do tombamento, o Maracanã continuou vulnerável a
  intervenções desta magnitude devido à interpretação de que o valor patrimonial a
  ser preservado seria etnográfico, e não arquitetônico.


  Tomando o caso do Maracanã como exemplo, o artigo discute como a arquitetura moderna,
  por muitas vezes não ser compreendida pelo público geral como sendo “histórica”,
  parece estar especialmente vulnerável a intervenções que podem ser irreversivelmente
  destrutivas.'
keyword: Maracanã; Arquitetura Moderna; patrimônio
