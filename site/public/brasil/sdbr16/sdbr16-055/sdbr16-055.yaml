abstract: 'Assim como no cotidiano, em que muitas vezes a arquitetura passa despercebida
  como simples cenário, no cinema isso também ocorre. Em algumas obras, porém, ela
  assume o primeiro plano e se torna personagem principal, com narrativa, história
  e capacidade de produzir sensações. Os filmes Medianeiras: Buenos Aires na era do
  amor virtual (2011), de Gustavo Taretto, e Aquarius (2016), de Kleber Mendonça Filho,
  exemplificam quando a arquitetura deixa de ser pano de fundo e se converte em protagonista.


  A análise parte da inquietação ao assistir Medianeiras e reconhecer paisagens comuns
  às cidades brasileiras: ruas longas, edifícios extensos e interiores apertados.
  A cidade de Buenos Aires, narrada por Martín e Mariana, é apresentada como fragmentada,
  verticalizada e caótica, tornando-se um agente simbólico que molda a subjetividade
  dos personagens. As medianeiras, tornam-se metáforas do isolamento, da incomunicabilidade
  e da falta de lugar. Como símbolo de resistência, passam a expor o tempo, a desconexão
  e até publicidade. Nesse ponto, articulam-se os conceitos de Guy Debord sobre a
  perda da experiência urbana e a psicogeografia como tentativa de conexão afetiva
  com a cidade.


  No contexto brasileiro, Aquarius desloca o foco para o interior arquitetônico. O
  apartamento amplo, com grandes janelas voltadas ao mar, abriga Clara, que resiste
  à pressão de uma construtora para deixar o edifício dos anos 1950. Aqui, a arquitetura
  atua como guardiã da memória, dos afetos e da história. A escolha do edifício enquanto
  protagonista evidencia não apenas uma crítica ao mercado imobiliário, mas uma narrativa
  sobre pertencimento e resistência. Dialoga-se com Lucy Huskinson (2018), que entende
  os espaços como extensões da mente.


  Apesar dos contextos distintos, ambos os filmes revelam como o espaço moderno expõe
  ou silencia temas como isolamento, memória e pertencimento. Entre Medianeiras e
  Aquarius, a arquitetura, mesmo imóvel, move a narrativa.'
keyword: Arquitetura; cinema; pertencimento
