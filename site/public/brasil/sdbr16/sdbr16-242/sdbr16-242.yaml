abstract: O Jardim-Vertical forma parte do projeto para a Nova Prefeitura de São Paulo,
  uma das últimas obras de Lina Bo Bardi, desenvolvida entre 1990 e 1992 com Marcelo
  Carvalho Ferraz, André Vainer e Marcelo Suzuki. O projeto incluía a restauração
  do edifício eclético do Palácio das Indústrias (1911-1924) e a construção de uma
  ampliação. O edifício existente foi restaurado, mas o novo bloco de escritórios,
  para o qual Lina projetou a última de suas paredes vivas, nunca foi construído.
  No novo edifício, enquanto os escritórios se abrem para a rua por meio de uma fachada
  de vidro, a fachada oposta é uma parede sólida, sem janelas, sobre a qual se estende
  uma composição vegetal, com árvores verdadeiras, plantas e flores variadas, de diferentes
  espécies, tamanhos e cores. Desenvolvido como uma grande tela contínua, o Jardim-Vertical
  de Lina alude às práticas da pintura mural, tanto pela escala extraordinária da
  composição quanto pelo foco na experiência imersiva. Mas a passagem da representação
  pictórica da natureza para o seu emprego como matéria operável amplia e subverte
  essa mesma tradição, estabelecendo uma tensão, comparável a iniciativas posteriores
  na arte contemporânea, que usaram o material orgânico como elemento constitutivo
  da obra, e como crítica à pintura de paisagem. O Jardim-Vertical de Lina Bo Bardi
  dialoga com a larga tradição da arte mural, e com o seu sentido ambiental, reconhecendo-se
  neste termo uma dupla acepção, que compreende tanto o caráter espacial, quanto a
  relação com a natureza e suas questões.
