abstract: O século XIX assistiu a um processo gradual de profusão de elementos decorativos
  nos interiores domésticos, bem como ao aumento quantitativo de mobiliário - que
  passou a ser organizado de forma menos rígida, tornando muitas salas de estar quase
  intransitáveis. A coexistência de estilos diferentes se somava a esse quadro. A
  acumulação incomodava higienistas, para quem significava impureza; artistas, que
  acreditavam que o excesso de ornamentos destruiria a arte, e moralistas, para quem
  a ostentação era inconveniente. Pior do que a quantidade, a qualidade dos objetos
  que superpovoavam aqueles interiores era duramente criticada. Havia muita falsificação
  ou mesmo a fabricação de réplicas de objetos como peças arqueológicas ou tapetes
  orientais. Diante de tudo isso, a supressão dos excessos e a unidade proposta pela
  arquitetura moderna do início do século XX pareciam ser um bálsamo necessário, um
  antídoto vital contra a doença do ecletismo. A palavra ecletismo deriva do grego
  eklektikós, de eklego, que significa “escolher”, também presente na origem de legere,
  ler, em latim. Ler, portanto, conhecer e interpretar para escolher. O termo ecletismo
  se aplica à variedade de estilos que se tornou corrente por volta de 1820 e rompeu
  com a hegemonia do neoclassicismo - embora a tendência de reviver estilos de períodos
  passados devesse ser mais propriamente chamada de historicismo. Olhando mais de
  perto, no entanto, percebe-se que a casa moderna, projetada em sua totalidade pelos
  arquitetos da época, nunca foi desprovida de alguma dose de mistura, de alguma impureza,
  da contaminação de algum “agente externo”. Encontram-se tapetes orientais na Villa
  Tugendhat, assim como ânforas de argila entre as cadeiras Thonet e pinturas puristas
  nas casas de Le Corbusier, na década de 1920. Já em meados do século, a Casa de
  Vidro de Lina Bo Bardi é prolífica em misturas equilibradas, assim como o casal
  Eames exibe uma coleção de peças indígenas com destaque sob o telhado de zinco da
  Casa nº 8. Na década de 1960, as casas projetadas por Charles Moore para si mesmo
  beiram o exagero, flertando com o kitsch. O que era a sutil coexistência de diferenças
  estava se tornando uma tendência. Mas já houve, de fato, uma casa moderna “pura”?
  Esta sessão se propõe a discutir os interiores das casas modernas, produzidos entre
  os anos 1920 e os nos 1970, em seus diferentes graus de pureza. Esperamos trabalhos
  que tratem dos espaços privados e dos objetos e/ou elementos – ou da constelação
  deles - da vida cotidiana que os habitam, da forma como arquitetos e usuários atuam
  para lidar com seu significado cultural, social e político. Aceitamos artigos que
  interpretem e analisem a domesticidade, considerando a relação entre modernidade,
  vernacular, ecletismo e hibridismo como campos de reflexão histórica e teórica sobre
  o discurso arquitetônico do século XX.
