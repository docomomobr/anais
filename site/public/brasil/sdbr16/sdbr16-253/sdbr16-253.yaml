abstract: O presente artigo ancora-se na investigação continuada sobre a relação entre
  discurso e desenho na obra de Paulo Mendes da Rocha em suas diversas participações
  em concursos. Para além dos estudos em obras construídas, como se almeja na sessão
  temática, encontra-se um solo fértil para leitura e investigação de ancoragem de
  premissas projetuais e construção do discurso nessas propostas para certames. Os
  concursos, diferente de outros nomes da arquitetura brasileira, é fundamental para
  a leitura da trajetória profissional do arquiteto. Para além das obras que se sagraram
  vencedoras, curiosamente todas construídas, Sede da Câmara Legislativa de Santa
  Catarina (1957), Sede do Clube Atlético Paulistano (1959), Sede do Jóquei Clube
  em Goiânia (1962), Pavilhão de Osaka (1969) e o MuBE (1984), as outras 40 participações,
  revelam um conjunto passível de uma leitura interessante, em especial na compreensão
  da ancoragem das ideias. Dentro desse solo, propõe-se o recorte de três projetos
  com o intuito de encontrar nas propostas as ancoragens e miragens projetuais lançadas
  por Paulo em suas propostas. Os projetos aqui propostos para análise foram selecionados
  pela possibilidade de leitura cronológica do pensamento do arquiteto e abordagem
  cultural dos projetos e seus respectivos sítios, tendo em vista que são projetos
  internacionais, são 1972 - Transformação da Área Central de Santiago – Chile, 1977
  - Biblioteca Nacional Pahlavi - Teerã, Irã (a depender da cessão pela Casa da Arquitectura)
  e a sua última participação em concursos em 2018 para Faculdade de Arquitetura e
  Urbanismo de Assunção – Paraguai. Lança-se então aqui, o intuito de navegar no imaginário
  civilizatório das cidades e os equipamentos arquitetônicos de Mendes da Rocha, ecoando
  as diversas pesquisas continuadas de Sophia Telles, Maria Isabel Villac, Guilherme
  Wisnik, Catherine Otondo, Daniele Pisani, além de outros importantes registros e
  abordagens de trabalhos a citar Carlo Gandolfi, Ruth Verde Zein, Ana Souto, Denise
  Solot e Angelo Bucci. Por fim, vislumbra-se a possibilidade de encontrar um diálogo
  junto ao pensamento do geógrafo Milton Santos. Conhecida sua abordagem dialética,
  humanista da leitura e explicação da conformação urbana nas cidades latino-americanas,
  em especial, e a impossibilidade de formatação fora história, antropologia e sociologia.
  Nesse campo fértil de diálogo entre pensamentos, propõe-se a reflexão sobre o caráter
  de dignidade e generosidade que a arquitetura de Mendes da Rocha carrega em seu
  discurso e como esse imaginário gera crítica e capacidade propositiva.
