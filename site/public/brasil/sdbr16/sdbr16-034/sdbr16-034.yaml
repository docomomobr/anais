abstract: 'Este texto investiga a gênese do edifício sede da Petrobrás (EDISE), no
  Rio de Janeiro, cujo projeto foi selecionado por concurso nacional de arquitetura
  (1967/1968). Houve, em torno desse processo, sentimentos contraditórios, a começar
  pelo fato de se tratar de imposição de um governo autoritário. Some-se a isso as
  alterações ocorridas no andamento do concurso, como a mudança do terreno; o aumento
  das dimensões do programa e a determinação de que a obra deveria ser executada em
  duas etapas. A polêmica se intensifica quando, mesmo mediante maciça maioria dos
  participantes pertencerem ao eixo Rio/São Paulo, inclusive entre os integrantes
  do Júri, o concurso é vencido por uma equipe de jovens arquitetos da então periférica
  Curitiba. A crítica especializada não perdoa o projeto vencedor, que surge mediante
  características formais avessas às da arquitetura moderna brasileira. Depois de
  concluído, o edifício foi retratado como uma experiência megalomaníaca do período
  militar, rótulo que, embora amenizado pelo tempo, ainda prevalece. Este texto, portanto,
  tem os seguintes objetivos: 1. resgatar o contexto existente nas duas fases do concurso
  e, assim, os prováveis motivos que levaram à premiação de uma equipe desconhecida;
  2. conhecer o projeto do edifício e identificar óbices ou qualidades; 3. entender
  o contexto da cidade de Curitiba e a formação dos arquitetos premiados; 4. identificar
  as possíveis influências nacionais e internacionais que possam ter contribuído para
  a solução do projeto. Espera-se, pois, responder a pergunta título desse texto:
  o Edifício Sede da Petrobrás configura um ponto fora da curva? Pode ser visto como
  um corpo estranho à ampla produção da arquitetura moderna brasileira? A resposta
  talvez revele a verdadeira identidade do EDISE.'
