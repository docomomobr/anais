abstract: 'O Brutalismo, cujo nome deriva do francês béton brut, designa edifícios
  em que esse material predomina, seja pré-moldado e liso, seja moldado in loco com
  textura rugosa. Urbano em certos contextos e rústico em outros, atende a programas
  monumentais e cotidianos, alternando soluções minimalistas e maximalistas, sempre
  como alternativa às limitações pragmáticas e semânticas das “caixas brancas” do
  Estilo Internacional. Ruth Zein demonstrou a contemporaneidade do brutalismo nas
  Américas e na Europa, contestando a narrativa de Reyner Banham sem negar a liderança
  de Le Corbusier. Elementos brutalistas, contudo, antecedem 1945, presentes tanto
  em casas corbusianas (Le Pradet, 1929–31) quanto nas casas de Juan O’Gorman no México
  (1929–31) ou nas casas operárias de Lucio Costa em Monlevade (1934). Apesar disso,
  a produção latino-americana foi considerada irrelevante pelo Norte Global já nos
  anos 1960 — muito antes de redescobrirem o brutalismo. Só por volta de 2000, com
  a Conferência DOCOMOMO Internacional em Brasília e o Prêmio Pritzker de Paulo Mendes
  da Rocha, obras como as de Lina Bo Bardi e Mendes da Rocha ganhariam visibilidade
  internacional. É nesse quadro que propomos outra leitura para o conjunto 1111 Lincoln
  Road (2005–10), em Miami Beach, projetado por Herzog & de Meuron, com Christine
  Binswanger como sócia responsável. O 1111 é uma colagem temporal: uma nova estrutura
  aérea, com ecos brasileiros dos anos 1950/60 — garagem e centro de eventos — conecta-se
  a um edifício brutalista de 1968, renovado, de linhagem anglo-americana. Complementam
  o conjunto uma praça reformada ao estilo Burle Marx e novos apartamentos-jardim.
  Argumentamos que o 1111 homenageia a história do Brutalismo nos (sub)trópicos e
  indica seu potencial futuro, articulando inclusão formal e funcional, ainda que
  voltado a uma burguesia transnacional.'
