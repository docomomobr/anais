abstract: Essa proposta apresenta a cronologia do Pavilhão do Brasil, desenhado por
  Oscar Niemeyer e Lucio Costa em Nova York, para a Feira Mundial que ocorreu entre
  1939 e 1940, discutindo como acervos abriram novas questões sobre o edifício. A
  partir de documentação primária recolhida no Estados Unidos e no Brasil, foi possível
  perfazer o processo de sua concepção, desde as primeiras discussões dentro de órgãos
  governamentais até a sua bem-sucedida inauguração. Trata-se de um processo que não
  foi linear, com distintos interlocutores de interesses e ideias conflitantes que,
  embora direcionados a um prédio temporário, teve amplo registro e celebração na
  sua época, o que lhe garantiu posição como exemplar precoce de modernidade nacional
  dentro da historiografia, por meio das fotografias e dos relatos pessoais de seus
  autores.
keyword: Pavilhão Brasileiro na Feira Mundial de 1939; Oscar Niemeyer; Lucio Costa
