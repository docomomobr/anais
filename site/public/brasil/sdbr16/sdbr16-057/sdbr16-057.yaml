abstract: 'Nas últimas décadas, a conservação da arquitetura moderna consolidou-se
  como um campo de investigação marcado por tensões fundamentais entre os princípios
  de permanência material e as demandas de adaptação funcional e simbólica. A rápida
  obsolescência programática, o envelhecimento precoce dos sistemas construtivos experimentais
  e a fragilidade dos instrumentos de tutela patrimonial representam desafios crescentes
  para a preservação deste legado arquitetônico. Este artigo apresenta a estruturação
  metodológica desenvolvida em uma pesquisa de doutoramento em curso, que investiga
  as metamorfoses materiais e simbólicas das quatro obras de Paulo Mendes da Rocha
  em Goiânia: o Jóquei Clube de Goiás (1962), a Residência Bento Odilon Moreira (1963),
  o Estádio Serra Dourada (1975) e sua participação no Terminal Rodoviário (1984).
  A investigação fundamenta-se na triangulação sistemática entre três estados temporais
  – as-designed (intenção projetual), as-built (materialização construtiva) e as-is
  (condição contemporânea) – operacionalizada através de ferramentas de Heritage Building
  Information Modeling (HBIM). Sustenta-se a premissa de que as transformações identificadas
  nestas obras configuram processos dinâmicos de adaptação funcional, ressignificação
  social e evolução material, que ultrapassam a noção convencional de degradação patrimonial,
  e que também se entendem como um valor das obras. Como contribuição específica,
  o artigo propõe um quadro metodológico integrado para análise das transformações
  do patrimônio moderno, articulando documentação histórica, levantamento geométrico
  e registro dos usos contemporâneos. Busca-se, ainda, demonstrar a operacionalidade
  do HBIM como instrumento unificador para compreender, documentar e difundir este
  patrimônio em contextos urbanos em acelerada transformação, como é o caso de Goiânia.'
