abstract: 'Este trabalho propõe a interlocução entre os estudos do imaginário e o
  método situacionista do desvio (détournement) como caminho para repensar o ensino
  de arquiteturas modernas na contemporaneidade. Busca-se romper a reprodução de paradigmas
  cristalizados e convocar práticas pedagógicas capazes de ampliar o repertório formativo,
  favorecendo abordagens mais contextualizadas e alinhadas às emergências epistemológicas
  atuais.


  A tradição moderna, mesmo com sua vocação inicial de ruptura, acabou por consolidar
  narrativas técnico-formalistas hegemônicas, que sustentaram, dentre muitas coisas,
  a separação entre razão e imaginação. Essa cisão reforçou uma desconfiança histórica
  do papel da imagem e da percepção na formação arquitetônica. Restituir seu valor
  cognitivo implica reconhecer a imaginação como força criadora que inscreve a arquitetura
  para além da abstração, constituindo-a como prática crítica mediada por sistemas
  simbólicos.


  Nesse contexto, o desvio desponta como estratégia pedagógica capaz de romper com
  a repetição acrítica e ativar novos regimes de sentido. Por meio de recombinações
  e deslocamentos, desestabiliza leituras fixas e evidencia tensões inerentes à modernidade
  arquitetônica. Para ilustrar essa abordagem, o artigo apresenta a atividade “MASP:
  narrativas e contranarrativas”, desenvolvida pelo Grupo Desvios, coletivo independente
  de práticas pedagógicas e processos criativos no campo ampliado da arquitetura.
  A partir de textos disparadores e de uma cartografia colaborativa, os participantes
  reconfiguraram materiais sobre o MASP, desfazendo sua imagem de ícone e reconhecendo-o
  como corpo social atravessado por disputas simbólicas.


  O processo evidenciou a potência formativa da imaginação ao articular crítica, criação
  e implicação política, abrindo caminhos para um ensino de arquitetura sensível,
  experimental e continuamente reinventado. Ao reinterpretar uma obra central do modernismo
  brasileiro sob a ótica do imaginário e do desvio, a experiência reafirma a imaginação
  como força ontológica, capaz de desestabilizar regimes perceptivos hegemônicos e
  de instaurar outros modos de compreender e intervir no mundo.'
