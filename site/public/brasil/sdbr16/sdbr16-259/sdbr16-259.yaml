abstract: 'Este artigo relaciona discursos decorrentes da inclusão do Desenho Industrial
  no currículo da Faculdade de Arquitetura e Urbanismo da Universidade de São Paulo
  (FAU-USP) em 1962 com a prática projetual conjunta de quatro docentes na instituição:
  Lucio Grinover, Marlene Picarelli, Hélio Duarte e Roberto Tibau. Os objetos analisados,
  todos da primeira metade da década de 1960, são as obras projetadas para as Indústrias
  Romi, alguns dos edifícios escolares desse grupo de arquitetos e os enunciados de
  Grinover a respeito do desenho industrial. Buscamos evidenciar ao longo do texto
  os impasses e ambivalências encontrados nessas experiências, principalmente no que
  diz respeito à racionalização da construção e a outros problemas caros aos profissionais
  que visavam a incorporação de novos métodos de projeto, a partir da aproximação
  disciplinar arquitetura - desenho industrial ocorrida em São Paulo naquele momento.'
keyword: História da Arquitetura; Industrialização; arquitetura escolar
