abstract: 'A noção de zonas de contato arquitetônicas, entendidas como meios de dispersão
  de ideias, é fundamental para demonstrar aberturas interculturais na apropriação
  de referências em processo de projeto. Viagens, trabalhos e eventos ampliam repertórios
  e inserem arquitetos em debates mais amplos sobre o ‘como fazer’ arquitetura. No
  Brasil, Jaime Lerner foi representativo desse panorama de trocas e ressonâncias.
  Atuou no escritório francês de Candilis-Josic-Woods; formou-se na primeira turma
  do curso de Arquitetura e Urbanismo da Universidade Federal do Paraná; lecionou
  na Universidade de Brasília; trabalhou com David Libeskind; e admitiu inspiração
  na obra de Paul Rudolph. Essas experiências, articuladas a um debate global, repercutiram
  na configuração de seus projetos no Paraná.


  Sua atuação política e urbanística é amplamente reconhecida, mas sua produção arquitetônica
  – concentrada nas décadas de 1960 e 1970 – é menos explorada. Pesquisas recentes
  a relacionam à nova sensibilidade pós-modernista, entendida como a transição gradual
  do alto modernismo para a aproximação com a cultura popular e a recuperação da apropriação
  eclética da história. Este artigo explora as características dessa sensibilidade
  em quatro projetos de Lerner: Residência Lerner (1963-1965), Conjunto Residencial
  do Bacacheri (1968, com Domingos Bongestabs), Escola Israelita Brasileira Salomão
  Guelmann (1969-1973, com Leo Grossman) e Edifício Casario (1978-1980). A seleção
  baseou-se na diversidade estilística e programática e em seu valor documental.


  A pesquisa apoia-se em levantamento de acervo, análise gráfica e revisão de literatura,
  articuladas por triangulação entre fontes primárias, evidência gráfica e debate
  historiográfico. Os resultados apontam uma sensibilidade pós-moderna incipiente,
  marcada pela valorização do contexto físico e social, pela centralidade do usuário
  e pela metáfora formal. Essas evidências revelam a contribuição de Lerner ao processo
  de diversificação conceitual da arquitetura brasileira a partir de 1960.'
keyword: Circulação de Ideias; Arquitetura Pós-Modernista; Curitiba; Arquitetura Brasileira
