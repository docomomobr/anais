abstract: A Avenida Paulista, situada no centro de São Paulo, é um dos principais
  centros históricos e econômicos da América Latina. Inicialmente, planejada pelos
  barões do período cafeeiro como um centro para a elite cafeeira, a avenida passa
  historicamente por inúmeras reformulações urbanísticas ao logo de seus 130 anos
  de existência, passando por diretrizes modernistas na década de 50 que representam
  as sociedades disciplinares (FOUCAULT, 1987), até a configuração contemporânea das
  sociedades de controle (DELEUZE, 1992), no século XXI. Este artigo busca contribuir
  para o debate vigente sobre o “Futuro do Passado” ou da herança modernista nas cidades
  contemporâneas a partir da hipótese central de um novo regime de vigilância e visibilidade,
  mediado por tecnologias de informação, que instauram um novo regime de percepção
  e produção mediadas do espaço urbano. Tal transformação incide nos princípios fundadores
  da arquitetura e do urbanismo modernistas, tais como a relação forma-função, a distinção
  entre público e privado e a noção de forma e função, entre outros, atualizando-os.
