abstract: 'Este trabalho propõe uma reflexão crítica sobre a atuação de Lina Bo Bardi
  no Museu de Arte Moderna da Bahia (MAM-BA) com foco no projeto do Museu de Arte
  Popular no Solar do Unhão, dialogando com as ideias de Josep Maria Montaner, em
  Museu Contemporâneo: lugar e discurso. Busca-se compreender como a concepção museológica
  de Lina antecipa debates atuais sobre o museu como espaço discursivo, político e
  ético, aproximando-se das críticas de Montaner ao modelo moderno e institucional.
  Montaner entende o museu contemporâneo como um espaço plural, cuja função ultrapassa
  a simples conservação, assumindo papéis sociais e políticos. Ele destaca a diversidade
  de tipologias e configurações arquitetônicas, desde grandes instituições até museus
  locais integrados à paisagem, ressaltando que os espaços, suportes e iluminações
  devem responder ao discurso expositivo e às especificidades dos objetos. Aponta,
  ainda, a ambiguidade do conceito de museu e a tendência de integrar diferentes programas
  culturais em um mesmo complexo. A atuação de Lina entre 1959 e 1964 no MAM-BA revela
  uma visão alinhada a esses princípios. No Museu de Arte Popular, ela rompeu com
  a neutralidade do “cubo branco” moderno, defendendo a integração entre arquitetura,
  território e objeto, além da valorização dos modos de vida populares. A museografia
  do Solar do Unhão — com espaços fluidos, orgânicos e sem hierarquias rígidas — promove
  uma experiência ampliada que articula arte, natureza e corpo, antecipando demandas
  contemporâneas por pluralidade e interação. O estudo baseia-se em revisão bibliográfica
  e análise documental, utilizando Montaner como eixo teórico. Materiais da época,
  como fotografias e croquis, evidenciam a radicalidade da proposta de Lina. Conclui-se
  que o projeto de Lina Bo Bardi antecipa discussões contemporâneas sobre o papel
  social e político dos museus, alinhando-se à visão de Montaner de uma instituição
  crítica, diversa e formadora de cidadania cultural.'
