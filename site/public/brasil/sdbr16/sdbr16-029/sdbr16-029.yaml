abstract: O presente trabalho investiga a questão da habitação nos conjuntos urbanos
  estruturantes de segunda geração moderna no Rio de Janeiro. Projetos como o Centro
  Cívico Municipal, o conjunto do Pedregulho (Reidy, 1948 e 1946) e o conjunto habitacional
  do Cafundá (Magalhães, Petrik e Barros, 1978) fazem parte de uma estratégia ampla
  de reestruturação urbana caracterizada por núcleos locais (local cores). Incorporam,
  portanto, estratégias não-cartesianas do Town Planning inglês.  Esses projetos buscam
  reavaliar ou transformar alguns princípios rígidos da primeira geração moderna,
  conforme foram consolidados na Carta de Atenas. As ações se enquadram nas revisões
  de segunda geração propostas no CIAM 8 (O Coração da Cidade). Contam com a crítica
  ao funcionalismo estrito e com uma série de diretivas novas que aproximam o planejamento
  moderno da cidade existente, como o processo de recentralização, a ideia de programar
  o núcleo (core) e o movimento de replanejar as cidades, defendidos por Sert. Mobilizam
  também a ideia de enquadramento (frame) proposta por Wiener, na qual um âmbito urbano
  é delimitado para dar coerência ao projeto de um conjunto estruturante.  Nesse contexto,
  o edifício habitacional adquire novo papel na organização dos planos locais. Nos
  casos do Cafundá e do Pedregulho, o conjunto de moradias e espaços públicos funcionará
  como esteio do bairro, que se desenvolve no entorno de forma tradicional. No caso
  do Centro Cívico de Reidy, a presença da habitação desafia os princípios de separação
  funcional (zoning) e mesmo a visão de núcleo proposta por Sert. Tem papel fundamental
  na diversificação do programa urbano e na construção da ideia de chão, ao mediar
  a relação com o tecido existente.
