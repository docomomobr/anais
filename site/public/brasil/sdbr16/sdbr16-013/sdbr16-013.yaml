abstract: 'O objeto do artigo trata-se da casa escritório do arquiteto Hans Broos
  (1971-1978), no bairro do Morumbi, na cidade de São Paulo, enquadrando-se na situação
  que compreende casas que seguem sendo habitadas, preservando sua materialidade e
  espacialidade originais, móveis e outros objetos, como “cápsulas do tempo”, potenciais
  casas-museu em futuro próximo.


  O objetivo é apresentar a anamnese da obra que vem sendo pesquisada pela autora
  em pesquisa pós-doutoral, trazendo à tona um resgate documental projetual com análise
  arquitetônica e crítica que compõe a primeira etapa de um processo de conservação
  de um bem patrimonial residencial.


  A obra está imersa no jardim projetado por  Roberto Burle Marx, composta pelo volume
  da residência, localizado na parte mais alta do terreno com declividade acentuada
  e faces voltadas para duas ruas; e pelo volume do escritório, localizado na parte
  mais baixa do lote com acesso independente para uma das vias.


  Entre as edificações encontra-se a piscina e o jardim que complementam a composição
  arquitetônica da obra que se caracterizou pela adoção da linguagem brutalista, adotando
  o concreto armado como sistema construtivo dominante em ambos os volumes.


  Justifica-se trazer à tona tal caso para discussões no evento, considerando o significado
  dessa obra no cenário brasileiro, por ser considerada um exemplar clássico residencial
  brutalista, preservada legalmente desde 2018 pelo município de São Paulo, mas passando
  por sérios problemas de conservação do imóvel em si, e do acervo documental que
  ela abriga.


  Entretanto, a obra em pauta encontra-se desocupada desde a morte do arquiteto em
  23 de agosto de 2011, deixando-a em testamento, a sua doação e de seu acervo para
  uma instituição de arquitetura indefinida.  Embora os esforços de contato com várias
  universidades tenham sido realizados na tentativa de concretizar o desejo do arquiteto,
  até o presente momento ainda não se obteve um resultado positivo.'
keyword: patrimônio do século XX; Brutalismo; conservação
