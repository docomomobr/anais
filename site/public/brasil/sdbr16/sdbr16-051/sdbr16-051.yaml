abstract: O artigo propõe uma análise comparativa entre Os Verdes Anos (1963), de
  Paulo Rocha, e São Paulo, Sociedade Anônima (1965), de Luís Sérgio Person, destacando
  o papel central da arquitetura e do espaço urbano na construção das narrativas fílmicas.
  Com base em autores como Giuliana Bruno, Jean-Claude Bernardet e Ignasi de Solà-Morales,
  parte-se da premissa de que a arquitetura transcende a função de cenário para atuar
  como agente narrativo, revelando como as paisagens de Lisboa e São Paulo moldam
  as trajetórias dos protagonistas e refletem as tensões entre modernidade e experiência
  humana. Em Os Verdes Anos, Lisboa é apresentada por planos que transitam do bucólico
  ao urbano, refletindo o estranhamento do jovem migrante diante de uma cidade em
  expansão, marcada pelo choque entre ruralidade e modernização. Júlio chega à capital
  pela estação ferroviária e vive o desajuste e a nostalgia de quem é lançado à metrópole.
  O bairro liminar entre campo e cidade onde se instala reflete seu desenraizamento.
  Em São Paulo, Sociedade Anônima, a metrópole industrial surge como território fragmentado,
  atravessado pelo rodoviarismo e pela lógica do capital. Carlos vive entre relações
  afetivas superficiais e a busca de ascensão social, num cotidiano pautado pela alienação
  e pela repetição. O filme emprega uma montagem não linear, associada à esquizofrenia
  narrativa, em que tempos distintos se confundem num eterno presente caótico. Em
  ambas as obras, a cidade atua como personagem ativa e, por vezes, opressora. Enquanto
  Carlos tenta recomeçar por meio da fuga, Júlio é tragado pelo destino trágico. A
  arquitetura emerge como espelho e catalisador das trajetórias individuais, condensando
  no espaço físico as dinâmicas de poder, as angústias pessoais e as ambiguidades
  da experiência coletiva das cidades.
