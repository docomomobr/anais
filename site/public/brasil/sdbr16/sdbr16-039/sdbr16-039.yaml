abstract: 'Este artigo analisa a trajetória da arquiteta paisagista Rosa Kliass e
  sua contribuição para a formação e consolidação da arquitetura paisagística brasileira,
  com foco no impacto de seus intercâmbios internacionais. Formada em um período de
  grande prestígio da arquitetura moderna brasileira, Kliass teve sua carreira profundamente
  marcada por uma viagem de estudos aos Estados Unidos em 1969. Articulada pelo professor
  Francis Violich da UC Berkeley, a viagem permitiu seu contato com as práticas mais
  inovadoras do campo, incluindo a metodologia de planejamento paisagístico de Ian
  McHarg, que integrava ecologia e geografia ao desenho urbano.


  A imersão no cenário norte-americano, então referência mundial, produziu três desdobramentos
  fundamentais. Primeiramente, impulsionou a profissionalização do campo no Brasil,
  inspirando Kliass a fundar seu próprio escritório em 1970 e a liderar a criação
  da Associação Brasileira de Arquitetos Paisagistas (ABAP) em 1976, nos moldes da
  American Society of Landscape Architects (ASLA). Em segundo lugar, ela introduziu
  e adaptou o método de McHarg em planos diretores de diversas cidades brasileiras,
  difundindo uma abordagem sistêmica que articula a paisagem como estrutura fundamental
  do urbano. Por fim, a experiência solidificou sua convicção na importância da colaboração
  multidisciplinar e do intercâmbio contínuo de conhecimento, prática cultivada ao
  longo de sua carreira.


  A atuação de Kliass como um vetor de difusão e adaptação de referenciais internacionais
  foi crucial para a evolução da prática projetual no país. Sua trajetória evidencia
  como a circulação de ideias e profissionais enriqueceu o campo, promoveu avanços
  metodológicos e consolidou uma visão sistêmica da paisagem que integra ecologia,
  infraestrutura e desenho. O legado de Kliass reside em seus projetos e na estruturação
  da profissão no Brasil.'
