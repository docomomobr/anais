abstract: Apesar da importância central da discussão do projeto no campo da arquitetura
  e do urbanismo, o que se observa nos fóruns de debates da área é uma escassez e
  uma fragilidade no enfrentamento das questões relacionadas com a ação projetual.
  Isso também pode ser observado no campo da preservação. A análise e a qualidade
  das soluções propositivas são poucas vezes motivo de atenção, seja na criação de
  novas obras, seja nas intervenções em preexistências com ou sem interesse de salvaguarda.
  Se, por um lado, é urgente a compreensão que a intervenção em preexistência é indubitavelmente
  uma questão de projeto, e assim a cultura do restauro é inseparável da cultura do
  projeto; por outro, também é fundamental que se compreenda que o restauro não é
  o único modo de intervenção em uma preexistência. Existem inúmeras possibilidades,
  do restauro à recriação que variam de acordo com a relação estabelecida entre a
  nova camada adicionada e a preexistência da própria obra pautada pela avaliação
  de seus valores e atributos pelos sujeitos da operação. Com uma história peculiar,
  entendemos que a Faculdade de Arquitetura da Universidade Federal da Bahia (FAUFBA)
  apresenta condições para fomentar uma discussão a respeito da questão das estratificações
  em obras de arquitetura moderna.  Assim, propomos realizar uma crítica de arquitetura
  que avalie as metamorfoses ocorridas no complexo em seu percurso no tempo, pautadas
  tanto pelas possibilidades da renovação qualificada do espaço construído, como pelo
  interesse de preservação que recentemente vem se desenhando para ela. O percurso
  e a compreensão das camadas históricas que constituíram todo o conjunto – do projeto
  original de Diógenes Rebouças nunca finalizado às suas mais recentes reformas –
  nos permitem, para além de conhecer melhor e poder debater sobre novas ações sobre
  o complexo edificado da FAUFBA, refletir sobre as possibilidades de intervenção
  na preexistência.
