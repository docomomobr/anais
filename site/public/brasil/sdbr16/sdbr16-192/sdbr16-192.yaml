abstract: Em 1960, o Museu de Arte Moderna do Rio de Janeiro trouxe ao público a exposição
  “Casa individual pré-fabricada”, apresentando o método projetual de construção pré-fabricada
  em madeira desenvolvido por Sergio Rodrigues. O evento, que contou com a edificação
  de um protótipo no jardim do MAM, partiu do convite de Niomar Moniz Sodré Bittencourt,
  então diretora do museu, ao arquiteto. A iniciativa assemelhava-se à exposição “The
  House in the Museum Garden” de Marcel Breuer realizada no Museum of Modern Art.
  Embora a partida fosse de uma premissa diferente, o museu nova-iorquino era uma
  evidente referência para Niomar. Diversificando o repertório, na construção do catálogo
  da exposição, o crítico de arte Mário Pedrosa fez referência à carreira de Walter
  Gropius e suas incursões na arquitetura com pré-fabricação. Complicando a trama,
  Sergio revelou posteriormente que pensava estar realizando algo novo, sem interferência
  de outros sistemas desenvolvidos internacionalmente — enquanto estreitava laços
  com outras figuras proeminentes da arquitetura moderna brasileira. A atuação de
  Sergio Rodrigues é um relevante episódio em como pensar o projeto de arquitetura
  pré-fabricada em madeira no Brasil, em suas complexidades de formulação e execução.
