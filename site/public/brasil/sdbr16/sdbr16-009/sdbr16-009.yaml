abstract: 'Este artigo analisa a recente onda de discurso de ódio dirigido ao movimento
  moderno, com foco nas redes sociais. A discussão parte de uma experiência pessoal:
  um vídeo publicado no Instagram em janeiro de 2025, que gerou cerca de 1200 comentários.
  A partir desse material, identificamos os principais argumentos contra o modernismo
  - a suposta falta de beleza, as acusações contra Le Corbusier e a crítica à ruptura
  com a tradição - e os rebatemos à luz de bibliografia especializada. Argumenta-se
  que grupos conservadores e de extrema-direita têm instrumentalizado a linguagem
  estética como estratégia de poder, usando o apreço pelo ''belo tradicional'' contra
  o ''moderno degenerado'' para fins antidemocráticos. Conclui-se ressaltando a urgência
  de ensinar, valorizar e preservar o legado modernista como um gesto político, ético
  e necessário frente às narrativas reacionárias contemporâneas.'
