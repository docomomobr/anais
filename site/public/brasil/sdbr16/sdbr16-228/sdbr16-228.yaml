abstract: Este trabalho apresenta o projeto do anexo do MASP, edifício Pietro Maria
  Bardi, em relação dialética com a pré-existência que lhe dá origem, o MASP de Lina
  Bo Bardi, cuja condição de imutabilidade presente foi estabelecida no passado, enquanto
  tempo de concepção de seu projeto, que, como expressão da Arquitetura Moderna, o
  imobilizava como objeto no tecido urbano. Consideram-se também as contingências
  que orientaram o projeto atual, oriundas da decisão de incorporar o edifício Dumond
  Adams como outra pré-existência sobre a qual o projeto e a construção deveriam se
  desenvolver. Entende-se que a possibilidade de síntese dessas tensões se dá por
  meio de estratégias de projeto minimalistas, com o objetivo de expressar o silêncio,
  para o que se buscou aporte teórico em proposições de Louis Kahn, Edson Mahfuz,
  Juhani Pallasmaa, Josep Maria Montaner e Ignasi de Solà-Morales. No que tange ao
  contingenciamento do projeto, procurou-se compreender o processo de seu desenvolvimento
  enquadrado nos desdobramentos do mundo da vida, segundo o conceito de Jürgen Habermas.
  Para tanto, foi necessário aprofundar o entendimento do sistema construtivo que
  possibilitou a transformação de espaços domésticos em espaços museológicos, por
  meio de um canteiro de obras contemporâneo. Abordando as demandas da instituição
  quanto ao programa, que foram contingenciadas pela pré-existência, observou-se que
  a forma adotada, as estratégias tectônicas de sua materialização, bem como o rigor
  presente nos detalhes construtivos, foram determinantes para que o edifício Pietro
  Maria Bardi seja uma expressão eloquente de silêncio na arquitetura.
