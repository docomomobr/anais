abstract: Neste artigo, são estudados seis conjuntos arquitetônicos construídos nas
  décadas de 1950, 1960 e 1970, nas cidades de São Paulo, Buenos Aires, Cidade do
  México, Bogotá, Lima e Caracas — entendidos como respostas a processos intensos
  de urbanização — que compartilham um conjunto de características. Localizados em
  zonas já consolidadas das cidades, surgiram em contextos nos quais o crescimento
  horizontal era limitado pela própria trama urbana ou desestimulado pelo distanciamento
  em relação aos serviços oferecidos no entorno, destacando-se, desse modo, pela verticalidade
  e pela elevada densidade. Observa-se a presença de usos mistos e de programas complexos,
  que incluíram atividades excepcionais ou inovadoras à época — como cinemas, teatros,
  restaurantes internacionais, clubes noturnos e bancos —, revelando a emergência
  de modos de vida cosmopolitas. O impacto dessas dinâmicas foi decisivo para as soluções
  formais e técnicas adotadas, frequentemente articuladas a estratégias projetuais
  tipicamente urbanas, que buscaram estabelecer relações mais francas entre a malha
  da cidade e o espaço arquitetônico. Em todos os casos, chama atenção a presença
  da habitação como parte central do programa, fomentada, em grande medida, pela crescente
  demanda habitacional e associada às grandes transformações urbanas então em curso
  — como a abertura de avenidas, reparcelamentos e legislações urbanas —, que apontavam
  para a conformação dessas cidades como metrópoles nacionais.
