abstract: Globalmente, a saúde ocupou um lugar privilegiado na instauração dos princípios
  da arquitetura moderna. Como afirma Colomina, “não é que os arquitetos modernos
  fizessem sanatórios modernos, mas, antes, que os sanatórios modernizaram os arquitetos”
  (Colomina; 2021; 66). Na América do Sul, e especialmente no Chile, os terremotos
  desempenharam um papel análogo. Este texto explora como ambos os catalisadores de
  modernidade confluíram nesta região da América do Sul no início do último quarto
  do século XX.
