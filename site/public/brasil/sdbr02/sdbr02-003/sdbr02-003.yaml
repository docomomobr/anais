abstract: 'A arquitetura moderna tem sido objeto de preocupação por parte das instituições
  de preservação de bens culturais em todo o mundo. O DOCOMOMO vem promovendo gestões
  no sentido de estabelecer critérios de elaboração de listagens de bens arquitetônicos
  a se preservar, em meio ao debate acerca da normalização dos procedimentos para
  essas finalidades e as diferenças emergentes entre as várias regiões do planeta.
  Este trabalho busca uma discussão preliminar da questão dos critérios de avaliação
  de modernidade arquitetônica no âmbito brasileiro a partir de sucintos estudos de
  caso, com realizações nem sempre julgadas como manifestações modernas: arquiteturas
  de ensino, hospitalar, aeroportuário, habitacional, do sistema de correios e telégrafos;
  e concluindo com a singularidade de obras de Lucio Costa e Lina Bo Bardi como firmas
  de modernidades heterodoxas.'
