URL: "https://zenodo.org/records/19070387/files/sdbr02-015.pdf"
language: pt-BR
abstract: "Este trabalho busca mostrar alguns projetos e idéias sobre arquitetura, que fazem parte dos debates que se processaram principalmente nos anos 50 em São Paulo e se revelam como desdobramentos de uma postura que se desenvolve em âmbito internacional. São apresentadas algumas obras onde o trabalho conjunto de arquitetos, artistas plásticos e paisagistas produziu resultados que visavam à constituição de uma arquitetura voltada para a inserção da esfera artística na vida cotidiana e a construção de um ambiente que revertesse para o bem estar do homem. Esta proposta abrangente é aqui mostrada em suas formulações e nas obras a elas correlatas, que hoje ainda pontuam a paisagem paulista como fragmentos, indicando o ideário e as aspirações de um momento rico e instigante da arquitetura moderna no Brasil."
