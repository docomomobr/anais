language: pt-BR
abstract: "O estreito vínculo entre a percepção e a gestão do tempo e a organização da cidade moderna é o tema deste trabalho. Entendendo a cidade como uma organização espacial e temporal, investiga como o urbanismo e a arquitetura dos séculos XIX e XX empenharam-se num descongestionamento e funcionalização da cidade e da moradia, que envolveu uma reordenação do espaço e do tempo, solidária com à produção crescente de velocidade correlata à Revolução industrial e à difusão de uma concepção linear e abstrata do tempo. Procura mostrar o impacto dessa aceleração sobre a forma e o ambiente urbano, através da reforma do habitat e da ênfase à circulação no desenho urbano."
