abstract: "Apresentam-se resultados de estudos comparativos de desempenho topoceptivo de três tipos mórficos brasilienses, pertencentes à vertente modernista de organização do espaço. Os tipos acampamento pioneiro, modernista genuíno e modernista periférico possuem, por um lado, capacidades topoceptivas distintas mas sofrem, por outro, processos de mutação de suas características morfológicas que indicam assemelhação entre os mesmos e, consequentemente, queda da intensidade de suas respectivas identidades."
