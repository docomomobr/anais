abstract: "Dentro da perspectiva proposta pelo temário deste encontro do DOCOMOMO, o presente relato insere-se no grupo 3 relativo à preservação da arquitetura moderna. Trata-se de pesquisa documental realizada junto ao arquivo de uma empresa particular de extensa ação urbanizadora na história da cidade de São Paulo, a Cia. City. Esta pesquisa desenvolveu-se como parte integrante da Tese de Doutoramento \"O bairro Jardim América e sua arquitetura\" que vem sendo realizada na Faculdade de Arquitetura e Urbanismo da Universidade de São Paulo. O aspecto que se optou por enfatizar no encontro foi o do desenvolvimento das etapas da pesquisa em uma situação em que se alia grande riqueza documental pouco explorada às condições adversas de se trabalhar em um arquivo que não prevê este tipo de consulta. Infelizmente esta situação não é de excepcionalidade. Como arquiteta ligada à preservação do patrimônio cultural paulista no CONDEPHAAT, tenho consciência das dificuldades para obtenção de documentos sobre a cidade de São Paulo."
