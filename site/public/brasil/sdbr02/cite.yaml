language: pt-BR
abstract: "A questão do chamado \"determinismo arquitetônico\" tem sido mal colocada pela teoria. Nesta comunicação, sugere-se que a arquitetura tem implicações que são inerentes a certos aspectos de sua configuração, e outras que são convencionais. Frisa-se a importância de compreender as primeiras, pois, afinal, projetamos a forma a ser efetivamente construída, e não as convenções pelas quais ela virá a ser utilizada. Sugere-se que, na natureza contraditória do urbanismo moderno, a configuração das cidades naquilo que diz respeito à sua sintaxe — seu sistema de barreiras e permeabilidades — é sua dimensão mais problemática."
