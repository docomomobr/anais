abstract: Procurando aproximar arquitetura, movimento moderno e filosofia, a partir
  das ideias de desconstrução defendidas pelo filósofo Jacques Derrida, este ensaio
  propõe-se, mais que a respostas e conclusões, a uma reflexão sobre o fim ao qual
  se destinam as arquiteturas públicas construídas no movimento moderno como objeto
  significante na sociedade atual, deslocando a arquitetura em direção a um possível
  gesto de alteridade. Num processo de abertura de significados, o sentido funcional
  das arquiteturas públicas (como estações modais, torres de telecomunicações, pontes
  rodoviárias), construídas como ferramentas eficientes, eficazes, marcos de desenvolvimento
  e de ordenação do território, são desconstruídas em narrativas a partir das novas
  formas de ocupações pela sociedade, passando de objeto técnico-formal à objeto-devir.
  As arquiteturas públicas construídas no movimento moderno surgem, neste ensaio,
  como exemplos dessa possível abertura de significados e apropriações às novas necessidades
  da sociedade, transformando o objeto em outra ‘coisa’ além de sua definição e nomeação
  – a torre em ‘lugar de agenciamentos’. Para Derrida as oposições onde tudo se organiza,
  hierarquiza e se conceitua devem ser desconstruídas, os polos opostos perdem seus
  contornos e forças, tirando as certezas dos extremos numa abertura à reinterpretações,
  direcionando a arquitetura ao impensável, ao imaginário de quem a vivencia.
keyword: Arquiteturas públicas; Desconstrução; Alteridade
