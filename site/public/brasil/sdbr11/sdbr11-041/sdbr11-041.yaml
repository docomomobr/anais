abstract: Este artigo trata da relação entre o advento da Arquitetura Moderna no Brasil
  e os estudos desenvolvidos pelo recém constituído Instituto Nacional de Pesquisa,
  em um período que se situa entre 1934 e 1947. O artigo remete, especificamente,
  à obra do engenheiro Paulo Sá, realizada neste Instituto e centrada nos temas da
  Orientação de Edifícios e no Conforto e Iluminação. No desenvolvimento deste artigo
  se tem, como primeiro contraponto, o precoce interesse internacional pelo tema,
  bem evidente desde a Exposição realizada no Museu de Arte Moderna de Nova York e
  a publicação do homônimo livro de Philip L. Goodwin “Construção Brasileira, Arquitetura
  Moderna e Antiga 1652-1942”, ambos de 1943. Finalmente, e como segundo contraponto,
  aborda-se técnica e construtiva dos “quebra-sóis”, “brise-soleils” ou simplesmente
  “brises” do Edifício do Ministério da Educação e Saúde Pública (MESP).
