abstract: "As intervenções em edificações de reconhecido valor cultural têm se revelado um desafio. Embora não haja concordância a respeito de uma postura a ser adotada para subsidiar tal atividade, é consenso que deve ser respaldada em embasamento de cunho teórico‐crítico e em princípios norteadores. O trabalho objetiva analisar o projeto de intervenção realizado na Biblioteca Central Zila Mamede (BCZM), localizada no Campus central da UFRN, no ano de 2011, e suas interferências no patrimônio moderno edificado. A análise teve como eixo norteador os níveis de intervenção arquitetônica estabelecidos por Gracia (1996). O edifício modernista da BCZM, construído em 1975/79, com características brutalistas, foi ampliado em 2011, incorporando um anexo. Constata‐se uma intervenção que busca respeitar o edifício moderno preexistente. O projeto de 2011, contemporâneo, faz uma releitura do projeto de 1975/79, destacando alguns elementos importantes que mantêm a homogeneidade do conjunto. Além de se verificar características dessa releitura, identificam‐se diversos componentes criativos que também estão presentes em outras edificações modernas, inclusive no próprio campus. Os resultados obtidos das análises dessas intervenções contribuem com a preservação do patrimônio moderno construído, além de ampliar os bancos de dados para pesquisas ou intervenções futuras."
keyword: "Modernismo; Intervenção; BCZM"
