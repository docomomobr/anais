abstract: O presente artigo tem como objeto o Design de Superfície das obras modernas
  de Campina Grande, sendo usado como estudo de caso as residenciais do arquiteto
  Geraldino Duda. O objetivo é analisar os elementos de design de superfície da construção
  civil do período modernista da cidade, com foco em sua estrutura morfológica, padrões
  formais e demais aspectos iconográficos, buscando uma compreensão técnico-construtiva
  e sua relação com o contexto sociocultural do período estudado, identificando princípios
  e regras formais no âmbito do design de superfície, empenhado em esclarecer a predominância
  de normas na elaboração das concepções arquitetônicas. O recorte temporal foi estabelecido
  entre os anos 1960 – 1969 por se tratar da década de intenso trabalho do arquiteto,
  consequentemente, período de grandes mudanças no cenário arquitetônico local. Trata-se
  de uma pesquisa que está em fase inicial, portanto, questões maiores serão discutidas
  ao longo dos resultados, que serão instrumentos para posteriores questionamentos
  e futuros desdobramentos da própria pesquisa. De inicio, as constatações indagadas
  neste artigo atuarão como provocador para demais discussões no meio acadêmico sobre
  o design de superfície nas obras arquitetônicas do período moderno de Campina Grande.
