abstract: Este trabalho tem por objetivo analisar as imagens fotográficas apresentadas
  pelas revistas brasília e Módulo, estabelecidas na década de 1950 durante a construção
  de Brasília para justificar e anunciar a Nova Capital e sua cidade moderna. Essas
  revistas promoveram um novo modo de vida e reuniram uma importante documentação
  da arquitetura moderna no Brasil. Os documentos fotográficos publicados por elas
  revelam a fotografia da construção moderna como um forte veiculo de divulgação da
  produção da imagem moderna. A representação da arquitetura moderna foi criada através
  da imagem fotográfica que acompanhou o discurso moderno. Dois fotógrafos que documentaram
  este processo, Marcel Gautherot e Mario Fontenelle criaram fotografias de valor
  simbólico. A imagem moderna é, portanto, uma mistura entre fotografia e arquitetura
  considerando que as duas disciplinas necessitam e beneficiam uma da outra. A fotografia
  precisa da arquitetura para se tornar meio de representação e a arquitetura precisa
  da fotografia para vender um modo de vida moderno. Assim, os exemplos desses dois
  fotógrafos torna visível como o processo inicial de documentação foi usado como
  uma imagem publicitária, tornando-­‐se obra de arte e finalmente um símbolo do movimento
  moderno.
