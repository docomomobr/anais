abstract: "O texto investiga a produção da artista Mary Vieira (1922-­‐2001) no Brasil e a necessidade de se pensar o restauro e a preservação de obras de arte no espaço público a partir de dois pontos: a produção artística e o diálogo com a arquitetura; e a preservação e o restauro como instrumentos para a manutenção do espaço público e sua contribuição para a urbanidade. Visa, também, lançar luz sobre a produção multidisciplinar da artista, ainda pouco (re)conhecida, principalmente no que diz respeito à sua relação com a arquitetura e o urbanismo. Para tanto, coloca em diálogo, especificamente, as obras que desenvolveu em Poços de Caldas, ainda na década de 1940; os trabalhos que desenvolveu para as exposições brasilien baut e brasilien baut brasília, na década de 1950; e as obras em espaços públicos, como os polivolumes em Brasília e São Paulo, da década de 1970, e o monovolume em Belo Horizonte, da década de 1980."
