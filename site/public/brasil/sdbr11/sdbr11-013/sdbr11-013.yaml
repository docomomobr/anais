abstract: 'A estação de passageiros do aeroporto Santos Dumont (1938-1944) dos irmãos
  Roberto é a primeira a ser construída no Brasil. A obra pioneira da nova tipologia
  emblemática é escolhida através de concurso de arquitetura durante o governo de
  Getúlio Vargas, e ganha grande visibilidade antes mesmo do anúncio do anteprojeto
  vencedor. O destaque se dá através da publicação do projeto escolhido em diversos
  periódicos especializados no Brasil e no exterior. A atribuição cultural da mídia
  na formação símbolica do terminal aeroviário se dá em dois formatos: nas publicações
  de aviação e nos periódicos de arquitetura. As publicações nas revistas brasileiras
  especializadas em aviação, mesmo antes da obra finalizada, já declaram de maneira
  quase profética o importante papel icônico que o novo aeroporto da capital federal
  irá assumir no país – e no mundo. Já as revistas de arquitetura são as protagonistas
  na difusão do anteprojeto do novo aeroporto, e em sua afirmação como grande obra
  arquitetônica moderna. O presente artigo busca ilustrar o papel do discurso na formação
  de um símbolo arquitetônico da era Vargas, mais especificamente através de levantamento
  e análise crítica dos períodicos especializados da época.'
keyword: Aeroporto Santos Dumont; Periódicos; Arquitetura moderna
