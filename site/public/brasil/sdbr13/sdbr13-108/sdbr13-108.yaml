abstract: 'Os objetos de reflexão deste artigo são compostos pelo conjunto de residências
  localizado no bairro Bom Pastor, bem como o próprio bairro, onde pelo menos oito
  residências têm ou tinham processo de tombamento aberto. Apesar de apresentar vários
  exemplares do modernismo, o bairro ainda não é objeto de discussão enquanto bairro
  essencialmente modernista, logo encaminharemos a análise de forma a destacá-lo como
  tal, tendo por base não somente as edificações como também a própria praça do bairro
  que tem projeto de Burle Marx. Juiz de Fora conta com diversas expressões do modernismo,
  bem como de artistas e intelectuais, sendo que na arquitetura seu representante
  mais projetado nacionalmente é Artur Arcuri. Logo, estudaremos duas residências
  já demolidas e consideradas autênticos exemplares do modernismo, ambas projetadas
  por Arcuri: a residência que se localizava à rua Brás Bernardino que contava com
  cinco painéis do artista plástico Guima e foi demolida em 2005 gerando intensos
  debates desde então a respeito da preservação de bens culturais na cidade; e a residência
  que foi ao chão recentemente, projetada em 1951 também para um integrante da elite
  local, após dez anos com processo municipal de tombamento em aberto. Pretende-se,
  portanto, analisar a experiência arquitetônica modernista na cidade de Juiz de Fora,
  com ênfase nas residências localizadas no Bairro Bom Pastor, além de promover reflexão
  sobre a valorização conferida a essas edificações nos dias atuais, verificada pelo
  interesse em proteger e preservar exemplares dessa tendência e pelas disputas desencadeadas
  nesse processo.'
keyword: Modernismo; Juiz de Fora; Patrimônio Cultural; residências; Bom Pastor
