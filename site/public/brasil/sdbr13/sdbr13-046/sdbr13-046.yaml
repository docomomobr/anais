abstract: Para além dos livros ‘oficiais’ de história da arquitetura, é certo que
  Brasília desponta como um objeto amplamente narrado em livros de relatos, ou seja,
  trabalhos de pessoas que dedicaram seu tempo e parte de suas vidas para a confecção
  de um livro onde é apresentado sua versão pessoal dos acontecimentos iniciais da
  Capital. Este artigo busca aprofundar os debates sobre esses trabalhos, os apresentando
  em conjunto. Foi decidida a apresentação de dois recortes – dentre vasta bibliografia
  com este perfil. O primeiro deles diz respeito aos homens da Novacap, funcionários
  públicos que atuaram ativamente na construção da cidade de Brasília. Em um outro
  plano temos as narrativas dos pioneiros, pessoas ‘anônimas’ que participaram do
  empreendimento da construção da cidade com muito entusiasmo. O texto busca apresentar
  maior compreensão deste tipo de versão historiográfica, adentrando com maior precisão
  em descobertas sobre os significados públicos e privados que se desdobram a partir
  da construção da nova cidade.
