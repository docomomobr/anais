abstract: 'Este texto pretende desenvolver uma leitura sobre dois trabalhos artísticos
  realizados em Belo Horizonte, que tinham como proposta comum romper com os modelos
  expositivos tradicionais. Ambos ocuparam quase que simultaneamente dois importantes
  espaços expositivos da capital mineira e buscaram dialogar com suas arquiteturas:
  Territórios (1969) realizada no Museu de Arte da Pampulha; e Do Corpo à Terra (1970)
  no Palácio das Artes e seu entorno, bem como em outros espaços da cidade. Territórios
  apresentou-se como uma proposta de apropriação poética dos espaços internos e externos
  do museu, em diálogo com a arquitetura de Oscar Niemeyer. Do Corpo à Terra, além
  de promover intervenções próximas ao Palácio das Artes, teve suas manifestações
  propostas para espaços públicos significativos da cidade, como o Parque Municipal,
  o Ribeirão Arrudas e a Serra do Curral. Este artigo se propõe a fazer uma leitura
  dos dois trabalhos, analisando as apropriações dos espaços da arquitetura, em especial
  os trabalhos do grupo de artistas mineiros Lotus Lobo, Dilton Araújo e Luciano Gusmão,
  que se fizeram presentes nas duas ocasiões. Compreender a atuação do crítico militante
  e curador de arte Frederico Morais nesse momento é essencial para entendermos a
  inserção da capital mineira no circuito artístico e no debate da arte contemporânea
  brasileira.'
keyword: Arquitetura moderna; arte contemporânea; exposições de arte; arte guerrilha;
