abstract: No Brasil, até as primeiras décadas do século XX, os campos previdenciário
  e habitacional eram controlados essencialmente pelo setor privado. Frente à ineficiência
  do setor privado em atender a demanda nacional por esses serviços, e pressionado
  pela população, principalmente urbana, o poder púbico decidiu assumir efetivamente
  como sua responsabilidade a promoção da assistência e habitação social com a criação
  das CAPs, na década de 1920, e dos IAPS na década de 1930. Estes órgãos foram fundamentais
  para a estruturação da previdência estatal e para o financiamento e construção de
  moradias para trabalhadores formais urbanos em nosso país. As CAPs e os IAPs foram
  protagonistas nas discussões e na materialização das reflexões acerca da construção
  do espaço urbano e habitacional do século XX, sobretudo, na aplicação de materiais
  e técnicas inovadoras associadas, principalmente, ao movimento moderno. Nesta conjuntura,
  o Instituto de Aposentadoria e Pensões dos Industriários (IAPI) teve papel de destaque
  ao aplicar inovações técnicas nos campos da arquitetura e urbanismo, abrigando em
  seu corpo técnico, profissionais ligados aos ditames modernos e em consonância com
  os objetivos do plano desenvolvimentista do governo de Getúlio Vargas. O presente
  estudo se insere na temática da habitação social brasileira e tem por objetivo analisar
  os projetos arquitetônicos e urbanísticos dos referidos conjuntos a fim de estabelecer
  um comparativo entre os conjuntos residenciais do Passo d’Areia/RS e da Vila Guiomar/SP,
  ambos edificados pelo supracitado IAPI. Para tanto foi realizada, principalmente,
  revisão bibliográfica e análise de dados duas obras.
keyword: CAP/IAP; IAPI; Habitação social; Política pública habitacional; Arquitetura
