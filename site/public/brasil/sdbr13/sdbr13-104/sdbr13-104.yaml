abstract: O presente trabalho apresenta, de forma sucinta, as primeiras proposições
  de pesquisa em andamento acerca do acervo Moderno (ou, ao menos, de tendências Modernistas)
  em Santa Rosa, cidade localizada na região Noroeste do Rio Grande do Sul. Como objetivo
  essencial, a ação busca identificar os exemplares ainda existentes, registrando
  as trajetórias dos bens, suas atuais condições e a manutenção ou alteração de usos
  dos mesmos. Além disso, o estudo também tem o propósito de verificar possíveis razões
  para a pouca expressão na cidade, aproximando a trajetória do Movimento Moderno,
  especialmente quando já inserido e reconhecido no repertório gaúcho e brasileiro,
  com a cronologia histórica do Município.
