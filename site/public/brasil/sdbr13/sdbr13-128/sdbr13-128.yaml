abstract: 'O artigo se insere no contexto da pesquisa “Do edifício de uso misto ao
  edifício habitacional híbrido na América Latina: os casos de Lima, Caracas, Buenos
  Aires, Cidade do México, São Paulo e Bogotá”, que aborda o processo de surgimento
  e desenvolvimento do edifício de uso misto nos principais centros urbanos da América
  Latina, a partir do conteúdo publicado em periódicos de arquitetura de seis cidades,
  de 1940 a 1970. Pretende-se, neste trabalho, compreender a participação das revistas
  especializadas de arquitetura no processo de difusão e consolidação de edifícios
  de apartamentos em Buenos Aires, São Paulo e Bogotá, entre as décadas de 1940 e
  1970, à luz do cenário tratado em periódicos dessas cidades, respectivamente, Nuestra
  Arquitectura (1929-1986), Acrópole (1938-1971) e PROA (1946-1976). A pesquisa é
  desenvolvida a partir de matérias de natureza teórica ou projetual e da publicidade
  de produtos ligados à construção civil, que trazem à tona o tema do edifício alto
  e da nova forma de morar, agora, nas alturas. Ao explorar as revistas à luz do objeto
  de estudo, o edifício de apartamentos, e relacioná-las com uma pesquisa bibliográfica
  sobre o tema ‘‘morar nas alturas’’, foi possível destacar três temáticas que se
  sobressaem e que direcionam a leitura do conteúdo reunido: tecnologia, cultura e
  cidade. São discussões dessa natureza, tratadas de modo comparativo em uma perspectiva
  SUL-SUL, que norteiam as escolhas e os caminhos interpretativos aqui propostos.'
keyword: Edifício de apartamentos; Revista Nuestra Arquitectura; Revista Acrópole;
