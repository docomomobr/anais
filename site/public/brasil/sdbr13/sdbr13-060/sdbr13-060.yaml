abstract: 'Esta pesquisa é dedicada ao estudo das técnicas envolvidas na construção
  da Catedral de Brasília. Trata-se de pesquisa histórica desenvolvida a partir de
  arquivos gráficos e textuais referentes ao edifício: desenhos técnicos; memoriais;
  planilhas do governo e empreiteiras; textos e entrevistas. Recorremos à literatura
  que trata dos vínculos entre desenho, forma e processo de construção, reunidas aqui
  na noção de “técnica”. Num sentido amplo, o termo contribui para refletir sobre
  a modernidade arquitetônica da década de 1960 no país; particularmente, refere-se
  sobre período expressivo da produção arquitetônica de Oscar Niemeyer. Com isso,
  situamo-nos no conjunto de estudos que visam ampliar o entendimento a respeito dos
  métodos de projeto e construção na obra do arquiteto, que extrapola aspectos gráficos
  para se ancorar em questões materiais e construtivas.'
