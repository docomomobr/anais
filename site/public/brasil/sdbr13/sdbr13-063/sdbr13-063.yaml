abstract: Este artigo destaca a relação entre os valores atribuídos nos processos
  de tombamento do patrimônio moderno e as práticas de conservação acordadas pelo
  Instituto do Patrimônio Histórico e Artístico Nacional – IPHAN em Brasília, especialmente
  através do caso do restauro do Palácio do Planalto, realizado entre 2008 e 2011.
  Ao contrapor aspectos teóricos e práticos nas intervenções no patrimônio moderno,
  a pesquisa investiga em que medida as ações de conservação e restauração adotadas
  nos exemplares modernos de Brasília consideram os valores atribuídos pelo tombamento,
  entendendo a obra como objeto histórico e artístico.
