abstract: O presente artigo constitui-se em uma primeira aproximação à produção arquitetônica
  e urbanística da arquiteta maranhense Lygia Fernandes. Apesar de ter sido a única
  arquiteta brasileira de formação que teve projeção internacional e reconhecimento
  nacional a partir da sua obra particular, sua atuação profissional é desconhecida
  e praticamente inexistente na historiografia hegemônica. Assim, valendo-nos de usa
  série de artigos publicados em jornais e revistas especializadas, além de livros,
  interessa-nos mostrar a expressiva produção por ela desenvolvida, além dos cargos
  assumidos no âmbito do poder público. Isto nos permitiu identificar um conjunto
  de projetos que merecem um estudo aprofundado na medida em que nos relevam formas
  de adaptação e revisão do ideário modernista, traduzidos na preocupação pelo uso
  de materiais e particularidades locais.
