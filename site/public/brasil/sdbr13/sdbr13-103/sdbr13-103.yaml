abstract: Em 2018 foram tombados pelo órgão municipal de preservação de São Paulo
  quatro conjuntos arquitetônicos localizados na Cidade Universitária Armando Salles
  de Oliveira (Cuaso) da Universidade de São Paulo (USP). Em comum, os quatro conjuntos
  são vinculados à arquitetura moderna paulista e sua patrimonialização respondeu
  a imperativos de preservação de exemplares desse período da história da arquitetura
  de São Paulo, para além de se constituírem como bens culturais universitários. Este
  artigo pretende contextualizar este tombamento em relação a uma discussão mais ampla
  sobre a identificação, preservação e valorização do patrimônio universitário. Aponta
  ainda os valores privilegiados e destacados nesse processo, bem como as omissões
  e os silenciamentos daí decorrentes. Argumentando pela necessidade de abordar a
  patrimonialização da modernidade universitária para além de critérios estético-estilísticos,
  propõe a construção de uma narrativa sobre um patrimônio universitário moderno “em
  ação”, para além da busca por exemplares puros de uma modernidade arquitetônica
  idealizada.
keyword: ​patrimônio universitário; patrimonialização; Universidade de São Paulo
