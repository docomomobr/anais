abstract: A Feira Internacional de Amostras do Rio de Janeiro foi um evento inaugurado
  em 1928 que prosseguiu por mais de uma década como uma celebração anual da modernidade.
  Espelhando alguns padrões de exposições internacionais em escala regional, sua realização
  em lugares fechados e ao ar livre, aberto ao grande público, em uma combinação de
  espaço de negócios, exibição de produtos, festejos e diver- sões, caracterizou uma
  forma de apropriação urbana e social que conheceu seu auge ao longo dos anos 1930.
  A arquitetura de seus pavilhões introduziu o gosto Art Déco e permitiu sua popularização
  enquanto estética, exibida como modernidade tanto quanto os novos produtos derivados
  da indústria elétrica e mecânica. No espírito da competição e da demonstração do
  progresso inerente às exposições e feiras, a Feira Internacional de Amostras traduziu
  uma vontade de autoafirmação nacional perante o mundo, de empenhar-se por um posicionamento
  pela modernidade, qualquer que fosse ela, no período entreguerras.
