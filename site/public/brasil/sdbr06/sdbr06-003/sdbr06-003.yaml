abstract: O estudo tem como tema a habitação, especificamente a casa unifamiliar.
  Em se tratando do universo modernista, o tema tem especial significado no contexto
  brasileiro, pois representa um espaço de avanços programáticos em relação ao período
  anterior e de interpretação local do Movimento Moderno. No entanto, no âmbito brasileiro,
  existe uma quantidade enorme de edificações residenciais modernistas ainda não estudadas,
  merecedoras de atenção, tanto pelos seus valores projetuais, quanto patrimoniais.
  Diante disso, são estudadas quatorze casas construídas em Caxias do Sul, de 1940
  a 1970. Concebidas para uma elite, geralmente estavam localizadas na proximidade
  de parques, influenciadas pela experiência americana da cidade-jardim. Trata-se
  de edifícios relevantes no contexto caxiense, mas completamente anônimos à cultura
  oficial e que vem sendo gradativamente destruídos pela especulação imobiliária.
  Assim, o estudo objetiva inventariar e analisar a casa unifamiliar modernista em
  Caxias do Sul. Este estudo segue a metodologia proposta pela pesquisa intitulada
  Inventário da Arquitetura Modernista na Serra Gaúcha, destacando os aspectos organizativos,
  ordenativos e tecnológicos dos edifícios. Inicialmente, de modo a subsidiar essa
  análise, aborda as estratégias compositivas recorrentes no modernismo e sua relação
  com a experiência residencial modernista brasileira. Também faz uma breve contextualização
  do programa residencial unifamiliar caxiense, a fim de diagnosticar aspectos sedimentados,
  hibridizados ou transformados ao longo do tempo. Por fim, em caráter conclusivo,
  a produção caxiense é confrontada com a produção brasileira e mundial.
keyword: modernismo; habitação unifamiliar; Caxias do Sul
