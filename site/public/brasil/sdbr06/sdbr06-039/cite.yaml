abstract: "O artigo tem por objetivo ilustrar, através da trajetória do Largo do Coimbra, em Ouro Preto, o pensamento moderno e a atuação dos intelectuais da SPHAN na política de preservação do patrimônio nacional no primeiro momento de sua existência. As ações nesse espaço na década de 1940 revelam a busca de uma identidade nacional e o “colonial” eleito como marca desta nacionalidade."
