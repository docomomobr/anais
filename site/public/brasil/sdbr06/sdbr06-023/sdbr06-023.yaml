abstract: Enquanto que urbanismo na Europa nasceu no bojo de um processo de modernização
  e reforma social, no Brasil ele encontrou um país que não era verdadeiramente urbano
  e industrial. Portanto, teorias européias desenvolvidas em resposta à modernização
  chegaram ao Brasil antes que a modernização acontecesse. Este descompasso levanta
  uma série de questões. Se tomarmos como verdadeira a recorrente afirmação que a
  modernização brasileira é incompleta, já que as elites locais procuraram modernizar
  o país sem uma correlata transformação na estrutura social, pode-se argumentar que
  o urbanismo, assim como fábricas, redes de transportes e arranha-céus, assumiu uma
  natureza marcadamente simbólica. Argumentamos que o projeto do urbanismo no Brasil
  procurou criar espaços para uma sociedade moderna que ainda não existia, terminando
  por reduzirse à imagens fragmentadas de modernidade. Não obstante, muitas dessas
  imagens sugerem uma forma de comportamento para as futuras massas brasileiras e
  são reveladoras sobre as concepções que a sociedade brasileira detinha para seu
  futuro. Este texto reflete sobre estes temas tomando como exemplo o plano de Alfred
  Agache para o Rio de Janeiro, elaborado entre 1928 e 1930. O plano Agache foi um
  marco na evolução do urbanismo brasileiro e um dos exemplos máximos do urbanismo
  defendido pela Societé Française des Urbanistes (SFU). Seu objetivo era resolver
  os problemas funcionais do Rio de Janeiro, dar-lhe uma feição de capital e incutir
  na mente de seus habitantes um ideal social de vida moderna, sem descurar de requerimentos
  funcionais, como zoneamento e tráfego. Além de uma análise do processo de contratação
  de Agache e de seu relacionamento com as elites locais, que são bastante ilustrativos
  da discussão entre nacionalismo e internacionalismo, a ênfase recairá sobre os grandes
  espaços urbanos projetados por Agache, a Entrada do Brasil e a Praça do Castello.
keyword: Urbanismo; Projeto Nacional; Rio de Janeiro
