abstract: O Modernismo é considerado um dos capítulos mais decisivos da construção
  de uma identidade nacional brasileira durante o século XX, mas existiu também um
  outro processo, em paralelo àquele capítulo, que importou idéias estrangeiras para
  nossa Arquitetura e Urbanismo. Esta Modernização, presumida então como necessária
  por seus arautos, funcionou frequentemente em competição com nosso Modernismo porque
  atendia outros interesses e foi típico daqueles dias entre a Primeira e a Segunda
  Guerras Mundiais. Este texto reflete, através de exemplos tirados de discursos de
  época, como o conflito entre imagens diferentes afetou nosso panorama urbano e nossa
  profissão.
