abstract: Este trabalho visa compreender as ambíguas motivações e os princípios que
  regeram a construção do Bairro Popular, conhecido como Conjunto IAPI em Belo Horizonte,
  dentro das iniciativas modernizadoras da administração de Juscelino Kubitschek.
  Busca mapear o panorama político e o modelo estético que possibilitaram tal intervenção,
  assim como analisar a vertente ideológica em sua face silenciosa que cerca tal idealização.
  Dissimulado por um discurso de cunho social e progressista, o IAPI serve de instrumento
  para a remoção de uma população carente para dar lugar a um elemento de construção
  da imagem moderna de Belo Horizonte nos anos 40 no percurso que culminava no Complexo
  da Pampulha. Poderia uma tão grandiosa realização como a Pampulha ter como portal
  de entrada na avenida aberta para dar acesso a ela a maior favela da capital na
  época? A questão coloca em evidência a complexa ligação entre o movimento moderno
  no Brasil, a construção da imagem de uma nação progressista e a propaganda ideológica
  de uma classe dominante e seus políticos para marcarem e perpetuarem seu poder.
