id: sdbr12-082
type: paper-conference
title: "Estilo internacional americano ao norte, Arquitetura Moderna Brasileira ao sul: Edgar do Valle — formação e produção"
container-title: "12º Seminário Docomomo Brasil, Uberlândia, 2017"
event-title: "12º Seminário Docomomo Brasil, Uberlândia, 2017"
event-place: "Uberlândia"
