abstract: "Tombado por Lei Municipal em 2015 o Conjunto Paisagístico da Praça da Vila de Furnas de autoria do paisagista Fernando Chacel (1931-2011) localizado na cidade de Planura /MG, é ato relevante para o legado arquitetônico, paisagístico e urbanístico modernos no Brasil, que teve como suporte para seu dossiê, as pesquisas efetuadas na Tese: “Vilas Operadoras de Furnas nas Bacias dos rios Grande e Paranaíba – da concepção à atualidade” comprovando a importância dos levantamentos e análises do patrimônio moderno regional realizado pela academia. Este artigo propõe abordar a relevância da atuação profissional de Chacel e equipe multidisciplinar nas “Vilas Operadoras” com o objetivo de demonstrar a importância do ideário paisagístico moderno presente nestas “vilas” por suas peculiaridades paisagísticas, em um contexto em que, a construção de Brasília exigia a ampliação de oferta de energia elétrica priorizando grandes obras de hidrelétricas para atender as necessidades da nova capital e o setor industrial que se consolidava no sudeste do Brasil. Através de texto descritivo, destaca-se a Vila de Planura e sua praça/parque, cujo tombamento voltado à sua preservação valoriza o patrimônio paisagístico ambiental moderno."
