abstract: "Esta comunicação pretende contribuir para o debate sobre as transformações e a ampliação do campo de atuação de arquitetos e urbanistas sobre edifícios e conjuntos urbanos de valor histórico, cultural e simbólico, legalmente protegidos ou não, e sobre os desafios que essa atuação representa para a formação das novas gerações de profissionais.\nConsiderando que, diferentemente de outros países, a legislação profissional estabelece o principio da formação generalista e ao mesmo tempo define a intervenção em bem patrimonial como atribuição privativa de arquitetos e urbanistas, é importante um debate sobre os conteúdos e estratégias da formação de graduação nesse campo.\nPropomos que a experiência brasileira de intervenção moderna em bens patrimoniais, o conhecimento sobre as recomendações internacionais e a relação entre arquitetos urbanistas e o caráter interdisciplinar das intervenções estejam entre os temas centrais desse debate."
