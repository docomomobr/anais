abstract: "Este trabalho apresenta a Vila dos Operadores de Jaguara, localizada na zona rural da cidade de Sacramento, Minas Gerais destacando sua importância como documentação da arquitetura e do urbanismo do movimento moderno presente no Triângulo Mineiro e Alto Paraíba.\nA Vila também se destaca como documento do contexto político e econômico do Brasil, principalmente da política energética adotada pelo governo no período entre 1960 e 1970 e das importantes inovações tecnológicas, sociais, arquitetônicas e urbanísticas desenvolvidas neste período.\nApresentaremos um breve relato da história da Vila, uma análise destacando suas principais características referente a arquitetura e urbanismo modernos, uma descrição do estado atual, atentando aos riscos de descaracterização que vem sofrendo, e por fim, possíveis diretrizes a serem pensadas para um eventual restauro, e preservação, de um de seus edifícios – a Casa de Visitas - que se encontra em total estado de abandono, com consideráveis patologias."
keyword: "preservação; arquitetura moderna; vila dos operadores de Jaguara"
