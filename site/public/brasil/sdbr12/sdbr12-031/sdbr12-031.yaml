abstract: O contexto brasileiro no pós-1945 mostra-se como um período de transição
  de uma economia agrária para uma economia industrial, marcado pelo surgimento de
  novas questões sociais e novos estilos de vida. Imersos e cientes dessas transformações,
  arquitetos como Vilanova Artigas, buscaram pesquisar e experimentar em seus projetos
  novas soluções espaciais, formais e estéticas que refletissem e instigasse esta
  nova sociedade, caracterizando seus projetos residenciais como verdadeiros laboratórios
  experimentais. Estas experimentações podem ser averiguadas na casa Olga Baeta, que,
  entendida na dialética entre projeto e realidade, revela novas composições espaciais
  e estéticas para uma sociedade em transformação.
