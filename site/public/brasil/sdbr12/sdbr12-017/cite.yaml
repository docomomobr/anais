abstract: "O presente artigo analisa um conjunto específico de edifícios multirresidenciais construídos em Salvador, Bahia, entre meados dos anos de 1960 e início dos anos 1980, cujo desenho indica uma adaptação a condições locais no processo de difusão dos princípios da arquitetura moderna. A análise do desenvolvimento da malha viária da cidade, do desenho urbano, da implantação no sítio e dos esquemas de circulação horizontal e vertical pretende demonstrar um processo localizado de recepção interpretativa de princípios consolidados no campo cultural da arquitetura moderna, como a formação de uma rede de condicionantes que articulam a elaboração de uma arquitetura vinculada ao lugar, expressa na tensão entre modelos canônicos, tipo arquitetônico e o lugar."
