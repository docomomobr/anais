abstract: "A experiência pioneira de pré‐fabricação realizada nos anos 1950 pela Uni‐seco do Brasil foi apoiada em patente desenvolvida durante o programa oficial de reconstrução inglesa no pós‐segunda guerra, quando se consolida na Europa campo prático para aplicação da arquitetura moderna, incorporando a racionalização e a pré‐fabricação. A patente é trazida ao Brasil, em contexto de grande euforia econômica, de modernização da construção, e otimismo com os recursos e as possibilidades da recente industrialização nacional. Caracterizada por sistema modular de componentes em ciclo fechado de produção, a Uni‐seco atendeu a programas de residências particulares, usos coletivos, como a sede de um clube e uma lanchonete no Parque Ibirapuera em São Paulo, e residências econômicas promovidas pelo Instituto de Pensões do Estado de São Paulo (IPESP). Com caráter experimental e propositivo de novos paradigmas, por uma nova arquitetura e por novos moldes de construção, contou com a participação do arquiteto Eduardo Kneese de Mello ‐ desencadeando alternativas em sua produção posterior, em sintonia com desenvolvimentos da arquitetura moderna brasileira, para maior industrialização na construção civil, em momento de maior respaldo e conhecimentos sobre a questão."
keyword: "Uni-seco; sistemas construtivos; arquitetura moderna; habitação; pré-fabricação"
