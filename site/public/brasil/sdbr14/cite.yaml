abstract: "Este artigo pretende refletir sobre o passado e o futuro da arquitetura moderna, a partir de uma abordagem mais abrangente, pautada pela relação homem-natureza, tema hoje fundamental frente ao crescimento da depredação do meio ambiente. A arquitetura moderna foi sempre afetada nesses momentos de catástrofe, apresentando um posicionamento crítico frente aos problemas do presente. Com esta intenção é construída uma inteiração entre internacional e local a partir da noção de Movimento Moderno, com o fim de identificar os aspectos específicos da arquitetura moderna produzida no Brasil e sua interlocução com a natureza, seja de adesão ou de confronto. A intenção é mobilizar uma postura mais cuidadosa e preservacionista tanto em relação ao legado do moderno, como em relação ao ambiente em que se insere e ao homem que nele habita."
