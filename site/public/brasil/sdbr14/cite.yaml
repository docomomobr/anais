language: pt-BR
abstract: "Nesta pesquisa, objetivando dar ênfase às praças projetadas no período moderno, identifica-se uma série de projetos referenciais, dentre os quais destacam-se aqueles elaborados por Roberto Burle Marx, tais como a Praça da Cidadania. Inicialmente, o presente artigo apresentará um panorama das contribuições do paisagista para o período moderno, tendo em vista que os seus projetos tiveram grande repercussão, no período, e que constituem importantes referências, para a história do paisagismo moderno brasileiro. A seguir, serão descritas as principais características da praça, objeto de estudo desta pesquisa. O procedimento técnico utilizado foi o de pesquisa bibliográfica, identificando-se os principais conceitos que orientaram o desenvolvimento dos projetos de Burle Marx. Contou-se, ainda, com análises relativas à Praça da Cidadania, cujo projeto possui um desenho paisagístico de significativa distinção. Na praça, identifica-se a formação de uma extensa paisagem, com base em uma composição entre superfícies pavimentadas e ajardinamentos, que conferem-lhe a característica de um espaço contínuo e diferenciado. Graças à autoria do desenho paisagístico de Burle Marx, a praça pode ser entendida como um exemplar significativo do paisagismo moderno brasileiro – o que justifica as ações, relacionadas ao resgate e à preservação do patrimônio arquitetônico e paisagístico, na universidade."
keyword: "arquitetura moderna; projeto referencial; praça"
