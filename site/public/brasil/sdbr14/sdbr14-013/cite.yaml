abstract: "Este artigo comenta os projetos e arquitetos do patrimônio moderno vistos no filme sul-coreano Columbus (2017), acerca das obras de arquitetura dessa cidade do Meio-Oeste dos EUA, bem como analisar criticamente aspectos da ampla, mas ao mesmo tempo sutil, abordagem por Kogonada do universo da arquitetura, do urbanismo e do arquiteto. Columbus não é apenas um filme sobre o Movimento Moderno, ou da preservação e celebração do Modernismo. Columbus é também um filme sobre o amor pela arquitetura, do amor pela emoção estética da arquitetura, pelo ideal moderno tão difícil de ser compreendido ou até mesmo aceito pelos leigos. Amor pelo aprender arquitetura e, portanto, também o amor pelo ensino da arquitetura."
