abstract: Apresentação de três projetos de dois arquitetos ainda pouco divulgados,
  Cassio Pinheiro Gonçalves e Ijair Cunha; formados respectivamente nas primeiras
  turmas das Faculdades de Arquitetura Mackenzie e da Universidade de São Paulo. Tiveram
  produtiva carreira em Ribeirão Preto na segunda metade do século XX, fazendo parte
  do processo de assimilação da arquitetura moderna naquela cidade. As obras são analisadas
  sob a perspectiva de sua contemporaneidade e sintonia com a arquitetura que vinha
  se afirmando naquele período e como obras que interagiram com elementos naturais
  dos ambientes e lotes em que se inseriram.
