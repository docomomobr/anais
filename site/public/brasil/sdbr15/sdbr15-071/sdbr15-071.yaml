abstract: A Ermida de Nossa Senhora da Piedade (1767-1787) ergue-se no cume da Serra
  da Piedade. O local logo ganhou fama por milagres, tornando-se destino de peregrinos,
  apesar das dificuldades de acesso e falta de instalações. Nomeado reitor do santuário
  (1949), Rosário Joffily solicitou a sua designação como patrimônio nacional (1955),
  juntamente com seu entorno. O frei, então, concebeu um centro de peregrinação bem
  equipado, incluindo um restaurante e uma igreja para 3.000 pessoas, e contratou
  Alcides Rocha Miranda para fazer o projeto. O arquiteto aproveitou os acidentes
  topográficos e as mudanças de nível para evitar a visualização da ermida ao lado
  dos novos edifícios. Com pedra ciclópica, concreto armado bruto e vidro temperado,
  a igreja evoca tanto uma tenda efêmera quanto uma rocha dura facetada. O conjunto
  leva à reflexão sobre as relações entre o crente individual, a comunidade religiosa
  e a natureza, a arquitetura sagrada e a liturgia, a linguagem culta e o gosto popular
  kitsch.
