abstract: O artigo trata da produção arquitetônica modernista na cidade de Santos
  no período 1930 a 1970 e procura relacionar a falta de reconhecimento e documentação
  de edifícios de menor destaque no ambiente urbano e cultural santista. A importância
  de inventariar essa arquitetura evidencia a necessidade de fortalecimento das políticas
  públicas de preservação, objetivando o olhar mais amplo e diversificado. Nessa perspectiva,
  este trabalho, enquanto parte de uma pesquisa de doutorado em desenvolvimento, pretende
  reunir elementos para uma compreensão alargada do patrimônio moderno santista, que
  contemple edifícios identificados com um perfil moderno estilizado ou popularizado,
  de modo que constitua um levantamento de dados indispensável para a criação de um
  inventário que garanta o reconhecimento dessa arquitetura como de interesse cultural
  e como forma de ampliar a percepção do cidadão, fortalecendo a memória coletiva.
keyword: arquitetura moderna santista; inventário; patrimonio cultural
