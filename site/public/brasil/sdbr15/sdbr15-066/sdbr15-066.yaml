abstract: Este artigo tem o propósito de apresentar o Projeto Urbanístico do traçado
  geométrico espacial de um recorte urbano na cidade de Uberlândia/MG, o Bairro Presidente
  Roosevelt. Seu estudo e pesquisa foi desenvolvido na Dissertação de Mestrado. Tem-se
  o intuito de apresentar o Bairro, sua concepção, sua aplicação projetual e sua implantação
  apresentando a realidade construída enquanto consolidação urbana. Seu Projeto Urbanístico
  de forma radial, concêntrica, fechada em si. Autoria do arquiteto mineiro João Jorge
  Coury, pioneiro na região de Uberlândia, que aplicava em seus projetos o conceito
  Modernista, movimento em crescimento no Brasil da década de 1950, período em que
  o projeto foi desenvolvido e implantado. Bairro oriundo do Urbanismo Moderno, produziu
  um traçado pouco ortodoxo, com largas avenidas, grandes retas e curvas, que o delinearam.
  Projeto Urbanístico que quebrou paradigmas, quando se refere ao traçado xadrez,
  presente em toda malha da cidade de Uberlândia.
