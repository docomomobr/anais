abstract: 'Este artigo analisa o edifício do antigo Othon Palace Hotel, projeto de
  Philipp Lohbauer construído entre 1947 e 1954 na Praça do Patriarca, centro de São
  Paulo. O argumento enfoca o cruzamento de três figuras fundamentais na constituição
  da modernização da cidade em meados do século XX: o imigrante, o arranha-céu e o
  hotel. Resultado parcial de um projeto de pesquisa, o texto tem como base metodológica
  a análise de documentos levantados em acervos institucionais e particulares, além
  de publicações de época sobre o edifício. Obra pouco conhecida de um autor praticamente
  desconhecido, o Othon Palace guarda sob os muros de sua austera arquitetura cruzamentos
  e elementos fundamentais para a compreensão da história arquitetônica, urbana e
  social do centro paulistano.'
