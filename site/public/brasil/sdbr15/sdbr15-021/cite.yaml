abstract: "Este trabalho tem como objetivo apresentar a Estação Rodoviária Deputado Wilson Roriz, localizada em Crato, Ceará. Busca-se destacar o edifício em relação ao contexto histórico do modernismo dos anos 1970, além de apresentá-lo de forma descritiva. A estação rodoviária do Crato é considerada um marco memorável da política de desenvolvimento regional, dos novos fluxos de migração e exemplo da arquitetura moderna cearense. Sua importância reside no fato de ter representado o crescimento urbano do município ao longo dos anos. Para esse estudo, foram utilizadas imagens, fotografias, plantas e desenhos técnicos, bem como mapas da cidade, além de consultas em jornais e livros a fim de descrever o objeto arquitetônico e seu cenário. Dessa forma, foi possível compreender a forma, função e o contexto histórico do edifício."
