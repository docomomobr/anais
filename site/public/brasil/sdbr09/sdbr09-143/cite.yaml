abstract: "Os trabalhos apresentados nessa sessão integram um conjunto de abordagens ao mesmo tempo próximas mas também independentes e variadas. O primeiro trabalho de autoria de três pesquisadoras da Universidade Federal da Paraíba (professoras Sonia Marques, Wylma Vidal e Roberta Costa) traz para o debate a comparação entre dois projetos residenciais elaborados pelos mesmos arquitetos para a orla de João Pessoa-PB. A partir de modos de vida diferenciados, os arquitetos apresentaram duas soluções diferenciadas no que diz respeito à introspecção espacial ou à manutenção da privacidade dos moradores ou, em outro caso, da abertura e informalidade dos espaços de convívio familiar e social. Nesse caso, o trabalho traz à tona uma abordagem comparativa de duas casas na mesma orla marítima e dos mesmos arquitetos mas com soluções diferentes.\n\nO segundo trabalho, de autoria de Marya de Sousa Aldrigue, seguindo a tradição metodológica inaugurada por Bill Hillier (Londres) e seus seguidores, faz uma análise de três projetos residenciais em que o caráter moderno é contraposto ao caráter autóctone em decisões projetuais cujas demandas particulares de membros de um mesmo grupo socioeconômico definem espacialidades diferenciadas. A sua contribuição inclui a exposição de uma análise projetual metódica em que a relação dos espaços interiores entre si e com os espaços exteriores ficam visíveis nos gráficos característicos da análise sintática espacial.\n\nO terceiro trabalho do professor e pesquisador da UFPB, Márcio Cotrim, se debruça sobre as questões que interferem na decisão do arquiteto ao fazer correlações dos espaços interiores com os espaços do entorno urbano imediato. Nesse sentido, o autor busca nas teorias urbanísticas desenvolvidas por membros dos Congressos Internacionais de Arquitetura Moderna (CIAMs) no período pós-Segunda Guerra, os argumentos projetuais de confluência dos espaços públicos urbanos na defesa de um core vivo coerente com o momento histórico e com os quais o autor faz analogias com as tipologias arquitetônicas adotadas pelo arquiteto Vilanova Artigas, em seus projetos residenciais dos anos 1970 na região paulistana do Jardins.\n\nO último trabalho, de autoria de Marta Camisassa, explora, a partir da forma de apresentação na mídia especializada do projeto da residência de Francisco Peixoto em Cataguases, MG, de autoria do arquiteto Francisco Bolonha, a análise de desenhos, correspondências e outros documentos para a compreensão das decisões projetuais adotadas pelo arquiteto e a importância desses registros para a documentação da arquitetura moderna brasileira."
