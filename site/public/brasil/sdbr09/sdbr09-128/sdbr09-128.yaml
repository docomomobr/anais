abstract: Este artigo procura descrever e interpretar o Palácio da Justiça, primeiro
  palácio moderno construído em Porto Alegre após vitória em concurso público no ano
  de 1952. A abordagem procura demonstrar a necessidade de atenção para com os aspectos
  disciplinares característicos da arquitetura (contexto histórico, questões documentais,
  atividades e percepção humanas, aspectos técnico-construtivos, aspectos compositivos),
  sem os quais a extensão à outras disciplinas perde sua validade. Ao relacionar o
  edifício com seu contexto e examiná-lo como resposta arquitetônica a seus condicionantes
  específicos, o artigo afirma a importância do Palácio da Justiça na introdução da
  arquitetura moderna alinhada com Le Corbusier e a Escola Carioca no Rio Grande do
  Sul.
