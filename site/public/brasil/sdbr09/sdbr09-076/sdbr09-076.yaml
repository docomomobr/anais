abstract: Trata-se de considerações acerca do processo de documentação do patrimônio
  cultural da saúde de caráter moderno, com obras projetadas em Santa Catarina pelo
  arquiteto Paulo Motta, egresso do Curso de Arquitetura da Escola Nacional de Belas
  Artes, ENBA. Discutimos as características desse patrimônio e a sua consolidação
  como campo constituído, bem como a contribuição da instituição carioca e dos profissionais
  ali formados para a produção de um conhecimento específico nesta área de projeto.
  Problematizamos aspectos conceituais e a temática da inclusão e a valorização de
  obras menos expressivas e de autores menos conhecidos, e sua participação como documentos
  da arquitetura para a saúde, revelando a polêmica das opções estéticas e a modernização
  das técnicas de tratamento e cura por meio de elementos de projeto. Consideramos
  ainda a participação dessas edificações na construção da paisagem de nossas cidades,
  principalmente fora dos grandes centros urbanos, e pinçamos os problemas das pesquisas
  desta ordem, com carência e dispersão das fontes documentais em arquivos diversos.
  Finalmente, apresentamos a trajetória do referido arquiteto, sua formação e atividade
  profissional, analisando alguns dos projetos desenvolvidos em território catarinense.
keyword: Patrimônio Cultural da Saúde; Arquitetura Moderna; Santa Catarina; Paulo
