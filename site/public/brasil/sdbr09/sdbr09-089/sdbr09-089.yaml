abstract: Este trabalho tem por objetivo expor a experiência de pesquisa e trabalho
  de preservação de coleções documentais junto ao Museu Universitário da Universidade
  Federal do Rio Grande do Sul. As referidas coleções referem-se à história e trajetória
  da Universidade, da “Faculdade de Filosofia”. O teor documental dessas coleções
  é variado, pois seu período se estende desde a década de 1920 a aproximadamente
  1970, assim como seus assuntos, contendo atas, correspondências e até mesmo textos
  e recortes jornalísticos e midiáticos. No decorrer do trabalho com esse acervo documental,
  podem-se destacar duas intervenções que foram feitas nele – a pesquisa e a conservação/restauração;
  que num futuro próximo se manifestarão no meio social e coletivo através da divulgação
  e comunicação desse trabalho buscando sua futura utilização por pesquisadores e
  comunidade em geral, caracterizando assim, a pesquisa museológica e a educação patrimonial.
