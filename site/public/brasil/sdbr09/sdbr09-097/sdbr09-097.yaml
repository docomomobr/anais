abstract: 'O artigo discute a Praça Maior da Universidade de Brasília, projeto elaborado
  por Oscar Niemeyer em 1962 e não executado. Para tanto, contextualiza a produção
  da “obra” e analisa três conjuntos de documentos: a Série da UnB (desenhos publicados
  pela Instituição), a Série Módulo (desenhos e fotos de maquetes publicados na revista
  Módulo) e a Série Original (desenhos originais arquivados no Centro de Documentação
  da Universidade de Brasília). Considerando a grande quantidade de documentos estudados,
  parte do artigo foi montada como uma seqüência de imagens comentadas e que ilustram
  dois processos particulares: o criativo de Oscar Niemeyer e o de publicação de suas
  obras.'
