abstract: 'O presente artigo visa tratar aspectos da arquitetura do Movimento Moderno
  enquanto estratégias de redesenho do espaço urbano brasileiro. A arquitetura moderna
  – ao objetivar se opor a cidade tradicional e usar a arquitetura como instrumento
  de mudança – busca meios de estabelecer novas espacialidades em áreas consolidadas
  e de expansão nas cidades. Os princípios que regem o movimento, tais como: a planta
  como geradora da forma, os cinco princípios da arquitetura propostos por Le Corbusier,
  a verticalização e a disposição platônica dos edifícios como objetos no espaço,
  são reinterpretados e reinventados para permitir sua materialização. Em cada uma
  dessas possibilidades as estratégias adotadas variam conforme as condicionantes
  sociais, legislativas e físicas, de forma a concretizar a utopia modernista. São
  identificadas e apresentadas de forma sintética diferentes táticas e esta são ilustradas
  a partir de exemplares concretos encontrados no país. O entendimento da arquitetura
  do Movimento Moderno como transformação do espaço urbano potencializa especialmente
  as intenções do discurso modernista e permite estabelecer novos parâmetros para
  a preservação deste patrimônio.'
keyword: Arquitetura Moderna; Redesenho; Espaço Urbano
