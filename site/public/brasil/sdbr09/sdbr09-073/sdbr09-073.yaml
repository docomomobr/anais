abstract: Através de um estudo comparativo entre a Caixa d’água de Olinda (Luiz Nunes,
  1936) e o Instituto de Zoologia de Nancy (Jacques e Michel André, 1933), o presente
  artigo trata de comparar as experimentações de novas estéticas a partir de sistemas
  modulares. Por um lado, a Caixa d’água representa a primeira utilização em grande
  escala dos cobogós e, por outro lado, o sistema construtivo da fachada do Instituto
  de Zoologia é uma reinterpretação do textile-block de Frank Lloyd Wright. Numa mesma
  época, nos anos 30, sem ligação direta, esses arquitetos, já bastante envolvidos
  com o movimento de vanguarda, desenvolveram as mesmas preocupações para a construção
  de fachadas que produzem efeitos plásticos similares. As investigações dos arquitetos
  orientam-se, assim, para uma composição da fachada baseada na utilização do bloco
  cimento. Se as soluções inovadoras propostas para esses dois edifícios podem ser
  atribuídas ao entusiasmo próprio desses jovens arquitetos, a semelhança dos questionamentos
  e os caminhos tomados são seguramente provenientes de um clima ideológico internacional.
  Assim sendo, tentaremos demonstrar até que ponto a aplicação de um sistema modular
  constitui uma resposta estética aos questionamentos induzidos pelo movimento moderno
  e como uma análise comparativa pode revelar-nos diferentes contextos culturais e
  os seus respectivos desafios.
