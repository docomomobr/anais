abstract: "Este trabalho propõe-se a analisar como as propostas de ensino de Anísio Teixeira concorreram para a materialização da arquitetura escolar de Brasília, especificamente, através de duas obras do arquiteto José de Souza Reis: a Escola-Parque 307-308 Sul (c. 1958) e o Centro de Educação Média “Elefante Branco” (c. 1959)."
