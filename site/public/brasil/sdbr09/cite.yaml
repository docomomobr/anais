abstract: "(*) Professora emérita aposentada Universidade de Brasília, Pesquisador Associado da Universidade de Brasília SQN 311 BL G apto 106 – CEP 70757-070- Brasília DF-igcosta@unb.br (**) Geógrafa. Doutora em Geografia.Pesquisadora do IRD- França. Bol.Magenta,147- Paris 75010 Sumário: Brasília é uma cidade nova construída em meados do século XX, expressão do Movimento da Arquitetura Moderna que se desenvolveu no  século passado no Brasil e no Mundo, o que  a tornou  patrimônio cultural da humanidade desde 1987. A partir de então, Brasília vive a contradição e o ajuste entre a lógica da preservação do patrimônio e o processo de desenvolvimento que afeta as cidades de seu tempo. Brasília expandiu-se pelo território de forma dispersa e fragmentada, formando um aglomerado urbano de cerca de 3,5 milhões de habitantes, à semelhança das metrópoles contemporâneas. O trabalho chama a atenção para a questão da preservação do Patrimônio da Humanidade face aos riscos do aglomerado."
