language: pt-BR
abstract: "A falta de interesse e desconhecimento por parte das autoridades e da sociedade civil do seu acervo histórico tem provocado uma perda irreparável. A ampla maioria dos inventários patrimoniais de cidades de pequeno e médio porte não tem dado muita atenção às obras de uma linguagem moderna, pelo que pode ser constatado em consulta à lista de obras inventariadas (móveis e imóveis) nos documentos do Instituto Estadual do Patrimonio Histórico e Artístico (IEPHA). Diante deste quadro, mesmo com a repercussão internacional em meados do século XX, as muitas lacunas sobre a produção brasileira exigem uma ação imediata dos pesquisadores. Essa lacuna pode impressionar quem pesquisa a arquitetura da Zona da Mata mineira. A cidade de Viçosa, por exemplo, vem recebendo uma forte influência externa com o constante fluxo de pessoas desde a fundação, em 1926, da Escola Superior de Agricultura e Veterinária (ESAV, hoje Universidade Federal de Viçosa/UFV), quando foi criada uma demanda por novas instalações e serviços. Atualmente, a eliminação de muitos exemplares de linguagens eclética e moderna é notória como resultado imediato da especulação imobiliária em andamento. O presente trabalho objetiva apresentar uma análise suscinta de algumas das obras com linguagem moderna dos municípios na região de Viçosa e assim contribuir na tentativa de acrescentar argumentos para a salvaguarda de alguns desses exemplares."
keyword: "Arquitetura Moderna; Viçosa; Zona da Mata mineira; inventário"
