language: pt-BR
abstract: "Esta mesa é dedicada à contribuição de quatro estrangeiros à construção da cultura moderna brasileira. Aspectos das trajetórias e obras do lituano Lasar Segall, do franco-suíço Le Corbusier, dos italianos Lina Bo e Pietro Maria Bardi, são aqui analisados através de diferentes enfoques. Envolvem a relação entre arquitetura e museografia, viagem, urbanismo e cultura presentes na atenção dos autores a esses quatro personagens.\n\nO trabalho \"A forma a partir do espaço em uso, construções de Lina Bo Bardi\" reflete sobre o papel peculiar dessa arquiteta na cultura arquitetônica brasileira. Lina introduziria aqui uma concepção na qual a arte e a arquitetura são desenvolvidas para uma inserção na vida cotidiana. Com esse objetivo, arquitetura e desenho industrial constituem faces de uma mesma ação. A autora procura na origem italiana da arquiteta as razões dessa posição, mas a encontra no diálogo direto com outros arquitetos, tal como o alemão Walter Gropius e sua teoria do design.\n\nÉ clara a complementariedade deste trabalho com o \"MASP — museu laboratório: museu e cidade em Pietro Maria Bardi\". Aqui, o autor se dedica a identificar a presença da concepção corbusiana no MASP, recorrendo aos conceitos de \"Síntese das Artes\" e de \"Coração da Cidade\". O MASP seria esse laboratório de experimentação proposto por Corbusier, que propicia a investigação e a apresenta à cidade em um lugar de destaque.\n\nAo identificar os vínculos de Lina e Pietro com Gropius e Corbusier, os dois trabalhos nos propõem uma aproximação entre duas concepções que se embatiam como opostas no Brasil da década de 1950. Uma aproximação que talvez só fosse possível a dois estrangeiros. Os dois trabalhos seguintes apresentam algumas intersecções, ainda que indiretas, com estes dois primeiros.\n\n\"Le Corbusier voyageur — arquivos de uma experiência arquitetônica\" enfoca as viagens sul-americanas do arquiteto. A autora questiona algumas interpretações consagradas, como os paralelos entre a experiência da viagem e o caráter cinético da Promenade Architecturale (Von Moss) e propõe que seu objetivo foi o de \"instigar a desnaturalização e instaurar o estado de juízo: um convite à experiência do sublime\".\n\nA relação entre museu, arquitetura e arte é o objeto principal de \"Museu Lasar Segall: diálogo e identidade na arquitetura dos museus\". Nele a autora procura encontrar identidades entre a arquitetura que sedia o museu, de autoria de Gregori Warchavchik e a obra pictórica do artista. Objetivo difícil, pois apesar de ambos estarem identificados ao modernismo, a arquitetura é de caráter racionalista e a pintura expressionista. Entretanto, se analisadas pelo seu papel no movimento de modernização cultural paulista e brasileira, as diferenças perdem a força que teriam nos seus países de origem.\n\nDentro dessas diferenças e complementariedades, os quatro trabalhos oferecem um instigante painel da atuação estrangeira na constituição do moderno no Brasil."
