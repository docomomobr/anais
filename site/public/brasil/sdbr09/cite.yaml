abstract: "O tema desta mesa é patrimônio recente e circulação cultural e o fio condutor dos trabalhos aqui apresentados é a recepção e difusão ou recepção x difusão da arquitetura moderna brasileira e a preservação do patrimônio recente. Todos os artigos aqui apresentados trataram da recepção ou difusão da arquitetura moderna brasileira, explicitamente ou implicitamente, no Brasil ou no exterior.\n\nO primeiro trabalho da coordenadora dessa mesa, Maria Beatriz Camargo Cappello, intitulado \"Recepção e Difusão da arquitetura moderna brasileira nos números especiais das revistas especializadas europeias (1940-1960)\", apresenta como ocorre a recepção da arquitetura moderna brasileira nos números especiais das revistas europeias selecionadas, revelando as leituras de seus diretores, editores, autores e colaboradores.\n\nO segundo trabalho de Ana Esteban Maluenda, intitulado \"Ecos de samba: el papel de Brasil en la puesta al dia de la arquitectura española con la internacional (1950-1965)\", apresenta como se dá a recepção e difusão da arquitetura moderna brasileira na Espanha por meio dos artigos publicados nas revistas especializadas espanholas.\n\nO terceiro trabalho de Carla Mirella de Oliveira Cortês e Fernando Diniz Moreira, intitulado \"Moderno Brasileiro em Moçambique, 1950-1975: a importação de uma imagem\", trata da difusão da arquitetura moderna brasileira por meio da fotografia publicada em livros e periódicos entre 1940 e 1960 e sua recepção em Portugal e novamente sua difusão em Moçambique levada pelos arquitetos portugueses.\n\nO quarto trabalho de Clara Luiza Miranda, intitulado \"A Arquitetura moderna brasileira: experiência e expectativa da modernização do Espírito Santo\", trata da recepção e difusão da arquitetura moderna brasileira no Espírito Santo. Para a análise da atuação do grupo capixaba de arquitetos modernos são considerados seus relatos, escritos e contemporâneos, assim como sua obra arquitetônica.\n\nO quinto trabalho de Guilah Naslavsky e Sonia Marques, intitulado \"Recepção x difusão: reflexões para preservação do patrimônio recente\", tem como proposta utilizar a teoria da recepção para uma leitura da história da arquitetura moderna no Brasil, demonstrando como a teoria da recepção se aplicaria para o estudo da modernidade em três capitais nordestinas: Recife, Natal e João Pessoa e como se aplicaria na prática da preservação, propondo uma reflexão de como atuar num processo de valorização do patrimônio de uma maneira geral.\n\nPodemos assim perceber que os trabalhos estão amarrados em suas propostas de análise pela recepção e difusão da arquitetura brasileira mostrando suas diferentes interpretações sobre o patrimônio recente e sua circulação cultural."
