language: pt-BR
abstract: "Deslocamento, fluxo, mobilidade, são alguns entre tantos termos que evidenciam um fenômeno que se percebe no difuso cenário da arquitetura moderna no século 20. Processos que contemplaram o movimento de gente, ideias, valores, vocações, sucessos e fracassos. A América foi um território por excelência de transposições: extensão virgem, inspiração para utopias, solo para colonizar, terra de oportunidades, para \"fazer a América\".\n\nNão poderia ser diferente na América do Sul. No Brasil, as várias escalas de transposições também se apresentaram: entropias, trocas ou interlocuções intercontinentais, internacionais, nacionais, regionais, locais. No quadro peculiar da Arquitetura, do Urbanismo e do Paisagismo, o revolver personagens, lugares e trajetórias configura uma fascinante narrativa e uma cartografia a elaborar. Trata-se de um mapeamento cuja documentação básica se situa num contexto igualmente disperso e descontínuo no espaço e no tempo.\n\nOs trabalhos que se apresentam nesta mesa são aproximações acerca dos deslocamentos, fluxos, mobilidades. Peculiares e distintos em suas feituras, porquanto não concebidos necessariamente sob esses eixos condutores. Todavia, ostentam substratos em diálogo: a mobilidade dos atores e coadjuvantes, centralidades e não-centralismos, a circulação de valores, conceitos, ideias, ideologias. As comunicações resgatam tensões e conflitos que marcaram as transmutações sociais e culturais que esses arquitetos vivenciaram. Profissionais que contribuíram para a transformação das realidades que encontraram, sem necessariamente atribuir-lhes mitológica condição de protagonistas das mudanças — contudo, sem dúvida, agentes significativos.\n\nNas últimas duas décadas e meia o surgimento e desenvolvimento de programas de mestrado e doutorado em Arquitetura e Urbanismo vêm contribuindo sobremaneira pela constituição de um conhecimento específico em nosso campo de reflexão e atuação. A expansão do sistema universitário de pós-graduação não é um fenômeno peculiar brasileiro. Mas a dispersão territorial dos programas é uma dimensão própria afirmativa desse fenômeno. Em um país de dimensões continentais, a relativa centralização da produção do conhecimento no Rio de Janeiro e em São Paulo, e nos heroicos esforços nos poucos cursos de Arquitetura em algumas capitais décadas atrás, não davam e não dão conta de mapear este enorme território a merecer rigoroso escrutínio. Falta muito a fazer. Os pesquisadores da presente mesa, de uma outra forma, fazem parte desse recente quadro de qualificação científica num contexto de mobilidade. Também são personagens de deslocamentos e fluxos. Estamos em uma meta-mesa."
