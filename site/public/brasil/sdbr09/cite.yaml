abstract: "O tema desta mesa tem um grande leque de abordagens mas, aqui o enfoque será restrito aos recortes apresentados pelos autores de cinco artigos aprovados pelo Comitê Científico para apresentação.\n\nO primeiro artigo, de Maria Luiza Adams Sanvitto, aborda um trabalho de autoria de um dos ícones da arquitetura brasileira, João Vilanova Artigas e equipe. Embora não tombado, é referência nacional de conjuntos residenciais. A grande dimensão deste empreendimento revela semelhanças com Brasília no que diz respeito à repetição, configuração urbana e intenções tecnológicas.\n\nO trabalho seguinte, de Alcilia Afonso, trata igualmente de conjunto habitacional mas, desta vez, na Espanha. A cuidadosa análise e documentação do autor revela-se como uma antítese ao Conjunto Habitacional BNH. Este trabalho tem aspectos que vale destacar: a preocupação com a individualidade do morador, a criação de espaços gregários em que dois indivíduos possam se encontrar e conversar em contraposição à visão transformadora da sociedade que persegue a criação de espaços para a multidão, para as massas, a todo custo.\n\nO terceiro artigo, de Jorge Guilherme Francisconi, aborda Brasília e discute o tombamento da cidade e sua inscrição como patrimônio da Humanidade pela UNESCO e suas implicações atuais. A discussão aborda a questão do engessamento vs. desenvolvimento urbano e a necessidade de especificação precisa dos conceitos urbanísticos de Lúcio Costa.\n\nO quarto artigo, de Célia Castro Gonsales, aborda a questão dos Planos Diretores face à preservação do patrimônio cultural e demonstra, com o exemplo de Pelotas, RS, a possibilidade de usar este instrumento para \"a criação de Áreas Especiais de Interesse do Ambiente Cultural (...) que abrangem todo o território\". Esta visão supera, em parte, as limitações de Plano Diretor, adstrito a áreas urbanas.\n\nO quinto trabalho, de José Galbinski, abre uma discussão sobre o conceito de função social da propriedade, tal como comparece no texto da Constituição, Art. 182, com vistas aos Planos Diretores Municipais. Em uma primeira leitura, a inclusão da expressão pode ser entendida como um avanço. No entanto, esta parece ser uma conclusão apressada. Conforme incluída na Carta Magna, a expressão tem um conteúdo ambíguo, por vezes vazio e sua vinculação aos planos diretores representa um retrocesso, um retrocesso cognitivo."
