abstract: "Entre os educadores brasileiros, Anísio Teixeira (1900-1971) é aquele a quem a arquitetura nacional mais deve. Durante as décadas de 1920-30, ele esteve no centro dos debates entre a Pedagogia Nova e a Escola Tradicional e em torno de questões relacionadas à escola pública, leiga, universal e gratuita. Na condição de Secretário de Educação e Saúde Pública do Distrito Federal — e imbuído pelo mesmo espírito racionalista que envolveu e motivou os arquitetos modernos — solicitou em 1934 a Enéas Silva e, em 1935 a Affonso Eduardo Reidy, projetos de escolas eficientes e funcionais. A partir de então a escola pública passou, necessariamente, a ser moderna.\n\nNo caso específico de Brasília — cidade onde todas as escalas foram projetadas — as escolas foram desenhadas a partir de 1957 e representam uma amostra significativa do experimentalismo e do vigor de nosso modernismo. Não se pode falar de escolas em Brasília sem falar das escolas-parque, dos jardins de infância e das escolas-classe. Embora o sistema educacional proposto por Anísio Teixeira — composto por esses três tipos de estabelecimentos de ensino — nunca tenha funcionado de maneira plena, o patrimônio escolar moderno de Brasília constitui um dos mais significativos de nosso país.\n\nAs obras e experiências selecionadas para a discussão desta mesa representam um significativo acervo — público e privado — e são igualmente testemunhos de diferentes práticas e processos, fontes documentais utilizadas para a compreensão, valoração e preservação do patrimônio escolar moderno brasileiro."
