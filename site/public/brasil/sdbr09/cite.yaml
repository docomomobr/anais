abstract: "Arquitetura moderna em muitas cidades da América Latina ajudou a formar um imaginário de modernização e progresso, independentemente da expressão política dos seus governos. Coincidindo com um período de grande produção construtivo, as obras estão espalhados por cidades, não apenas grande, mas também colonizaram o interior dos territórios. A cidade de Santa Fé, capital duma provincia da Argentina, recebeu uma quantidade significativa de edifícios de alta qualidade e linguagem moderna, e outras cidades do interior e do território como um todo. A lista das mais valiosas, a sua ordenação e classificação, é uma tarefa importante que, enquanto no processo, espera contribuir para o conhecimento e apreço delas a partir do presente e daqui para frente."
