abstract: "A exposição e o catálogo Brazil Builds — Architecture New and Old chancelaram internacionalmente a qualidade da arquitetura brasileira, particularmente a moderna. A seleção de obras incluída na mostra e publicação despertou o interesse, a atenção e a curiosidade do mundo para a qualidade de uma determinada produção nacional. Na área do lazer, Brazil Builds incluiu o conjunto da Pampulha, de Oscar Niemeyer, e a Associação Brasileira de Imprensa, de Marcelo e Milton Roberto. Ao longo da segunda metade do século XX a arquitetura brasileira somou um acervo significativo — e ainda pouco estudado — de espaços para o esporte e o lazer. Não nos referimos aos estádios, piscinas e quadras poliesportivas, mas aos espaços projetados com o requinte do projeto e da experimentação.\n\nO estudo do Pampulhão — Ginásio do Clube Atlético Mineiro — marca um pouco a síntese da proposta da mesa. Trata-se de um edifício importante e polêmico com um grande conteúdo cívico — como a maioria das grandes instalações esportivas — que com a mudança de uso sofreu alterações e corre risco, como muitas obras relevantes do patrimônio moderno brasileiro.\n\nEspaços de esporte e lazer foram sempre importantes para a afirmação simbólica e identitária das cidades brasileiras. As obras e experiências selecionadas para a discussão desta mesa representam um significativo acervo — público e privado — e são igualmente testemunhos de diferentes práticas e processos, fontes documentais utilizadas para a compreensão, valoração e preservação do patrimônio moderno brasileiro."
