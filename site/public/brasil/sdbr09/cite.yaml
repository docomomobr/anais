URL: "https://zenodo.org/records/19073705/files/sdbr09-048.pdf"
language: pt-BR
abstract: "O artigo trata da construção do edifício modernista Santana, em 1936, situado em Campinas (SP). Contando com apenas seis pavimentos de altura, o edifício tornou-se um ícone de modernidade, sendo laureado publicamente com o título de primeiro arranha-céu da cidade. Sua construção inaugura o processo de modernização do espaço urbano da cidade, que já vinha sendo delineado através da implantação de um plano de urbanismo elaborado a partir de 1934 com a contratação, pela prefeitura do município, do urbanista Prestes Maia, O edifício foi projetado e construído pelo engenheiro civil Lix da Cunha, responsável por um dos mais respeitados escritórios de engenharia da cidade. O edifício de arquitetura asséptica e linguagem estética do art déco, projetado com um novo sistema construtivo do concreto armado e dedicado exclusivamente ao uso comercial, estabelece um marco físico e simbólico no processo de transformações pelas quais a cidade passava. A cidade, que da segunda metade do século XIX até princípio do século XX fora importante centro econômico do país e responsável pela produção da maior parte do café exportado, supera os problemas econômicos advindos da crise de 1929 e as sucessivas oscilações do mercado do café, incentivando um processo de industrialização que alteraria por completo a paisagem física da cidade. A imagem de progresso e modernidade que a cidade buscava transmitir estava indubitavelmente aliada à arquitetura do Santana. Ter como endereço comercial o edifício Santana denotava aos profissionais locatários ou proprietários status de modernidade. O edifício foi tombado pelo órgão de preservação cultural local, como importante exemplar da arquitetura modernista de Campinas."
keyword: "arranha-céu; arquitetura modernista; art-déco; Plano de Melhoramentos Urbanos de Campinas"
