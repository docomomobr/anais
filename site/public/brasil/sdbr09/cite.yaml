page: "1-3"
URL: "https://zenodo.org/records/19099207/files/sdbr09-142.pdf"
language: pt-BR
abstract: "A documentação do patrimônio arquitetônico é a base de toda e qualquer pesquisa de qualidade em nosso campo. Mas os documentos não falam por si mesmos: aguardam ser interpretados. E como bem relembra Marina Waisman, \"se bem os objetos da reflexão provenham da realidade, a problemática que comportam não se revela neles de um modo direto e evidente; será a reflexão que há de descobrir ou revelar problemas e questões que subjazem na realidade fática, pois o ato de formular questões ou perguntas se apoia em conceitos, em ideias; com base neles é que se produzem as descobertas; e logo será a práxis que responderá — positiva ou negativamente — às perguntas ou exigências formuladas pela reflexão\" (El interior de la história, Bogotá: Escala, 1990, p. 35).\n\nOs documentos, que incluem as próprias obras de arquitetura — que também são documentos fundamentais e da maior importância e densidade para nosso campo de estudos — aguardam pacientemente por nossas reflexões. Mas os documentos jamais serão esgotados por elas: a qualquer momento um outro olhar poderá lhes dar uma nova vida. Os mesmos documentos, iluminados agora por outras perguntas, sugerirão novas precisões e outras revisões, que podem construir desde contribuições singelas a proposições revolucionárias. Mas para que isso ocorra, é preciso se permitir fazer novas perguntas, e buscar maneiras de respondê-las, a partir do respeito aos documentos — mas não, necessariamente, das construções teóricas que anteriormente os iluminaram. A documentação é a base imprescindível; mas sem a interpretação, documentar poderá ser apenas uma intumescência no campo. Juntamente com a inquietação e a dúvida, que nascem indisciplinadas — mas precisam crescer e se afirmar de forma rigorosa e sistemática — a documentação poderá de fato cumprir seu papel de motor para a promoção, ampliação e revisão do campo.\n\nCada um dos trabalhos desta mesa se propõe não apenas documentar, mas também a aprender dos documentos, e a partir de seu estudo, e de algumas ideias imaginativas, arriscar análises, propor interpretações, ativar comparações; podem até mesmo questionar o próprio ato de documentar, sugerindo que, mais do que simples coleta, pode ser conveniente documentar de forma a sistematizar informações que, por sua vez, permitam outras moradas, que se nasçam dos fatos, mas chegue mais além. Como diria Tafuri estes trabalhos se propõem, simplesmente, ultrapassar o que os documentos mostram, e tentar sondar o que ocultam."
