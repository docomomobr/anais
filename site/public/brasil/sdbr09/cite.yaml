abstract: "Enquanto o Brasil construía o maior monumento do modernismo funcionalista, boa parte das teorias que lhe davam sustentação passaram a ser questionadas. Em 1954, Philip Johnson proferiu a palestra intitulada \"The Seven Crutches of Modern Architecture\" que, no fundo, questionava os postulados funcionalistas vigentes. No mesmo ano, Ernesto Nathan Rogers pleiteou a construção das pré-existências ambientais e propôs o debate acerca da relação entre a arquitetura moderna e a tradição. Em 1961 — um ano depois da inauguração de Brasília —, Jane Jacobs publicou \"The Death and Life of Great American Cities\".\n\nA cidade moderna que surgia no Planalto Central propunha a ampliação do repertório, extrapolando o vocabulário e a sintaxe do modernismo funcionalista. Do ponto de vista do urbanismo, a cidade propunha soluções radicais para o embate do coletivo versus o individual, do público versus o privado, da natureza versus o construído.\n\nA mesa reúne cinco trabalhos que abordam, sob ângulos distintos, questões relacionadas a Brasília, ao urbanismo moderno e à sociedade: o que trata do Plano Piloto e seus paradigmas urbanísticos; o que discute a expansão metropolitana; o que analisa a relação entre a preservação e o desenvolvimento; o que reflete sobre a preservação da cidade; e, por fim, o que especula sobre a evolução das superquadras da Capital."
