title: "Disseminação da Arquitetura Moderna: deslocamento, fluxo, mobilidade"
container-title: "9º Seminário Docomomo Brasil, Brasília, 2011"
event-title: "9º Seminário Docomomo Brasil, Brasília, 2011"
event-place: "Brasília"
