abstract: "A noção de inventário, hoje, não está ligada apenas à catalogação, estende-se a uma ação capaz de incentivar o diálogo, estimular a reflexão, a pesquisa e a proteção dos bens patrimoniais. A complexidade deste trabalho — que envolve a identificação dos vínculos entre arquitetura, contexto urbano e práticas sociais —, exige uma ação interdisciplinar e interinstitucional, que relaciona diferentes atores. Esta mesa tem por objetivo discutir conceitos e práticas, avaliando resultados e vislumbrando novos horizontes para documentação, pesquisa e reflexão, como instrumentos de preservação.\n\nNeste contexto, \"Arquitetura moderna em Goiânia: desafios e limites da documentação para a preservação\" apresenta um inventário vinculado à pesquisa e à extensão, que envolve as Universidades locais e o IPHAN, introduzindo a discussão sobre os desafios e os limites do trabalho de pesquisa e de documentação para a preservação de um acervo moderno que, embora amplo, não está consolidado como patrimônio cultural da cidade. \"Documentos da arquitetura moderna em Teresina, Piauí\" trata das fontes documentais relativas à produção arquitetônica moderna nessa cidade, destacando o inventário como instrumento de identificação, documentação e valorização da Arquitetura Moderna teresinense. \"Arquitectura moderna en la obra pública: un catálogo para Santa Fé\" apresenta o processo de elaboração de um catálogo de obras públicas modernas na cidade de Santa Fé, Argentina, construídas entre os anos 1935-1955.\n\n\"Um percurso em um bairro moderno\" simula um percurso no bairro de Higienópolis na cidade de São Paulo, tratando de suas origens e de sua evolução morfológica, tendo como foco a arquitetura e suas características. Na forma de fichas técnicas apresenta, por amostragem, os edifícios modernos existentes no bairro. Tanto em Goiânia, como em Teresina, Santa Fé e Higienópolis, a questão urbana é fortemente abordada, pois enfocam períodos de grande produção construtiva, que contribuem para caracterizar novas paisagens culturais no contexto das cidades.\n\nO último trabalho, \"Os inventários como instrumentos de preservação: da identificação ao reconhecimento\", faz o fechamento da mesa ao discutir as mudanças ocorridas no processo metodológico dos inventários e sua relação com as alterações de reconhecimento do patrimônio; o papel da interdisciplinaridade para o completo entendimento da arquitetura como bem cultural e a complexidade de ações que assume o inventário, hoje, como ferramenta que auxilia em propostas de preservação e valorização do patrimônio em sua relação urbana."
