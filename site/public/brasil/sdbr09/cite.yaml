abstract: "O texto reflete sobre preservação e valor documental da arquitetura moderna, destacando a importância da produção pregressa como subsídio à reflexão acadêmica. Utiliza para este fim a residência Casado d’Azevedo, construída em Porto Alegre no ano de 1950: um exemplo das intervenções sem critérios que grassam, desfigurando o patrimônio recente. Esta casa é um testemunho da propagação da linhagem corbusiana até a distante Capital gaúcha, fato ocorrido através da influência exemplar da Escola Carioca sobre o restante do País naquele momento. O trabalho recupera um conjunto de arranjos residenciais promissores desenvolvidos na arquitetura moderna brasileira da década de quarenta, abandonados precocemente no começo dos anos cinqüenta. Eram casas que apresentavam composições volumétricas com sombreamentos e continuidade espacial entre os pavimentos, o que resultava da disposição da circulação vertical e dos arranjos espaciais. O germe daquela experiência brasileira encontrava-se em duas residências projetadas por Niemeyer em 1942: a casa Chico Peixoto, em Cataguazes, e sua casa na Lagoa Rodrigo de Freitas. Especialmente a segunda adotava a Villa Savoye como modelo mais literal, na qual Le Corbusier havia fundido pioneiramente os conceitos de “alveolaridade” e promenade architeturale por ele criados nos anos vinte."
