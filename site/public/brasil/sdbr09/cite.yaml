language: pt-BR
abstract: "É evidente que o fator humano tem desempenho relevante sobre a arquitetura.  As sociedades buscam na arquitetura um reflexo das suas condições temporais, através da manifestação de formas originais de expressão ou pelas tentativas de copiar épocas passadas. No entanto, há acontecimentos que são influenciáveis exclusivamente por motivos arquitetônicos e podem ser avaliados somente sob uma história específica da arquitetura, dotada de crescimento próprio e independente. Do mesmo modo, o conhecimento arquitetônico específico pode se definir como um conhecimento de problemas arquitetônicos característicos de um contexto determinado. Conhecer soluções arquitetônicas é conhecer a estrutura formal dessas realizações, as relações geométricas que as caracterizam e os atributos figurativos que apresentam. Através desse conhecimento disciplinar autônomo é possível o entendimento de ciclos de vida e morte das formas - metamorfoses formais, transformações de estilo. Sob este viés, a estrutura tipo Dom-ino, desde sua criação por Le Corbusier em 1915, vem sofrendo variações sobre o seu paradigma: transformações dominóicas. Em São Paulo, são identificadas com a produção mais exemplar da Escola Brutalista Paulista que se inicia a partir de 1960 – a transformação de um sistema de placas e pontuação colunar em um sistema de grelhas estruturais e concentração de apoios. Esse artigo se propõe a comparar duas importantes variantes de Dom-ino em solo paulista, que se apresentam semelhantes em termos de resultados espaciais, mas conceitual e estruturalmente distintas: quando a ênfase recai na estrutura recuada em relação ao volume exterior ou quando a ênfase recai nos grandes muros portantes, tendo como estudo de caso duas casas exemplares de Paulo Mendes da Rocha com referências na obra corbusiana. Nessa perspectiva, o artigo estabelece um comparativo entre espaços “sanduíche”- na casa do Butantã (1964-66) e na casa Shodan (1952) e entre espaços “megaron”- na casa Mario Masetti (1968) e nas Villas corbusianas dos anos 1920."
keyword: "autonomia disciplinar da arquitetura; transformações formais"
