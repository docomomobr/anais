page: "1-15"
URL: "https://zenodo.org/records/19073745/files/sdbr09-061.pdf"
language: pt-BR
abstract: "As décadas do pós-guerra na cena internacional foram marcadas por uma nova sensibilidade arquitetônica que advogava a exposição direta dos materiais e dos elementos tectônicos, o resgate de materiais tradicionais, a preferência por jogos de volumes mais dinâmicos e o uso extensivo do concreto. Essa postura, comumente chamada de Brutalismo, procurava sinalizar uma alternativa a um suposto modernismo universal, buscando uma maior relação com o lugar, sua história e seus saberes construtivos. O trabalho demonstra como ocorreu esse diálogo formal dessa sensibilidade construtiva com a arquitetura produzida em Pernambuco entre 1965-1980. A partir de meados da década de 1960, os arquitetos locais passaram a utilizar aspectos dessa sensibilidade construtiva em diálogo tanto pela arquitetura internacional como pela paulista, sem descartarem as heranças modernas locais desenvolvidas particularmente por Delfim Amorim e por Acácio Borsoi, arquitetos que desde a década anterior tinham estabelecido as bases da arquitetura moderna local. O artigo analisa essa produção arquitetônica com enfoque nas relações de forma e volume por meio de três eixos principais: o uso de materiais aparentes, particularmente o tijolo e o concreto; as reentrâncias, saliências e destaques volumétricos, e a exploração dos elementos construtivos e estruturais. Fazem parte desse universo obras de Frank Svensson, Marcos Domingues, Reginaldo Esteves, Vital Pessoa de Melo, Sena Caldas \u0026 Polito e Maurício Castro, além de trabalhos de Amorim e Borsoi. Além da historiografia sobre o período indicado, para embasar nossa análise foram utilizados escritos de teóricos contemporâneos, como Kenneth Frampton e Gevork Hartoonian."
keyword: "Arquitetura brutalista, arquitetura do pós-guerra; arquitetura de Pernambuco"
