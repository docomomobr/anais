abstract: "La arquitectura religiosa toma nuevo auge en el siglo XX a raíz del Concilio Vaticano II en México, se crean nuevas tipologías arquitectónicas, formadas por estructuras que permiten generar plantas libres, aprovechando la tecnología del concreto armado y de la geometría reglada, dando como resultado cubiertas de poco espesor y nuevas formas, creando símbolos inéditos en la arquitectura religiosa. Fue así como los arquitectos Enrique de la Mora y Félix Candela, unidos en algunas ocasiones al arquitecto Fernando López Carmona inician en la ciudad de México una  etapa en la creación de estructuras ligeras aplicadas a templos católicos como El Altillo en la ciudad de México y el Santuario de la Virgen de Guadalupe en Madrid; y con esas características proyectan para la ciudad de San Luis Potosí, los templos de la Santa Cruz, la capilla del Colegio México, el de Tequisquiapam, San Pío X y Jesucristo Sumo y Eterno Sacerdote, obras inéditas que revolucionaron las formas tradicionales de la arquitectura y que trajeron la modernidad a la ciudad. La documentación y puesta en valor de estos templos permitirá su conservación."
