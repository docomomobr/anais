abstract: "O texto examina como a diversidade de conceitos e enfoques acerca do Movimento Moderno se rebate no desenvolvimento dos trabalhos nas disciplinas de projeto. A base principal desta leitura é a produção dos alunos de períodos mais avançados do curso de Arquitetura (em trabalho final de graduação principalmente). Demonstramos que, ao menos nos projetos analisados, persistem procedimentos e resoluções tipicamente modernos, só que ao produto final são algumas vezes acrescentados elementos (aditivos) inspirados nas correntes contemporâneas. Nos memoriais descritivos, no entanto, são praticamente inexistentes referências a conceitos ou métodos modernistas. E quando estes se fazem presentes, revelam a confusão e a fragilidade dos fundamentos teórico-metodológicos na prática do projeto. Essa dialética da permanência / ausência do moderno nos trabalhos acadêmicos, bem como suas possíveis razões, constituem o objeto desta discussão. “Com este ‘pós’ querem os protagonistas se desfazer de um passado (...). Não é a primeira vez que a arquitetura moderna é dada como morta – e no entanto ela ainda vive”. Juergen Habermas (1)1"
