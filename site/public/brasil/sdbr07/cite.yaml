abstract: "Em 1957, Lucio Costa venceu o concurso do Plano Piloto da nova capital do Brasil. Em seu Relatório explicou como, apoiado na ordenação e no senso de conveniência, garantiu ao conjunto projetado o “desejável caráter monumental”; explicou também a concepção da Praça dos Três Poderes e sua importância para a construção da civitas como um espaço público igualmente “consciente daquilo que vale e significa”. Já nos primeiros croquis do arquiteto para o Plano Piloto a configuração espacial da Praça dos Três Poderes aparece claramente esboçada; contudo, em função dos aterros feitos para acomodar a implantação dos edifícios do Congresso Nacional, do Supremo Tribunal Federal e do Palácio do Planalto, foi necessário introduzir algumas alterações no projeto original, o que resultou na perda da apreensão de sua planta triangular -- que, mesmo assim, mostrou-se apropriada para as funções previstas. Logo, já no período de implantação da cidade, seu desenho original começou a ser modificado, ganhando novos contornos e dimensões: em 1960, a Praça estava quase pronta, elevada e aberta em relação ao cerrado circundante, como que dialogando com a natureza (fora desenhada na melhor tradição, como suas precedentes hierarquicamente diretas: a Praça do Comércio -- de Lisboa, a Praça do Governador -- de Salvador, a Praça XV -- do Rio de Janeiro), no entanto, como peça fundamental da estrutura representativa da capital federal moderna, não foi entendida; e, como monumento, não foi respeitada. Com o passar dos anos, foi ganhando adereços: em 1969, a concepção original foi desrespeita, com a construção do Mastro da Bandeira Nacional, de Sérgio Bernardes; já em 1985, Oscar Niemeyer desenhara o Panteão que, tal qual o “bandeirão, foi um erro; por fim, as perspectivas da Praça foram comprometidas. Niemeyer projetou o anexo II do Supremo Tribunal Federal (1990) e a Sede da Procuradoria Geral da República (1995-02). Os novos edifícios – ambos espelhados e curvos – contrastam em todos os sentidos com a primeira arquitetura da cidade, a da arquitetura da Praça. Enquanto o Plano Piloto de Brasília completa em 2007 cinqüenta anos; e a data sugere reflexão. O Docomomo sugere cautela. Sabemos que, nos dias de hoje, cada vez mais, projetar é atuar no pré-existente. Mas o que estamos fazendo com o nosso patrimônio moderno?"
keyword: "Brasília;Praça dos Três Poderes;Lucio Costa"
