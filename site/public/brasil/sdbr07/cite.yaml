title: "Cinquenta anos depois: a atuação do IPESP e dos arquitetos modernos paulistas na construção de edifícios escolares em São Paulo de 1959-1962"
container-title: "7º Seminário Docomomo Brasil, Porto Alegre, 2007"
event-title: "7º Seminário Docomomo Brasil, Porto Alegre, 2007"
event-place: "Porto Alegre"
