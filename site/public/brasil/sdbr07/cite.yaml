language: pt-BR
abstract: "Este trabalho discute os programas de renovação dos edifícios do Novotel Jaraguá, Normandie Design Hotel e Plaza Marabá, importantes exemplares da arquitetura modernista que continuam funcionando como meios de hospedagem, mostrando que a relação das edificações hoteleiras com o centro de São Paulo pode ser rica, pois estabelece \"uma imagem privilegiada, sintética e de certa forma magnificada, das dificuldades e contradições com as quais se confrontam a valorização do patrimônio arquitetônico em geral, e em especial sua reutilização ou, em outras palavras, sua integração na vida contemporânea\" (CHOAY, 2006, p. 222). Esta discussão pode também encontrar referências em várias outras cidades brasileiras e mesmo mundiais, nas quais originalmente o centro era o lugar onde estavam instaladas as atividades mais importantes (equipamentos de poder, de lazer, de comércio e de serviços, além de núcleos residenciais) e onde foram registradas importantes transformações. Este trabalho insere-se na discussão sobre as práticas de intervenção urbana nas áreas centrais, conduzidas especialmente nas grandes cidades, na tentativa de interromper o processo de declínio e erosão dos espaços urbanos. A temática da intervenção em centros urbanos, segundo Smith (2006, p. 75), faz hoje parte de uma \"aliança concertada e sistemática do urbanismo público e do capital, privado e público, (e) preencheu o vazio deixado pelo retraimento das políticas urbanas progressistas\". Este movimento de reabilitação dos espaços urbanos se dá em diversas escalas. Neste processo de desenho e redesenho da cidade, as transformações atingem desde o território como um todo até as escalas mais pontuais, como a paisagem e o edifício, na produção de cenários urbanos diferenciados, a partir dos quais se estabelecem os produtos, ou as mercadorias que serão \"consumidas\" pelos cidadãos, visitantes e turistas. Estas mercadorias urbanas são (re)criadas, entre outras práticas, pela recuperação do patrimônio edificado. No espaço do centro de São Paulo, algumas destas práticas de intervenção aconteceram, nos anos recentes, em edificações de hotéis construídos no período moderno, com reconhecida significação estética. Canova (2004, p. 12) aponta que embora a hotelaria já se tenha espalhado por toda São Paulo, o centro ainda concentra o maior número de hotéis da cidade e que \"muitos passaram por recente processo de modernização tanto da arquitetura quanto de serviços\"."
