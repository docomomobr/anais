language: pt-BR
abstract: "O texto expõe aspectos culturais da concepção e restauração de um jardim moderno, a Praça Faria Neves, projetada pelo paisagista Roberto Burle Marx em 1958 a convite do prefeito Pelópidas Silveira, após sua atuação no Recife a partir de 1935. Segundo princípios formulados desde a década de 1930, o jardim moderno dotava a cidade de um espaço de recreação, educação, higiene e arte, expresso na variedade vegetal. Também conhecida como Praça de Dois Irmãos, a praça localiza-se no Bairro de Dois Irmãos, no largo do antigo engenho homônimo, num dos subúrbios tradicionais do Recife. É delimitada por uma vila popular, pelas antigas instalações do engenho e pelo Horto Zoobotânico, numa área de Mata Atlântica. A concepção de Burle Marx era a de um jardim recreativo cujo motivo principal era o playground, garantido um espaço lúdico para as crianças. A partir da década de 1980, o uso da praça como estacionamento de veículos e a realização do Festival da Criança ocasionaram grandes modificações do projeto de Burle Marx. O mobiliário foi, em parte, destruído, a vegetação foi danificada e o terreno passou por um processo de erosão, agravados pela presença de um terminal de ônibus e de um bar. A partir de 2001, a elaboração do projeto de restauração foi iniciada através de uma parceria entre o Laboratório da Paisagem da UFPE e a Prefeitura do Recife, cujos técnicos foram estimulados à reconstituição da planta, uma vez que o projeto original não foi localizado nos arquivos do Recife ou no Escritório Burle Marx, conduzida nos moldes na Carta de Florença. Incluiu levantamento de documentos históricos, comparação de iconografia, identificação de componentes do projeto no local, estudo de outros projetos do paisagista, discussão com instituições e consulta a técnicos e à população do entorno, de cuja imaginação e acervo fotográfico renasciam as linhas do desenho de Burle Marx."
