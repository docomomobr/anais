URL: "https://zenodo.org/records/19122149/files/sdbr07-020.pdf"
language: pt_BR
abstract: "Os edifícios anexos na arquitetura da Praça dos Três Poderes, ao absorverem as demandas por novas ocupações, podem contribuir para a manutenção e a preservação das características da Arquitetura Moderna dos edifícios principais: os palácios do Planalto, do Supremo Tribunal Federal e o Congresso Nacional, executados entre 1958 e 1960. A construção dos anexos - quatro no Palácio do Planalto, dois no Supremo Tribunal Federal e seis no Congresso Nacional (dois no Senado Federal e quatro na Câmara dos Deputados) – ocorre entre 1965 e 1993. Ao contrário dos edifícios principais, a maioria deles não compõe diretamente a arquitetura da Praça, apesar da proximidade com as primeiras edificações. As pressões sofridas pelos palácios por abrigar novas áreas e o crescimento do número de servidores levaram à configuração de anexos cujo somatório de área construída supera a edificação principal: duas vezes no caso do Palácio do Planalto e do Senado Federal, cinco vezes na Câmara dos Deputados e oito vezes no Supremo Tribunal Federal. O caso do Congresso Nacional adquire configuração própria, pois, diferente dos outros palácios, é conjunto arquitetônico submetido ao controle do Senado Federal e da Câmara dos Deputados, independentes entre si e com atuações específicas em relação aos espaços dos edifícios. Nestes órgãos, a requalificação de espaços nobres e o resgate das funções originalmente previstas têm sido obtidos a partir da liberação de áreas anteriormente ocupadas, possibilitada pela construção dos edifícios anexos. O artigo aborda os aspectos históricos do surgimento destes anexos e traz a análise das ações ocorridas no Congresso Nacional: as causas das intervenções, as intenções previstas e as conseqüências na edificação principal. São apresentadas as características dos anexos da Câmara dos Deputados e Senado Federal, além de documentação gráfica de projetos construídos e exemplos de propostas não executadas."
