language: pt-BR
abstract: "O presente trabalho tem como finalidade apresentar as discussões correntes sobre os conjuntos habitacionais modernos e as questões enfrentadas atualmente pelo poder público e pela iniciativa privada para a reabilitação e conservação de áreas residenciais.\nAs experiências mais conhecidas e difundidas no Brasil sobre áreas habitacionais dizem respeito principalmente à recuperação e requalificação de áreas centrais, como é o caso, entre outros, do Corredor Cultural no Rio de Janeiro, do Pelourinho em Salvador, ou do projeto Viva o Centro, em São Paulo. Outro exemplo emblemático de preservação de grandes áreas residências é o caso do Plano Piloto de Brasília, considerada como Patrimônio Cultural da Humanidade, que se destaca da discussão proposta neste trabalho por se tratar de uma cidade inteira preservada que desde sua concepção é acompanhada de uma legislação rígida que tem por intuito engessar qualquer modificação nos projetos das \"superquadras\" e edificações previstas.\nPouco se tem estudado sobre a produção habitacional de caráter modernista promovida pelo poder público no Brasil, portanto, pouco se tem discutido sobre formas de conservação desses sítios, que um dia constituíram as periferias de grandes centros urbanos e hoje, em sua grande maioria, fazem parte da malha urbana consolidada.\nO mapeamento e sistematização da documentação referente aos conjuntos habitacionais promovidos pelo poder público coletada pela pesquisa \"Habitação Econômica e Arquitetura Moderna no Brasil (1930-1964)\" coordenada pelo Prof. Dr. Nabil Bonduki, no que se refere à promoção pública da moradia econômica, é um importante documento revelador da abragência e importância dessa produção em território nacional. As visitas aos conjuntos, contudo, também revelaram um caráter desolador das condições atuais desses sítios e principalmente as dificuldades de manutenção das áreas comuns por parte dos moradores atuais. Poucas experiências foram encontradas no sentido de se recuperar e conservar características originais desses grandes conjuntos, como é o caso da Vila IAPI de Porto Alegre, objeto de um minucioso estudo coordenado pelo escritório de arquitetura Carlos Maximiliano Fayet, \"Vila do IAPI: Patrimônio Cultural da Cidade\", que tem o intuito de dar subsídios para um projeto de lei municipal de preservação do sítio.\nEm vista da escassez de discussão sobre o assunto no Brasil, a proposta desse trabalho é buscar na literatura internacional exemplos de enfrentamento dos problemas de preservação de sítios habitacionais modernos, que dêem subsídios para estudos de casos brasileiros. Alguns exemplos dessa tentativa são os trabalhos de investigação dos Quartieri produzidos pelo INA-Casa na Itália, e os módulos de unidades de vizinhança na Holanda e em países em desenvolvimento, pesquisada pelo projeto temático The New Town, em Rotterdam, entre outros.\nEmbora a discussão em torno da preservação e reabilitação de áreas residências envolva características peculiares a cada sítio, e a produção brasileira tenha um caráter bastante heterogêneo, com influências dos princípios do CIAM, da arquitetura e urbanismo de Le Corbusier, do movimento Cidade Jardim e mesmo do urbanismo formal, as metodologias de análise e as políticas propostas para outras realidades podem, sem prejuízo, servirem de norte para o desenvolvimento de estudos e propostas pertinentes a nossa realidade, assim como os próprios princípios de arquitetura moderna o foram em outro momento de nossa história.\nNeste sentido, o presente trabalho pretende apresentar essa discussão sobre a seleção e preservação de sítios históricos modernos residenciais num âmbito mais generalista, sem perder de vista nossa realidade política e econômica e as expectativas e necessidades para a cidade brasileira do século XXI."
keyword: "arquitetura moderna; conjuntos habitacionais; preservação de sítios residências"
