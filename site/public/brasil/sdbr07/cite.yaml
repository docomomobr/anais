issued:
  date-parts:
    - [2007, 10, 9]
DOI: "10.5281/zenodo.19072579"
ISBN: "978-85-60188-06-2"
URL: "https://zenodo.org/records/19072580/files/sdbr07-052.pdf"
language: pt-BR
abstract: "No final dos anos 20, confrontavam-se no Rio de Janeiro duas visões do urbanismo e da cidade, ilustrando exemplarmente os dois paradigmas modernos que coexistiam à época. O Plano de Agache e a proposta de Le Corbusier para o Rio de Janeiro de 1929 não são apenas \"projetos\" distintos, mas estratégias frente à cidade e à natureza com divergências fundamentais, que permitem a analogia entre a mão e sua impressão. Nos anos 40, um urbanista que trabalhou com Agache no Plano do Rio e um arquiteto que trabalhou com Le Corbusier na equipe do MES vão igualmente confrontar-se com propostas para o Centro Cívico na Praça da Matriz, em Porto Alegre. Os projetos de Arnaldo Gladosch para o Centro Administrativo do Estado e de Jorge Moreira para o Centro Cívico revelam as mesmas divergências, que não se limitam à usual dicotomia entre um Gladosch \"acadêmico\" ou \"conservador\" e um Moreira \"moderno\" e \"inovador\".\nGladosch foi contratado pelo Prefeito Loureiro da Silva no final de 1938 para elaborar o Plano Diretor de Porto Alegre, credenciado pelo trabalho com Agache no Rio de Janeiro. Desenvolveu uma série de estudos até a definição do Anteprojeto, e projetos urbanísticos especiais, apresentados sucessivamente ao Conselho do Plano Diretor, em evidente procura da adesão pelo convencimento, na tradição da Societé Française des Urbanistes. O Centro Cívico na Praça da Matriz foi apresentado ao Conselho em meados de 1939, e detalhado até 1943, pelos seis desenhos disponíveis em Um Plano de Urbanização. Jorge Moreira apresentou seu estudo para o Centro Cívico de Porto Alegre em 1943, provavelmente por iniciativa própria, quando estava envolvido com o projeto para o Hospital de Clínicas da Universidade. Pode ter contado com a colaboração de Affonso Eduardo Reidy, pouco depois seu parceiro no projeto para a sede da VFRGS em Porto Alegre. O estudo explora duas variantes, apresentadas em apenas quatro figuras no livro organizado por Jorge Czajkowski.\nA comparação dos dois projetos procura compensar a parca documentação disponível com a \"intensidade da mirada\", emprestada a Hélio Piñon. Na análise, afloram as contradições e similaridades entre os dois paradigmas urbanísticos em convivência na época, ambos comprometidos com o moderno, embora de formas distintas. As referências de Moreira remetem aos projetos para a Universidade do Brasil, de Le Corbusier e da equipe de Lucio Costa, da qual fazia parte, à Ville Radieuse corbusiana dos anos 30 e ao \"Ilot Insalubre nº 6\", prenunciando tanto o projeto para o centro de Saint-Dié quanto o projeto de Reidy para a Esplanada de Santo Antonio, no Rio. As estratégias compositivas e os desenhos de Gladosch revelam sua formação no urbanismo alemão e a tradição da SFU, através de Agache, com referências específicas ao Stile Littorio de Marcello Piacentini e ao projeto de Piacentini e Morpurgo para a Praça da Reitoria da Universidade do Brasil. Assim, o confronto que já se estabelecia entre os dois paradigmas, nos projetos para a Cidade Universitária da Universidade do Brasil, se transfere a Porto Alegre, tendo o Centro Cívico como arena.\nAs propostas de Gladosch e Moreira para o Centro Cívico da Praça da Matriz não exibem a homotetia quase absoluta dos projetos de Agache e Le Corbusier – não chegam a representar literalmente a analogia da mão e sua impressão, mas ilustram um peculiar \"sincretismo urbanístico\", com dois paradigmas apanhados em raro momento de equilíbrio, mesmo instável. Seu estudo traz ensinamentos preciosos para o projeto da cidade contemporânea, especialmente na inserção de edifícios modernos em tecido tradicional, onde o novo e o velho se fornecem referências mútuas, revigorando-se numa relação cheia de tensão e significado."
keyword: "Urbanismo Moderno; Gladosch e Moreira; Porto Alegre"
