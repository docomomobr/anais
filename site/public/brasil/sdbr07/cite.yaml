    - [2007, 10, 9]
DOI: "10.5281/zenodo.19110719"
ISBN: "978-85-60188-06-2"
URL: "https://zenodo.org/records/19110720/files/sdbr07-051.pdf"
language: pt-BR
abstract: "A Casa Curutchet, situada em La Plata, Argentina, foi projetada por Le Corbusier em 1948-49 e representa um caso particular dentro da obra do arquiteto. Inserida em malha urbana perfeitamente constituída, sobre um bulevar e em frente a uma praça, é a única casa do arquiteto construída na América Latina. Além disso, implantada em lote estreito e profundo entre medianeiras, flanqueado por casas contíguas de diferentes épocas, a residência é um típico exemplo de arquitetura moderna perfeitamente ajustada a um contexto urbano figurativo. Encomendado a Le Corbusier por importante cirurgião da cidade, o projeto despertou o interesse do arquiteto, que havia estado na Argentina em 1929 e esboçara um plano urbanístico para a capital. Sem conhecer o terreno, Le Corbusier mantém intensa correspondência com o cliente, que o alimenta com informações a respeito do programa de necessidades, da legislação urbana da cidade e com material fotográfico do lote e seu entorno. Duas exigências programáticas básicas eram solicitadas pelo Dr. Curutchet: consultório independente da residência e principais ambientes com vista para a praça em frente. A solução dada por Le Corbusier mostra-se primorosa tanto espacial como contextualmente. O consultório, espaço de uso mais público, é separado da casa e situado num volume frontal menor, junto à rua; liga-se ao volume residencial posterior por uma rampa, que fica num pátio intermediário, alusivo à colonização espanhola do lugar. No que diz respeito às relações com o entorno, a casa Curutchet pode ser considerada contextual sob quatro pontos de vista. No urbanístico, em primeiro lugar, o arquiteto a integra à malha urbana de La Plata, cidade planejada no final do século XIX e caracterizada pela superposição de duas tramas, uma em xadrez e outra em diagonal. O terreno situa-se sobre um trecho em diagonal, e a fachada da casa, mas apenas ela, assume a inclinação da via. Em segundo lugar, sob o critério ambiental, o forte sol de verão platense é amenizado pelos profundos brise-soleils em forma de grelhas de concreto, frontais ao consultório e à casa, que, além de funcionais, têm forte caráter expressivo. Quanto ao aspecto visual, em terceiro lugar, o arquiteto logra perfeita relação com a praça pública em frente, permitindo que seja contemplada tanto do consultório como da residência, de todos os ambientes principais. Por fim, no âmbito arquitetônico, há perfeita integração do edifício com sua vizinhança, constituída por uma residência protomoderna à direita, de baixa altura e recuada do alinhamento frontal, e uma casa do início do século XX à esquerda, com pé-direito alto e fachada eclética de vertente italiana sobre o alinhamento. Sem tentar qualquer tipo de mimetismo, ou, ao contrário, caracterizando as diferenças, Le Corbusier propõe relações de ordem geométrica, criando um escalonamento de alturas que demonstra forte sensibilidade para com o contexto. As três casas representam e revelam três épocas, mas a inserção corbusiana as relaciona de forma harmoniosa. Outras obras corbusianas anteriores, fossem residências unifamiliares ou não, também se implantavam em lotes urbanos, mas Curutchet é, talvez, o exemplo em que a “inserção” é levada a cabo com maior completude. Sem abandonar os principais pressupostos dos anos 20, tais como o uso dos cinco pontos e da rampa, que encaminha a promenade architecturale através do pátio, e acrescentando elementos de seu repertório pós-guerra – brise-soleil, teto pára-sol, uso do Modulor – Le Corbusier enfrenta o problema da inserção urbana com maestria, provando que modernidade arquitetônica não é incompatível com urbanismo figurativo pré-moderno. Antes pelo contrário."
keyword: "Casa Curutchet;Modernidade;Contextualização"
author:
