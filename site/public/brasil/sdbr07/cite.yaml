title: "Palácio da Justiça de Porto Alegre: a longa espera pelo fim, 1952-2006: o projeto de recuperação, restauração e readequação do ícone da Arquitetura Moderna de Porto Alegre"
container-title: "7º Seminário Docomomo Brasil, Porto Alegre, 2007"
event-title: "7º Seminário Docomomo Brasil, Porto Alegre, 2007"
