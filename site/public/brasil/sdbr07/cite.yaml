id: sdbr07-052
type: paper-conference
title: "A mão e sua impressão"
container-title: "7º Seminário Docomomo Brasil, Porto Alegre, 2007"
event-title: "7º Seminário Docomomo Brasil, Porto Alegre, 2007"
event-place: "Porto Alegre"
