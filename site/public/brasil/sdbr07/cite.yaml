language: pt-BR
abstract: "Lina Bo Bardi referia-se ao Conjunto do Unhão como «Trapiche Unhão». O seu deslumbramento por aquele edifício em ruínas situado à beira-mar, às margens da Baía de Todos os Santos, data de antes da fundação do Museu de Arte Moderna da Bahia que, posteriormente, após a restauração dirigida por Lina, se instalaria no Conjunto reciclado.\nNas suas viagens à Bahia em 1959, Lina Bo Bardi empenhou-se em um projeto pessoal: a recuperação do Conjunto do Unhão em ruínas. Foi nessa ocasião que ela recebeu o convite para fundar e dirigir o Museu de Arte Moderna da Bahia. Dois anos depois, ela conseguiria do governador do estado baiano a desapropriação e compra do Conjunto do Unhão para instalar nele o museu e para abrigar um ambicioso projeto que ela desenhou entre 1960 e 1964, durante os anos em que viveu na Bahia: construir no entorno do Unhão o Museu de Arte Popular e a Universidade Popular.\nO trabalho de Lina Bo Bardi com o complexo, engenho ou trapiche do Unhão se convertiria em uma obra de restauração ímpar que até hoje continua influenciando o campo da rearquitetura. Lina Bo Bardi introduziu elementos transformadores que reciclaram o edifício original, traduzindo-se numa intervenção moderna e inovadora.\nO projeto de Lina Bo Bardi foi ambivalente, sem negar o edifício original, ela o reinventou, descobrindo novas analogias na construção, com o mar, com as fortalezas portuguesas e com a herança industrial, e introduzindo elementos como a escada helicoidal de madeira e as janelas pintadas de vermelho, que tiveram a força de transformar o edifício e o lugar e continuar até hoje como referências da arquitetura contemporânea."
keyword: "Restauração; moderno; popular; museu"
