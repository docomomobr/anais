DOI: "10.5281/zenodo.19110731"
ISBN: "978-85-60188-06-2"
page: "1-28"
URL: "https://zenodo.org/records/19110732/files/sdbr07-062.pdf"
language: pt-BR
abstract: "Os grandes conjuntos habitacionais, além de símbolos da missão modernista de transformar o mundo, marcaram a paisagem de inúmeras cidades européias e sul-americanas nas décadas do pós-guerra. Após alguns anos, eles revelaram uma dificuldade de adaptação às transformações sociais, como o envelhecimento, enriquecimento ou empobrecimento de sua população-alvo. Hoje, esses conjuntos, em sua maioria, apresentam inúmeros problemas de conservação: intempéries climáticas atacaram revestimentos, espaços comuns degradaram-se, estruturas de concreto ficaram comprometidas pela corrosão das ferragens e pela carbonatação das partes expostas. Muitas vezes, o rápido envelhecimento pode ser atribuído à má qualidade da construção e dos materiais empregados e à falta de adaptação às particularidades climáticas de diferentes regiões. Por fim, esses conjuntos mostraram-se também pouco flexíveis em sua relação com a cidade. Desde os anos 90 a arquitetura moderna vem sendo introduzida na agenda da preservação, mas esse processo privilegiou edifícios isolados e excepcionais e pouco atentou para a enorme massa de conjuntos habitacionais. A crítica dos anos 70 e 80 ao modernismo, que teve nestes conjuntos um alvo primordial, contribuiu para essa omissão. Admiradores ou não desse urbanismo, o fato é que a conservação/requalificação desses conjuntos emerge como um tema que desafia não apenas especialistas em conservação, mas todos os profissionais que lidam com a cidade. Esse artigo visa discutir os desafios que se colocam para a conservação de grandes conjuntos modernistas por meio do estudo de duas experiências escandinavas recentes de conservação e requalificação de grandes conjuntos construídos nos anos 60 e início dos anos 70. Nos arredores de Gotenburgo, Gårdsten foi um dos maiores símbolos do Welfare State sueco. Este enorme conjunto, já na década de 80, passava por sérios problemas de conservação e continha inúmeros apartamentos abandonados. Esta situação mudou quando o conjunto passou a ser gerido por uma companhia privada, que iniciou um processo de requalificação para recolocá-lo no mercado de aluguel. Para atrair novos moradores, foram feitas intervenções mais radicais como a substituição de fachadas inteiras, cortes nos longos blocos de apartamentos e a criação de novas entradas. Nas cercanias de Helsinki, Pihlajamaki, o primeiro conjunto finlandês totalmente feito de elementos pré- fabricados, foi também um símbolo da modernização finlandesa. Nos anos 90, o conjunto apresentava problemas de conservação sobretudo nos seus painéis de concreto. Apesar do esforço em manter a unidade do conjunto, foram introduzidos novos elementos como elevadores e camadas de isolamento térmico que interferiram na manutenção de sua autenticidade. Esses conjuntos entraram em processo de obsolescência, apresentaram sérios problemas de conservação e passaram por processos de conservação e requalificação, mais cautelosos ou mais drásticos. Mesmo sendo necessários, esses processos suscitam uma série de questionamentos que podem ser generalizados para outros conjuntos: Como atender às novas demandas sociais, tecnológicas e energéticas sem alterar a integridade e a unidade estética desses conjuntos? Até que ponto são admissíveis mudanças sem alterar sua autenticidade? Como adaptar as disposições espaciais para novas demandas? Quais os parâmetros mínimos a serem observados para a conservação? Qual o valor histórico e cultural desses conjuntos? O texto procura refletir sobre essas questões procurando trazer subsídios para a discussão dos casos dos conjuntos brasileiros. Apesar das realidades bem distintas, a análise dessas iniciativas escandinavas pode se refletir sobre os desafios colocados para os nossos conjuntos."
keyword: "Conjuntos habitacionais;Escandinávia;Conservação"
