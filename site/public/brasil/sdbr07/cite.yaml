language: pt_BR
abstract: "Este trabalho discute a relevância da abordagem tectônica na reciclagem e requalificação de objetos arquitetônicos modernos nos dois momentos do processo de intervenção: o prospectivo e o propositivo. A discussão é feita com base na noção de tectônica resgatada da teoria alemã do século XIX por Kenneth Frampton e que tem ressoado fortemente no discurso arquitetural atual. Na cultura tectônica a dimensão estética da arquitetura encontra sua força e autenticidade no potencial expressivo dos elementos construtivos e da estrutura, priorizando a poética da construção. Esse interesse fenomenológico pela “coisidade” na arquitetura, ou seja, a busca de significado na própria materialidade do objeto arquitetônico, também constitui a base teórica da metodologia de intervenção em edifícios existentes ressaltada nos trabalhos de Giorgio Grassi, Rafael Moneo, Carlo Scarpa, oposta ao idealismo praticado por Viollet-le-Duc, como observa Solà-Morales. Para este autor o reconhecimento das estruturas significativas manifestadas no material histórico existente e o seu uso são marcos analógicos para a nova construção, bem como suporte para que a proposta de intervenção, enquanto operação estética possa ser livre, arbitrária e imaginativa. A tectônica como categoria analítica, instaurada por Frampton, tem como premissa a existência, em arquitetura, de um juízo estético inerente ao ato construtivo. Ele se apoia na tese de Semper de que o elemento constitutivo básico da arte de construir é a junção. A junção, longe de ser um detalhe gratuito, é elemento tectônico primordial e constitui o nexo em torno do qual o edifício começa a existir e se articular como presença. Nas obras arquitetônicas, portanto, se verifica uma articulação de espaços e de elementos materiais estruturantes que implicam, em uma sintaxe tectônica. Nesta, a articulação construtiva gera uma subdivisão espacial e vice-versa. A partir das categorias analíticas dessa sintaxe tectônica se analisa, neste trabalho, as intervenções realizadas em duas obras modernistas brasileiras: o Pavilhão Luiz Nunes-Sede IAB, antigo Pavilhão Verificação de Óbitos do arquiteto Luiz Nunes, na cidade do Recife – PE; e a Igreja de São Francisco - Pampulha, do arquiteto Oscar Niemeyer, em Belo Horizonte – MG."
keyword: "Tectônica; Reciclagem; Arquitetura Moderna"
