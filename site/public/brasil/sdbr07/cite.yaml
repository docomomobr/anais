abstract: "O MAM-Rj, projeto de Affonso Eduardo Reidy é reconhecidamente uma obra de importância histórica, mas também marcado por percalços e incertezas, desde sua origem. Incompleto e com seu programa modificado, depois quase destruído pelo fatídico incêndio que danificou grande parte de seu acervo, e por fim, vivendo grandes dificuldades financeiras, o Museu viu-se, no início dos anos 2000, diante de nova oportunidade de dirimir sua fragilidade institucional com a possibilidade de construção do teatro prevista no projeto original. Contanto com o incentivo da prefeitura e em parceria com a iniciativa privada – um grupo que administra casas de espetáculos – o teatro foi finalmente construído. Inaugurado em 200, é gerenciado pela empresa associada a uma telefônica, que tem um contrato de 20 anos para exploração do local . Como se trata de obra e entorno tombados pelo patrimônio histórico, decidiu-se construí-lo conforme os desenhos originais, pelo menos no que diz respeito a sua volumetria externa. Essa comunicação pretende discutir uma série de questões por traz desses eventos que envolvem a instituição, o poder público, a iniciativa privada, os órgãos de patrimônio, a classe dos arquitetos e críticos e historiadores da arquitetura. Trata-se de legítimo resgate histórico de uma obra impar, de dívida paga para com um grande arquiteto, de revitalização de área degradada, de preservação cosmética, de ação criteriosa, da cultura como negócio, de nostalgia do modernismo perdido?"
