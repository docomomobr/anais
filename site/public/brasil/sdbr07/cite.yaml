abstract: "O Museu de Arte Moderna do Rio Janeiro é um ícone da Arquitetura Moderna carioca, desenhado por Affonso Eduardo Reidy (1909-1964). No terreno do Aterro do Flamengo doado em 1953 pela prefeitura, foi situado o projeto e inaugurado parcialmente em 1958, com a construção do Bloco Escola, no período da presidência de Juscelino Kubitschek. Em 1968, foi á vez do volume principal do Salão de Exposições, entretanto faltaria ainda o teatro, que constituía o maior volume do conjunto e que estabelecia o vínculo com a cidade, ao ficar situado no acesso principal desde a Avenida Beira Mar. Em 1978, ocorreu um grave incêndio que destruiu quase a totalidade do acervo de uma exposição itinerante do pintor uruguaio Torres Garcia. O Museu voltou a funcionar em 1982 e a reforma não foi totalmente bem sucedida, o que motivou que em 1999 teve que se desenvolver um trabalho de restauração para recuperar as características do desenho original. Em 2002, houve uma tentativa de viabilizar a construção do teatro do Museu, previsto no projeto do conjunto, através de negociações entre a prefeitura da cidade do Rio de Janeiro e a direção do Museu. Em 2007, foi aberto ao público o teatro e a sua construção respeitou a volumetria definida por Reidy no projeto original. Neste ensaio será apresentado como aconteceu o processo de “rearquitetura” no Museu de Arte Moderna do Rio de Janeiro. Do ponto de vista da sua significação cultural, cabe verificar as características dos espetáculos que o teatro abriga. Em relação a sua Arquitetura, será analisado o desenho interior do conjunto funcional do teatro, verificando se o “espírito” da obra atual se corresponde com a qualidade do projeto original de Reidy. Ao longo de 50 anos, este museu sempre foi assimilado sem o volume do teatro pela sociedade carioca. A nova articulação de formas estabelece uma percepção social e arquitetônica diferenciada para os habitantes da cidade, que deve ser amadurecida para substituir a imagem precedente. E também analisar como mudou o sistema de prioridades e de intensidades no uso do conjunto, especialmente com apresentações – como Rio Show – e celebrações festivas que introduziram elementos arquitetônicos de precária qualidade estética e construtiva alheios ao projeto original. Esta dinâmica de sucessivas transformações do edifício a fim de resgatar a forma e a função definitivas, estabelecida no desenho de Reidy confirma a validade de uma imagem que elaborada no passado atinge a sua concretização no presente, e recupera a unidade por longo tempo inconclusa."
