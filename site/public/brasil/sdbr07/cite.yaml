abstract: "O presente artigo baseia-se no texto da Tese de Doutorado intitulada: Estudo de Exemplos Paradigmáticos como contribuição para a solução dos problemas da habitação popular na cidade do Rio de Janeiro defendida na COPPE – UFRJ. Esta Tese apresenta um panorama da habitação popular no Rio de Janeiro dos séculos XIX e XX. Dentre os exemplos citados, três foram considerados paradigmáticos por retratarem em suas soluções o pensamento político, as questões sociais, as determinantes econômicas, a linguagem arquitetônica e a implantação urbanística adequados aquele momento.\nO segundo exemplo paradigmático foi o Conjunto Habitacional Presidente Getúlio Vargas do arquiteto Flávio Marinho Rego que formalizou os princípios da arquitetura moderna bem como suas expectativas socialistas. O conjunto é um exemplo significativo das tendências de vanguarda da época, por sua concepção arquitetônica e urbanística, pelo porte (1314 unidades), pela complexidade do empreendimento e pelos programas assistenciais.\nA obra de 1953/1954, inspirada, para BONDUKI, no Pedregulho, possuía um programa com espaços de uso comum, áreas verdes, parques esportivos, escola, posto de saúde, mercado e administração que lhe conferiam autonomia. A moradia era reduzida às funções essenciais dentro de uma área mínima. Também conhecido como Conjunto Deodoro foi construído pela Fundação da Casa Popular e em 2002 foi feito um levantamento de sua história que incluiu: uma contextualização temporal, um estudo da sua localização, o agente promotor, o público alvo, os aspectos funcionais e formais que definiram o partido bem como as condições em que se encontra atualmente.\nForam as imagens obtidas no local bem como a quantidade de informações com moradores e membros de associações locais que permitiram uma análise criteriosa da obra que levou as conclusões finais. E, é este levantamento que pretende-se apresentar: da proposta monumental a sobrevivência nos dias atuais."
keyword: "arquitetura; habitação popular e moderno; Key words: architectural; low income housing and modern"
