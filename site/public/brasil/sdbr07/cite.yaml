URL: "https://zenodo.org/records/19072739/files/sdbr07-058.pdf"
language: pt-BR
abstract: "As cidades universitárias no Brasil sofrem constantes revisões em seus projetos iniciais em função tanto da sua dinâmica educacional e política quanto tecnológica. Neste sentido, estes equipamentos tornam-se fontes importantes para estudos de requalificação no âmbito da arquitetura e do urbanismo.\nEste artigo tem por objetivo analisar o caso exemplar de campus universitário no Brasil: a Universidade de Brasília - UnB. Esta universidade, como se sabe, surge em paralelo à criação de Brasília com o ideal de se construir uma nova universidade modelo para o país e para a América Latina. De forma semelhante aos grandes projetos para cidades universitárias no Brasil, o projeto para a UnB passou pela mão de arquitetos modernistas e, nesta empreitada, encontramos Lúcio Costa em um primeiro momento e Oscar Niemeyer no desenvolvimento do projeto definitivo. No campo da educação, um dos principais mentores foi o já experiente Anísio Teixeira que havia criado, em 1935, a Universidade do Distrito Federal – instituição paradigmática fechada pelo Ministro Capanema em 1939 por motivos políticos. Outro importante ator nesta área foi Darcy Ribeiro, assumindo a linha de frente dos debates e da formalização da idéia. Ele ainda se destaca pelo empenho em reunir, com o apoio da Sociedade Brasileira para o Progresso da Ciência (SBPC), a comunidade científica do País em torno do projeto da nova universidade.\nDesta forma a Unb destaca-se pela escala do empreendimento, pelos atores e os debates desenvolvidos nos campos da ciência e da educação, da arquitetura e do urbanismo e o conseqüente desejo de se fazer o melhor em todos os campos envolvidos nesta empreitada.\nDesde sua formatação original feita por Lúcio Costa (1962), a cidade universitária sofreu diversas revisões. Ainda na etapa de projeto, em 1964, Niemeyer assumiu a responsabilidade pela definição do Instituto Central de Ciências e pela Praça Maior, o que praticamente redefiniu o caráter do campus. Posteriormente, quando partes significativas de seu corpo já estavam construídas, continuou sofrendo alterações que ora comprometem e ora ratificam a proposta inicial - em resumo podemos destacar as seguintes intervenções: Proposta do CEPLAN – Centro de Planejamento, em 1969; Proposta de Zoneamento, em 1970; Proposta de eixos de expansão, em 1971; Proposta de eixos de Vivência, em 1987/88.\nUma análise destas intervenções, sempre tendo como base o plano inicial visto sob o duplo aspecto arquitetônico e educacional, contribui para o entendimento da dinâmica própria das cidades universitárias brasileiras.\nVale ainda ressaltar que a Universidade de Brasília, além de ser uma icônica reflexão sobre as universidades precedentes, tornou-se uma forte referência nas décadas seguintes no campo projetual e mesmo no campo educacional. Sua requalificação não ocorre apenas no campo arquitetônico e urbanístico, é o reflexo de mudanças no campo educacional e político tornando a análise da representação arquitetônica mais complexa e instigante."
keyword: "Arquitetura; Educação; Cidade Universitária"
