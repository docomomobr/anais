abstract: 'O presente trabalho faz parte de um projeto maior intitulado "Métodos de
  Intervenção nos Espaços Urbanos dos Centros Históricos. Estudo de caso: São Paulo-
  Programa Morar no Centro", realizado junto ao Departamento de Arquitetura, Urbanismo
  e Paisagismo da Universidade Estadual Paulista. A Prefeitura de São Paulo, na gestão
  2001-2004, implementou o Programa de Arrendamento Residencial (PAR) em convênio
  com a Caixa Econômica Federal, reciclando e requalificando edificações desocupadas
  como: Maria Paula, Riskallah Jorge e Brigadeiro Tobias, para moradia da população
  com renda entre três a seis salários mínimos. O PAR foi criado para famílias que
  queiram adquirir um imóvel. O imóvel é arrendado por um período de 15 anos, com
  parcelas mensais correspondentes a 0,7% do seu valor total. Após 15 anos, o morador
  tem a opção de adquirir o imóvel, descontando-se os valores pagos no período do
  arrendamento. (PREFEITURA DE SÃO PAULO, 2004). O edifício Brigadeiro Tobias foi
  construído na década de quarenta para escritórios, posteriormente foi reciclado
  pelo PAR para abrigar 84 apartamentos e entregue aos usuários em 2005. O presente
  trabalho tem por objetivo analisar as dimensões urbana, arquitetônica, social e
  econômica da implementação do PAR no edifício Brigadeiro Tobias. Metodologia: abordaram-se
  as questões referentes a arquitetura eclética e moderna, reciclagem; o PAR e a legislação
  urbana de São Paulo; tecnologia e custos da intervenção; as características sócio-econômicas
  dos usuários e as condições de habitação. Os resultados identificaram os aspectos
  positivos e negativos da implementação do PAR. O presente trabalho ressalta a importância
  da preservação, reciclagem e requalificação das edificações no centro histórico
  de São Paulo.'
