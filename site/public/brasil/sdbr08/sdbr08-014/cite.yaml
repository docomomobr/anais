abstract: "A idéia de uma identidade paulista de arquitetura, surgida entre os anos 50-60, tem na historiografia da arquitetura moderna brasileira uma representação corrente no que se convencionou chamar de “escola paulista”. Apesar de controversa, uma produção diferenciada de arquitetura em São Paulo neste período é sempre discutida nas suas relações com a arquitetura produzida no Rio de Janeiro consagrada no início da década de 40 com a exposição Brazil Builds no MoMA em 1943 e as posteriores críticas estrangeiras positivas. Esta repercussão, transforma a opinião pública interna e abre as portas para a aceitação desta arquitetura, marcando o começo de sua influência na produção arquitetônica em outras regiões brasileiras. Apoiada teoricamente em Lucio Costa, representava uma flexibilização dos pressupostos estritos da arquitetura moderna clássica, sobretudo na questão da valorização plástica e em sua relação diferenciada com o lugar. Contudo, ao longo da década de 50 esta admiração despertada pela “arquitetura brasileira” passa a ser substituída por um desencantamento, tanto local como internacional, e Brasília, neste desenrolar, cumpre um papel simbólico. De um lado, discursos que ansiavam por uma volta aos princípios puros do modernismo e identificavam na obra brasileira um desvirtuamento da linha canônica em função de uma valorização estética tendente ao formalismo. Por outro lado, discursos que colocavam a própria frente hegemônica modernista em questão e buscavam encaminhar a arquitetura moderna para outros rumos, colocando em questão a escala humana, a função social do arquiteto e seu posicionamento político. É este caminho da crítica “paulista” - de aceitação, admiração e alinhamento com o cânone carioca a pronunciamentos críticos, reprimendas e contestações – que interessa ser analisado neste artigo. Busca-se investigar a formulação histórica dessas representações - do brasileiro, do carioca e do paulista - e os fundamentos destas identidades, através da análise das revistas de arquitetura do período."
keyword: "modernidade; crítica; São Paulo"
