abstract: "Este artigo discute algumas relações entre os arquitetos Lina Bo Bardi e Vilanova Artigas, focando-se em duas de suas obras ícones, o edifício do Museu de Arte de São Paulo (MASP – projeto 1957/66; construção 1960/69) e o edifício da Faculdade de Arquitetura e Urbanismo da Universidade de São Paulo (FAUUSP – projeto 1961,65/66; construção 1967/68). Com o objetivo de investigar o uso do concreto armado nessas obras sob os pontos de vista técnico-construtivo e expressivo-estético, foi realizada ampla pesquisa em material documental e iconográfico relacionados aos projetos e às obras. O artigo discutirá algumas das análises originadas por essa pesquisa, detendo-se em questões como o uso do concreto armado na produção desses arquitetos e suas intenções ao empregá-lo nesses edifícios, o caráter e as particularidades do processo de desenvolvimento e maturação desses projetos desde os primeiros croquis ao produto final, e as relações entre os projetos e as obras construídas, considerando os imprevistos de canteiro. Ao se dedicar a ícones da arquitetura de São Paulo dos anos 1960 e a dois de seus arquitetos mais significativos, este artigo traz reflexões no âmbito da história da técnica da arquitetura moderna no Brasil, relacionando o desenvolvimento tecnológico do concreto armado com valores técnicos e estéticos da arquitetura paulista."
keyword: "Concreto Armado; MASP; FAUUSP"
