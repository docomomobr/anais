abstract: "A análise dos projetos executados pelo Plano de Ação do Governo do Estado de São Paulo (PAGE) entre 1959 e 1963 permitem avaliar de que maneira as formulações sociais modernas foram executadas naquele momento e, passados tantos anos, qual o seu legado. Tais obras, mais do que levar o progresso ao interior e assim alterar o seu perfil econômico, constituíram uma gama de realizações que discutem concepções da função social da arquitetura moderna. São obras públicas que repensam ambientes e suas articulações propondo reformulações a partir do seu arranjo espacial, exaltando as relações coletivas dos usuários, pretendendo estabelecer novas bases de uma arquitetura social. Portanto, são edifícios modernos não apenas no sentido de uma racionalidade técnica, remetendo a uma racionalização social que define o partido do projeto, o qual pretende o incremento das relações entre os usuários. Há uma recorrência da articulação de blocos com funções particulares, (e, portanto, com divisões espaciais distintas), e, sobretudo, a presença de espaços coletivos, locais de sociabilidade, os quais são os elementos fundamentais dos projetos. A relação franca entre interior/exterior também se faz recorrente, sendo as obras integradas ao seu entorno, possuindo um caráter urbano intrínseco ao partido e à execução do projeto. A filiação dos vários arquitetos autônomos contratados à linguagem moderna foi fundamental para realizar uma contraposição frente à linguagem arquitetônica utilizada pelos profissionais do Departamento de Obras Públicas (DOP) para desenvolver os projetos de equipamentos públicos de até então, os quais seguiam concepções ecléticas que valorizavam a hierarquia institucional e não a acessibilidade do público às edificações. Desta maneira, as obras modernas do PAGE trazem para o meio público discussões do caráter social da arquitetura moderna, sendo no Estado de São Paulo a primeira vez que a arquitetura moderna fez-se presente em termos de programa de equipamentos da iniciativa pública."
keyword: "legado e influência; função social da arquitetura; obras modernas do PAGE"
