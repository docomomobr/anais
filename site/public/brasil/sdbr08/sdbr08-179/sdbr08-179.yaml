abstract: 'A noção de Movimento Moderno foi construída pelos críticos e historiadores
  que se dedicaram a consagrar e consolidar, enquanto movimento de vanguarda de caráter
  unitário, as tendências arquitetônicas e urbanísticas discutidas no âmbito dos Congressos
  Internacionais de Arquitetura Moderna (1928-59). Porém, em trabalhos desenvolvidos
  depois de 1970 começou a ser questionada a validade da idéia de Movimento Moderno,
  resultando desse processo de revisão um certo consenso entre alguns autores que
  consideram mais apropriado referir-se a “movimentos”, partindo de que não há uma
  posição única entre as obras e os arquitetos que participaram nos congressos. A
  partir de 1947, a tendência de diluir a vocação original, liderada pela “geração
  do meio” – Sert, Rogers, Grupo MARS – e pela “geração jovem”, levou a importantes
  inflexões teóricas, radicalizadas em Hoddesdon (1951) quando se introduziu pela
  primeira vez um tema que não fazia parte da agenda original, abrindo caminho à superação
  da rigidez do modelo funcionalista associado com a Carta de Atenas. Neste trabalho
  se propõe analisar particularmente este último período, isto é, o que se entende
  como a última fase dos CIAM, que abrange os congressos realizados entre 1950 e 1959;
  etapa na qual foi mais expressiva a participação de representantes latinoamericanos.
  Parte-se do interesse em rastrear os elementos urbanísticos que permitem distinguir
  novas discussões e direções que surgem da crítica à abstração da cidade funcional.
  A principal contribuição da reflexão proposta é a identificação de quatro temas
  fundamentais que entendemos como “discussões transgressoras de ruptura”: 1) Concepção
  por escalas Vs.Concepção funcional, 2) Centro comunitário Vs. Centro cívico, 3)
  Rua Vs. Quadra, e 4) Valores culturais Vs. Valores funcionais. Os novos temas ou
  “discussões transgressoras” incluídos nos últimos congressos não apenas levaram
  à crise do CIAM, senão que foram a semente que fez surgir novas direções pós-CIAM
  tanto de mãos de membros como nãomembros.'
keyword: Movimento Moderno; CIAM de pós-guerra; Urbanismo moderno; Historiografia
