abstract: 'O edifício modernista sede do IRB – Instituto de Resseguros do Brasil está
  em processo de reforma e apresenta-se como um objeto de estudo de um tema relevante
  e de valorização crescente na construção civil no Brasil que é o retrofit. É uma
  edificação tombada pelo Município do Rio de Janeiro, além de estar em processo de
  tombamento pelo IPHAN e suas fachadas necessitam de intervenção a favor da eficiência
  energética e do conforto ambiental do edifício. A observação destes fatos nos remete
  ao seguinte questionamento: Seria viável um retrofit, a atualização tecnológica
  em fachadas de edificações tombadas? A proposta deste estudo é incentivar a pesquisa
  de soluções para a reforma e preservação de edifícios modernistas, propondo uma
  análise das técnicas e materiais empregados nas intervenções realizadas em referenciais
  europeus, observando que substituições de materiais e elementos vêm sendo implementados
  em busca de tecnologias mais evoluídas que configurem um verdadeiro retrofit, focando
  na envoltória da edificação. Serão apresentados neste trabalho projetos de escritórios
  de arquitetura europeus que estão focados em reformar e preservar o acervo modernista
  de seus países. Foram selecionados os projetos de reforma da ADGB Trade Union em
  (Berlim) e Lycée Chevrollier em Angers (França). Tais posturas de intervenção e
  soluções aplicadas são relacionadas neste artigo à reforma do IRB.'
keyword: retrofit; edifício tombado; edifício modernista
