abstract: Este artigo aborda algumas reflexões referentes aos desafios da preservação
  do patrimônio modernista de Cataguases, em Minas Gerais, tombado pelo IPHAN em 1994,
  provocadas pelas pesquisas e inventariado de bens para a elaboração de um Guia da
  Arquitetura Modernista da cidade, publicado em 2009. Contextualiza como a cidade
  se desenvolveu do ponto de vista sócio-econômico, da formação do seu conjunto urbano,
  da arquitetura moderna até chegar ao tombamento em 1994. Apresenta algumas questões
  do processo de tombamento que dizem respeito aos critérios de escolha dos bens tombados,
  à necessidade de se fazer um inventário dos bens de valor cultural e de um plano
  de preservação e de gestão para o centro histórico. Posteriormente, aborda as legislações
  urbanas municipais implementadas após o tombamento que não tem conseguido estabelecer
  diretrizes de preservação. Por fim, apresenta o processo de pesquisa e inventariamento
  dos principais bens modernistas para compor o Guia. O artigo conclui com algumas
  reflexões a respeito do tombamento em Cataguases relacionadas aos critérios para
  a escolha dos bens e delimitação do perímetro, bem como, da ausência de um inventário
  do centro histórico, que nos parece seria instrumento prioritário para entender
  a formação cultural daquele sítio bem como para estabelecer diretrizes e normas
  claras de preservação, o que a cidade clama desde o tombamento.
