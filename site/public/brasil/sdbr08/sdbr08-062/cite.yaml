abstract: "Tomando como referência a obra de Aldo Rossi, através de seus escritos e seus projetos, o artigo busca entrelaçar questões sobre a cidade moderna e a arte, relacionando conceitos como a autonomia, permanência e transformação, tipo e analogia. Tomando como objeto de estudo a cidade moderna, vislumbrando uma complexa construção de justaposição e superposição de fatos e de tempos, procura analisar, seguindo Rossi, as relações entre a arquitetura como arte urbana, estrutural e irredutível, os monumentos ou elementos primários (estruturantes) e a forma da cidade – e as relações entre arte e cidade –, encontrando temas comuns sobre a permanência e a mudança (história), sobre a analogia (arte) e sobre a memória (o sujeito). A partir dessa abordagem propõe estabelecer que, no contexto de uma nova episteme (em uma nova condição cultural pós-moderna), novas relações de arte e cidade estão também constituindo uma nova urbanidade."
