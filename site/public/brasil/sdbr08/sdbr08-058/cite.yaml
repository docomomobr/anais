abstract: "Entre 1940 e 1950, a população de Fortaleza passou de 180 mil para 280 mil habitantes. A repercussão deste elevado crescimento demográfico é observada em diversas esferas da vida pública. A maioria dos projetos de arquitetura ficou nas mãos de desenhistas sem qualquer formação teórica, apoiados basicamente na experiência acumulada pelo tempo. Contudo, a criação da Universidade Federal do Ceará (UFC), em 1954, apresentou um novo alento para o panorama arquitetônico da cidade. Com o lema o \"O Universal pelo Regional\", o Reitor Antonio Martins Filho, idealizador e fundador da instituição, afirmou o compromisso com as transformações modernizadoras da nação, associando a importância de uma rede de universidades públicas e gratuitas comprometidas com um projeto de desenvolvimento para o Brasil. Para Fortaleza, a criação da Universidade significou ainda mais. Possibilitou a atuação de uma primeira leva de arquitetos modernos. À contramão da ausência qualitativa vigente na ação projetual e construtiva reinante, a atuação dos jovens profissionais inseriu a cidade no panorama da produção da arquitetura moderna brasileira. O presente trabalho analisará os projetos originais do patrimônio edificado no Campus do Benfica da UFC, reconhecendo os princípios modernistas seguidos, e suas intervenções posteriores. Partindo de sua importância histórica para a inserção do risco moderno na capital cearense, alcançaremos as intervenções pelas quais estes edifícios, que por sua vez comprometeram as preexistências dos princípios modernistas. Por um lado, a idéia afirma não apenas a importância do legado do traço moderno da arquitetura da UFC para a história da arquitetura de Fortaleza. Por outro, reafirma a crítica às intervenções contemporâneas. Por fim, levanta-se a discussão de uma ação emergencial de proteção do respectivo legado. As edificações do Benfica estão sendo inventariadas pelo Departamento de Arquitetura – UFC e o IPHAN-Ce."
