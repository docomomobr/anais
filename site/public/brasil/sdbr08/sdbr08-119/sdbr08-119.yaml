abstract: Uma intervenção artística e coletiva no espaço público. O objeto da pesquisa
  é a intervenção artística “Mosaico do Lugar”, realizada coletivamente para a escada
  da Rua Oscar Pereira em Charitas, Niterói, RJ. A iniciativa partiu da estratégia
  da autora, artista plástica e coordenadora do projeto Leila B., para conseguir junto
  à Prefeitura a urbanização da rua, oferecendo como contrapartida a ação artística
  coletiva. O presente estudo procura investigar o processo de produção desse mosaico
  de mosaicos, suas implicações no plano da urbanidade e as segregações espaciais
  e socioeconômicas, utilizando como recorte a cidade de Niterói e os novos planos
  urbanísticos. No plano da produção de arte na esfera pública, propõe uma reflexão
  entre efemeridade, perenidade e a questão da autoria nas relações que se estabelecem
  entre arte, artista e comunidade, enfatizando o quanto essas práticas parecem colocar
  sob escrutínio assunções há muito aceitas e arraigadas no processo de criação artística.
