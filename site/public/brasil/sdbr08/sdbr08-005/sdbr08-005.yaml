abstract: Em ocasião de sua primeira viagem à América Latina em 1929, Le Corbusier
  conheceu o arquiteto Gregori Warchavchik através do meio artístico paulista que
  organizou a sua passagem ao Brasil. Corbusier o aconselhou a contactar Siegfried
  Giedion a fim de ampliar as redes de conexões, debates e trabalhos realizados pelos
  arquitetos modernos. A partir deste momento, as trocas de correspondências se tornaram
  uma constante ao longo de mais de uma década. Nestas cartas, autalmente presentes
  nos arquivos do gta/ETH em Zurique, constam escritos sobre suas obras realizadas,
  futuros planos para os encontros dos CIAMs, atualizações dos debates artísticos
  e políticos de seus países, da criação de um grupo de arquitetos latinoamericanos
  nos CIAMs e inclusive desabafos nas lutas em prol de uma maior difusão do pensamento
  moderno nas escolas de arquitetura. A presente contribuição, assim, propõe dar luz
  a este rico espaço de debates estabelecido entre Warchavchik, Corbusier e Giedion
  durante os anos de 1929 e 1937. Este período, em especial, se discutia a formação
  de um grupo brasileiro e a presença do mesmo na organização dos temas a partir do
  terceiro CIAM, realizado em 1930 em Bruxelas.
keyword: Gregori Warchavchik; Siegfried Giedion; CIAM
