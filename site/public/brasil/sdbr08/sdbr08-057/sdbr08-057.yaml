abstract: Este estudo tem por objetivo discutir as dificuldades enfrentadas na preservação
  de prédios considerados patrimônio histórico moderno que se encontram em áreas metropolitanas
  no Japão. Examinaremos os casos dos prédios da companhia de correios em Tókio e
  Osaka. Primeiro analisaremos os prédios dentro do contexto histórico social e sua
  linguagem arquitetônica. Depois explicaremos brevemente as leis de conservação do
  patrimônio histórico no Japão e veremos as dificuldades encontradas na conservação
  do patrimônio histórico de linguagem moderna, focalizando no caso das estações centrais
  de correio de Tókio e Osaka. Por fim discutiremos sobre a importância da opinião
  pública na conservação do patrimônio moderno dentro do contexto urbano Japonês.
  O prédio central de correios de Tókio (1931) localiza-se em frente à estação ferroviária
  de Tókio, e o prédio da central de correios de Osaka (1939) encontra-se ao lado
  da estação ferroviária de Osaka. Estes são projetos do arquiteto Tetsuro Yoshida
  (1894-1956), e se encontram em áreas super urbanizadas. Ambos os prédios foram pioneiros
  em usar a linguagem arquitetônica moderna, esteticamente exerceram de grande influência
  na arquitetura Japonesa, e são considerados pelo ministério da cultura como patrimônio
  de valor histórico e cultural. Devido à privatização da companhia de correios Japonesa,
  e a necessidade de obter maiores lucros e melhor desempenho econômico, foi proposta
  a demolição dos prédios. Os prédios que se encontram em áreas centrais das duas
  maiores cidades do Japão, foram considerados obsoletos e a proposta é de substituí-los
  por edifícios mais altos, que aproveitem melhor a rentabilidade dos terrenos. Em
  vista a possível demolição dos prédios a Docomomo Japan e Instituto Arquitetural
  do Japão (AIJ) organizou seminários e movimentos de protestos. Apesar dos esforços
  de ambas as sociedades e mesmo com o apoio do ministério da cultura Japonesa, não
  foi possível tombar os prédios como patrimônio histórico cultural. Aqui a maior
  dificuldade foi encontrada na opinião publica que tem dificuldade de entender o
  valor histórico e cultural de edificações de linguagem moderna. Veremos também a
  ameaça ao patrimônio moderno devido à privatização de empresas estatais, no caso
  a empresa de correios. A privatização de empresas estatais e a busca por maiores
  lucros põem em risco à existência de patrimônio histórico, que no caso do Japão
  muitas vezes sobreviveram a terremotos e bombardeios da segunda guerra mundial.
  O fato do Japão estar sujeito a freqüentes tremores também dificulta a preservação
  de prédios antigos, que por não obedecerem às atuais leis de seguranças são muitas
  vezes considerados estruturalmente frágeis. Reforços estruturais contra abalo sísmico
  são de alto custo e dificultam a preservação dos prédios. O prédio da estação central
  de correios de Tókio teve os trabalhos de demolição iniciados em começo de março,
  os quais foram interrompidos devido à intervenção do ministro de assuntos internos.
  Graças à intervenção do ministro o projeto de re-desenvolvimento da área que propunha
  apenas a conservação de 30% da fachada do prédio antigo foi alterado, e a atual
  tendência é que 70% da fachada sejam conservadas. Em relação ao prédio de Osaka
  o destino do mesmo ainda é incerto. Concluiremos que de maneira a viabilizar a proteção
  do patrimônio moderno em contexto urbano no Japão é preciso primeiro transmitir
  ao público a importância histórica e cultural de tais prédios e ao mesmo tempo educar
  o público sobre a estética e o movimento moderno. A opinião pública consegue identificar
  prédios da mesma época que usam uma linguagem arquitetônica revivalista, por exemplo,
  neoclássica ou neo-gótica, como patrimônio cultural, mas tem dificuldade de reconhecer
  a importância cultural de edifícios de linguagem moderna.
