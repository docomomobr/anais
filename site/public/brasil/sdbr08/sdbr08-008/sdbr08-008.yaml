abstract: O tema deste trabalho é a integração entre arquitetura, urbanismo e artes
  plásticas ocorrida em Salvador entre o final da década de 1940 e a década de 1960.
  O Decreto-Lei nº 701/48 e uma série de leis e decretos instituídos durante a década
  de 1950, resultantes dos estudos elaborados no âmbito do EPUCS (Escritório do Plano
  de Urbanismo da Cidade do Salvador) entre 1943 e 1948, estabeleceram diretrizes
  para o crescimento, modernização e infraestruturação de Salvador e provocaram uma
  transformação significativa do padrão de ocupação das áreas próximas à cidade fundacional.
  Este período coincide com a consolidação em Salvador de uma arquitetura moderna
  referenciada na escola carioca. Diógenes Rebouças, que teve um papel fundamental
  no EPUCS, foi o mais prolífico arquiteto em Salvador no período e liderou este processo,
  secundado por forasteiros como José Bina Fonyat Filho e Paulo Antunes Ribeiro e
  dominando o mercado profissional de edifícios públicos e privados de grande porte
  entre o final da década de 1940 e os primeiros anos da década de 1960. A inauguração,
  entre os últimos anos da década de 1940 e os primeiros da década de 1950, do Edifício
  Caramuru, do Hotel da Bahia e do Centro Escolar Carneiro Ribeiro, e a entrada em
  vigor, em 22 de junho de 1956, da Lei Municipal nº 686, determinando que obras de
  valor artístico integrem os novos prédios da cidade, são os marcos referenciais
  deste processo de inclusão, nas fachadas, na recepção ou em outros espaços internos
  dos principais edifícios de grande porte de Salvador, de pinturas murais, painéis
  de azulejos e esculturas de autoria dos principais nomes ligados à primeira geração
  de artistas modernos locais.
keyword: Arte Moderna; Arquitetura Moderna; Salvador
