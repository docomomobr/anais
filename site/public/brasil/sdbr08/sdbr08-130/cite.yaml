abstract: "Há uma produção de arquitetura moderna que não fez parte da formação da arquitetura brasileira de maneira oficial e acabada. Trata-se da presença de arquitetos estrangeiros em São Paulo, num contexto em que a figuração moderna e a metodologia de projeto correspondente adquiriam maior receptividade. Os limites cronológicos grosso modo se ajustam entre as décadas de 40 e 60, quando a modernização atingia um patamar mais amplo uma vez que já consolidada nas décadas anteriores pelas demandas de verticalização e pelas medidas de caráter urbanístico como o código Sabóia Ribeiro e o Plano de avenidas de Prestes Maia. Enfim, estavam ajustados novos termos de expansão e circulação na cidade. Arquitetos estrangeiros como J.Pilon(1905-1962), e L.Korngold(1897-1963) chegam ao país um pouco antes daquele momento em que a arquitetura brasileira se firmava no cenário internacional. Se o novo mundo favorecia um empenho profissional moderno, estes arquitetos alinhavam-se, cada um a sua maneira, dentro deste recorte de demandas da renovação do quadro edificado da cidade. O interesse pelas experiências dos arquitetos estrangeiros está associada à relevância da obra destes autores contribuindo positivamente no ambiente urbano para a definição de uma estética moderna em São Paulo. Por outro lado possuem outros valores sobre os quais convém refletir, em especial consideramos haver potencial valorativo enquanto patrimônio cultural, e diga-se de passagem, não apenas do ponto de vista histórico. Se tratarmos especificamente, em termos de uma arquitetura pensada para a cidade , uma arquitetura dotada de sensibilidade urbana, cujas inserções e figurações qualificam o ambiente em que se situam, podemos reconhecer alguns exemplos como contribuição ao patrimônio moderno. Para o entendimento desta questão consideramos dois projetos em São Paulo: a Biblioteca Mario de Andrade(1935) de Jaqques Pilon e o edifício Thomaz Edison(1944) de Lucjan Korngold. Estes dois projetos, conceitualmente diferentes entre si, configuram externamente uma relação espacial significativa no vazio constituído pela Praça Dom José Gaspar, dotando-a de uma qualidade urbanística digna de representar um exemplo feliz de ambiente de uso público. A presença destes estrangeiros entre nós proporciona a continuação de um processo de assimilação de referências modernas, adiantado em relação ao momento da recepção inicial, uma vez que vindo de outras experiências e já voltado para uma prática sistemática em que os novos procedimentos e experimentações se somam à cultura consolidada do arquiteto europeu. Em outras palavras, a experiência do Novo somouse nestes arquitetos ao aprendizado de arquitetura e urbanismo adquirido na vivência dos espaços urbanos tradicionais das cidades européias. A nossa hipótese é que, de certa maneira, as lições do passado reapareceram em muitos de seus projetos como princípios estéticos, em especial nos dois projetos citados."
keyword: "arquitetura moderna; patrimônio cultural; arquitetos estrangeiros"
