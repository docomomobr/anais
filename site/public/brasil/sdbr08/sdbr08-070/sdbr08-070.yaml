abstract: Apresentar os caminhos da arquitetura moderna em Fortaleza, contextualizando-a
  com as principais transformações urbanísticas ocorridas na cidade, é o objetivo
  deste trabalho. Mediante os conflitos inerentes ao processo de modernização de Fortaleza
  e os desdobramentos das relações entre o moderno e a tradição, a emergência do arranha-céu,
  com suas interfaces com as novas técnicas e materiais de construção, é revelada
  como uma síntese dos paradoxos que engendraram a produção da arquitetura moderna
  e contemporânea na cidade. Mais do que reforçar binarismos, o trabalho pretende
  elucidar as relações entre a modernidade e a tradição como um embate dialético que
  transcende a história da arquitetura e da cidade e repercute na própria arte.
