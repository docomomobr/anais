abstract: "Questionamentos são fundamentais à sociedade contemporânea, principalmente os que dizem respeito ao patrimônio, seja ele artístico, cultural, histórico ou arquitetônico. Em geral, as entidades relacionadas à preservação do patrimônio costumam direcionar o seu enfoque para edificações que se enquadram nos estilos neoclássico e eclético. O movimento moderno, que apresenta valor emblemático não só de sua época, mas também como um momento de especial importância da arquitetura brasileira, que obteve destaque no cenário internacional, ainda não é reconhecido como portador de significativo valor patrimonial. É nesse cenário, que Afonso Eduardo Reidy, em 1945, como diretor do Departamento de Urbanismo da Cidade do Rio de Janeiro, reelabora o Plano Diretor da Cidade e coordena o Plano de Urbanização do Centro da Cidade. Este último abrange a esplanada de Santo Antônio e os Aterros da Gloria e do Flamengo, futuro local de inserção do Museu de Arte Moderna – MAM. Ao explicar sua obra, Reidy comenta: \"será um dos atrativos da área conquistada ao mar, e que vai ser a sala de visitas da cidade\" (\"O quinto aniversário do Museu de Arte Moderna\". O Globo, 16 jan. 1957). Em seu partido, o Museu pressupõe uma predominância dos planos horizontais e o jogo com os pilares, marcando a fachada, contrapondo ao relevo da cidade ao fundo e a utilização de uma estrutura vazada que confere um diálogo constante entre as obras de arte expostas no museu e a natureza circundante. No entanto, todo o racionalismo plástico de Reidy é posto à prova com a construção de um anexo, aproximadamente cinqüenta anos depois, a casa de show \"Vivo Rio\". O MAM como um estudo de caso pressupõe um questionamento sobre a Contradição das Artes e Arquitetura assim como a necessidade de rediscutir a intervenção em obras consagradas de grandes arquitetos modernistas e também os valores e responsabilidades inseridas na gestão patrimonial. Discute-se finalmente o papel do MAM enquanto um espaço público que é visto por uns como um espaço arquitetônico digno de preservação e por outros como um espaço multifuncional em constante evolução. O trabalho visa o esclarecimento da proposta arquitetônica original enquanto patrimônio construído e o diálogo estético e morfológico com o seu projeto de extensão, executado, assim como uma discussão das teorias arquitetônicas embutidas nesses projetos. O desenvolvimento do trabalho busca clarificar as linguagens arquitetônicas através da realização de entrevistas com diferentes arquitetos conhecidos pelas suas discussões teóricas e produção arquitetônica visando embasar e ampliar esses questionamentos."
keyword: "Arquitetura Moderna; Patrimônio Moderno; Valor Patrimonial"
