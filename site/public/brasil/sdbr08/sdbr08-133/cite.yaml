abstract: "Embora a síntese das artes tenha sido uma aspiração coletiva, identificada com uma agenda social compartilhada pelos arquitetos modernos, especialmente no pós-guerra, não há nada de automático em sua realização, se caracterizada como problema artístico. O artigo pretende reexaminar a questão através de um tema recorrente, que envolve a relação entre arquitetura e escultura na tradição moderna, mas que de certo modo pode ser visto como antitético com respeito a certas visões de síntese das artes nessa mesma tradição. O tema a que me refiro é a persistência da representação naturalista da figura humana em esculturas que integram espaços arquitetônicos modernos. Para provar que se trata, sim, de um “tema de composição”, e não de epifenômeno, basta com recordar os inúmeros casos de espaços arquitetônicos e urbanos modernos amplamente conhecidos em que isso se dá de modo intencional, desde a inclusão da figura feminina em bronze de Georg Kolbe no Pavilhão de Barcelona por Mies, às sobejas demonstrações brasileiras no tema, do Ministério à Pampulha. O artigo espera contribuir para aprofundar a discussão compositiva dessa relação, onde a síntese resiste a ser compreendida apenas nos limites da unidade estilística ou iconográfica: a representação naturalista da figura humana na escultura pertence a um corpus acadêmico que poderia ser descrito como oposto às buscas de uma formulação abstrata do espaço arquitetônico. Com base na noção de projeto como noção capaz de criar um campo de correlações entre arte, arquitetura e cidade, o artigo pretende examinar a natureza da síntese mais como a poética do “colocar em relação” que como discurso de assimilação ao ideal da unidade estilística."
