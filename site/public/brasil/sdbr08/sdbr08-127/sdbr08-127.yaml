abstract: O Brasil, enquanto país-sede da Copa Mundial de 2014, influencia os Estados
  brasileiros a se empenharem em melhorias em seus estádios de futebol, bem como nas
  infra-estruturas das suas cidades (segurança, turismo, transporte e etc.), devido
  a disputa entre elas para se tornarem cidades-sede da copa. Muitas já possuem Estádios
  de grande porte que, no entanto, deverão ser reformados, ampliados e adaptados segundo
  os padrões exigidos pela FIFA (Federação Internacional de Futebol). A seguinte pesquisa
  trata da análise da estrutura do Estádio Governador Alberto Tavares Silva, inaugurado
  em Agosto de 1973, um dos 10 maiores do país, com capacidade para cerca de 60.000
  pessoas e Patrimônio Moderno do Estado, além da análise das modificações estruturais
  e funcionais acontecidas mediante a reforma que está sendo realizada pelo Governo
  do Estado do Piauí. A metodologia trabalhada é a mesma utilizada no grupo de Pesquisa
  “Modernidade Arquitetônica” da Universidade Federal do Piauí, cadastrado no CNPq
  e orientado, pela Arquiteta,Professora e Doutora em Projetos Arquitetônicos pela
  ETSAB/ UPC, Alcilia Afonso de Albuquerque Costa, que segue os métodos do departamento
  de projetos arquitetônicos da Escola Técnica Superior de Arquitetura de Barcelona,
  ETSAB/ UPC da linha “la forma moderna”; que utiliza a coleta de dados em arquivos
  públicos e privados, entrevistas, visitas a obras, análise fotográfica e redesenho
  do projeto para a sua melhor compreensão. O estudo tem como objetivo mostrar a importância
  do Movimento Moderno na contemporaneidade através da análise arquitetônica do Estádio,
  conhecido como Albertão. Aqui ressaltamos a valorização do patrimônio moderno dentro
  de um contexto urbanístico e histórico da cidade, visando explanar o impacto, positivo
  ou negativo, da revitalização dessa área e a influência deste na estrutura urbana,
  social e cultural de Teresina.
keyword: Estádio; Arquitetura Moderna; Teresina
