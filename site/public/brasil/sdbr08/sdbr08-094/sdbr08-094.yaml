abstract: 'No Brasil, os anos de 1930 a 1960 irão colher os frutos dos movimentos
  ocorridos no início do século XX: centralização do poder nas mãos do Estado, alfabetização
  em massa, uniformização da população, primeira grande guerra, pós-guerra, industrialização,
  tentativa de democratização. Em meio a esse período sócioeconômico-cultural conturbado,
  a arquitetura destaca-se como solução para a criação de uma identidade nacional
  e fortalecimento dos ideais do nosso país como nação. A denominada arquitetura moderna
  brasileira lança-se em comunhão com o governo, avança e torna-se ícone de renovação
  mundial, criando obras que conciliavam os princípios arquitetônicos racionais com
  a questão do regionalismo e tradição local. Com a ascensão da nova arquitetura,
  renasce, em meio ao processo de integração das artes, a arte da azulejaria, adormecida
  pelos insistentes movimentos de repressão a tudo que se relacionava à arquitetura
  neocolonial. O reavivamento do material decorreu do fato de o discurso moderno brasileiro
  casar a tradição com a modernidade e fazer dos materiais nacionais e tradicionais
  ponte de ligação entre o colonial e a vanguarda. Por meio desse processo, o artigo
  objetiva destacar a arte da azulejaria durante o movimento moderno, como elemento
  integrante na conformação de um discurso e de uma arquitetura nacional e como participante
  na síntese entre as artes. O Ministério da Educação e Saúde Pública (MESP) – hoje
  denominado Palácio Gustavo Capanema – é o edifício elencado para a discussão desse
  processo. O uso do azulejo no edifício do MESP, ícone da arquitetura moderna no
  Brasil, foi o início de um processo que durou até meados de 1960, perpassando por
  obras importantes como o Conjunto Pedregulho e o Conjunto da Pampulha. Perante um
  processo de globalização mundial e banalização da cultura, o entendimento do papel
  do azulejo na arquitetura brasileira pode auxiliar na preservação desse bem – que
  é patrimônio nacional – e evitar que essa memória seja esvaecida.'
