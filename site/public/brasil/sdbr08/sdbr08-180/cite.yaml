abstract: "Em 1955, ainda recém instalado na cidade, o jovem arquiteto David Libeskind venceu o concurso fechado para o Conjunto Nacional. A obra está vinculada ao processo de deslocamento do capital do Centro Novo para a Avenida Paulista e contribuiu para acelerar a verticalização e a mudança de uso e ocupação dessa região. Representou também uma nova tipologia para os edifícios multifuncionais que surgiram em São Paulo a partir de 1935 com a construção do Edifício Esther de Álvaro Vital Brazil e Adhemar Marinho. O Conjunto Nacional nasce em um momento de grandes transformações da cidade de São Paulo, quando esta se estabelece como \"Metrópole Moderna\" - já contando em 1954 com uma população de 2.817.600 habitantes - tornando-se a maior metrópole brasileira. No contexto específico da arquitetura paulista, o crescimento vertiginoso de São Paulo coloca em pauta a relação entre o edifício e o meio urbano. Convergem nesse momento discussões e concepções teóricas esparsas presentes no meio já há pelo menos uma década e que defendiam a primazia da cidade sobre o objeto isolado. Trata-se, portanto, de um projeto resultante da compreensão dessa cidade em expansão, da leitura que se estabelece a partir de uma nova dinâmica urbana. Objeto absolutamente inquietante do ponto de vista da escala, propõe uma abordagem de uso e ocupação do solo da cidade para afirmar-se como ponto de inflexão no raciocínio do enfrentamento da implantação ou da estratégia de ocupação do lote. Nesse sentido, a transição quase imperceptível que se estabelece entre o espaço público do passeio – a cota da cidade – e o térreo do edifício, promove relações ímpares nesse novo lugar criado pelo diálogo estabelecido com o espaço coletivo. A cidade em expansão acolhe o edifício, que por sua vez abriga as novas funções e necessidades programáticas que passam a figurar na jovem metrópole, espécie de simbiose urbana. Com aproximadamente 150.000m² de área construída, o programa está distribuído em dois grandes volumes: um horizontal, que ocupa todo o terreno – uma gleba de 14.600m² – e outro vertical, que se desenvolve sobre pilotis, sobre o terraço–jardim do bloco horizontal. O volume horizontal corresponde ao conjunto comercial, com galerias de lojas, restaurantes, livraria, bancos e cinemas, distribuídos em três pavimentos, além do terraço-jardim – concebido como uma grande praça pública, decisão de projeto que confere a esse pavimento características urbanas. Na grande lâmina vertical, três torres contíguas com acessos independentes permitem a convivência de usos distintos como escritórios, consultórios e residências. A articulação com a cidade ao nível do solo, com as calçadas em pedra portuguesa adentrando seus espaços internos de pé-direito generoso por todas as quatro calçadas lindeiras, demonstra a consciência do arquiteto sobre o novo papel do edifício de caráter urbano, concebido como extensão do espaço público. Os aspectos de cunho econômico e ideológico rapidamente ganharam novas dimensões e influenciou consideravelmente a urbanização brasileira e particularmente a paulistana deste período. Mas vale destacar que são as feições relacionadas à cultura e ao comportamento do indivíduo nessa nova sociedade que sinalizam para assertiva de que \"Toda reflexão envolvendo direta ou indiretamente a cultura moderna passou, a rigor, pela condição metropolitana\". Portanto, a possibilidade de olhar para essa cidade dos novos fluxos, onde a diversidade programática se coloca para promover dinâmicas outras e estabelecer a construção de novos territórios aponta um caminho substancioso para a reflexão sobre a cidade contemporânea e suas questões imanentes."
