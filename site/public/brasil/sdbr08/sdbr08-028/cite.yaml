abstract: "O artigo aborda o estado factual do canteiro de Brasília em setembro de 1959, quando ocorre o Congresso Internacional Extraordinário dos Críticos de Arte. Através da correspondência diplomática e dos Anais do Congresso é possível explorar a compreensão dos participantes e então contrapor com as fotografias da utopia que cidade em construção ensejava. O artigo aborda ainda a participação do Ministério das Relações Exteriores e de Oscar Niemeyer no evento que se configurou como o mais estratégico para divulgar Brasília. Palvras-chave: Brasília, 1959, Congresso Internacional Extraordinário dos Críticos de Arte Brasília."
