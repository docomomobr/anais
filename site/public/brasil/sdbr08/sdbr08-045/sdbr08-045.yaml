abstract: 'Na década de 1950 surge em São Paulo o movimento concretista, num ambiente
  de iniciativas públicas e empresariais de patrocínio artístico divulgando em 1952
  o manifesto “Ruptura” definindo princípios estéticos, éticos e políticos e propondo
  “uma renovação dos valores essenciais das artes visuais”, associando-se a seguir
  aos poetas do grupo Noigrandes. No Rio de Janeiro a tendência abstrato- geométrica
  define o Grupo Frente (1953); após a Exposição Nacional de Arte Concreta (SP e RJ,1956)
  forma-se a dissidência neoconcreta que publica seu manifesto em 1959. Rejeitando
  o “excessivo racionalismo” paulista propunham um “racionalismo sensível”. O “racionalismo
  poético” do neo- concretismo carioca propunha uma liberdade de movimentos estranha
  à postura paulista da arte concreta. Além da presença de arquitetos nos movimentos
  artísticos concretos outros pontos de contacto podem ser traçados com a arquitetura:
  no então nascente brutalismo paulista, a racionalidade estrutural e material e de
  uma geometria extrema que se auto-justifica parecem se afinar com o concretismo
  e sua rejeição ao natural/figurativo/regional. O auge desses debates duas casas
  de Vilanova Artigas (Baeta, 1956 e Mendonça, 1959) parecem dialogar com os debates
  artísticos, culturais e políticos daquele momento, especialmente, mas não exclusivamente,
  o concretismo.'
