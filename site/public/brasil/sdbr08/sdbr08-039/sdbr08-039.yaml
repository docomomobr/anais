abstract: A influência que a moderna arquitectura brasileira exerceu sobre a produção
  portuguesa na segunda metade do século XX é facto amplamente provado e já estudado
  pela historiografia. É igualmente possível traçar o itinerário que fomentou a aproximação
  entre as duas culturas arquitectónicas e o modo como os arquitectos portugueses
  reuniram um conhecimento alargado sobre as realizações brasileiras desse mesmo período.
  Sabe-se da importância de Brazil Builds – Architecture New and Old 1652-1942, que
  os portugueses manuseiam desde meados da década 40, assim como das revistas internacionais
  que acumulam (caso da revista francesa L'Architecture d'Aujourd'hui cuja famosa
  edição dupla sobre o Brasil de 1952 seria muito disputada entre os portugueses)
  e que folheiam à procura de novidades do Brasil. Estas relações intensificaram-se
  com a passagem de duas exposições de arquitectura brasileira por Lisboa, num momento
  de abertura do país à cultura internacional decorrente da vitória Aliada na II Guerra.
  A primeira ocorre entre 1948 e 1949 nas instalações do Instituto Superior Técnico,
  permanecendo aberta ao público durante apenas 3 dias. Torna-se relevante face à
  repercussão que teve no arquitecto português Sebastião Formosinho Sanchez (19222004)
  que então endereça uma carta à direcção da revista Arquitectura destacando a superioridade
  da produção brasileira sobre o que os portugueses projectam, mesmo os de inspiração
  moderna. A publicação desta carta funciona como uma chamada de atenção colectiva
  para o progresso da arquitectura brasileira. A segunda exposição é inaugurada na
  sequência da realização do Congresso da União Internacional de Arquitectos, em 1953,
  também na capital portuguesa. Esta última é amplamente reportada na imprensa especializada.
  Na sua delegação chegam a Lisboa personagens como Lúcio Costa (cujos artigos são
  publicado na revista Arquitectura) e Wladimir Alves de Souza, cuja conferência terá
  grande impacto. Uma das personagens mais referenciadas é contudo Burle Marx, com
  direito a artigos exclusivos. É precisamente enquanto participante nos trabalhos
  de montagem desta exposição que iremos encontrar um outro arquitecto português,
  Francisco Castro Rodrigues (n. 1920), às vésperas de embarcar definitivamente para
  território angolano onde trabalhará até aos anos 80. Castro Rodrigues levará na
  sua bagagem, muita informação sobre a arquitectura brasileira. No Lobito, onde se
  instala, será um dos responsáveis pelo Núcleo de Estudos Angolano-Brasileiros, uma
  organização à margem do poder político interessada em explorar as proximidades entre
  Angola (à época sob governo colonial português) e o Brasil. Rodrigues cumprirá o
  sonho de realizar uma exposição de arquitectura brasileira no Lobito somente em
  1961. “Arquitectura Moderna Brasileira” é o título desta exposição itinerante, para
  a qual prepara um catálogo e uma palestra onde enaltece a técnica brasileira do
  concreto armado (betão nú, como lhe chama), a modernidade cultural e os laços históricos
  que unem os angolanos aos brasileiros. É ainda visível o modo como a produção deste
  arquitecto é atravessada pelo imaginário brasileiro que tanto admira. Existe, portanto,
  um itinerário de transmissão da cultura brasileira em território português que acaba
  por se comunicar também às regiões africanas como é prova a história particular
  de Francisco Castro Rodrigues e das exposições onde esteve presente, quer como espectador
  quer como organizador.
