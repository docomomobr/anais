abstract: '“É notável como a arquitetura recuou; suas limitadas possibilidades de
  influenciar onde ainda há muito a ser feito, seu limitado poder de convicção perante
  a sociedade, os detentores do poder e até mesmo os próprios arquitetos: uma disciplina
  bastante indisciplinada. Mas se nos colocarmos em posição de observatório, e de
  longe olharmos o panorama, com certa acuidade, encontraremos algumas obras que nos
  mostram outros caminhos. Representam uma nova etapa, talvez sem heróis. São pragmáticas
  que propõem uma resposta arquitetônica completa às circunstâncias de fazer arquitetura
  na América do Sul.” (TORRENT, 2002, p. 10-13, tradução do autor). Durante o período
  moderno, a arquitetura latino-americana se desenvolveu na esteira dos estados de
  bem-estar social, do sonho de uma sociedade moderna, onde os interesses coletivos
  se sobrepunham aos individuais, concretizada através de encargos públicos: edifícios
  educacionais, obras de infraestrutura e conjuntos habitacionais. Estados foram decisivos
  no fomento de novas construções, muitas delas em escala monumental, reafirmando
  políticas de diminuição da desigualdade, estímulo ao desenvolvimento econômico,
  social e cultural, materializando um mundo novo. Essa perspectiva otimista perdeu
  força gradativamente a partir dos anos 1970. A adoção de políticas neoliberais diminuiu
  drasticamente os investimentos governamentais ocasionando o distanciamento da busca
  por uma sociedade mais justa, e trazendo fortes consequências para a disciplina.
  Hoje nos encontramos em um novo momento de cambio de paradigmas. Embora a arquitetura
  latino-americana sempre tenha enfrentado contextos de escassez, o cenário de crises
  consecutivas – econômicas, sociais e climáticas – potencializam um campo de trabalho
  para práticas contemporâneas capazes de evidenciar o papel fundamental do arquiteto
  mesmo em situações onde os problemas político-econômico são evidentes e definidores.
  Em nossa recente história, o território latino-americano tem sido habitado e construído
  concomitantemente. São paisagens que se modificam em um processo complexo de transformação
  capaz de gerar cidades em contínua construção, um cenário impreciso que a arquitetura
  é cada vez mais desafiada a enfrentar. Ao afirmarmos que na América Latina somos
  mais geográficos que históricos, demonstramos esta condição de recente urbanidade
  e a incipiente reflexão sobre o nosso contexto.'
