abstract: "A gestão de resíduos sólidos urbanos é um desafio crescente enfrentado por cidades em todo o mundo. Com o aumento da urbanização e da população, ocorre um crescimento exponencial na quantidade de resíduos gerados, tornando a gestão eficaz desses materiais uma prioridade para governos e comunidades. Em Porto Alegre, como em outras cidades, a separação inadequada de resíduos tornou-se um problema significativo, impactando diretamente a eficiência dos sistemas de coleta, reciclagem e disposição final. A separação na origem dos resíduos é uma das questões mais importantes para uma gestão eficaz. Quando os resíduos recicláveis são misturados com orgânicos ou outros materiais, eles frequentemente se tornam inutilizáveis, perdendo seu valor como recurso financeiro e aumentando a quantidade de lixo que acaba em aterros sanitários. Se os resíduos forem separados adequadamente, as cidades podem otimizar os serviços de coleta seletiva, reduzindo custos operacionais. Prédios de apartamentos concentram grande densidade populacional em espaços reduzidos, o que exige soluções específicas para a gestão de resíduos, deixando essa tipologia, dessa forma, no foco de desafios ambientais, sociais e econômicos que impactam diretamente o cotidiano urbano e a sustentabilidade das cidades. Porto Alegre flexibilizou as leis do código de edificação para depósito de resíduos, permitindo substituir áreas específicas e fechadas de armazenamento por contentores de lixo seco e orgânico, somente exigindo piso lavável e um ponto de água e esgoto. Embora essa medida ofereça uma solução econômica para construtoras, ela ignora o impacto no armazenamento de resíduos durante toda a vida dos edifícios. O resultado pode ser a presença de containers a céu aberto nas dependências dos condomínios, afetando a qualidade de vida e higiene dos moradores, tanto por questões visuais, olfativas e sanitárias, com a presença de pragas e vetores nesses espaços. O objetivo desse projeto é desenvolver um modelo integrado para a gestão de resíduos sólidos em prédios de apartamentos em Porto Alegre, abordando três dimensões fundamentais: recursos físicos, metodológicos e humanos."
