abstract: "A partir da segunda metade do século XIX, o rio Itajaí e seus afluentes foram os principais caminhos que viabilizaram a ocupação do território catarinense pelos imigrantes europeus, entre a cidade de Itajaí, no litoral, e o planalto serrano, na região central do estado. Os colonos traziam consigo técnicas de navegação fluvial que possibilitavam o transporte de pessoas e de mercadorias. As condições de navegação, que nem sempre eram as melhores, considerando-se a existência de trechos com corredeiras e um desnível de cerca de 350 metros entre o Alto Vale e a foz do rio Itajaí-Açu, determinavam os primeiros assentamentos que, aos poucos, foram configurando cidades e distritos que hoje constituem a região do Vale do Itajaí. A partir de 1909, a Estrada de Ferro Santa Catarina (EFSC) passa a ser instalada ao longo do vale do rio Itajaí-Açu, num processo lento que se arrastou por décadas. Na metade do século XX o transporte ferroviário passa a ser a principal via de escoamento de mercadorias entre o planalto e o Porto de Itajaí. Entre as principais cidades do Vale do Itajaí, a ferrovia também se torna o principal modal de transporte de pessoas. O trecho ferroviário no Alto Vale, entre as cidades de Rio do Sul e Trombudo Central, foi o último a ser implantado, em função de dificuldades técnicas – sobretudo a necessidade de construção de uma ponte sobre o caudaloso rio Itajaí do Sul, afluente do Itajaí-Açu – e de impasses políticos, qual seja o impacto do início da Era Vargas na política catarinense."
