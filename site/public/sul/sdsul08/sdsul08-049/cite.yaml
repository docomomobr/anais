abstract: "Marina é único projeto de uma cidade inteiramente concebida por Oscar Niemeyer em território brasileiro. Projetada em 1955, é anterior ao projeto de Brasília. Localizada no vale do urucuaia, norte de Minas Gerais, faz parte de um macro projeto de desenvolvimento rural e agropecuário da região. Além de tais aspectos, por si interessantes e dignos de estudo, a análise do projeto urbano permite entrever aproximações e diferenças entre o projeto urbano de Niemeyer, e por extensão brasileiro, dos modelos internacionais que embasam a própria arquitetura moderna brasileira, destacadamente aqui os de Le Corbusier e de Ivan Leonidov para cidades lineares. Destacam-se na análise aspectos paradigmáticos do projeto que encontram reverberações na produção da escola paulista de arquitetura como o imbricamento de projeto urbano, infraestrutura e edifício. Dentro do quadro analítico esboçado visualiza-se como o projeto da Cidade Marina põe questões amplas e importantes para toda arquitetura moderna brasileira relativas ao território, à natureza, à monumentalidade e aos limites do próprio projeto brasileiro como ordenador de uma realidade e indutor do desenvolvimento. Questões tão centrais que estarão presentes também em Brasília. Por fim, destaca-se um aspecto central do projeto que sugere uma compreensão nova do traço de Niemeyer e uma solução auspiciosa para espaços simultaneamente verdes, infraestruturais e de uso coletivo."
