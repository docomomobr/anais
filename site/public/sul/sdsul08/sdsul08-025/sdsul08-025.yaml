abstract: O objeto desse artigo é explorar possibilidades para uma arquitetura de
  infraestrutura de mobilidade, que aproveite a ampla acessibilidade urbana de que
  dispõe o Vale do Anhangabaú, considerando a rede de mobilidade como um dos elementos
  principais na estruturação de centros urbanos. É essencial ressaltar a função histórica
  do Anhangabaú e seu entorno, reconhecidos como a primeira centralidade moderna e
  parte integrante da rede de mobilidade metropolitana da cidade. Ao falar em mobilidade
  no Anhangabaú é preciso examinar a estrutura das diversas cotas que fluem para esse
  importante espaço público. É necessário articular tal estrutura com todas as redes
  viárias e de convergência de fluxos de pedestres rumo aos transportes públicos que
  servem a área. Assim, parte-se do pressuposto de que a acessibilidade potencial
  pode fomentar um “ambiente de mobilidade”, substituindo a atual configuração, marcada
  apenas por pontos de parada de diferentes modos de transporte. Serão consideradas
  as intervenções decisivas já assimiladas ao Vale, como a galeria viária e as estações
  de Metrô, que, embora isoladas nas extremidades, podem ser melhor articuladas espacial
  e funcionalmente ao tecido urbano da Área Central. A chegada da Linha 19-Celeste
  do Metrô ao Anhangabaú, com duas novas estações, é vista como fundamental ao exercício
  proposto, dado o potencial transformador que a chegada de uma linha de metrô oferece,
  reafirmando ali sua dimensão metropolitana. Assim, o metrô é entendido como propulsor
  de mudança. Destaca-se a importância de cautela ao intervir em um tecido urbano
  consolidado. A metodologia adotada entende o Projeto de Arquitetura como forma de
  produção de conhecimento. A pesquisa utilizou a ação projetual como ferramenta de
  análise, permitindo identificar desafios enfrentados pelos projetos precedentes.
  O desenho, empregado como filtro crítico, possibilita uma melhor compreensão dos
  fluxos, desníveis, acessos e capacidades, sustentando a ideia de projeto como processo.
