abstract: O presente artigo centra-se no estudo da revista Técnica (1940-1959), principal
  veículo especializado na Bahia à época, vinculado ao Sindicato de Engenheiros da
  Bahia e à Escola Politécnica da então Universidade da Bahia. Interessa-nos analisar
  o conteúdo da revista identificando temas voltados para urbanismo e, dessa forma,
  entender quais eram as problemáticas enfrentadas e as inquietações diante do crescimento
  e expansão da capital baiana. Apesar de que a revista tem, como o próprio nome indica,
  uma ênfase maior em temas voltados para as diversas engenharias (em especial, civil
  e mecânica), nota-se que, aos poucos, vão surgir artigos que mostram, por um lado,
  um interesse por visibilizar a atuação desses profissionais no campo do urbanismo
  e, pelo outro, a pouca atuação de arquitetos nesse tipo de questões. O que se percebe
  é que o conteúdo voltado para a temática urbana pode ser organizado em dois grupos
  bem definidos; o primeiro esteve voltado para os desafios por conectar o próprio
  Estado baiano, entendido como política governamental; já o segundo grupo de artigos
  centrou-se nos desafios por modernizar a cidade de Salvador diante dos processos
  de expansão urbana intensificada nessas décadas. Esse cenário evidencia não só as
  diversas problemáticas enfrentadas por esses profissionais, mas, também, o desejo
  por enfrentá-las a partir de um viés técnico e racional, levando em consideração
  as eventuais limitações, aspectos históricos e estéticos.
