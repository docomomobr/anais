abstract: O trabalho investiga a criação BRT, destacando sua relação com o Plano de
  Curitiba, desenvolvido nas décadas de 1960 e 1970 por um grupo de arquitetos do
  Instituto de Pesquisa e Planejamento Urbano de Curitiba (IPPUC). Sua característica
  dominante é a integração entre o uso do solo e os padrões de mobilidade, configurando
  os eixos estruturais da cidade. Em Curitiba, o papel do arquiteto foi preponderante
  para a definição de uma estrutura urbana integrada, reinterpretando o conceito de
  TOD e reverberando uma abordagem estruturalista na organização do espaço urbano.
  A pesquisa serve-se da investigação nas fontes primárias do arquivo IPPUC e da revisão
  da literatura, com o objetivo de explorar a criação do BRT no âmbito da sua contribuição
  para o legado da arquitetura brasileira.
