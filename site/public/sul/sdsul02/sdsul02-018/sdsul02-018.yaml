abstract: Formas sinuosas e aerodinâmicas caracterizam a maior parte das revendas
  de automóveis e oficinas mecânicas construídas em Caxias do Sul, Rio Grande do Sul,
  nas décadas de 1940 e 50. Buscando corresponder ao arrojo formal dos automóveis
  que ali eram comercializados, inicialmente, esses edifícios assumiram uma linguagem
  Art Déco com inflexão expressionista e, a partir do domínio do concreto armado,
  arriscaram inusitadas experiências estruturais com linguagem modernista. No conjunto,
  esses exemplares assumiram um certo papel de vanguarda na cidade, introduzindo um
  vocabulário arquitetônico que foi sendo gradativamente assimilado e incorporado
  pela população (COSTA, 2001; SEGAWA, 1999). Entre diversos exemplares com estes
  programas, o edifício da Brasdiesel (1958) merece especial atenção, pela complexidade
  do programa e tentativa de expressão escultórica do concreto. Por ter um programa
  similar ao industrial, o edifício ensaia a racionalização do sistema estrutural,
  reticulando pilares e vigas, que buscam alcançar grandes vãos livres. Diante do
  possível valor patrimonial destes edifícios, este trabalho objetiva identificá-los
  e examinar como incorporaram o uso do concreto e, mais especificamente, como a Brasdiesel
  explora as possibilidades escultóricas de seu uso. Uma pesquisa iconográfica inicial
  sobre os referidos edifícios permite analisar suas semelhanças e especificidades.
  A partir de uma breve revisão bibliográfica, busca-se discutir as experiências estruturais
  com o uso do concreto na arquitetura moderna brasileira e a ocorrência de programas
  arquitetônicos similares no Brasil e no Rio Grande do Sul. De modo conclusivo, é
  discutida a relação entre a produção caxiense, gaúcha e brasileira. Em Caxias do
  Sul, com o uso do concreto, a arquitetura das concessionárias ganhou expressão e,
  ao mesmo tempo, deu expressão ao produto comercializado. Tornou-se promotora de
  um tipo de publicidade, como “uma máquina de vender máquinas”.
keyword: Arquitetura Moderna; concessionárias; Caxias do Sul
