abstract: "A utilização da cobertura como um espaço para ser vivido remonta aos antigos construtores vernaculares e estabelece uma relação direta com a forma da edificação. A diversidade de formas e tipologias arquitetônicas se definem de acordo com o uso e, em outras situações, o uso define a forma. O conceito terraço-jardim de Le Corbusier, expõe motivos técnicos, econômicos, de conforto, e, inclusive, emocional. Trás a proposta de recuperar a vegetação subtraída do solo para a cobertura do edifício, medida compensatória da transformação do ambiente natural em ambiente construído. Com a difusão da arquitetura moderna o conceito de terraço-jardim foi adotado por outros arquitetos. No Brasil, foi utilizado por Lúcio Costa e a equipe responsável pelo projeto da sede do Ministério da Educação e da Saúde. Em Porto Alegre, Emil Bered, no edifício de apartamentos Rio Grande do Sul, trata a cobertura sobre a garagem, como um terraço para uso infantil. Na época, o uso do concreto como laje de cobertura era evitado em Porto Alegre devido as dificuldades técnicas na execução da impermeabilização. Este trabalho tem por objetivo investigar quando a cobertura, na arquitetura moderna da capital gaúcha, passa a ser utilizada como um lugar de viver, quais as diretrizes urbanísticas que levam a isto e como os arquitetos as representam? Palavras-chave: cobertura, arquitetura moderna, diretrizes urbanísticas"
keyword: "cobertura; Arquitetura Moderna; diretrizes urbanísticas"
