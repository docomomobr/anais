id: sdpr02-007
type: paper-conference
title: "Patrimônio Cultural Edificado em Anápolis-GO: diálogos entre a Arquitetura e a cidade"
container-title: "2º Seminário Docomomo Paraná, Londrina, 2012"
event-title: "2º Seminário Docomomo Paraná, Londrina, 2012"
event-place: "Londrina, PR"
publisher-place: "Londrina, PR"
issued:
  date-parts:
    - [2012, 10, 1]
language: pt-BR
abstract: "O presente trabalho apresenta a manifestação da modernidade em Anápolis-GO, cidade localizada entre Goiânia e Brasília, atentando-se aos processos de difusão do ideário modernista entre 1930 e 1970. Destaca-se, nesse contexto, a relação entre edifício e cidade, visíveis pelas transformações urbanas de reconfiguração da área central e implantação do bairro Jundiaí aos moldes da cidade-jardim, entre as décadas de 1940 e 1960. E, na configuração da paisagem da cidade \"modernizada\" foi possível distinguir expressões edilícias em sua arquitetura ao analisarmos as residências erguidas no período como: exemplares modernistas legítimos, apropriados e popularizados — categorias estas definidas ao longo da pesquisa para caracterizar a expressão de modernidade alcançada em Anápolis. Essa metodologia foi necessária visto que alguns exemplares possuíam elementos mais evidentes que outros que, somados à sua localização na cidade permitiu perceber a própria ocupação do tecido urbano, evidenciando os processos de desenvolvimento e crescimento ao longo do período selecionado, uma vez que a grande maioria dos exemplares de caráter modernista se distribuíram entre a área central renovada e o bairro planejado Jundiaí.\nAo evidenciar que a construção da cidade, em seu período de modernização (1940-1970), perpassou as escalas arquitetônica e urbana, podemos vislumbrar como os fenômenos socioculturais contribuíram para a formação da paisagem cultural, uma vez que o desejo coletivo de modernização se manifestava na produção desses exemplares residenciais, seja em suas feições mais legítimas, dada a migração de arquitetos e engenheiros para fora dos centros metropolitanos; seja pela apropriação e difusão do ideário modernista à medida que a própria população erguia suas residências, assimilando os elementos e/ou reinterpretando-os.\nDesse modo, a cidade fora se configurando e se renovando sob a égide da modernidade, buscando se alinhar ao pensamento que chegara ao Centro-Oeste via ferrovia, em meados dos anos 1930 e, depois, entre a construção das capitais planejadas Goiânia (1933) e Brasília (1960). Nesse sentido, a difusão do pensamento modernista alcançava as áreas interioranas, em que se refletiam as ideias da nova capital do Estado de Goiás e do país. Cidades que emergiram no seio da modernidade e cunharam novas possibilidades de desenvolvimento, com a tão pretendida integração nacional."
