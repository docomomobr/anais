ISBN: "978-85-61965-40-2"
language: pt-BR
abstract: "O campo da preservação arquitetônica contém um saber específico que envolve princípios e métodos, que deveriam ter aplicabilidade semelhante em obras de distintos períodos, desde a antiguidade até o período moderno, e diferentes tipologias, desde hospitais até residências. A indústria, dada sua característica utilitária e sua necessária adaptação à vida contemporânea, constitui um programa com muitos desafios, cujo enfrentamento envolve questões que permitem refletir sobre o patrimônio arquitetônico moderno. O programa industrial revela-se como uma fonte preciosa para a compreensão dos caminhos da arquitetura moderna. A sua resposta às questões da funcionalidade, da utilidade e da objetividade constituíram estímulo para o desenvolvimento de arrojadas formas e estruturas; e condição para a experimentação pioneira de novos materiais e tecnologias no quadro de construções eminentemente utilitárias. Tema presente na historiografia da arquitetura, as indústrias, dada a complexidade dos problemas relativos a sua preservação, não têm recebido a mesma atenção por parte dos órgãos de patrimônio, tampouco são compreendidas pelos usuários, proprietários e muito menos pelo mercado imobiliário como um bem artístico-cultural. A análise da preservação desse patrimônio, em toda sua complexidade, que envolve questões de distintas naturezas: econômica, artística e funcional, e a divulgação do seu valor artístico poderão contribuir para o debate sobre o patrimônio moderno no Brasil. A Fábrica Olivetti em Guarulhos (SP), projeto do arquiteto italiano Marco Zanuso, no ano de 1956, foi transformada, recentemente, em um shopping center e fornece muitos elementos para a discussão da preservação do patrimônio industrial moderno."
