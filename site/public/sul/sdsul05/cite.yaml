id: sdsul05-012
type: paper-conference
title: "A persistência da tradição disciplinar moderna na arquitetura de Oscar Niemeyer para as artes performativas: o teatro popular Oscar Niemeyer em Niterói e o teatro Raul Cortez em Duque de Caxias"
container-title: "5º Seminário Docomomo Sul, Porto Alegre, 2016"
event-title: "5º Seminário Docomomo Sul, Porto Alegre, 2016"
event-place: "Porto Alegre, RS"
publisher-place: "Porto Alegre, RS"
issued:
  date-parts:
    - [2016, 7, 25]
ISBN: "978-85-61965-40-2"
language: pt-BR
abstract: "Nas propostas para as artes performativas, Niemeyer manipula formas criando espaços mágicos seja em arena ou em palco frontal. Há algumas opiniões críticas sobre as dificuldades acústicas ou às dispersões que soluções inusitadas causam no espectador, mas seus teatros são obras que persistem na tradição disciplinar moderna como se pretende examinar neste paper à luz das cinco razões teóricas da arquitetura do arquiteto proposta por Mahfuz (2007) e da última fase de sua produção que “acompanha, de algum modo, a recuperação da própria arquitetura moderna e o seu entendimento como polifonia” (Comas, 2012). Nas obras em exame, percebe-se um conteúdo literário e artístico que ainda potencializa os preceitos do Movimento Moderno acentuado pela busca da integração entre arquitetura e artes. Nas volumetrias e interior dos dois teatros, para além da sensação visual provocada pela forma, cor e textura, verificase o uso de diferentes linguagens. Um dos partidos adotados nos dois teatros foi abrir para o exterior a parede posterior do palco, permitindo que os espetáculos possam ser usufruídos concomitantemente pelos espectadores do auditório e pelo público nas praças adjacentes. Tal solução adequa-se à sugestão de Le Corbusier formulada no Congresso Architecture et Dramaturgie na Sorbonne (1948) e acentua a persistência da tradição disciplinar moderna na arquitetura de Niemeyer para as artes performativas. Apesar de estes teatros terem sido concluídos já no século XXI, ambos expressam continuidade aos conceitos abraçados pelo arquiteto desde os anos 1940. Inaugurado em 2006, em Duque de Caxias, o Teatro Raul Cortez exibe forma inusitada com uma rampa que contorna metade da fachada circular levando ao auditório (448 lugares). Existe um acesso independente para os camarins e sala de ensaio no pavimento semienterrado que apresenta planta livre, permitindo subdivisões para depósito de equipamentos de cenografia. Uma enorme porta metálica na parede posterior da caixa cênica abre-se para o exterior, possibilitando aos espectadores partilhar o espetáculo com o público na praça. Tal como algumas obras mais antigas de Niemeyer, este teatro também impacta o transeunte, mas em total harmonia com a praça do centro de Caxias, sobre a qual o arquiteto projetou uma biblioteca completando o complexo do Centro Cultural. Integrando as obras do Caminho Niemeyer, em Niterói, o Teatro Popular permite descortinar a baía de Guanabara pelo painel de vidro e brises metálicos de uma das fachadas, enquanto a outra, em azulejo amarelo com pinturas de Niemeyer, acentua a integração entre artes e arquitetura, evocando seu próprio projeto para a igreja de São Francisco de Assis na Pampulha (1943), marco da moderna arquitetura religiosa brasileira. Construído em concreto armado, o prédio é uma grande cobertura curva que se origina nas empenas do edifício. Do térreo parte uma rampa helicoidal escultórica de concreto que leva ao foyer do teatro e deste, ao auditório de 400 lugares distribuídos pela plateia e balcão. Também reversível, o palco se abre para o grande pátio que comporta dez mil espectadores. O volume do teatro não é totalmente fechado, conferindo rara leveza à edificação. O paper examina o valor simbólico das formas de grande visibilidade, propondo enriquecer a história da arquitetura moderna e a tecer comentários de crítica construtiva quanto a questões funcionais internas, investigadas pelas entrevistas realizadas, pretendendo encaminhá-los à Fundação Oscar Niemeyer para as providências possíveis."
keyword: "Oscar Niemeyer; arquitetura teatral; história da arquitetura"
