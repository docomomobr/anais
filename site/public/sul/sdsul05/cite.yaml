id: sdsul05-031
type: paper-conference
title: "Esplanada ontem, hoje, amanhã"
container-title: "5º Seminário Docomomo Sul, Porto Alegre, 2016"
event-title: "5º Seminário Docomomo Sul, Porto Alegre, 2016"
event-place: "Porto Alegre, RS"
publisher-place: "Porto Alegre, RS"
issued:
  date-parts:
    - [2016, 7, 25]
ISBN: "978-85-61965-40-2"
language: pt-BR
abstract: "Subsiste na cabeceira alta da Avenida Independência o Edifício Esplanada, testemunho de tempo áureo duma construção tecidual média qualificada que dava a Porto Alegre certos ares de Montevidéu, donde veio Román Fresnedo Siri para coordenar as obras do Hipódromo do Cristal em 1951. A construção do Esplanada, encomendado no embalo pelos irmãos Iochpe, começa já no ano seguinte e se estende por outros oito, findas as três etapas que traduziram execução, mas não leitura. Monólito coeso, unitário, define com precisão as arestas do quarteirão conformado ainda pelas ruas Ramiro Barcelos e André Puente e sugere que a construção perimetral à quadra também é problema do movimento moderno e não contradiz o edifício em altura. Há sessenta anos, entretanto, o Esplanada já não é o edifício mais alto da cidade; a vizinhança cresceu e, hoje, sua imponência reside menos no sentido vertical que no horizontal. A extensão do bloco ainda impressiona: a regularidade rítmica corrobora os noventa metros de comprimento da fachada leste — coisa rara na paisagem edificada de então e ainda hoje — sobre plataforma generosa, larga em sete metros, esplanada de fato, igualmente excepcional. O vermelho do piso esmaeceu há uns meses, quando o ladrilho original, já fora do mercado, deu lugar às placas cimentícias pigmentadas; a vegetação junto à rua repercute a colunata esmeralda de ascendência clássica, defronte. Impensáveis em tempos atentos ao meio-ambiente, as caldeiras abastecidas com lenha aquecem a água que ainda circula no sofisticado sistema de calefação e municiam os apartamentos contra o frio, mas não contra o calor. Aqui, no entanto, a proliferação das máquinas de ar-condicionado, sina da fachada moderna resistente à contemporaneidade, não é tão nociva: a grelha profunda em balanço obriga seu recuo em relação ao plano externo. Em contradição, o fechamento das sacadas — creditado ao ruído inerente à crescente congestão e descoordenado em posição, modulação e acabamento — fragmenta o volume e compromete, em algum grau, a elegância consequente do asseio. A modulação estrutural tem rigor, mas faz concessões quando a geometria do lote exige — ao que Comas chama de \"irregularidades controladas.\" Reporta-se a uma planta celular de cômodos calibrados: a largura interna média duns 3,5 metros é versátil e se presta à sala tanto quanto ao dormitório. No outro sentido, perpendicular à fachada, o comprimento de 6 metros varia com a incorporação de circulação, armários embutidos, jardins de inverno, sacadas. A vedação em alvenaria disfarça a estrutura independente e priva o som com competência, ao mesmo tempo em que permite alguma variação nas plantas-baixas. Para além das variações cristalizadas à execução do edifício (como a inserção de um apartamento a mais por andar entre o segundo e o quatro pavimentos dos blocos B e D), há aquelas realizadas a posteriori pelos próprios moradores. Abreu já percebeu alterações recorrentes em apartamentos de mesma prumada do bloco A visando minimizar problemas distributivos da planta original; nos demais blocos, a regularidade dimensional permite a venda de área fracionada, podendo um apartamento incorporar uma sala do vizinho sem comprometimento distributivo nem plástico. Esse procedimento é comum no bloco B, em que a supressão de um módulo implica apartamentos desiguais em disposição geral e número de salas. Pretende-se, aqui, identificar essas e outras atualizações às quais foi submetido o Esplanada e investigar suas principais causas e consequências."
keyword: "Arquitetura Moderna em Porto Alegre; Román Fresnedo Siri; Edifício Esplanada"
