id: sdsul05-024
type: paper-conference
title: "Quando os fios se entrelaçam, se desenha a trama das construções modernas"
container-title: "5º Seminário Docomomo Sul, Porto Alegre, 2016"
event-title: "5º Seminário Docomomo Sul, Porto Alegre, 2016"
event-place: "Porto Alegre, RS"
publisher-place: "Porto Alegre, RS"
issued:
  date-parts:
    - [2016, 7, 25]
ISBN: "978-85-61965-40-2"
language: pt-BR
abstract: "Há algum tempo, a historiografia da arquitetura brasileira começou a se interessar pelas relações e pelos intercâmbios de conhecimentos entre os países do continente americano, indo além das leituras que conectavam o Brasil com países europeus como França, Inglaterra e Itália. Buscou-se, primeiro, aquelas existentes entre o Brasil e os Estados Unidos, descobrindo-se os mais diversos meios de contatos, não apenas limitados ao período da e do após Segunda Guerra (1938-1945), que ocorriam desde meados do século XIX, entre os profissionais da construção como engenheiros, construtores e arquitetos, seja na procura por uma formação mais atual e pragmática nas universidades norte-americanas, seja pela marcação de uma tendência de crescimento das cidades brasileiras (os arranha-céus), seja pela entrada de mercadorias industrializadas. Todas essas trocas têm em comum a política da boa vizinhança, que não se tratava de uma via de mão única. Segundo, no âmbito dessa política, os Congressos Pan-Americanos de Arquitetos foram uma iniciativa dos arquitetos uruguaios de organizar a categoria e promover o debate dos problemas correntes e comuns, abrangendo desde os países da América do Norte (EUA, Canadá e México), como aqueles da do Sul, como Brasil, Chile, Argentina e Peru. Essas conexões, entretanto, possuem uma complexidade maior ao incluir neste cenário as grandes empresas construtoras especializadas no sistema construtivo do concreto armado. O enredamento dessas subentende a apreensão de uma troca articulada entre o continente europeu e o americano, bem como entre os países americanos. De origem alemã ou dinamarquesa, essas construtoras empreenderam obras que marcaram a paisagem das principais cidades dos países que estudamos a modernização: Buenos Aires (Argentina) e Rio de Janeiro (Brasil). Para tanto, elegemos duas companhias: Christiani \u0026 Nielsen (Dinamarca) e GEOPÉ (Alemanha), sendo tomada como fio condutor desse trabalho para a compreensão da arquitetura como premissa técnica, decorrente do diálogo entre o arquiteto e o engenheiro. Investiga-se, através da atuação de grandes firmas construtoras no Brasil na Argentina, o desenvolvimento de novos sistemas construtivos, em particular do concreto armado, como um dos fatores protagonistas da modernização da arquitetura entre 1920 e 1940. A modernização urbana teve como características: a concentração das principais atividades modernas nos núcleos urbanos, a reforma dos espaços das cidades para adequá-las aos novos labores e a mudança da percepção ambiental através de novos meios de comunicação, transporte e infraestrutura. A fundamentação desse cenário permite nos abarcar o processo de inserção das construtoras estrangeiras na América do Sul, em particular os casos do Brasil e da Argentina. Essas firmas especializadas no sistema construtivo eram verdadeiros campos de experimentação e, consequentemente, de formação de profissionais capazes de criar nova estética advinda da técnica. A atuação de alguns desses profissionais vem sendo tratada por outros trabalhos, mas uma lacuna permanece: o papel das empresas construtoras na modernização da arquitetura. Com base no estudo de acervos, como o da construtora de origem dinamarquesa Christiani \u0026 Nielsen e de empresas construtoras de origem alemãs atuantes na Argentina e no Brasil, este artigo busca denotar, além dos já descritos, que quando os fios se entrelaçam, se desenha uma trama da construção moderna calcada nos princípios do concreto armado."
keyword: "Construções modernas; América do Sul; Arquitetura"
