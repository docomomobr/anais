ISBN: "978-85-61965-40-2"
language: pt-BR
abstract: "Uma das principais características da arquitetura moderna, em seu sentido mais amplo, reside na inovadora proposição formal a partir das relações e transformações do programa de necessidades e sua interpretação. Nesse sentido, os projetos de residências unifamiliares constituíram um fértil laboratório para essas questões. Mesmo não sendo um produto industrial, a “máquina de morar” era concebida como tal, e movimentar-se em seu interior através de percursos surpreendentes fazia parte desse enunciado: a integração espacial surgia para propor e permitir a fruição da arquitetura. No Brasil, mais especificamente no cenário da Escola Paulista, diversos arquitetos projetam casas que procuram uma nova ordem familiar através da liberdade espacial, adotando o volume único solto no lote, em cujo interior ocorre a valorização dos espaços comuns em detrimento dos espaços privativos. Em São Paulo, a Casa Olga Baeta (1957), de Vilanova Artigas – por meio da organização do programa em bloco único e esquema estrutural independente e revelado – dá o tom da arquitetura residencial paulistana da década seguinte. Os dormitórios racionalizados limitam-se às necessidades vitais de sono e higiene, e ao mesmo tempo em que buscam a melhor insolação cedem o protagonismo aos espaços de convivência, interligados em meios níveis sob o mesmo pé-direito alto. Os automóveis estão expostos sob o mesmo volume que abriga o acesso, numa intencional ausência de hierarquia. Características tangíveis como a preferência pela aparência rude do concreto armado, o fechamento de planos com materiais não revestidos e o emprego de instalações aparentes concorrem para a associação do termo brutalismo àquela arquitetura. Na arquitetura residencial unifamiliar de Porto Alegre esses ecos são relativamente tardios, e podem ser observados em algumas residências projetadas somente nos anos 1970, como as casas dos arquitetos Cesar Dorfman (1972), Selso Maffessoni (1972) e Jorge Debiagi (1973). Na fronteira cronológica entre herança e prática, em 1977, encontra-se a casa projetada pelo arquiteto Edenor Buchholz para sua própria família. Relativamente conhecido pelo projeto das agências bancárias Moinhos de Vento (1973) e Independência (1976) da Caixa Econômica Federal, ambas de filiação brutalista (em parceira com o arquiteto Cesar Dorfman), Buchholz concebeu sua casa em lote urbano típico (11 x 44 m), com organização similar à descrita na Casa Baeta de Artigas, no entanto sujeita às transformações decorrentes da implantação entre medianeiras. A caixa aberta ao norte e ao sul organiza-se em torno de escada vazada assimétrica em meios níveis, a qual articula-se com jardim iluminado zenitalmente disposto de forma a borrar os limites entre interior e exterior. O convívio comunitário sob o grande vão dos ambientes de estar e mezanino também é estimulado nos dormitórios, dotados de painéis retráteis de marcenaria que permitem a integração dos quatro cômodos. Como uma grande tenda, a casa promove o encontro quase sem barreiras entre seus cinco habitantes originais. Fortemente descaracterizada, porém, foi ironicamente convertida na sede de uma revista de decoração cujo aposto é “criar, morar, viver”. O presente artigo faz parte de um estudo mais abrangente que está sendo desenvolvido a respeito das residências modernas em Porto Alegre, englobando cerca de 70 casas do período 1950-1970, das quais 20 nunca foram publicadas. Entre estas está a Residência Buchholz, cuja análise é objeto específico deste estudo. A partir do redesenho de seus documentos originais e elaboração de modelo tridimensional, serão discutidos aspectos referentes à sua organização espacial, materialidade e dimensão estrutural, relacionando-os com a de obras referenciais da Escola Paulista dos anos 1960. Ausente das compilações sobre arquitetura moderna em Porto Alegre, a Residência Buchholz carrega atributos espaciais e construtivos que permitem inclui-la e situá-la no âmbito desta produção."
keyword: "casas da arquitetura moderna; brutalismo; arquitetura moderna em porto alegre"
