id: sdsul05-008
type: paper-conference
title: "Cidade das Artes do Rio de Janeiro: combinações de elementos modernos em meio a distorções contemporâneas"
container-title: "5º Seminário Docomomo Sul, Porto Alegre, 2016"
event-title: "5º Seminário Docomomo Sul, Porto Alegre, 2016"
event-place: "Porto Alegre, RS"
publisher-place: "Porto Alegre, RS"
issued:
  date-parts:
    - [2016, 7, 25]
ISBN: "978-85-61965-40-2"
language: pt-BR
abstract: "A absorção do esqueleto estrutural em concreto armado ou aço pela arquitetura moderna se constitui em episódio importante da história da arquitetura, uma vez que torna antiquados os tradicionais sistemas construtivos contínuos e maciços de paredes portantes. Tal assimilação da estrutura independente com seus suportes pontuais, aliado a paredes de vidro e tabiques leves, é equacionamento de longa crise disciplinar gestada no século XIX que culmina com grande transformação revolucionária patrocinada pela vanguarda européia nos anos 1920 e que se só se encerra definitivamente com a hegemonia da arquitetura moderna por toda parte no pós-guerra. “As grandes épocas de arquitetura dependem de um sistema puro de estrutura”- proclama Le Corbusier, ao promover em sua obra uma estrutura independente específica do tipo proposto nas casas Domino de 1915, sem vigas aparentes que comprometessem a livre disposição das paredes internas e externas. A mesma transformação revolucionária é fundamento da vanguarda carioca nos anos 1930. Para Lucio Costa, a entrada em cena da ossatura independente tipo Dom-ino, é vista como a estrutura característica e preferencial da nova arquitetura. Tal atribuição leva o esquema de placas paralelas estratificadas sobre grelha de suportes à condição de estatuto paradigmático. Para Costa, a arquitetura moderna é um sistema triarticulado em termos de tipologias estruturais e programáticas, de viés hierárquico. A estrutura independente é preferencial, mas permite a inclusão de estruturas de apoio contínuo e especiais para alternativas híbridas. As transformações na forma dos apoios isolados, ocorridas no contexto carioca nos anos 1950 e a inclusão de apoios contínuos no corpo principal dos edifícios, em solo paulista nos anos 1960, constituem-se num conjunto de transformações da estrutura tipo Dom-ino característicos das duas Escolas da arquitetura moderna brasileira. A Cidade das Artes do Rio de Janeiro (2002-2013) de Christian de Portzamparc é obra que sintetiza estas duas vertentes da modernidade brasileira sob o enfoque das transformações na forma dos componentes do esquema estrutural. O exame desse projeto é revelador de uma síntese de aspectos ligados à herança moderna da arquitetura moderna brasileira, simultâneos aos processos de distorção geométrica iniciados nos anos 1980 na esteira da nova abstração formal. Este artigo tem como objetivo analisar a sobreposição entre a herança contida nas combinações entre componentes típicos da arquitetura moderna brasileira e as distorções formais associadas à prática contemporânea no contexto internacional. Consideram-se estes dois ingredientes como cruciais para a compreensão da natureza icônica desse tipo de encargo, o artigo enfatiza os aspectos construtivos e compositivos. A apreciação simultânea desses dois ingredientes, quando transpostos para a obra em questão, auxilia o entendimento do papel da estrutura no sistema arquitetônico e as suas relações com a composição. A pesquisa permite a análise da obra, a partir de uma investigação sobre a estrutura enquanto elemento-chave de um sistema arquitetônico em transformação, no qual a obtenção da leveza e das permeabilidades ocorre não apenas por mero capricho formal, mas por uma compreensão hábil e profunda de um sistema já entendido e expandido pela arquitetura moderna brasileira precedente que ecoa somente em determinadas obras contemporâneas."
keyword: "arquitetura moderna brasileira; transformações na estrutura tipo Dom-ino; nova abstração formal"
