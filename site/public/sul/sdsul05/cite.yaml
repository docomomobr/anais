ISBN: "978-85-61965-40-2"
language: pt-BR
abstract: "A década de 1960 mostrou-se definitiva no desenvolvimento da arquitetura moderna no Brasil. Edifícios notórios como a FAU-USP de Vilanova Artigas, a Residência no Butantã de Paulo Mendes da Rocha e o MASP de Lina Bo Bardi renovaram a discussão sobre a arquitetura moderna nacional, destacando a cidade de São Paulo no cenário mundial. Nesta mesma década, vindos da metrópole que guiava a discussão arquitetônica no país, os arquitetos Luiz Forte Netto e José Maria Gandolfi fundaram na cidade de Curitiba, o escritório Forte-Gandolfi, marcando o início de uma nova fase do modernismo no Paraná, chamado por Paulo Pacheco de Grupo Paraná. Formados em 1958 na Universidade Presbiteriana Mackenzie, Luiz Forte Netto e José Maria Gandolfi trabalharam com Fábio Penteado e Pedro Paulo de Melo Saraiva, participando de diversos concursos, entre eles o notório concurso para o Ginásio do Clube Atlético Paulistano (1958) vencido por Paulo Mendes da Rocha, no qual conquistaram o segundo lugar colaborando com Pedro Paulo de Melo Saraiva. Em 1962, trabalhando por conta própria, Forte Netto e Gandolfi, junto com Francisco Moreira, venceram o concurso para o Clube Santa Mônica em Curitiba e mudaram-se para o Paraná. O resultado do concurso foi amplamente divulgado entre os sócios do clube e logo o escritório começou a receber comissões de residências de alto padrão na cidade. A Residência Mário Petrelli, a primeira destas comissões, foi projetada pela dupla em 1964. Localizada na Rua Carmelo Rangel, no bairro Batel, a casa abriga um programa de 600 m2 distribuídos em três meios níveis, que se adaptam ao declive do terreno. O programa foi disposto sob uma grande cobertura em duas águas composta por vigas de concreto com balanços de até seis metros A Residência Petrelli evidencia os precedentes da arquitetura moderna no Brasil na educação de Forte Netto e Gandolfi; inclui-se, por sua linguagem, no universo de obras que seria agrupado sob o guardachuva do brutalismo; revela a contemporaneidade entre as soluções paranaenses e as obras de maior destaque nacional que eram construídas em São Paulo. Porém, traços menos evidentes no projeto como a influência da educação na tradição Beaux-Arts, as relações com a arquitetura clássica, a busca pelo caráter e a aplicação de elementos vernáculos tornam a obra uma variante menos severa da estética relacionada ao brutalismo. Se a etimologia da palavra brutalismo encontra-se na qualidade da champangne brut - sem açúcar - a arquitetura da dupla pode ser classificada como demi-sec - a champagne levemente açucarada."
keyword: "Forte Gandolfi; Grupo Paraná; Arquitetura Moderna em Curitiba"
