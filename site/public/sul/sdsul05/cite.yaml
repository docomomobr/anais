id: sdsul05-036
type: paper-conference
title: "A permanência do transitório: os pavilhões do Brasil e do Chile para a Expo 92 – Sevilha"
container-title: "5º Seminário Docomomo Sul, Porto Alegre, 2016"
event-title: "5º Seminário Docomomo Sul, Porto Alegre, 2016"
event-place: "Porto Alegre, RS"
publisher-place: "Porto Alegre, RS"
issued:
  date-parts:
    - [2016, 7, 25]
ISBN: "978-85-61965-40-2"
language: pt-BR
abstract: "A arquitetura de exposição, embora não seja um dispositivo novo, presta-se com eficiência a um mundo no qual inúmeros fenômenos de cunho social, tecnológico, científico apontam uma tendência: a emergência do transitório. Ainda que o caráter provisório seja predominante neste tipo de operação, as arquiteturas efêmeras projetadas para exposições têm apresentado um poder quase incontestável: o de contribuir solidamente para a construção da imagem das arquiteturas locais em âmbito internacional. Tem sido assim desde que as Exposições Universais iniciaram suas atividades, em 1851, na ocasião da “Grande Exposição dos Trabalhos da Indústria de Todas as Nações” , quando Londres, cidade que sediou o evento, apresentou ao mundo o, então, surpreendente Crystal Palace. A inovadora construção seria precursora de um programa arquitetônico que surgiria para não mais ser esquecido: o pavilhão de exposição. O presente trabalho tem por objetivo estudar a relevância dos pavilhões de exposição, concebidos para serem efêmeros, na permanente construção da imagem da arquitetura latino-americana pelo mundo, relacionando-a com a cena da produção arquitetônica regional. O recorte se dá em dois exemplares de pavilhões projetados para a Expo’92, realizada em Sevilha: os do Brasil e do Chile. Enquanto o primeiro é lembrado pelas grandes polêmicas envolvendo o concurso através do qual foi escolhido e pelo fato de não ter sido construído, o segundo marcou definitivamente a história e arquitetura de seu país através de uma participação cheia de notoriedade. A participação do Brasil na Expo’92 retratou o momento de grande instabilidade política e social que o país vivia naquela altura. Era natural que o projeto vencedor para o pavilhão do Brasil (de autoria de Angelo Bucci, Alvaro Puntoni e José Oswaldo Vilela), eleito através de um concurso de projetos do qual participaram 256 equipes, dividisse as opiniões de uma classe de arquitetos que se encontrava muito segmentada quanto aos próprios ideais. O que não se esperava é que o então presidente da república, Fernando Collor de Mello, decidiria pela não construção do pavilhão, limitando a participação do país a um pequeno stand alocado dentro do pavilhão da América Latina, anulando a chance de visibilidade verdadeiramente relevante. A última participação de um pavilhão do Brasil em exposições universais apontada como arquitetonicamente representativa teria sido em Osaka, em 1970, com o pavilhão de Paulo Mendes da Rocha e equipe. O “ostracismo arquitetônico” de mais de 20 anos foi determinante para esfriar a imagem de excelência que a arquitetura brasileira começou a construir desde a participação na Exposição de Nova York, em 1939, com o celebrado e reconhecido pavilhão de Lucio Costa e Oscar Niemeyer. Já a participação do Chile, apontou a intenção de projeção do seu país em direção bem diferente do Brasil. Projeto dos arquitetos chilenos Germán Del Sol e José Cruz, o Pavilhão do Chile foi construído inteiramente em madeira laminada e com cobertura de cobre. Não deixou de ter forma pura, mas, com suas curvas que enfrentavam a abundante ortogonalidade encontrada nos demais pavilhões, muitos deles erguidos na forma de grandes paralelepípedos, foi o mais visitado do evento e eleito por um grupo de 53 arquitetos espanhóis como um dos 5 pavilhões mais interessantes do evento. O que se pretende é indicar a importância que tais obras tiveram para a construção da imagem da arquitetura local do país ao qual pertencem perante às demais nações. Os pavilhões às vezes apresentam, e em outras representam seu país, numa mistura do que se é e do que se quer ser, e a arquitetura deixa seu legado também através de projeto, ainda que a materialidade da obra já tenha desaparecido, ou nunca chegado a existir."
keyword: "Pavilhões de exposição; Expo´92 – Sevilha; Arquitetura Latino Americana"
