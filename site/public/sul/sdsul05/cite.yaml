id: sdsul05-017
type: paper-conference
title: "Habitar o Patrimônio Moderno: o caso do Pedregulho"
container-title: "5º Seminário Docomomo Sul, Porto Alegre, 2016"
event-title: "5º Seminário Docomomo Sul, Porto Alegre, 2016"
event-place: "Porto Alegre, RS"
publisher-place: "Porto Alegre, RS"
issued:
  date-parts:
    - [2016, 7, 25]
ISBN: "978-85-61965-40-2"
language: pt-BR
abstract: "Reformas, reciclagens e restaurações de edifícios de uso público considerados patrimônio são controversas. Porém a polêmica aumenta quando se tratam de conjuntos habitacionais com estas características, pois as medidas de conservação raramente convergem os interesses dos moradores e dos órgãos patrimoniais. Muitos dos imóveis que passam por este processo atualmente são exemplares emblemáticos para o Movimento Moderno no Brasil. Edifícios residenciais institucionalmente protegidos, ainda que de propriedade privada, estão subordinados aos interesses da coletividade no que tange à preservação do patrimônio. Nestes casos, a avaliação dos projetos está sujeita a, no mínimo, três instâncias: a municipal, que trata de aspectos fundamentalmente quantitativos; a dos órgãos patrimoniais, que avaliam o mérito das intervenções propostas, e a dos moradores e proprietários das unidades, que desejam adaptações necessárias ao habitar contemporâneo em edifícios que, quando tombados, nem sempre suportam estas modificações. Por conseguinte, o júri deste tipo de operação não tem conhecimento técnico suficiente — muitas vezes os moradores sequer entendem o valor da obra enquanto representante de uma cultura — e raramente chega a um consenso. A arquitetura do século XX foi marcada por uma série de inovações técnicas que possibilitaram a aplicação da linguagem do novo estilo. O advento do concreto armado e a crescente produção industrial permitiram a imensa inovação formal do período, mas também acarretaram algumas modificações nos processos construtivos. Todos estes fatores, aliados à inexperiência no uso das novidades e o desconhecimento sobre o seu envelhecimento acarretaram uma serie de peculiaridades quanto à conservação desta arquitetura. As técnicas e teorias de restauração aplicáveis a edifícios de outros períodos nem sempre são adequadas ao patrimônio modernista.As ultimas décadas têm registrado um crescente interesse pela preservação do patrimônio moderno, que é impulsionado pelas ações do Docomomo, ICOMOS, Unesco e por pesquisas na área. No entanto, apesar do reconhecimento dos órgãos de proteção e do meio acadêmico ter aumentado significativamente nos últimos anos, a adesão da sociedade a esta causa ainda é muito pequena. Este fator é determinante no caso de intervenções em edifícios habitacionais modernistas, pois impõe uma resistência maior por parte dos moradores durante o processo. A fim de ilustrar os desafios e as oportunidades da árdua tarefa de adaptar edifícios de habitação coletiva do Movimento Moderno ao uso contemporâneo, o exemplar eleito é o Conjunto Residencial Prefeito Mendes de Moraes — popularmente conhecido como Pedregulho — situado na cidade do Rio de Janeiro. O empreendimento tem projeto de Affonso Eduardo Reidy(1946 - 1950), é patrimônio reconhecido em instância municipal e estadual, e está em processo de tombamento pelo Instituto do Patrimônio Histórico e Artístico Nacional (Iphan). A obra, que nunca foi concluída integralmente, sofre intervenções desde 2002,algumas sem a orientação de órgãos de proteção ou técnicos em preservação. Desde 2011, o conjunto passa por obras de restauração e reforma — empreendidas pelo Governo do Estado do Rio de Janeiro, através da Cehab, com supervisão técnica do arquiteto Alfredo Britto —que tiveram a segunda etapa concluída recentemente. Este artigo, cujo tema é parte da dissertação de mestrado da autora, buscadiscorrer a respeito da adaptação das moradias modernas para o uso contemporâneo através do processo de recuperação do Conjunto Pedregulho. Com o propósito de ponderar tanto o valor de uso quanto a salvaguarda, foi realizada uma entrevista com o senhor Hamilton Marinho, representante da Associação de Moradores,que reside noconjunto.Como referencial teórico, além das usuais teorias de restauro, as análises serão pautadas por textos de pesquisadores contemporâneos com visões menos ortodoxas das questões patrimoniais, como, por exemplo, Ana Carolina Pellegrini e Carlos Eduardo Comas."
keyword: "patrimônio moderno; Pedregulho; habitação moderna"
