abstract: "Este artigo propõe uma reflexão sobre os cinemas de rua guiada pela noção de arquitetura lado B, utilizando o restauro e readequação da atual Cinemateca Capitólio como base. Considerando a história dos cinemas de rua, que sofreram uma grande mudança em seus papéis sociais na cidade ao longo de suas existências, argumentaremos que o caso da Cinemateca Capitólio mostra que é possível que um tipo de espaço outrora importante para a vida cultural urbana tenha parte dessa importância recuperada ao ser restaurado."
