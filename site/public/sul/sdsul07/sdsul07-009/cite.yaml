abstract: "Exposições e mostras tiveram papel fundamental na evolução do conceito de\nhabitação moderna. Nota-se que Le Corbusier utilizou esses eventos para desenvolver e\naprimorar suas ideias quanto à forma de morar e a busca ao mobiliário ideal, ponto crucial,\nsegundo o arquiteto, para a solução do problema da habitação. Partindo do projeto\ndesenvolvido para o Salão do Outono de 1922, onde apresentou a Ville Contemporaine de 3\nMillions d’Habitants com seus Immeubles-Villas , até o Salão do Outono de 1929, onde\napresentou o Equipamento Ideal para uma Habitação, o arquiteto buscou o desenvolvimento\nde uma linha de mobiliário ideal para a casa do homem moderno. Para Le Corbusier o\nproblema da planta moderna só seria resolvido através do estudo do mobiliário. Seguindo o\nestudo feito para o Salão do Outono de 1922 com o Pavilhão l’Esprit Nouveau na Exposição\nInternacional das Artes Decorativas de 1925, Le Corbusier e Pierre Jeanneret começaram a\nbusca pelo mobiliário ideal quando apresentaram um manifesto em prol da Arquitetura Moderna\npropondo a reforma da habitação. Em 1927, na exposição Die Wohnung (a vivenda), os\narquitetos avançam na sua pesquisa. Porém, somente com a entrada de Charlotte Perriand ao\nescritório da Rue de Sèvres a equipe se complementa e esta questão evolui, culminando com a\napresentação do mobiliário ideal no Salão do Outono de 1929."
