abstract: "A produção arquitetônica de Oscar Niemeyer é um tema frequente em pesquisas\nacadêmicas. Contudo, um pouco antes de começar os projetos dos edifícios para Brasília, em 1956,\nNiemeyer fez uma incursão no universo cênico e teatral, projetando uma cenografia para a peça\nOrfeu da Conceição . A peça foi escrita por Vinicius de Moraes e musicada por Antonio Carlos Jobim,\ntornando-se um marco para a cultura brasileira. Orfeu da Conceição é objeto de estudo em diferentes\ncampos disciplinares, como no Teatro, na Música e nas Letras (MAGALDI, 1998; FLÉCHET, 2017;\nPARANHOS, 1980). O livro Cancioneiro Vinicius de Moraes: Orfeu , organizado pela Jobim Music, em\n2003 (MORAES, 2003), reuniu uma vasta documentação acerca da peça, com fotografias, desenhos\ne manuscritos da época. O cenário, apesar de constar em algumas publicações do campo\narquitetônico (PAPADAKI, 1960; PHILIPPOU, 2008), parece não ter sido objeto de estudos\naprofundados, e apresenta-se como uma produção alternativa na carreira do arquiteto, a ser\nanalisada."
