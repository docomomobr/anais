abstract: "A modernidade brasileira presenteou a maior cidade do país com um de seus mais conhecidos símbolos. O edifício Copan, que foi pensado para ser palco de diversas atividades, passou por momentos de decadência, principalmente na década de 1980. Hoje em dia, o edifício cartão-postal de São Paulo é um celebrado exemplar arquitetônico de reconhecido valor de patrimônio. Frequentemente objeto de documentários, estudos e produções acadêmicas, é também cenário comum de obras de arquitetura de interiores, ocorridas em seus apartamentos, e divulgadas em publicações especializadas. Em relação à Arquitetura Moderna, o debate a respeito de projetos e obras de intervenções em bens patrimoniais motiva questões específicas sobre os procedimentos, teorias e até mesmo a moralidade de intervenções nas obras reconhecidas como pertencentes ao período conhecido como Modernismo. Entretanto, em relação a obras de reformas de interiores essa polêmica é atenuada ou até mesmo inexistente. A proposta deste ensaio é, partir da apresentação de três reformas de apartamentos relativamente recentes, explorar a versatilidade da obra original em adaptação às demandas de novos tempos. O artigo propõe examinar como nestas distintas reformas, com diferentes programas e objetivos, foi possível utilizar-se das qualidades do projeto original do notável edifício paulistano."
