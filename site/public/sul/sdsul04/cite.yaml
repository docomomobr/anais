id: sdsul04-033
type: paper-conference
title: "Vidro feito de metal"
container-title: "4º Seminário Docomomo Sul, Porto Alegre, 2013"
event-title: "4º Seminário Docomomo Sul, Porto Alegre, 2013"
event-place: "Porto Alegre, RS"
publisher-place: "Porto Alegre, RS"
issued:
  date-parts:
    - [2013, 3, 25]
ISBN: "978-85-60188-13-4"
language: pt-BR
abstract: "As ambientações internas das casas modernas revelam estratégias distintas de projeto. Há exemplos onde, além do fato de envelope e conteúdo terem as mesmas características gerais, a disposição rigorosa de móveis e objetos forma um conjunto marcado pela homogeneidade e despojamento, muito próximo da pureza de estilo. Em outra direção aparecem as constelações de móveis e objetos reunidos por outros critérios que não aqueles de semelhança, seja ela de materialidade, estilo, proporção ou origem, tampouco relativos à criação do que se entende, de maneira mais convencional, como unidade. O resultado envolve o ocupante num manto de misturas e heterogeneidade, que ainda pode ser temperado pela acumulação. Além disto, existe a ação do tempo que joga a favor da transitoriedade e faz com que se aceite mais facilmente as alterações físicas que acompanham as transformações naturais da vida em família, principalmente nos interiores domésticos. Neste contexto, a casa de vidro de Lina Bo Bardi é um exemplo interessante. A casa foi divulgada incialmente logo após sua conclusão e trinta anos depois houve um novo momento de registro e divulgação da casa, promovido pela própria autora. A versão do projeto publicada logo após a conclusão da obra alinha-se às estratégias que revelam uma sensibilidade eclética, contrapondo à conhecida imagem da fachada social envidraçada, um interior composto de móveis metálicos desenhados por ela, lado à lado com antiguidades de valor. A segunda versão, dos anos 1980, apresenta uma densidade de móveis e objetos dentro da casa que é impressionante, ainda mais se comparada com a versão original. Este trabalho propõe-se a discutir, através da análise desta casa, a ação do tempo sobre a obra doméstica do arquiteto morador e, de forma mais ampla, investigar que atitudes ecléticas persistem na produção das ambientações modernas."
keyword: "Arquitetura Moderna Brasileira; Ambientação Interna"
