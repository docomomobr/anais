language: pt-BR
abstract: "Reconhecido, mas carente de merecida biografia, o arquiteto argentino Julio Aranda foi autor de uma obra extensa, variada e consistente, como decorrência plausível de formação acadêmica sólida nos moldes tradicionais. Destro em diferentes “linguagens”, realizou desde bungalows pitorescos até composições modernas pautadas por rigor e coerência. Através do empresário conterrâneo Mauricio Litman, sua produção transpôs o Rio da Prata atingindo a margem oriental. Nos anos quarenta, Litman urbanizou uma área de Punta Del Este cuja âncora foi o Cantegril Country Club, em torno do qual Aranda projetou os treze chalés iniciais do empreendimento. Alguns anos depois, confiou-lhe novo trabalho na entrada da península, o edifício Vanguardia, projetado em 1956: um grande prédio que se tornou um marco no balneário, sendo tema do trabalho proposto. Atracada às margens da Praia Mansa, essa Unité d’Habitation destinada ao ócio burguês apresentou três centenas de apartamentos compactos de categoria elevada distribuídos em doze pavimentos tipo, base e coberturas. De modo precursor no balneário, um prédio de características modernas (e grandes proporções) utilizava tijolos aparentes como principal elemento compositivo; uma prática usual em edifícios tradicionais que migrava para a nova habitação coletiva uruguaia. Arquitetonicamente banal ao olhar desatento, o Vanguardia constitui um caso cujas premissas de projeto e resultados práticos justificam seu exame. Além de tratar da presença do tijolo aparente na arquitetura moderna da região e contribuir para a documentação da obra de Julio Aranda, o trabalho reflete sobre a adoção, em tais circunstâncias, de padrões sabidamente atrelados à habitação social e à disposição reformadora do Movimento Moderno."
keyword: "Edifício Vanguardia; Punta Del Este; Julio Aranda"
