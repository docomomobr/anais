abstract: "Projetada por Oscar Niemeyer em 1954, a Casa Edmundo Cavanelas no Distrito Pedro do Rio em Petrópolis, Rio de Janeiro, pode ser inserida no quadro de revisão que a obra de Niemeyer sofre na década de 60, anunciada no projeto para o Museu de Arte Moderna de 1955. Destaca-se pela racionalidade na concepção formal e pelo uso da pedra e do metal, em contraste com as obras anteriores marcadas pela plasticidade do concreto. Mais do que isto, demonstra uma mudança nas estratégias compositivas usadas pelo arquiteto, antecipando os palácios de Brasília concebidos como caixas de vidro protegidas por peristilos nas mais variadas concepções. Inserida numa magnífica paisagem, esta proposta para uma casa de campo está perfeitamente integrada a natureza, através da cobertura curva que acompanha a concavidade do vale onde está implantada, e pela continuidade visual da área social com os jardins projetados por Burle Marx. A cobertura metálica em catenária, estruturada por treliças metálicas, está suspensa em quatro pilares trapezoidais de concreto revestidos em pedra, sugerindo a imagem de uma tenda, estratégia sem precedentes na obra de Niemeyer. Telhas onduladas de fibrocimento garantem a estanqueidade e o sombreamento no plano superior, enquanto a madeira é usada como forro em toda extensão, acompanhando a curvatura inferior, exceto na cozinha e banheiros com forros alveolares planos. Nas bordas laterais da cobertura as treliças permanecem à vista. Sob esta tenda, desenvolve-se uma planta racional com três quartos, banheiros e cozinha, segregados da sala de estar e jantar por uma parede que acompanha o revestimento em pedra dos pilares, prolongando-se além da cobertura até o jardim. Estratégia esta que reforça a continuidade espacial permitida pelos grandes planos envidraçados que delimitam a área social, em contraste com outra parede em pedra que completa o fechamento. Muito divulgada pelos jardins de Burle Marx, perfeitamente restaurados por seu novo proprietário, a concepção arquitetônica da Casa Cavanelas não teve o mesmo destaque da Casa das Canoas, obra emblemática na produção residencial de Oscar Niemeyer. O presente trabalho pretende um olhar sobre a Casa Cavanelas, procurando situá-la no contexto da obra de Niemeyer, considerando o uso da pedra e do metal desta solução de exceção entre as demais casas projetadas pelo arquiteto."
keyword: "casa moderna; cobertura em catenária; casa de campo"
