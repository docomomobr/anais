language: pt-BR
abstract: "Até a Primeira Guerra Mundial, parte das fábricas brasileiras era caracterizada formalmente pela simplicidade e despojamento. Alguns desses edifícios adotaram o que se pode chamar de “padrão manchesteriano”: fachadas erguidas em tijolos aparentes que encobrem estruturas moduladas de concreto armado e/ou estruturas importadas de ferro. Nelas, o barro “reveste” o concreto, fazendo duelar a manufatura rudimentar da vedação versus a racionalização construtiva da estrutura e cobertura. Tijolo a tijolo, provavelmente, buscava-se traduzir o caráter fabril depreendido dos materiais e se ensaiava a fábrica moderna brasileira. Ilustram estes casos, entre outras, a Industrial Pernambucana, em Camaragibe; a Cia. Progresso e a Fábrica de Tecidos Botafogo, no Rio de Janeiro; e, em São Paulo, a Fábrica de Tambores Irmãos Mauser e as Indústrias Reunidas Matarazzo. No contexto gaúcho, percebe-se que fábricas com padrão manchesteriano foram mais raras. Fábricas com linguagem colonial foram recorrentes no sul do Estado, condicionadas pelas charqueadas e pela forte presença portuguesa. Nas regiões de colonização alemã e italiana, as referenciais projetuais adotadas foram aquelas dos países de origem dos imigrantes e não da Inglaterra, cujo capital financiou grande parte do desenvolvimento das indústrias no centro do país. Na década de 1920, algumas poucas fábricas assumiram feições ecléticas e outras já buscavam a racionalização da construção, como os moinhos RioGrandense, Porto-Alegrense e Chaves. Ao longo da década de 30 e 40, foram recorrentes edifícios industriais com linguagem Art Déco e, isoladamente, já ocorreram experiências com vocabulário moderno, como a fábrica A. J. Renner \u0026 Cia., que lembra os volumes curvilíneos e envidraçados de Mendelsohn. Nesse cenário, grandes fábricas em tijolos aparentes ganham relevância no Estado, pela excepcionalidade das mesmas. São fábricas que, normalmente, ocupam grandes áreas urbanas e que, pelo seu porte ou pelo seu apelo visual, estão diretamente ligadas à história e à imagem das cidades, ajudando a introduzir e a popularizar elementos da arquitetura moderna no Rio Grande do Sul. Analisar as características projetuais de tais fábricas é objetivo principal deste trabalho. Mais precisamente, o artigo objetiva analisar a Fábrica da Metalúrgica da Eberle – MAESA (1945), construída em Caxias do Sul. O conjunto ocupa uma área fora do perímetro original da cidade e próxima à BR 116. O projeto envolve quatro quadras, deixando livre uma grande área verde e algumas ruas internas de acesso, onde estão distribuídas galpões, edificações de um a dois andares. O sistema construtivo do conjunto é definido por estrutura modulada de concreto armado, evidenciado a preocupação com a racionalização construtiva e com a configuração de plantas livres. Vedam o conjunto superfícies de tijolos aparentes. Em alto relevo, tijolos ainda marcam a estrutura e definem molduras nas platibandas e nas aberturas. No artigo, após uma breve contextualização das fábricas de padrão manchesteriano e das primeiras fábricas modernas no mundo e no Brasil, a MAESA é documentada e analisada em sua implantação, seus aspectos formais e tecnológicos. Revela-se o seu valor patrimonial para Caxias do Sul, estando este diretamente associado à poética do tijolo aparente e seu caráter industrial."
keyword: "arquitetura industrial; tijolos aparentes; MAESA-Eberle"
