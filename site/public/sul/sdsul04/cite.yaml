id: sdsul04-029
type: paper-conference
title: "Identidade material: legibilidade de usos e materialidade no edifício Floragê, David Libeskind, Porto Alegre, 1963"
container-title: "4º Seminário Docomomo Sul, Porto Alegre, 2013"
event-title: "4º Seminário Docomomo Sul, Porto Alegre, 2013"
event-place: "Porto Alegre, RS"
publisher-place: "Porto Alegre, RS"
