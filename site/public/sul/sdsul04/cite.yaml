language: pt-BR
abstract: "O arquiteto João Baptista Vilanova Artigas projetou uma residência para seu uso pessoal pela primeira vez em 1942-3, quando ele tinha apenas 4 anos de formado e era sócio da empresa Marone \u0026 Artigas que projetava e construía suas próprias obras. Conhecida pelo apelido de \"Casinha\", esta e outras casas que ele projeta naquele momento podem ser consideradas como experiências construtivas, materiais, formais e espaciais, estabelecendo uma base para o desenvolvimento posterior de suas seguintes obras. A Casinha foi construída em alvenaria de tijolos pintada de branco, pisos de cerâmica e um telhado de quatro águas suportado por uma estrutura de madeira coberta com telhas de barro. Sua forma quase-quadrada é girada 45 º dos limites do lote. Seus espaços interiores rodeiam sem interrupção um núcleo central retangular que abriga o único banheiro, um fogão a lenha e uma lareira. O detalhamento de alvenaria de tijolo é requintado e oferece uma ampla variedade de sutilezas, projeções, reentrâncias, saliências, soleiras, escadas, molduras e articulações; suas paredes sólidas definem um projeto lógico e um padrão quase mágico, ou senão, poético."
