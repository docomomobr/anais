id: sdsul04-011
type: paper-conference
title: "Colunas metálicas sob cobertura plana: exceção e regra na casa Helio Dourado"
container-title: "4º Seminário Docomomo Sul, Porto Alegre, 2013"
event-title: "4º Seminário Docomomo Sul, Porto Alegre, 2013"
event-place: "Porto Alegre, RS"
publisher-place: "Porto Alegre, RS"
issued:
  date-parts:
    - [2013, 3, 25]
ISBN: "978-85-60188-13-4"
language: pt-BR
abstract: "As diversas transformações formais e tecnológicas ocorridas com a estrutura independente, ao longo do desenvolvimento da arquitetura moderna no século XX, constituem-se em um fundamental testemunho das diversas rupturas e continuidades enfrentadas pelo novo estilo, desde seu surgimento na década de 1920 até a sua institucionalização e internacionalização, após a segunda grande guerra mundial. Enquanto núcleo de um novo sistema arquitetônico, a estrutura tipo Dom-ino é protagonista de uma verdadeira revolução: um espaço planar, contínuo e isotrópico com o forte apelo estético da coluna desprendida das vedações, em favor da radical abstração geométrica, imaterialidade e transparência. No entanto, desde a emergência da estrutura independente tipo Dom-ino como cerne do sistema arquitetônico moderno, o sistema híbrido entre colunas metálicas sob lajes planas em concreto armado acabou se tornando uma espécie de licença ao novo estilo, aplicado especificamente aos edifícios baixos com estrutura em esqueleto. As razões para as suas restrições no edifício alto parecem estar relacionadas com a incrível esbelteza do pilar metálico se comparado com o seu equivalente em concreto armado. Neste sentido, há exigências tanto de contraventamentos ou núcleos rígidos para os problemas de estabilidade lateral, como reforços no interior das lajes em torno dos apoios, decorrentes do efeito de perfuração junto aos tetos planos sem vigas. Tem início conspícuo e emblemático no Pavilhão Alemão de Barcelona. Oito colunas cruciformes revestidas de aço cromado cumprem um papel de absoluta desmaterialização dos suportes em favor da abstração dos planos horizontais e verticais. No cenário brasileiro, os exemplos mais notáveis são residências que utilizam a pontuação de colunas em tubos de aço em meio a um espaço aberto de planta livre em que as vedações não se engajam com as colunas, em nítido contraste com uma planta de espaços compartimentados. O espaço bipartido resultante entre os ambientes sociais e íntimos pode ser verificado nas casas das Canoas (1953) e Prudente de Morais Neto (1943), no Rio de Janeiro, Alberto Simão (1953) na Pampulha, em Belo Horizonte, todas de Niemeyer, e na casa de vidro (1950), em São Paulo, de Lina Bo Bardi. Em Porto Alegre, a casa Helio Dourado (1961), de Miguel Pereira e João Carlos Paiva se constitui em uma rara exceção no emprego híbrido entre pilares metálicos e cobertura plana de concreto armado. Este artigo tem como objetivo analisar esta residência premiada com medalha de prata no II Salão de Arquitetura do Rio Grande do Sul, realizado em 1962. Enquanto um exemplar de exceção, a residência Helio Dourado sob diversos aspectos transita entre a norma e a licença. O artigo discute a fusão entre três esquemas: a caixa envolta por peristilo, a caixa sobre embasamento expandido e a caixa murada, sob a premissa de transformação contínua dos tipos arquitetônicos. As tensões decorrentes entre essas fusões e a representação arquitetônica, programa doméstico, lugar e a tecnologia da construção são abordadas a partir da influência da estrutura tipo Dom-ino. Dentro desta perspectiva, a pesquisa investiga o papel da coluna cruciforme dentro de um recinto livre de pontuação colunar, teto plano e grande vão. Pavilhão Alemão em Barcelona, casa Tugendhat em Brno, projeto de casa com três pátios internos e Nova Galeria Nacional em Berlim, enquanto precedentes notáveis internacionais, possuem uma malha quadrada que corrobora o emprego da seção em cruz. No entanto, na casa Helio Dourado, a malha estrutural anisotrópica 1 / 3 construtivamente se opõe ao perfil de dupla simetria. Curiosamente, ao contrário dos projetos em que Mies realiza na fase norteamericana, o espaço resultante dessa estrutura parece tanto emprestar uma percepção de planta livre, quanto de planta genérica, sem recorrer às regressões neoclássicas da axialidade miesiana."
keyword: "estrutura tipo Dom-ino; casas da arquitetura moderna"
