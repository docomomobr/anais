abstract: O propósito do presente trabalho consiste na revisão de três projetos de
  casas rurais construídas, entre os anos de 1956 e 1975, pelo arquiteto argentino
  Eduardo Sacriste, na província de Tucumán, ao noroeste da Argentina. Alinhando-se
  aos objetivos estabelecidos pelo IV DOCOMOMO Sul, as três casas selecionadas possuem
  em comum o uso da pedra natural como material principal. Seguindo uma ordem cronológica,
  a primeira obra a ser analisada será a casa Torres Posse (1956/1958), seguida da
  casa Garcia Bernasconi (1964/1966) e a casa Ahualli (1974/1975). Até o presente
  momento, o material publicado acerca destas construções, além de pouco difundido
  no exterior, é escasso e disperso mesmo no país de origem. Pretende-se com este
  trabalho ampliar e organizar os estudos preexistentes, na tentativa de contribuir
  com uma apresentação gráfica que permita um melhor estudo analítico e comparativo
  destas casas.
