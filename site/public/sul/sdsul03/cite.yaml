language: pt-BR
abstract: "“Esse foi um tempo feliz, antes dos dias dos arquitetos, antes dos dias dos construtores”. Com essa citação de Sêneca, Bernard Rudofsky inicia o que chamou de uma “história natural da arquitetura”, reservada a compreendê-la mais como a expressão dos modos de habitar humanos que como a arte de construir.Escrito em 1977, The Prodigious Builders: notes towards a natural history of architecture with special regard to those species that are traditionally neglected or downright ignored – ou, “os construtores prodigiosos, notas para uma história natural da arquitetura com especial atenção para aquelas espécies que são tradicionalmente negligenciadas ou francamente ignoradas” - era o desenvolvimento do anterior Architecture Without Architects: a short introduction to non-pedigreed architecture, em que Rudofsky havia armado um extenso, e fartamente ilustrado, panorama das formas edificadas e assentamentos produzidos pelo saber vernáculo. Os arquétipos primitivos da cabana, da casa na árvore, ou do ninho do pássaro, podem ser trazidos à lembrança com relação às pequenas construções de madeira, pedra, tijolo e palha que Julio Vilamajó (1894-1948) inscreveu na paisagem rural uruguaia em 1946. As arquiteturas de Vilamajó em Vila Serrana – Mesón de las Cañas e Ventorrillo de la Buena Vista - até poderiam constituir uma dessas espécies renegadas de Rudofsky. Em certo sentido, elas o são; fora dos círculos acadêmicos uruguaios, se não ignoradas, certamente são muito menos conhecidas que merecem. Mas apenas em certo sentido. Focalizando o Ventorrillo de la Buena Vista, esse artigo vai defender uma posição que precisamente contraria certa “naturalização” dos procedimentos compositivos que muitas vezes acompanha a interpretação de arquiteturas que aludem às formas ou recorrem aos saberes construtivos vernáculos."
keyword: "Julio Vilamajó; primitivismo; madeira"
