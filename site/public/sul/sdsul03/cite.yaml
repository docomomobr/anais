ISBN: "978-85-60188-11-6"
language: pt-BR
abstract: "O centenário da Revolução Farroupilha foi festejado em grande estilo no Rio Grande do Sul através da montagem de uma exposição cujo porte buscava emular o ambiente das grandes feiras internacionais do hemisfério norte. O progressivo domínio de novos materiais como o ferro e o vidro permitia a contrução de amplos espaços públicos imunes ao sol, à chuva e ao vento. Desfrutar desses novos ambientes modernos era uma das atrações das exposições universais. No caso da Exposição Farroupilha, as ambições eram igualmente grandes, mas os meios disponíveis não podiam ser comparados. Todavia, a tradição da construção em madeira articulada, de custo menor e dominada localmente, foi aplicada à iniciativa. Desse modo, foram construídos vários pavilhões de grande escala, dentre os quais se destaca o principal protagonista da exposição: o Pavilhão das Indústrias, com 230 metros de extensão, vãos livres de 30 metros de largura com até 11,90 metros de altura interna. Este edifício com amplo espaço público de livre circulação não tinha paralelos na cidade da época e sua experimentação deve ter sido tão \"moderna\" quanto a linguagem geometrizada que caracterizava seu exterior. O artigo procura descrever este edifício em seus aspectos construtivos, pouco abordados na bibliografia existente, enfatizando suas qualidades formais e espaciais e sua relação com o contexto arquitetônico da época."
