language: pt-BR
abstract: "A exploração da araucária (araucaria angustifolia), encontrada em extensões vastas e homogêneas do sul de Minas Gerais ao norte do Rio Grande do Sul, determinou um ciclo econômico que vai de 1900 a 1950. Determinou também um tipo característico de construção: a casa de araucária. Isso se depreende da historiografia tradicional que, nostalgicamente, assimila esta arquitetura às etnias regionalmente dominantes. O estudo aqui apresentado traz um conjunto de obras produzidas no início do século XX nos Estados do Paraná e Santa Catarina, reconhecidas como patrimônio histórico, mas, até então, entendidas como excepcionais, únicas e isoladas. Esses edifícios são construídos inteiramente com tábuas de madeira; um material característico do processo industrial de transformação da natureza. Abordam questões chaves do discurso da modernidade na arquitetura: a racionalização e padronização de materiais e métodos, o projeto como ferramenta não histórica e como expressão de uma lógica produtiva, a técnica como ética. Figuram a classe e a posição social de seus proprietários; opõem-se ao vernáculo e à tradição acadêmica. Estabelecem um código de gosto, de conforto e de modernidade. Ao contrario da tradicional casa de araucária que utiliza tábuas e sarrafos na vertical como fechamento de uma estrutura que determina as arestas do volume construído, os edifícios aqui estudados apresentam tábuas dispostas horizontalmente como seu fechamento externo. A estrutura do edifício (balloon-frame) fica entre este fechamento externo de tábuas horizontais e o interno. Esse modo de construir é característico do processo industrial norte-americano que une serrarias e ferrovias na penetração e colonização do território. Os edifícios aqui abordados - aqueles de madeira na horizontal, diretamente relacionados aos “senhores das serrarias” - e os destinados à morada dos trabalhadores, aos galpões e ao comércio (aqueles de madeira na vertical) compartilham uma origem comum: o processo industrial de desdobramento da madeira desenvolvido na América do Norte no século XIX. Racionalidade construtiva; coerência entre forma, método e material; reprodutibilidade e padronização; impessoalidade, supressão do ornamento; valorização da tecnologia; estas são algumas características que unem essas construções de madeira e as colocam no processo historiográfico de construção da modernidade arquitetônica."
keyword: "arquitetura; construção de madeira"
