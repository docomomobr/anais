id: sdsul01-001
type: paper-conference
title: "Transparência, opacidade e reflexão: os projetos urbanos Sul-americanos de Le Corbusier e a construção de uma fenomenologia da percepção arquitetural"
container-title: "1º Seminário Docomomo Sul, Porto Alegre, 2006"
event-title: "1º Seminário Docomomo Sul, Porto Alegre, 2006"
event-place: "Porto Alegre, RS"
publisher-place: "Porto Alegre, RS"
issued:
  date-parts:
    - [2006, 8, 22]
ISBN: "85-60188-00-2"
language: pt-BR
abstract: "Como é sabido o célebre texto de Rowe que propõe a transparência, literal ou fenomenológica, como categoria de análise de estratégia projetual se apóia na leitura do projeto de Le Corbusier para o Palácio da Sociedade das Nações (1928). Para além das implicações desse famoso concurso no processo de articulação política dos arquitetos da vanguarda construtiva européia, o próprio Le Corbusier vê nesse projeto um ponto de clivagem de sua obra, caracterizada pela introdução da noção-consigna de “unidade do sistema arquitetural”, isto é, pela proposição de que a escala de intervenção do edifício e da cidade obedecem a um mesmo conjunto de princípios e “leis”, que configuram a base de uma poética purista do espaço urbano. O trabalho pretende investigar a hipótese de que a primeira experimentação projetual desses pressupostos se dá na elaboração dos projetos urbanos para Buenos Aires, Montevidéu, São Paulo e Rio de Janeiro e recebe sua formalização conceitual mais completa no livro Precisões sobre um estado presente da arquitetura e do urbanismo, publicado em 1930. Nesta hipótese, propõe-se que, superando a formulação do esquema teórico da Cidade Contemporânea de 1922, Le Corbusier avança, nos projetos sul-americanos, um método de elaboração projetual em que as cidades (ou as cidadelas) ganham um novo desenho, isto é, um novo processo de “formação”, a partir de uma refinada interlocução com a paisagem e os territórios que as recebem e conformam, numa antecipação daquela “acústica da paisagem”, que preside a busca poética de projetos como o Plano Obus de Argel, a Capela de Notre Dame du Haut, em Ronchamp ou o Capitólio de Chandigarh."
