id: sdsul01-040
type: paper-conference
title: "Arquitetura Moderna em Santa Maria: elementos de vedação de luz e sombra no edifício de administração central e reitoria da UFSM"
container-title: "1º Seminário Docomomo Sul, Porto Alegre, 2006"
event-title: "1º Seminário Docomomo Sul, Porto Alegre, 2006"
event-place: "Porto Alegre, RS"
publisher-place: "Porto Alegre, RS"
issued:
  date-parts:
    - [2006, 8, 22]
ISBN: "85-60188-00-2"
language: pt-BR
abstract: "Santa Maria, uma cidade de porte médio no interior do Estado do Rio Grande do Sul, teve poucas expressões de arquitetura moderna em sua forma mais pura. No entanto, o campus da Universidade Federal de Santa Maria (UFSM), situado no bairro Camobi, difere do contexto arquitetônico local por ter, desde sua implantação, seguido os princípios urbanísticos e arquitetônicos que orientaram o Movimento Moderno nacional e mundial. O edifício, que abriga a Administração Central e Reitoria da UFSM, projetado na década de 1960, é um marco referencial, sendo o ponto culminante do principal eixo de implantação e o edifício mais alto do complexo de edifícios que compõe o campus.  Este artigo apresenta e analisa os elementos arquitetônicos que definem o edifício da Administração Central e Reitoria da UFSM, em especial o tratamento de suas fachadas. A partir de consulta a documentos (plantas, fachadas, memoriais), de visitas ao local, de entrevistas e da observação dos fechamentos verticais da envolvente do edifício, faz-se uma análise da composição de suas fachadas no que tange ao jogo de cheios e vazios, à textura e à orientação solar. Observa-se a presença de aberturas envidraçadas em toda a extensão de algumas fachadas, o uso de cobogós e brises móveis onde o sombreamento é necessário e pequenas aberturas onde o controle do microclima no interior da edificação as exige."
keyword: "Modernismo; Santa Maria; edifícios administrativos"
