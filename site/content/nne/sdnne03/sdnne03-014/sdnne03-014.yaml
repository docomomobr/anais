abstract: 'Uma das características da arquitetura moderna brasileira é a relação estreita
  e complementar entre o edifício e o jardim. No entanto, ocorre uma dissociação quanto
  à instância da conservação: em muitos casos a prioridade é dada ao edifício e o
  jardim fica por esperar. Segundo pesquisa do Laboratório da Paisagem da UFPE, os
  jardins modernos privados, criados por Burle Marx no Recife, são na maioria da década
  de 1970, depois de sua experiência criando jardins públicos em 1934. Essa pesquisa
  foi expandida para outras capitais do Nordeste e já se tem um primeiro cenário com
  tempos e espaços diversos e perseguindo a proteção de um patrimônio arquitetônico.
  De um conjunto de 32 jardins privados, no Recife, foram selecionados: o jardim do
  edifício da Superintendência de Desenvolvimento do Nordeste - SUDENE (1972) no bairro
  da Cidade Universitária, projeto dos arquitetos Glauco Campelo, Frank Svenson, Mauricio
  Castro e Marcos Domingues da Silva; o da Companhia de Eletricidade do Estado de
  Pernambuco - CELPE (1972) na Boa Vista, projetado pelos arquitetos Vital Pessoa
  de Melo e Reginaldo Esteves; e o da residência Emir Glasner de Barros (1973), no
  bairro das Graças, projetada por Vital Pessoa de Melo. Os jardins da CELPE e da
  SUDENE estão abandonados perdendo suas características de conjunto vivo com o edifício;
  e o jardim da residência das Graças está ameaçado de destruição para a expansão
  da Faculdade Mauricio de Nassau, além da crescente verticalização. Quais as principais
  dificuldades para a conservação de um jardim residencial e de um jardim institucional?
  Diferente do edifício, o jardim tem um caráter dinâmico, pois sofre mudanças físicas
  pelas variações climáticas e biológicas, além das modificações feitas pelo homem.
  Nos jardins privados, os problemas estão mais relacionados à necessidade de acréscimo
  de cômodos, de estacionamento, substituição de plantas pela falta de conhecimento
  ou até mesmo mudança de uso em edifícios institucionais.'
keyword: Burle Marx; Jardins Privados; Conservação
