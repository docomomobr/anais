abstract: A preservação da arquitetura do Movimento Moderno visa contrariar seu envelhecimento
  e impedir sua ruína. Tendo o campo disciplinar da preservação nascido da recuperação
  de edifícios antigos, ajustá-lo para fazer frente à preservação de obras recentes
  é um objetivo que apresenta alguns paradoxos conceituais. Interrogando a história
  e os edifícios através dos métodos próprios também da arqueologia, cabe perguntar
  de que maneiras as pedras sem patina e sem cicatrizes poderiam pronunciar seus significados
  e valores, seja a partir da conservação de seus escombros informes, seja a partir
  da construção de jovens clones e simulacros. A proposta deste texto é analisar as
  condições de sobrevida dessa arquitetura, de sua transformação e preservação. Sempre
  considerando a ameaça que paira sobre as ruínas da modernidade, a de se perderem
  da história para se somarem ao entulho anônimo que ameaça o planeta.
