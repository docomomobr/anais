abstract: Este artigo apresenta o Plano de Conservação para o edifício sede da Companhia
  Elétrica de Pernambuco (Celpe), realizado segundo a metodologia proposta pelo I
  Curso Latino Americano sobre a Conservação da Arquitetura Moderna (MARC-AL), promovido
  pelo CECI e pelo ICCROM, com o apoio do Docomomo-Brasil e da UFPE. O MARC-AL tem
  por objetivo a capacitação profissional para a conservação do patrimônio da arquitetura
  moderna. Projetado em 1971, por Vital M. T. Pessôa de Melo e Reginaldo Esteves,
  o edifício sede da Celpe é um dos exemplares mais significativos da arquitetura
  moderna produzida no estado de Pernambuco. Sua fachada principal composta por brise-soleils
  de concreto pré-moldado, associada à sua implantação no terreno, à solução dos volumes
  de seus blocos e à integração arquitetônica no ambiente urbano, em área central,
  conformam os elementos de destaque para o reconhecimento dos valores do edifício.
  O edifício mantém sua função original e, em três décadas de existência, passou por
  poucas intervenções que afetassem sua estrutura e seu aspecto geral, conferindo-lhe
  aspectos positivos relativamente à sua significância e à autenticidade do conjunto
  edificado. Mesmo que o edifício sede da Celpe não tenha passado por grandes intervenções
  e se encontre pouco descaracterizado, ele ainda apresenta alguns desafios para a
  sua conservação. O objetivo deste artigo é apresentar, além do Plano de Conservação
  para o edifício sede da Celpe, o estudo dos valores de um edifício moderno e sua
  significância cultural, bem como sobre seus materiais, sistemas construtivos e processos
  de degradação física. O artigo discute, também, quais os desafios associados à conservação
  de um edifício moderno, qual o papel do conservador na identificação destes e como
  um projeto de intervenção pode auxiliar a superá-los. Além disso, apresenta a investigação
  sobre as possibilidades e os procedimentos metodológicos projetuais para a conservação
  e intervenção em edifícios modernos.
