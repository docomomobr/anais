abstract: A discussão acerca da conservação e preservação da arquitetura moderna brasileira
  é relativamente recente, principalmente fora das fronteiras tradicionalmente delimitadas
  como ‘lugar’ da gênese dessa produção. Decorre daí a dificuldade do seu reconhecimento
  legal e a conseqüente perda de parte deste patrimônio, ainda não apropriado pela
  sociedade. Diante disto, torna-se premente o debate sobre as especificidades que
  envolvem sua preservação. Na Paraíba, desde o final dos anos de 1980, cresce o número
  de pesquisas e trabalhos dedicados a esta produção, constituindo um importante acervo
  para a construção de outras versões da história da arquitetura moderna brasileira.
  Em João Pessoa, a pressão imobiliária vem condenando à destruição diversos exemplares
  dessa produção de forma cada vez mais acelerada. O desconhecimento que se tem do
  valor artístico destas obras, por sua vez,dificulta sua preservação. Preservação
  essa que, no nosso entendimento, não vincula-se necessariamente ao seu tombamento.
  Este ensaio pretende, a partir do estudo de duas obras de intervenções em exemplares
  modernos, um de caráter regional, o Pavilhão de Óbitos, localizado em Recife/ PE,
  e o outro de caráter local, a Sede da Associação Atlética Banco do Brasil – AABB,
  localizada em João Pessoa/ PB, compreender quais as posturas e critérios que nortearam
  essas ações, de maneira a fornecer subsídios para a discussão dos limites das operações
  de intervenções sobre o patrimônio moderno, contribuindo com parâmetros técnicos
  para o debate sobre o que preservar e como preservar.
