abstract: 'A atuação de Lina Bo Bardi em Salvador desperta interesse pela tentativa
  de superação da fratura histórica entre o "antigo" e o "moderno" e pela ativação
  de um pertinente exercício crítico aplicado na intervenção relacionada a preexistências
  de valor documental. Este estudo analisa duas intervenções concebidas em momentos
  diferentes: o Solar do Unhão (1962) e a Ladeira da Misericórdia (1987), preexistências
  de interesse cultural, que envolvem necessariamente a relação entre arquitetura
  e cidade. A abordagem busca estabelecer um confronto entre as referências conceituais
  presentes nos escritos da arquiteta, nos memoriais de projeto, e os parâmetros contidos
  nas teorias e nos documentos internacionais do campo disciplinar do restauro dos
  bens arquitetônicos. Além disso, pretende explorar os vínculos estabelecidos com
  o contexto de sua formação e com a tradição crítica italiana, de modo mais amplo.
  A produção de Lina Bo Bardi é aqui considerada pelo projeto do novo que surge a
  partir de uma complexa urdidura entre erudição e cultura popular, entre presente
  e passado. Rever essas duas intervenções, após tanto tempo desde suas concepções,
  considerando o abandono em que se encontra a Ladeira da Misericórdia, permite não
  só reavaliar os critérios do próprio plano ao qual estão associadas, mas analisar
  esses objetos em diferentes temporalidades, com base nas categorias criadas por
  Amorim: a morte lenta e dolorosa a que estava submetido o conjunto histórico de
  Salvador tanto no momento em que se decide pela intervenção no Solar do Unhão, como
  quando da atuação na Ladeira; a morte prematura do projeto da Ladeira da Misericórdia
  que a transforma em ruína antes mesmo de ter seu uso plenamente ativado; a oscilação
  entre vitalidade e morte anunciada presente na ação mais recente do Programa de
  Recuperação do Centro Histórico de Salvador (iniciado em 1992) baseada no resgate
  físico de uma cidade-mercadoria.'
