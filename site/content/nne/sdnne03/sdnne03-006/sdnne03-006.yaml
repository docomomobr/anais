abstract: São raros os momentos na história das políticas de preservação do patrimônio
  no Brasil em que se vê a dimensão do conflito pela atribuição de valores a um bem
  cultural alcançar significativa repercussão, mobilizando diversos agentes. O caso
  do edifício Luciano Costa, no Recife, é um desses casos. No presente artigo, procuramos
  estudar a polêmica preservacionista em torno desse edifício, um exemplar arquitetônico
  singular, por ter simultaneamente duas fachadas, uma Eclética e uma Modernista.
  A partir da interpretação de uma trama complexa de discursos e ações, será possível
  adentrar discussões sobre agentes, critérios e práticas nas políticas preservacionistas
  do IPHAN e refletir sobre o tratamento recebido pelo Ecletismo e pelo Modernismo
  na trajetória dessa instituição. Em grande parte inéditos, os documentos técnico-administrativos
  da 5ª Superintendência Regional e do Departamento de Documentação do IPHAN, assim
  como aqueles da Fundação do Patrimônio Histórico e Artístico de Pernambuco (FUNDARPE),
  da Diretoria de Projetos Especiais da Empresa de Urbanização do Recife (URB-Recife)
  e do Ministério Público de Pernambuco foram as fontes primárias privilegiadas.
keyword: IPHAN; Ecletismo; Arquitetura Moderna
