abstract: O objetivo desta comunicação é investigar as experiências do habitar moderno
  na cidade de João Pessoa, na segunda metade do século XX, analisando os meios pelos
  quais o repertório de Arquitetura Moderna se dissemina através da arquitetura residencial.
  Nesse processo, são o foco deste trabalho as relações entre clientes, incorporadores,
  poder público e arquitetos, buscando ampliar a noção sobre o tema da difusão dessa
  arquitetura para além da simples acepção de “profissionais migrantes”.
