abstract: Teresina/PI teve sua expansão urbana marcada pela implantação das redes
  técnicas de transportes, evidenciando-se ao criar continuidades, descontinuidades
  e um direcionamento na configuração da ocupação física da cidade. A princípio o
  sistema de transportes baseava-se na navegação pelo rio Parnaíba. Posteriormente
  (1930 a 1950), evidenciou-se o sistema ferroviário. Na década de 1990, oportunizou-se
  o aproveitamento da ferrovia para implantar o “Pré-Metrô”. A concorrência do transporte
  rodoviário (1940 e 1970) ofuscou os demais sistemas. O transporte aeroviário inicia-se
  com hidroaviões no rio Parnaíba (1930) e consolida-se com a criação do aeroporto
  (1970). O objeto de estudo centra-se na relação entre a modernização dos sistemas
  de transportes e as transformações ocorridas na morfologia urbana de Teresina. Objetiva-se
  compreender as repercussões e implicações da implantação das redes técnicas de transportes
  no processo histórico de expansão e modernização urbana. Não existem estudos sobre
  a questão com este foco. Portanto, justifica-se buscar entender a relação entre
  a modernização dos sistemas de transportes e o crescimento da ocupação urbana. A
  discussão dar-se em torno do arcabouço metodológico da abordagem histórico-geográfica
  da morfologia urbana. Os resultados indicam que os sistemas de transporte desempenharam
  um papel crucial na criação de conexões e desconexões durante a expansão do território
  urbano de Teresina. Além disso, aponta-se que a modernização desses sistemas teve
  como consequência uma expansão progressiva da ocupação física da cidade.
keyword: Morfologia Urbana; Transformações Espaciais; Ocupação do Território
