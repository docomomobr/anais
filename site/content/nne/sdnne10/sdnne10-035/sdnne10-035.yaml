abstract: 'O presente artigo busca analisar algumas questões que dizem respeito à
  relação entre arte e arquitetura na Residência Rubens de Mendonça, ou Casa dos Triângulos,
  projeto de Vilanova Artigas de 1956 em parceria com os artistas Mário Gruber e Rebolo
  Gonsáles. A análise pretende trazer novas perspectivas que surgem após as considerações
  feitas por Raphael Grazziano em seu artigo “Um impasse estético em Artigas: entre
  o realismo socialista e o concretismo”. Dentre as novas perspectivas, destacam-se
  alguns paralelismos entre a Casa dos Triângulos e as Casas Kádár-kocka da Hungria
  Soviética. Desses paralelismos, há a possibilidade de abordar a ironia de que embora
  Artigas buscasse explorar uma relação entre arte e arquitetura pautada por um discurso
  de vanguarda, os conflitos de ideias na referida casa se aproximam dos conflitos
  relacionados ao contexto e discussões sobre arte e arquitetura em que se popularizam
  as Casas Kádár-kocka. Os murais presentes nas Casas Kádár-kocka ecoam certas características
  do Kitsch apontados por Clement Greenberg em seu texto “Avant Garde and Kitsch”,
  de 1939 (há que se destacar que as questões problemáticas do texto já levantadas
  posteriormente pelo próprio autor serão consideradas e apontadas aqui). Há também
  outra questão em termos de possibilidade de leitura da relação entre arte e arquitetura
  na Casa dos Triângulos a ser explorada, o fato de que a composição ecoa os azulejos
  em branco e azul de herança colonial portuguesa de maneira alegórica. Por fim, buscase
  trazer algumas considerações que esclarecem a interpretação de que o que foi materializado
  na Casa dos triângulos não é apenas a expressão de um conflito entre duas correntes
  estéticas, mas uma expressão da complexidade de diferentes ecos, como a sobreposição
  de elementos da arte e arquitetura em voga, da tradição e da alegoria.'
