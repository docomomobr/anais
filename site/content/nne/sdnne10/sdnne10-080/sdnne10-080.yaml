abstract: O italiano Giacomo Palumbo (1891-1966) foi o arquiteto de maior destaque
  atuando na cidade do Recife durante as décadas de 1920 e 1930. Legitimado por sua
  formação em Paris, produziu as mais importantes obras públicas e privadas deste
  período, seguindo um vocabulário arquitetônico clássico e eclético. Apesar da magnitude
  de sua obra, que se estendeu para outras cidades do Nordeste e para o Rio de Janeiro,
  existem grandes lacunas e omissões na historiografia da arquitetura sobre sua figura.
  Como recorte de uma pesquisa mais ampla que procura resgatar sua trajetória e obra
  no Recife, este artigo buscou analisar sua atuação a partir dos anos 1930, quando
  a cidade atravessava um processo de modernização com o estabelecimento de profissionais
  alinhados ao movimento moderno, como Luiz Nunes, e com intensas discussões urbanísticas
  que levaram à remodelação do centro durante o Estado Novo. Diante deste novo cenário,
  buscamos mostrar como Palumbo procurou se inserir na nova conjuntura, que também
  incluía reviravoltas políticas, por meio da gradativa atualização de sua linguagem
  com a introdução de elementos do Art Déco ou protoracionalismo, como pode ser visto
  na remodelação do Cineteatro Moderno no Recife, efetuada entre 1932 e 1933, e na
  proposta para Ponte Duarte Coelho, cujo caráter monumental de obra de arte representava
  a capacidade desse arquiteto em lidar com diferentes programas, estilos e funções,
  não deixando de se inserir neste debate, adaptações às novas circunstâncias locais
  e referências.
