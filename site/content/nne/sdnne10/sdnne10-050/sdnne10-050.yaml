abstract: 'A dinâmica dos portos se encontra relacionada com o desenvolvimento das
  cidades ao longo da história. São Luís, assim como outras capitais brasileiras,
  teve seu surgimento e expansão impulsionados pela proximidade com o mar. No entanto,
  ao longo do século XX houve uma desestabilização da relação cidade-porto com a implementação
  de três planos de expansão: Plano de Otacílio Saboya (1936), o Plano de Ruy Mesquita
  (1958) e o Plano de Wit - Olaf (1975). A mudança das atividades portuárias do centro
  para o eixo de expansão do Itaqui-Bacanga, na década de 1970, e a inscrição do centro
  como patrimônio mundial pela UNESCO, em 1997, fragmentaram o conceito de cidade
  portuária, que logo foi substituído pelo conceito de cidade patrimônio. Assim, como
  resultado de um Projeto de Pesquisa, este artigo tem por objetivo compreender o
  conceito histórico de São Luís como cidade portuária dentro do processo de expansão
  ocorrido no século XX, por meio da catalogação e análise da cartografia, ilustrações
  e fotografias encontradas em álbuns históricos. Os fundamentos metodológicos dividiram-se
  em etapas de pesquisa bibliográfica, que permitiu a contextualização do histórico
  da expansão urbana na cidade de São Luís e suas relações com o urbanismo modernista
  e o porto; pesquisa empírica, onde foram realizadas visitas e levantamentos fotográficos
  de museus e do complexo portuário Itaqui, de São Luís; e pesquisa documental, por
  meio da catalogação de mapas, fotografias e ilustrações presentes em acervos, álbuns
  e museus.'
keyword: Expansão Urbana; Modernidade; Porto
