abstract: 'O presente ensaio teórico tem como objetos de análises os museus marajoaras,
  um localizado em Cachoeira do Arari-Pa e outro em Breves-Pa, dois museus que apresentam
  realidades distintas quanto à construção e consolidação de patrimônios e memórias
  negras. O museu de Cachoeira do Arari é intitulado de Museu do Marajó e apresenta
  elevada consolidação em relação ao museu de Breves, este, por sua vez, encontra
  dificuldades em se desenvolver, em adquirir corpus, seja por falta de apoio financeiro
  como por uma aparente falta de elementos passíveis de serem preservados ou de salvaguarda-se.
  O município de Breves é entendido como a capital do arquipélago marajoara e tem
  uma história marcada pelos ciclos econômicos e de grande exploração ambiental. Destaca-se
  que Cachoeira do Arari compõe o Marajó Oriental (Marajó dos campos) e Breves o Marajó
  Ocidental (Marajó das florestas). Observa-se que em ambas as localidades, quanto
  ao constructo social de pertencimento à comunidade, carecem de marcadores sociais
  e historiográficos que venham a evidenciar ou a conectar as pessoas destas localidades
  com um passado racial (e étnico) negro (afroindígena) - algo que visivelmente está
  presente, tendo em vista os dados oficiais de autodeclaração de cor que atestam
  tais suspeitas. A esse aspecto, ambos os museus encontram similaridades quanto ao
  apagamento da memória negra africana. Então, por meio de levantamento bibliográfico
  e documental exploratórios, a pesquisa aponta para questões latentes como epistemicídio
  afrodiaspórico e de evidentes construções sociais que negam a presença da ancestralidade
  africana na Amazônia. E entendendo a singularidade da região, considera-se que a
  valorização dos patrimônios históricos e culturais marajoaras estão na leitura de
  uma identidade racial/étnica. Assim, pretende-se desnudar uma necessidade urgente:
  o Brasil precisa redescobrir a África na vitalidade de sua cultura moderna, pois
  só assim as pessoas racializadas de origem africana poderão recuperar por inteiro
  a dignidade que lhes foi roubada com a escravatura.'
