abstract: No Brasil, o conceito de durabilidade na construção civil foi introduzido
  em 2003 com a revisão da NBR 6118. Até então, predominava a ideia de que as estruturas
  de concreto eram eternas e não precisavam de manutenção. Por isso, existe hoje a
  necessidade de estudar o estado de preservação das construções modernas para aumentar
  sua vida útil e garantir que as próximas gerações possam vivenciar a história por
  meio do patrimônio arquitetônico. Dessa forma, este trabalho buscou avaliar as manifestações
  patológicas presentes nas estruturas de concreto armado do Departamento de Estradas
  e Rodagens de Campina Grande (DER), com o objetivo de verificar o grau de criticidade
  e classificá-las de acordo com a prioridade de intervenção. Para isso, foram realizadas
  vistorias prediais seguindo as diretrizes da norma do Instituto Brasileiro de Avaliações
  e Perícias de Engenharia (IBAPE) e foi feito o gerenciamento de risco de acordo
  com a metodologia GUT (Gravidade, Urgência e Tendência). Com base nos resultados
  obtidos, as principais causas dos problemas identificados foram o cobrimento insuficiente
  das armaduras e a ausência de impermeabilização nas lajes. A corrosão das armaduras
  destacou-se como o problema mais crítico, exigindo prioridade de reparo. Isso evidencia
  que, além da medida terapêutica adequada, há a necessidade de um retrofit para restaurar
  o edifício e adequá-lo às normas vigentes.
keyword: durabilidade; matriz GUT; inspeção predial; retrofit; preservação
