abstract: O presente artigo tem como objeto de estudo a residência Miguel Vita, que
  foi projetada no ano de 1958 no Recife, Pernambuco, pelo arquiteto luso-brasileiro
  Delfim Fernandes Amorim. A residência familiar de propriedade do industrial que
  deu nome à casa, é um exemplar relevante das realizações de arquitetos atuantes
  em Pernambuco, por expressar preceitos arquitetônicos que foram associados à concepção
  da mansão moderna. Contudo, apesar de ter o seu valor enquanto exemplar arquitetônico
  reconhecido pelos estudos acadêmicos especializados e por uma certa parcela da sociedade,
  a residência – que àquela altura já abrigava outro uso, governamental - foi demolida
  no ano de 2020, o que gerou debates e questionamentos por parte daqueles que reconheciam
  o seu valor. O episódio fez com que esse exemplar arquitetônico se juntasse à lista
  de outros edifícios modernos que já haviam sido e vem sendo “levados a óbito”, tendo
  em vista a problemática da aparente dificuldade em salvaguardar arquiteturas modernas.
  Assim, levando-se em consideração a relevância desse projeto e considerando que
  a residência não mais existe em sua forma física e material, o presente artigo tem
  como interesse contribuir com os esforços de documentação do patrimônio moderno,
  tendo como objetivo relatar a experiência de documentar o projeto e experimentar
  por meio de realidade virtual o espaço de um “gêmeo virtual”, ou seja, um modelo
  tridimensional computadorizado da Casa Miguel Vita. Para alcançar tal objetivo,
  a metodologia proposta parte do levantamento de fotografias e do projeto original
  da residência, seguida da modelagem 3D casa e a configuração deste para ser experimentado
  por meio de equipamento apropriado para realidade virtual. Como resultados, pôde-se
  notar a potencialidade do método para o estudo espacial, volumétrico e experiencial
  de edifícios, contribuindo de maneira a explorar a documentação de arquiteturas
  através de experiências em realidade virtual, evidenciando as suas peculiaridades
  e possibilidades.
keyword: realidade virtual; documentação da arquitetura moderna; Delfim Amorim
