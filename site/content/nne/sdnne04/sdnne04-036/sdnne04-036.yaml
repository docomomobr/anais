abstract: O presente artigo trata da atuação do arquiteto José Neudson Braga em Fortaleza.
  O arquiteto foi um dos protagonistas no processo de introdução e difusão do modernismo
  arquitetônico na Cidade, após sua formação (1955-59) na Escola Nacional de Arquitetura
  no Rio de Janeiro. No regresso a Fortaleza, atuou no planejamento físico do campus
  e no projeto de diversos edifícios da Universidade Federal do Ceará. Desde a década
  de 1960, conciliou a atividade projetual com a prática docente, ingressando em 1962
  como auxiliar de ensino na Escola de Engenharia da UFC, e em 1965 compôs a comissão
  de criação da Escola de Arquitetura da UFC, onde lecionou até 1992. A contribuição
  de Neudson Braga é relevante, tanto em relação a sua atuação como professor, legado
  deixado a gerações e gerações de arquitetos cearenses, como no que se refere à sua
  atuação profissional, com uma produção quantitativa e qualitativamente expressiva,
  com valores notadamente modernos. Neste sentido, o trabalho pretende enfocar aspectos
  relativos à formação e influências do arquiteto na cidade do Rio de Janeiro, os
  primeiros desafios da profissão no retorno à Fortaleza, a sua atividade docente
  e sua produção arquitetônica na cidade, onde ainda hoje desempenha papel relevante,
  mantendo-se ativo na sua atividade profissional. Em conformidade com a temática
  sugerida pelo seminário, entende-se que a contribuição do arquiteto e professor
  José Neudson Braga constitui importante legado a ser documentado, permitindo inferir
  sobre as possibilidades de preservação do patrimônio moderno e sua inserção em contextos
  socioespaciais contemporâneos de cidades que se pretendem “sempre novas”.
