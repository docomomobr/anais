abstract: Este artigo registra e analisa a arquitetura de uma residência moderna,
  projetada no ano de 1981, pelo arquiteto Régis Cavalcanti, na cidade de João Pessoa-PB.
  Seu objetivo propõe registrar a edificação, remanescente da crescente descaracterização
  e destruição das residências no bairro de Tambauzinho, local onde a mesma está inserida,
  e consequentemente estudá-la pelo valor arquitetônico moderno que possui. Serão
  analisadas características inerentes à implantação, composição volumétrica e organização
  espacial, a fim de compreender seus aspectos funcionais, trazendo considerações
  e memórias de seus moradores em paralelo à crítica modernista.
