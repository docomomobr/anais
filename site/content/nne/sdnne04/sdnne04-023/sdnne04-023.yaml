abstract: Ao integrar a selecionada equipe do SPHAN e liderar o Departamento de Estudos
  e Tombamentos – DET, o arquiteto e urbanista Lucio Costa associou a modernidade
  e a tradição, o novo e o antigo, por meio da valorização das obras do passado mas
  aceitando o seu diálogo com as obras contemporâneas. Esta experiência viria a ser
  posta em prática não só na arquitetura mas também no urbanismo. Em finais da década
  de 1970, uma proposta de desenho para a expansão planejada de São Luís do Maranhão
  é desenvolvida pelo arquiteto moderno. A proposta do “Novo Polo Urbano de São Luís”
  ocorre na sequência dos estudos desenvolvidos por Michel Parent, em 1966, e Viana
  de Lima, em início da década de 1970, no âmbito da UNESCO para a cidade, com ênfase
  no património enquanto dimensão urbana. O artigo propõe analisar a proposta urbanística
  desenvolvida por Lucio Costa para a cidade-capital do Estado do Maranhão, São Luis,
  ao traçar uma análise paralela sobre o desempenho do tecido urbano atual e aquele
  proposto por Lucio Costa, salientando aspetos mais e menos relevantes para o desenvolvimento
  urbano da cidade.
