abstract: 'Emergiam em Natal, em meio aos anos de 1930 e de 1960, novas linguagens
  na arquitetura. Tendências racionalizantes e elementos da “arquitetura moderna”
  disseminavam-se em prédios institucionais, equipamentos públicos e residências particulares.
  Paralelamente, instalavam-se na capital as primeiras instituições federais encarregadas
  de intervir diretamente no mercado de moradias por meio do financiamento para construção
  e aquisição de imóveis, além da produção direta de vilas e de conjuntos: os Institutos
  de Aposentadorias e Pensões – IAPs. Atualizados quanto ao debate acerca da “reformulação
  da moradia”, profissionais articulados por esses órgãos propuseram obras que traduziram
  preceitos da arquitetura e do urbanismo modernos por vários centros do país. Nos
  agrupamentos residenciais propostos para Natal, estes princípios se materializaram
  especialmente no Conjunto Nova Tirol, concebido e edificado pelo IAPC em 1958. Neste
  trabalho, objetiva-se discutir a apropriação de novas tendências na arquitetura
  das moradias individuais, alvo de sua política entre 1946 e 1964. Para tanto, foram
  identificados e discutidos os “traços e linhas” que revelavam inovações na moradia,
  conforme três aspectos: formais, técnicos e espaciais. Os dados primários provêem
  dos processos prediais arquivados no INSS-RN e armazenados no Banco de dados do
  HCUrb, sobretudo do material gráfico anexado a 40% desses processos. Verificou-se
  que novas tendêncas se apresentam em intensidades diferentes ao longo dos períodos,
  sendo mais “incisivas” nas décadas de 1950 e 1960, quando profissionais alinhados
  com a arquitetura moderna passaram a atuar na cidade, e, também, no corpo técnico
  dos IAPs.'
