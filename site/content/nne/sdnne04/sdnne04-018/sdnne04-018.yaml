abstract: Considerando a necessidade de compreender o processo de modernização da
  cidade de Patos a fim de contribuir para a história da arquitetura, o presente artigo
  tem como objeto de estudo a Arquitetura Moderna da cidade de Patos, que faz parte
  das pesquisas sobre as cidades paraibanas como João Pessoa e Campina Grande. O trabalho
  buscou realizar um levantamento inicial, listando e avaliando a produção arquitetônica
  moderna em Patos através de registros fotográficos. Através da análise de fotos
  e jornais locais antigos, de livros e periódicos sobre a história de Patos e mesmo
  de placas de inauguração de algumas edificações públicas foi possível pré-selecionar
  alguns edifícios. Foram identificados os elementos que caracterizam essa produção
  moderna, como janelas corridas, brises, marquises, elementos vazados, lajes em balanço,
  lajes planas, telhado borboleta e pilotis. Assim foram realizadas visitas aos exemplares
  pré-selecionados, para realizar os registros fotográficos. A etapa seguinte tratou
  de formular uma ficha para esses registros, que continha informações relativas ao
  seu uso atual, ao arquiteto autor do projeto, ao construtor, ao proprietário, à
  data de inauguração/construção, à identificação das imagens, à localização de cada
  edifício na cidade e às características modernas identificadas na obra. A premissa
  do trabalho é a de que o registro fotográfico é uma forma de preservar as informações
  sobre essa produção moderna na cidade.
