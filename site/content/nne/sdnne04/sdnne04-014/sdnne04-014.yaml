abstract: O artigo discorre sobre o patrimônio arquitetônico inventariado na cidade
  de Viçosa/AL, realizado como um Projeto de Extensão vinculado à disciplina Prática
  do Restauro ministrada no Curso de Arquitetura e Urbanismo da FAU/UFAL durante o
  semestre letivo 2011.2, quando foram registradas 144 edificações. A pesquisa bibliográfica
  comprovou o que os antigos moradores rememoram como os “bons tempos” do comércio
  do algodão, que selou um grande desenvolvimento econômico e social entre o final
  do século XIX, até quase meados do século XX, época em que se construiu o acervo
  arquitetônico mais representativo da cidade. Edificações com traços dos estilos
  Eclético, Protomodernista e Modernista notabilizam este acervo, e espelham ideários
  que buscaram romper com tradições e ‘viajar’ em imaginários assimilados pelos “tempos
  modernos”; mas que somente foram possíveis de ser edificadas pelo patrocínio da
  rentabilidade comercial do beneficiamento do algodão, o que nos permite alcunhá-la
  como uma ”arquitetura do algodão”. Mostra ainda como alguns desdobramentos do inventário
  podem subsidiar AÇÕES de Educação Patrimonial pontuadas nas representações modernistas
  de várias edificações que ainda marcam a fisionomia das principais ruas da cidade
  e o cotidiano das pessoas.
