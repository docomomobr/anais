abstract: Com o passar dos anos, várias construções requerem adaptações e mudanças
  para se adequarem a novas demandas de uso. Os aeroportos são casos exemplares dessa
  dinâmica, ao tempo que alguns deles também são obras de reconhecido valor artístico.
  Dessa forma, a pesquisa aborda a intervenção arquitetônica em uma obra moderna.
  Estuda o Aeroporto Castro Pinto, projetado em 1981 por Sérgio Bernardes, que passou
  em 2004 pelo processo de ampliação e “modernização” de seu terminal de passageiros.
  Busca enfocar a análise da proposta de intervenção, a fim de questionar a tendência
  à padronização das soluções arquitetônicas de tais equipamentos, independentemente
  das particularidades e valores dos edifícios precedentes. Constata que o novo edifício
  substitui características singulares do projeto original por elementos desprovidos
  de caráter.
