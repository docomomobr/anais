abstract: 'É corrente hoje, um discurso disseminado sobre o concreto armado como tecnologia
  construtiva, não apenas no meio técnico de arquitetos, engenheiros e empresas construtoras,
  mas que perpassa para a informalidade da mão de obra menos especializada. Define-se
  essa característica como cultura técnica do concreto armado, que prescinde da formulação
  e sua sistematização do conhecimento científico acumulado sobre uma tecnologia construtiva,
  possibilitando, assim a sua normatização e, por conseqüência, sua difusão. Nesse
  enredo, as companhias construtoras com domínio do sistema construtivo do concreto
  armado tornam-se importantes agentes desse processo. Elas são as responsáveis no
  caso brasileiro da introdução daquela nas construções, dotando-o de um novo valor
  estético e tectônico. A Christiani & Nielsen, empresa dinamarquesa constituída em
  1904, vem ao Brasil em 1917, entrando por Recife. Na primeira obra em solos brasileiros,
  a construtora enfrenta diversidades próprias do meio socioeconômico e tecnológico.
  Problemas que são resolvidos com perspicácia e inovação, denotando uma dos aspectos
  que marca a atuação da empresa construtora ao longo de quase 80 anos de existência.
  Num segundo momento, onze anos depois dessa obra pioneira, a Christiani & Nielsen
  ganha a concorrência da ampliação do Elevador Lacerda, empreitada em que novamente,
  ela vai executar correspondendo além das expectativas exigidas pelo edital. Entende-se,
  tanto o caso da obra de Recife, quanto a de Salvador como duas portas importantes
  de ingresso da empresa construtora no Brasil, que nos permitem entender duas questões
  importantes dessa tessitura tectônica: o diálogo entre os distintos profissionais
  envolvidos no canteiro de obra e as incongruências existentes entre uma tecnologia
  construtiva e o meio em que se desenvolve, mostrando como o concreto armado é um
  sistema construtiva versátil. No fim, como plasticidade, para além da questão de
  estilo, resta-nos a racionalidade construtiva, condição imprescindível para o entendimento
  da ação da Christiani & Nielsen e a bem sucedida empreitada como um dos principais
  agentes de constituição da cultura técnica do concreto armado no Brasil atual.'
keyword: Christiani & Nielsen; cultura técnica; concreto armado; Recife e Salvador
