abstract: 'Com o tema das expressões da arquitetura modernista, privilegiando edifícios

  religiosos potiguares, este trabalho propõe uma análise comparativa entre a Catedral

  Metropolitana de Natal, de autoria do Arquiteto Marconi Grevi, e a Capela Ecumênica
  da

  UFRN, do Arquiteto João Maurício Fernandes de Miranda. A escolha dessas duas

  edificações se deu por um recorte temporal, especificamente a década de 1970. E
  também

  pela dissonância visual existente entre as duas edificações, o que geraria uma discussão

  interessante, tendo foco direcionador o Movimento Moderno. Apesar de possuírem a
  mesma

  função, detém porte e focos diferentes, o que torna o estudo ainda mais interessante.
  Sendo

  assim, para a leitura morfológica da arquitetura das edificações foram eleitos critérios,
  os

  quais são: impacto da obra arquitetônica, forma, organização do espaço, sistema
  estrutural,

  transparência x opacidade e materiais de revestimento. Esses critérios estão associados
  à

  relevância deles em cada edificação e a sua relação com o Movimento Moderno Brasileiro,

  em especial com os desenvolvimentos do período pós-Brasília. Logo, há inicialmente
  uma

  especificação desses critérios, expondo a sua importância na edificação e também
  evolução

  do processo projetual. Durante essa análise, as edificações mostram-se mais semelhantes

  do que o esperado. As duas edificações detêm planta baixa trapezoidal, estrutura
  de

  concreto armado e materiais de revestimentos na sua forma mais pura. Com isso a
  Catedral

  e a Capela, apesar de levarem a percepções visuais tão distintas, demonstraram mais

  semelhanças do que o esperado previamente. Essa percepção visual está estritamente

  relacionada com a função das duas edificações. Obviamente a função primordial é
  religiosa,

  porém com focos diferentes. A Catedral tem como função atender a todos os fiéis
  da região

  metropolitana de Natal, enquanto a Capela Ecumênica à instituição de ensino superior

  UFRN. Essa diferença induz, também, a monumentalidade da Catedral em relação à

  Capela, já que na sua origem funcional primordial possuem capacidades desproporcionais

  entre si.'
