abstract: A arquitetura propriamente moderna aporta em Belém a partir da década de
  1940 e se desenvolve sob várias influências, como a do estilo internacional e a
  da escola carioca, e como resposta a um novo e intenso anseio da elite paraense
  por modernização, tal como na belle époque. De qualquer forma, se fez sempre singular,
  principalmente por ter sido produzida por engenheiros. Junto às residências, os
  clubes recreativos e esportivos foram o cenário social dessa modernização e atribuíam
  aos seus sócios e frequentadores determinado prestígio social, destacando-se a sede
  social do Clube do Remo, a sede campestre da Tuna Luso Brasileira, a sede social
  da Associação Atlética Banco do Brasil (AABB) e a sede social do Paysandu Sport
  Club. Além de apresentar dados históricos sobre seus projetos e construções como
  ferramenta de documentação, o objetivo do artigo é analisar suas características
  e atentar para suas transformações, tanto as descaracterizantes como aquelas de
  potencial para o reconhecimento de seus valores e consequente preservação. Apesar
  das descaracterizações apontarem o não reconhecimento dos valores históricos e estéticos
  das sedes por parte do público em geral e dos usuários, a maioria delas tem ainda
  caráter reversível e a transformação das cores originais dos edifícios em função
  dos escudos dos clubes pode ser entendida como potencialidade para o reconhecimento,
  já que identifica as sedes com a história e importância das agremiações mais tradicionais
  do estado. Dessa forma, é possível restituir a unidade potencial dos objetos e aprofundar-se
  nas questões teóricas relativas ao reconhecimento dos seus valores com vistas à
  sua transmissão às gerações futuras, seja pela preservação ou por intervenções de
  restauro.
keyword: Arquitetura moderna; Belém; Clubes recreativos e esportivos; Preservação
