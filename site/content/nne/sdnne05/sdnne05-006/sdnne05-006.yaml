abstract: O presente artigo trata da trajetória do arquiteto José Armando Farias (1927-1974)
  em Fortaleza que, apesar da morte precoce, foi um dos protagonistas no processo
  de introdução e difusão do modernismo arquitetônico na Cidade, tanto por via de
  sua atuação profissional como por sua atividade didática. Neste sentido, o trabalho
  pretende enfocar aspectos relativos ao resgate da memória do arquiteto, por meio
  da narrativa de sua atuação (profissional e docente) e, sobretudo, da análise da
  sua produção arquitetônica em Fortaleza. Entende-se que a contribuição do arquiteto
  e professor José Armando Farias, até agora pouco conhecida, constitui importante
  legado a ser documentado, permitindo inferir sobre as possibilidades de preservação
  desse patrimônio moderno e a reversão do seu quadro de desvalorização simbólica
  e degradação física. A pesquisa almeja ainda contribuir para a produção recente
  da história e historiografia da arquitetura moderna no Nordeste.
