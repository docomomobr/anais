abstract: 'O presente artigo tem como objetivo analisar a obra da arquiteta Nícia
  Paes Bormann e sua inserção na arquitetura moderna produzida no Ceará. Tendo a maioria
  dos expoentes da produção moderna cearense se vinculado às escolas carioca e pernambucana
  em um primeiro momento ou à paulista numa segunda fase, Nícia parece ter seguido
  um caminho próprio, de extremo vínculo com o lugar e partindo de referências mais
  tradicionais ou mesmo vernaculares, ao mesmo tempo que estabelecendo aproximações
  com a arquitetura moderna produzida em outros países, como Alvar Aalto na Finlândia
  ou Fernando Távora em Portugal. O trabalho se estrutura a partir de três aspectos
  da obra da arquiteta: materialidade, estratégias formais e adequação ao clima. Como
  objeto de estudo, serão selecionadas quatro obras de variadas escalas e programas,
  a fim de atestar a análise de forma mais ampla e completa. Por fim, considera-se
  o trabalho como relevante para não apenas aprofundar no estudo da obra de Nícia
  e seus rebatimentos na arquitetura contemporânea no Ceará, mas para, também, ampliar,
  o conhecimento de trajetórias de mulheres arquitetas, que continuam, em muitos casos,
  ausentes da historiografia arquitetônica.'
keyword: arquitetura moderna; arquitetura moderna no Ceará; Nícia Paes Bormann
