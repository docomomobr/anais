abstract: O livro Vers une Architecture (1923) é um dos textos fundamentais da arquitetura
  moderna do século XX. Trata-se de um manifesto em que o autor, sob a alcunha de
  Le Corbusier-Saugnier, defende a criação de uma arquitetura e um urbanismo que refletissem
  o esprit nouveau emergente naquele período, marcado pela consolidação do discurso
  médico. À vista disso, este ensaio propõe uma revisão historiográfica que fornece
  base para examinar valores socioculturais europeus modernos, historicamente condicionados,
  que se relacionam com a arquitetura e o urbanismo. Especificamente, objetivou-se
  analisar Vers une Architecture a fim de identificar correlações entre as recomendações
  de Le Corbusier, o discurso médico e o movimento da higiene. Para tal propósito,
  foi realizada a análise do conteúdo de dez trechos do livro que fariam alusão a
  esse discurso, procedimento complementado pela utilização da ferramenta Voyant Tools.
  Verificou-se que o movimento da higiene objetivava aperfeiçoar a saúde física das
  populações urbanas europeias e que, para Le Corbusier, era necessária a criação
  de cidades higiênicas e ordenadas, as quais trariam como consequência a saúde às
  populações, concluindo-se que o aquele discurso, legitimado pela ciência moderna,
  se manifesta no texto de modo latente, sintoma reforçado pela predominância dos
  termos casa, saudável, saúde e cidades nos trechos analisados.
