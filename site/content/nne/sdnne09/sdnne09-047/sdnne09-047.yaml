abstract: Tem como objeto de pesquisa obras selecionadas da artista brasileira Tarsila
  do Amaral em sua fase Pau- Brasil (1924-1928) que abordam cenas da paisagem rural
  edificada de Minas Gerais. Aborda a relação existente entre arte e arquitetura,
  tendo como hipótese que as obras da artista podem nos permitir uma relação de suas
  representações de pintura de paisagem com os contextos sociais, políticos, construtivos
  e arquitetônicos de sua época de produção. Objetiva compreender os entrelaçamentos
  de suas obras com tais contextos, ao passo que estabelece paralelos entre a arte
  e realidades construtivas, convergindo a arquitetura e cultura artística brasileira.
  O norte metodológico advém da didática desenvolvida por Fayga Ostrower em seu livro
  Universos da Arte (2013), partindo da premissa de como a vivência e contexto que
  o artista se insere reflete em sua obra. Em Tarsila é possível observar essa relação
  e identificar como suas representações comunicam a história arquitetônica e construtiva
  do local retratado, aqui enfatizando a paisagem rural de Minas Gerais.
