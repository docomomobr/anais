abstract: 'O artigo realiza uma análise sobre a produção arquitetônica do arquiteto
  baiano José Bina Fonyat Filho a partir da seleção de três projetos de sua autoria:
  Edifício Banco do Brasil, Edifício Barão de Itapuã e Teatro Castro Alves. Seu objetivo
  é destacar as suas soluções arquitetônicas e sua relação com os respectivos contextos.
  Tem-se como hipótese que, com o seu olhar apurado, o arquiteto consegue estabelecer
  um diálogo cuidadoso com tais contextos. A escolha dos exemplares se deu, de início,
  pela procura de edifícios com tipologias diferenciadas entre si, implantados em
  áreas distintas de Salvador. Dessa forma, conseguimos exprimir diferentes caminhos
  trilhados por Fonyat, ao trabalhar com diferentes tipologias, em distintos contextos.
  Enquanto método para realizar as análises de tais edifícios, tomou-se como base
  as fichas mínimas difundidas pelo Docomomo Internacional, que são eficazes em abordar
  as principais características arquitetônicas dos edifícios modernos. Assim, o artigo
  inicialmente apresenta o arquiteto, a seguir descreve e analisa os três projetos
  selecionados e suas relações contextuais e, finalmente, traça algumas considerações
  finais que confirmam as hipóteses assinaladas.'
keyword: arquitetura moderna; Salvador; Bina Fonyat; contextos
