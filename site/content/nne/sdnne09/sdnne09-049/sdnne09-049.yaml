abstract: 'Este artigo trata das duas experiências da arquiteta ítalo-brasileira Lina
  Bo com a cultura baiana e nordestina em dois momentos distintos, o que nomeamos
  as duas encruzilhadas de Salvador: a primeira delas, que se deu entre os anos de
  1958 e 1964 e, a segunda, entre os anos de 1986 e 1989. Ele objetiva, de certo modo,
  demonstrar como a proposta arquitetônico-urbana realizada na segunda estada da arquiteta
  na cidade de Salvador é tributária das investigações realizadas mais de vinte anos
  antes, quando de seu primeiro contato com a cidade que experimentava, de modo abrangente,
  um alargamento daquilo que se entendia como cultura. Ali, se realizara uma grande
  troca intercultural, um certo “giro epistemológico” ou a “inversão do quadro europeu”
  com a inclusão de outras práticas e saberes, tais como as perspectivas ameríndias
  e, sobretudo, afro-brasileiras (tão características daquele território), para além
  daquelas consagradas pelo cânone ocidental moderno. Assumindo, ainda, o prosaico,
  a vida do homem comum como fontes de energia criativa Lina Bo irá consolidar e radicalizar
  já na sua primeira “encruzilhada” um modo particular de pensar o campo da arquitetura
  em articulação com as dimensões sócio-antropólógicas, o que iremos denominar poética
  da encruzilhada. Do primeiro momento, buscaremos, então, compreender como a contextura
  da cidade baiana, um projeto verdadeiramente coletivo, de pesquisa aprofundada da
  realidade brasileira, desdobrou-se em Lina Bo como um modo-de-pensar-mundo materializado
  em sua experiência com o MAMB (Museu de Arte Moderna da Bahia). Já do segundo momento
  de sua estada, iremos esmiuçar como essa visão-de-mundo inscreveu-se de modo contundente
  na matéria de suas arquiteturas.'
