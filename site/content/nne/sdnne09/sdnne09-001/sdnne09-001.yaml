abstract: A cidade de São Luís passou por diversas transformações, marcadas pela elaboração
  de planos que objetivavam favorecer seu crescimento e mitigar os problemas já existentes
  no espaço urbano, elaborados por corpo técnico capacitado, que por diversas questões
  políticas e sociais fora excluído da memória coletiva da história da cidade. Portanto,
  este trabalho tem o intuito de efetuar o resgate à memória do engenheiro Domingos
  de Freitas Diniz Neto, abordando sua atuação enquanto urbanista, após formar-se
  na Escola Nacional de Engenharia do Brasil, quando retorna ao Maranhão e desempenha
  importante atuação à frente de diversos cargos públicos, estudando, planejando e
  implantando diversas soluções que geraram impactos significativos na configuração
  do espaço urbano contemporâneo da cidade, de modo a consolidar tendências de crescimento,
  através da promulgação do Plano Rodoviário do Estado do Maranhão (1965), com o estudo,
  análise e adaptações do Plano de Expansão da Cidade de São Luís (1958), proposto
  pelo engenheiro Ruy Mesquita.
keyword: planejamento urbano; tendências de crescimento; espaço urbano; cidade moderna
