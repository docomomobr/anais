abstract: Os edifícios de transporte abarcam conceitos utilizados quando são concebidos
  em seus projetos, como as linhas de pensamento que delineiam seus espaços, circulações,
  materiais empregados, cores utilizadas e o pensamento de uma época. Entramos e saímos
  de aeroportos, estações ferroviárias e rodoviárias e nem sempre visualizamos tudo
  o que aqueles ambientes expressam ou mesmo os contextos daquela ocasião, materiais
  preferidos, detalhes arquitetônicos, possibilidades tecnológicas que estavam disponíveis.
  O Terminal Internacional de Passageiros do Aeroporto Schiphol, em Amsterdam, na
  Holanda, projetado em um consórcio, na década de 1960, cujo coordenador era o arquiteto
  holandês Marius Duintjer, expressa as linhas retas, a funcionalidade, a transparência,
  essências de um arquiteto que trabalhou no escritório de Le Corbusier, foi influenciado
  por Frank Lloyd Wright e pela arquitetura japonesa e projetou uma variedade de edificações
  no território holandês. O projeto modernista versátil de Schiphol se ajustou aos
  desenvolvimentos tecnológicos que se sucederam desde a sua concepção, sendo uma
  referência em projetos aeroportuários, pela sua complexidade junto à boa operacionalidade
  no transporte de passageiros.
keyword: Arquitetura de Aeroportos; Arquitetura Moderna; Arquitetura Holandesa
