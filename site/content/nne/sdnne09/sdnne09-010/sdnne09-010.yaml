abstract: O presente artigo ocupa-se das particularidades arquitetônicas do edifício-sede
  da antiga Escola Industrial de Cuiabá, atual Instituto Federal de Mato Grosso (IFMT),
  projetado no início dos anos 1950, que fazem dele um marco na história de modernização
  da região central do país. As análises se concentram, inicialmente, sobre as características
  do seu projeto original, elaborado no Rio de Janeiro pelo Setor de Estudos e Projetos
  do Ministério da Educação, destacando-se suas inovações em relação aos padrões construtivos
  então vigentes no centro-oeste brasileiro. Busca-se também relacionar sua arquitetura
  com a de outras escolas técnicas construídas do período, como a de Maceió e a de
  Natal. Comparando suas soluções tipológicas e de implantação, suas estratégias de
  setorização e circulação, pôde-se demonstrar a versatilidade da linguagem modernista
  que os une, expressa na tensão derivada da adaptação de soluções tipificadas à realidade
  urbana e geográfica de cada local, com destaque para as condicionantes do clima,
  do programa e do terreno. Com o objetivo de ilustrar a dinâmica de intervenções
  que ameaçam a unidade arquitetônica dessas obras, adota-se o histórico de reformas
  do atual IFMT, como estudo de caso.
