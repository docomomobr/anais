abstract: Este trabalho faz uma investigação sobre a ausência historiográfica da produção
  feminina na arquitetura e contribui para dar visibilidade à atuação da arquiteta
  cearense Nélia Romero. Sua prática no setor público e as contribuições de suas obras
  para o cenário do movimento moderno no Ceará corroboram para reivindicar essa memória
  feminina na história da arquitetura no Ceará e rever o apagamento das arquitetas
  na historiografia cearense. A análise de sua carreira profissional e de seus projetos
  edificados atestam a importância de sua atuação e a necessidade deste resgate, de
  modo a suprir o vazio historiográfico atribuído à pouca valorização das mulheres.
  Este artigo analisa, com forma inédita, algumas de suas principais obras, e contribui
  para a valorização de uma arquiteta que fez parte da construção do movimento moderno
  Cearense.
keyword: Mulheres arquitetas; Nélia Romero; Arquitetura cearense
