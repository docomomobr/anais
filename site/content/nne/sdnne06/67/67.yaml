abstract: Este artigo pretende apresentar o estado da arte da pesquisa relacionada
  com o tema do desenho de azulejos empregados no revestimento de fachadas de edifícios
  durante o período da modernidade arquitetônica nacional; Para tanto, utilizou como
  estudo de caso específico, a obra desenvolvida pelo arquiteto português Delfim Amorim
  (1930-1972), erradicado no Brasil, na cidade do Recife, durante as décadas de 50
  a 70, e que desenvolveu na cidade, uma série de projetos arquitetônicos que possuíam
  como marca, o revestimento de azulejos com desenhos exclusivos para cada uma de
  suas obras. Dessa maneira, a pesquisa que vem sendo desenvolvida no programa de
  pós graduação em Design da UFCG, pretende realizar um debate que envolva a transciplinaridade
  entre os campos do design, arquitetura, e arte, trazendo à tona, resultados dessa
  investigação, que resgata o acervo patrimonial do design de revestimentos e acabamentos
  de obras arquitetônicas importantes no cenário brasileiro.
