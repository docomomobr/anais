abstract: O trabalho analisará sobre a arquitetura de elementos modernistas e seu
  diálogo com o entorno arquitetônico mais imediato. A pesquisa será desenvolvida
  por meio da análise arquitetônica do edifício do Ministério da Fazenda, localizado
  no Largo do Amparo, cuja edificação data da década de 1970 e que teve na sua conclusão
  um projeto de autoria do arquiteto e urbanista Antônio Luiz Dutra de Araújo – radicado
  em Teresina desde 1968 –, trazendo apontamentos sobre o vínculo da edificação com
  a paisagem urbana pertencente à Praça Marechal Deodoro da Fonseca, também conhecida
  como 'Praça da Bandeira'. A pesquisa divide-se em duas abordagens. A primeira pretende
  discorrer sobre a influência da arquitetura de estilo modernista na cidade de Teresina,
  tendo como objeto o edifício do Ministério da Fazenda, identificando e analisando
  seus elementos arquitetônicos, num contexto histórico da cidade e da própria edificação,
  e evidenciando o trabalho do arquiteto autor como grande influência na expressão
  desse tipo de arquitetura na cidade. A segunda abordagem analisará a edificação
  e seu entorno imediato, objetivando compreender de que maneira o monumento está
  relacionado com a arquitetura do seu entorno, bem como os principais aspectos relacionados
  a essa temática, como as noções de ambiência e visibilidade. Desse modo, a pesquisa
  a ser apresentada neste artigo visa ao melhor entendimento da forma como o moderno
  relaciona-se com outros estilos arquitetônicos anteriores, e sobre o ato do 'construir
  no construído', a partir da verificação do modo como as edificações hodiernas podem
  estar inseridas num contexto histórico e coexistir harmoniosamente com a arquitetura
  antiga ali existente.
keyword: Arquitetura modernista; entorno arquitetônico; paisagem urbana
