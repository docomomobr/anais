abstract: 'O artigo a ser apresentado abordará a relação existente entre arquitetura
  e estrutura durante a produção de obras modernas, utilizando como objeto de estudo,
  dois estádios de futebol projetados pelo arquiteto mineiro Raul de Lagos Cirne:
  o Estádio Governador Alberto Tavares Silva (1970-1973), conhecido como “Albertão”
  construído em Teresina, capital do Piauí; e o Estádio Ernani Sátyro (1973-1975),
  popularmente chamado de “Amigão”, construído na cidade de Campina Grande, agreste
  paraibano. As obras a serem analisadas se caracterizam pelo diálogo entre concepções
  arquitetônica e estrutural, nas quais se observa que Cirne procurou unir criatividade
  e tecnologia, denotando uma forte influência da obra do engenheiro e arquiteto estrutural
  de renome no panorama internacional- Pier Luigi Nervi- que utilizou nos anos 50,
  na Itália, principalmente a técnica do concreto armado, estando sempre atento à
  relação estrutura/ forma. A materialidade do concreto armado foi adotada nesses
  dois estádios, em soluções arquitetônicas que tiraram partido da estrutura para
  conceber a forma moderna. As principias etapas do processo construtivo, que segundo
  RIPPER (1998) são: concepção e projeto; seleção e emprego dos materiais; execução;
  utilização; manutenção e outras- serão analisadas, se apoiando em um referencial
  teórico voltado para as discussões sobre arquitetura moderna, tectônica, concepção
  estrutural, materialidade.'
