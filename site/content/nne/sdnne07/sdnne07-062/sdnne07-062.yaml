abstract: Este artigo tem por objetivo evidenciar a importância dos arquitetos pioneiros
  de Roraima, que foram responsáveis pela consolidação da estrutura dos órgãos técnicos
  no surgimento do Estado e que contribuíram para a imagem da arquitetura local, entre
  o final da década de 1980 e ao longo da década de 1990. Inseridos num segundo momento
  de influxo desenvolvimentista, estes arquitetos se destacaram pela coordenação e
  autoria de obras modernas que serviram de alicerce infraestrutural e arranque para
  o desenvolvimento socioeconômico roraimense, especialmente na década de 1990, com
  destaque às obras arquitetônicas dos edifícios institucionais, que constituiram
  um conjunto arquitetônico simbólico para a capital. A necessidade desse registro
  deve-se à escassez de documentação histórica desse período importante, sendo necessário
  o registro dessas contribuições, cujas fontes foram pesquisas bibliográficas e análises
  documentais, como entrevistas com os profissionais da época e registros fotográficos.
  Desse modo, o trabalho visa destacar como se deu o processo da Arquitetura Moderna
  tardia em Roraima nesse período, assim como o papel dos arquitetos dos órgãos públicos
  de infraestrutura como precursores na construção e consolidação do, então, novo
  estado brasileiro.
