abstract: A arquitetura moderna privada em Belém foi incentivada por legislações municipais
  nos anos 1940 e 1950 que permitiram a construção de edifícios de mais de dez pavimentos
  na cidade. Essas mudanças na forma de morar estão também presentes nas residências
  unifamiliares, destacando a arquitetura produzida por profissionais como Camilo
  Porto de Oliveira, Laurindo Amorim, entre outros. O artigo estuda as residências
  que apresentam elementos apropriados de exemplares desta arquitetura local, e de
  obras produzidas fora de Belém. Os estudos destas residências foi inicialmente realizado
  a partir do mapeamento, identificação e fotografias de um conjunto de casas, e posteriormente
  objetos de seleção tendo como parâmetro a re-apropriação, revisão e replicação (LARA,
  2005) da estética da arquitetura moderna na cidade de Belém. Desta maneira, identificaram-se
  os elementos modernos mais presentes nas fachadas e mapeamento das áreas onde se
  observam a ocorrência desses exemplares. A partir da identificação das variadas
  tipologias residenciais, constatou-se preliminarmente, que estas se constituíram-se
  de acordo com as aspirações estéticas dos grupos sociais que as produziram. Deste
  modo, reafirma-se a modernidade como um ethos cultural (GORELIK, 2003) na qual modos
  de vida, história e cultura assumem, na apropriação das formas das novas residências,
  o anseio de materialização de uma “nova” cidade moderna.
