abstract: 'O artigo que se pretende apresentar, com o título “Campina, Imagem E História:
  O Caso Dos Postais”, possui como objeto de estudo, um conjunto de três cartões-postais,
  coletados em um acervo particular mais extenso, pertencente ao Sr. Sérgio Ricardo
  Marcelino de Oliveira, e que deram origem a uma análise arquitetônica e urbanística,
  com enfoque patrimonial, das relações que permeiam a arquitetura, a cidade e a fotografia,
  na cidade de Campina Grande, no agreste da Paraíba, durante os anos 60 e 70 do século
  XX. O trabalho vem sendo desenvolvido por integrantes do grupo de pesquisa Arquitetura
  e Lugar (GRUPAL), vinculado ao Curso de Arquitetura e Urbanismo da UFCG e cadastrado
  no CNPq. O trabalho se encaixa no eixo temático “Modernidade, Lugar e Ambiente”.
  Justifica-se pelo ineditismo do tema abordado em estudos sobre a arquitetura e a
  cidade, além de denunciar a necessidade imediata de se debater a questão patrimonial
  moderna em Campina Grande, que anda sofrendo perdas irreparáveis em suas arquiteturas,
  que são descaracterizadas e demolidas. Dessa maneira, o trabalho se propõe a contrastar
  as distintas realidades de épocas - um passado orientado por um progresso moderno,
  presente nas imagens da cidade que se desenvolvia e modernizava, e um presente de
  descaracterizações e perdas - que desrespeita a história, e a memória dos espaços
  urbanos e suas arquiteturas.'
keyword: Arquitetura Moderna; Cartografia; Conservação do Patrimônio
