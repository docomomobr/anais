abstract: Este artigo é parte de uma pesquisa mais ampla sobre a invisibilidade das
  mulheres na arquitetura, enfocando de modo particular a arquiteta Nícia Paes Bormann,
  com o intuito de ressaltar o valor e a significância desta protagonista na história
  do modernismo cearense. Nícia Bormann teve uma atuação relevante como docente, arquiteta
  e urbanista, paisagista e artista plástica, ainda que as questões de gênero tenham,
  supostamente, ofuscado seu nome diante das atividades que desenvolveu. Neste contexto,
  o estudo tem como objetivo analisar as diferentes fases da sua trajetória profissional,
  que se divide em quatro períodos, desde o início da sua formação profissional até
  o momento atual. Na pesquisa, pretende-se evidenciar suas influências, referências
  e dificuldades em um contexto de hegemonia masculina, buscando, dessa forma, rever
  o papel feminino no âmbito da arquitetura moderna do Ceará. A relevância do artigo
  se afirma na necessidade da compreensão de uma visão distinta para a historiografia
  da arquitetura cearense. A metodologia será pautada, inicialmente, na revisão bibliográfica
  sobre o tema, assim como no levantamento de dados alcançados por meio de entrevistas
  e de pesquisas documentais.
keyword: Arquitetura Moderna; Trajetória; Nícia Paes Bormann; Gênero; Feminismo
