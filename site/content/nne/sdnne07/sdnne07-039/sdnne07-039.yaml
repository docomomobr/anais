abstract: 'A Lei de Assistência Técnica à Habitação de Interesse Social (ATHIS) tem
  por objetivo democratizar o serviço do profissional técnico qualificado para a manutenção
  e ou construção de habitação de interesse social. Sua existência ratifica o artigo
  6º da Constituição Federal de 1988, que descreve o acesso à moradia em face aos
  direitos sociais. Neste sentido, o projeto de extensão denominado “Habitação no
  Centro Histórico: assistência técnica para proprietários de residências na área
  central de João Pessoa” visa investigar em nível acadêmico, os benefícios da referida
  lei. Para tal finalidade, foi escolhido como objeto de estudo, e ensaio de aplicabilidade
  da referida lei, o edifício Presidente João Pessoa (1957) – popularmente conhecido
  como “18 andares”. Entende-se que, como o instrumento está em fase experimental,
  este se apresenta como possível ampliação das competências dos arquitetos e urbanistas
  no âmbito da reforma e construção. Este trabalho também se dispõe a potencializar
  as discussões em torno do déficit de moradia atrelados a eficiência técnica, na
  busca de uma possível fixação de famílias nos centros históricos providos de infraestrutura
  e serviços. Assim, buscou-se analisar a aplicabilidade da lei de assistência em
  edificações multifamiliares em altura, apontando as potencialidades e limitações
  desta, quando empregada em um bem tombado pelas instâncias federativas.'
