abstract: O presente trabalho estuda o processo de desenvolvimento dinâmico da Faculdade
  de Tecnologia da Universidade Federal do Amazonas, a fim de compreender como as
  mudanças ocorridas durante sua expansão afetaram valores patrimoniais importantes
  atribuídos aos edifícios originais de Severiano Mário Porto. Para que esta compreensão
  seja efetivada, faz-se necessário relacionar inicialmente sustentabilidade à Arquitetura
  Moderna, onde em um primeiro momento se discute suas características gerais até
  chegar ao trabalho realizado pelo arquiteto no Amazonas, destacando a Faculdade
  de Tecnologia como objeto de estudo. A seguir, a pesquisa analisa primeiramente
  cada etapa do desenvolvimento de maneira individual, buscando identificar aspectos
  arquitetônicos sustentáveis e preservacionistas relacionados ao Movimento Moderno
  na Amazônia. Em segundo lugar, destacam-se as mudanças sofridas nos edifícios para
  então apresentar o objeto de estudo nos dias de hoje o comparando ao original e
  identificando significativas perdas. Finalmente são apresentadas as conclusões,
  onde os dados obtidos durante a pesquisa por meio da análise descritiva são abordados,
  sendo também expostas as propostas de possíveis recursos a serem utilizados para
  que o crescimento da Universidade não afete características patrimoniais importantes.
keyword: Severiano Mário Porto; UFAM; Arquitetura Moderna; Patrimônio Moderno; Sustentabilidade
