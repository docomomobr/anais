abstract: A preservação do patrimônio moderno é um tema ainda pouco explorado no Brasil.
  A obsolescência de alguns dos edifícios deste período é cada vez mais constante
  e tem ocasionado intervenções que nem sempre respeitam os projetos originais, descaracterizando
  ou demolindo exemplares modernos significa- tivos. Partindo do entendimento de que
  as mudanças são necessárias para manter a natureza utilitária des- tas edificações,
  este trabalho tem como objetivo investigar os critérios específicos de intervenção
  no pa- trimônio moderno, a fim de refletir sobre alternativas de como realizar tais
  alterações com êxito e quali- dade. Para isto, será apresentado, inicialmente, um
  breve histórico sobre o estado atual da preservação do patrimônio moderno, justificando
  a importância da discussão. Em seguida, serão identificadas as princi- pais especificidades
  da intervenção em edifícios deste período, destacando como atributos de flexibilida-
  de presentes em boa parte dessa produção podem auxiliar nesse sentido. Por fim,
  será discutido como estas reflexões teóricas no âmbito da pesquisa podem repercutir
  em ações no ensino e prática projetuais.
keyword: Arquitetura moderna (CE); Preservação; Flexibilidade
