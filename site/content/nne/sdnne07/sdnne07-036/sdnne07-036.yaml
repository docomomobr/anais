abstract: 'O ponto principal que originou a cidade de Boa Vista está na margem do
  Rio Branco, e em sua composição paisagística atual destacam-se: o centro comercial,
  massa vegetal em predominância, algumas edificações e o acervo histórico em forma
  de patrimônio edificado. Da gênese da intervenção humana até o final do século XX,
  o uso e ocupação do solo da região caracterizava-se num porto para pequenas embarcações,
  balneários e comércio, criando conexão com a expansão da malha urbana. O governo
  municipal empreendeu diversas obras, a fim de modernizar a região. Então, em 2004
  foi inaugurando assim o monumento Orla Taumanan, dando uma nova roupagem, com oferta
  de serviços e produtos que antes não existiam. Este trabalho tem como objetivo descrever
  o processo evolutivo da paisagem da Orla Taumanan. Para tanto, será aplicado um
  estudo documental e bibliográfico. Percebe-se que a Orla Taumanan modificou a utilização
  do espaço, mas conseguiu preservar aspectos atrativos, principalmente pela relação
  cultural com os demais elementos do entorno. A criação da Orla Taumanan (re)utilizou-se
  do elemento principal: água, criando um contexto novo de olhar neste recorte da
  cidade, mas desconsiderou a sua principal função que é preserva´-la para as atuais
  e futuras gerações.'
keyword: Reutilização; Orla Taumanan; Boa Vista
