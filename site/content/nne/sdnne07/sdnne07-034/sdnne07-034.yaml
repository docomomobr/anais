abstract: 'O arquiteto Roberto Martins Castelo é um dos nomes de maior expressão da
  arquitetura moderna no Ceará. Apesar de não possuir uma produção de projetos tão
  extensa, algumas de suas obras são exemplares significativos da produção do período,
  como a Assembleia Legislativa do Ceará e o Instituto Médico Legal. Além de sua atuação
  na prática de projetos, Roberto também possui um intenso envolvimento com o ensino
  e, mais recentemente, com a produção escrita. Tendo em vista o desconhecimento desta
  última e reconhecendo seu valor como acervo de documentação da trajetória do arquiteto,
  o objetivo deste trabalho é analisar as principais reflexões teóricas trazidas por
  Roberto em seus textos, de forma a relacioná-los com os outros aspectos de sua atuação.
  Dessa maneira, será apresentado inicialmente um breve resumo da sua formação na
  UnB, de forma a contextualizar de onde partem suas principais convicções, além de
  uma breve descrição de sua atuação prática e docente, para, posteriormente, estruturar
  a análise de seu pensamento a partir de três eixos principais: ensino, formação
  social e sistemática teórica. Pretende-se, ao fim, mostrar a importância de sua
  formação em Brasília na consolidação de suas convicções e pensamento, apontando
  como estes estão presentes de forma coerente em sua atuação projetual, docente e
  escrita.'
keyword: Arquitetura moderna no Ceará; Roberto Castelo; Teoria do arquitetura
