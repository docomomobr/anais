abstract: 'O arquiteto alemão Alexander Buddeus já tinha obras importantes na Alemanha
  quando passou, como um cometa, pelo Brasil, na década de 30 do século passado. Fez
  alguns projetos no Rio de Janeiro, sendo descoberto por Lucio Costa e convocado
  por ele, em 1930, a ensinar na Escola Nacional de Belas Artes, durante a fracassada
  reforma do ensino de arquitetura. Mas foi na Bahia que Buddeus deixou as suas mais
  importantes obras realizadas em território brasileiro: o Instituto de Cacau da Bahia,
  de 1933, e o Instituto de Educação da Bahia, atual ICEIA, de 1936. Sobre este ultimo
  não foi possível documentar sua autoria. Mas o crítico de arte americano Philip
  L. Goodwin, em missão do MoMa de Nova Iorque de reconhecimento da nascente arquitetura
  moderna brasileira, em 1943, ressalta o caráter marcadamente alemão dessa obra e
  diz que seu autor é a um arquiteto brasileiro formado na Alemanha, atribuindo, equivocadamente,
  ao alemão cidadania brasileira. Depois disso, se perde por completo o paradeiro
  de Buddeus. Documento recentemente descoberto pelo autor revela a saga do arquiteto
  depois de retornar a Alemanha em 1938 e seu desejo, em vão, de retornar ao "país
  de seu coração", após a tragédia da II Grande Guerra. Esta comunicação não só reconstrói
  a trajetória desse importante arquiteto, como procura seguir o rastro de luz deixado
  por sua passagem no céu da Bahia.'
keyword: Alexander Buddeüs; Modern Architecture in Brazil; City of Salvador-Bahia
