abstract: 'Este estudo trata da relação entre arquitetura e lugar. Enfoca o estudo
  de caso do Hotel Tambaú, projetado por Sérgio Bernardes e localizado em João Pessoa.
  Analisa como esse exemplar da arquitetura moderna pessoense se relaciona com as
  peculiaridades do local, por meio de três eixos de investigação: a inserção na paisagem,
  a adequação ao ambiente urbano e a relação entre as soluções construtivas e as características
  locais. Realiza pesquisa teórica, baseada em documentos compreendidos entre 1966
  – o início do projeto – e 1971 - a inauguração. Constata a integração a paisagem,
  a redução de sua monumentalidade e a associação entre usos público e privado.'
