abstract: Pensar no Plano Piloto de Brasília é pensar também nos projetos de infraestruturas
  que constroem sua forma. A proposta vencedora de Lucio Costa do concurso, em 1957,
  tinha no uso intenso das técnicas rodoviárias o seu caráter inequívoco. Desde o
  início, a implantação de um potente sistema rodoviário definia o próprio Plano Piloto,
  ao mesmo tempo em que se articula com um sistema de vias, estradas e rodovias, integrando
  a nova capital ao território nacional. Também em março de 1957, é criada Rede Ferroviária
  Federal S.A. – RFFSA, que passaria a realizar ações de estatização e controle federal
  de redes ferroviárias já implantadas, unificando sua gestão, numa empresa pública
  de capital aberto. Simultaneamente, o Governo Federal incentiva a indústria automobilística,
  dinamizando a implantação dos meios de transporte como infraestrutura nacional,
  substituindo o transporte ferroviário pelo rodoviário. Para este sistema rodoviário
  funcionar, operar e promover toda sorte de deslocamentos e viagens, além do transporte
  de cargas brutas ou produtos industriais, ele precisa ser dotado de equipamentos
  e serviços, incluindo os postos de gasolina. A abordagem da etapa inaugural da construção
  de Brasília trata da arquitetura do Plano Piloto e dos desafios técnicos e estéticos
  da arquitetura dos palácios, ministérios, das primeiras superquadras, do Hospital
  de Base e da Plataforma rodoviária. Mas as construções de caráter provisório, incluindo
  arquitetura de madeira como Catetinho, hospedarias, agências bancárias e vilas operárias,
  são preteridas, embora sejam frequentemente publicadas nas revistas. A edição comemorativa
  da revista Brasília (1961) reapresenta o posto, recobrando sua importância pioneira.
  A edição especial da revista Arquitetura e Engenharia (1960), traz um texto de apresentação
  que comenta as plantas e fotografias de todo o conjunto arquitetônico, destacando
  justamente as qualidades plásticas decorrentes de sua con cepção estrutural. Já
  a edição comemorativa de Brasília da Acrópole (1960) traz o icônico mapa das distâncias,
  além de mapas com a ampliação do sistema rodoviário. Na Manchete, uma revista não
  especializada, as pesquisas não encontraram o posto publicado, mas as obras de infraestrutura
  sempre foram pauta da estratégia editorial.
