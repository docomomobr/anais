abstract: 'Este trabalho propõe uma leitura do complexo habitacional Torres del Parque
  (1963-1970), projetado por Rogelio Salmona em Bogotá, tendo a paisagem como categoria
  teórico-metodológica de investigação e com foco na dimensão infraestrutural da arquitetura.
  Consideramos a arquitetura como um ato de produção de paisagens, no qual sistemas
  de infraestrutura, conhecimento técnico e significação cultural interagem para viabilizar
  a habitação humana em meio à natureza. Salmona rompe com o racionalismo modernista
  ao incorporar referências vernaculares e pré-colombianas, valorizando materiais
  e soluções construtivas locais. As torres, ao mesmo tempo em que ocupam um vazio
  urbano, integram-se à cidade por meio de redes de infraestrutura, consolidando o
  Centro Internacional de Bogotá. Ao investigar a dimensão infraestrutural da arquitetura,
  o artigo discute como as Torres del Parque estruturam a paisagem de Bogotá, não
  apenas como um marco morfológico, mas como dispositivo de acolhimento e transformação
  urbana. A interpretação do complexo baseia-se nas categorias propostas por Santos
  (1985) acerca dos estudos da paisagem: forma, estrutura, usos e dinâmicas. Através
  delas, o texto explora como Salmona, um arquiteto influenciado pelo modernismo,
  mas profundamente conectado à cultura colombiana, cria uma obra que dialoga com
  a paisagem, a cultura e o contexto urbano de Bogotá. Destacamos a importância de
  compreender a arquitetura como uma prática cultural que expressa e produz paisagens,
  moldando visões de mundo e possibilitando novas experiências no espaço vivido. Buscamos,
  portanto, revelar as camadas de significado e as lógicas que ancoram a obra em seu
  contexto, enfatizando a dimensão infraestrutural como um elemento central na produção
  da paisagem arquitetônica.'
