abstract: O Auditório Araújo Vianna, importante equipamento público de infraestrutura
  cultural localizado na cidade de Porto Alegre, foi idealizado na década de 1950
  e inaugurado em março de 1964. Projetado e executado pelos arquitetos Carlos Maximiliano
  Fayet e Moacyr Moojen Marques — à época funcionários da Divisão de Urbanismo da
  Secretaria de Obras da Prefeitura —, o espaço foi concebido como extensão do Parque
  da Redenção, substituindo o antigo auditório da Praça da Matriz e servindo inicialmente
  como sede da Banda Municipal de Porto Alegre. Seu conceito original, de auditório
  ao ar livre, integrava-se ao parque e permitia ao público desfrutar dos espetáculos
  em contato direto com a natureza (Figura 1). Ao longo dos anos, o Auditório Araújo
  Vianna tornou-se palco de importantes apresentações de música popular brasileira
  e rock, consolidando-se como um marco cultural da cidade. Em 1997, o Parque da Redenção
  foi tombado como patrimônio histórico, o que garantiu também a preservação do auditório.
  Entretanto, a ausência de cobertura e a consequente exposição às intempéries reacenderam
  discussões sobre a necessidade de instalação de um teto. A primeira proposta nesse
  sentido surgiu em 1976, quando foram estudadas doze alternativas. A solução escolhida
  pelos arquitetos responsáveis pelo projeto original previa uma treliça espacial
  de alumínio revestida externamente por chapas planas do mesmo material, mas a proposta
  não foi executada à época. Na década de 1990, como adaptação ao orçamento público,
  foi proposta a primeira revitalização do auditório, com a instalação de uma cobertura
  de lona tensionada (Figura 2). Desde o início, os arquitetos autores do projeto
  original manifestaram-se contrários a essa solução, alertando que o material não
  atenderia aos requisitos acústicos e de durabilidade necessários.
