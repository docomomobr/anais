abstract: 'O balanço das inundações ocorridas em 2024 no Rio Grande do Sul (RS) apresenta
  dados impressionantes: segundo a Defesa Civil gaúcha (Rio Grande do Sul, 2024),
  mais de dois milhões de pessoas foram afetadas no Estado, resultando em 173 óbitos
  e 38 desaparecidos em 478 municípios. Na Região Metropolitana de Porto Alegre, o
  levantamento do Governo do Estado (SPGG, DEE, DEPLAN, 2024) contabilizou 594.964
  pessoas impactadas, seja por alagamento, inundação, enxurrada ou deslizamento, com
  destaque para os municípios de Canoas (157.829 pessoas atingidas), Porto Alegre
  (125.274 pessoas) e São Leopoldo (90.371 pessoas). Em Porto Alegre (SMAMUS, 2024),
  os bairros com maior número de famílias prejudicadas foram: Sarandi, Farrapos, Menino
  Deus, Floresta, Ponta Grossa, Humaitá, Cidade Baixa e Centro Histórico, além do
  Bairro Arquipélago, que possui uma condição geográfica ambiental particular. O Bairro
  Arquipélago ocupa as ilhas do Delta do Jacuí, um conjunto hidrográfico composto
  por dezesseis ilhas, canais, pântanos e charcos situados ao norte do Lago Guaíba.
  O Lago Guaíba é o corpo d’água para onde afluem e desaguam os rios Jacuí, Caí, Sinos
  e Gravataí, rios que atravessam uma ampla bacia hidrográfica que abrange quase um
  terço do Estado do RS. É nessa condição geográfica e ambiental que está localizada
  Porto Alegre. Os desafios do presente sugerem o olhar para o passado da cidade,
  principalmente para as soluções de construção de bairros e sua proteção contra cheias.
  Uma delas foi o Plano Piloto do Delta do Jacuí, publicado em 1958, por Paiva, Fayet,
  Veronese e Marques. A equipe de arquitetos baseou seu plano em relatório técnico
  elaborado pela Neyrpic, empresa francesa sediada em Grenoble. A Neyrpic iniciou
  suas operações como fabricante de turbinas hidráulicas em 1917, e seu nome é oriundo
  das iniciais dos sócios Neyret e Piccard. Em 1923 a empresa criou um laboratório
  de testes e ensaios em escala reduzida, o Laboratoire Dauphinois D’Hydraulique,
  que viria a se tornar referência no assunto, prestando serviços para diversos países.
  Na década de 1960 a empresa foi adquirida pelo grupo Astholm e mais tarde pela General
  Electric. No Brasil, as realizações da Neyrpic na década de 1950 estão predominantemente
  ligadas a projetos e estudos para portos e ao fornecimento de equipamentos para
  usinas hidrelétricas de pequeno e médio porte. O Plano para o Delta do Jacuí já
  foi discutido por Marques (2012, 2019) e Rovati (2001).'
