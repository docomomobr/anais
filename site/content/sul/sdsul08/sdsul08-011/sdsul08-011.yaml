abstract: Este artigo analisa a cheia de 1936 em Porto Alegre, um evento significativo,
  porém pouco explorado, que antecipava questões sistemáticas e sociais evidenciadas
  na enchente de 2024. A partir de uma abordagem historiográfica, baseada em fontes
  documentais e bibliográficas, incluindo reportagens dos jornais Correio do Povo
  e Diário de Notícias, o estudo investiga os impactos da inundação de 1936, com ênfase
  na vulnerabilidade das áreas mais baixas da cidade e na insuficiência das intervenções
  do poder público diante da crise. O eixo da análise recai sobre a proposta elaborada
  pelo engenheiro Ferrucio Targa, divulgada inicialmente em 1928 na revista Egatea
  e resgatada pela imprensa local durante a enchente de 1936, em um contexto de agravamento
  das vulnerabilidades urbanas.Targa propunha intervenções preventivas e estruturais
  para mitigar os efeitos das cheias na bacia do Guaíba, como a criação de canais
  auxiliares de drenagem, a construção de lagoas de retenção, o reflorestamento das
  nascentes e a implantação de barreiras físicas e hidráulicas. Embora tecnicamente
  fundamentada, a proposta foi ignorada, revelando um padrão histórico de omissão.
  Além disso, a ausência de ações preventivas ao longo do século XX contribuiu para
  a fragilidade do sistema implantado décadas depois, entre os anos 1960 e 1970, que
  falhou frente à catástrofe de 2024. Nesse contexto, o artigo propõe a releitura
  crítica de projetos passados como base para estratégias mais eficazes e sustentáveis
  diante dos atuais desafios climáticos.
