abstract: 'O balneário de Leça da Palmeira pertence ao município de Matosinhos, região
  do Porto, Portugal, e abriga uma das principais obras do arquiteto Álvaro Siza:
  as Piscinas das Marés (iniciada em 1961). A Câmara Municipal de Matosinhos encomendara
  (final dos anos 1950) à uma construtora local um estudo para um tanque de água salgada
  destinado a banhos; a construtora decidiu contratar um arquiteto – Álvaro Siza -
  devido ao grande impacto que o empreendimento poderia causar na paisagem. Concluído
  em 1973, o complexo das marés foi implantado entre a avenida costeira e o oceano
  Atlântico, na depressão de um maciço granítico, paralelo e em cota inferior à via,
  o que manteve o horizonte sem bloqueios, possibilitando que a água do mar invada
  os tanques, livremente. Tal estratégia também possibilitou um mundo à parte a ser
  usufruído pelos veranistas. É marcante a valorização dos elementos ambientais devido
  à interação entre ambiente natural e ambiente construído. A obra integra uma fase
  de transição da arquitetura portuguesa, momento de avanço de um sistema construtivo
  tradicional rumo a um sistema de base industrial, e Álvaro Siza apontou caminhos
  para arquitetos de sua própria geração. As Piscinas das Marés constituem uma obra
  em que a artisticidade (relação tátil entre matéria e espaço) atinge um nível elevado,
  sendo exemplar o entrosamento entre sítio e materialidade, entre barreiras e permeabilidades,
  entre percursos, luminosidade e formas. Para além dessa obra, arquiteto manifestou
  capacidade em manter-se liberto de escolas formais, numa expressão própria embasada
  em correntes do Movimento Moderno. A obra foi classificada como Monumento Nacional
  de Portugal (2011) e é Patrimônio Mundial da UNESCO (2017).'
