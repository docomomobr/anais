abstract: O ano de 2024 marcou o Rio Grande do Sul como um dos mais trágicos de sua
  história. Eventos climáticos extremos, negligência na manutenção de equipamentos
  e desvalorização da ciência resultaram em enchentes devastadoras que afetaram 478
  dos 497 municípios gaúchos, causando 183 mortes, 27 desaparecimentos e deixando
  600 mil desabrigados. Porto Alegre, capital do estado, foi duramente impactada,
  com 46 dos 81 bairros inundados. Segundo especialistas (PESQUISA FAPESP 341, p.
  47), a tragédia foi agravada pela falta de manutenção no sistema de defesa contra
  cheias, construído nos anos 1970 pelo Departamento Nacional de Obras e Saneamento
  (DNOS). Esse contexto evidenciou a importância de um urbanismo voltado para a resiliência
  em áreas vulneráveis. Nesta esteira, o trabalho propõe a análise de projetos históricos
  elaborados para a região da Várzea do Gravataí, severamente afetada pelas enchentes
  de 2024 e atualmente integrada aos bairros Farrapos, Humaitá e Anchieta. Examina-se
  o que foi previsto para a defesa contra inundações e os possíveis impactos caso
  as soluções propostas tivessem sido implementadas.
