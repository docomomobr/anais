abstract: 'Este texto trata dos passeios cobertos imaginados para os setores de bancos,
  escritórios e comércio do Plano Piloto de Brasília (1957), e explora, sobretudo,
  a tensão gerada entre o desenho unitário e o processo de construção fracionada destas
  estruturas. Este tipo de estrutura surgiu no desenho da cidade da arquitetura moderna
  para abrigar pedestres do sol e da chuva, proporcionando áreas de convívio e de
  sociabilidade em uma lógica mais crítica de arranjo urbano. Essa lógica propunha
  requalificar os trajetos pedestres, mas seguia com o planejamento estanque, demandando
  que as estruturas de passeios cobertos fossem concebidas de forma unitária. No Plano
  Piloto de Brasília, os passeios cobertos foram pensados para juntar os diferentes
  edifícios dos setores para bancos, escritórios e comércio, emulando o burburinho
  pedestre comum às áreas centrais das capitais brasileiras. Durante o desenvolvimento
  do Plano Piloto, entretanto, essas estruturas foram modificadas em seus desenhos.
  Mais ainda: os passeios cobertos, se inicialmente desenhados como estruturas de
  aparência unitária, foram executados de forma fracionada. Submetidas às lógicas
  de compra, venda, regulação e construção dos edifícios de cada setor, essas estruturas
  nunca foram totalmente finalizadas. Essa própria incompletude, no entanto, sugere
  uma estratégia para lidar com o tempo e com os diferentes atores sociais envolvidos
  no processo de construção da cidade, e evidencia as complexidades da ideia de cidade
  da arquitetura moderna, sobretudo a relação imbricada entre seu projeto e sua construção.'
