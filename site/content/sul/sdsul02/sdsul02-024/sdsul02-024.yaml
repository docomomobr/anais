abstract: 'Este trabalho descreve a relação do concreto armado com as estratégias
  compositivas utilizadas pelo arquiteto Oscar Niemeyer. A partir modelo de Gramática
  de formas, aborda-se o uso do concreto como um dos componentes da semântica e sintaxe
  empregadas na linguagem arquitetônica de Niemeyer. A gramática que codifica a linguagem
  de Niemeyer tem sido explorada em pesquisas recentes [Mayer, 2003; Mayer, Turkienicz,
  2005a; 2006] onde são examinados edifícios produzidos por Niemeyer a partir de 1943
  identificando: 1. o concreto mediando a relação entre vocabulário (semântica) e
  forma arquitetônica resultante (sintaxe). 2. diferenças e semelhanças na linguagem
  de Niemeyer no uso do concreto durante todo o período. O estudo demonstrou que a
  plasticidade do concreto permitiu a Niemeyer atingir múltiplos objetivos relacionados
  à percepção e a relação da forma arquitetônica com o programa e o contexto: a] liberdade
  Plástica b] exploração do aparente paradoxo entre o concreto e a percepção de leveza;
  c] unidade plástica; d] percepção espacial de contraste e] a relação com o ambiente
  Como desenvolvimento do estudo sugere-se que a adoção de abordagens generativas
  sobre precedentes arquitetônicos poderiam ser úteis para a validação de hipóteses
  sobre a relação entre vocabulario e sintaxe na linguagem arquitetônica de Niemeyer
  .'
