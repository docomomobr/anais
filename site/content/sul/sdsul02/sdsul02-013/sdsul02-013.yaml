abstract: O advento de novas tecnologias de construção (como o concreto armado e as
  estruturas de ferro) em Porto Alegre ocorre em paralelo com o apogeu da arquitetura
  eclética na cidade, nas duas primeiras décadas do século XX. Edifícios desta época,
  com exuberantes exteriores historicistas, são sustentados por estruturas de concreto
  armado e/ou metal. Dentre estas obras pioneiras na capital gaúcha, está o Arquivo
  Público do Estado do Rio Grande do Sul, que combina os aspectos de inovação tecnológica
  com preocupações urbanísticas relacionadas à reconfiguração do centro da cidade.
