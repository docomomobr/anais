abstract: A idéia de Arquitetura Moderna Gaúcha não se desenvolveu em termos de sistemas
  compositivos e elementos formais próprios, suficientes para sustentação de escola
  arquitetônica regional irradiadora e de um corpo disciplinar hereditário que fizesse
  jus à uma identidade formal. Em obras inaugurais de determinados expedientes da
  Arquitetura Moderna no Rio Grande do Sul, como a Refinaria Alberto Pasqualini (Canoas,
  1962-68), de Carlos Fayet, Cláudio Araújo, Moacyr Moojen Marques e Miguel Pereira,
  epítetos de comedimento, rigor, racionalidade, economicidade, pragmatismo, frugalismo
  e sobriedade dão vazão à certa maneira de compreender e proceder mediante o problema
  arquitetônico, reveladora dos pormenores da Arquitetura Brasileira no sul. Se na
  Petrobrás o movimento “O petróleo é nosso” encontrou arquitetos simpáticos à corrente
  social da qual a Arquitetura Moderna Brasileira era uma causa, no projeto para a
  SMOV (Moojen, Vallandro e Ferreira, 1966), os meios arquitetônicos racionalizados,
  a idéia de arquitetura e urbanismo modernos como ferramentas sociais renovadoras
  e o exercício do oficio competente, encontraram uma das sedes. Projetada no aterro,
  para abrigar a nova Secretaria Municipal de Obras e Viação, graças ao crescimento
  do planejamento conseqüente da realização e implantação do plano de 1959, a idéia
  de um edifício próprio para as secretarias foi uma iniciativa dos funcionários.
  A necessidade funcional e o caráter simbólico implícito sustentaram os mesmos postulados
  de racionalidade conceptiva da Petrobrás, neste caso mais determinado pelo axioma
  da flexibilidade espacial e possibilidade de apropriação pelos usuários, como nas
  investigações modulares de Aldo van Eick, do que a horizontalidade e vazio da planta
  livre disposta pelo vão misieano. Composição acadêmica de base, piano nobile e ático,
  modulação severa, exus-esqueletus racionalizado, planta livre, integração de sistemas
  e instalações à arquitetura, pré-fabricação em concreto, uso de elementos industrializados,
  prestam tributo a Frank Lloyd Wright, Mies ou Le Corbusier, mas como conseqüência.
