abstract: Segundo um levantamento preliminar, entre os anos de 1935 e 1960, inserido
  no amplo processo de verticalização do centro da cidade de São Paulo, o escritório
  do arquiteto francês Jacques Pilon produziu na região central da cidade em torno
  de 60 edifícios. Inicialmente associados a um período de transição entre a arquitetura
  clássica e a moderna, os edifícios já introduziam conceitos como racionalização
  da estrutura, amplas aberturas para iluminação e ventilação e respeito às normativas
  norte-americanas de instalações prediais. Considerando os cerca de vinte e cinco
  anos de produção de seu escritório, a produção pessoal mais representativa de Jacques
  Pilon como arquiteto se concentra na primeira década, entre 1934 e 1945. Após este
  período passou a contar com a colaboração de arquitetos experientes e qualificados,
  que modificaram a linguagem da arquitetura produzida em seu escritório. Assim, gradativamente,
  os projetos passaram a contar cada vez menos com sua participação efetiva como arquiteto,
  que passou a se dedicar às atividades gerenciais de seu escritório. Através da leitura
  da expressiva produção do escritório de Jacques Pilon no centro de São Paulo, tem-se
  uma amostragem significativa do processo de verticalização da cidade, bem como da
  gradual inserção da arquitetura moderna e sua evolução na cidade, sobretudo nos
  edifícios comerciais e de apartamentos.
