abstract: A produção do arquiteto carioca Sergio Bernardes (1919/2002) é tão vasta
  quanto desconhecida. Assertivo e questionador, desde o início da carreira mostrou-se
  avesso à formatações conceituais, estilísticas ou projetuais, sendo destacado por
  Bruand como um arquiteto “acessível às influências externas”, caracterizado pela
  “falta de preconceitos teóricos e de uma linha bem definida, fruto de uma abertura
  de espírito e uma disponibilidade tão completas que às vezes beiravam a utopia e
  a dispersão.” (BRUAND, 1991, 289) Graduado em 1948 pela Universidade do Brasil,
  atuou até os anos 1990 no campo alargado do projeto com significativa mudança da
  escala projetual nos anos 1960/70. Experimentando o aço como partido estrutural
  da arquitetura, aventurou-se pelo universo das geometrias não euclidianas, pendurou
  pavilhões como ponte e residenciais como teleférico; testou materiais leves na construção;
  impulsionou a produção industrial desenvolvendo elementos para fabricação em série.
  Num caminho ambicioso entre associações multidisciplinares do conhecimento, pesquisa
  laboratorial e investigação experimental no canteiro, perseguiu, a partir de 1965,
  uma espécie de idealismo sistêmico fundamentado num virtuosismo tecnológico e visionário.
  Ação projetual que indica um diálogo sintonizado com algumas das principais correntes
  arquitetônicas que marcavam a pluralidade do cenário internacional do período, como
  a utopia tecnológica do grupo inglês Achigram, o “design tecnocrático” (FRAMPTON,
  2000, 342) de Buckminster Fuller e o universo da “arquitetura móvel”. (COHEN, 2013,
  386) Esta, representada, entre outras vertentes, pelo metabolismo japonês e pelas
  megaestruturas em geral. Nesse caminho, Sergio Bernardes apostou alto na renovação
  de sua arquitetura no contexto brasileiro dos anos 1960/70, aproveitando-se de sua
  proximidade com o poder (público) militar, principalmente, durante o período de
  pujança econômica (alta concentração de riquezas) e desenvolvimento progressista
  do país sob a Ditadura – o assim chamado período do “milagre brasileiro” (1968/73).
  Momento em que o arquiteto assume protagonismo na construção da então recém-inaugurada
  capital federal – Brasília. Este artigo analisa dois projetos de Sergio Bernardes
  para Brasília, ambos realizados no período do “milagre” – a sede do Instituto Brasileiro
  do Café – IBC (1968) e o edifício do Ministério da Marinha – MM (1970/73), tendo
  como objetivo entender em que medida eles dialogam com os referenciais anteriormente
  citados, e até que ponto, significam uma “herança (proposta) inovadora” no quadro
  da arquitetura brasileira após 1960.
keyword: Sergio Bernardes; Brasília; experimentalismo
