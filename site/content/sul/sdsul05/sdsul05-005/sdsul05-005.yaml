abstract: A flexibilidade é um conceito que abrange uma grande diversidade de interpretações
  e que tem sido explorado por vários autores em distintos campos do conhecimento.
  Em arquitetura, os estudos sobre este tema investigam como potencializar por intermédio
  de espaços flexíveis o uso das construções, ao mesmo tempo em que considera a sua
  permanência, seja através de estratégias de projeto relacionadas à transformação
  ou, no caso de soluções mais abertas, entendendo o edifício como algo capaz de crescer
  e se reconfigurar ao longo do tempo. A arquitetura moderna potencializou o desenvolvimento
  de questões relativas ao conceito de flexibilidade, constituindo umas das premissas
  do movimento. As partes que compõem uma obra arquitetônica passam ser organizadas
  e arranjadas de diferentes maneiras, de acordo com o programa, o sítio e os meios
  de construção que se utilizam, e estrutura e vedação passam a ser vistos como sistemas
  independentes, redundando, portanto, na autonomia de cada elemento de composição
  do projeto. Na arquitetura moderna, a flexibilidade derivada do racionalismo estrutural
  se traduz em espaços contínuos, vedações internas e externas sem funções estruturais
  ou móveis e organização espacial a partir do núcleo de serviços. A arquitetura moderna
  brasileira desde a origem teve em seus exemplares a aplicação de espaços flexíveis.
  O próprio Ministério da Educação e Saúde Pública (1936-45), ícone do movimento,
  possui uma planta racional, com pavimento livre e concentração de circulações verticais
  e áreas molhadas. Isso, no entanto, não foi um caso isolado. Ao focar seus esforços
  no desenho das estruturas, criando geometrias simples e espaços generosos para resolver
  os novos problemas complexos que surgiam naquele momento, aliando a isso a preocupação
  da construção da paisagem e a articulação territorial, a arquitetura moderna brasileira
  apresenta, de maneira geral, uma grande abertura à possibilidade de mudança de uso
  e à apropriação dos seus espaços que a diferencia significativamente da produção
  dos países do hemisfério norte do mesmo período. Sendo capazes de acomodar variados
  usos ao longo do tempo, estes edifícios ampliam sua longevidade e retardam a obsolescência
  de suas funções. Nesta direção, o objetivo deste artigo é realizar uma reflexão
  teórica e histórica sobre a questão da flexibilidade presente na arquitetura moderna
  brasileira e sua vigência na contemporaneidade. Assim, o trabalho inicia sua análise
  resgatando como os primeiros representantes da arquitetura moderna aplicaram este
  conceito em suas obras e ideias, e quais as motivações por trás dessa nova maneira
  de projetar. Na sequência, será abordado o caso específico de edifícios de caráter
  público e com função administrativa da arquitetura moderna brasileira, uma vez que
  tal tipologia exige, em sua essência, atributos de flexibilidade e adaptabilidade.
  Por fim, a título de conclusão, será apresentada a dupla vigência deste conceito
  nos dias de hoje, quando se torna de extrema relevância considerá-lo tanto como
  estratégia em novos projetos como em propostas de intervenção em obras modernas,
  podendo auxiliar na preservação da integridade de tais exemplares.
