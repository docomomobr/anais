abstract: 'A industrialização introduziu novos materiais, processos e métodos de construir
  que afetaram irreversivelmente e em escala crescente a arquitetura. A prática está
  essencialmente associada aos conceitos de organização e de fabricação em série,
  elementos esses que são entendidos a partir de um estudo mais amplo das relações
  de produção envolvidas e da mecanização dos meios de produção. E foi em concreto
  armado que a nova arquitetura se expressou em sua absoluta maioria no Brasil. Do
  período Vargas a Kubistchek e do boom construtivo do pósguerra, tivemos o início
  de uma industrialização em um país que saía de um quadro É neste cenário ainda incipiente
  para a pré-fabricação que predominantemente agropastoril. dois projetos de conjuntos
  residenciais construídos com estrutura pré-moldada são apresentados. O primeiro
  projeto, de 1961, é o Conjunto Residencial da Universidade de São Paulo - CRUSP
  integrante da Cidade Universitária Armando Salles de Oliveira, em São Paulo. Originalmente
  formado por doze blocos, foram financiados pelo Fundo de Construção da Universidade
  de São Paulo – FUNDUSP, com a finalidade de abrigar estudantes de outras cidades
  que ingressaram na instituição. Projeto de autoria dos arquitetos Eduardo Kneese
  de Mello, Joel Ramalho Jr. e Sidney de Oliveira,teve sua construção iniciada em
  março de 1962. Os blocos A, B, C, D, E e F foram inaugurados em maio de 1963, sendo
  executados em estrutura convencional de concreto e os seis restantes em estrutura
  pré-moldada no próprio canteiro da obra. Constituindo um dos primeiros casos de
  construção de grande porte executada neste sistema no Brasil, o CRUSP teve sua importância
  pelo pioneirismo e pela sistematização das etapas de projeto e execução. O segundo
  projeto a ser estudado é dos Edifícios de Apartamentos para Professores, conhecido
  também como Colina, de autoria do arquiteto João Filgueiras Lima (Lelé). Projetado
  para o Campus Universitário Darcy Ribeiro da UnB em Brasília no ano de 1962, foi
  executado em 1963. O conjunto, também construído em estrutura pré-moldada, é formado
  pelos blocos A, B, C e D e seguiu os mesmos princípios de racionalização empregada
  nos principais prédios da Universidade. Localizados no extremo norte do Campus,
  conforme zoneamento previsto no plano urbanístico de Lucio Costa, as residências
  para professores foram propostas para serem construídas em etapas, em virtude de
  alguns aprimoramentos de ordem técnica, construtiva e espacial incorporados ao projeto.
  O objetivo era garantir a desejada flexibilização dos espaços internos atendendo
  às mais variadas composições familiares dos futuros moradores. Partindo dessa premissa,
  além dos fechamentos em placas de concreto pré-moldadas, optou-se pelo uso de divisórias
  removíveis que se adaptassem facilmente às necessidades das famílias dos professores
  da universidade, tentando com isso uma maior flexibilização da planta. Este trabalho
  tem como objetivo realizar um estudo comparativo entre os dois projetos, identificando
  elementos de coordenação modular, organização espacial e aspectos construtivos.
  A racionalização do projeto – que, num primeiro momento, procurava apenas reduzir
  custos e prazos – também se manifestou em termos da configuração espacial das unidades
  de habitação e das relações formais dos blocos. Neste sentido, o artigo procura
  traçar paralelos e convergências entre as duas propostas que, mesmo concebidas quase
  que

  concomitantemente, apresentam diferenças significativas tanto espaciais quanto construtivas.

  A pré-fabricação – ou, no caso específico a pré-moldagem – estava no início de sua
  história no

  Brasil e por isso ainda se apresentava em nível investigativo, tanto nas estratégias
  de projeto

  quanto na solução estrutural.'
keyword: concreto; pré-moldado; industrialização
