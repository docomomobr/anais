abstract: 'O emprego do concreto pré-moldado na nossa arquitetura iniciou em 1924
  no Rio de Janeiro com a sede do Jockey Club Brasileiro (também conhecido como Hipódromo
  da Gávea), projeto de Archimedes Memória e Francisque Cuchet. Realizado pela construtora
  Christiani & Nielsen, teve estacas pré-moldadas nas fundações e painéis no muro
  de cercamento. Ainda no Rio, são empregues elementos pré-moldados no Asilo São Luís
  (1935-37) de Paulo Camargo e Almeida e na cobertura do Bloco de Exposições do Ministério
  da Educação e Saúde Pública (1936-45), projeto de Lucio Costa e equipe. Em 1949,
  também no Rio, surge uma iniciativa pioneira: o Sanatório de Curicica, com autoria
  de Sergio Bernardes, que utiliza pela primeira vez um sistema estrutural pré-moldado
  em canteiro. Em São Paulo, no ano de 1954, Oscar Niemeyer e Hélio Uchôa recorrem
  a um sistema pré-moldado em um pavilhão industrial na fábrica da Ericsson em São
  José dos Campos. Com estrutura de concreto tradicional, a cobertura do pavilhão
  industrial é composta de placas pré-moldadas que se encaixam nas vigas de cobertura.
  Esses exemplares podem ser considerados parte importante da base das grandes realizações
  pré-moldadas da década de 1960. Entre os anos 1930 e 1950, a falta de uma mecanização
  pesada da construção civil brasileira teve como consequência edifícios em que a
  pré-moldagem só era possível com elementos de tamanho reduzido e, principalmente,
  mais leves. Sem fábricas de pré-moldados instaladas no país, a produção dos componentes
  construtivos era feita no próprio canteiro, sendo estes movimentados na obra pelos
  operários de forma manual, ou através de equipamentos rudimentares. A partir de
  quatro obras "lado B", a ideia central deste artigo é examinar as primeiras experimentações
  em concreto pré-moldado no Brasil no campo da arquitetura, relacionando os aspectos
  construtivos no canteiro com a falta de mecanização da construção.'
