abstract: 'Este artigo estuda o caso do Jockey Club do Rio Grande do Sul, obra do
  arquiteto Uruguaio

  Román Fresnedo Siri. Tombado na esfera municipal em 2005, o conjunto vem se deteriorando
  ao longo

  dos anos. Como fato inaugural desta deterioração, toma-se o conjunto de rampas suprimido
  do

  pavimento térreo da Tribuna Popular. Com base na composição alterada, atípica, que
  resulta da

  supressão de um elemento estruturador na composição deste edifício, faz-se uma breve
  investigação

  das alterações sofridas que podem ser vistas como complementações e alterações feitas
  nos edifícios e

  suas consequências em seus respectivos sistemas de movimento.'
