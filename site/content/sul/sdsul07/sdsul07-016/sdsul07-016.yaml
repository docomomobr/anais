abstract: 'Este artigo, derivado do Trabalho de Curso requisito para conclusão da
  graduação em

  Arquitetura e Urbanismo junto à Universidade do Planalto Catarinense em 2020, toma
  como ponto de

  partida o Cine Marrocos, localizado em Lages/SC, cuja edificação data de 1964. Tendo
  sido recente

  desativado, vale-se contudo do reconhecimento do seu papel como cinema de rua na
  história da cidade,

  bem como da identificação de seu valor patrimonial enquanto representante de uma
  arquitetura que

  carrega traços modernos, para propor estratégias projetuais para um complexo cultural
  envolvendo o

  próprio edifício a ser reabilitado, e qualificando as áreas adjacentes como parte
  do conjunto. Pesquisas

  prévias ao exercício do projeto perpassam a relação entre cinema, cidade e modernidade,
  e entre

  patrimônio moderno e intervenções arquitetônicas. Já os estudos específicos das
  circunvizinhanças do

  edifício e as condicionantes envolvidas conduziram à setorização e às decisões de
  partido para a

  ocupação, entre áreas edificadas e abertas, dos espaços contíguos ao edifício do
  cinema, remetendo

  aos quatro eixos temáticos do projeto. Com o material resultante, espera-se contribuir
  com o pensar

  sobre as possibilidades outras, diferente do esquecimento, da subutilização e da
  degradação de edifícios

  valorosos nos centros urbanos brasileiros; ou, em outras palavras, com o que poderia
  ser o Passeio

  Cultural Marrocos.'
