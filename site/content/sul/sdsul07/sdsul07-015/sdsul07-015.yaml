abstract: 'A revista Manchete foi uma publicação de extraordinária importância na
  dinâmica cultural

  brasileira, registrando em suas páginas passagens importantes de nossa história.
  Dentre os múltiplos

  interesses editoriais da revista, a arquitetura, a arquitetura de Brasília e especialmente,
  a arquitetura de

  Oscar Niemeyer sempre foram assuntos publicados pela Manchete . Tomando como pretexto
  a

  construção da nova sede do Grupo Bloch, o Edifício Manchete , este artigo inicia
  o aprofundamento nas

  abordagens sobre as relações entre o arquiteto e o Grupo Editorial Bloch, que incluem
  edifícios

  administrativos, espaços culturais, escolas e miríades de interesses em comum. Deste
  modo, atentos ao

  Lado B de um arquiteto tão extraordinário e pródigos em obras do Lado A, é possível
  ampliar as

  abordagens e desenhar novas camadas historiográficas sobre sua própria produção,
  mas também sobre

  a produção arquitetônica brasileira.'
