abstract: 'A Poltrona Mole, obra capital de Sérgio Rodrigues, conhecida internacionalmente
  , integrante do

  acervo permanente do Museum of Modern Art (MoMA) de Nova Iorque desde 1974, recebeu
  todos os louros

  e condecorações que uma obra do Lado A (ou single ) poderia obter. Mas nem sempre
  foi assim, ela

  amargou durante bom tempo na Oca de Ipanema, período em que os curiosos de vitrine
  resmungavam “pra

  cama de cachorro está muito caro”, fez com que seu criador enfrentasse os sócios
  que queriam escondê-la

  nos fundos da loja, sob pretexto de que ela atrapalhava vendas e espantava clientes.
  A conversão de cama

  de cachorro para obra icônica, ou de última faixa do Lado B para Top Hit , não ocorreu
  em um passe de

  mágica. Esse percurso será apresentado em três fases que permitem distinguir as
  modificações de projeto:

  a primeira, fase embrionária, avalia croquis de partido da chamada por nós Poltrona
  Molenga (1956); a

  segunda, fase de desenvolvimento, examina a Poltrona Mole (1957-61), quando é remodelada
  para ser

  construída, quatro anos depois ela recebe novos ajustes para ser inscrita no IV
  Concorso Internazionale del

  Mobile , vence e passa ser internacionalmente conhecida; a terceira e última, fase
  de aprimoramento,

  verifica a Poltrona Moleca (1963), versão feminina da Mole, com chassis desmontáveis
  de fácil

  armazenamento e transporte para exportação. T odas as etapas compartilham os motivos
  que levaram

  Sergio Rodrigues a reavaliar sua criação encontrando novas soluções de projeto,
  atitude que evidencia seu

  entusiasmo em investigar procedimentos construtivos elementares da movelaria e carpintaria,
  como

  chassis, encaixes e entalhes, convertendo-os em soluções sofisticadas e aconchegantes
  para o corpo e

  alma.'
