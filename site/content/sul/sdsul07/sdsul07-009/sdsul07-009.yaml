abstract: 'Exposições e mostras tiveram papel fundamental na evolução do conceito
  de

  habitação moderna. Nota-se que Le Corbusier utilizou esses eventos para desenvolver
  e

  aprimorar suas ideias quanto à forma de morar e a busca ao mobiliário ideal, ponto
  crucial,

  segundo o arquiteto, para a solução do problema da habitação. Partindo do projeto

  desenvolvido para o Salão do Outono de 1922, onde apresentou a Ville Contemporaine
  de 3

  Millions d’Habitants com seus Immeubles-Villas , até o Salão do Outono de 1929,
  onde

  apresentou o Equipamento Ideal para uma Habitação, o arquiteto buscou o desenvolvimento

  de uma linha de mobiliário ideal para a casa do homem moderno. Para Le Corbusier
  o

  problema da planta moderna só seria resolvido através do estudo do mobiliário. Seguindo
  o

  estudo feito para o Salão do Outono de 1922 com o Pavilhão l’Esprit Nouveau na Exposição

  Internacional das Artes Decorativas de 1925, Le Corbusier e Pierre Jeanneret começaram
  a

  busca pelo mobiliário ideal quando apresentaram um manifesto em prol da Arquitetura
  Moderna

  propondo a reforma da habitação. Em 1927, na exposição Die Wohnung (a vivenda),
  os

  arquitetos avançam na sua pesquisa. Porém, somente com a entrada de Charlotte Perriand
  ao

  escritório da Rue de Sèvres a equipe se complementa e esta questão evolui, culminando
  com a

  apresentação do mobiliário ideal no Salão do Outono de 1929.'
