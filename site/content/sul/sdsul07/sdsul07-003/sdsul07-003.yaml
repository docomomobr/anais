abstract: 'Considerável parte dos autores que estudam a obra de Lina Bo Bardi cita
  e reconhece o

  complexo Taba Guaianases como um projeto importante para a cidade de São Paulo,
  apesar de não

  construído. Realizado em parceria com o engenheiro italiano Pier Luigi Nervi, responsável
  pelos estudos

  da estrutura, ele é desenvolvido em 1951, momento no qual a urbe passa por grande
  crescimento

  econômico, urbano e cultural, seguindo o modelo americano de verticalização. O programa
  proposto é de

  complexidade similar ao de outros exemplares desenvolvidos para a São Paulo da época.
  Entretanto, no

  Taba Guaianases, o principal objetivo é de projetar uma emissora de TV, unindo habitação
  com espaços

  de uso coletivo e público, como salas de espetáculos, pista de gelo, restaurante,
  solário, biblioteca e sala

  de leitura coletiva. Na obra de Lina, o Taba Guaianases é o único projeto que trata
  de um programa

  multifuncional, incluindo habitação coletiva. Ele pode ser inserido em um conjunto
  de experimentações

  da arquiteta que, realizadas para o Brasil, são marcadas por referências italianas
  geralmente presentes

  na obra de Lina, mas não ainda suficientemente exploradas. A partir do estudo das
  torres de habitação

  desse complexo, pretende-se apontar particularmente suas relações com a Casa Rustici
  , obra de

  Terragni e Lingeri dos anos 1930 em Milão. A Casa Rustici nasce da ampliação do
  conceito de villa

  soprapposta , e é projetada segundo o caráter da vida mediterrânea, traço e marca
  nacional, presente

  nas obras dos arquitetos modernos em torno da revista Quadrante , de Pietro Maria
  Bardi, e de grande

  importância no moderno italiano.'
