abstract: 'Eduardo Longo é um arquiteto mais conhecido por sua arquitetura residencial,
  especialmente

  pela Casa Bola . O artigo aponta os paradoxos na divulgação e legitimação da arquitetura
  residencial de

  Eduardo Longo, a partir das casas publicadas em duas edições consecutivas da revista
  Acrópole ,

  números 388 e 389, em setembro e outubro 1971, respectivamente. A divulgação de
  13 projetos de

  residências em São Paulo e no Guarujá por uma revista especializada reiterou a fama
  do jovem arquiteto

  e sua inserção no campo profissional. Tal situação parece paradoxal, pois considerando
  a trajetória

  profissional, Eduardo Longo nunca foi um arquiteto convencional, que poderia ser
  inscrito no Lado A da

  produção arquitetônica brasileira. A tensão entre o Lado A e o Lado B se amplia,
  pois sua obra mais

  memorável —a Casa Bola — não poderia estar publicada naquelas revistas por ser resultante
  de uma

  experimentação arquitetônica posterior, um projeto complexo desenvolvido entre 1974-79,
  com

  intervenções continuadas, tornando-se atualmente, um objeto de interesse midiático
  e internacional,

  alternando a importância das abordagens do Lado A e do Lado B da historiografia.'
