abstract: 'A produção arquitetônica de Oscar Niemeyer é um tema frequente em pesquisas

  acadêmicas. Contudo, um pouco antes de começar os projetos dos edifícios para Brasília,
  em 1956,

  Niemeyer fez uma incursão no universo cênico e teatral, projetando uma cenografia
  para a peça

  Orfeu da Conceição . A peça foi escrita por Vinicius de Moraes e musicada por Antonio
  Carlos Jobim,

  tornando-se um marco para a cultura brasileira. Orfeu da Conceição é objeto de estudo
  em diferentes

  campos disciplinares, como no Teatro, na Música e nas Letras (MAGALDI, 1998; FLÉCHET,
  2017;

  PARANHOS, 1980). O livro Cancioneiro Vinicius de Moraes: Orfeu , organizado pela
  Jobim Music, em

  2003 (MORAES, 2003), reuniu uma vasta documentação acerca da peça, com fotografias,
  desenhos

  e manuscritos da época. O cenário, apesar de constar em algumas publicações do campo

  arquitetônico (PAPADAKI, 1960; PHILIPPOU, 2008), parece não ter sido objeto de estudos

  aprofundados, e apresenta-se como uma produção alternativa na carreira do arquiteto,
  a ser

  analisada.'
