abstract: 'Este trabalho foi desenvolvido com a finalidade de tratar sobre maneiras
  de intervir no

  patrimônio arquitetônico Moderno. A partir da análise de três projetos de reforma
  com autoria de Paulo

  Mendes da Rocha, o trabalho aborda as diferentes estratégias adotadas pelo arquiteto
  diante de

  edificações existentes, no intuito de verificar se, nesses casos, os procedimentos
  recomendados no

  campo patrimonial dão conta das questões que a Arquitetura Moderna apresenta.'
