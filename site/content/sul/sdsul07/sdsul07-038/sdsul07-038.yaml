abstract: 'A partir da década de 1940, podemos identificar as influências modernistas
  e a incorporação

  dos seus preceitos na arquitetura da cidade de Santa Maria, assim como a sua consequente
  produção,

  de maneira mais efetiva. O desenvolvimento do setor comercial e a ampliação de sua
  estrutura, visando

  o potencial de consumo, foram preponderantes para a estruturação da área central,
  desencadeando

  crescimento e adensamento na malha urbana e remodelação das estruturas urbanas já́
  existentes.

  Nesse processo, surgiram construções Art Déco e edificações de caráter modernista
  configurando um

  conjunto, ainda perceptível na atualidade. Como forma de preservar estas memórias,
  foi constituído, em

  2019, o grupo de extensão Mapeando Memórias e nele foram estruturados roteiros interpretativos
  com

  as edificações remanescentes na área do Distrito Criativo. Estes roteiros compõem
  parte de ações de

  educação patrimonial: o “Giro Histórico”, passeios guiados pela área, e o projeto
  interpretativo,

  sinalização educativa que permite a realização de passeios com autonomia. A interpretação
  do

  patrimônio é o processo de acrescentar valor à experiência do visitante, por meio
  do fornecimento de

  informações que realcem a história e as características culturais e ambientais de
  um lugar. Portanto, o

  objetivo deste artigo é apresentar o roteiro modernista elaborado e constituído
  dos seguintes

  exemplares: Edifício Taperinha (1959); Antiga Reitoria da UFSM (1960); Residência
  Dátero Maciel

  (1936); Edifício Central dos Correios e Telégrafos (1953); Galeria do Comércio (década
  de 1950) e

  Edifício Cacism (década de 1970). A metodologia consistiu em mapear na área central
  as obras

  modernistas por meio de bibliografia, assim como analisar projetos similares. O
  roteiro foi organizado a

  partir de um tótem e de placas nas edificações e a sua implantação incluirá a comunidade
  por meio da

  reconstrução das memórias, da sua participação nos “Giros Históricos”, e por consulta
  pública. Portanto,

  entende-se que este projeto tem a vocação de estreitar essa história, proporcionando
  a valorização da

  memória, capaz assim de impactar futuras gerações.'
