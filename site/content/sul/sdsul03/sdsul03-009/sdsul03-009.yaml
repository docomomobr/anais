abstract: O pavilhão de Exposições do Governo do Estado do Rio Grande do Sul, do arquiteto
  Marcos David Heckman, todo construído em madeira, foi um edifício icônico na memória
  do portoalegrense. Foi conhecido popularmente como “Mata-Borrão” na década de 1960,
  relacionado com o objeto, mais especificamente o modelo “bercinho”, utilizado para
  absorver o excesso de tinta de texto escrito com pena ou caneta tinteiro. “Niemeyer
  já havia ensaiado forma semelhante em projeto para o auditório do Liceu Belo Horizonte,
  em 1954”, embora com solução construtiva completamente diferente. Heckman adotou,
  no pavilhão, a tradicional tecnologia da madeira com solução estrutural nada convencional
  ao explorar a geometria curva, escapando das soluções ortogonais corriqueiras. Pousado
  sobre o solo, o “Mata-Borrão” mostrava-se levemente ancorado por pilares de madeira.
  “Em visão noturna, o edifício transfigurava-se, reforçando sua forma, que passava
  a flutuar, na medida em que desapareciam as amarras”. Heckman explorava, de maneira
  acentuada, a permeabilidade e a transparência das superfícies, dotando o edifício
  de extrema leveza, que contrastava fortemente com o seu contexto. A imagem registrada
  por João Alberto, no Estúdio Jawal, destaca sua volumetria curva e, em tomadas aéreas
  de Valdir Bicca, sócio do fotógrafo, a superfície contínua e brilhante do pavilhão
  aparece fortemente identificada em meio às construções verticais. O impactante edifício,
  até hoje lembrado pela população, foi o resultado de um desejo político do então
  governador - engenheiro Leonel de Moura Brizola, da liberdade permitida pela arquitetura
  efêmera, da opção pela madeira e das alusões de seu autor à arquitetura moderna
  brasileira.
