abstract: Parte valiosa do legado do período moderno da arquitetura brasileira são
  as residências. Entre os anos 30, quando ocorre a compreensão das potencialidades
  sugeridas pela nova arquitetura, e os 70, quando se diluem algumas de suas constantes
  atemporais, a produção de casas faz multiplicar as operações por ela admitidas,
  inclusive através de novos exercícios compositivos. O estímulo ao uso de materiais
  locais e de relações entre arquitetura e o seu lugar dão margem à flexibilização
  do funcionalismo. Condicionantes naturais, geográficos e climáticos são associados
  ao desembarque da arquitetura moderna num momento e local que confluem positivamente
  para sua concretização com essência própria. Ao mesmo tempo, a apropriação de soluções
  e elementos tradicionais pela atualização de técnicas construtivas enriquece projetos
  e obras, que passam a ter seus vínculos recompostos. O tema Tradição e Modernidade,
  embora recorrente, é trazido por este trabalho como mote para um estudo sobre a
  madeira utilizada em Casas Modernas Cariocas. A coleção-base de 145 exemplares,
  assinadas por mais de 30 arquitetos nascidos ou radicados no Rio de Janeiro, localizadas
  no estado do Rio ou fora dele, está catalogada em dissertação de mestrado do autor,
  onde está agrupada em sete períodos balizados e ajustados de acordo com eventos
  históricos relevantes num recorte de tempo de 1930 a 1965, sendo contemplada em
  diferentes aspectos. A casa brasileira carioca referenda uma prática de projetar
  dialética e inclusiva. A experimentação existe, mas sem esforço de afirmação exagerado.
  O emprego da madeira, em associação com outros recursos, naturais ou industrializados,
  revela-se conveniente e perfeitamente adequado a cada caso, traduzindo-se numa diversidade
  bem explorada em estruturas e complementos, em aberturas e fechamentos, em superfícies
  ou em objetos, em casas como as de Lucio Costa, Oscar Niemeyer, Carlos Leão, Affonso
  Eduardo Reidy, Alcides Rocha Miranda, Francisco Bolonha, Carlos Ferreira, Sérgio
  Bernardes, entre outros.
