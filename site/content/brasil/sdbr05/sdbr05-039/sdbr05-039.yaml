abstract: Expressões e vestígios modernistas na capital fluminense nas décadas de
  1940, 1950, 1960 e seus valores como patrimônio urbano. Niterói com a implantação
  do Estado Novo dá seguimento ao seu papel histórico de constituir um espaço de repercussão
  das intervenções realizadas na cidade do Rio de Janeiro, através do rebatimento
  das iniciativas cariocas. O período Vargas, com seu projeto de reforma e modernização
  do país, propiciou a adoção dos princípios modernistas, especialmente nos projetos
  das edificações públicas dos conjuntos habitacionais, influenciando subsidiariamente
  os traçados urbanos de cidades capitais. A abertura da Avenida Amaral Peixoto no
  Centro de Niterói, inaugurada em 1942, representa a continuação dos pilotis e das
  galerias cobertas da Avenida Presidente Vargas, constituindo um exemplo dessas manifestações
  modernizadoras da capital fluminense. Niterói, capital do Estado do Rio de Janeiro,
  foi privilegiada como sede de edifícios públicos, projetados por arquitetos expressivos
  como Álvaro Vital Brazil e outros arquitetos menos conhecidos, pertencentes aos
  quadros da Secretaria de viação e Obras do Estado do Rio de Janeiro, que deixaram
  um acervo modernista considerável, alguns já tombados pelo patrimônio municipal.
  A criação do Conselho Municipal de Proteção ao patrimônio Cultural data de 19990,
  mas o movimento de valorização deste acervo modernista é bastante recente, pois
  só se deu a partir do final da década.
