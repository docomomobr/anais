abstract: 'O resgate e a compreensão do papel dos institutos de aposentadorias e pensões
  – os IAPs – na gênese da arquitetura doméstica modernista brasileira têm sido objeto
  de discussão de pesquisadores. Este trabalho procurou resgatar a memória coletiva
  sobre o espaço da Vila Operária, localizada no município de Florianópolis/SC, com
  vistas à preservação daquele conjunto arquitetônico-urbanístico. Apesar dos 60 anos
  transcorridos e das modificações inseridas nas unidades por seus moradores, a Vila
  Operária guarda forte identidade, marcada pela manutenção da estrutura urbana, escala,
  gabarito e primordialmente pelas 18 unidades ainda não modificadas. Bonduki destaca
  em Origens da Habitação Social no Brasil as diferentes tipologias introduzidas pelo
  modernismo: “A influência da arquitetura moderna nas origens da habitação social
  no Brasil foi muito importante, contribuindo para a renovação das tipologias de
  projeto, processo construtivo, implantação urbanística, programas habitacionais
  e modos de morar... Através da racionalização, industrialização... surgiram os blocos
  multifamiliares e as cidades-jardim”. A Vila Operária é um exemplo da segunda categoria.
  Apresenta tipologia térrea, geminada duas a duas, sem divisão de lotes e previsão
  de uso coletivo nas áreas públicas. O projeto racional, de geometria simplificada
  e concentração das áreas molhadas, em tudo atende preceitos modernistas de economia
  e funcionalidade.'
