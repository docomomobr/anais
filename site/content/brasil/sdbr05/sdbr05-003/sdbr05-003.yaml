abstract: As superquadras residenciais construídas em Brasília apresentam uma grande
  variedade compositiva. Como previsto no artigo 16 do Relatório do Plano Piloto de
  Lúcio Costa, essa variedade se ancora num cinturão verde perimetral, o gabarito
  de seis pavimentos mais térreo livre em pilotis e na separação do tráfego de veículos
  e do trânsito de pedestres, traduzida na prática como uma via interna em cul-de-sac
  dando acesso a todos os prédios, e, por conseguinte, apenas um ponto de contato
  entre o interior da superquadra e o restante da cidade. Contudo, exceção feita desses
  elementos não se identifica uma matriz compositiva comum, mesmo se não considerada
  a totalidade das superquadras. A aleatoriedade parece dominar, a implantação dos
  prédios e da circulação veicular, considerando-se conjuntamente o traçado das vias
  internas e dos estacionamentos cobertos ou descobertos. Por tanto, foi realizado
  um levantamento de toda a Asa Sul de Brasília onde foram registrado uma série de
  fatores e em conjunto também foram propostos um grupo de modelos de superquadra,
  que tem por base o Parque Guinle, para auxiliar na interpretação das superquadras
  existentes, visto que segundo o próprio Lúcio, o conjunto do Parque Guinle (1943-54)
  é o prenúncio das superquadras de Brasília.
