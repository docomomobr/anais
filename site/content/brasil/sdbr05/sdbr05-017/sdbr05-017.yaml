abstract: 'Esta comunicação aborda uma questão fundamental para a compreensão da arquitetura
  de Lina Bo Bardi que é a tensão moderno/popular. A atuação da arquiteta é muito
  pertinente ao desenvolvimento da arquite- tura moderna brasileira devido à qualidade
  de suas obras e pela força das questões que encerram. Assim, podem ser estabelecidos
  alguns pontos de contatos e aproximações importantes entre sua atuação e a própria
  movimentação moderna brasileira para balizar o que se pretende aqui. Inicialmente,
  a aproximação com a arquitetura de Lina Bo Bardi se organiza para configurar um
  quadro que evidencie as três instâncias em que se configuram esta tensão moderno/popular:
  a materialidade do projeto, o uso popular do espaço moderno e a transformação das
  escalas de produção. A abordagem focaliza este último aspecto, para a partir dele
  tratar das expectativas da arquiteta de desenvolver um desenho industrial baseado
  numa capaci- dade de manufatura popular e vislumbrar sua inserção como valor de
  uma cultura moderna. Com isto, Lina Bo Bardi amplia o sentido da prática arquitetônica
  moderna e simultaneamente pode trazer questões impor- tantes para o debate atual,
  revelando outros parâmetros para o fazer arquitetura.'
keyword: Lina Bo Bardi; moderno; popular
