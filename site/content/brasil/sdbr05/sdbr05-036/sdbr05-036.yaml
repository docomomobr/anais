abstract: 'O trabalho parte de três projetos de edifícios de habitação em São Paulo,
  feitos para a construtora Formaespaço entre 1969 e 1972, que consideraram a possibilidade
  de serem implantados repetidas vezes na cidade. São eles: os edifícios Modulares,
  do arquiteto Abrahão Sanovicz, os edifícios Gemini, do arquiteto Eduardo de Almeida,
  e o edifício Protótipo, do arquiteto Paulo Mendes da Rocha. Aborda-se a construtora
  e seu período de atuação, e a resposta de cada arquiteto ao problema da habitação
  em série.'
