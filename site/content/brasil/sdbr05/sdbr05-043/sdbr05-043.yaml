abstract: 'Este trabalho pretende enfocar um dos elementos mais característicos da
  arquitetura moderna brasileira : as marquises. Para tanto, buscou-se o significado
  da palavra a partir de dicionários de arquitetura onde, ao nosso ver, as definições
  não atendem os variados modelos dessa estrutura. Foi indicada uma nova conceituação
  para o vocábulo, e a partir daí, uma classificação dentro dos tipos de marquises
  desenvolvidas pelo movimento moderno no Brasil: marquises de proteção, marquises
  de acesso, marquises de ligação e marquises de delimitação. Após, analisamos cada
  um desses padrões de marquises que dão identidade a arquitetura brasileira do período,
  a partir de sua utilização em obras relevantes.'
