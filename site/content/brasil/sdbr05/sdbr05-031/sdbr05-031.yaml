abstract: 'Análise das repercussões no espaço urbano de Curitiba decorrentes da recente
  intervenção no antigo Edifício Castello Branco, projetado por Oscar Niemeyer e construído
  no início dos anos 70. A revisão e complementação propostas pelo autor do projeto
  original, três décadas depois, não apenas transformaram o seu uso, substituindo
  os espaços burocráticos de algumas secretarias de Estado pela dinâmica de um Museu
  de Arte, mas sobretudo fundou um novo lugar na cidade. Este trabalho procura refletir
  sobre algumas questões fundamentais levantadas por essa intervenção: A Arquitetura
  e sua capacidade de criação de lugares, os limites da preservação do moderno e a
  permanente contemporaneidade da obra moderna.'
