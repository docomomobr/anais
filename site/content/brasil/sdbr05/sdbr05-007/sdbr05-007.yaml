abstract: O presente texto consiste na exposição do significado cultural de um jardim
  moderno, o Jardim das Cactáceas, hoje denominado Praça Euclides da Cunha projetada
  pelo paisagista Roberto Burle Marx na cidade do Recife em 1934, com o objetivo de
  transformá-la, após sua restauração, em jardim histórico de acordo com a Carta de
  Florença da UNESCO. A Praça Euclides da Cunha também conhecida como Praça do Internacional
  fica situada no bairro da Madalena, em frente ao tradicional Clube Internacional
  do Recife. A concepção de Burle Marx é de um jardim ecológico e educativo de plantas
  do sertão nordestino, recriado na subzona litorânea, da zona da mata, ou seja, em
  uma outra região fisiográfica totalmente diferente, senão adversa, mas que se manteve
  íntegro por mais de quarenta anos. O projeto de restauração resulta de um trabalho
  conjunto do Laboratório da Paisagem da UFPE com a Prefeitura do Recife, a qual decidiu
  empreender esforços para concretizar um compromisso histórico com a conservação
  da paisagem do Recife. É o primeiro jardim de Burle Marx no Recife que teve o projeto
  de restauração conduzido nos moldes na Carta de Florença de 1981, que trata da proteção
  dos jardins históricos no âmbito da paisagem cultural.
