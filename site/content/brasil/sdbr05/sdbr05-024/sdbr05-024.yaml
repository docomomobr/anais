abstract: 'A produção de painéis artísticos nos edifícios do modernismo brasileiro
  é decorrente de um dos princípios definidores da arquitetura moderna: o da integração
  das artes. Essa produção, que aconteceu em São Paulo de forma quase concentrada
  no período pós Segunda Guerra Mundial teve especificidades que a diferenciam da
  proposta de renovação moderna da arte do mosaico européia, mais intensa nas Escolas
  de Ravena e Paris. A principal causa dessa diferença, explica-se pelo incremento
  da industrialização brasileira no período pós guerra, com a produção e consumo de
  novos materiais de revestimento para arquitetura, que são adotados pelos arquitetos
  modernos. Um desses materiais, a pastilha de porcelana ou de vidro, foi o material
  mais utilizado na criação de painéis artísticos, quase sempre feita pelas indústrias,
  ao contrário dos mosaicos europeus que citamos, e eram produzidos diretamente pelos
  artistas, de forma artesanal. Esse aspecto trará aos painéis em mosaico paulistas
  alguns diferenciais de caráter plástico, que dão unidade ao conjunto da sua produção
  no contexto do modernismo brasileiro: com superfícies muito lisas, nas quais não
  se esconde a modulação do material e o seu aspecto industrializado, os painéis em
  mosaico são um novo símbolo da modernidade brasileira.'
keyword: mosaico moderno brasileiro; painéis; arte e arquitetura
