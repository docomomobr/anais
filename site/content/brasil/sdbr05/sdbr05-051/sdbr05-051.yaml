abstract: 'Esse trabalho é resultado de uma pesquisa realizada no acervo de documentos
  do Arquivo Público e Histórico de Ribeirão Preto, relativo ao Plano Diretor da cidade
  elaborado no ano de 1945, pelo Engenheiro José de Oliveira Reis. Integra o conjunto
  dos documentos não só os desenhos e mapas da cidade, mas também fotografias, cartas
  e sobretudo um texto escrito por Oliveira Reis para uma palestra na cidade no ano
  de 1955. A análise desses documentos permite compreender uma parte da prática do
  Planejamento Urbano no Brasil, após os anos de 1940: entender suas referências teóricas,
  discurso e ações sobre o ambiente urbano, no momento que o zoning se caracteriza
  como principal instrumento de planejamento. É também um momento importante da História
  do Brasil com o fim do Estado Novo e o início de um período democrático e fortalecimento
  de uma política de autonomia municipal.'
keyword: Planejamento Urbanístico; Zoneamento; Parkways; Ribeirão Preto
