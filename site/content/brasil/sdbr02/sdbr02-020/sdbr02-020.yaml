abstract: Apresenta-se uma avaliação do centro urbano de Brasília a partir de certas
  dimensões morfológicas - a funcional, a bioclimática, a topoceptiva, a co-presencial
  e a expressivo-simbólica - visando oferecer uma moldura conceitual mais transparente
  e objetiva à discussão sobre esta cidade, especificamente, e sobre o urbanismo modernista,
  genericamente. Conclui-se especulando sobre possíveis posturas de intervenção, a
  partir do leque de virtudes e problemas apontados, bem como de suas possíveis implicações.
