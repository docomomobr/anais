abstract: A casa Niclewicz, apesar de constar dos livros que registram a obra completa
  de Vilanova Artigas, é um projeto pouco conhecido e ainda menos comentado e analisado.
  Por trás de um volumetria hermética e elementar se escondem espaços de uma clareza
  e qualidade surpreendentes. Na obra doméstica de Artigas, é um caso raro em que
  o espaço exterior é dotado de tridimensionalidade e rivaliza com o interior como
  foco de interesse.
