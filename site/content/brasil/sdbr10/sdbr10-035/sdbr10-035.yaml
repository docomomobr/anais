abstract: 'Este artigo tem por objetivo analisar a proposta estético-construtiva de
  um conjunto arquitetônico significativo, mas pouco reconhecido.Como foco principal,
  foram selecionados prédios das escolas estaduais construídos pela Comissão de Construção,
  Ampliação, Reparo e Conservação dos Prédios Escolares do Estado – CARPE, criada
  em 1968 e extinta em 1987. Como foco secundário, pretende-se também fazer umabreve
  abordagem sobre o processo histórico-regional de padronização. Apresentaremos alguns
  casos identificadosem parte da Zona da Mata mineira. Maria Alice Bastos e Ruth Verde
  Zein (2011) já estudaram alguns dos resultados da CARPE, dos anos oitenta. Em várias
  cidades da Zona da Mata mineira, muitos exemplares podem ser vistos e muitos outros
  também são encontrados espalhados por todo o estado assim como na capital, Belo
  Horizonte. Seus projetos revelam uma arquitetura de caráter moderno homogêneo que
  se destaca por sua padronização, fácil construção e ao mesmo tempo flexível o suficiente
  para adequação às mais variadas demandas. O uso de estrutura modulada em concreto
  armado e de vedação em alvenaria de tijolo cerâmico maciço, ambos aparentes, de
  cobertura com amplas águas de telhas capa-e-canal e ausência de revestimentos confrontaram
  uma visível tradição local da arquitetura escolar e uma falta de iniciativa modernizadora
  vigente para a produção de espaços de ensino e aprendizagem em larga escala. Em
  geral, a abordagem não era nova. No período pós-Segunda Guerra Mundial, a reconstrução
  europeia exigiu da construção civil reações condizentes com o contexto socioeconômico.
  Embora não tenha sido produzida em série, a concepção da Hunstanton School, em Norfolk
  (Reino Unido), construída entre 1949-54, pode ser considerada referência inovadora,
  no que diz respeito à proposta estético-construtiva para a época. O projeto de Alison
  e Peter Smithson foi logo etiquetado como New Brutalism, em confronto com as abordagens
  contemporâneas do New Empirism e do New Humanism, (cf. BANHAM. In: HATJE, 1963).
  Segundo Jencks (1973), esse movimento era cheio de referenciais históricos tanto
  formais como construtivos. Em uma época de desenvolvimento do parque industrial
  nacional, a preocupação em economia para o estado e a necessidade de construção
  de inúmeras escolas, claramente identificáveis de uma política reformista, demandavam
  a criação de um sistema modular que pudesse facilitar um processo de pré-fabricação
  in loco de um arcabouço pronto para receber elementos padronizados como esquadrias,
  peças sanitárias e mobiliário. A construção de tais estabelecimentos em todo o estado
  visava “garantir índices mínimos de segurança, higiene e eficiência do edifício
  escolar” conforme o artigo 3º da Lei de Criação da CARPE (n° 4817, de 11/06/1968).
  Antes disso, uma campanha institucional política de recuperação dos edifícios escolares
  encabeçada pela CARRPE (1958-68) promoveu um processo licitatório de construção
  de edifícios padronizados e modulados (em madeira, metal ou concreto) destacando-se
  essa ação durante a gestão de Magalhães Pinto (1961-66). Nesse programa, quase 400
  unidades foram instaladas seguindo um padrão de austeridade tanto estética quanto
  construtiva. Nesse sentido, busca-se analisar a representatividade de uma linguagem
  simbólica na padronização de um equipamento urbano de extrema importância em meio
  ao processo de industrialização do país e equiparação de padrões internacionais.'
keyword: Prédios escolares; Padrão CARPE; Zona da Mata mineira
