abstract: 'Deixando aparente o concreto, Le Corbusier incorporou ao material seu aspecto
  natural, dando-lhe um novo sentido sociocultural. Isto acontece, quando o arquiteto
  aceita a reduzida capacidade técnica da mão de obra disponível no sul da França
  por volta do ano 1947, durante as obras da Unidade de Habitação de Marselha, como
  um elemento cultural permanente. “Le betón brut”, do mestre franco-suíço, guarda
  na sua textura a rudez dos trabalhadores argelinos que em sua técnica construtiva
  não consideravam dar um perfeito acabamento às fôrmas artesanalmente fabricadas
  com tábuas de madeira. Reyner Banham em Architectural review (1955) sintetizou em
  três pontos, os apoios aos futuros desenvolvimentos do Brutalismo: imagem memorável,
  exibição clara da estrutura e valorização dos materiais “como encontrados”. Em Architectural
  design (1957), os Smithsons afirmaram que o elemento central do movimento seria
  uma tentativa de aproximar-se da realidade sociocultural de uma sociedade de massas.
  Alguns arquitetos do movimento moderno aproximaram-se da realidade cultural do Brasil
  – uma sociedade com carência de bens industrializados – ao reconhecerem o atraso
  industrial do país como um fenômeno cultural permanente. A partir daí, desenvolveram
  novos materiais e soluções que exploravam o potencial expressivo das técnicas construtivas
  e dos sistemas estruturais. Mindlin (1956), arquiteto ativo do movimento moderno
  brasileiro, em seu livro Arquitetura Moderna no Brasil, destacou na obra de Sergio
  Bernardes: “Um senso de composição abstrata, muito característico deste arquiteto,
  disciplina o uso dos mais variados materiais, empregados não apenas para efeitos
  estéticos, mas também para um objetivo específico, relacionado à orientação de cada
  parte da construção”. A revista Zodiac (1963), publicou a casa de Sergio Bernardes
  no Rio de Janeiro. O artigo descreve a opção do arquiteto em construir uma base
  maciça que prolonga visualmente a solidez do terreno. Quais os materiais e as soluções
  adotadas neste projeto que exploram o potencial expressivo das técnicas construtivas
  e dos sistemas estruturais? Como o arquiteto incorporou ao seu projeto os três pontos
  sintetizados por Reyner Banham? Este trabalho tem como objetivo geral, comprovar
  metodologicamente, através da análise da casa do arquiteto, o argumento que Sergio
  Bernardes reconheceu a realidade do atraso industrial do país como um fenômeno cultural
  permanente. Especificamente, os objetivos são: elucidar quais os novos materiais
  e soluções técnicas que exploram o potencial expressivo das técnicas construtivas
  e dos sistemas estruturais, além de ilustrar como o arquiteto incorporou ao seu
  projeto os três pontos sintetizados por Banham: imagem memorável, exibição clara
  da estrutura e valorização dos materiais “como encontrados”. Para consecução dos
  objetivos específicos, fizeram-se desenhos analíticos, que puderam ser separados
  e comparados. Foi feita a revisão bibliográfica sobre o tema e sobre o referencial
  teórico. A invenção das telhas capa e canal com 4 m de comprimento, obtidas a partir
  de tubos de secções de 10 e 20 cm, cortados ao meio; a utilização do sistema de
  laje pré-fabricada aparente; a ausência de revestimentos, permitindo que o material
  incorpore as texturas do envelhecimento; o teste dos dois arquétipos construtivos:
  a base cavernosa, estereotômica que protege o ambiente familiar e o pavilhão, uma
  cabana moderna, tectônica, aberta à deslumbrante paisagem do oceano, demonstra que
  o arquiteto Sergio Bernardes realmente reconheceu a realidade do atraso industrial
  do país como um fenômeno cultural permanente e criou novos materiais e soluções
  técnicas que exploram o potencial expressivo das técnicas construtivas e dos sistemas
  estruturais. Todo isto vem para reafirmar o valor da obra do arquiteto Sergio Bernardes
  como uma referencia no conhecimento autônomo da arquitetura como disciplina de projetar
  e construir edifícios.'
keyword: Brutalismo; Sergio Bernardes; Arquitetura Moderna
