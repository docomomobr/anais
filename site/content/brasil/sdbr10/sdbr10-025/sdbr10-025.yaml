abstract: 'A estrutura parece mesmo ter sido a personalidade da arquitetura brasileira
  do século XX. Seu desenho, de aparente simplicidade, expõe a sofisticada capacidade
  criativa de seus autores. Se a nossa arquitetura contribuiu significativamente para
  o avanço da tecnologia estrutural e construtiva, o inverso é verdadeiro: ela só
  foi viabilizada pelo conhecimento técnico disponível no país. Porém, a maior preocupação
  dos arquitetos hoje parece ser a revisão e avaliação do que já foi feito, mais do
  que a definição de um novo rumo. O que se vê hoje é uma arquitetura que não apresenta
  nenhuma das características consideradas essenciais para superar a moderna. Em minha
  pesquisa de mestrado, baseada em um enfoque teórico, descritivo e comparativo, procurei
  identificar os vários modos de usar e conceber a estrutura e sua relação com o todo
  do objeto e projeto arquitetônicos, procurando-se entender de que maneira se pode
  relacionar método de trabalho com as diferentes intensidades de consideração da
  dimensão tecnológica na projetualidade dos exemplos de casos analisados, projetos
  laureados em concursos nacionais de anteprojetos entre 1958 e 1969. Em um número
  considerável desses casos, a arquitetura e a estrutura estão de tal forma imbricadas
  que não é possível distingui-las. Por seus aspectos construtivos e tecnológicos,
  muitas dessas obras apresentavam tendências, afinidades e aproximações brutalistas,
  quando não se caracterizavam completamente pelos fundamentos desta Escola Paulista.
  O desenvolvimento dos projetos arquitetônicos onde o desafio está diretamente ligado
  à simples resolução programática é caracterizado pelo uso dos aspectos construtivos
  apenas como forma de viabilizar a construção e permanência dos edifícios, seu mero
  funcionamento. Essa mostra como o edifício é construído e, ao mesmo tempo, tem mais
  responsabilidade na formação do todo construído. Quando elemento de maior ênfase
  formal, com forma escultórica ou não, destaca a tecnologia presente nas edificações.'
keyword: Estrutura; Arquitetura; Técnica construtiva
