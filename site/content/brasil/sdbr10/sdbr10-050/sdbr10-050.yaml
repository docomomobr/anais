abstract: A presente comunicação desenvolve-se a partir da análise da interface entre
  a atividade projetual e o pensamento sobre arquitetura (presentes em textos inéditos)
  do arquiteto Assis Reis. Apesar de seu papel relevante para a arquitetura moderna
  baiana, as referências à produção do arquiteto são, ainda, restritas e, em muitos
  casos, pontuais. Nesse sentido nos propomos como objetivos, num primeiro momento,
  analisar algumas das suas obras mais representativas como o Centro Médico Albert
  Schweitezer (1967), o Pavilhão de Osaka (1970), e a Casa Elza Santa Izabel da família
  Pedreira Lapa(1975); estes projetos evidenciam, em diversas escalas e em distintas
  formas, as primeiras aproximações, experiências e influências da arquitetura brutalista
  na obra de Assis Reis. Depois, num segundo momento, centramo-nos na análise de seu
  projeto mais representativo, a Sede da Companhia Hidro Elétrica do São Francisco
  (CHESF), construído em 1977. Mesmo que Assis Reis não tenha afirmado de forma clara
  essa influência em seus projetos, a partir de seus escritos e depoimentos fica clara
  essa aproximação ao expressar, por exemplo, que na CHESF conseguiu a “conivência
  pacífica do milenar tijolo, o concreto protendido, símbolo da sociedade industrial,
  e o aço” explorando as qualidades plásticas e estruturais de cada um deles, mostrando-os
  e utilizando-os segundo suas caraterísticas intrínsecas.
keyword: Brutalismo; Assis Reis; Arquitetura
