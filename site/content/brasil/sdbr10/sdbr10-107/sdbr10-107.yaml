abstract: 'A arquitetura moderna brasileira é reconhecida por sua considerável diversidade
  de produção, algo inerente a dimensão continental do país. Goiânia, cidade projetada,
  é concebida na década de 1930 como produto da “marcha para o oeste”, consolidando
  sua presença como lugar moderno a partir dos anos 1950. Provenientes basicamente
  de quatro cidades —Rio de Janeiro, São Paulo, Belo Horizonte e Brasília—, os profissionais
  que então atuam em Goiânia são oriundos de centros de ensino de excelência e encontram
  um ambiente profícuo para desenvolver novos caminhos —ideias, ideais e imaginários—,
  em um período plural, onde os ecos da arquitetura associada a "escola carioca",
  passam a dar lugar a razão brutalista, a partir dos anos 1960. Como virtual capital
  da Região Centro-Oeste do país, a cidade conta com um expressivo legado arquitetônico
  associado ao "brutalismo”. Um brutalismo de certo modo "fronteiriço", cujo imaginário
  é identificado com narrativas presentes na produção arquitetônica local e que irá
  ultrapassar a década de 1980. Estas narrativas avançam além da utilização do concreto
  armado como paradigma, adotando determinadas elaborações espaciais, formais e técnico-construtivas
  que permitem adaptar-se as condições e limites locais. Os primeiros exemplares a
  exibir os reflexos da linguagem brutalista exibem referências formais onde se identificam
  traços das edificações universitárias de Vilanova Artigas e Carlos Cascaldi, notadamente
  nos projetos da FAU-USP (1961-8) e da Faculdade de História e Geografia da USP,
  obras então contemporâneas. É do inicio da década de 1960 o projeto, também no âmbito
  universitário, para a Faculdade de Direito da Universidade Federal de Goiás (1964),
  de autoria de Luiz Ozório Leão Duarte, egresso da FAU-USP. A presença do brutalismo
  na arquitetura goiana irá prolongar-se até o final da década de 1980, na qual se
  destaca a construção do Terminal Rodoviário de Goiânia (1985) –projeto dos arquitetos
  Luiz Fernando Teixeira e Moacyr Paulista Cordeiro, ambos formados na FAU-UNB, e
  que contou com a consultoria de Paulo Mendes da Rocha. Este último, representou
  um importante marco para a disseminação da linguagem associada a arquitetura brutalista
  paulistana, ao possuir três significativos projetos construidos em Goiânia: o edifício
  sede do Jóquei Clube de Goiás (1962), a residência Odilon Moreira (1963) e o Estádio
  Serra Dourada (1975). Partindo desta premissa, a investigação visa relacionar, de
  forma circunstanciada, algumas obras capitais desta vertente em Goiânia, procurando
  identificar e (re)construir histórias, imagens e narrativas, de alguma forma perdidas
  pelo tempo e paisagens da cidade.'
keyword: Brutalismo; Goiânia; história da arquitetura e da cidade
