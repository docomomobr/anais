abstract: 'O estudo analisa as obras modernistas de duas construções relacionadas
  a educação corporativa em Presidente Prudente-SP. As edificações do SENAC-Serviço
  Nacional de Aprendizagem Comercial e do SENAI-Serviço Nacional de Aprendizagem Industrial
  são de características da escola paulista de arquitetura, estão localizadas próximas
  e foram construídas na metade da década de 1960 e início da década de 1970, na então
  periferia da cidade. Os autores não são nativos da cidade e as concepções foram
  realizadas por arquitetos atuantes na cidade de São Paulo, sendo o primeiro projeto
  do reconhecido escritório Botti Rubin Arquitetos e o segundo com traços marcantes
  dos idealizadores das pioneiras escolas modernas do SENAI, Roberto Tibau, Hélio
  Duarte e Ernest Mange. Presidente Prudente é uma cidade média do oeste paulista,
  cujo momento econômico favorável na época possibilitou uma produção arquitetônica
  modernista significativa. Nos discursos dos atores que produziram estes espaços
  havia a forte presença de um ideal progressista como solução para os problemas arquitetônicos
  e urbanos, em contraposição ao visto na prática, uma população conservadora com
  anseios modernistas. Neste contexto, um conjunto de obras públicas e privadas foram
  executadas e muitas ainda persistem no tecido urbano atual sem apresentar descaracterizações
  que as comprometam. Essas duas obras apresentam soluções arquitetônicas diferenciadas.
  O SENAC com arrojo estrutural explorando a tecnologia construtiva e plástica do
  concreto armado aparente, tradicional do brutalismo paulista. Por outro lado, o
  SENAI com uma solução estrutural simples de pilares e viga, uma obra sóbria a primeira
  vista, mas que ao adentrar e percorrer seus espaços revela uma rica composição de
  um repertório composto por elementos da arquitetura modernista. As soluções formais
  apresentam diferenças expressivas, mas o discurso e seus princípios projetuais estão
  inseridos no ideário da escola paulista de arquitetura. Apesar de serem concebidas
  por tipologias distintas apresentam similaridades e dentre as opções em comum de
  projeto destacam-se: o volume único, a solução do pátio interno que define a organização
  espacial do edifício, o uso de soluções para o conforto térmico local explorando
  a iluminação e a ventilação natural, assim como a utilização de pouca variedade
  de materiais, a austeridade construtiva e a clareza estrutural. Desse modo, esta
  pesquisa visa compreender uma produção arquitetônica modernista fora do eixo das
  grandes cidades, realizando um inventário arquitetônico dessas obras para iniciar
  um processo de reflexões sobre a sua implantação no tecido urbano das cidades médias
  paulistas verificando a permanência ou não de seus desígnios na sua configuração
  atual. Assim, levanta os projetos concebidos e os desígnios imaginados por seus
  projetistas e observa suas reações de apropriação socioespacial para verificação
  da permanência dos princípios do modernismo paulista. ⏐ 2 Reforça que, do mesmo
  modo que a arquitetura moderna está condicionada por sua materialidade e concepção
  estrutural, a manutenção da função educacional original no contexto atual foi fundamental
  para a preservação dos edifícios. Dessa forma fornece subsídios para o debate das
  possibilidades de intervenção que garantam a salvaguarda deste importante patrimônio
  arquitetônico e urbanístico num contexto de produção do espaço urbano de predomínio
  dos interesses privados, com valores imobiliários se impondo sobre os valores históricos
  e culturais das cidades, em contraposição ao desenvolvimentismo promovido pelo poder
  público na década de 60 e 70. Resumo (máximo de 600 palavras), fonte Arial 10 normal,
  espaçamento simples.'
