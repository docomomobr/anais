abstract: O artigo discute o brutalismo cearense, destacando as principais realizações
  concebidas entre 1970 e 1980 e situando-o no contexto local e nas suas interações
  com o cenário nacional e internacional. O recorte cronológico coincide com o momento
  em que a tendência brutalista, padronizada por boa parte dos arquitetos paulistas,
  se torna hegemônica no Brasil. A arquitetura moderna cearense pode ser abordada
  em dois momentos. A primeira geração é formada por arquitetos graduados no Rio de
  Janeiro e em Recife e que retornam a Fortaleza a partir de 1950. A segunda geração
  é constituída pelos formados na USP, UNB, UFRJ, UFPE e os egressos da própria Escola
  de Arquitetura da UFC, que se agregam aos precursores. Entre 1970-80, o meio profissional
  se amplia e se consolida, iniciando nova fase na arquitetura cearense, orientada
  principalmente pelas referências formais e construtivas da vertente brutalista.
  Destaca-se uma demanda por projetos de encomenda estatal de grande significado para
  a cidade. Outra tipologia que figura entre as importantes realizações afinadas com
  o brutalismo são as obras residenciais em vários bairros, com destaque para as novas
  possibilidades formais e construtivas.
keyword: Arquitetura Brutalista; Arquitetura Moderna; Ceará/Brasil
