abstract: 'Este trabalho caracteriza a produção arquitetônica de Julio Pechmann, significativa
  na paisagem urbana, na cidade de Curitiba. O estudo é resultado de uma pesquisa
  de iniciação científica do curso de Arquitetura e Urbanismo da Universidade Positivo
  e visa apresentar e analisar as soluções adotadas pelo arquiteto no desenvolvimento
  de projetos de residências, nas décadas de 70 e 80. Adota-se, como hipótese de classificação,
  tal produção como tardo moderna. Este fato decorre da observação inicial do conjunto
  de residências desse arquiteto, que apresenta elementos incomuns ao repertório do
  modernismo clássico, trazido para Curitiba pelos cariocas nos anos 50, e pelos paulistas
  no início dos anos 60, distante também das influências internacionais, que arquitetos
  locais adotaram claramente. Os pressupostos teóricos utilizados no desenvolvimento
  do trabalho, para classificá-lo como tardo moderno, se baseiam no pensamento de
  historiadores e arquitetos que escreveram sobre o tema, com especial atenção neste
  trabalho para os livros de William Curtis (2008), sobre arquitetura moderna internacional,
  Yves Bruand (2003), Henrique Mindlin (1999), Hugo Segawa (1999) e o texto de Maria
  da Graça Santos (2003), sobre arquitetura moderna brasileira e os livros de Alberto
  Xavier (1986), Irã Dudeque (2001) e Salvador Gnoato (2009), sobre arquitetura moderna
  em Curitiba. As etapas do estudo, que se evidenciam nas análises feitas em três
  residências projetadas entre os anos 70 e 80, como também suas conclusões, são aqui
  apresentadas. Neste sentido, foram selecionadas para análise a casa localizada na
  Rua Assunta Biagini, n°1215 esquina com a Rua Lúcio Rasera, bairro Bigorrilho, datada
  em 1977, identificada como Casa 1. A casa localizada na Rua Hermes Fontes, n°405,
  bairro Batel, datada em 1979, identificada como Casa 2. A casa localizada na Rua
  Fernando Simas, n°1010, bairro Mercês, datada em 1989, identificada como Casa 3.
  Os elementos de análise das residências correspondem aos estudos de: a) Inserção
  urbana, considerando a escala e os usos do entorno imediato; b) Implantação, considerando
  como tais condições topográficas do terreno, a insolação e os ventos predominantes;
  c) Volumetria, que visa interpretar ou situar as características modernas das casas;
  d) Organização dos espaços em plantas, que visam caracterizar o processo de racionalização
  adotado. Os resultados das análises das três residências identificam características
  que permitem enquadrá-las no período em que a produção arquitetônica foi denominada
  como tardo moderna, por apresentar elementos arquitetônicos mais expressivos, quase
  maneiristas, tendendo muitas vezes a incorporar claramente influências regionais,
  afastando-se do purismo que marcou o modernismo arquitetônico em sua primeira fase.
  Nesta perspectiva, podem ser listadas as seguintes características: • Adoção de
  telhados com grande inclinação, dominando a composição espacial e destacando- se
  na paisagem urbana; • Utilização de recortes nos telhados para varandas e elementos
  zenitais, para propiciar melhor aproveitamento das condições de ventilação e insolação;
  • Áreas generosas para o setor íntimo e de lazer, incorporando inovações, evidenciando
  o alto poder aquisitivo dos proprietários; • Alia-se ao item anterior o fato das
  residências estarem localizadas, em bairros vizinhos ao centro, em áreas de expansão
  da cidade, voltadas para classe alta. Apesar da volumetria regular da implantação
  e do fato de quase sempre estar paralela à linha da divisa, os espaços internos
  estão organizados em 45°, revelando a dinâmica da composição e distribuição dos
  cômodos.'
