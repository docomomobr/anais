abstract: 'Palácio do Itamaraty (Brasília, 1962) e Palazzo Mondadori (Milão, 1968).
  Dois momentos marcantes na carreira de Oscar Niemeyer e decorrentes de dois períodos
  de profundas reflexões pessoais e projetuais. Em ambas as obras, pode-se investigar
  e discutir possíveis entrelaçamentos em relação à arquitetura brutalista. Derivadas
  da primeira inflexão na carreira de Niemeyer, iniciado em 1954, ao arquiteto passam
  a interessar as criações compactas simplificadas e geométricas e as questões hierárquicas
  de caráter arquitetônico de unidade e de harmonia, expressas por suas próprias soluções
  estruturais (tidas como partes integrantes dos conceitos plásticos originais). Como
  resultado, a inflexão projetual daí derivada é exercitada formalmente por Niemeyer
  nos projetos dos edifícios brasilienses, sobretudo quanto à volumetria sintética,
  limpa e de acentuada presença plástica – como no Palácio do Itamaraty. Quem sabe
  inspirado tanto nas arquiteturas clássicas da Antiguidade ou nos ensaios volumétricos
  predominantemente cúbicos das Maisons Citrohan corbusianas, ou mesmo pelos volumes
  miesianos em forma de caixas envidraçadas, estruturadas em aço e confortavelmente
  inseridas em seus contextos paisagísticos e citadinos, o fato é que o prisma fechado,
  pousado no chão e volteado por um peristilo de ritmo constante permite plena integração
  do Palácio à Esplanada dos Ministérios (sítio urbano no qual se insere). Todavia,
  é possível afirmar que essa obra carregue consigo certa “falsidade” projetual e
  construtiva. A liberdade formal de Niemeyer para conferir mais leveza e plasticidade
  à área externa motiva interpretações equivocadas quanto à sustentação do edifício.
  Tanto é que os pórticos externos não se responsabilizam pela função portante do
  conjunto edificado. Assumem, pois, um papel limitado ao simbolismo e a questões
  de cunho estético. O segundo ponto de mudança de pensamento de Niemeyer ocorre na
  segunda metade da década de 1960, oportunidade na qual assume um viés fortemente
  estruturalista e que alça a solução portante do edifício à parte integrante e de
  mesmo nível de relevância que os demais elementos arquitetônicos. Um exemplo desta
  nova fase é dado pelo Palazzo Mondadori, construído na planície lombarda milanesa.
  Esta obra que carrega consigo a “novidade” de imputar à colunata uma função não
  apenas contemplativa, mas de atribuição estrutural portante, é vista por muitos
  como uma evolução do vocabulário utilizado pelo arquiteto anteriormente, no Palácio
  do Itamaraty. Além disso, neste projeto a estrutura responsabiliza-se pela adequação
  arquitetônica e de organização de espaços, visando sempre alcançar os limites máximos
  tecnológicos e construtivos. Como resultado, obteve-se uma obra que adota grandes
  estruturas de maneira ousada, porém com resultado harmonioso e consciente, sem exageros
  e com uma expressividade estética singular. Essas características, quando analisadas
  em conjunto ou em partes, permite uma clara aproximação com o fazer projetal brutalista.
  O objetivo deste artigo é, assim, propor uma investigação sobre duas obras notáveis
  do repertório arquitetônico de Oscar Niemeyer: o Palácio do Itamaraty e o Palazzo
  Mondadori, estabelecendo relações entre elas e a arquitetura brutalista. Para tanto,
  busca-se, primeiramente, analisar as obras propriamente ditas mais que aquilo que
  delas já foi publicado – o que pode conferir mais autonomia ao processo e limitar
  as influências externas. Concomitantemente e baseando-se em Bastos e Zein (2010),
  identificam-se características que as qualifiquem, aproximem ou distanciem do brutalismo:
  partido, composição, elevações, sistema construtivo, texturas, ambiência lumínica
  e características simbólico-conceituais.'
keyword: Oscar Niemeyer; Brutalismo; Arquitetura Moderna
