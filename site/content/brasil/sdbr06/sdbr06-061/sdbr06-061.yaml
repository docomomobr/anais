abstract: O trabalho trata dos propósitos e conteúdos ideológicos originalmente atribuídos
  ao modelo espacial dos grandes conjuntos habitacionais, as reinterpretações, ao
  longo do tempo, quanto aos significados percebidos dessas formas arquitetônicas
  e urbanísticas. Examina o conceito modernista de habitação popular quanto ao contexto
  em que foi gerado, tendo por base - a eficácia funcional apreendida da arquitetura
  popular rural e a lógica mecanicista da linha de produção automobilística – e por
  propósito a promoção social das classes operárias. Analisa os resultados dessa ‘soma’
  na França e no Brasil, as mudanças significativas nos contextos político, econômico,
  cultural, social e político que marcaram, diferentemente, do nascimento à condenção.
  O texto finaliza examinando o ‘culpado’, as críticas e questionamentos que se somaram
  como justificativa para a condenação, à luz da perda de legitimidade da premissa
  projetual inicial de inclusão social que marcou a ação governamental à época do
  seu nascedouro.
keyword: Modernismo; Habitação Popular; Conjuntos Habitacionais
