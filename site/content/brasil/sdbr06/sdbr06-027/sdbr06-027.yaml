abstract: A permanência do patrimônio cultural construído é uma fonte muito rica de
  leitura e de análise histórica. A interpretação do que é representativo culturalmente
  estará sempre relacionada à época e aos agentes (elite intelectual, Estado, grupos
  étnicos marginalizados) envolvidos no processo. Neste contexto, os processos de
  tombamento (1938) constituem uma prática muito significativa da política de preservação,
  bem como registro dos confrontos e conflitos de interesse da sociedade civil brasileira.
  Na chamada fase heróica (1938-1960) do Instituto do Patrimônio Histórico e Artístico
  Nacional, os agentes autorizados do patrimônio nacional contribuíram na construção
  de uma tradição brasileira com base na noção moderna de progresso e nacionalismo.
  O objetivo deste artigo é investigar nos processos de tombamento federal de jardins
  e parques públicos da cidade do Rio de Janeiro os conflitos de interesse político,
  econômico e ideológico que pontuaram as medidas de preservação desde a implantação
  do serviço de preservação no Brasil.
