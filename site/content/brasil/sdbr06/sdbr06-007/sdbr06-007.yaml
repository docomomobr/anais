abstract: Nos anos de 1953 e 1954 vieram ao Brasil cinco arquitetos estrangeiros que
  escreveram textos críticos sobre a arquitetura brasileira. Dentre estes, foi o arquiteto
  e artista suíço Max Bill, devido ao caráter contundente de suas críticas, aquele
  cujo discurso gerou maior polêmica e atraiu maior atenção por parte dos arquitetos,
  críticos e a imprensa local. No entanto, os outros quatro arquitetos, o alemão Walter
  Gropius, o italiano Ernesto Nathan Rogers, o japonês Hiroshi Ohye e o inglês Peter
  Craymer, mesmo se tocando em pontos negativos característicos da produção arquitetônica
  brasileira, expuseram de forma mais moderada seus pensamentos, oferecendo um painel
  que ajuda a compreender a justeza ou não das críticas de Max Bill. Aspectos como
  o formalismo excessivo e a negligência por parte dos arquitetos brasileiros frente
  aos aspectos sociais do país foram abordados nestas críticas. Os comentários correspondiam
  a temas anteriormente discutidos entre os arquitetos locais e, ao intensificar o
  debate crítico interno, foram importantes para o posterior desdobramento da arquitetura
  brasileira. Serão analisados neste texto aspectos presentes no texto destes quatro
  arquitetos.
keyword: Crítica; Arquitetura; Gropius
