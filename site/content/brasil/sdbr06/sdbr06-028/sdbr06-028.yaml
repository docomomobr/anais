abstract: No início do século XX, quando começam a surgir as primeiras salas de cinema
  a palavra de ordem era modernizar. Era necessário um ‘cenário’ atraente para se
  adequar a essa metrópole moderna com os novos espaços públicos dentro dos padrões
  civilizados. Um dos símbolos dessas transformações da cidade moderna, sem dúvida,
  foram as salas de cinema, com sua arquitetura expressiva, volumes puros, sem ornamentação
  historicista, os letreiros luminosos, sinônimo de modernidade e progresso. O presente
  trabalho trata de como a arquitetura das salas de cinema revelavam uma modernidade
  sobretudo a arquitetura dos cinemas de bairro e como a decadência dos cinemas levou
  a destruição de parte deste acervo desta arquitetura.
