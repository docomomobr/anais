abstract: 'O objetivo desse trabalho é interpretar e relacionar as duas principais
  vertentes da produção de Sérgio Ferro: sua obra arquitetônica, representada aqui
  pelas residências Bernardo Issler e Boris Fausto e seus escritos teóricos, que são
  resultado de seu envolvimento na cena política e cultural, no período delimitado
  entre o final dos anos 1950 e o início da década de 1970. Desse cenário surgiram
  seus conceitos e suas propostas, que primavam pelo engajamento crítico em relação
  à realidade social brasileira, o que levou ao questionamento das concepções e modelos
  de desenvolvimento e a um contato mais direto com os problemas da construção civil,
  particularmente, com a realidade do canteiro de obras e levando-o a propor o uso
  de materiais e técnicas mais acessíveis à população, um relacionamento diferente
  com os trabalhadores e formas arquitetônicas compatíveis com esses materiais, técnicas
  e com as preocupações com o trabalho, ou melhor, com a forma que o trabalho adquiria
  na indústria da construção civil, vale dizer, no canteiro de obras. Nesse sentido,
  se mostra de extrema importância a relação do arquiteto com os principais fatos
  que marcaram essa época e conseqüentemente influenciaram sua produção, como o seu
  engajamento político-partidário junto ao PCB, o golpe de 1964, a crítica à linha
  política do partido e a ruptura com ela, a relação com a intelectualidade e as conseqüências
  do endurecimento do regime com perseguições e prisões, inclusive a sua própria.
  Com isso, pretende-se estabelecer uma interlocução entre conceitos e obras, verificando
  as concordâncias e contradições desse arquiteto que marcou profundamente a arquitetura
  moderna brasileira.'
