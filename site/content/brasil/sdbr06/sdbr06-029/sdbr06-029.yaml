abstract: No arquivo Garland Mies van der Rohe do Museu de Arte Moderna de Nova York,
  estão publicados uma série de croquis, anotações e documentos técnicos, referentes
  ao projeto de 1957 de Mies van der Rohe para o consulado dos Estados Unidos em São
  Paulo. A análise e organização de todo material publicado no catálogo permitiram
  algumas conclusões importantes sobre a evolução das propostas e reconhecimento das
  decisões técnicasconstrutivas para o projeto do edifício consular. Através da análise
  do material gráfico, desde os primeiros croquis até as fases de detalhamento da
  proposta final, foram estabelecidas referências importantes com projetos já conhecidos
  de Mies, que certamente serviram de base para o projeto do arquiteto no Brasil.
  Como parte do processo analítico, redesenhou-se boa parte do projeto arquitetônico.
  A procura de referências em projetos desenvolvidos, simultaneamente, ou já existentes,
  permitiu aceder-se a uma esfera de relações “construtivas” já bastante referidas
  pela crítica durante anos, mas que nunca deixa de ser surpreendente, sobretudo porque
  se acredita que aí pode residir um dos grandes valores para o projeto arquitetônico.
