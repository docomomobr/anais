abstract: 'Lucio Costa e Fernando Távora desenvolveram métodos de projeto que coincidem
  no apelo à tradição para a criação de arquitetura Moderna. O que revela este trabalho
  são dois desdobramentos deste método: o primeiro recorre a símbolos que representam
  tanto a tradição como a Modernidade e que, lidos ao mesmo tempo, realizam a pretendida
  integração dos dois momentos; o segundo parte para um complexo trabalho de síntese
  em que a construção Moderna, tomando parte em um contexto construído de importância
  histórica, recria o processo gerador daquele espaço, constituindo um conjunto em
  que coexistem de maneira não hierárquica as construções novas e as que são essencialmente
  a tradição. Como leitura desses dois processos, o que se revela é, no fundo, uma
  determinação em realizar a arte em arquitetura, isto é, em consolidar a intenção
  plástica na obra construída.'
keyword: Arquitetura Moderna; Tradição; Plástica
