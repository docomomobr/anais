abstract: 'Trata-se de uma reflexão acerca de alguns aspectos da arquitetura brasileira
  que foi produzida num recorte histórico de aproximadamente vinte anos: entre o final
  dos anos 50 e final dos 70. O trabalho enfoca, por um lado, a orientação crítico
  teórica dominante no período, responsável pela afirmação de uma arquitetura moderna
  “oficial” brasileira, e seus esforços em defender uma identidade nacional baseada
  no uso do concreto armado dentro da sua expressividade plástica e, por outro, um
  dos caminhos ao longo dos quais a prática mostrou uma renovação no período e que
  não foi devidamente avaliado na ocasião.'
