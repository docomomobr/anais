abstract: Este trabalho procura analisar, no âmbito do universo das discussões teóricas
  dos CIAM, o surgimento de uma conscientização sobre a importância do caráter dos
  centros antigos das cidades, na contramão do esforço que os próprios CIAM vinham
  empreendendo, desde a década de 1930, para a implantação do ideário urbanístico
  expresso na Carta de Atenas. As visões de Ernesto Nathan ROGERS e Sir James Maude
  RICHARDS sobre o “coração” da cidade, no VIII Congresso, ocorrido em 1951 em Hoddesdon,
  reconhecendo o valor das “pré-existências” e do “caráter do lugar”, resgatam o papel
  da “história” e do “passado”, recolocando-os como personagens vivos do presente
  e não apenas uma variante dentro do projeto moderno.
