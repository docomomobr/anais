abstract: Relato sobre arquitetura moderna no Bairro de Higienópolis, em São Paulo,
  SP, a peculiaridade desse acervo e sua preservação. Critérios utilizados para a
  preservação dessa arquitetura. Discussão da importância de instrumentos urbanísticos
  para a preservação de bens arquitetônicos, aliados a instrumentos tradicionais como
  o tombamento, a partir da experiência desenvolvida em São Paulo.
