abstract: O artigo consiste em apresentar a divulgação da arquitectura moderna brasileira
  em Portugal com enfoque nos artigos publicados nas revistas periódicas portuguesas
  especializadas, assim como na bibliografia não periódica – estrangeira e nacional
  – presente no país. A década de 30 marca o arranque do estudo que se estende até
  à época da concepção do projecto de Brasília. São identificadas quatro fases na
  análise. A primeira fase implica o reconhecimento alcançado no cenário internacional
  das produções realizadas no Brasil. Está voltada para o impacto que a nova arquitectura
  moderna brasileira causa em Portugal, e apoia-se na divulgação das obras realizadas
  no Brasil evidenciando as características plásticas inovadoras então definidas.
  A segunda fase significa uma adesão máxima às inovações, formais, construtivas e
  espaciais contidas nos programas da arquitectura moderna brasileira por parte dos
  arquitectos portugueses. A busca das raízes culturais da modernidade brasileira
  alicerçou uma maior identidade arquitectónica entre os dois países. Na terceira
  fase detecta-se um decréscimo de interesse nessa relação, ao mesmo tempo que a historiografia
  portuguesa procede ao reconhecimento da influência anteriormente recebida. Analisaram-se
  as diferentes visões dos autores portugueses sobre o tema. Uma quarta fase implicaria
  um reatar do interesse português pela arquitectura brasileira, incluindo agora novas
  formas de produção, comunicação e recepção.
