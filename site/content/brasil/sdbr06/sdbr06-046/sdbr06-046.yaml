abstract: 'Pela construção de um cenário marcado pelo embate entre dois tipos de arquitetura,
  aqui, denominadas como “Street Dog”, que se trata da arquitetura moderna, e os “lulus”
  ou a arquitetura eclética; poderíamos entender um momento norteado pela procura
  por uma linguagem arquitetônica representativa da nação brasileira e de seu homem.
  Vários personagens se envolveram nessa discussão, do lado dos modernos, todos tinham
  formação em Escolas estrangeira. E do lado dos ecléticos, existia uma mescla entre
  engenheiros-arquitetos formados nas escolas de engenharia de São Paulo – Politécnica
  e Mackenzie – e arquitetos formados em escolas no exterior. Jayme da Silva Telles
  se insere nesse cenário pela peculiaridade ser formado arquiteto na Escola Nacional
  de Belas Artes, localizada no Rio de Janeiro. Assim, é interessante pensar o papel
  dos atores individuais nos debates estabelecidos em um determinado período, na produção
  arquitetônica e na construção das cidades para verificar como estas relativizam
  ideologias pretensamente totalizadoras e flexibiliza a unanimidade no discurso.
  Essa abordagem mostra como no caso do I Congresso de Habitação não havia uma única
  proposta que reivindica o papel de solucionar o problema da habitação, e, concomitantemente,
  havia diversas modernidades pretendidas. Este trabalho propõe, portanto, sobre este
  aspecto, uma análise das propostas projetual e idéias publicadas sobre a provisão
  de habitações para os operários de São Paulo por Silva Telles. Adiantaremos que
  estas são calcadas nas proposições pretendidas por Le Corbusier, publicadas inicialmente
  na revista l’Esprit Nouveau e depois agrupadas no livro: “Vers une Architecture”,
  com as quais Silva Telles teve contato nos anos de formação. O texto remete inicialmente
  ao ambiente cultural em que se deu a formação deste arquiteto, suas referências
  e interlocutores, como a atuação projetual no âmbito da habitação e sua proposta,
  um tanto ousado, de “street dogs” para os operários do Cotonifício Rodolfo Crespi,
  concurso ocorrido em 1925.'
keyword: modernidade; arquitetura; habitação operária
