abstract: Por representar a consolidação de uma arquitetura moderna tipicamente brasileira,
  que conseguiu atingir quase todos os setores da sociedade da época, o estudo da
  arquitetura da década de 1950 no Brasil se mostra de grande relevância para o entendimento
  deste importante momento da história do país. Desta maneira, através do estudo apresentado,
  pretende-se diagnosticar os principais problemas de conservação encontrados nos
  revestimentos externos de obras residenciais construídas no período, de maneira
  a traçar parâmetros que permitam compreender os principais processos de deterioração
  nos materiais de emprego mais freqüente em função da linguagem utilizada e das condições
  sob as quais se encontram. A partir da análise de um dos principais exemplares da
  arquitetura residencial da época, a residência de Walter Salles, poderá ser feita
  uma comparação com os problemas encontrados em outros exemplares, construídos pela
  classe média carioca que utilizam a mesma linguagem. Este diagnóstico, realizado
  através de visitas e observação aos exemplares escolhidos de maneira a identificar
  os danos, comparar os resultados e entender suas causas, certamente irá contribuir
  para os processos de conservação, uma vez que, traçando um padrão dos principais
  problemas, pode-se encontrar a melhor maneira de trata-los.
keyword: Conservação; Residências; Arquitetura Moderna
