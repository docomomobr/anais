abstract: 'O presente trabalho pretende abordar um episódio da maior importância para
  o devir do Movimento Moderno no Brasil: a meteórica passagem de Lúcio Costa pela
  diretoria da Escola Nacional de Belas Artes (ENBA), entre 1930 e 1931. Não bastasse
  o significado do episódio em si, sobejamente destacado em depoimentos de arquitetos
  considerados pioneiros da arquitetura moderna brasileira, ele implica em questionamentos
  sobre outro fenômeno fundamental do período: o engajamento – até então imprevisível
  - de Lúcio Costa entre os partidários do modernismo arquitetônico. Por outro lado,
  ambos os aspectos da questão apresentam-se surpreendentemente carentes de pesquisas
  aprofundadas. Assim, procuraremos contribuir para o esclarecimento das muitas lacunas
  existentes, apresentando alguns resultados de pesquisa empreendida com auxílio FAPESP
  em fontes primárias livros de registros e de atas da própria ENBA -, complementados
  por artigos de revistas e jornais de época.'
keyword: modernismo; história da arquitetura brasileira; neocolonial
