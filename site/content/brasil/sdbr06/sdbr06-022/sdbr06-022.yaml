abstract: Este trabalho pretende refletir sobre o tema da síntese das artes, fundamental
  na constituição da Arquitetura Moderna no Brasil, que se caracterizou pelo trabalho
  integrado de pintores, escultores, arquitetos e paisagistas. Esta arquitetura é
  devedora da estadia de Le Corbusier no Brasil (1936) e sua participação no projeto
  para o edifício do Ministério da Educação e Saúde, onde destaca-se as contribuições
  de Lúcio Costa e Oscar Niemeyer. No segundo pós-guerra o tema da síntese das artes
  ganha nova ênfase no Brasil sendo objeto de debate nos Congressos de Arquitetura
  e Arte realizados durante a década de 1950 e assim estabelecendo conexões com o
  debate internacional que ocorre no período principalmente através do CIAM, tendo
  como principais protagonistas Giedion e Sert, que colocam a integração entre as
  artes na elaboração de centros cívicos voltados para experiências coletivas. Daremos
  especial atenção ao Congresso Internacional de Críticos de Arte, realizado em 1959,
  às vésperas da inauguração de Brasília, que tem como tema central “ A cidade nova,
  síntese das artes”. Este congresso é organizado pelo crítico de arte Mário Pedrosa,
  com a participação de estudiosos nacionais e internacionais como Lúcio Costa, André
  Bloc, Meyer Shapiro e Gillo Dorfles, e tem como objetivo analisar a experiência
  de Brasília a partir do tema da síntese das artes.
