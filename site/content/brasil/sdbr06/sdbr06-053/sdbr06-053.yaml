abstract: para levantar a trajetória do hotel e fornecer à equipe técnica do novo
  projeto fotos da construção e desenhos técnicos dos projetos de arquitetura, estruturas
  e complementares. O principal objetivo do projeto desenvolvido pelo escritório Piratininga
  Arquitetos Associados foi transformar o hotel em edifício público, o que se expressa
  pela alteração nas condições da sua relação com a rua. O andar tipo teve de sofrer
  as alterações mais incisivas, uma vez que a compartimentação dos apartamentos é
  incompatível com o uso de escritórios contemporâneos. Também a infra-estrutura técnica
  passou por transformações para o novo uso, em especial na circulação vertical. Ainda
  que as alterações concebidas para a adaptação ao novo uso tenham resultado em uma
  nova configuração do edifício, os autores aproveitaram a oportunidade para resgatar
  algumas situações do projeto original perdidas nas sucessivas reformas realizadas
  nesses 43 anos. O conjunto de pesquisa e projeto apresentado a seguir constitui
  oportunidade de reflexão sobre a pertinência de conceitos de preservação de patrimônio
  histórico para exemplares da Arquitetura Moderna.
keyword: Lucjan Korngold; arquitetura moderna; preservação
