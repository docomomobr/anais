abstract: O artigo realiza uma investigação histórica do período em que o arquiteto
  Severiano Mário Porto produziu sua arquitetura, com o objetivo de contextualizar
  suas obras, de acordo com os acontecimentos políticos, econômicos e sociais do período
  e as tendências arquitetônicas da época, tanto brasileiras como mundiais. A abordagem
  se dá por décadas, abrangendo desde o período de sua formação, na década de 1950,
  até a década de 1990, quando ele reduziu suas atividades de projeto e fechou seu
  escritório em Manaus-AM. Através disto, procura mostrar que a obra do arquiteto
  é fruto de experiência única vivida na região amazônica, e não deve ser inserida
  em um determinado rótulo ou escola arquitetônica.
keyword: Região amazônica. Arquitetura regional
