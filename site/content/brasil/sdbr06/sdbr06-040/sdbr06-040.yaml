abstract: 'A arquitetura moderna de Passo Fundo possui um exemplar de relevo no cenário
  gaúcho: a residência da Rua Independência projetada por Edgar Graeff. Além desta,
  existem mais duas obras de Graeff que resistem bravamente na massa urbana, traduzindo
  sua atualidade em relação ao contexto nacional. A relevância da casa da rua Independência
  está justamente na coordenação de materiais locais, questões de conforto ambiental
  com as formas racionais do apogeu da modernidade. A edificação está ligada ao tecido
  urbano através do acesso principal constituído de um passadiço com degraus revestidos
  em cerâmica branca onde o recuo de jardim em relação à rua desliga a residência
  do tecido urbano e lhe atribui um ar de construção solene. As técnicas construtivas
  empregadas pelo arquiteto para adequação dos condicionantes físicos ao lugar, apresentam
  soluções adequadas e simplificadas direcionadas em termos de economia. Os materiais
  utilizados na construção apresentam solidez, pouca manutenção e são peculiares da
  região, como a madeira (Muxarabi), basalto (painel de pedra) e o tijolo maciço.
  A transparência modernista também está presente nessa obra, através do painel de
  tijolos de vidro, janela em fita e integração com o jardim interno.'
keyword: modernismo; Edgar Graeff; arquitetura residencial
