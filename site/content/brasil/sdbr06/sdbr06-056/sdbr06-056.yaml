abstract: A arquitetura brasileira moderna até os anos 1960 é um mito; a arquitetura
  brasileira dos anos 1960 é um mistério. O que aconteceu depois de Brasília e antes
  da reflexão crítica do pósBrasília (1975)? Trata-se de período obscuro na historiografia
  da arquitetura brasileira e internacional, apesar de ter havido uma intensa produção
  arquitetônica moderna e radical de alto interesse, que cumpre rever - ou seguirá
  faltando um capítulo sem o qual não é completa a compreensão do presente. Este trabalho
  pretende iniciar uma análise das razões que levaram a essa ausência buscando ampliar
  seu reconhecimento da arquitetura brasileira dos anos 1960; a qual, embora não se
  limite ao Brutalismo paulista, tem no seu estudo isento uma tarefa imprescindível.
  A inauguração de Brasília e o esgotamento das pautas da escola carioca marcam o
  nascimento dessa arquitetura em fins dos anos 1950, paralelamente a manifestações
  assemelhadas em todo o mundo, mas guardando características arquitetônicas próprias,
  ancoradas no panorama cultural nacional e internacional daquele período.
keyword: arquitetura brasileira; brutalismo; arquitetura paulista; identidade cultural
