abstract: 'Nas décadas de 50 e 60 a Faculdade de Arquitetura e Urbanismo de São Paulo
  foi ambiente disseminador de uma série de princípios éticos e estéticos, tendo a
  figura do mestre João Batista Vilanova Artigas como eixo difusor e grande condutor
  destes ideais. A tese de Artigas se referenciava na responsabilidade social do arquiteto,
  que vislumbrava como seu instrumento de emancipação política e ideológica o conceito
  do projeto e do desenho. Os textos de Vilanova Artigas analisados aqui são discursos
  de formatura escritos em 1955, 1958 e 1964, dirigidos diretamente aos seus alunos,
  futuros arquitetos. O interesse é ressaltar as principais idéias e preocupações
  que nortearam as palavras do mestre paraninfo aos jovens arquitetos, além de elucidar
  sua contribuição ao debate da formação entre estudantes, profissionais e especialistas.
  Aluno e estagiário de Artigas, o arquiteto Jorge Caron (1936/2000) respondeu ao
  perfil do "arquiteto completo" idealizado por este grupo da FAU-USP, trabalhou como
  arquiteto e urbanista, educador, paisagista, designer, cenógrafo, cineasta e agitador
  cultural, sem dúvida alguma foi personagem de fundamental importância, tendo trabalhado
  intensamente no campo constitutivo deste rico ambiente de luta pela formação cultural
  do país. É muito provável que Caron comportou-se como ouvinte de Artigas em alguns
  momentos destes discursos. Trata-se aqui de traçar as relações existentes nos textos
  de Jorge Caron e nos discursos de Vilanova Artigas, em que ambos discutem a profissão,
  o trabalho e a organização dos arquitetos, procurando identificar e entender as
  posições convergentes, comuns e assimiladas diretamente do mestre para o aprendiz.
  É interessante notar e compreender alguns desdobramentos, e certos avanços na temática
  muito discutida e polemizada: o campo de atuação do arquiteto.'
keyword: Mestre; Ensino de Arquitetura (FAU-USP); Jorge Caron
