abstract: Freqüentemente presente na obra do arquiteto antes mesmo do debate sobre
  a acessibilidade, em Vilanova Artigas, a rampa é um elemento estruturante do espaço.
  Seu objetivo é unir, realizando a perfeita promenade, da qual se vislumbra a paisagem
  interna ou externa. Assim, realiza a utopia moderna da função “circular”, humanizando-a.
  Ela está entre o chão, onde o apoio canta, e o céu, morada dos deuses. O tema desse
  trabalho é investigar de que forma a rampa participa de um arranjo espacial específico
  criado por Artigas - blocos funcionais independentes em meios-níveis, abertos para
  um vazio central sob uma cobertura única -; um “tipo arquitetônico” que encontra
  no edifício da FAUUSP seu expoente máximo, mas cuja raiz data dos anos de 1940.
keyword: Vilanova Artigas; rampas; arquitetura moderna brasileira
