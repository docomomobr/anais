abstract: 'O trabalho constitui uma análise da assimilação dos princípios modernistas
  do urbanismo nos campi das Universidades Brasileiras e mais especificamente no da
  Universidade Federal Fluminense, que representa um dos poucos campi universitários
  do Brasil inserido no Centro Urbano.

  Primeiramente, será apresentado um panorama da organização universitária brasileira,
  as influências que recebeu para a construção de seu modelo pedagógico e espacial,
  e, a identificação de dois momentos significativos para a implantação do projeto
  modernista: a cidade universitária do Estado Novo e o campus universitário da Ditadura
  Militar.

  O modelo adotado, ainda na década de 1930, seguia as experiências norte-americanas,
  de implantar as instituições em um espaço unificado. Os projetos do campus da Universidade
  do Brasil (atual Rio de Janeiro) e da Universidade de São Paulo são exemplos desta
  1ª fase, que se consolidaram na década de 1960, com a reforma universitária.

  Posteriormente, uma análise dos diferentes campi identifica debates sobre sua localização
  e características dos projetos propostos, o que justifica a adoção do urbanismo
  modernista nestes espaços e as peculiaridades do campus, no caso da Universidade
  Federal Fluminense.

  No Brasil, a organização do ensino superior coincide com a introdução dos princípios
  arquitetônicos e urbanísticos do Movimento Modernista, descritos pela Carta de Atenas,
  resultante do IV CIAM, o que explica a adoção deste modelo, na maioria das cidades.

  O plano Piloto foi realizado ocupando três áreas descontínuas: Valonguinho, São
  Domingos-Gragoatá e Praia Vermelha, localizadas no Centro e em bairros contíguos
  à área central. O plano proposto guardou todos os princípios modernistas: disposição
  racional e funcional dos edifícios no terreno; separação da circulação de veículos
  e pedestres; setorização funcional do espaço, grandes áreas livres "verdes" e via
  expressa periférica limitando o campus.'
