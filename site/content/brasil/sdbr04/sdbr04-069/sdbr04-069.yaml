abstract: 'A influência da arquitetura de Richard Neutra na arquitetura brasileira
  ainda está por ser devidamente estudada. Sua visita ao Brasil, em 1945, a serviço
  do Departamento de Estado dos Estados Unidos, resulta na publicação de livro, em
  1948, em edição bilíngüe, fartamente ilustrada, reunindo os projetos do arquiteto
  para o programa de educação e saúde do governo de Porto Rico, além de alguns projetos
  habitacionais na Califórnia. Elaborados para o governo daquele país, são, no entanto,
  orientados, como afirma o título do livro, Arquitetura social para países de clima
  quente ... e pobres, como o título deixa de mencionar. O impacto do livro, apesar
  de pouco referido, parece ter sido significativo: veio a representar uma importante
  referência para a elaboração de projetos de edificações públicas, sobretudo para
  as redes de ensino. Sua influência parece ter se dado em diversos níveis:'
