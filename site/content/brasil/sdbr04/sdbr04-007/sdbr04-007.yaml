abstract: 'Analisa na produção de Francisco Bolonha, as obras no interior do país
  que incorporaram a participação de diversos artistas. Em um primeiro momento destaca
  sua formação pela primeira turma da Faculdade Nacional de Arquitetura (1945), antiga
  Escola Nacional de Belas Arte e o contato estabelecido com o meio artístico, formador
  de um novo paradigma na cultura moderna brasileira. Estuda o princípio de sua atuação
  focado no interior do país, destaca a Fonte Andrade Júnior em Araxá (MG, 1945) com
  o painel de azulejos de Roberto Burle Marx, capela e residência de Hildebrando Accioly
  em Petrópolis (RJ, 1948), com afresco de Emeric Marcier; e a sede do Clube Juiz
  de Fora-(MG, 1958) com painel de azulejos e mosaicos de Cândido Portinari e Paulo
  Werneck. Em um segundo momento analisa as obras de Bolonha realizadas em Cataguases
  (MG) durante o surto modernista dos anos 40 e 50, e os agentes viabilizadores dessa
  produção. Avalia as diferentes qualificações na relação entre arquitetura e artes
  plásticas: a policromia dos planos, os percursos espaciais, a iluminação e integração
  das inserções plásticas exemplificadas pelo Monumento José Inácio Peixoto (1956)
  com escultura de Bruno Giorgi e painel de azulejos de Portinari; as obras do Educandário
  Dom Silvério (1954) e residência Nanzita Gomes, ambos com afrescos de Emeric Marcier
  e painéis de azulejos de Anísio Medeiros e execução de Américo Braga. Ainda em Cataguases,
  analisa os jardins de Bolonha para a residência Josélia Pacheco Medeiros (projeto
  de Aldary Henriques Toledo, 1946). Menciona sua atuação fora da prancheta: curador
  da Fundação Raimundo Castro Maya (1966-70), conselheiro do Museu de Arte Moderna
  (RJ, 1964-66) e das Empresas Bloch (1954-68), júri da IX Bienal de São Paulo (1967).
  Por fim, em entrevista com o arquiteto, discute seu acervo pessoal de obras de arte:
  Joaquim Tenreiro, Franz Weissmann, Ceschiatti entre outros.'
