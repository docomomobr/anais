abstract: O presente trabalho é parte da pesquisa finalizada em 2000, " Documentação
  da Arquitetura Moderna em Uberlândia – Arquiteto Elifas Lopes Martins", dentro de
  uma das linhas de pesquisa do Núcleo de Pesquisa da Faculdade de Arquitetura e Urbanismo
  da Universidade Federal de Uberlândia. A pesquisa contou com a participação de 2
  alunos com o auxilio do Programa Institucional de Bolsa de Iniciação Científica
  (CNPQ/UFU). Elifas Lopes Martins formou-se na segunda turma da Faculdade de Arquitetura
  e Urbanismo da Universidade de Brasília, no final de 1967. Como aluno da UnB, teve
  professores como João Filgueiras Lima, o Lelé, Athos Bulcão, Amélia Toledo, Alcides
  da Rocha Miranda, Glauco Campello, Edgar Gaeff e Oscar Niemeyer como colaborador.
  Elifas afirma que o fato de estar na escola no momento em que a UnB era um constante
  canteiro de obras, contribuiu para seus conhecimentos específicos na área do desenvolvimento
  do projeto e para a pesquisa do processo industrial da construção. Na década de
  1970 Elifas irá se fixar na cidade de Uberlândia desenvolvendo uma produção residencial
  com uma tipologia particular e a partir de 1974 irá desenvolver uma tipologia industrial
  vinculada a industria Rezende Alimentos S/A . Apresentaremos assim o levantamento,
  a documentação e analise referente à produção de espaços industriais do arquiteto
  Elifas Lopes Martins, na elaboração de espaços necessariamente racionais para um
  processo industrial, ressaltando seus aspectos tecnológicos. O trabalho pretende
  destacar no conjunto arquitetônico da industria Rezende Alimentos S/A características
  marcantes que definem uma tipologia para os edifícios dentro de uma estética industrial
  regida por um rigor tecnológico. Seus projetos foram desenvolvidos a partir de uma
  intensa pesquisa técnica voltada para um tecnologia industrial elaborando espaços
  racionais pensado dentro da lógica do fluxo das operações, atendendo ás necessidades
  funcionais, gerando espaços que contribuem diretamente no processo da produção industrial
  tanto, qualitativamente como, quantitativamente. O fluxo das operações de um "Incubatório
  de aves" ou, um "Abatedouro de Bovino e Suíno e Industria de Carne", irá definir
  o espaço industrial, tomando partido da racionalização dos espaços no intuito de
  otimizar os fluxos das operações industriais, possibilitando assim, reduzir custos
  e maximizar os lucros. O arquiteto Elifas Lopes Martins contribuiu de forma significativa
  para a constituição da linguagem arquitetônica da região. A produção industrial,
  ligada à Rezende Alimentos S/A, tem características marcantes que definem toda uma
  tipologia particular para as construções indústrias.
