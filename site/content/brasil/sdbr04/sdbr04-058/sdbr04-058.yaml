abstract: O conjunto arquitetônico da Fundação Oswaldo Cruz identificado como do período
  modernista compreende edifícios construídos principalmente nas décadas de 40 e 50,
  durante a gestão de Henrique Aragão (1942-1949), último diretor vitalício do ainda
  Instituto Oswaldo Cruz (IOC). Deste conjunto, destaca-se a produção do Arquiteto
  Jorge Ferreira, cujos pavilhões do Restaurante Central (1948-1951) e de Cursos (1947-1951)
  foram tombados, em 1998, pelo Instituto Estadual de Patrimônio Cultural (INEPAC),
  mas engloba também pavilhões de importância histórica, tanto para a arquitetura
  moderna carioca, quanto para esta importante instituição de saúde pública, de 100
  anos recém completados. Nos primeiros vinte anos do Instituto Oswaldo Cruz, hoje
  Fundação Oswaldo Cruz, os principais projetos eram encomendados diretamente ao arquiteto
  português Luiz Moraes Jr., cuja maior produção engloba o período em que Oswaldo
  Cruz esteve na direção do instituto, de 1903 a 1917. A última grande participação
  de Moraes para o IOC foi em 1922, já na gestão de Carlos Chagas. Até meados da década
  de 30 nenhum grande projeto foi desenvolvido para o IOC. Este hiato na construção
  de novos pavilhões deveu-se, também, pelo fato de a estrutura de contratação de
  projetos arquitetônicos ter se profissionalizado. A partir da criação da Divisão
  de Obras do Ministério de Educação e Saúde, em 1934, todos os projetos de construção,
  ampliação e reforma nos imóveis cadastrados no patrimônio das instituições subordinados
  ao M.E.S., sendo o IOC um deles, tinha que obrigatoriamente ser desenvolvido pela
  Divisão. No de 1933 iniciou-se o projeto para construção da filial da Fundação Rockefeller
  no campus de Manguinhos, como parte de um acordo de cooperação internacional na
  área de saúde pública e saneamento. Apesar de não estar incluído nesta classificação,
  este pavilhão foi o primeiro a romper com a tradição construtiva em Manguinhos.
  A partir deste pavilhão, houve uma retomada de construções dentro da área do Instituto,
  mas foi no final da década de 40, que surgiram os mais significativos, reflexo não
  apenas da gestão de Aragão, mas também de Gustavo Capanema frente ao Ministério
  de Educação e Saúde. Como o tombamento dos pavilhões de Jorge Ferreira ocorreu apenas
  no final da década de 1990, muitas alterações indevidas foram realizadas, e em alguns
  casos, irreversíveis. O desafio do Departamento de Patrimônio Histórico da Fiocruz
  é, a longo prazo, restaurar estes pavilhões no que for possível, devolvendo a estes
  edifícios o valor de sua arquitetura.
