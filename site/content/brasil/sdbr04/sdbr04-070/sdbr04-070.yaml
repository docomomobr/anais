abstract: 'Durante a década de 1970, na ditadura militar e sob uma administração municipal
  da ARENA, partido governista, a cidade do Jahu na região central do Estado de São
  Paulo, passou por uma série de intervenções urbanísticas que transformaram uma estrutura
  urbana remanescente do início do século XX, implantada com o ciclo do café. Alguns
  arquitetos já consagrados no país foram chamados para tais transformações, em curso
  desde a década de 1950 Zenon Lotufo, Abelardo de Souza, Osvaldo Correa Gonçalves,
  Ícaro de Castro Mello, Carlos Barjas Millan, Carlos Cascaldi e João Batista Vilanova
  Artigas, este o mais famoso e contundente entre todos. Este quadro de arquitetos
  compreendia alguns dos maiores expoentes do Movimento Modernista da arquitetura
  no Brasil. Há razões determinantes que proporcionaram a presença de tais e tão renomados
  arquitetos modernistas em Jahu, entre as décadas de 1950 e 1970, porém apenas uma
  investigação mais aprofundada poderá esclarecer o desenrolar de fatos e suas implicações
  na construção de uma narrativa historiográfica que aborde tal ocorrência, o que
  definitivamente não cabe a esse trabalho. Interessa-nos aqui, abordar aspectos da
  linguagem arquitetural de dois arquitetos, num mesmo período, em duas obras semelhantes
  porém distintas. O trabalho concentrar-se-á na análise de dois edifícios construídos
  na década de 1970, no Jahu: o Paço Municipal do arquiteto Carlos Cascaldi, inaugurado
  em 1973; e a Rodoviária do arquiteto João Batista Vilanova Artigas, inaugurado em
  1976, pelo General Ernesto Geisel, então Presidente da República Federativa do Brasil.
  Decididamente, há uma semelhança formal entre os dois edifícios níveis alternados,
  ligados por rampas, pé-direito livre central, continuidade espacial como também
  há uma proximidade conceitual, sendo projetos de dois representantes da chamada
  Escola Paulista. Porém há aspectos compositivos relevantes que as tornam duas obras
  caracteristicamente distintas entre si, expressando incisivamente dois modos diferentes
  de fazer e compreender a arquitetura. É justamente este o princípio da presente
  proposta de trabalho. Contudo antes de determo-nos nas obras e seus autores, é necessário
  entender a cidade, o sítio onde ocorreu esta arquitetura, por duas razões principais:
  a primeira, identificada com o conjunto de transformações empreendidas no espaço
  urbano jahuense nesse período, do qual as referidas obras constituem parte exponencial;
  a segunda, determinada por uma proximidade, no tempo e no espaço (distam apenas
  uma quadra entre si), e a extrema importância para a reestruturação da área central
  da cidade, remanescente da chamada cidade do café das primeiras décadas do século
  XX. Assim sendo, é preciso compreender historicamente o espaço, a formação e suas
  transformações no tempo, para que a leitura compositiva da arquitetura desses dois
  edifícios estudados, deixe de encará-los apenas enquanto dois objetos arquiteturais,
  para compreendê-los enquanto obras de arquitetura responsáveis por uma radical transformação
  do espaço urbano.'
