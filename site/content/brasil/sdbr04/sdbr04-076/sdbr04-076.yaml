abstract: 'A ação pioneira do SPHAN de preservar o prédio do Ministério da Educação
  e Saúde Pública promovendo sua inscrição no Livro do Tombo das Belas-Artes em 1948,
  apenas três anos após sua inauguração, garantiu condições excepcionais de autenticidade
  de sua arquitetura, inclusive com relação aos materiais de acabamento e mobiliário.

  O fato da sede do SPHAN estar instalada desde a inauguração no 8º pavimento do prédio
  e ter aquela instituição entre seus colaboradores diversos modernistas, inclusive
  Lúcio Costa que ali trabalhou como chefe da Divisão de Estudos e Tombamentos até
  sua aposentadoria em 1972, contribuiu para que as intervenções realizadas ao longo
  dos anos mantivessem intactos os principais aspectos de seus espaços.

  O Projeto de Restauração e Revitalização do Palácio Gustavo Capanema desenvolvido
  no Setor Técnico da Administração do PGC / IPHAN procurou além de promover a restauração
  e conservação do bem tombado, inclusive de todo o acervo de obras de arte e mobiliário
  original, modernizar sua infra-estrutura, otimizar a ocupação dos espaços e potencializar
  a vocação cultural do prédio.

  Foram restaurados os espaços originalmente projetados para uso público — Salão de
  Conferências com capacidade de 400 lugares, reversível para apresentações de música
  de câmara e projeções de cinema e Salão de Exposições — e adaptados para serem abertos
  ao público alguns espaços originalmente pouco acessíveis ao visitante comum. Neste
  caso se enquadra o 2º pavimento, antigo gabinete do Ministro de Estado, que possui
  como atrativos o Hall Nobre onde está localizado um grande afresco de Cândido Portinari
  — Jogos Infantis —, o Salão Portinari com suas paredes revestidas com os belos afrescos
  representando os Ciclos Econômicos e, ainda, uma exposição denominada "1937-1945
  A Construção do Moderno".'
