abstract: O projeto do arquiteto Affonso Eduardo Reidy, data de 1947, e traduz em
  suas soluções plástica e funcional, as principais teorias modernas, principalmente
  as inspiradas por Le Corbusier e pelos Congressos Internacionais de Arquitetura
  Moderna (CIAMs). O conceito da função habitar, encarado de forma abrangente, porém
  padronizada, refletia uma forma diferente de ver o mundo preconizando, entre outras
  medidas, a necessidade de espaços setorizados e complementares, diferenciado por
  funções. Os espaços deveriam abrigar famílias que passariam a maior parte do tempo
  fora de casa, trabalhando ou estudando, restringindo-se a casa apenas atividades
  como alimentar, dormir e praticar a higiene corporal, sendo necessários espaços
  externos complementares como áreas de lazer, posto de saúde, escola e creches, mercado
  e lavanderia. Na composição das edificações evidencia-se o uso das tecnologias e
  materiais mais avançados, como o concreto armado que permitiu a criação de grandes
  vãos livres, pilotis, cascas e curvas, fazendo com que a estrutura das edificações
  participasse do partido estético adotado. Elementos como brise- soleil, painéis
  vazados e paredes em cobogós cerâmicos conferiam maior riqueza plástica às fachadas,
  funcionando como painéis e proporcionando maior conforto térmico. O conjunto permanece
  íntegro em seus elementos essenciais, embora os indícios de degradação e abandono
  na maioria de suas edificações sejam evidentes. Por décadas o conjunto sofreu com
  mudanças em sua administração, o que resultou em alterações dos usos dos espaços
  públicos originais, com a supressão de algumas funções, como a lavanderia e o mercado.
  Um dos objetivos deste trabalho foi estabelecer uma ponte entre o projeto original
  e a atual ocupação, procurando-se conhecer em profundidade o objeto de estudo como
  método para a fundamentação do Projeto de Restauração. Trata-se, portanto, de um
  material de pesquisa pouco conhecido, desenvolvido aproximadamente um ano de trabalho
  de campo, no qual pode-se contar com uma significativa participação da população
  que habita, utiliza ou trabalha no conjunto. A proposta de restauração do Conjunto
  do Pedregulho se faz de maneira crítica, embasada nos conceitos estabelecidos nas
  Cartas Internacionais de preservação e restauração e na teoria de restauro defendida
  por Cesare Brandi. O principal objetivo deste projeto é a recuperação do conjunto
  no seu aspecto físico, partindo do princípio de que isso é indissociável das questões
  sociais, pois a recuperação/ conservação dos espaços depende, também, da recuperação
  da auto estima dos moradores e de sua relação com os espaços do conjunto, para que
  deles parta a iniciativa da conservação e preservação daquela arquitetura. O presente
  trabalho faz uma reflexão acerca da proposta de usos original, à época resultante
  de uma nova realidade ligada a um modelo de desenvolvimento industrial, assim como
  uma análise atual de como estes espaços foram apropriados pelos moradores do conjunto
  e uma proposta de novos usos, compatíveis com os anseios atuais, bem como a qualificação
  dos espaços que ficaram ociosos e a recuperação física das edificações.
