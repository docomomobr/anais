abstract: Nos anos 50, intensifica-se o processo de metropolização da cidade de São
  Paulo, que assume uma nova organização espacial em função dos crescimentos populacional
  e territorial urbano- regional e da intensificação das atividades produtivas. Um
  novo padrão econômico, social, político e, em certa medida, cultural, se instaura
  no país e os projetos de fábricas, antes importados e adaptados às condições locais,
  são solicitados aos arquitetos brasileiros envolvidos no Movimento Moderno. Enquanto
  na Europa o espaço de produção fabril é uma referência fundamental na constituição
  do ideário da arquitetura moderna; no Brasil, em função de sua industrialização
  tardia, a fábrica incorpora elementos da nova linguagem, num momento em que a arquitetura
  moderna encontra-se já consolidada. O artigo discute o papel dos edifícios fabris
  na caracterização do ambiente urbano em São Paulo nas décadas de 40, 50 e 60. Outro
  tema importante é o dos novos usos destes edifícios que perderam sua função original,
  seja pela incapacidade de atender às demandas dos novos paradigmas da produção,
  seja por decisões estratégicas referentes à sua inserção na trama urbana, mas que
  ainda preservam sua característica de referência na cidade, em função da sua escala,
  determinada pelas exigências do programa, ou do caráter de marco urbano, conferido
  pelo tratamento estético de elementos arquitetônicos, como torres, chaminés e caixas
  d’água. Se, por um lado, a reutilização destes edifícios é uma condição para o processo
  de requalificação e preservação da cidade contemporânea, por outro, a flexibilidade
  dos espaços internos, que originalmente respondia a demandas funcionais específicas,
  apresenta grandes possibilidades de reconversão funcional destas fábricas que, em
  São Paulo, vêm se transformando em centros culturais, universidades, fundações,
  bares, etc. A discussão sobre esta temática se reveste, assim, de importância fundamental
  para uma reflexão sobre o processo de requalificação de áreas degradadas da cidade
  contemporânea e de preservação da arquitetura moderna brasileira. Este trabalho
  é uma síntese da dissertação de mestrado desenvolvida junto ao Programa de Mestrado
  em Arquitetura da USP – São Carlos, e está vinculada ao Projeto Integrado de Pesquisa
  “Constituição da Arquitetura Moderna em São Paulo, 1930-1970”, do Grupo de Pesquisa
  em Arquitetura e Urbanismo no Brasil (ArqBras).
