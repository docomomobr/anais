abstract: 'A proposta visa estudar a arquitetura de Oscar Niemeyer não apenas no que
  tange a questão da forma, mas também em situações em que sua arquitetura reinterpreta
  os pressupostos modernista, seja sob o aspecto da forma do objeto ou do espaço idealizado.
  Percebam que apesar da eminência plástica da arquitetura de Niemeyer, a maioria
  dos seus princípios projetuais pertencem a corrente racionalista da Arquitetura
  Moderna. Como ponto de partida, podemos analisar : Para quem Oscar Niemeyer projeta?
  Qual é esse homem? Tanto a arquitetura de Alvar Aalto quanto a de Frank Lloyd Wright
  prezam pela valorização do homem como indivíduo e primam por projetar o específico,
  o singular. Já o homem idealizado pela arquitetura de Niemeyer, possui os dois pés
  fincados na utopia modernista, mesmo que sua arquitetura, não em sua totalidade,
  não seja uma fiel representação da fisicalidade do objeto arquitetônico resultante
  dos pressupostos da era mecanicista. A análise da relação da arquitetura de Niemeyer
  com a paisagem nos faz perceber sua estreita relação com a Espacialidade Moderna.
  Tanto em Wright quanto em Aalto, percebemos que em seus projetos existe uma extrema
  preocupação com os aspectos locais da paisagem. Os projetos desses dois arquitetos
  não “pousam” na paisagem, mas sim, “nascem” dela, como se dela já fizessem parte.
  No que diz respeito com a relação com a paisagem, percebemos que a posição de Oscar
  é diametralmente oposta a de Wright. Wright projeta o Lugar, projeta a inserção
  corpórea do objeto à geografia, explora a máxima relação tátil que o objeto pode
  ter com a paisagem. A arquitetura de Niemeyer anseia pela paisagem neutra, pelo
  vazio, pelo plano horizontal infinito, isto é, Oscar, para situar suas obras necessita
  da mais pura e simples paisagem Miesiana, desenhando o espaço determinado por uma
  relação mínima, que reduz os objetos a índices espaciais, assim, o máximo de espaço
  corresponde ao mínimo de utilidade. Notem que a paisagem condiciona tanto o significado
  de Lugar estabelecido pela obra de Wright , como o significado de Espaço estabelecido
  pela obra de Niemeyer. E esses referenciais podem ser diagnosticados por uma análise
  da representação gráfica em perspectiva do objeto arquitetônico de ambos os arquitetos:
  A obra de Wright, por estabelecer uma relação mais intimista com a paisagem, com
  a topografia, enfim com o lugar, sempre será representada segundo as leis da perspectiva
  cônica, limitando a paisagem na instância do mensurável, do finito, porém conferindo-a
  um horizonte, instituindo o caráter de um Lugar. Ao contrário de Wright, Niemeyer
  representa suas obras no papel, não através do uso das leis da perspectiva cônica,
  e sim através das leis da Geometria Descritiva. O croqui de Oscar, representa o
  objeto arquitetônico em elevação, não há ponto de fuga, não há profundidade, há
  apenas o objeto pleno. Porém quando Niemeyer desenha um objeto em perspectiva se
  utiliza da técnica da perspectiva isométrica, aonde todas as linhas são paralelas,
  sem ponto de fuga, sem linha do horizonte. Através de seu desenho, observamos o
  objeto como se fosse uma maquete, dissociando-nos de qualquer relação tátil com
  o desenho. A curva de Niemeyer é tão essencial quanto a reta de Mies. A própria
  simplicidade e singeleza da forma, nos faz esquecer a pré - existência de um programa,
  mostrando-nos que a Técnica por si mesma, possa dar volume a uma imagem que é só
  um desenho, quase uma linha.'
