abstract: 'Cataguases foi uma cidade que sofreu um rápido processo de industrialização
  nas primeiras décadas do século XX. A cidade passou de uma economia de base agrícola,
  com uma produção considerável de café, dentre os primeiros lugares para a Zona da
  Mata mineira, e entreposto da região em função da ferrovia que aí chegou em 1877,
  a uma economia de base industrial de uma forma tão decidida que não haveria mais
  retorno. As primeiras indústrias de porte que aí se instalaram já tinham a combinação
  necessária: a tecelagem e a produção de energia. A Companhia de Fiação e Tecelagem
  de Cataguases, posteriormente, Indústrias Irmãos Peixoto, seria o centro das atenções
  desde sua fundação em 1905. Logo depois, viria a Companhia Força e Luz Cataguases-Leopoldina
  em 1908 que seria parte fundamental da infra-estrutura necessária ao desenvolvimento
  dessa primeira iniciativa e a outras, paralelamente. Em função desse panorama, a
  cidade precisava se equipar para receber o contingente de operários para que essas
  iniciativas se viabilizassem. Assim, o setor de produção de moradias cresceu junto
  ao setor industrial em uma época em que a rentabilidade de aluguéis estava em alta.
  Esse novo setor tinha dois grandes investidores, ambos de iniciativa privada: o
  da própria indústria e o novo setor empresarial que emergia devido à situação local.
  O primeiro tentava resolver um problema imediato de seus funcionários enquanto que
  o segundo queria tirar vantagem financeira da situação. Tanto a iniciativa privada
  independente quanto a dos industriais tiveram duas opções para a tipologia formal:
  a linguagem tradicional do porta-e-janela, com inúmeros exemplares de correr de
  casas em novas ruas ou avenidas, ou ainda simplesmente casas geminadas, e uma linguagem
  mais modernizadora que deveria introduzir novos padrões correspondentes ao nível
  de progresso que a cidade alcançava. Tratando-se de um período que vai desde a década
  de vinte até os anos cinqüenta, o padrão “moderno” apresentou soluções diferentes.
  Aparentemente, houve também referenciais diferentes para grupos diferentes. A iniciativa
  industrial pretendia resolver o problema habitacional para funcionários de vários
  níveis e precisava dar uma imagem compatível com a hierarquia interna ao ambiente
  de trabalho. Já o setor de investidores do mercado imobiliário tinha preocupações
  mais voltadas para a rentabilidade do empreendimento. A importação de modelos tanto
  para os funcionários quanto para o simples operariado foi visível ao longo do período
  tratado, a princípio estranhos à região interiorana de Minas Gerais. Esse trabalho
  pretende investigar a apropriação de modelos que provavelmente se iniciam na idéia
  howardiana da cidade-jardim e mesmo das proposições de Unwin e Parker para o bairro-
  jardim até os modelos mais modernos propriamente ditos. A partir de uma análise
  dos modelos de habitação dessas classes mais populares, tentaremos averiguar o grau
  de modernização que ocorreu nesse período. A análise pretende abranger questões
  simbólicas na adoção de uma nova linguagem, da funcionalidade espacial, de questões
  construtivas e também do processo de modernização a partir da importação dos novos
  padrões que surgiam para a habitação urbana.'
