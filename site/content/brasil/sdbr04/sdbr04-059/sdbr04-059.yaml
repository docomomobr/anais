abstract: A construção do Park Hotel de Friburgo (1940-44) representou a concretização
  prática do pensamento e das reflexões de Lúcio Costa, confirmando a sua indiscutível
  condição de grande teórico do movimento moderno brasileiro. A conciliação entre
  os princípios da Arquitetura Moderna e os da tradição local, constituiu a vertente
  mais original da nova arquitetura brasileira e sua principal contribuição ao movimento
  moderno internacional. As pesquisas anteriores de Lúcio Costa sobre a arquitetura
  colonial luso-brasileira dos séculos XVII e XVIII informam decisivamente a concepção
  do edifício. O despojamento e a pureza formal, a racionalidade construtiva e o emprego
  de materiais tradicionais representavam importantes pontos de contato entre a arquitetura
  moderna e as lições do passado. O completo domínio da linguagem demonstrado pelo
  arquiteto permite articular elementos da arquitetura colonial com as conquistas
  da técnica e do espírito moderno. Dissolve-se, assim, a pseudocontradição entre
  tradição e modernidade em voga na época. Postas uma a serviço da outra, tradição
  e modernidade reencontram-se em serena cumplicidade no desenho do Park Hotel. O
  projeto condensa ainda importantes lições corbusianas como, por exemplo, a agregação
  de volumes funcionalmente diferenciados como na casa La Roche-Jeanneret e o princípio
  geométrico-construtivo da estrutura independente das casas Domino. Além de apresentar
  uma reflexão sobre a modernidade do espaço concebido por Lúcio Costa para o Park
  Hotel de Friburgo, o presente trabalho pretende discutir as relações passíveis de
  serem estabelecidas entre este edifício e os projetos do Grande Hotel de Ouro Preto
  (Oscar Niemeyer, 1940) e o Hotel Cataguases (Aldary Toledo, 1951).
