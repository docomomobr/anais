abstract: 'O edifício alto e o processo de verticalização das grandes cidades do mundo
  sempre estiveram ligados a dois fatores prioritariamente: um de ordem econômica
  - a valorização e multiplicação da terra urbana; e outro de ordem simbólica – demonstração
  de progresso e modernidade de uma grande metrópole. Indubitavelmente a verticalização
  está ligada ao desenvolvimento econômico e a pressão de um mercado imobiliário que
  usa o espaço urbano como meio de reprodução do capital. No entanto, para a constituição
  de certas formas de processo produtivo, incluindo-se a produção imobiliária, existem
  condições gerais que não dependem unicamente do detentor de capital e sua forma
  de reproduzi-lo. O valor da terra urbana não existe em si, mas com o seu uso. Este
  uso é complexo e depende de elementos externos, que fogem em certa medida ao controle
  dos detentores do capital, como fatores simbólicos e estéticos. No caso do Brasil
  não acontece diferente, porém em alguns momentos esta imagem antecede ao fato concreto
  da metropolização da cidade, como em Belo Horizonte. Seu processo de verticalização
  se inicia antes do esgotamento de terras no centro da cidade e de sua condição sócio-econômica
  metropolitana. Algumas particularidades na formação e gestão da cidade serão responsáveis
  por essa inversão na ordem tradicional do processo, dentre elas a postura do poder
  público que cria condições estruturais e ideológicas que favorecem tais acontecimentos.
  É nos anos 30 que a cidade começa a se firmar como polo cultural e econômico do
  estado. Neste contexto surge o primeiro arranha- céu da cidade, o Ibaté (1935),
  suas linhas modernas já prenunciavam a tendência ao uso desta linguagem. Na década
  de 40, o processo de verticalização da capital mineira ganha impulso. Uma série
  de fatores concorrem para favorecer essa situação. Dentre elas pode-se destacar:
  a formação de um mercado imobiliário que demanda tais intervenções; a disseminação
  do morar moderno; o discurso modernizante reativado no imaginário da capital; a
  entrada da tecnologia do concreto armado nas construções belorizontinas; e a retomada
  da preocupação com a configuração da cidade moderna. Na década de 50 a condição
  metropolitana da cidade efetiva-se e o centro teve a maior produção de prédios altos
  em toda a sua história. O mercado imobiliário voltado para esse setor em Belo Horizonte
  cresceu e se consolidou. O arranha-céu torna-se um dos expoentes da modificação
  do espaço urbano da capital mineira. Prédios altos simbolizavam desenvolvimento,
  grande centro e modernidade, por trás disso, significavam também, especulação imobiliária,
  valorização da terra urbana, crescimento do mercado imobiliário. O discurso e a
  imagem antecipada de grande metrópole industrial abriram ainda mais espaço para
  um mercado em formação, fator fundamental para a expansão do capital econômico.
  O período abordado (1935-1960) foi o de maior produção de edifícios altos no centro
  da cidade (171 edificações). Quanto a composição plástica, as edificações, buscavam,
  desde a primeira obra, linhas modernas. As influências são variadas, interpretações
  das vertentes da arquitetura moderna que começam a ter lugar nas cidades brasileiras
  resultado de releituras feitas a partir dos grandes mestres do movimento, adquirindo
  expressões próprias em cada lugar. O trabalho busca, então, identificar estes elos
  entre poder público / mercado imobiliário, arquitetos e construtores, ideais, linguagens
  e concretizações modernas que deram suporte ao início deste processo na capital
  mineira e determinaram a imagem metropolitana da cidade.'
