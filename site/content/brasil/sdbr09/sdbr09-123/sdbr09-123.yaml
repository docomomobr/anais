abstract: 'A interdisciplinaridade é um problema novo? De que forma ele interessa
  à arquitetura? As definições de dicionário trazem duas acepções complementares para
  o termo interdisciplinar: o que implica relações entre várias disciplinas; o que
  é comum a várias disciplinas. Mas o que seria interdisciplinaridade em arquitetura?
  Podemos falar em interdisciplinaridade, como perspectiva nova, no caso de um ofício
  cujo intento inaugural de definição repousou sobre uma tríade - firmitas, utilitas,
  venustas – que ainda hoje podemos associar às disciplinas engenharia, economia e
  arte? O trabalho espera problematizar o conceito de interdisciplinaridade, a partir
  da revisão bibliográfica da discussão contemporânea sobre o assunto, e discutir
  as suas possíveis implicações para os esforços disciplinares de preservação do patrimônio
  arquitetônico moderno.'
