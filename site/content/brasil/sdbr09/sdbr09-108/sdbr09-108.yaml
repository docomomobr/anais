abstract: A mudança da capital para o interior do território brasileiro foi um facto
  que pontuou a história da arquitetura e do urbanismo moderno. O interesse na sua
  realização contou com o empenho de políticos e intelectuais. Faltava definir o desenho
  da cidade. A escolha do plano contou com a participação efectiva de vinte e seis
  equipes nacionais formalizando uma competição de ideias e reflectindo as teorias
  urbanísticas que circulavam na época. A maioria dos projetos foi desenvolvida por
  equipes multidisciplinares. Outras foram desenvolvidas por um único autor, incluindo
  o projeto vencedor. Verificou-se que os arquitetos, engenheiros e demais profissionais
  que integraram as diferentes equipes do concurso do Plano Piloto de Brasília, estabeleceram
  vínculos entre si. São relacionamentos estruturados com base em obras construídas,
  na participação em órgãos associativos/académicos, bem como em redes de amizade.
  Identificar os seus percursos profissionais e registrar, de um modo sistémico, a
  rede de relacionamentos sociais existentes entre eles é o objectivo deste artigo.
  O inventário e a documentação da dinâmica das interações sociais, bem como a mobilidade
  e o relacionamento profissional dos autores dos planos pilotos, apoia-se na articulação
  entre as áreas científicas da Arquitetura e do Urbanismo, da História e das Ciências
  Sociais, e visa estudar as conexões sociais estabelecidas pelos profissionais que
  compõe esta rede social.
