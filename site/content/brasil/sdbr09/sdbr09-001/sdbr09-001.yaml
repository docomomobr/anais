abstract: Discute o entrelaçamento entre a linguagem arquitetônica e as ideias pedagógicas
  de Anísio Teixeira por meio da análise de dois projetos arquitetônicos de autoria
  do arquiteto Élio de Almeida Viana na Grande Vitória (ES) em dois momentos - décadas
  de 1950 e 1970. A apreciação das imagens e das plantas arquitetônicas permite que
  a visualização das relações históricas, políticas e sociais vigentes nos períodos
  por meio da organização espacial, do programa dos edifícios e da tipologia construtiva
  empregada em cada período, alicerçadas pelas leis de diretrizes e bases pedagógicas,
  permitindo concluir que a dimensão simbólica e inconsciente dada aos edifícios influencia
  e sofre influência dos projetos político pedagógicos e, consequentemente, no agir
  das pessoas. Nessa perspectiva histórico-arquitetônico-pedagógica, tendo como base
  o aspecto interdisciplinar, visa lançar luzes sobre o entrelaçamento de correntes
  pedagógicas e a materialização do patrimônio.
