abstract: Este trabalho pretende, a partir da visão de três pesquisadores com formações
  diversas (um urbanista, um especialista em restauro e um engenheiro civil), observar
  o processo de modernização na cidade de Santos, destacando a experiência do uso
  do concreto armado na arquitetura moderna santista. Registra, para análise e reflexão,
  o exemplo do uso desse material no Teatro Municipal de Santos, atualmente Centro
  Cultural Patrícia Galvão (Pagú), em virtude de sua finalidade, contexto histórico,
  características de projeto e execução, e filiações dos autores do projeto arquitetônico.
