abstract: 'As experiências modernistas em países de língua portuguesa revelam entrelaçamentos
  múltiplos de ideias, cujos fluxos se dão em diversos sentidos e direções, particularmente
  quando observadas as temporalidades que as constituíram. Os pesquisadores aqui reunidos
  trazem contribuições importantes para compreender as origens, os caminhos e os diversos
  destinos de interpretações do problema arquitetônico e urbanístico em plena rota
  às modernidades pretendidas e às expressões modernistas possíveis.


  No contexto lusitano, Brazil Builds apresentou uma possibilidade de conciliação
  entre tradição e modernidade, debate que se travava tanto no campo ideológico, quanto
  profissional. No campo ideológico, o estado Português estabelecia correlações entre
  o modernismo e o pensamento de esquerda, calcado, também, na tese da identidade
  nacional, no caso, cristalizada em uma mítica arquitetura tradicional portuguesa.
  No campo profissional, percebe-se claramente no debate sobre o problema da habitação
  entre as posições de Raul Lino e Fernando Távora. O mesmo Távora que, ao falar por
  uma geração, afirmava: Brazil Builds era o nosso Vignola!


  No contra fluxo das ideias, Luiz Amorim observa este contexto lusitano por meio
  do Concurso para Obtenção do Diploma de Arquitetura de Delfim Amorim, dentre os
  ilustres intelectuais que deixaram o solo português nos anos de 1950, tendo como
  destino o Brasil, as colônias e países europeus, notadamente a França. Discute em
  que medida as ideias contidas no seu trabalho estruturaram sua experiência profissional,
  notadamente em solo brasileiro.


  As colônias africanas, paradoxalmente, foram palco de planos e projetos forjados
  na metrópole fundados naqueles princípios de nacionalismo e aproximação a uma arquitetura
  de sabor quase pitoresco, mas também ofereceram a oportunidade para a realização
  de grandes projetos urbanísticos e arquitetônicos alinhados com as experiências
  modernistas contemporâneas europeias e brasileiras. Ana Vaz Milheiro, com a produção
  do Gabinete de Urbanização Colonial, e Ana Tostões e Maria Manuel Oliveira, com
  o Complexo Monteiro & Giro, nos mostram algumas faces deste cenário contraditório.


  Se Lúcio Costa propunha uma documentação necessária, os arquitetos portugueses a
  fizeram por meio do Inquérito à Arquitectura Regional Portuguesa. Seus frutos serão
  percebidos mais claramente nos anos de 1960, particularmente nas obras de Távora
  e Siza. Delecave trata dos aspectos de identidade e subjetividade na obra de Távora,
  encerrando a mesa temática.'
