abstract: 'Este artigo apresenta considerações sobre o processo de documentação da
  Arquitetura Moderna no estado de Pernambuco, na capital e em municípios do interior,
  a partir do projeto de pesquisa intitulado “Documentação de Arquitetura Moderna
  no Nordeste Brasileiro, 1930-1980”, em desenvolvimento desde 2010 com apoio do CNPq.
  O projeto vem sendo realizado através de cooperação interinstitucional entre a UFPE
  e a FAVIP, localizada na cidade de Caruaru-PE. Considerando semelhanças históricas
  e culturais entre as cidades do Nordeste, bem como o papel de Pernambuco na recepção
  e difusão da Arquitetura Moderna na região, acredita-se que o método utilizado,
  os critérios de identificação, seleção, registro e documentação de obras modernas
  em Pernambuco podem auxiliar inventários da Arquitetura Moderna nas capitais e em
  municípios do interior em outros estados do Nordeste. A pesquisa em andamento aplica
  as fichas do docomomo.org para imóveis mais significativos da Arquitetura Moderna
  em Pernambuco, incluindo aqueles do episódio de Luiz Nunes e as obras elaboradas
  pela Diretoria de Arquitetura e Urbanismo, a DAU, e imóveis em municípios do interior.
  Entre eles, Caruaru, Garanhuns, Pesqueira, Limoeiro, Taquaritinga do Norte e Gravatá,
  no Agreste, Petrolina, Salgueiro, Afogados da Ingazeira e Arcoverde, no Sertão,
  considerando a carência de documentação nas cidades do interior e a qualidade de
  suas obras modernas. Foram identificados alguns recortes temporais e marcos que
  serviram de critérios para seleção dos imóveis a serem documentados: a repercussão
  da experiência da DAU de Luiz Nunes, sobretudo através de obras governamentais como
  hospitais e escolas, as iniciativas particulares de autoria dos arquitetos Borsoi
  e Amorim e obras institucionais. De forma geral, verifica-se que nos anos de 1940
  há uma predominância do proto-moderno e obras com traços do art déco, nos anos de
  1950 e 1960, obras modernas dos mestres Amorim e Borsoi e algumas obras institucionais
  de seus discípulos.'
