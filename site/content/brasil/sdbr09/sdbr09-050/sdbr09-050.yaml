abstract: Por meio do processo de evolução do conceito de patrimônio ambiental urbano,
  tomando por base os paradigmas internacionais expressos nos documentos do ICOMOS
  e governo federal e estadual. Apontam-se possibilidades e desafios da preservação
  do patrimônio ambiental urbano moderno. Na perspectiva de contribuir para a compreensão
  do meio ambiente e do desenvolvimento humano, o artigo procura discutir o conceito
  de valor da natureza no âmbito da abordagem da conservação integrada e do patrimônio
  ambiental urbano. Os valores da natureza pregados pela Carta se inserem em uma visão,
  que permite uma larga interpretação baseada no respeito e no reconhecimento do valor
  de existência dos recursos naturais e dos princípios de solidariedade e preservação
  da diversidade cultural. As novas interpretações dadas ao meio ambiente, enquanto
  patrimônio pertencente a todos os povos da Terra, partem do princípio dos valores
  intrínsecos ao seu suporte biológico e geofísico e sua relação com o desenvolvimento
  humano.
