abstract: O trabalho propõe-se a revelar a história do projeto do edifício Santa Cruz,
  o edifício mais alto de Porto Alegre, e marco referencial na cidade. Do projeto
  ao fim de sua construção passam-se dez anos em que a arquitetura da capital gaúcha
  sofre mudanças fortes, principalmente em relação a seus referenciais arquitetônicos.
  A mudança ocorre de uma matriz moderna carioca, para um referencial vinculado à
  revalorização das vanguardas do início do século XX e ao chamado “estilo internacional”.
  Este foi um movimento forte ocorrido no final da década de 1950, após a divulgação
  do concurso da Assembléia Legislativa do Estado do Rio Grande do Sul. Quando analisamos
  o desenvolvimento do projeto do Santa Cruz podemos identificar, junto à dados particulares
  do problema, tais mudanças que ocorriam no cenário regional, mostrando que o valor
  do objeto em análise transcende sua qualidade estritamente arquitetônica. Retrata
  um recorte no tempo e grava na história um momento da arquitetura gaúcha.
