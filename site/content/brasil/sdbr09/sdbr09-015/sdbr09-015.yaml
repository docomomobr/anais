abstract: O projeto do Palácio Farroupilha, sede da Assembléia legislativa do Estado
  do Rio Grande do Sul, primeiro prêmio de importante Concurso Público Nacional realizado
  em 1958, é um monumento modernista que, em sua época, pré-figura um futuro ao invés
  de homenagear o passado. Este artigo se insere no eixo Reflexões do presente seminário
  e pretende apresentá-lo como exemplo relevante da busca da nova monumentalidade
  moderna didática, surgida a partir da obra americana de Mies van der Rohe. Em termos
  genéricos, discute a qualidade intelectual do projeto de arquitetura como fonte
  histórica.
