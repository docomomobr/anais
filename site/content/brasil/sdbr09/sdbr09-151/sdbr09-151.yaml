abstract: 'A mesa reúne quatro trabalhos focados sobre objetos de significativa diversidade
  regional e cobrem um espectro temporal bastante amplo. Os edifícios pioneiros da
  modernidade na São Paulo dos anos 30 e 40; as vicissitudes do projeto e construção
  do edifício mais alto da Porto Alegre dos anos 50 e 60; manifestações de uma modernidade
  hesitante na Florianópolis dos anos 50 e a leitura de dois edifícios de Santo André
  nos anos 80 poderiam sugerir uma mesa de difícil conexão.


  Não se trata de buscar um fio condutor capaz de ordenar quatro narrativas distintas
  tanto no período e no recorte geográfico como nos procedimentos específicos de leitura.
  Mas ao leitor atento não escapará a presença de um tema que perpassa os trabalhos
  e que, mais do que identidades metodológicas entre os autores, parece indicar um
  elemento de conexão entre os objetos de análise. Poderíamos identificar esse substrato
  comum na ideia de um "sentido urbano" dos edifícios analisados.


  Tautologia apenas aparente. O sentido urbano de um edifício não está dado imediatamente
  pela sua mera inserção física na cidade. Nem se trata apenas da noção relativamente
  frágil de contexto. A ideia de sentido urbano do edifício diz respeito a um elemento
  constitutivo da modernidade arquitetônica que é a definição da cidade como elemento
  central da reflexão e da prática projetual, com independência da escala da intervenção.


  Um edifício moderno será sempre, em alguma medida, uma leitura e uma proposição
  em relação à cidade, tomada em suas múltiplas determinações espaciais. Poderá buscar
  uma integração visual em relação ao entorno ou afirmar ostensivamente a busca de
  novas linguagens. Poderá redefinir as relações entre espaço público e privado por
  meio de um tensionamento da malha urbana pré-existente ou acomodar-se às normas
  de parcelamento. Poderá avançar na definição de novas tipologias como resposta a
  novos programas de uso ou buscar novas formas de agenciamento espacial para programas
  estabilizados. Em todo caso seu caráter especificamente moderno será definido em
  boa medida pelo que aporte como elemento de reflexão para as práticas sociais que
  caracterizam a urbanidade moderna.


  Parece razoável avaliar que está nesse atributo comum aos edifícios modernos o valor
  específico que possam agregar ao patrimônio construído. Nesse sentido a avaliação
  do patrimônio recente, para nos referirmos ao título que pretende ordenar esta mesa,
  se aproximaria das diretrizes e valores dominantes na doutrina patrimonialista recente,
  privilegiando os conjuntos, urbanos, ambientais ou paisagísticos, em relação à obra
  isolada.


  Se a ideia do sentido urbano como constitutivo da obra moderna tem pertinência,
  então talvez esta não possa ser considerada como obra isolada sob pena de impossibilitar
  a própria possibilidade de sua leitura ou compreensão. E a sua eventual inclusão
  nos obituários cada vez mais frequentes significará muito mais do que a perda de
  um objeto de valor isolado de eventual valor estético ou histórico. Significará
  o silenciamento de um testemunho sobre um episódio significativo da própria construção
  da cidade.'
