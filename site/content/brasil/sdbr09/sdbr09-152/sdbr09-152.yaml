abstract: A partir da reflexão de Z. Bauman, este texto se propõe a refletir sobre
  as idéias de permanência, identidade, nacionalidade e interdisciplinaridade que
  têm conduzido o debate sobre a arquitetura do Movimento Moderno e a sua preservação,
  contrapondo as certezas da modernidade sólida moderna para a qual se olha com as
  incertezas da modernidade liquida global contemporânea de onde se olha e onde se
  vive.
