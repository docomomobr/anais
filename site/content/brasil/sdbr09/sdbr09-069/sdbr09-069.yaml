abstract: Os prédios públicos construídos pelo Ipesp na virada da década de 1960 constituem
  um episódio importante da história da arquitetura moderna paulista. Entretanto,
  ele vem sendo cada vez mais divulgado e conhecido a partir da experiência e dos
  prédios projetados por Vilanova Artigas e um grupo de arquitetos em torno dele reunidos.
  Esta abordagem, que se encaixa no âmbito do projeto hegemônico da arquitetura moderna
  brasileira e sua historiografia, acaba por contradizer as fontes documentais utilizadas
  pelos pesquisadores que a concebem, gerando mesmo distorções no campo documental.
  É neste quadro que o trabalho apresenta resultados preliminares da consulta e sistematização
  de dados colhidos em 1379 processos contidos no acervo da Comissão de Gestão de
  Imóveis do Ipesp - Instituto de Previdência de São Paulo - relativos a prédios construídos
  ou não pelo Instituto entre 1957 e 1963. A base documental é descrita, assim como
  os procedimentos de levantamento e sistematização de dados, no que se refere a definição
  possível de uma listagem de processos e registros relativos a prédios individualizados
  e no que se refere a tabulação de dados contidos nos processos. A Análise dos dados
  revela a ampla atuação do Ipesp anterior aos famosos projetos de 1959, construindo
  prédios com projetos padronizados elaborados pelos profissionais da DOP - Diretoria
  de Obras Públicas, em uma experiência em que a modernidade se expressa tanto pela
  construção em massa de prédios públicos através do Território paulista, quanto pelos
  projetos modernos de arquitetos da iniciativa privada. A atividade do Ipesp não
  é intensificada a partir de 1959, mas mantém um ritmo estabelecido desde 1957 quando
  inicia sua atividade construtora. Os tipos de prédios construídos (escolas, fóruns,
  diretorias agrícolas), entretanto, mudam conforme as diferentes políticas governamentais
  de Jânio Quadros (1955 - 1959) e Carvalho Pinto (1959 - 1963).
keyword: Arquitetura moderna; São Paulo; Comissão de Gestão de Imóveis Ipesp
