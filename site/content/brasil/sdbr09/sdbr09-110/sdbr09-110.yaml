abstract: 'Duas dissertações de mestrado recentes, produzidas no Programa de Pós-Graduação
  em Arquitetura e Urbanismo, Escola de Engenharia de São Carlos da Universidade de
  São Paulo, revelaram as obras expressivas, mas pouco conhecidas de dois arquitetos
  modernos brasileiros: Luiz Gastão de Castro Lima e José Leite de Carvalho e Silva,
  formados nos anos 1950 e influenciados, no início, pelas idéias e projetos de Frank
  Lloyd Wright. Ambos estão entre os arquitetos modernos pioneiros a estabelecer prática
  profissional no interior do Estado de São Paulo. Entre as obras mais importantes
  de cada um está o projeto de uma igreja, em São Carlos e Campinas, respectivamente,
  na década de 1970. O objetivo deste artigo é introduzir a produção arquitetônica
  de Luiz Gastão e Carvalho e Silva e apresentar os projetos destas igrejas. As análises
  das duas obras trazem para discussão as peculiaridades da referência a Wright no
  processo de difusão da arquitetura moderna no Brasil. Mas o faz sem omitir o enorme
  esforço desses arquitetos em modernizar a arquitetura em regiões fora dos grandes
  centros culturais brasileiros.'
keyword: Arquitetura Moderna Brasileira; Frank Lloyd Wright; influência da arquitetura
