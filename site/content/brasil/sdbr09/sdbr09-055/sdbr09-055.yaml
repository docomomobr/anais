abstract: 'A casa modernista da Rua Santa Cruz (1927-1928), de Gregori Warchavchik
  (1896-1972), vem sendo abordada pela historiografia em sua constituição original,
  inserida no debate sobre a formação da arquitetura moderna no Brasil. O presente
  trabalho visa extrapolar os momentos iniciais da obra, pontuando três momentos marcantes
  em sua trajetória: a reforma de 1934-1935, o tombamento de 1984 e o restauro dos
  anos 2000. Entendendo a obra construída como documento primordial para os estudos
  em arquitetura, buscaremos desenvolver nossa pesquisa a partir de perspectiva que
  considere dialeticamente as relações entre história e preservação da arquitetura
  moderna - entendidas como campos disciplinares autônomos, dotados de referenciais
  teórico-metodológicos diversos - de forma a espraiar os horizontes de reflexão sobre
  uma das obras-chave da história da arquitetura brasileira.'
