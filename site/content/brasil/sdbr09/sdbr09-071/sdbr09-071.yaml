abstract: A partir de um sucinto histórico sobre o movimento Art Déco, uma das vertentes
  – por vezes esquecida – da modernidade, destaca-se a importância do “Edifício A
  Tarde”, marco arquitetônico da Cidade do Salvador, para a imagem da cidade, elencando-se
  algumas de suas características históricas e construtivas, assim como as perspectivas
  atuais de salvaguarda do monumento.
