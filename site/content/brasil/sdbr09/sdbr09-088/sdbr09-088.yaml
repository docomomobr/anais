abstract: 'Este trabalho refere-se às obras de restauração e recuperação do Conjunto
  Habitacional Prefeito Mendes de Moraes, situado em Benfica, Rio de Janeiro e se
  encaixa no seminário dentro do eixo “Preservação do Patrimônio Recente”. O Conjunto
  é um projeto de Affonso Eduardo Reidy, um dos expoentes da arquitetura moderna no
  Brasil. A intervenção em obras do período moderno é um grande desafio, em se tratando
  de um conjunto onde a complexidade conceitual e arquitetônica do projeto original
  soma-se ao elevado grau de degradação e às diversas formas de ocupação das edificações.
  Os principais desafios são: - realizar a obra ao mesmo tempo em que o edifício se
  mantém habitado, tentando minimizar o impacto das atividades no dia-a-dia dos moradores
  e usuários do conjunto; - o grande aumento do escopo do serviço de recuperação estrutural
  nos blocos residenciais em relação ao previsto em função do estado de conservação
  dos pilares e laje do térreo; - parte das instalações não atende as normas vigentes,
  em função de nunca ter tido uma reforma geral; - quanto à restauração, apesar dos
  acabamentos serem de uma época relativamente recente, não e possível encontrá-los
  no mercado o que eleva o custo ou requer uma revisão na especificação e conceituação.
  Baseado no Plano Estratégico e Projeto Básico de Restauração do Conjunto Residencial
  Prefeito Mendes de Moraes/Pedregulho, elaborado pelo GAP/Grupo de Arquitetura e
  Planejamento em 2004, coordenado pelo arquiteto Alfredo Britto, a Concrejato Serviços
  Técnicos de Engenharia iniciou a 1ª Etapa em novembro de 2010 devendo concluí-los
  até novembro deste ano. A Concrejato é uma empresa do Grupo Concremat, fundada em
  1978 para execução de serviços especializados de recuperação e reforço de estruturas
  e restauração, tendo desde então atuado em todo território nacional.'
