abstract: 'Aumentam, no período recente, as iniciativas relativas à recuperação de
  acervos de Arquitetura e Urbanismo no Brasil. Num âmbito mais geral, essa preocupação
  culmina com a criação, em 2006, da Câmara Setorial de Arquivos de Arquitetura, Engenharia
  e Urbanismo, no âmbito do CONARQ — Conselho Nacional de Arquivos, a qual tem por
  objetivo "realizar estudos, propor diretrizes e normas no que se refere à organização,
  à guarda, à preservação, à destinação e ao acesso de documentos integrantes de arquivos
  de arquitetura, engenharia e urbanismo."


  Como bem esclarece Azevedo (2010), que apresenta um interessante quadro geral da
  evolução dessa questão no país, essa institucionalização se segue a diversas iniciativas
  parcelares que remontam aos anos 1980 e tomam corpo no XVII Congresso Brasileiro
  de Arquitetos, realizado em 2003, no Rio de Janeiro. Naquela ocasião, encaminha-se
  ao Arquivo Nacional uma proposta de criação da Comissão de Arquivos de Arquitetura
  e Urbanismo, que redundou, três anos depois, na institucionalização da Câmara Técnica
  acima mencionada.


  A tematização do 9º Seminário DOCOMOMO Brasil, "Interdisciplinaridade e Experiências
  em Documentação e Preservação do Patrimônio Recente", vem se agregar a esse movimento
  de construção e de densificação da memória documental dos campos da arquitetura
  e do urbanismo, onde os trabalhos que integram a presente sessão de discussão trazem
  reflexões e desafios de diferentes ordens.


  Uma primeira observação diz respeito ao papel da pós-graduação no alargamento da
  compreensão da arquitetura e do urbanismo no país. De fato, na dupla perspectiva
  de chrónos e de tópos, uma tarefa sistemática de pesquisa vem sendo realizada desde
  os anos 70, a partir da criação dos primeiros programas de pós-graduação da área
  no Brasil. Sua ampliação acelerada, a partir dos anos 90, acopla novas bases territoriais
  de referência, expandindo-se para diferentes regiões brasileiras, o que permite
  integrar problemáticas, ritmos e fundamentos que tornam mais complexa a abordagem
  e a compreensão da experiência da área. Trata-se da construção historiográfica e
  conceitual de nossos campos de formação e de atuação, largamente ancorada nas universidades.
  Os trabalhos aqui apresentados apontam com clareza para essa dimensão: praticamente
  todos eles estão vinculados a instituições de ensino e pesquisa (estaduais, federais
  e privadas), associados ou não a outras instâncias de preservação de memória em
  diferentes âmbitos (arquivos municipais, arquivos e bibliotecas universitárias).


  Por outro lado, um processo de urbanização que tende a acelerar o crescimento das
  cidades por adensamento e superposição, somado a uma esfera democrática crescentemente
  complexa, traz consigo a necessidade de uma compreensão alargada do patrimônio,
  recolocando sob outros parâmetros o ofício da concepção e da proposição em arquitetura
  e em urbanismo. Atuar sobre o pré-existente exige uma cultura sólida de área, onde
  acervos e arquivos passam a cumprir papel relevante no exercício da projetação.
  Diversas das experiências relatadas nos trabalhos desta sessão indicam a importância
  da disponibilização dos acervos recuperados ou em recuperação, seja em função da
  cultura técnica e estética, seja em função das necessidades crescentes de uma proposição
  projetual situada, particularmente as que lidam diretamente com as questões da preservação/recuperação
  do patrimônio construído.


  Outra ordem de considerações diz respeito aos tipos de acervos trabalhados. Em geral
  produzidos ao longo do século XX por profissionais, empresas ou instituições de
  diferentes tipos, a história de cada um deles, de per si, já possibilita compreender
  como e em quais instâncias pode ser percebida a passagem da vida social para a esfera
  do projeto e do construído, ou sua dimensão físico-espacial. Numa espécie de garimpo
  urbano, os interesses dos pesquisadores, nos casos aqui apresentados, se situam
  num campo que vai desde a produção mais excepcional de projetos de arquitetos consagrados
  até a arquitetura mais banal, anônima, exercida através de encomendas particulares
  e projetos de construtoras ou instituições públicas. Comparecem assim desde obras
  de exceção até programas domésticos corriqueiros e projetos-padrão planejados pelo
  poder público em sua missão de povoar territórios com serviços básicos de educação
  e saúde.


  Mas os acervos constituídos não são a única realidade existente: acervos habitam
  também uma esfera do vir-a-ser, na medida em que uma problemática de pesquisa pode,
  ela mesma, dar as bases para a constituição de um novo acervo, no caso, arbitrado
  pelo pesquisador. Nesse sentido, investigar as arquiteturas de concursos é vertente
  muito promissora de criação de acervos e de problematização da produção da área:
  um corte temático, que permite colocar em relação produções oriundas de diferentes
  situações, e um corte sincrônico, que permite acompanhar as diferentes respostas
  projetuais às questões colocadas em determinado espaço-tempo. A formação de novos
  acervos também pode se dar a partir de procedimentos da história oral, através de
  entrevistas e depoimentos, abrindo perspectivas instigantes sobre a apreensão da
  dimensão da experiência em sua relação com as obras, contextos e conjunturas propriamente
  ditas.


  Ainda no que concerne os acervos, registre-se a preocupação com a grande e persistente
  fragilidade de nossas instituições de memória, particularmente — mas não apenas
  — as municipais. Como pensar a proteção e a disponibilização da memória projetual
  e construtiva disseminada em mais de 5.000 municípios brasileiros? Como pensar a
  proteção e disponibilização da memória projetual e construtiva disseminada entre
  o conjunto de agentes que cooperam na produção do espaço? Nesse sentido, há de se
  estabelecer políticas de conservação e de descarte documental para cada uma dessas
  instâncias, evitando a destruição de grande parte dessa memória. O trabalho de conexão
  entre esses diferentes polos produtores de acervos parece essencial.


  Um momento multi e interdisciplinar por excelência comparece nos procedimentos operativos
  relativos aos dilemas da organização e da disponibilização desses acervos. Embora
  a grande maioria dos autores das presentes comunicações seja constituída por arquitetos,
  podemos verificar também a colaboração estreita entre eles e profissionais arquivistas,
  historiadores, bibliotecários e museólogos, bem como com projetistas e operadores
  de arquiteturas de sistemas digitais. Na grande maioria dos casos, pode-se constatar
  uma "generosidade documental", onde um dos objetivos principais dos trabalhos está
  em disponibilizar a documentação para acesso público, grande parte através da internet,
  em sites e blogs articulados com a questão central do trabalho de investigação.
  Interessa também observar que o material a ser disponibilizado pode ser híbrido.
  Isto é, por um lado, comparece o material original, em geral digitalizado ou em
  vias de sê-lo. Mas, por outro, novas informações podem também ser agregadas ou construídas,
  a exemplo de redesenhos, levantamentos de alterações projetuais e construtivas,
  maquetes eletrônicas, entre outros.


  Toda essa atividade, no entanto, tende a ser grande demandante de espaço, em geral
  em instituições já deficitárias desse bem de base. Considere-se o volume ocupado
  por acervos com 100 ou 200.000 documentos relativos à área de Arquitetura. O tamanho
  dos documentos originais, as exigências para o seu adequado tratamento — em algumas
  instituições já se faz sentir a necessidade de criação de um setor de conservação,
  específico para o trabalho de recuperação da documentação — e armazenamento, as
  condições físicas necessárias para a sua disponibilização para consulta criam, em
  geral, uma nova questão: em qual espaço esse conjunto de atividades poderá acontecer?
  Se a solução digital possibilita, ao mesmo tempo, uma economia vigorosa de espaço
  e uma preservação do material original, ao diminuir o seu manuseio, por outro lado,
  ela não substitui — e nem deve substituir — a materialidade tátil e visual de peças
  gráficas e textuais que, por si só, muitas vezes, já constituem uma experiência
  única de apreensão dos processos de concepção e de representação em arquitetura
  e em urbanismo.


  Felizmente, instâncias de ensino superior e órgãos de fomento à pesquisa têm sido
  sensibilizados por demandas relativas a esse tipo de trabalho. É interessante verificar
  que grande parte dos projetos aqui apresentados refere-se a financiamentos obtidos
  em agências de fomento nacionais ou estaduais, bem como a apoios recebidos diretamente
  de universidades.


  Não há dúvida de que muito temos avançado na constituição e preservação de acervos
  em Arquitetura e em Urbanismo no Brasil. Os desafios são muitos, as possibilidades,
  generosas e as conquistas já se fazem sentir em espaço de tempo que pode ser considerado
  breve. Cabe-nos persistir e ampliar esse caminho, dando-lhe maior institucionalidade,
  financiamento e abrigo.'
