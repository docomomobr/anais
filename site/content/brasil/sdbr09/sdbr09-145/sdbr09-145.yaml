abstract: 'O evento, no interior do 9º Seminário do DOCOMOMO, realizado em Brasília,
  abriu-se à inter e multidisciplinaridade para, como referência ao título, analisar
  a experiência de preservação do patrimônio urbanístico-arquitetônico recente. Nessa
  proposta, nada melhor do que Brasília para essa inovação e abertura do DOCOMOMO.
  Poucas grandes cidades oferecem um cenário tão expressivo de estruturas urbanísticas
  e arquitetônicas modernas, sem similar nas Américas. A mesa é composta por quatro
  trabalhos, em que sob ângulos diferentes, se deseja levantar problemas e apresentar
  soluções para a capital do Brasil. Colaboram dois geógrafos — Ignez Costa Barbosa
  Ferreira e Aldo Paviani; um sociólogo, Eugênio Giovenardi e um arquiteto/urbanista
  Benny Schvasberg. Sumariando os trabalhos, temos as seguintes abordagens, por ordem
  de apresentação:


  A geógrafa Ignez C. B. Ferreira considera que Brasília é uma cidade nova construída
  em meados do século XX, expressão do Movimento da Arquitetura Moderna, que se desenvolveu
  no século passado no Brasil e no Mundo. Em 7 de dezembro de 1987, o Plano Piloto
  de Brasília foi guindado à condição de patrimônio cultural da humanidade, pela UNESCO.
  A partir de então, Brasília vive a contradição e o ajuste entre a lógica da preservação
  do patrimônio e o processo de desenvolvimento, que afeta as cidades de seu tempo.
  Brasília expandiu-se pelo território de forma dispersa e fragmentada, formando um
  aglomerado urbano de cerca de 3,5 milhões de habitantes, à semelhança das metrópoles
  contemporâneas. Segundo a autora, há riscos para a preservação, em razão da expansão
  da capital.


  A ocupação do território do Distrito Federal, segundo Eugênio Giovenardi, após cinquenta
  anos da inauguração de Brasília, representa um processo de crescimento acelerado
  da urbanização. O Plano Piloto projetado se constituiu de um agrupamento de habitantes,
  basicamente funcionários públicos e familiares, encarregados de fazer funcionar
  a máquina burocrática do governo. Embora assentados em cidades denominadas satélites
  e a seu redor, agrupamentos reflexivos, semelhantes em sua origem, sem qualificação
  profissional, ocuparam as fímbrias do Plano Piloto em busca de oportunidades para
  satisfazer suas necessidades e seus interesses imediatos. O papel dessa população
  na conservação do patrimônio arquitetônico de Brasília é indefinido e não parece
  pertencer ao quadro de suas preocupações cotidianas. Ela representa mais da metade
  dos habitantes de Brasília. A área rural, por falta de vigilância e controle dos
  órgãos competentes, se reparte em lotes e condomínios informais, que se agregam
  à expansão urbana, provocando devastação ambiental, destruindo a vegetação nativa
  do Cerrado e reduzindo a recarga dos aquíferos. Visto de fora, o planejamento urbano
  parece restringir-se aos monumentos, à projeção de novos edifícios e, especialmente,
  a ampliar o sistema viário com duplicação de vias, viadutos e estacionamentos para
  facilitar o fluxo de automóveis privados em detrimento do transporte público.


  Giovenardi conclui que a área rural e a urbana devem constituir, no DF, uma unidade
  indissolúvel de planejamento, necessária para determinar e definir os limites da
  ocupação territorial, em razão de sua limitada capacidade de suportar a pressão
  populacional e a intensa demanda da riqueza natural. Em sequência, Aldo Paviani
  indica ser necessário e importante preservar o patrimônio urbanístico e arquitetônico
  do Plano Piloto de Brasília. Indica, todavia, que deve-se pensar igualmente nos
  núcleos urbanos periferizados, onde políticas públicas necessitam reduzir as desigualdades
  socioeconômicas.


  Um olhar para a exclusão existente sugere a abertura de espaço para a criação de
  postos de trabalho. Aponta que houve descaso com a natureza nos assentamentos, com
  danos à flora, à fauna e ao aquífero. Nesses assentamentos, a população padece de
  elevadas taxas de desemprego, se comparadas às do Plano Piloto. Esses núcleos foram
  constituídos apenas com a atividade residencial, dependendo do Plano Piloto como
  lugar de oferta de postos de trabalho e serviços. O cotidiano dos periferizados
  transformou-se em constantes deslocamentos casa-trabalho-casa, elevando os custos
  econômicos, o cansaço físico e psicológico dos trabalhadores. Por outro lado, a
  classe média e rica pode contar com os bairros do Lago Norte e Sul e, mais recentemente,
  com o bairro Sudoeste. Com isso, Brasília apresenta contradições e desafios como
  as desigualdades urbanas, vis-à-vis o futuro da preservação do patrimônio urbano
  do Plano Piloto.


  No encerramento da mesa, Benny Schvasberg levanta o problema decorrente da tentativa
  de desenvolvimento e implantação de um Plano de Preservação do Conjunto Urbanístico
  de Brasília de forma descolada de um Plano de Desenvolvimento Territorial e Urbano
  da Área Metropolitana de Brasília. Por isso, aponta o dilema envolvendo a história
  das iniciativas no campo da preservação patrimonial e no campo do planejamento e
  gestão do território metropolitano de Brasília. À luz deste debate propõe a indissociabilidade
  do processo de construção e implementação destes dois instrumentos em vista da eficácia
  de ambos e considerando a sua inexistência até então como desafio que potencializa
  o resgate de aspectos inovadores da origem da capital.'
