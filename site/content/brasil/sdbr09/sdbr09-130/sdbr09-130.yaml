abstract: O artigo busca contextualizar a trajetória profissional de Antonio Garcia
  Moya (Atarfe, Espanha, 21 maio 1891 - São Paulo, 19 jun 1949), arquiteto atuante
  em São Paulo por toda a primeira metade do século vinte. Para tanto, procura apresentar
  alguns aspectos do campo arquitetônico paulistano no período – tais como a formação
  e a regulamentação profissional, as práticas e teorias dominantes – e as disputas
  simbólicas que ocorrem em seu interior, tendo por um de seus instrumentos embates
  em torno de estéticas tradicionais e emergentes. Ou seja, as diferentes posições
  relativas que são ocupadas no espaço cultural por ecléticos, colonialistas e vanguardistas
  – este últimos entendidos como aqueles defensores de uma arquitetura caracterizada
  por uma linguagem de rompimento com historicismos explícitos. Por fim, aventa a
  interpretação de que Antonio Garcia Moya foi um legitimo representante da arquitetura
  moderna em São Paulo, sendo até hoje injustamente pouco lembrado na historiografia
  do modernismo brasileiro. Entre os fatos apresentados como confirmação do argumento,
  estão o seu pertencimento reconhecido por seus pares no grupo modernista articulado
  na cidade de fins da década de dez a inícios da de vinte, os comentários feitos
  sobre suas obras justamente por seus contemporâneos daquele grupo, a sua participação
  na Semana de Arte Moderna em 1922.
