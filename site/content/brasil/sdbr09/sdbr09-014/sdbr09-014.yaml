abstract: Este artigo aborda e desenvolve o tema da determinação plástica e a implantação
  urbana da Assembléia Legislativa do Estado de São Paulo, bem como do Parlamento
  Escocês a partir da conceituação da monumentalidade dos edifícios e sua implantação
  como intenção de manifestação do povo perante o governo. A análise crítica das obras
  ocorreu através da descrição a partir das questões da forma plástica e da implantação
  urbana da Assembléia Legislativa em comparação ao Parlamento Escocês, obra contemporânea
  a ela.
