abstract: 'Na Europa, nos Estados Unidos e na América Latina, a década de 60 foi marcada
  por novos pensamentos, tanto sobre a estrutura física das Universidades quanto sobre
  sua estrutura educacional. No Brasil, dentre o conjunto das universidades existentes
  até 1960, a UnB foi a experiência que melhor se identificou com esse contexto internacional
  de amplas reformas universitárias. Tradicionalmente, mesmo na literatura da Arquitetura
  e do Urbanismo, o projeto da UnB, quando comentado, é apenas citado como uma das
  obras de Niemeyer em Brasília. O importante papel de Lúcio Costa, como autor da
  Universidade é, freqüentemente, silenciado. Um dos possíveis motivos para essa omissão
  é o reduzido registro existente sobre o projeto do campus: o que de fato se encontra
  de mais expressivo é apenas um esboço da universidade, feito à mão pelo arquiteto,
  onde estão traçadas as diretrizes fundamentais da UnB. Mas tanto as publicações
  oficiais de época que divulgaram esse desenho, quanto pesquisas mais recentes, indicam
  que este plano não foi apenas um esboço da Universidade e sim seu projeto principal
  ao longo dos tempos. É sobre este esboço que serão traçadas as análises deste artigo
  que, a partir de uma perspectiva comparativa, permitirão o enquadramento do pensamento
  de Lúcio Costa em relação à produção de espaços universitários tanto no Brasil quanto
  nos países que se destacavam neste campo, notadamente, os Estados Unidos e a Inglaterra.
  O foco da análise recairá sobre os espaços de integração, principalmente as praças
  criadas por Lúcio Costa na UnB e sua relação com o tema dos pedestres e dos automóveis
  que compunham, junto com os espaços de integração, assuntos fundamentais no planejamento
  de espaços universitários. Este artigo reafirma a complexidade e a importância do
  trabalho de Lúcio Costa na UnB, apesar da reduzida importância destinada ao seu
  projeto.'
keyword: Campus; UnB; Lucio Costa; Praça; Automóvel
