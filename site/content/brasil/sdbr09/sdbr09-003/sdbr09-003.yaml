abstract: O presente trabalho apresenta parte do INVENTÁRIO DA ARQUITETURA MODERNA
  CEARENSE (1o Fase). Foram inventariados 24 bens, sendo 13 residências e 11 edifícios
  pertencentes à UFC, localizados no Campus do Benfica. A maioria das edificações
  foi projetada por arquitetos cearenses a partir da década de 1950. Estes arquitetos
  foram os responsáveis pela inserção da produção arquitetônica cearense no panorama
  da arquitetura moderna brasileira. Nos últimos anos, os edifícios da Universidade
  passaram por uma série de intervenções - por motivos de mudança de uso e adaptação
  às novas necessidades da Instituição - comprometendo as preexistências dos princípios
  modernistas. A grande maioria das residencias foram destruídas pela ação voraz da
  especulação imobiliária.
