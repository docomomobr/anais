abstract: 'Neste trabalho apresentaremos a recepção da arquitetura moderna brasileira,
  presente nos números especiais dedicados ao Brasil das revistas européias: The Studio,
  L''Architecture d''Aujourd''hui, The Architectural Review, Aujourd''hui, Art et
  Architecture e Zodiac, a partir das décadas de 1940 a 1960. A seleção dessas publicações
  ocorreu por conta da importância de seus editores no debate arquitetônico do período
  da arquitetura moderna e pela sua representatividade na difusão da mesma.'
