abstract: 'Claudia Cabral problematiza o conceito de interdisciplinaridade, a partir
  da revisão bibliográfica da discussão contemporânea sobre o assunto, e discute as
  suas possíveis implicações para os esforços de preservação do patrimônio arquitetônico
  moderno. Ademais, discute os perigos do uso indiscriminado do conceito de interdisciplinaridade
  que pode levar à dissolução das especificidades disciplinares.


  O segundo trabalho, de Anat Falbel, trata de um aspecto pouco conhecido de Rino
  Levi, mais difundido como arquiteto de hospitais e edifícios verticais: seus projetos
  de cenografia para o TBC — Teatro Brasileiro de Comédia. A contribuição de Levi
  nesta direção — a da experimentação com o suporte cênico como uma dimensão projetual
  paralela e complementar ao seu trabalho mais conhecido — constitui contribuição
  fundamental para a constituição da arquitetura moderna em São Paulo na década de
  1950.'
