abstract: O Palácio da Abolição, projeto do arquiteto Sérgio Bernardes, inaugurado
  no ano de 1970 em Fortaleza, foi construído com o fim de abrigar a residência oficial
  do governador do Estado. Plácido Castelo, primeiro chefe do executivo cearense a
  viver no palácio, decidiu posteriormente por uma ampliação que possibilitou a transferência
  do gabinete de despacho para o local, permitindo, assim, que as funções relacionadas
  ao governador fossem ali exercidas. Autor de um projeto típico da terceira geração
  do Movimento Moderno, Bernardes tratou de tirar partido da privilegiada localização
  em altiplano, a poucos metros da praia do Meireles. A edificação, de configuração
  pavilhonar, é guarnecida por varandas ao longo das duas fachadas de maior dimensão.
  O sistema estrutural, rigidamente modulado, foi concebido com a utilização de tubos
  Mannesmann, de aço especial sem costura, compondo pilares e vigas, em certa alusão
  às estruturas de carnaúba localmente utilizadas. Nos materiais de acabamento, ganharam
  destaque a Peroba, o mármore Cinza Biré e pedras do Piauí e da Paraíba. O jardim,
  concebido por Fernando Chacel é composto por vasta gama de espécimes da flora nativa,
  além de dispor de um “riacho artificial”, com água corrente bombeada, que cumpre
  a função de barreira física entre a edificação e os logradouros adjacentes. Após
  sua execução, em 1972, um novo e arrojado monumento, também de autoria de Bernardes,
  foi incorporado ao terreno, destinado ao mausoléu do Presidente Castelo Branco.
  Passados quase vinte anos de sua construção, após ter servido a seis governadores,
  o Palácio da Abolição foi preterido, em 1987, pelo recém-empossado Governador Tasso
  Jereissati, que decidiu despachar no Centro Administrativo Governador Virgílio Távora,
  bairro do Cambeba, e servir-se da sua residência própria como local de moradia.
  A partir de então, o Palácio passou a abrigar algumas secretarias de Estado e órgãos
  da administração pública; função que desempenha até hoje, sem que necessárias obras
  de reparo e conservação do edifício sejam realizadas. Tomado por divisórias, seus
  quatro mil metros quadrados encontram-se degradados e mal utilizados. Este trabalho
  destaca e resgata uma importante obra do Movimento Moderno no Ceará, que ao perder
  sua função precípua corre o risco de desaparecer por completo, dado o descaso com
  que é tratado tal patrimônio.
