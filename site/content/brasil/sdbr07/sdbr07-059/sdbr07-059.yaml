abstract: OS NOVOS APARTAMENTOS VELHOS O edifício Armênia, do arquiteto Ari Canarim,
  foi projetado em 1955. Nesta época eram construídos os primeiros edifícios residenciais
  modernos em Porto Alegre, no centro da cidade ou perto dele. Moderno, neste caso,
  são edifícios altos, de estrutura independente de concreto armado, revestimento
  de pastilhas e grandes panos de vidro. O Armênia tem 14 andares tipo com dois apartamentos
  diferentes em cada, de 130m2, aproximadamente, distribuídos entre sala de estar,
  sala de jantar, três dormitórios, um banheiro social, lavanderia, dormitório e banheiro
  de serviço, numa planta que pode ser considerada compartimentada. Os primeiros moradores
  eram gente de dinheiro do interior, na sua maioria, que usava o apartamento como
  uma base para visitas esporádicas à capital. Hoje, passados mais de 50 anos, o edifício
  ainda mantém poucos moradores originais, mas naquelas três unidades em que houve
  mudança de proprietário mais recententemente é possível notar algumas algumas coincidências.
  Dois deles foram comprados por arquitetos. Dos três, um é habitato por uma pesssoa
  solteira; outro por um casal sem filhos e o terceiro por uma mãe com dois filhos
  intinerantes, típicos das separações contemporâneas. A média, então, é de dois moradores
  por apartamento, ou seja, 65m2/pessoa. Este não é um fenômeno restrito ao Armênia,
  exclusivamente; alguns dos edifícios do centro e arredores da cidade estão sofrendo
  uma injeção de sangue novo. E de um mesmo grupo sanguíneo, pois se é verdade que
  vários destes edifícios têm alguma característica especial, como o Sulacap, o Santa
  Cruz, o Armênia, o Linck e o Santa Tecla, também é preciso ter alguma educação ou
  sensibilidade especiais para perceber as prováveis vantagens de morar em um velho
  apartamento, onde é difícil dispor de vagas de garagem, onde o encamento e a fiação
  estão envelhecidos, além do desagaste geral da idade. Mas existem as compensações,
  como a relação custo x benefício, no que se refere à área privativa; o ponto, geralmente
  central, em zonas que hoje são mistas, e oferecem tanto comércio quanto serviços;
  a segurança de áreas movimentadas associada ao conforto de portarias 24hs; a claridade
  dos panos de vidro e belas vistas, possíveis em edifícios mais altos, ainda mais
  se no topo dos morros da cidade como é boa parte do centro, da Independêcia e do
  Moinhos de Vento. Isto tudo suportado pelo concreto armado, o quê possibilita as
  necessárias adaptações de programa. O único limite é o envelope externo.
