abstract: 'Modern Houses: Heritage endangered Preservation and restoration belong
  to an area of knowledge with principles and methods which concern any monument,
  independent of its age: ancient, greek, gothic, ecletic or modern; or typology:
  hospital, house or industry. The isolated house, in view of its privacy and its
  indispensable adaptation to the contemporary needs, is a very interesting object,
  which offers a challenge to think about modern heritage. The dwelling has been very
  important to architectural experimentation, because it permits to think and to work
  with everything that involves the human being: his place, the complexity of his
  needs, the materials and technology; the economic issue, the ethical and the political
  aspects. The house was for the modern movement an issue for the urban transformations.
  Even the private house, which is a more specific exercise, in both functional and
  creative order, constituted, specially for the paulista architects, an instigating
  laboratory, where they confronted all sorts of technological problems and tried
  the re-organization of the domestic structure in order to achieve a wider transformation
  of society. Although the house is a usual subject in the architectural historiography,
  it has not deserved the same attention by the public preservationist authorities
  because of the complexity of the problems involved in its preservation, and its
  artistic worth is not understood by the users, owners and let alone the real state
  developers. The analysis of this heritage’s preservation with all kind of problems
  will stimulate the debate about modern heritage. The most paradigmatic Millan’s
  houses still belong to the original owners and are carefully maintained, giving
  strong support for the discussion relative to modern heritage preservation.'
