abstract: 'Park Hotel: o regionalismo crítico de Lúcio Costa e o desafio da rearquitetura
  em obras modernas Entender a concepção projetual. Assim se iniciou uma extensa pesquisa
  realizada a partir de compilações de textos e trabalhos acadêmicos realizados em
  disciplinas relativas à conservação e restauração, sendo nosso objeto de estudo,
  o Park Hotel, projetado por Lúcio Costa. Concebido no início da década de 40, com
  caráter provisório, na cidade de Nova Friburgo/RJ, o Park Hotel é considerado uma
  das obras mais importantes do arquiteto Lúcio Costa na fase anterior à concepção
  de Brasília. Por sua significação, em 1985 o Park Hotel foi declarado parte do patrimônio
  histórico artístico e nacional, reconhecido por Bruandi como um marco introdutório
  da arquitetura moderna no Brasil. A proposta desta pesquisa ganha relevância por
  se desdobrar em duas vertentes. A primeira diz respeito à concentração de informações
  que servem de suporte para a segunda, que possui um caráter mais interpretativo
  dos dados. A partir disso, reunimos documentos e iconografias que se encontravam
  dispersas, somando hoje um número expressivo de material. Este ensaio traz consigo
  uma contribuição à reflexão sobre o desafio de intervenção e de uma rearquitetura
  da arquitetura moderna, já que a sua demanda original foi superada há algumas décadas.
  Para isso fazemos aportes teóricos no que diz respeito ao conceito de restauro crítico
  e a textos escritos por Lúcio Costa, em que ele reaviva a contribuição do regionalismo
  crítico.'
keyword: modernidade; regionalismo critico; rearquitetura
