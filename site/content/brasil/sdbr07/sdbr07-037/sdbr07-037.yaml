abstract: Pelas ruas do mercado, o pulsar de velhos costumes e novos anseios. O desafio
  da requalificação do Mercado Central de João Pessoa - PB. O presente artigo trata
  do projeto de requalificação do Mercado Central de João Pessoa, Paraíba. Construído
  entre 1943 e 1948, o mercado conta com cinco edifícios dispersos em três quadras,
  servidos por rua interna em forma de “Y”. Os galpões em estrutura modulada de concreto
  armado recebem vedações em alvenaria de tijolos e marquises laterais em toda sua
  extensão. Afora o galpão da entrada principal, destinado aos produtos industrializados,
  os demais têm silhueta típica das construções fabris, com cobertas inclinadas e
  sheds à guisa de exaustão e fechamento em forma de brise-soleil horizontal. O programa
  de custos reduzidos gerou uma tipologia rústica, porém amplamente embasada no ideário
  moderno. Pensado para garantir o abastecimento da capital, era o único equipamento
  do gênero, contando a cidade também, com feiras livres na periferia. De localização
  estratégica, o conjunto contribuiu para consolidação da urbanização do Centro em
  torno da Lagoa do Parque Solon de Lucena. A falta de gerenciamento ao longo do tempo
  levou o equipamento a receber grande população adicional de feirantes que construiu
  aleatoriamente em seu interior, desfigurando o projeto inicial. Mediante um quadro
  de total abandono e visando evitar a sua interdição, em 2006, a Prefeitura Municipal
  resolve requalificar o Mercado Central, desordenado espacialmente, com funções desvirtuadas
  e instalações sanitárias em colapso. O projeto preserva o conjunto existente, valorizando-o
  por sua importância arquitetônica, histórica, cultural e econômica e propõe a inserção
  de novos edifícios que dialoguem de maneira digna e sem afetação. O que se pretende
  é devolver à cidade um equipamento condizente com a sua época, uma opção de comércio,
  serviços, cultura e lazer, uma vez que a dinâmica urbana pede cada vez mais espaços
  flexíveis capazes de absorver as atividades de encontro.
