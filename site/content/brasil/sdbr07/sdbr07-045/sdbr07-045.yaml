abstract: Este trabalho procura discutir alguns aspectos das múltiplas dimensões (premissas
  teóricas, práticas projetuais, contextos e implicações político-ideológicas e culturais,
  etc.) identificáveis na atuação multifacetada dos arquitetos modernos brasileiros
  ligados ao antigo Serviço do Patrimônio Histórico e Artístico Nacional — SPHAN.
  Para tanto, são realizadas a documentação e a análise de três exemplos de reciclagem,
  requalificação e rearquitetura de obras pré-modernas por arquitetos modernos cariocas
  no período 1930-80 (o projeto do Panteão dos Inconfidentes [1938-44], no Museu da
  Inconfidência em Ouro Preto, de autoria do arquiteto José de Souza Reis — inicialmente
  confiado a Oscar Niemeyer; e as propostas do mesmo Reis para as "Rampas da Glória"
  [1960], no Outeiro da Glória no Rio de Janeiro — cujo projeto final acabou sendo
  elaborado por Lucio Costa, havendo ainda um estudo de Burle Marx — e para o Hipódromo
  da Gávea [c. 1980], também no Rio de Janeiro). A partir da confrontação das diferentes
  proposições em um desses exemplos e dos três casos entre si, no contexto das obras
  realizadas pelo SPHAN, é possível flagrar "dissonâncias" dentro do grupo, na esteira
  dos estudos mais recentes sobre o assunto, que põem em cheque a suposta homogeneidade
  da "Tradição do Patrimônio".
keyword: arquitetura moderna brasileira; patrimônio
