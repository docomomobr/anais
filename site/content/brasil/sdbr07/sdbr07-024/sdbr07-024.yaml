abstract: No ano de 1976 o arquiteto Paulo Mendes da Rocha realizou um projeto que
  atendia as necessidades do Centro Nacional de Engenharia Agrícola (CENEA) e permitia
  um crescimento ordenado do mesmo, além de criar áreas e infra-estruturas que beneficiavam
  a preservação dos edifícios remanescentes da Real Fábrica de Ferro de Ipanema, existentes
  no local. Como somente parte do mesmo foi executado (em 1985), os edifícios ocorrem
  de maneira aleatória na paisagem, destituídos de qualquer articulação com as demais
  partes e artefatos constituintes deste lugar, entrando em um avançado estado de
  deterioração, necessitando não somente de uma requalificação que respeite as características
  internas e seu limite próximo, mas que mostre a relação dos mesmos com o restante.
  Outro aspecto se soma à questão são as mudanças administrativas que ocorreram no
  local, a extinção do CENEA em 1992 e a posterior ocupação da área pelo IBAMA, possibilitou
  o surgimento de novas necessidades e o desuso ou sub-utilização de determinados
  equipamentos e áreas. O artigo a seguir trás as análises formais e funcionais das
  edificações executadas e a descrição de todo o projeto de Mendes.
