abstract: Este trabalho pretende apresentar a situação atual da arquitetura moderna
  na Cidade Baixa de Salvador, tratar dos riscos existentes para a sua conservação
  e das possibilidades para a sua reciclagem. Considera- se fundamental examinar essa
  situação, uma vez que uma parte específica da Cidade Baixa – denominada Comércio
  – está passando por um processo de revitalização que pode transformar significativamente
  a arquitetura moderna existente no bairro. Toma-se como caso de estudo o edifício
  Caramuru (1946) importante exemplo de arquitetura moderna existente na cidade Baixa,
  projeto do arquiteto Paulo Antunes Ribeiro (1905-1973). Tal edifício passará por
  uma intervenção que modificará seu uso e seus usuários, e pode trazer importantes
  discussões sobre o assunto tratado.
