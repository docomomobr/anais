abstract: Este artigo, por meio de fotografias publicadas na Revista do Patrimônio
  Histórico e Artístico Nacional, celebra um local de encontro entre os fotógrafos
  Marcel Gautherot e Pierre Verger. Esta possível interpretação tem como ponto de
  partida, relações especulativas entre os Gautherot e Verger prévias à atuação de
  ambos na revista. Os pontos de contato suscitados ao longo do texto são apresentados
  com base no que está implícito e explícito, respectivamente, nas páginas da Revista
  do Patrimônio, bem como por meio das intersecções entre as técnicas na elaboração
  da imagem - linguagens e derivações de composição para com referentes culturais
  e edificados - e as motivações de cunho editorial no uso das fotografias estampadas
  na revista.
