abstract: No presente trabalho, buscou-se apresentar o diagnóstico das patologias
  presentes nos edifícios da Escola de Arquitetura (EA) da UFMG – Universidade Federal
  de Minas Gerais – Belo Horizonte, Minas Gerais. Para isso, foram usados documentos,
  tais como plantas baixas dos pavimentos da EA fornecidos por Eduardo Mascarenhas
  Santos, professor do Departamento de Projetos e coordenador da Comissão de Espaço
  Físico da Escola de Arquitetura da UFMG, além de levantamentos feitos pela própria
  aluna e bibliografias sobre patologia e vícios construtivos.
