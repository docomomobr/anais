abstract: Este artigo é um desdobramento dos questionamentos levantados na dissertação
  de mestrado defendida em 2019 para obtenção de título de grau de Mestre em História
  da Arte, Património e Cultura Visual da Faculdade de Letras da Universidade do Porto.
  É estabelecido como objetivo uma reflexão sobre o modelo de produção da arquitetura
  moderna brasileira, tendo sido a mesma orientada pelo ideal de modernização e pela
  busca da identidade nacional promovida pelo Estado. Para tal, a metodologia é baseada
  numa bibliográfica abrangente, tendo como estudo de caso a construção de Brasília,
  visto que esta foi a maior realização do referido movimento. Num primeiro momento,
  é discutida a construção da identidade brasileira, a relação da arquitetura moderna
  e o Estado, tendo sido este seu grande mecenas. Por fim, no segundo momento são
  abordadas as questões da mão de obra e do sistema construtivo – nomeadamente o concreto
  – empregados na construção da nova capital.
