abstract: O presente trabalho trata da análise e da documentação do projeto do Pavilhão
  Reitor Martins Filho, de autoria exclusiva da arquiteta carioca Nícia Paes Bormann,
  com o intuito de registrar as intervenções que a edificação sofreu ao longo de quase
  5 (cinco) décadas, salientando o caráter de flexibilidade da tipologia adotada e
  destacando as características arquitetônicas modernas da edificação em questão,
  que, por seu valor técnico e simbólico, valem ser evidenciadas e registradas. A
  metodologia foi pautada no levantamento de dados alcançados por meio de entrevistas
  com a própria arquiteta e com figuras relevantes vinculadas ao processo do projeto
  original do edifício e de suas intervenções, além de consultas a documentos fornecidos
  pelo Departamento de Arquitetura e Urbanismo da Universidade Federal do Ceará.
