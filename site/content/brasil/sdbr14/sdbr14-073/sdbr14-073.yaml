abstract: Entre as décadas de 1960 e 1970, a cidade de Fortaleza consolida processo
  de expansão em direção ao leste. Diante da não implantação de planos urbanísticos
  e frente a leis municipais que autorizavam a verticalização urbana; agentes imobiliários,
  muitas vezes agindo em sintonia com o Estado, acionam o mercado imobiliário com
  a construção de residenciais multifamiliares nas zonas expandidas. Em meio a este
  processo, recém egressos da antiga Escola de Arquitetura da UFC encontram campo
  fértil para ação projetual pautada nos princípios modernistas trazidos dos ensinamentos
  dos anos de formação. Trata-se do período de maior expressão da modernidade arquitetônica
  cearense.
