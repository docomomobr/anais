abstract: 'O presente artigo tem por objetivo discorrer sobre a concepção e realização
  do Calçadão de Copacabana, no Rio de Janeiro. Obra pública resultante de um longo
  processo de estudos e investigações realizados pela SURSAN - Superintendência de
  Urbanização e Saneamento do Estado da Guanabara, entre 1964 e 1969, quando se iniciou
  a execução da obra, concluída em 1971 e que, além do aterro da orla, incluiu um
  interceptor oceânico. Essa pesquisa histórica e documental, foi apoiada em entrevistas
  com membros do corpo técnico da SURSAN e na investigação diversos acervos públicos
  e privados da cidade do Rio de Janeiro, utilizando referências como: a Revista de
  Engenharia do Estado da Guanabara (jul-set, 1969); a publicação do D.V.U. – Departamento
  de Vias Urbanas, do Estado da Guanabara (1970); e os relatórios do LNEC - Laboratório
  Nacional de Engenharia Civil de Lisboa (1969-70).'
keyword: SURSAN; Copacabana; Burle Marx; arquitetura paisagística moderna; obras públicas
