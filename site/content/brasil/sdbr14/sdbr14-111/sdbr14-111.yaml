abstract: Este artigo apresenta o projeto de silo elaborado por Vilanova Artigas em
  1969 para a CEAGESP – Companhia de Entrepostos e Armazéns Gerais de São Paulo, destinado
  a 5 cidades do interior paulista. Projeto pouco conhecido que enfatiza uma das questões
  colocadas pelo discurso e obras de seu autor - o binômio arte e técnica. Sob esta
  perspectiva, a análise deste projeto aponta à superação de definições tradicionais
  de arquitetura e infraestrutura, deslocando e ampliando os discursos sobre a prática
  moderna para além dos edifícios construídos.
