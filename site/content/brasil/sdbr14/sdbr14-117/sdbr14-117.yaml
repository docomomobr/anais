abstract: Este artigo tem como objetivo discutir a produção da arquitetura moderna
  na sua relação com a construção dos primeiros equipamentos de infraestruturas suscitados
  pelas práticas socioespaciais da atividade de viagem, lazer e turismo, enfocando
  a gênese dos terminais de passageiros de aeroportos modernos, nomeadamente, a Estação
  de Hidroaviões do Aeroporto Santos Dumont (1937-38), de autoria do arquiteto Atílio
  Correia Lima (1901-1943). Essa obra foi fundamental no processo de implantação e
  desenvolvimento da arquitetura moderna brasileira, bem como para a modernização
  do país pelo viés da provisão de infraestruturas no contexto do “proto-turismo”
  no país.
