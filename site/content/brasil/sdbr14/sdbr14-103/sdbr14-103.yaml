abstract: As reflexões de Sergio Ferro e Rodrigo Lefèvre sobre o canteiro de obras
  levantaram discussões a respeito das condições e direitos dos trabalhadores da construção
  civil, partindo dessas reflexões, o presente trabalho pretende discutir as relações
  e conceitos surgidos com o ideário moderno que pautam a condição social da mão de
  obra da construção civil e compreender como o modo de produção econômico vigente
  no Brasil contribui para reduzir os salários da massa operária através de meios
  que induzem à não modernização do trabalho.
