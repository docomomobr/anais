abstract: Este artigo trata do panorama da preservação do patrimônio arquitetônico
  moderno nacional, tendo como objeto de reflexão o Edifício Esther, localizado na
  Praça da República, em São Paulo. Uma das primeiras manifestações de Arquitetura
  Moderna no país, este edifício vem sendo alvo de ações governamentais no sentido
  de sua conservação e preservação. Tais ações, entretanto, revelam-se contraditórias
  na medida em que conservam algumas descaracterizações sofridas pelo edifício desde
  os anos 70, e, também, por não contar com a adesão de seus proprietários e usuários
  neste processo.
