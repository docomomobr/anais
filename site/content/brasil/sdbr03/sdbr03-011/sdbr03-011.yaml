abstract: Na década de 30 do século XX, no Recife, algumas construções foram feitas
  obedecendo ao que seus autores denominavam de estilo moderno. Esse estilo, na realidade,
  não estava muito bem definido morfologicamente e, para justificar o seu uso, ora
  se fazia o elogio da simplificação dos ornamentos, numa óbvia alusão à Art Deco,
  ora se fazia referência á economia resultante do despojamento total de adornos.
  A publicação semanal, em um dos jornais do Recife, de 1932 a 1934, de 76 projetos
  de casas unifamiliares pelo arquiteto Abelardo Gama, um dos fundadores do curso
  de arquitetura da Escola de Belas Artes do Recife em 1932 , com certeza, contribuiu
  para formar ,na sociedade local, uma opinião sobre o modernismo na arquitetura.
  A análise da natureza dos estilos dos projetos das casas publicadas subsidiam os
  estudos do modernismo nos países da periferia.
