abstract: This paper challenges prevailing narratives in architectural historiography
  by uncovering the "forgotten bonds" between China and Brazil—a complex web of architectural
  interactions that functioned as crucial catalysts for modern architectural discourse
  throughout the Global South. While mainstream architectural scholarship has predominantly
  examined North-South trajectories of modernist diffusion, this study reveals how
  South-South exchanges generated alternative pathways for architectural modernization,
  reconceptualizing our understanding of global modernism's dissemination patterns.
  The paper adopts a chronological framework encompassing three distinct phases of
  architectural exchange. Parallel Modernizations (1900-1930) examines how both nations
  simultaneously assimilated modernist architectural discourse through divergent institutional
  channels—Brazil via French Beaux-Arts architectural pedagogy and China through American
  architectural education systems. This period witnessed the emergence of «parallel
  modernizations,» wherein Orientalist architectural vocabularies manifested differently
  within each cultural context. Lucio Costa's early incorporation of Sinified architectural
  elements in his Beaux-Arts competition schemes and Liang Sicheng's modernist methodological
  approach to traditional Chinese architectural documentation exemplify these parallel
  trajectories. Cross-Cultural Syntheses (1930-1950) demonstrates how World War II
  and post-war reconstruction generated unprecedented opportunities for architectural
  cross-pollination. Costa's integration of Chinese spatial conceptions into Brasília's
  urban morphology and the circulation of Oscar Niemeyer's architectural oeuvre within
  Chinese architectural circles illustrate how modernist architectural ideas underwent
  creative transformation through cross-cultural synthesis. This section documents
  specific instances of architectural exchange and design influence that transcended
  geopolitical boundaries, revealing the deep integration of architectural thinking
  within wartime and post-war international collaborative frameworks. Technical Networks
  and Ideological Exchange (1950-1970) analyzes how Cold War geopolitics paradoxically
  facilitated architectural interactions through technical assistance programs and
  infrastructural development initiatives. The simultaneous implementation of American
  Tennessee Valley Authority models in both nations, coupled with Soviet technical
  assistance to China, established indirect conduits for architectural knowledge transfer.
  These technical networks functioned as vehicles for ideological transmission, demonstrating
  how large-scale infrastructural projects embodied competing visions of architectural
  modernity. Major engineering undertakings not only transformed both nations' built
  environments but also served as crucial media for disseminating modern architectural
  engineering knowledge throughout the Global South. This paper contributes to the
  volume's central thesis by demonstrating how architectural interactions operated
  as dynamic catalysts rather than passive conduits for modernist discourse. The "forgotten
  bonds" concept provides a methodological framework applicable to other South-South
  architectural exchanges, while the empirical evidence challenges Eurocentric architectural
  historiography. By revealing these latent networks of modern architectural transmission,
  the paper argues that Global South interactions constituted active generators of
  new architectural modernities rather than mere receptors of Northern influence.
  The study's theoretical significance extends beyond bilateral architectural relations,
  offering insights into how modernist architectural discourse adapts, transforms,
  and generates new meanings through South-South encounters—a process essential for
  comprehending the genuinely global character of architectural modernism.
