abstract: Em 1951, Getúlio Vargas assume seu segundo governo como presidente do Brasil;
  e em 1953, a lei da Petrobrás institui o monopólio estatal do petróleo no país,
  antecedida de decretos que o nacionalizam já nos anos 1930, no primeiro governo
  de Getúlio. Em 1939, a descoberta de petróleo em terreno nacional dá-se exatamente
  no Recôncavo baiano. Esse é um fato preponderante para o reerguimento da economia
  baiana, profundamente imersa em um estado de estagnação a partir de meados do século
  XIX e assim definido no início do século XX. O despertar econômico da capital baiana
  dá-se exatamente nos anos 1950; e entre finais desta mesma década e inícios dos
  anos 1960, em continuidade com processo em curso, surgem na paisagem soteropolitana
  importantes edifícios de linguagem moderna, entre eles a primeira sede da Petrobrás
  na cidade, o Edifício Jequitaia (1957-1961), no bairro do Comércio, projetado por
  Lev Smarcevscki (1924-2004) e Emmanuel Berbert (1929-2016). A partir de 2011, a
  Petrobrás decide criar um segundo edifício-sede em Salvador, a Torre Pituba, no
  bairro do Itaigara. A nova sede é projetada por André Sá e Francisco Mota, arquitetos
  responsáveis por várias obras em Salvador. O objetivo principal desse artigo é demonstrar
  que tais edifícios, como representantes da instituição do petróleo, são obras significativas
  da produção arquitetônica de determinada época e têm suas idealizações acompanhando
  a lógica do desenvolvimento da arquitetura do país e do crescimento urbano da própria
  cidade. A metodologia prioriza material bibliográfico de várias fontes e estudo
  crítico dos projetos. No solo onde se descobriu o petróleo pela primeira vez no
  Brasil, foi também onde a campanha “o petróleo é nosso” mais se popularizou e se
  expandiu. E desse modo, esses edifícios precisam ser compreendidos nas suas arquiteturas
  e como frutos da realidade de uma época em âmbito nacional, mas também local.
