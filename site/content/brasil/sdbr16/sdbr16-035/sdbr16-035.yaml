abstract: 'O período compreendido entre o final da década de 1960 e início dos anos
  1970, no Brasil, foi historicamente denominado como “milagre econômico”. Correspondeu
  a uma época de amplas transformações na infraestrutura das grandes cidades brasileiras.
  O Rio de Janeiro, apesar ter perdido a categoria de capital do Brasil a partir de
  21 de abril de 1960, continuou vigorando como uma importante centralidade de prestação
  de serviços, comércio e turismo, recebendo investimentos em diferentes setores.
  Em 1954, estabeleceu-se na cidade a primeira sede da empresa Petróleo Brasileiro
  S.A. – Petrobrás. A empresa foi se expandindo e em pouco mais de uma década, sua
  administração estava pulverizada em diferentes prédios, o que levou a proposição
  da sua centralização administrativa em um único local. Assim, a partir de 1965 a
  empresa começa as tratativas para a realização de um concurso de arquitetura para
  sua nova sede. Em 17 de maio de 1968, uma comissão escolhia o trabalho vencedor:
  o projeto elaborado pela equipe liderada por Roberto Luis Gandolfi. Os projetos
  das 5 equipes finalistas foram publicados em revistas especializadas, porém os outros
  projetos não foram divulgados, sendo que entre eles havia uma equipe formada por
  6 jovens de São Paulo, liderados por Eurico Prado Lopes e composta por: Conrado
  Jorge Heck, seu irmão Carlos Henrique Heck, Tito Lívio Frascino, Flávio Marcondes
  e Luiz Benedito Castro Telles. Diante desse contexto, a presente pesquisa propõe
  apresentar o anteprojeto realizado pela equipe de Eurico Prado Lopes, com o objetivo
  de identificar as relações com o partido arquitetônico do projeto vencedor. Os procedimentos
  metodológicos utilizados na pesquisa de base historiográfica envolvem: levantamento
  de dados em bases secundárias relacionadas ao concurso de arquitetura, e em base
  primária, a partir do acervo profissional do arquiteto Luiz Benedito Castro Telles;
  descrição e análise da proposta do anteprojeto número 142.'
