abstract: 'Este artigo discute a relevância dos acervos de arquitetura e urbanismo
  para a preservação da memória cultural e para a compreensão dos processos criativos,
  técnicos, políticos, estéticos e sociais da produção arquitetônica, analisando suas
  potencialidades e os desafios de conservação no contexto brasileiro. Caracterizados
  por grande diversidade de suportes — plantas, croquis, maquetes, objetos de construção,
  livros, obras de arte e materiais coletados em pesquisa — esses acervos demandam
  tratamentos específicos de salvaguarda. Exemplos como o acervo de Roberto Burle
  Marx evidenciam sua complexidade multidisciplinar, mostrando que tais coleções não
  são apenas repositórios técnicos, mas espaços de memória e investigação que articulam
  diferentes áreas do conhecimento e valorizam o patrimônio cultural, técnico e artístico.


  Ao explorar a situação desses acervos no Brasil, o artigo identifica desafios centrais,
  como a ausência de instituições adequadas para tratamento, guarda, divulgação e
  exposição. Essa lacuna resulta em documentos dispersos e vulneráveis, dificultando
  o acesso e a pesquisa. Arquivos e bibliotecas tradicionais não são concebidos para
  lidar com a natureza híbrida desses materiais, que combinam elementos arquivísticos,
  bibliográficos e museológicos.


  A insuficiência institucional é analisada à luz da nova definição de museu do ICOM,
  que enfatiza não apenas colecionar e conservar, mas também expor e interpretar acervos.
  O estudo também discute os efeitos de processos neocolonizantes na evasão de acervos
  para o exterior, como os de Paulo Mendes da Rocha e Lucio Costa, gerando perdas
  simbólicas e culturais. Outros entraves incluem fragmentação, descarte e baixa valoração
  de acervos privados, agravados pela pouca difusão pública e pela proximidade temporal
  da produção moderna.


  Apesar desses obstáculos, o artigo destaca o potencial desses acervos como pilares
  de um ecossistema cultural que integra ensino, pesquisa, produção e preservação.
  Por fim, aponta caminhos para sua salvaguarda, ressaltando seu valor cultural e
  econômico para o país.'
