abstract: A cidade de Caracas, na Venezuela, pode constituir-se em um exemplo singular
  entre as cidades latino-americanas que passaram por fortes processos de transformação
  em meados do século XX. De um lado, a capital venezuelana foi caracterizada por
  um novo regime econômico, de outro, pelas mudanças políticas e sociais que provocaram
  a transformação drástica do seu espaço urbano em um contexto caracterizado por intensas
  migrações e processos de urbanização exacerbados. Nesse cenário, a historiografia
  da arquitetura e do urbanismo modernos tem construído um discurso baseado, no geral,
  em obras entendidas como icônicas, as quais simbolizariam a cristalização do ideário
  moderno. Ainda assim, muitas dessas grandes obras executadas na década de 1950 trouxeram
  à tona conflitos que levaram à revisão do pensamento hegemônico, fazendo com que
  algumas delas fossem entendidas, hoje, como estigmas da sociedade. Nessa perspectiva,
  a presente comunicação propõe como objetivo discutir os processos de mutação formal
  do espaço urbano na cidade de Caracas e os consequentes impactos na sua estrutura
  social a partir das novas dinâmicas de habitação, transporte e consumo, bem como
  analisar os discursos utilizados pelas instituições, agentes e autoridades para
  tal fim. Para isso, tomaremos como casos de estudo o Conjunto 23 de Enero (1955-1957)
  e o Helicoide (1955-1961), os quais servem como exemplos das propostas mais representativas
  idealizadas e executadas pelo governo venezuelano na cidade de Caracas – eles são
  reflexo de uma tentativa por construir uma nação mais “próspera” e “moderna”, apostando,
  assim, na transformação da sociedade. Apesar disso, o que se percebe é que esses
  projetos não só fomentaram a segregação espacial e social, mas, inclusive, modificaram
  de forma radical a paisagem caraqueña. Para a análise destes casos foram utilizadas
  publicações em revistas especializadas e documentos oficiais da época, além de outras
  produções bibliográficas e sites especializados.
keyword: ARQUITETURA MODERNA (1); CONJUNTO 23 DE ENERO (2); HELICOIDE (3)
