abstract: 'O conceito de “personagem” sofre evolução ao longo do tempo. Originalmente
  referente apenas a seres humanos, amplia-se e passa a abarcar também seres não humanos.
  No filme argentino “O homem ao lado”, fica clara a noção de personagem aplicada
  a um ser inanimado. Além dos protagonistas Leonardo e Victor, há outra personagem
  relevante: a Casa Curutchet, única residência do arquiteto Le Corbusier construída
  na América. Localizada na cidade de La Plata, Argentina, foi projetada em 1948/49
  para o cirurgião Dr. Curutchet. Mesmo sem conhecer pessoalmente o terreno, o arquiteto
  conseguiu uma adaptação magistral da casa moderna ao entorno pré-moderno. No filme,
  mora na residência com a família o designer Leonardo, apresentado como homem refinado,
  colecionador de objetos de vanguarda. A história inicia com uma obra na parede de
  divisa, onde o vizinho Victor, mostrado como cafona e mal-educado, abre uma janela.
  O fato desencadeia um forte conflito e evidencia o choque de comportamentos e situações
  socioculturais entre os vizinhos. Ao longo do filme, ocorre uma reviravolta entre
  os dois antípodas. No início, Leonardo é visto como “mocinho” e Victor como “vilão”.
  A seguir, essa distinção começa a se confundir. No final, os papéis se invertem.
  A famosa Casa Curutchet participa da ação do filme e vai sendo revelada em pormenores.
  O projeto segue os preceitos de Le Corbusier: planta-livre, pilotis, janela horizontal,
  fachada livre e terraço-jardim. O desfecho é dramático: um assalto à casa tem a
  intervenção de Victor, que leva um tiro. Os bandidos fogem e Leonardo tem nas mãos
  a decisão de salvar o vizinho ou deixá-lo morrer. Opta pela segunda alternativa
  e se livra do problema da janela de forma prática. Há filmes em que a arquitetura
  comparece apenas como cenário ou pano de fundo. Neste, a Casa Curutchet é protagonista
  e personagem fundamental da história.'
