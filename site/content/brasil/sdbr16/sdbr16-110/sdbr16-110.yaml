abstract: 'La Ciudad Universitaria de Madrid, iniciada en 1927 bajo la dirección de
  Modesto López Otero, fue uno de los proyectos universitarios más ambiciosos de la
  Europa del siglo XX. Concebida en un contexto de reformas educativas y modernización
  del Estado, se planteó como un enclave avanzado para la educación superior, donde
  arquitectura, urbanismo y pedagogía convergían para crear un polo de renovación
  científica, técnica y cultural. Inspirado en modelos anglosajones pero adaptado
  al contexto madrileño, el plan articuló monumentalidad, orden y eficiencia, incorporando
  al mismo tiempo un fuerte componente experimental en sus sistemas constructivos,
  metodologías proyectuales y formas de vida académica. La Guerra Civil española interrumpió
  drásticamente este programa. La Ciudad Universitaria se convirtió en uno de los
  frentes de batalla más intensos de Madrid, lo que ocasionó daños severos en muchos
  de sus edificios y en su trazado. La reconstrucción franquista no solo reparó infraestructuras,
  sino que resignificó ideológicamente el conjunto, introduciendo nuevos lenguajes
  y orientando su expansión posterior hacia necesidades simbólicas y prácticas del
  régimen. A las fases iniciales y bélicas se sumaron las ampliaciones desarrollistas
  de mediados del siglo XX, lo que ha dado lugar a un territorio urbano complejo,
  estratificado en capas históricas y estilísticas diversas. Hoy, la Ciudad Universitaria
  sigue siendo una infraestructura activa y un espacio urbano central en Madrid. Sus
  funciones docentes conviven con dinámicas metropolitanas que plantean debates sobre
  conservación, movilidad, sostenibilidad y apertura a nuevos usos. Este trabajo propone
  una lectura crítica del campus como artefacto urbano modelado por múltiples actores
  y temporalidades, estructurada en torno a tres ejes: su función como infraestructura
  estatal y motor de expansión urbana; las lógicas espaciales y proyectuales que han
  guiado su evolución; y los desafíos contemporáneos relativos a su gestión, conservación
  y adaptación.'
