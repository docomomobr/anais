abstract: 'O artigo busca analisar duas cartografias modernas do Maranhão ,no século
  XX, que constam no acervo da Biblioteca Pública Benedito Leite de São Luís : o livro
  ”A peste do Maranhão” do médico Victor Godinho, relatório feito  em 1904 , para
  o Governador Alexandre Collares Moreira e o segundo livro é o “Álbum do Maranhão”
  do jornalista Miécio Jorge, com o mapa da expansão urbana de São Luís de 1950 e
  imagens dos hospitais modernos. A pesquisa busca um diálogo entre as cartografias
  ,a arquitetura hospitalar moderna e o processo de expansão urbana da cidade, resgatando
  fontes primárias e lançando um novo olhar sobre o urbanismo na capital .O recorte
  temporal é a primeira metade do século XX , o recorte espacial é o centro histórico
  de São Luís e o recorte teórico nas fontes primárias do acervo da Biblioteca Pública
  Benedito Leite , livros e relatório da Era Vargas no Maranhão (1935-47) e em autores
  maranhenses que tratam a expansão urbana como (LACROIX 2015,2020) e em autores da
  arquitetura Moderna e hospitalar ( SEGAWA (1999) e COSTA ( 2008,2013).'
