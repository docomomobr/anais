abstract: Desde sua fundação em 13 de setembro de 1946, as edificações da rede de
  equipamentos pertencentes ao Serviço Social do Comércio – Sesc têm contribuído para
  a projeção da arquitetura e do urbanismo em âmbito nacional ao promover a construção
  de novas edificações com características autorais e inovadoras, assim como a reconversão
  de edificações tombadas ou não pelos órgãos de proteção do patrimônio. Neste último
  caso, exemplos como o Sesc Pompeia (Lina Bo Bardi, 1982); Sesc 24 de Maio (Paulo
  Mendes da Rocha e MMBB, 2017); Sesc Paulista (Könisberger & Vannucci, 2018); Sesc
  14 Bis (Aflalo & Gasperini, 2023) e o futuro Sesc TBC. Dentre as contribuições que
  são oriundas das reconversões, exaltam-se os aspectos relacionados a reutilização
  de estruturas que seriam demolidas e gerariam resíduos e a valorização cultural
  e histórica das edificações que perduram no tempo. Porém a decisão sobre o que pode
  ser aproveitado ou demolido envolve mais do que apenas as condições físicas do imóvel.
  Um exemplo desse questionamento pode ser discutido no caso do Sesc 24 de Maio, que
  representa uma história bem-sucedida de reconversão de um antigo edifício de uso
  comercial e residencial, em uma unidade da instituição, no centro de São Paulo.
  Ao mesmo tempo, a história do Sesc 24 de Maio revela uma tomada de decisão dualista,
  uma vez que preservou parcialmente a estrutura de um edifício Art Déco e propôs
  a demolição de um edifício moderno. Assim, o objetivo da pesquisa é contribuir para
  a discussão das questões inerentes ao processo de decisão e definição de quais bens
  edificados são passíveis ou não de demolição, preservação ou conversão, principalmente
  diante da premência de soluções que auxiliem na luta pela reversão do processo de
  esvaziamento e desvalorização das áreas centrais das grandes cidades, como é o caso
  do centro de São Paulo.
