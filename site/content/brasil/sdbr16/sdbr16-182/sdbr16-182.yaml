abstract: No período entreguerras, o allestimento (montagem/disposição) de exposições
  comerciais, industriais, políticas e temáticas consolidou-se como o espaço de atuação
  de arquitetos, designers e artistas plásticos que experimentavam o racionalismo.
  Baseados na suspensão de objetos e utilização de tubos metálicos, os projetos expositivos
  de Edoardo Persico e Marcello Nizzoli tornaram-se referência para outros arquitetos
  do período, como Franco Albini. Albini aliou esses procedimentos ao desenho de suportes
  expositivos e vitrines para mostras de artes visuais. Embora considerada secundária,
  a experiência expositiva desenvolveu princípios utilizados por Albini em interiores
  domésticos, como a busca exacerbada de suspensão de pinturas, esculturas, luminárias
  e outros objetos através de cabos, pedestais em forma de haste e estruturas em grelha,
  o que convertia os espaços em exposições habitáveis. O ecletismo nestes ambientes
  se expressa pela dualidade de materiais e a harmonização de elementos de diferentes
  épocas, permitindo que antiguidades coexistam com peças contemporâneas de design
  exemplar. Para investigar essa relação, adota-se o Apartamento Brion (Milão, 1960-1966),
  localizado na Torre Turati, projetado colaborativamente com Franca Helg, com quem
  o arquiteto já havia trabalhado na reorganização da Galleria di Palazzo Rosso (1952-1962).
  Ocupando o 18º pavimento, o apartamento do industrial e colecionador de arte Giuseppe
  Brion e da esposa Onorina revela sobreposições temporais que evidenciam o abandono
  da integridade imposta aos interiores produzidos por arquitetos modernos. Neste
  caso, a abordagem projetual dos autores sugere que arte e design não se limitavam
  à abstração pura, mas à integração destes aos espaços da vida cotidiana, de forma
  a valorizar os objetos e enriquecer a experiência do usuário, optando pela integração
  de elementos figurativos e abstratos, artesanais e industriais a fim de promover
  justaposições que desafiavam a percepção convencional de espaços e objetos.
keyword: Franco Albini; Franca Helg; Interiores Domésticos
