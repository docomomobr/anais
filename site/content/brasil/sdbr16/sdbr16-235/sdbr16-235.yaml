abstract: A Amazônia - em sua sociobiodiversidade - é cultivada há centenas de anos
  por povos originários e comunidades tradicionais que criaram estruturas de ocupação
  contínua deste imenso território, antes das sociedades europeias implantarem o ethos
  da modernidade/colonialidade. Em meio à separação entre o suposto moderno, civilizado
  e racional e o considerado arcaico e selvagem, a arquitetura, expressão tangível
  da cultura de um povo e documento revelador de um período, corporifica a dupla fratura
  da modernidade, colonial e ambiental, na qual a natureza e aqueles que a habitam
  são apontados injustamente ao papel de antagonistas, ao passo que o homem hegemônico
  ao de herói. Essa pesquisa, coordenada pela Profa. Dra. Renata Martins, centra-se
  na análise do repertório arquitetônico amazônico, a partir de fotografias selecionadas
  do acervo fotográfico da Biblioteca da Faculdade de Arquitetura e Urbanismo e de
  Design da USP, registradas entre os anos de 1950 e 1990. As fotografias selecionadas
  são (re)interpretadas a partir da articulação de matrizes epistêmicas originadas
  dos estudos latino-americanos decoloniais. Isto é, a interpretação das fotografias
  é baseada no reconhecimento das consequências da modernidade/colonialidade no território
  amazônico e na desigual relação entre saber-poder que estas imagens podem exercer.
  Nesse sentido, foram priorizadas bibliografias que evidenciam, de maneira crítica
  e decolonial, o contexto marcado pelo desenvolvimentismo coordenado por países hegemônicos
  e literaturas e reflexões a respeito da potencialidade que a imagem assume ao ser
  transformada, tanto em forma quanto em sentido, por aqueles a que ela se refere.
  Percebe-se que os diversos projetos de desenvolvimentismo na Amazônia são excludentes,
  disfuncionais e amalgamam grupos sociais, unificados à força, em torno de uma identidade
  nacional supostamente consentida. Nesse sentido, procura-se que essas imagens provoquem
  o observador a pensar no papel social que o arquiteto assumiu no passado e pode
  assumir na atualidade, enquanto agente de mudanças.
