abstract: Grades, muros e portões em áreas projetadas para serem livres. Garagens
  que fecham térreos antes permeáveis. Esquadrias trocadas rompendo o antigo ritmo
  e harmonia das fachadas. Sacadas incorporadas aos volumes dos edifícios. Anexos
  que comunicam novas demandas. Estes são exemplos de alterações em conjuntos habitacionais
  modernos construídos pelo Instituto de Aposentadorias e Pensões dos Industriários
  (IAPI) entre 1937 e 1964. Ao vivenciar intensos processos de urbanização e valorização
  do solo urbano, tais transformações avançaram para além dos elementos estéticos
  e tangíveis, frequentemente presentes nas valorações realizadas pelas instituições
  patrimoniais. Atravessados por diferenças e aproximações, atualmente os conjuntos
  IAPI da Mooca e IAPI Vila Guiomar se encontram no interesse e defesa de suas áreas
  livres, partes integrais de seus projetos. Apesar de institucionalmente reconhecidos
  e protegidos enquanto bens culturais, as transformações impostas aos dois Conjuntos
  nas últimas décadas fazem parte de um processo de alteração de valores e práticas
  sociais a eles associados, sobretudo pelos seus habitantes mais antigos. Tanto aquelas
  pensadas e projetadas por seus arquitetos, quanto as do cotidiano de seus moradores.
  Frente a tal problemática e mobilizando estudos sobre as transformações e valorações
  dos conjuntos IAPI da Mooca e IAPI Vila Guiomar, o presente texto se propõe a discutir
  conflitos atuais que se colocam entre práticas preservacionistas, relações dos moradores,
  novas demandas impostas ao morar e valorização fundiária. Pretendemos assim demonstrar
  como as ações tomadas pelas instituições de salvaguarda responsáveis por esses Conjuntos
  revelam vulnerabilidades existentes no trato das instituições de patrimônio com
  a habitação social moderna e os impactos de tais ações naquilo que é efetivamente
  preservado.
