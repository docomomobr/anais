abstract: 'Em um artigo publicado em 2009 na revista POS, explorei as múltiplas definições
  da noção de tectônica em arquitetura, destacando a contribuição das teorias de Gottfried
  Semper e Kenneth Frampton para a construção de discursos sobre a cultura construtiva.
  O arquétipo da cabana primitiva aparece simultaneamente como fundamento antropológico
  das origens da ornamentação, das técnicas construtivas e do simbolismo arquitetônico,
  e como uma tradição duradoura que permeia a história da arquitetura. À luz de uma
  leitura cruzada de debates históricos e contemporâneos, esta comunicação examina
  ocorrências raras, porém significativas, do imaginário da cabana primitiva e de
  técnicas construtivas ancestrais no modernismo brasileiro. Analisamos dois projetos
  emblemáticos: o pavilhão de Oscar Niemeyer no Parque do Ibirapuera (São Paulo, 1951),
  no qual a forma da oca se insinua em uma linguagem modernista — associação reforçada
  pela recepção pública da obra — e o conjunto habitacional de Acácio Gil Borsoi em
  Cajueiro Seco (Recife, 1963), que emprega a técnica da taipa em um sistema de pré-fabricação
  voltado à habitação social. Esses exemplos ilustram como o imaginário das arquiteturas
  vernaculares alimentou a reflexão e a prática modernistas, permeando tanto o imaginário
  coletivo quanto a concepção arquitetônica. Ao mobilizar esses dois casos, argumentamos
  que a cabana primitiva operou como figura crítica no modernismo brasileiro, renovando
  a compreensão das relações entre modernidade, tradição e identidade cultural, e
  abrindo novas perspectivas sobre a cultura construtiva da arquitetura moderna no
  Brasil.'
