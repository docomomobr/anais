abstract: 'No Brasil, a modernidade foi atravessada pelo ideal de ordem e progresso.
  Esse ideário, que preconizava a racionalidade, passou a ordenar e disciplinar tudo
  e todos aqueles que desviavam da norma. Nessas circunstâncias, era necessário medicalizar
  e separar os corpos daqueles que ameaçavam a ordem pública. Na capital da Paraíba,
  emergiram edificações que visavam afastar do meio social aqueles tidos como indesejáveis.
  Dentre essas instituições, nasceu o Hospital-Colônia Juliano Moreira, inaugurado
  em 1928, como uma estratégia de reordenamento espacial que destinou aos bairros
  periféricos as instituições de tratamento e isolamento daqueles corpos incompatíveis
  com a cidade moderna. O edifício neocolonial revela uma das contradições mais significativas
  da modernidade: a contradição. A episteme moderna transgride os limites, se reorganiza,
  se inscreve nas margens, e se desmancha no ar. Ao despertar do sono dogmático, ela
  possibilita a emergência de novo discurso – do moderno. É aquele onde o progresso
  e desenvolvimento andam lado a lado com a prática inaudita do isolamento, silenciamento
  e estigmatização. Não obstante, é também a episteme moderna que possibilita interrogar
  o solo a partir do qual determinadas coisas podem ser ditas, certos discursos podem
  aflorar, e outros, não. É, pois, o que nos permite problematizar: o que pode ser
  considerado moderno? Sob quais condições uma edificação pode ser reconhecida como
  moderna? O Hospital-Colônia Juliano Moreira parece escancarar esses dilemas, ao
  passo em que foi a expressão da modernização da cidade, mas que permanece sem o
  reconhecimento enquanto integrante do patrimônio moderno paraibano. Portanto, o
  objetivo por meio desse texto é problematizar essa instituição enquanto uma edificação
  moderna, além de, questionar a ausência do debate sobre o tema. Para isso, pretende-se
  uma análise documental, articulada com o referencial teórico, a fim de discutir
  o reconhecimento dessa edificação, ainda que paradigmática, mas produto da ideologia
  de um tempo dito moderno.'
