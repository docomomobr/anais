abstract: 'A Revista do Serviço Público (RSP) foi o periódico oficial de comunicação
  impressa entre o governo varguista estadonovista (1937-1945) e o funcionalismo público,
  instruindo-o sobre a ordem e os trabalhos do novo regime político. A linha editorial
  de abordagem ampla contemplava temas ligados à estruturação e às realizações do
  Estado nos campos político, administrativo, econômico, social e da própria arquitetura
  oficial. A análise desse periódico entre 1937 e 1945 permitiu-nos recompor o mosaico
  da produção arquitetônica oficial e o “sistema” criado para coordená-la, imbuído
  dos princípios científicos de racionalização do trabalho aplicados à administração
  pública. Pelo material levantado, especialmente nas matérias reportando os edifícios
  públicos e os “certames expositivos” nos quais estiveram em evidência, tornou-se
  possível recuperar o pensamento, o discurso e as preocupações arquitetônicas oficiais
  acerca do caráter dessa arquitetura – particularmente o “moderno”.


  E não menos importante, entrever atitudes de censura estética ao “moderno extremado”,
  e predileção por linguagens arquitetônicas acadêmicas modernizadas e “moderadas”
  - a despeito do “neoclássico” e do “estilo moderno norte-americano”. Trataremos
  aqui da arquitetura produzida pelo Estado, cujos projetos competiam aos escritórios
  técnicos de arquitetura das divisões de engenharia e obras dos ministérios, dos
  concursos e das contratações externas aos quadros do funcionalismo.'
