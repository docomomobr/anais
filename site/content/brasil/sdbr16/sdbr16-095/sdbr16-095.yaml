abstract: Vivemos em uma fase crítica da crise climática, na qual cerca de 40% das
  emissões globais de gases de efeito estufa (GEE) provêm da construção, manutenção
  e uso dos edifícios. Embora vários esforços busquem mitigar essas emissões no setor
  de Arquitetura, Engenharia, Construção e Operações (AECO), o ato de construir permanece
  como a principal fonte de impacto. A preservação do patrimônio construído traz um
  valor ambiental significativo, pois reduz a necessidade da demolição e a construção
  de novas edificações, alinhando-se à ideia de consumo responsável por meio da reabilitação
  e do prolongamento da vida útil dos edifícios. Portanto, preservar construções existentes
  ajuda a reduzir a emissão de GEE. No Brasil, edifícios modernos — mesmo aqueles
  bem conservados e em uso — enfrentam problemas como manutenção inadequada e desvalorização
  patrimonial. Um caminho para destacar sua importância, além do valor histórico,
  é calcular o Carbono Incorporado (CI), que representa as emissões de GEE durante
  o ciclo de vida do edifício, por meio da quantificação dos materiais usados na construção.Ferramentas
  modernas como o Building Information Model (BIM) permitem a modelagem digital dos
  edifícios, facilitando a quantificação dos materiais e suas emissões de CI. Aliado
  à Avaliação de Ciclo de Vida (ACV), baseada nas normas ISO 14040/44, o BIM possibilita
  a análise dos impactos ambientais nas fases de produção, transporte e construção.
  Este artigo apresenta uma metodologia simplificada para calcular o CI de edifícios
  modernos, utilizando o modelo BIM, com foco no Bloco Principal do edifício Jorge
  Moreira Machado (JMM), localizado na Cidade Universitária do Rio de Janeiro. Com
  dados obtidos de desenhos técnicos originais da UFRJ, a análise concentrou-se na
  estrutura de concreto, resultando em emissões entre 403,49 e 605,23 kgCO₂-eq/m²,
  valores altos para construções contemporâneas. Reconhecer o carbono já incorporado
  evidencia que a demolição e substituição desses edifícios geraria emissões desnecessárias,
  reforçando argumentos para sua conservação em prol da sustentabilidade e resiliência
  climática. A metodologia pode ser replicada em outras pesquisas para formar uma
  base de dados que apoie a preservação com foco na mitigação das mudanças climáticas.
keyword: Metodologia BIM; Carbono Incorporado; ACV
