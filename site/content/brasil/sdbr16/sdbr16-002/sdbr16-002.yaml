abstract: 'O Centro Administrativo Presidente Getúlio Vargas (CAPGV), edifício que
  abriga espaços de escritórios do Banco do Nordeste do Brasil (BNB), apesar de possuir
  grande qualidade arquitetônica, é raramente conhecido, mesmo por estudiosos de arquitetura,
  fora dos limites do estado em que se encontra, o Ceará. Tal edifício combina soluções
  decorrentes de preocupações climáticas específicas da região em que se encontra,
  com cuidados ambientais de diversas ordens, e sistemas estruturais avançados, como
  treliças espaciais metálicas, e possui filiações variadas, do Brutalismo ao High
  Tech, passando pelas provocações envolvendo o debate acerca das Megaestruturas.
  Ainda que alguns estudos já tenham sido publicados sobre o prédio, muitos elementos
  de sua história ainda carecem de aprofundamento. Neste trabalho de pesquisa apresento
  novas informações sobre o projeto do CAPGV despertadas, sobretudo, por conversas
  com os arquitetos envolvidos e por material do acervo do BNB – como jogos de pranchas
  e fotos de maquetes –, incluindo aí algumas informações sobre o projeto de outro
  prédio, o edifício Raul Barbosa (EDIRB), que o precedeu nos esforços de edificação
  de uma sede para o Banco. Com esse material foi possível reconstituir as várias
  fases do projeto, acompanhando suas transformações e permanências. São tratadas,
  por fim, as relações do CAPGV com aquela que é, provavelmente, a maior de suas referências
  projetuais: o Centro Administrativo do Unibanco, projeto de Roberto Loeb, Flavio
  Mindlin e Marklen Landa, realizado durante os anos de 1971 e 1979, hoje já demolido,
  localizado no município de São Paulo.'
keyword: CAPGV (1); EDIRB (2); BANCO DO NORDESTE (3)
