abstract: 'O ato de projetar ativa em si o pensamento utópico. Podemos inferir que
  todo arquiteto é um utopista, pois opera em um universo imaginário para evocar o
  ato criativo do projeto, que nada mais é senão uma representação de um plano ideal.
  Os arquitetos da década de 1960 confrontaram-se com um dilema do qual não havia
  uma escapatória lógica e simples: ao mesmo tempo em que a arquitetura como profissão
  não iria renunciar à sua vocação urbana transformadora, ela seria forçada a reconhecer
  que alguns modelos e valores vigentes estavam socialmente desgastados. Nesse contexto,
  podemos classificar grande parte das novas propostas visionárias desses arquitetos
  dentro do conceito de Megaestrutura definido por Reyner Banham: uma estrutura permanente
  e dominante de grande escala urbana que abriga diversos elementos subordinados e
  transitórios. Acreditava-se que elas proporcionariam uma efetiva flexibilidade urbana
  para a cidade do futuro se emancipar dos dogmas do urbanismo regulatório moderno.
  O grupo Archigram ganhou notoriedade com diversas propostas nos anos 1960 jamais
  executadas, mas que influenciaram significativamente o pensamento arquitetônico.
  Porém, antecessora ao coletivo britânico, a proposta para o Fun Palace concebida
  por Cedric Price em 1962, já demonstrava o radicalismo desse pensamento com uma
  grande estrutura recreativa que materializava novos valores urbanos celebrados na
  pós-modernidade. A partir da análise dessas Megaestruturas, o presente trabalho
  busca estabelecer uma reflexão entre essas obras referenciais nunca executadas e
  sua influência nos concursos de arquitetura da época e, por fim, na conceituação
  de uma proposta recentemente elaborada para um concurso de autoria do escritório
  Hiperstudio. Trata-se de uma concorrência promovida pelo Centro Nacional de Pesquisa
  em Energia e Materiais, em Campinas, que solicitava a transformação do antigo edifício
  do acelerador de partículas UVX, cuja proposta evoca similaridades com a Megaestrutura
  de Price.'
