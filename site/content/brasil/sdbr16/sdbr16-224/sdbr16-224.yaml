abstract: Projetos de arquitetura destinados a concursos estimulam a exploração de
  conceitos, induzindo arquitetos a elaborar propostas inovadoras e transformadoras.
  O presente artigo tem como foco projetos de concursos não realizados elaborados
  pelo arquiteto Roberto Loeb. Oscilando entre a utopia e a realidade, ideações especulativas
  incorporam pesquisa resultante da inquietação em relação a fatos significativos
  em contextos urbanos. A concepção de projetos demanda criatividade, adoção de conceitos
  e articulação entre arte e técnica. A fundamentação teórica adotada pela pesquisa
  entrelaça teorias espaciais para examinar os projetos selecionados, abrangendo desde
  uma visão estática e intelectual até uma abordagem experiencial e fenomenológica.
  A originalidade deste artigo reside na análise dos projetos de concursos elaborados
  pelo arquiteto, fundamentada em conceitos por ele mesmo estabelecidos.
keyword: Teoria do Espaço; Conceito; Circulação
