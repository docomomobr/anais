abstract: De reconhecida relevância no quadro moderno brasileiro, a produção arquitetônica
  dos Irmãos Roberto — Marcelo, Milton e Maurício — encontra na sua dimensão urbana
  alguns dos principais aspectos que a singularizam e que garantem tanto seu papel
  histórico quanto seu valor como experiência de projeto. O presente artigo examina
  a produção residencial multifamiliar dos Irmãos Roberto destacando o papel  desempenhado
  pelo pavimento térreo e, em particular, pelo uso do pilotis como operador espacial
  e urbano. Partindo do reconhecimento de que, no contexto de consolidação da arquitetura
  moderna brasileira, o edifício residencial tornou-se um campo privilegiado de experimentação,
  o estudo investiga como esses arquitetos desenvolveram soluções inovadoras de articulação
  entre o edifício e a cidade. A análise concentra-se em seis edifícios projetados
  no Rio de Janeiro entre 1950 e 1954, período de intensa afirmação do ideário moderno
  no país. A pesquisa estrutura-se em seis categorias de análise — Varanda, Praça,
  Esquina, Aéreo, Mirante e Multiforme — formuladas a partir do diálogo com estudos
  recentes sobre o pilotis. Cada categoria corresponde a uma estratégia específica
  de conformação do térreo, evidenciando como os Roberto reinterpretaram o uso dos
  pilotis segundo as condições do lote, da quadra, da topografia e das demandas urbanas.
  Assim, o pilotis ora atua como espaço de transição semipermeável, ora como praça
  coberta, conector urbano, plataforma elevada ou estrutura plástica, revelando a
  amplitude e as possibilidades destas estratégias. Os resultados demonstram que nas
  obras dos Irmãos Roberto o pilotis se afirma como instrumento ativo de mediação
  entre interior e exterior, capaz de produzir novas formas de convivência, circulação
  e fruição no espaço urbano. Conclui-se que o conjunto de edifícios analisados reafirma
  o papel da produção residencial dos Roberto na ampliação do repertório moderno brasileiro
  e na proposição de modos renovados de relação entre arquitetura e cidade.
keyword: IRMÃOS ROBERTO (1); PILOTIS (2); EDIFÍCIO RESIDENCIAL (3)
