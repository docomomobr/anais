abstract: 'Primeiro Ato: O Teatro Vila Velha é construido entre 1962 e 1964 em Salvador.
  A sua sede era um edifício simples, projetado por Silvio Robatto e Alberto Fiúza
  e construído com materiais obtidos em grande medida através de doações, o que não
  impediu que ele se convertesse rapidamente na “pia batismal dos artistas baianos”,
  como afirmaria Gilberto Gil. A sede do Vila trazia referências à arquitetura colonial
  de Salvador e à restauração, concluída um ano antes, do conjunto do Unhão por Lina
  Bo Bardi, ex-professora de Robatto. Segundo Ato: em 1994, Marcio Meirelles assumiu
  a direção do teatro e convidou o arquiteto Carl von Hauenschild para elaborar um
  projeto de reforma e ampliação, executado entre 1995 e 1998 e que contemplou a reformulação
  total da sala de espetáculos, com a construção de uma caixa cênica flexível, que
  permitia inúmeras configurações para a sala. A principal referência é o Teatro Oficina,
  cuja requalificação concebida por Lina havia sido concluída em 1993. Terceiro Ato:
  passados 30 anos da grande reforma, o Vila precisava se atualizar novamente. As
  obras de requalificação, iniciadas em 2024 e atualmente em curso, se baseiam em
  projeto arquitetônico no qual o autor desse artigo foi consultor, assim como o autor
  da reforma de 1998. Os objetivos foram ampliar os espaços de apresentações e administrativos,
  qualificar tecnicamente as salas de espetáculo e atualizar o edifício às normas
  mais atuais de segurança e acessibilidade universal, além de preservar os valores
  arquitetônicos e históricos do Vila. Os novos elementos são construídos com estrutura
  metálica pintados em vermelho, explicitando-se como inserções contemporâneas que
  contrastam com o edifício branco preexistente. Como na intervenção dos anos 1990,
  o projeto se apropria das preexistências, conformando um palimpsesto de camadas
  sobrepostas umas sobre as outras ao longo do tempo.'
