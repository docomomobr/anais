abstract: 'O presente artigo trata da análise comparativa de duas edificações residenciais
  projetadas para a cidade do Rio de Janeiro, sendo uma localizada no tradicional
  bairro da Tijuca, na Zona Norte da cidade, em 1928 e outra no recém-inaugurado bairro
  de Copacabana, na Zona Sul, em 1933.


  Ambas as construções foram projetadas e executadas pela empresa Freire e Sodré Engenharia.
  Fundada em 1921, a empresa, mais tarde chamada Companhia Construtora Freire e Sodré,
  surgiu simultaneamente ao período de expansão urbana do Rio de Janeiro do início
  do século XX. Criada pelos engenheiros Mário Freire e Álvaro Sodré, a empresa teve
  uma trajetória de sucesso e se tornou referência na construção civil carioca. Ao
  longo de quase cinco décadas, atuou em diversos bairros da cidade, consolidando
  sua presença no cenário carioca.


  As residências aqui estudadas, ainda que concebidas no mesmo período, apresentam
  diferenças estilísticas claras: enquanto a da Tijuca possui  referências neocoloniais
  e hispânicas, a de Copacabana incorpora elementos inspirados nas linhas do Art Déco
  e explicita os ares modernos de Copacabana.'
keyword: CASA CARIOCA; MODOS DE HABITAR; MORAR MODERNO
