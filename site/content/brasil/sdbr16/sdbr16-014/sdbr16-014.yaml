abstract: '“Las ciudades deben devolver a los hombres lo que les quitaron: la luz,
  el aire, el sol, el goce del espacio y del tiempo" – é como se inicia o projeto-manifesto
  elaborado por Amancio Williams e Delfina Gálvez Bunge, publicado em 1976, sob o
  título La ciudad que necesita la humanidad. Essa exploração teórica e projetual
  elaborava uma ideia de cidade em altura, tendo como constante a vista infinita sobre
  a copa das árvores. A condição aérea e ambiental de vivência proposta tem uma correspondência
  em menor escala na primeira obra construída pelo casal de arquitetos, entre 1943
  e 1945: a Casa sobre el arroyo, em Mar del Plata. Representativa dos ideais que
  permeariam sua obra conjunta, associa o habitar ao jardim, ao espaço, ar e luz.
  Apresenta-se como um reflexo da paisagem em que se insere, tanto de maneira figurada,
  ao espelhar a curva do curso d’água que a define, quanto literal, estampando o movimento
  dos galhos e folhas das árvores no plano envidraçado de seu invólucro. É a forte
  presença da vegetação e sua percepção vinculada ao movimento de percorrer a casa
  que não apenas a conectam ao lugar como também a munem de um sentido que é próprio
  da vivência cotidiana. Os projetos de Amancio Williams e Delfina Gálvez Bunge parecem
  sintetizar aquelas sutis substâncias que compõem a arquitetura, como definidas por
  Lina Bo Bardi, para além dos aspectos físicos e materiais: ar, luz, natureza e arte.
  Este trabalho pretende, portanto, a partir da análise da Casa sobre el arroyo, evidenciar
  essa natureza que permeia o projeto, através de sua aproximação a esses sutis elementos
  intangíveis, sem os quais as construções tornam-se vazias de significado.'
