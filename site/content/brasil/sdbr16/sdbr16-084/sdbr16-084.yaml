abstract: 'Escolas estão entre as obras de arquitetura mais interessantes na China
  contemporânea e algumas foram projetadas por empresas conjugais surgidas após liberado,
  em 1995, o funcionamento de escritórios de arquitetura privados, numa economia socialista
  de mercado já consolidada. Uma dessas empresas é a Open Architecture de Li Hu (n.
  1973 e egresso da Tsinghua University em Beijing com mestrado na Rice University
  de Houston) e Wenjing Huang (n. 1973 e egressa da Tsinghua com mestrado em Princeton).
  Com sede na capital chinesa, a Open foi fundada em 2006, quando a China se preparava
  para os Jogos Olímpicos de 2008; Hu trabalhava então com Steven Holl e Huang com
  I.M.Pei.


  Duas escolas em superquadras suburbanas oferecendo do ensino pré-primário ao pré-universitário,
  equipamentos esportivos, auditórios, teatros e acomodações para internato ajudaram
  a firmar a reputação da Open: a Garden School (Beijing 2014) e a Qingpu Pinghe International
  School (Shanghai 2019), e às quais se somou uma congênere exurbana, a Shanfeng Academy
  (Suzhou 2022), o setor cultural da Mountain Kingston Bilingual School, em plano
  elaborado com a TJAD (Tongji Architectural Design Group), o escritório estatal responsável
  pelo projeto dos espaços de ensino e administração.


  A partir de material publicado e material fornecido pela Open, entrevistas com seus
  arquitetos e relatos de arquitetos que visitaram essas escolas, esta comunicação
  vai analisá-las comparativamente e evidenciar seu enquadramento numa tradição de
  arquitetura moderna erudita diversa e inclusiva, num contexto em muitos pontos diversos
  do contexto ocidental em geral e do brasileiro em particular, mas não em todos.
  Oriente ou Ocidente, Norte ou Sul, empresas conjugais aumentam em número desde os
  1990 sem impacto mensurável sobre a qualidade de suas obras. Lá como cá, a qualidade
  continua tributária do entendimento imaginativo de programa, situação e localização,
  admitindo, no caso das escolas, tensão entre postulá-las microcosmo de cidade e
  sua monumentalização face à moradia e ao comércio pré-existente ou planejado.'
