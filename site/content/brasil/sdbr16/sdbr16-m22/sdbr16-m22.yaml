abstract: 'As intrincadas relações entre a arquitetura moderna e o seu passado constituem
  um fértil campo de investigações e revisões. Inicialmente marcada por uma negação
  da história em prol do avanço, a arquitetura moderna transitou pelo ecletismo historicista
  das primeiras décadas do século XX, para posteriormente incorporar as raízes culturais,
  especialmente na produção latino-americana a partir dos anos 1930. Sua inserção
  como conteúdo didático nas disciplinas de história da arquitetura, a partir da década
  de 1960, e a sua consolidação como campo de pesquisa com a criação dos programas
  de pós-graduação nos anos 1970 pavimentaram o caminho para uma revisão crítica à
  luz das pautas contemporâneas. Considerando o tema do 16º Seminário Docomomo Brasil,
  o debate sobre o papel da arquitetura moderna na formação profissional do século
  XXI revela-se não apenas oportuno, mas essencial. Se, por um lado, o vasto legado
  de obras e projetos modernos continua a inspirar e servir como referência fundamental
  para as novas gerações de arquitetos e urbanistas, por outro, a historiografia desse
  período tem sido objeto de críticas significativas. A leitura atenta da produção
  crítica e historiográfica dos autores modernos assume um papel crucial para a análise
  das questões e das obras contemporâneas. Como pertinentemente nos alertou Denis
  Diderot, é a prática que invariavelmente precede e fundamenta a teoria. A historiografia
  da arquitetura moderna, em suas múltiplas dimensões – seja no conteúdo abordado,
  nas metodologias empregadas ou nas teorias propostas – pode oferecer uma contribuição
  rica e indispensável à formação profissional. Trata-se de um conjunto de autores
  nacionais como Lúcio Costa, Paulo Ferreira Santos, Sílvio Vasconcellos, Henrique
  Mindlin e Carlos A. C. Lemos, e de pensadores estrangeiros de igual importância,
  como Nikolaus Pevsner, Bruno Zevi, Manfredo Tafuri, Marina Waisman, Kenneth Frampton,
  William Curtis, Jean Louis Cohen e Josep Maria Montaner. Esta proposta busca levantar
  e aproximar experiências que garantam uma revisão crítica consistente e fundamentada
  e estabeleça um um diálogo profícuo entre o legado desses autores clássicos e a
  produção intelectual da geração contemporânea, representada por nomes como Adrián
  Gorelik, Miwon Kwon, Ynaê Lopes dos Santos, Luis Fernando Lara, Ruth Verde Zein,
  Ailton Krenak, Grada Kilomba, Nego Bispo de maneira a garantir avanços significativos
  e enriquecedores para o campo disciplinar da arquitetura e do urbanismo. Levantamos
  algumas questões para os envolvidos com o ensino e a prática da arquitetura: como
  podemos, de maneira mais eficaz e engajadora, apresentar e discutir o legado da
  arquitetura moderna na formação dos profissionais do século XXI? Que novas perspectivas
  e releituras podem surgir de um encontro renovado com os textos e as obras que fundamentaram
  o pensamento arquitetônico moderno? Que tipo de diálogo crítico e construtivo podemos
  estabelecer entre as lições do passado e os desafios urgentes do presente e do futuro?
  Este painel propõe-se a convidar docentes e pesquisadores a refletir de maneira
  coletiva sobre o papel do ensino da arquitetura moderna na construção de um futuro
  mais consciente e engajado com a nossa própria história.'
