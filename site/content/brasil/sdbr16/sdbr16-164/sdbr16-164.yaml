abstract: Este artigo discute a vulnerabilidade do patrimônio moderno e como este
  é compreendido pela sociedade contemporânea, tendo como objeto o Hotel Tambaú, em
  João Pessoa. Projetado por Sérgio Bernardes (1919-2002) em meados dos anos 1960
  e inaugurado em 1970, o hotel tornou-se símbolo da arquitetura moderna na Paraíba
  e cartão postal da sua capital (Pereira, 2006; Rocha, Tinem e Cotrim, 2017). Construído
  em um banco de areia situado entre duas baías na praia de Tambaú, localização privilegiada
  da cidade, refletia ideários de progresso e poder, visíveis na implantação, forma
  circular, escala e soluções técnico-construtivas empregadas. Durante décadas manteve
  reputação de luxo e prestígio, mas, nos anos 2000, iniciou-se um processo de declínio
  em função de problemas financeiros, culminando no leilão do hotel em 2020. Após
  diversas disputas judiciais, em maio de 2025, o arremate do edifício pelo grupo
  AG Hotéis foi validado, e agora é parte da marca Ocean Palace. Em entrevista ao
  portal G1 PB, o proprietário da rede declarou que pretende preservar sua arquitetura
  original ao mesmo tempo que sinaliza a intenção de modernizar o seu interior (Dono…,
  2025). Imagens veiculadas na mídia sugerem significativa destruição do edifício
  decorrente do longo período de inatividade. Desde seu fechamento, intensificaram-se
  os debates sobre os impactos ambientais e preocupações da ordem da saúde e segurança
  públicas, levando, em tempos de rede social, à emergência de declarações cogitando
  sua demolição. Com base no exposto e considerando a inexistência de mecanismos para
  a sua proteção, condição da maioria das obras modernas de João Pessoa, o artigo
  discute a relevância do Hotel Tambaú face à percepção contemporânea de seu valor
  pela população local a partir do mapeamento da repercussão do caso na imprensa e
  na rede social Instagram, buscando ampliar o debate para além do âmbito dos especialistas.
keyword: Patrimônio Moderno; Arquitetura hoteleira; Sérgio Bernardes
