abstract: O artigo relaciona dois edifícios institucionais de autoria do arquiteto
  Álvaro Siza Vieira. Ambos se utilizam do espaço térreo livre, sendo continuidade
  ao sítio e solução para condicionantes ambientais. Após um século do conceito de
  pilotis estruturado por Le Corbusier, é possível identificar sua revalidação como
  estratégia de projeto arquitetônico para a Biblioteca em Viana do Castelo e para
  o Museu Nadir Afonso em Chaves, edifícios que se relacionam de maneira peculiar
  com o meio que estão inseridos, para o que o espaço em pilotis é determinante. O
  artigo objetiva, através da análise desses dois projetos construídos em Portugal,
  reconhecer a capacidade flexível e a adaptabilidade de um princípio de projeto moderno,
  da década de 1920, que se mantém na arquitetura do século XXI.
