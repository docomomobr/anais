abstract: Como representar a arquitetura em sua dimensão viva— em sua complexidade
  ativa, contraditória e sempre inacabada? Como dar conta de seus movimentos, reconfigurações
  e contínuas reinvenções, sem reduzi-la a uma imagem fixa ou a uma leitura canônica?
  Este artigo propõe uma reflexão sobre a arquitetura em movimento a partir das Unités
  d’Habitation de Le Corbusier localizadas na França.O objetivo é compreender o dinamismo
  da arquitetura a partir das experiências cotidianas dos moradores, documentando
  as múltiplas formas de apropriação, transformação e invenção do espaço. A pesquisa
  parte das proposições de Latour e Yaneva,que reivindicam modos de representação
  capazes de dar conta do dinamismo dos edifícios, e dialoga com Ingold, ao pensar
  a arquitetura como um fazer contínuo—uma linha de vida e não um ponto de chegada.
  Inspirada também nas epistemologias situadas, a metodologia combina levantamento
  habitado, historiografia oral e cartografia sensível compondo uma abordagem que
  privilegia o vínculo entre teoria, experiência e sensibilidade. Ao eleger as Unités
  d’Habitation como campo empírico, a pesquisa busca tensionar a centralidade do autor
  e do projeto, deslocando o foco para as práticas habitantes que reconfiguram e mantêm
  viva a arquitetura. As transformações materiais e simbólicas operadas, longe de
  comprometer a integridade arquitetônica, conferem densidade histórica e sensível
  às edificações, revelando o valor da transformação como continuidade. Assim, o artigo
  propõe pensar a conservação não como preservação da forma, mas como reconhecimento
  da vida que a atravessa— uma arquitetura feita de gestos, memórias e resistências,
  que persiste não por permanecer igual, mas como campo aberto de experimentação,
  transformação e vida.
