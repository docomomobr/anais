abstract: Nesta apresentação analisamos a obra mural de Roberto Burle Marx, entre
  1937 e 1993, partindo da uma hipótese de que a relação deste artista com as paisagens
  rupestres do Brasil estabelece um fio condutor para a produção de sua obra mural
  em pedra e concreto que domina grande parte de sua produção e é desenvolvida a partir
  desta sensibilidade. Assim, ao mesmo tempo que responde a uma proposta das primeiras
  experiências modernistas, em que os painéis de azulejo azul e branco, relacionados
  ao passado colonial, são transformados e adotados como expressão da modernidade,
  há uma força criativa que nunca o afasta da expressão dos materiais naturais inertes.
  O concreto, intercalado com a vegetação, passa a permitir a construção de “réplicas”
  dos jardins rupestres, num elemento de criação de jardins inventado pelo artista
  - o muro escultórico que mistura concreto e vegetação saxícola. Em concreto, Burle
  Marx interpreta formas de cristais como esculturas, painéis como vegetação petrificada
  e muros como grandes falésias. Parece-nos que esta é uma característica específica
  da genialidade do artista que não coincide exatamente com as premissas da integração
  arte e arquitetura, tais como as costumamos descrever.
keyword: Burle Marx; Mural moderno; Mural escultórico
