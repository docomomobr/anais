abstract: O Ministério da Educação e Saúde Pública (MESP) foi dirigido por Gustavo
  Capanema que assumiu o posto em 1934 e foi o grande motor do processo para viabilizar
  a nova sede do “Ministério do Homem”. O edital do concurso para o projeto foi lançado
  em 20 de abril de 1935, e resultado definitivo foi divulgado em 1 de outubro de
  1935, sendo Archimedes Memória declarado vencedor. O convite formal foi feito a
  Lúcio Costa em 25 de março de 1936, sendo sua proposta de 30 de março. Lúcio então
  com 34 anos formou uma equipe definida por afinidades pessoais e de trabalho. O
  projeto foi entregue em 15 de maio e, em 26 de junho, Lúcio encaminha carta a Corbusier
  na qual relata que autorização de Capanema para formalizar o convite que previa
  analisar e dar parecer no projeto. Le Corbusier permanece 30 dias no Rio de Janeiro
  e realiza dois estudos, sendo o primeiro para um terreno à Beira Mar, o segundo
  para o terreno atual. Porém um novo projeto diferente dos anteriores foi entregue
  pela equipe brasileira em 5 de janeiro de 1937, sendo pedra fundamental do edifício
  lançada em 24 de abril. A conclusão do edifício e sua inauguração só ocorreu em
  03 de outubro de 1945, no entanto, seu reconhecimento com obra notável da arquitetura
  e engenharia nacional foi consolidado com o tombamento como patrimônio nacional,
  em 1948. Apesar da proteção o prédio passou por uma série de obras de conservação,
  restauração, reformas e modernização ao longo de oito décadas, que introduziram
  modificações, mas preservaram as qualidades reconhecidas internacionalmente, com
  a sua inclusão em 1996 na lista indicativa a Patrimônio Mundial da UNESCO.
