abstract: 'A síntese entre arquitetura e estrutura, que caracterizou as primeiras
  construções em Brasília, se desdobrou em iniciativas pioneiras voltadas à racionalização
  da construção, após a inauguração. Baseada no uso de componentes pré-moldados em
  canteiro, o desafio subsequente era de alcançar a expressividade arquitetônica com
  técnicas próprias da pré-moldagem.


  Essa nova fase consolidou-se na Universidade de Brasília, onde os projetos se baseavam
  no esqueleto estrutural independente e a estrutura aparente ganhou papel preponderante.
  Ao combinar padronização e economia às qualidades plásticas compositivas, as realizações
  atestam um modo inventivo próprio de racionalização construtiva.


  O Instituto Central de Ciências (ICC) é o resultado mais relevante, dentre as experiências
  do Campus.Com mais de 700 metros de extensão, sua composição em pórticos expressa
  a lógica estrutural e as diretrizes da pré-fabricação, mas subordina a repetição
  modular e a simetria geométrica a uma expressão arquitetônica de caráter singular.


  Baseado na documentação original, este artigo analisa concepção, desenvolvimento
  e execução do ICC, que permanece como marco da racionalização construtiva no Brasil
  e testemunho de que existem caminhos possíveis para a indústria nacional da construção
  por meio da inovação técnica.'
keyword: Instituto Central de Ciências; Racionalização da Construção; pré-fabricação
