abstract: 'Este trabalho propõe uma abordagem teórica a dois edifícios efêmeros e
  contemporâneos: o Altar para a Primeira Missa em Brasília (1957) e o Pavilhão do
  Brasil na Exposição Universal de Bruxelas (1958). Através deles, investiga-se como
  formas arquetípicas — particularmente a tenda — foram mobilizadas para articular
  narrativas nacionais complementares: o gesto fundacional (Holston, 1989; Tavares,
  2022) e o mito do progresso (Zein, 2012). Para responder à pergunta “Seria o projeto
  arquitetônico capaz de converter-se em expografia, operando como dispositivo crítico
  e simbólico?”, parte-se da hipótese de que, no contexto brasileiro, o formato expositivo
  e o seu receptáculo revelam tensões entre tradição (Hobsbawm, 1997) e desvio como
  motores do projeto moderno, permitindo explorar suas origens tropicais a partir
  do que remanesce. A metodologia envolve a busca em fontes arquivísticas e outros
  documentos, que contrapostos à recepção crítica das obras, aproximam-se sob a hipótese
  de um desajuste da identidade nacional entre repercussão interna e prática diplomática.
  Com o objetivo de compreendê-los enquanto protótipos que refletem conflitos sobre
  representação e projeto, defende-se um pensamento crítico-teórico nacional (Bastos,
  2003, p. 255-264) pelos modos de expor-se. A comparação Altar–Pavilhão revela os
  meios que ambos utilizam  para transformar arquitetura em dispositivo expositivo
  sendo, neste caso, a tensão entre projeto e contingência, geradora de novas leituras
  da modernidade brasileira. A presente análise conduz à identificação de paradigmas
  que operam fora dos cânones convencionais da historiografia moderna brasileira,
  observando a arquitetura como uma exposição de si mesma (Colomina, 1994; Bo Bardi,
  1957), reforçando a máxima de Paulo Mendes da Rocha de que “a arquitetura torna-se
  a linguagem por excelência”.'
keyword: Expografia; Crítica; Arquitetura Moderna brasileira; Teoria e Projeto; Identidade
