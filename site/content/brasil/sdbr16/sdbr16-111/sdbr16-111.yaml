abstract: Este trabalho tem como objetivo analisar a viabilidade do campus UFV - Viçosa
  como paisagem cultural, como mecanismo de auxílio na salvaguarda de suas múltiplas
  camadas temporais, dando ênfase à camada histórica moderna. Contemporaneamente,
  a “paisagem cultural” é compreendida como toda delimitação geográfica que expressa
  a apropriação social do espaço, materializada em bens materiais e imateriais. Nesse
  sentido, o campus da Universidade Federal de Viçosa (UFV), cuja trajetória passa
  por três fases institucionais, constitui um exemplo significativo. Entre essas se
  destaca a terceira, marcada pela incorporação dos ideais modernistas na arquitetura,
  desenho urbano e paisagismo, características atualmente ameaçadas pelo crescimento
  desordenado. Para atingir os objetivos propostos optou-se por aplicar a metodologia
  de vetores desenvolvida por Rocío Silva Pérez e Víctor Fernández Salinas, de modo
  a identificar inicialmente a vocação do campus. Foram identificados três eixos norteadores,
  natural, cultural e histórico, que compilam os vetores de acordo com suas características.
  O eixo histórico, que constitui o foco central deste artigo, apresenta como principais
  vetores o patrimônio arquitetônico, o desenho urbano e os parques e jardins. Esses
  elementos, fundamentais para a conformação e compreensão da paisagem histórica,
  evidenciam a estruturação e a evolução do território ao longo do tempo. Como resultados
  iniciais, foram elaboradas tabelas que sistematizam os vetores do eixo histórico
  a partir de um conjunto diversificado de fontes. Propõe-se uma análise da linguagem
  moderna que compõe parte significativa do acervo da UFV/Viçosa, tendo como recorte
  temporal o período entre as décadas de 50 e 70, buscando compreender como os princípios
  modernistas se materializam e influenciam a organização espacial. Posto isso, evidencia-se
  a importância da preservação desses elementos, constituintes da paisagem cultural
  associada ao campus, reconhecendo seu papel no fortalecimento da identidade institucional
  e na valorização arquitetônica e paisagística da universidade.
