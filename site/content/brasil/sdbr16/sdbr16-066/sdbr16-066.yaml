abstract: O artigo propõe uma análise comparativa entre edifícios hospitalares modernistas
  e contemporâneos, com foco na relação entre arquitetura, urbanismo e cidade. O estudo
  examina os projetos do Hospital Pérola Byington e do Hospital Antônio Cândido de
  Camargo, ambos concebidos sob os valores da arquitetura moderna, em confronto com
  o Hospital da Mulher de São Paulo e o Hospital de Urgência de São Bernardo do Campo,
  representativos da produção recente, pós RDC50/2002. Parte-se do reconhecimento
  de que os hospitais são equipamentos estruturantes do tecido urbano, com potencial
  de qualificar ou fragmentar os bairros onde se inserem. Com base em análise documental,
  leitura morfológica e observação de campo, a pesquisa investiga como as decisões
  projetuais impactam a permeabilidade, os fluxos, a acessibilidade e a vitalidade
  urbana em torno dos edifícios de saúde. O artigo propõe diretrizes para atualizar
  os valores modernos de abertura, racionalidade e clareza funcional na concepção
  de hospitais contemporâneos mais integrados ao contexto urbano, capazes de fomentar
  bem-estar, pertencimento e acessibilidade social.
