abstract: O trabalho propõe uma discussão sobre as contribuições de duas arquitetas
  modernas, contemporâneas ,  que se dedicaram a âmbitos diferentes da arquitetura
  moderna brasileira. A gaúcha Enilda Ribeiro e da capixaba Maria do Carmo Schwab.
  Para, através de uma leitura feminista que tensiona os cânones estabelecidos e revela
  narrativas historicamente silenciadas, tecer uma compreensão contemporânea da arquitetura
  moderna brasileira produzida por arquitetas. Busca-se entender como essas arquitetas,
  em suas práticas crítica e projetual respectivamente, oferecem chaves interpretativas
  para repensar o projeto moderno brasileiro na primeira metade do século XXI. A pesquisa
  se estrutura a partir do entendimento do presente como "campo de tensões e confluências",
  onde o moderno brasileiro – tradicionalmente narrado através de figuras masculinas
  hegemônicas como Oscar Niemeyer e Lúcio Costa – é reinterpretado através de epistemologias
  feministas que revelam outras modernidades. Para Enilda Ribeiro militância e prática
  profissional se sintetizavam. A teoria, a prática e a crítica da arquitetura e do
  urbanismo foram realizadas sob a orientação da ideologia proletária e sempre ao
  lado da classe operária. E a visão crítica do contexto no qual estava inserida fez
  com que a arquiteta desenvolvesse uma produção teórica e crítica muito avançada
  para sua época e de grande atualidade para os tempos que vivemos. Quando todo o
  país estava envolvido no entusiasmo do sucesso da arquitetura moderna produzida
  aqui, Enilda já avançava na análise dessa produção no contexto da realidade social
  e econômica do país, entendendo que a grande maioria da população estava à margem
  dos avanços técnicos, projetuais e programáticos da arquitetura moderna. A crítica
  de Enilda pretendia retomar os princípios da arquitetura moderna como resposta teórica
  e prática da arquitetura às questões do contexto social, econômico e tecnológico
  no qual se inseria Maria do Carmo Schwab, por sua vez, representa uma geração de
  arquitetas de prancheta, atuando ativamente desde sua formação, em 1953, até 1981,
  como uma das arquitetas responsáveis pela interiorização dos princípios da arquitetura
  moderna no Brasil e pelo aumento do acervo da arquitetura moderna no Espírito Santo.
  A obra de Schwab se destaca por sua qualidade arquitetônica, avanços técnicos, a
  inventividade, a pesquisa plástica e volumétrica que fazem de seus projetos uma
  referência para esta arquitetura. Mas também é importante destacar quantitativamente
  suas produções. O artigo argumenta que a partir da produção de ambas as arquitetas
  é possível estabelecer simultaneamente uma crítica ao passado moderno e um posicionamento
  para a prática atual e futura, recuperando suas trajetórias e suas contribuições.
  Recuperando trajetórias femininas apagadas da história da arquitetura moderna brasileira,
  não apenas reescrevendo o passado, mas também ampliando o horizonte de expectativas
  para as gerações futuras de arquitetas. Metodologias de pesquisa historiográficas
  feministas contemporâneas promovem deslocamentos epistemológicos, questionam os
  centros hegemônicos ao evidenciar as contribuições das periferias de gênero, mas
  também regionais e socioculturais; tensionam fronteiras geográficas e culturais
  ao demonstrar como diferentes territórios brasileiros desenvolveram modernidades
  próprias; e desafiam os cânones estabelecidos ao revelar outras genealogias e outras
  possibilidades referenciais para a arquitetura moderna. As práticas de Ribeiro e
  Schwab, são exemplos concretos de como uma "cultura aberta às relações entre diferenças
  e multiplicidades" pode reconfigurar nossa compreensão do moderno brasileiro. Suas
  contribuições evidenciam que o projeto moderno, longe de ser um movimento monolítico
  e masculino, sempre foi plural e diverso, incorporando sensibilidades e metodologias
  que apenas recentemente começam a ser reconhecidas e valorizadas. Por fim, o artigo
  sugere que uma perspectiva feministas não apenas oferecem uma releitura crítica
  do passado moderno, mas principalmente apontam para "distintos e divergentes futuros
  da arquitetura" brasileira, onde a diversidade de vozes e metodologias pode contribuir
  para enfrentar os novos paradigmas urbanos, tecnológicos e sociais do mundo contemporâneo.
