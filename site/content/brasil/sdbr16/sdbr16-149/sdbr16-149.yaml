abstract: 'Este artigo traça a trajetória da produção literária e editorial da Escola
  de Arquitetura da Universidade Federal de Minas Gerais (EAUFMG) entre 1924 e 1975.
  Antes da formalização das edições da Escola, a atividade literária era impulsionada
  por seus fundadores, como o polímata Aníbal Mattos, que publicou obras importantes
  sobre história da arte e da arquitetura brasileira a partir de 1924. Outros membros
  do grupo inicial também contribuíram com livros técnicos e históricos.


  O processo de institucionalização se consolidou em 1955 com a criação das “Edições
  Arquitetura”, sob a direção de Aníbal Mattos, que visava estabelecer uma imprensa
  universitária. A compra de um “aparelhamento tipográfico Multilith” e a inauguração
  do Serviço Gráfico da Escola de Arquitetura em 1957 permitiram a publicação regular
  de obras de diversos temas.


  A partir da criação de um “tripé” de pesquisa, documentação e edição, a escola atingiu
  um ritmo notável. Entre 1960 e 1964, foram editados 67 títulos, uma média de quase
  dois livros por mês. A editora lançou coleções como “Documentário Arquitetônico”
  e a “Traduções escolhidas”, e publicou teses de professores, como a de Sylvio de
  Vasconcellos, além de obras fundamentais como a “Carta de Atenas” e o primeiro volume
  das “Obras completas” de Lucio Costa. Destaca-se ainda a monumental “História da
  Arquitetura” de João Boltshauser, publicada em seis volumes entre 1965 e 1972.


  A intensa atividade de pesquisa histórica e a publicação de mais de 200 títulos
  pelos professores da EAUFMG funcionaram como motor para a pesquisa na Escola, constituindo
  hoje uma fonte documental inestimável para o campo da arquitetura e do urbanismo.'
