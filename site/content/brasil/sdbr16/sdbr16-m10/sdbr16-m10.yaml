abstract: O estudo da tipologia hospitalar como um importante contributo aos estudos
  da modernidade está cada vez mais latente nas pesquisas de arquitetos, urbanistas,
  engenheiros e historiadores. A importância de se estudar esta tipologia está em
  se debater como os projetos para a saúde responderam aos desafios sociais e científicos
  demandados para sua realização, em plena modernidade da primeira metade do século
  XX. A arquitetura moderna da área da saúde é um programa de modernidade e inovação
  que norteou a concepção da arquitetura moderna. Esta sessão busca ser um espaço
  de discussão dessa temática no âmbito do Docomomo Brasil, que tem recebido estudos
  em seus seminários, desde particularmente o Homework elaborado para o Docomomo Internacional
  intitulado “Health and Modern Architecture”, entre 2011 e 2012. A partir dessa importante
  iniciativa, as preocupações quanto à conservação, proteção patrimonial e identificação
  de acervos relativos a essa tipologia do movimento moderno têm sido contempladas
  por pesquisadores de diferentes áreas, entre instituições públicas, privadas e autônomas.
  Orientados pela medicina, os projetos para edificações de saúde procuraram trazer,
  em sua essência, respostas concretas cujas marcas ainda estão em nossas cidades
  e no nosso cotidiano citadino. Ao mesmo tempo que configuram importantes contribuições
  à arquitetura moderna, sua conservação e preservação enfrenta os desafios inerentes
  a qualquer obra do período, acrescidos das preocupações quanto à manutenção de seu
  uso e características construtivas originais. Devido às necessidades espaciais e
  às demandas tecnológicas, a transformação, a desativação ou a demolição são uma
  certeza. Vale lembrar que na Holanda, com a iminente destruição do sanatório Zonnestraal,
  surgiu a oportunidade de criar o Docomomo Internacional no ano de 1988, evidenciando
  o quão necessário é pensar na proteção e valorização desta tipologia entre as diretrizes
  da preservação do Movimento Moderno. A despeito dessa origem, sentimos que a arquitetura
  hospitalar moderna ainda não foi devidamente estudada no Brasil, embora recentes
  contribuições estejam surgindo de diferentes partes do país. Se um hospital precisa
  continuar sendo útil ao que foi demandado para sua construção, deve-se apostar na
  tecnologia em detrimento da conservação de seu projeto original? Ou deve-se preservar
  suas características arquitetônicas originais que justificaram a relevância de seu
  projeto para a história da arquitetura, e rever seu uso? Como conciliar tais desafios?
  O diálogo é necessário e cada vez mais urgente. Nesse sentido, a preservação de
  acervos de arquitetura e engenharia da saúde do período moderno se faz cada vez
  mais presente, indicando atitudes mais atentas das instituições de preservação e
  salvaguarda como contribuição à proteção patrimonial dos espaços de saúde. Esta
  sessão estabelece como objetivos reconhecer os edifícios modernos de saúde como
  uma tipologia moderna que ainda precisa ser compreendida como parte dos ideais do
  Movimento Moderno; identificar os edifícios modernos de saúde como sujeitos a contínuas
  transformações espaciais e reconhecê-los como edifícios paradigmáticos para discutir
  estratégias de conservação e reabilitação dentro da ideologia do Movimento Moderno;
  e, por fim, identificar as características singulares dos projetos, , a forma, a
  tecnologia e o conhecimento como base para a definição das estratégias de intervenção.
