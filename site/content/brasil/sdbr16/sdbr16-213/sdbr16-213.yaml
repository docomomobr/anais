abstract: O artigo é um aprofundamento do redesenho da Residência Hercílio Luz Filho,
  projetada por Pedro Paulo de Melo Saraiva em 1954, na Ponta da Joaquina, Florianópolis.
  Através do método do redesenho, o estudo apresenta as soluções arquitetônicas e
  técnicas — viáveis ou não — para implantar a casa sobre uma rocha saliente em um
  promontório granítico. O trabalho destaca a importância de documentar projetos não
  realizados, pois eles ajudam a compreender as origens de difusão da modernidade
  e colaboram na construção da historiografia moderna. As imagens fotorealistas criadas
  buscam mostrar com rigor e precisão a materialidade da casa, a sua modulação estrutural
  e o diálogo com a paisagem. A base da análise incluiu estudo de documentos originais
  do Acervo PPMS, publicações da revista Acrópole, entrevistas com o próprio arquiteto
  e referências a outros arquitetos como Rino Levi e Oswaldo Bratke. O estudo aprofunda
  a implantação da residência no terreno com base na topografia atual, que resultou
  em um modelo físico, que também colaborou na construção das imagens fotorealistas.
  As soluções adotadas evidenciam como Pedro Paulo de Melo Saraiva assimilou influências
  da arquitetura paulistana e da Costa Oeste dos EUA, representadas especialmente
  pela obra residencial de Oswaldo Bratke na década de 50. O processo de redesenho
  e análise também refletem como a documentação arquitetura moderna pode e deve ser
  usada como material de projeto no ensino da arquitetura.
