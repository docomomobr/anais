abstract: 'Reconstruir arquiteturas desaparecidas é pecado capital segundo o senso
  comum no campo do patrimônio. A realidade, no entanto, prevalece sobre o debate
  teórico, e reconstruções não parecem ser tão nefastas assim. Pelo contrário: podem
  ser um recurso contra a deterioração e em prol da preservação do legado arquitetônico,
  já que fazem um edifício viajar no tempo por meio de seu projeto. Este é o caso
  do Pavilhão Alemão, projetado por Ludwig Mies van der Rohe e Lilly Reich. Concebido
  para ser temporário, o prédio foi demolido em 1930, após o final da Exposição Internacional
  de Barcelona. O “Pavilhão” entrou para a história da arquitetura através de textos
  e fotografias em preto e branco, até que, em 1986, uma nova versão, em cores, foi
  inaugurada com’era dov’era. A operação, filologicamente rigorosa, conferiu à cópia
  uma (falsa?) permanência que até hoje se opõe à (autêntica) fragilidade do original.
  A este propósito, o trabalho apresenta o caso de duas exposições realizadas no Pavilhão
  Alemão, em 2021 e 2023. As intervenções atuaram de forma simbólica e efêmera sobre
  o vidro e o travertino, materiais fundamentais desde a versão “original”. As instalações
  implicaram a movimentação de lajes de travertino do piso elevado e a exposição de
  um conjunto de vidros soprados descartados como refugo de ateliês de artesãos locais,
  expondo as entranhas do prédio, revelando reparos, correções e diferenças em relação
  à sua primeira versão. O cenário resultante explorava a um só tempo a transparência
  e a refletividade do vidro e lembrava um canteiro de escavações arqueológicas, aludindo
  a memória e reconstrução. Estas interferências artísticas ensejam a reflexão de
  que mais artificial que a réplica é a manutenção de sua aparência nova-em-folha
  e que, embora a reconstrução do pavilhão tenha almejado solidez e permanência, a
  fragilidade é uma questão de tempo.'
keyword: Reconstrução; Autenticidade; Pavilhão de Barcelona
