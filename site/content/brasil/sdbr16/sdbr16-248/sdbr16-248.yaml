abstract: Este artigo defende que a trama deve ser compreendida como uma estrutura
  morfológica, um gesto autoral e uma sintaxe visual, como também como uma chave de
  leitura para compreender o uso do azulejo na arquitetura moderna brasileira — não
  apenas como ornamento ou revestimento, mas como linguagem crítica que articula arte
  e arquitetura. Em vez de restringir-se à oposição historiográfica entre o painel
  artístico e o revestimento, dota-se uma perspectiva transversal, em que a trama
  emerge como operador projetual, histórico e simbólico. Ao articular composição,
  cor, padrão e escala, o azulejo moderno funciona como campo pictórico, ornamento
  e pele tectônica, afirmando-se como linguagem crítica entre as décadas de 1930 e
  1970, com repercussões contemporâneas. A compreensão dessa sintaxe exige atenção
  às raízes históricas do uso do azulejo no Brasil. Antes da arquitetura moderna,
  o Neocolonial apropriou-se desse material como signo de identidade nacional e tradição
  inventada, alinhado a movimentos internacionais voltados à construção de narrativas
  nacionais por meio da retomada de repertórios históricos. Tais painéis em azulejo
  — figurativos e narrativos — mobilizam tramas regulares e padronagens rítmicas que
  ativam signos territoriais e culturais, produzindo pertencimento baseado em imagens
  ficcionalizadas do passado colonial luso-brasileiro. Esse imaginário ecoa no Movimento
  Moderno, e o painel Estrela-do-mar e Peixes, de Cândido Portinari, no Ministério
  da Educação e Saúde (MES, 1936), constitui exemplo emblemático dessa continuidade
  crítica. Ao aproximar esse painel das composições neocoloniais, o artigo evidencia
  convergências formais e simbólicas. Ambos mobilizam a azulejaria como dispositivo
  de identidade nacional. Assim, a trama emerge como sintaxe visual que media memória
  e invenção, revelando projetos de nação permeados pelo imaginário da colonialidade,
  ainda que sob gramáticas distintas e temporalidades próprias.
