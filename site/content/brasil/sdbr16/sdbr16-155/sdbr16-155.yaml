abstract: 'No verão de 1985, quatro arquitetos brasileiros, estudando as relações
  entre a França e o Brasil, descobriam os arquivos da Fundação Le Corbusier, em Paris.
  Se aproximava o centenário de nascimento do arquiteto em 1987. Convidados a participar
  das iniciativas do evento, decidiram enfrentar centenas de caixas-arquivos e colaborar
  no expressivo movimento de pesquisa e revisão crítica da obra do arquiteto. Mais
  de um ano de trabalho foi necessário para organizar esse material praticamente desconhecido.
  Correspondências, croquis, cadernos de viagens, fotografias, cartões postais, foram,
  então, reunidos e divulgados em uma exposição e em um livro intitulados Le Corbusier
  e o Brasil. As interpretações se guiaram nas viagens que o arquiteto fez ao Brasil
  - em 1929, 1936 e 1962 – pontuando as paisagens e o ambiente intelectual e político
  que conheceu. Os arquivos desvelariam as condições de projeto do arquiteto e suas
  relações com autoridades, clientes e colegas brasileiros. Visões de arquitetura
  e de cidade, métodos e processos de concepção, querelas, além de traços de personalidade
  corbusianos também puderam ser identificados, além de pontos de convergência poética,
  sobretudo com Lucio Costa. Quase quatro décadas após interpretações de tantos outros
  autores, o que ainda podem nos dizer essas fontes e os poucos documentos originais
  identificados desde Dois temas, já apontados à época, insistem em sua relevância:
  as convergências conceituais e sensíveis entre Le Corbusier e Lucio Costa quanto
  ao gesto de construir e aos significados atribuídos às noções de tradição vernacular,
  espaço, tempo, passado, história. A noção de natureza, longe de operar como categoria
  sinônima de paisagem se sustenta e define esses conceitos e a própria ideia de arquitetura,
  entendendo-a como prática cultural, histórica e estética  que fabrica mundos.'
