abstract: No contexto da arquitetura moderna, a relevância do hotel de turismo remonta
  a modernidade do final do século XIX e início do século XX. Na América do Sul, o
  luxo se desloca para cenários de praia ou montanha. A partir de 1940, Oscar Niemeyer
  projeta hotéis de turismo de diferentes portes e localizações. A produção se inscreve
  numa visão ampla de paisagem, não apenas a natural e quase intocada, mas também
  a paisagem cultural, em sítios históricos. O objetivo desse artigo é estabelecer
  um panorama comparativo da arquitetura de hotéis de turismo projetados por Oscar
  Niemeyer ao longo de três décadas, a partir dos elementos e estratégias de composição,
  examinando as possíveis constantes e variações, e buscando desfazer o mito de que
  as curvas do repertório formal de Niemeyer estabelecem fusão entre arquitetura e
  natureza. Os projetos de Niemeyer confirmam a diversidade desse encargo. O topônimo
  pode variar entre montanha e planície, ou entre paisagem natural e paisagem cultural.
  Os exemplos incluem localização na Serra do Mar, ou às margens da Lagoa da Pampulha
  em Belo Horizonte, ou ainda em praias à época pouco urbanizadas no Rio de Janeiro.
  O equipamento também pode variar em porte e complexidade programática. O hotel na
  Ilha da Madeira abarca um vasto programa que inclui Cassino e Centro de Convenções.
  Em veia oposta, os hotéis em sítios históricos têm programa enxuto com solução compacta.
  Barra, placa ou torre, ingredientes típicos da arquitetura moderna brasileira, dialogam
  com o lugar. As bases atuam em sincronia com esses componentes, contendo programas
  complementares ou integrando a totalidade da composição. A arquitetura de Niemeyer
  intensifica a relação entre luxo e paisagem, que se inicia nos tradicionais grandes
  hotéis no início do século XX. Entretanto, essa relação se constrói a meio caminho
  entre a fusão orgânica e o contraste radical.
