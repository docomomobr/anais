abstract: 'Construído entre 1936 e 1939, o Edifício João Brícola tornou-se um dos
  marcos na paisagem do centro de São Paulo. Abrigou, entre 1939 e 1999, a Mappin
  Stores, loja de departamentos que foi referência no comércio e que permanece viva
  na memória paulistana. Após o encerramento da loja, o imóvel foi alugado pelas Casas
  Bahia até março de 2023, quando teve suas portas novamente fechadas, sendo comprado
  pelo Serviço Social do Comércio (SESC) naquele mesmo ano, a fim de utilizá-lo prioritariamente
  com fins administrativos.


  A historiografia registra que o edifício foi construído pelo Banco do Estado de
  São Paulo (Banespa) e permutado com a Santa Casa de Misericórdia. Contudo, pesquisa
  recente no Arquivo Público Municipal revelou um fato desconhecido: um processo de
  1936, anterior ao do Banespa, requeria o alvará de obras para um edifício no mesmo
  local, com morfologia notavelmente semelhante ao que foi executado pelo banco. Isso
  permite deduzir que o prédio não foi uma concepção original do Banespa, mas dos
  antigos proprietários dos imóveis que deram lugar ao edifício.


  Este trabalho pretende trazer a público esses documentos, que podem ser interpretados
  como “certidões de nascimento” do edifício, evidenciando as negociações e lapidações
  a que um projeto arquitetônico é submetido. Com o resgate dessa documentação e sua
  análise, pretende-se contribuir para a reflexão sobre o desenvolvimento da arquitetura
  moderna em São Paulo, revelar agentes ocultos e evidenciar a importância das fontes
  documentais para a preservação da memória e do patrimônio histórico.'
