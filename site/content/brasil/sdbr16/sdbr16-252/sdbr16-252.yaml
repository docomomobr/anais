abstract: O artigo analisa a trajetória do artista uberlandense Geraldo de Queiroz
  (1916–1958), com ênfase em sua atuação como mosaicista e na criação de painéis em
  pastilhas de vidro integrados à arquitetura moderna no Triângulo Mineiro entre 1955
  e 1958. Autodidata e versátil, transitou entre pintura, escultura, caricatura, cenografia
  e mosaico, elaborando uma poética que concilia tradição e modernidade. Sua produção,
  fortemente vinculada à parceria com o arquiteto João Jorge Coury (1908–1970) — difusor
  da arquitetura moderna no interior mineiro —, resultou em cerca de quinze painéis,
  dos quais quatro permanecem preservados. Essas obras revelam a integração entre
  arte e arquitetura no contexto de um modernismo regional que dialoga com o ambiente
  cultural e social da época. Entre elas, Ambiente Rural (1955) expressa o imaginário
  agrário e a hierarquização social; Cena Portuguesa reflete o diálogo entre o neoclassicismo
  e o repertório moderno; Ciranda das Crianças (1956) evoca o cotidiano e o regionalismo
  popular; e Indígena Brasileiro (1958) sintetiza o amadurecimento técnico e pictórico
  do artista ao tratar o tema da brasilidade de modo simbólico e lírico. Os painéis
  de Queiroz, produzidos majoritariamente por encomenda, inserem-se em fachadas e
  interiores residenciais, espelhando o gosto estético e o status de uma classe emergente,
  ao mesmo tempo em que preservam valores afetivos e identitários. Sua obra, ameaçada
  pela descaracterização arquitetônica, constitui um documento histórico e patrimonial
  de relevância singular, ao articular arte, urbanidade e memória. A análise demonstra
  que Queiroz contribuiu de forma decisiva para a consolidação de uma linguagem moderna
  enraizada no contexto local, reafirmando o potencial da arte musiva como síntese
  entre o popular e o erudito, o artesanal e o moderno, e como expressão de um modernismo
  regional sensível à cultura e à paisagem de Uberlândia e do Triângulo Mineiro.
