abstract: 'Discute-se estratégias de completamento de edificações modernas. Toma-se
  o Edifício Piratininga (1970), projetado por Delfim Fernandes Amorim e Heitor Maia
  Neto, profissionais reconhecidos pela historiografia da arquitetura moderna no Brasil,
  para estudo de completamento por meio do projeto. O imóvel, parcialmente construído
  no centro da cidade do Recife, agregaria lojas, escritórios e garagem vertical,
  tendo, a última, sido concluída e permanecido em contínuo funcionamento até hoje.
  O estudo responde aos esforços da municipalidade de combater a obsolescência de
  parte dos bairros centrais, por meio do Programa Recentro e à convocação para o
  desenvolvimento de alternativas de adaptação do estoque edificado. Fundamenta-se
  no direito de completação conforme projeto aprovado, início de construção e habite-se
  referente à parte concluída. O projeto de arquitetura, a parte edificada e o acervo
  dos arquitetos são suas fontes primárias. Toma-se como estratégia de completação
  a solução adotada por Amorim no Edifício Luciano Costa (1959): a sobreposição de
  uma pele de elementos vazados para modernizar edifício eclético, mas permitir a
  apreciação sincrônica dos léxicos arquitetônicos. No Edifício Piratininga, a fachada
  do passado moderno obedecerá aos desígnios dos autores, mas, dissociada do espaço
  do presente, envolverá a arquitetura contemporânea. A pele não dialoga com o passado,
  mas com a contemporaneidade para constituir o patrimônio do futuro.'
