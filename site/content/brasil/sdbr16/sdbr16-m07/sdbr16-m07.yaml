abstract: Defendida por Lucio Costa, a noção de arquitetura como construção qualificada
  diferencia arquitetura da “simples construção” através da intenção plástica. Costa
  diz em Razões da Nova Arquitetura (1934) que o segredo da nova arquitetura é a “ossatura
  independente”, um esqueleto independente qualificado pela ausência de vigas aparentes
  que comprometessem a livre disposição de paredes internas e externas e pelo recuo
  da linha de suportes em relação aos bordos de laje. Após mais de duas décadas, é
  Colin Rowe que confirma em A Estrutura de Chicago (1956) a atribuição da estrutura
  como essência da arquitetura moderna, comparável ao papel desempenhado pela coluna
  na Antiguidade Clássica, ao estabelecer “uma razão comum com a qual se relacionam
  todas as partes”, ou ainda aquela que “estabelece relações, define uma disciplina
  e produz uma forma”. Nas palavras do engenheiro de estruturas dos palácios de Brasília,
  Joaquim Cardozo, “Forma Estática – Forma Estética”. Essa sessão se propõe a discutir
  o papel fundamental da estrutura no campo da arquitetura muito além do seu viés
  pragmático, ou, em geral, subavaliado pela crítica de arquitetura. Afinal, a própria
  derivação da palavra arquitetura é composta por arché, ligada à origem, ao princípio,
  à intenção plástica, a qual se refere Lucio Costa, enquanto tektonicos, é vinculado
  à ação de construir; esta não pode ser avaliada como exclusiva do campo da engenharia
  de estruturas. A sessão identifica essa invisibilidade da concepção estrutural no
  ensino de arquitetura e nas pesquisas de pós-graduação, e se propõe a estimular
  a dimensão tectônica inerente ao ofício e à disciplina. Do ponto de vista da integração
  entre os componentes da estrutura e os demais elementos de arquitetura, considera-se
  a relevante herança e tradição presente na arquitetura moderna brasileira do século
  XX. Com batismo corbusiano em solo brasileiro, a partir da década de 1930 uma nova
  arquitetura se fundamenta na estrutura tipo Dom-ino em suas bases no Rio de Janeiro,
  com expansão Brasil afora, especialmente na Região Nordeste, e posteriormente nos
  anos 1960 se transforma profundamente em São Paulo através do Brutalismo Paulista,
  caracterizado tanto pelo fascínio do concreto à vista quanto pela mutação e inclusão
  de elementos estruturais. A partir dos anos 1980, componentes em aço substituem
  porções da estrutura anteriormente ocupadas exclusivamente pelo concreto armado,
  resultando em um conjunto muitas vezes híbrido entre concreto e aço. No cenário
  brasileiro das duas primeiras décadas do século XXI, prosseguem as mesclas entre
  diferentes materiais de estruturas, com ampliação dessa paleta, através do emprego
  de madeira industrializada. Portanto, a sessão visa a estimular aproximações entre
  estudos focados na dimensão técnica da estrutura e outros que abordem a representação
  desta no recorte temporal do 16º Seminário DOCOMOMO Brasil (1920-2020); busca-se
  conectar estas pesquisas àquelas. Reafirma-se que o comportamento estrutural pertence
  ao campo arquitetônico tanto quanto as questões de caracterização da estrutura,
  esta reconhecida como fundamental agente de representação da construção. Nesse sentido,
  são bem-vindos trabalhos que abordem estudos de caso vinculados à iconografia da
  estrutura, a sua dimensão tectônica, os tipos de caráter lastreados na Tradição
  Acadêmica, ou ainda a gama de conotações abstratas ou figurativas, e as repercussões
  sistêmicas próprias do seu papel ordenador da geometria do espaço, assim como pesquisas
  que evidenciam as pressões e demandas específicas da tecnologia da construção que
  em muitos casos contribuem decisivamente para o resultado formal.
