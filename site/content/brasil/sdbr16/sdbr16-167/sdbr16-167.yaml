abstract: Desconhecidos do grande público e até mesmo de arquitetos bem informados,
  dois pátios projetados por Roberto Burle Marx (1909-1994), notáveis por sua composição
  plástica, permanecem quase invisíveis na historiografia do paisagismo moderno brasileiro.
  O artigo apresenta um estudo sobre os pátios do Laguna Tourist Hotel, localizado
  à beira-mar em Laguna, no sul de Santa Catarina, e inaugurado em 1972. O recorte
  da pesquisa abrange o conjunto arquitetônico, com foco nos dois pátios projetados
  por Roberto Burle Marx, em colaboração com Haruyoshi Ono (1943-2017) e José Tabacow
  (1942), a pedido da família Guglielmi, no contexto de um ambicioso empreendimento
  turístico e imobiliário voltado à modernização do litoral catarinense nas décadas
  de 1960 e 1970. A problemática do estudo reside no desconhecimento e na escassez
  de documentação sobre o projeto paisagístico, listado nos inventários da obra de
  Burle Marx sob denominação incorreta (“Hotel Balneário Laguna”, 1971), lacuna que
  contribuiu para a invisibilidade da obra tanto na memória local quanto nos estudos
  sobre o paisagismo moderno brasileiro. A justificativa fundamenta-se na relevância
  e qualidade do conjunto, um dos raros exemplares da obra de Burle Marx em Santa
  Catarina. O objetivo é documentar, analisar e dar visibilidade ao projeto paisagístico
  do hotel, reconstituindo seus princípios compositivos e sua inserção no contexto
  mais amplo do desenvolvimento turístico e econômico da região no século XX. Os procedimentos
  metodológicos articularam pesquisa histórica, análise empírica, depoimentos e estratégias
  complementares para o redesenho dos pátios. Como resultados, o estudo apresenta
  desenhos inéditos e análises formais que revelam a sofisticação da linguagem de
  Burle Marx, marcada pela fusão entre linhas geométricas contrapostas e fluidez orgânica.
  A contribuição do artigo consiste em trazer à luz um patrimônio paisagístico pouco
  conhecido e ameaçado, ampliando o escopo da historiografia da arquitetura e do paisagismo
  modernos no Brasil.
