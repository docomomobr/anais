abstract: 'A cidade de São Paulo é frequentemente evocada no cinema brasileiro como
  metáfora viva das tensões sociais, econômicas e territoriais que atravessam a modernidade
  nacional. No filme O Homem que Virou Suco (1981), dirigido por João Batista de Andrade,
  esse papel se intensifica. A metrópole não apenas ambienta, mas atua como personagem
  central, contribuindo de forma narrativa e simbólica para a construção do conflito
  vivido pelo protagonista. Ao observar os modos como a arquitetura moderna surge
  no filme, o presente trabalho propõe investigar o poder narrativo do espaço urbano
  enquanto expressão simbólica da violência estrutural e da alienação urbana sofridas
  pelo migrante nordestino.


  Para tanto, adotou-se uma abordagem qualitativa fundamentada na análise fílmica
  e em revisão bibliográfica interdisciplinar. Nesse percurso, foram mobilizadas as
  críticas de Sérgio Ferro e Rodrigo Lefèvre à lógica do canteiro e às contradições
  da arquitetura moderna. Também se utilizaram os estudos de Eunice Durham sobre migração
  e cultura popular no Brasil. No campo cinematográfico, o trabalho dialoga com a
  semiótica de Sergei Eisenstein e Christian Metz, além das reflexões de Jean-Claude
  Bernardet sobre o cinema político e de intervenção. Ao investigar como a cidade
  opera como agente de opressão e apagamento, mas também como documento crítico de
  sua época, o trabalho busca contribuir para os debates contemporâneos sobre o papel
  do espaço construído nas disputas por visibilidade, pertencimento e identidade no
  Brasil urbano.'
