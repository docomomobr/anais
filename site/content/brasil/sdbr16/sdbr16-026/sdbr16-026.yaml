abstract: 'Este artigo tem como objetivo estabelecer relações entre algumas estratégias
  e procedimentos presentes em edifícios emblemáticos da arquitetura moderna brasileira
  – aqui reunidos em torno do conceito de espaço extra – e questões contemporâneas
  pautadas nos discursos e práticas de três escritórios de arquitetura atuais: Lacaton
  e Vassal (França), Adamo-Faiden (Argentina) e Plan Común (Chile-França). Os edifícios
  modernos em questão, todos localizados na cidade do Rio de Janeiro são: os edifícios
  projetados por Lucio Costa para o Parque Guinle (1948-1954), o Edifício Júlio de
  Barros Barreto de autoria dos Irmãos Roberto (1947-1950) e o bloco principal do
  Conjunto Pedregulho de Afonso Eduardo Reidy (1946-1950).


  Os três edifícios modernos, importantes representantes da chamada Escola Carioca,
  apresentam semelhanças no que diz respeito à aplicação de princípios espaciais e
  construtivos modernos e também diferenças importantes relativamente à escala da
  edificação, inserção urbana e perfil dos moradores, refletidas nas tipologias das
  unidades. O artigo argumenta que, em todos os casos, espaços extra-funcionais –
  tais como varandas, recuos de fachada, circulações coletivas alargadas e térreos
  livres – atuam como elementos-chave nas suas materializações produzindo uma rica
  variação de qualidades de ambiência e ampliando o espectro de possibilidades de
  uso e apropriação dentro e fora das unidades. Argumenta ainda que a presença dessas
  “gorduras espaciais” contribui para que essas arquiteturas se tornem dispositivos
  relacionais propriamente urbanos capazes de fomentar relações com a cidade e seus
  modos de vida atuando como infraestruturas da vida coletiva.


  A análise dos exemplos citados evidencia vínculos entre as produções moderna e contemporânea
  e demonstra a atualidade e pertinência do repertório moderno para o ensino e a prática
  de projeto no âmbito da habitação coletiva, reafirmando o interesse de que a arquitetura
  possa contribuir qualitativamente na produção do espaço e da vida urbana nas cidades
  contemporâneas.'
keyword: espaço extra (1); habitação coletiva (2); arquitetura contemporânea (3)
