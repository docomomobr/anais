abstract: Xiu! (2022) foi uma instalação efêmera realizada no Abrigo de Bondes Santa
  Tereza, e que teve como ponto de partida a exploração das frestas  deixadas pela
  incompatibilidade entre a infraestrutura moderna e suas reformas. Valendo-se de
  nove caixas de som, cabos auxiliares, adesivos de sinalização e lambes colados sobre
  vidro, a proposta transformou o espaço em uma infraestrutura sonora multicanal.
  O presente artigo tem como principal objetivo retomar os processos de criação da
  instalação Xiu!, tendo como chave de leitura para esse trabalho, as sobreposições
  entre o projeto original do edifício e seus usos posteriores; entre a instalação
  efêmera e o projeto moderno; e entre a idealização da proposta artística e os agentes
  e interesses que interferem sobre o objeto arquitetônico em questão. Para tanto,
  propõe-se uma análise crítica da obra que utilize o ruído como conceito fundamental
  para a concepção do trabalho, mas também como tensionador entre o projeto e a realização
  física da proposta instalativa. O exercício de pesquisa mobiliza autores contemporâneos
  como Arthur Jafa e Rosa Menkman para pensar como a estética do erro digital pode
  ser deslocada para o espaço físico em instalações multimídia – e como a experiência
  de Xiu! pode se inserir nesse raciocínio. É também de interesse do trabalho a sobreposição
  entre a produção artística e a pesquisa acadêmica, uma vez que a perspectiva do
  artista proponente e do pesquisador em arquitetura se fundem nesta proposta.
