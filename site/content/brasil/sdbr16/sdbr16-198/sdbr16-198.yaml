abstract: O Edifício Guilherme Guinle foi concebido pelo arquiteto Jacques Pilon para
  as atividades dos Diários Associados de Assis Chateaubriand. Entre 1947 e 1968,
  acolheu a sede do Museu de Arte de São Paulo – MASP. Apesar de sua importância histórica
  e arquitetônica, esta edificação recebeu escassa atenção crítica. Quando analisado,
  sua singularidade programática deixou de ser considerada, em contraste com outras
  realizações de Jacques Pilon, que obtiveram maior difusão. Ainda assim, o edifício
  constitui uma obra paradigmática do modernismo brasileiro, ao articular, de modo
  inovador, atividades culturais, produção de informação e processos industriais em
  um mesmo conjunto arquitetônico. As reflexões aqui apresentadas visam lançar luz
  sobre a relevância de um edifício que, apesar de sua contribuição significativa
  à paisagem cultural e urbana, permaneceu relativamente obscuro na historiografia
  da arquitetura moderna brasileira. Com base em fontes primárias, esta proposta busca
  reconstruir o conjunto de atividades abrigadas pelo edifício e aprofundar a compreensão
  de seu valor histórico e arquitetônico.
keyword: Centro histórico de São Paulo; Diários Associados; MASP
