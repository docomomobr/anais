abstract: Graduado pela Faculdade Nacional de Arquitetura em 1958, Milton Ramos (1929-2008)
  veio a compor os primeiros quadros profissionais na construção de Brasília. Funcionário
  da Construtora Pederneiras de 1959 a 1967, foi responsável pelo detalhamento e execução
  de importantes obras de Oscar Niemeyer. Tal colaboração teve continuidade mesmo
  após ter constituído escritório próprio em 1967, tendo o arquiteto atuado até o
  início dos anos 1990, contribuindo para compor a paisagem urbana de algumas regiões
  de Brasília. Avançando a iniciativa pioneira de Carlos Henrique Magalhães de Lima,
  a singularidade e a diversidade das realizações do arquiteto permitem novas abordagens
  de sua obra. Enquanto objetivo, o presente trabalho propõe consolidar um registro
  virtual da localização da obra de Milton Ramos em Brasília. Busca-se criar um repositório
  interativo que permita ao usuário ter acesso diretamente de dispositivos com acesso
  à internet. A título de metodologia, além de revisão bibliográfica, foram realizados
  contatos com outros profissionais, além de consultas no acervo de projetos do arquiteto.
  A partir da sistematização das informações que possibilitam localizar a obra do
  arquiteto, pôde-se construir uma primeira versão do mapa digital, com marcadores
  que permitem visualizar imagens e legendas de cada projeto. Tal ferramenta busca
  promover a difusão, facilitar a aproximação e colaborar na preservação das realizações
  de Milton Ramos. O mapa desenvolvido poderá ser aprimorado à medida que novas pesquisas
  possibilitem incrementá-lo ou introduzir novas informações. Por fim, este trabalho
  pretende não só apresentar uma experiência de difusão de determinado patrimônio
  arquitetônico, mas contribuir para o desenvolvimento de diferentes formas e ferramentas
  de preservação de acervos documentais.
