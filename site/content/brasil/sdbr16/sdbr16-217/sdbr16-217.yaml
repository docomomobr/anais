abstract: Em 1974, encerra-se a atividade do grande matadouro de La Villette, em Paris,
  após décadas de tentativas fracassadas de modernização. A desativação do complexo
  abriu caminho para sucessivas propostas culturais e de lazer e iniciou um longo
  processo de revitalização urbana, que culminou no concurso internacional para o
  Parc de la Villette, lançado em 1982. O edital previa um extenso programa de 288
  mil m², dividido em categorias como exposições, lazer, aprendizado e alimentação.
  O concurso recebeu 805 inscrições de 41 países; 28 equipes latino-americanas se
  inscreveram, sendo 13 brasileiras. Esta pesquisa investiga a proposta apresentada
  pelo arquiteto Sergio Bernardes, contextualizando-a em sua trajetória e relacionando-a
  às suas referências formais. Naquele momento, Bernardes somava mais de mil projetos
  e três décadas de atuação, consolidado como figura central da arquitetura moderna
  brasileira. Ganhava destaque também o recém-criado Laboratório de Investigações
  Conceituais (LIC), centro multidisciplinar financiado pelo próprio arquiteto para
  desenvolver soluções tecnológicas e interdisciplinares aplicadas à arquitetura,
  ao urbanismo e ao planejamento territorial. O LIC, sob supervisão direta de Bernardes,
  elaborou a proposta enviada ao concurso, reunindo uma ampla equipe de profissionais
  de diversas áreas. A solução final organizava-se em 17 estruturas cônicas — os “vulcões”
  — agrupadas em “Cités” temáticas (da Música, das Águas, das Pessoas, das Plantas
  e das Ciências). Uma parte significativa do programa se desenvolveria no interior
  dessas estruturas, abaixo do nível do parque, permitindo funcionamento contínuo
  e protegido das variações climáticas. A análise fundamenta-se em materiais do acervo
  Sergio Bernardes, sob custódia do NPD FAU UFRJ, e em documentos iconográficos e
  textuais dos Archives Nationales de France, que esclarecem etapas do processo e
  dados sobre os projetos inscritos. Embora não tenha sido avaliado pela comissão,
  o projeto sintetiza a visão urbana de Bernardes e representa um dos últimos grandes
  gestos projetuais de seu escritório.
