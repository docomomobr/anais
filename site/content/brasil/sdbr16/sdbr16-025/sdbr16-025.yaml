abstract: O Edifício Antônio Ceppas, localizado no Jardim Botânico, Rio de Janeiro,
  concebido em 1952 pelo arquiteto Jorge Machado Moreira e contemplado com paisagismo
  e painéis artísticos de Roberto Burle Marx, é um exemplar arquitetônico de grande
  relevância para compreendermos as interações entre a arquitetura, cidade e paisagem
  por meio do estudo das manifestações do moderno carioca características da primeira
  metade do séc. XX. Este trabalho pretende abordar o projeto de Moreira, no contexto
  da paisagem carioca a qual se insere, a partir de suas características arquitetônicas
  e paisagísticas. Busca-se evidenciar como as decisões de projeto de Moreira e Burle
  Marx denotam um profundo desejo de sintetizar um repertório moderno acumulado em
  uma obra expressiva e singular do ponto de vista de sua implantação e das relações
  que estabelece com a cidade. Defende-se que tais características são mais evidentes
  no projeto do pavimento térreo, amplamente explorado pelas intervenções paisagísticas
  de Burle Marx, e do plano da fachada, ao qual argumentamos ser o elemento estruturador
  do edifício e cujas lições são exemplares do seu repertório construído ao longo
  dos anos. No Edifício Antônio Ceppas, defendemos que Moreira transcende o uso da
  fachada enquanto elemento de intermediação entre o público e privado ao torná-la,
  simultaneamente, o gesto modulor ao qual todas as outras partes do edifício são
  subordinadas ou derivadas. Ressalta-se contudo que, no pavimento térreo, a potente
  articulação formal estabelecida entre a mata atlântica e o edifício por Burle Marx
  se perde a nível botânico, ao constatar-se que a maior parte das espécies presentes
  são exóticas ou invasoras. Conclui-se que as estratégias de projeto empregadas por
  Moreira e Burle Marx são fundamentais para entender o potencial do Edifício Antônio
  Ceppas em gerar uma ambiência singular e integrada com a cidade, contribuindo para
  a construção de um locus sensível à paisagem.
