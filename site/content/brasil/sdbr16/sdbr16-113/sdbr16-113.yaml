abstract: O campus Butantã da Universidade de São Paulo constitui uma realidade urbanística
  resultante da superposição de distintas camadas planejamento — várias delas de caráter
  marcadamente moderno. Trata-se, portanto, de um território e paisagem no qual convivem
  distintos traços e signos de variados planos e projetos. Enquanto campus universitário,
  naturalmente, trata-se ainda de paisagem e território vivo, no qual se disputam
  variadas formas de apropriação, interpretação e transformação dos espaços por parte
  dos vários sujeitos que cotidianamente se relacionam com ele e no qual se manifestam
  suas referências culturais. Neste trabalho buscamos apontar como as iniciativas
  de patrimonialização do campus — particularmente aquelas voltadas a valorizar a
  sua herança modernista — apontam para o privilégio de uma visão idealizada e hermética
  do movimento moderno, ignorando a enorme bricolagem arquitetônica e urbanística
  que caracteriza a sua materialidade e a intensa vida universitária que aí tem lugar.
  Neste sentido, buscamos apontar as contradições de processos de patrimonialização
  que menosprezem, ignorem ou mesmo tentem anular a presença de “impurezas” entre
  os elementos presentes neste conjunto urbano e edificado, apontando para a necessidade
  de incorporar a bricolagem e as impurezas nos processos de patrimonialização.
