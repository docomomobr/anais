abstract: Não faltam exemplos na arquitetura moderna de projetos não realizados que
  se tornaram referenciais formais para outras arquiteturas — adaptadas em escala
  ou volume, recombinadas ou recompostas, pelos próprios autores ou por outros. A
  circulação de ideias por meio de formas, esquemas ou tipos integra métodos de estudos
  consolidados, como a crítica tipológica ou genética. Menos comuns, porém, são os
  estudos que investigam a translação de projetos e ideias por outros caminhos, ancorados
  em documentos escritos. Este estudo examina as possíveis conexões entre os projetos
  de Henrique Mindlin para o Palácio do Itamaraty no Rio de Janeiro (1942 e 1952)
  e o Palácio dos Arcos em Brasília, desenvolvido por Oscar Niemeyer com diferentes
  colaboradores (1963). O objetivo é discutir como projetos não realizados podem revelar
  processos de longa duração, circulando em redes heterogêneas de atores, instituições,
  arquivos, normas e práticas de projeto. A pesquisa adota a abordagem da Teoria Ator-Rede,
  que considera documentos e procedimentos como atores sociais, capazes de agir no
  tempo e no espaço. A metodologia combina análise de fontes textuais primárias, notícias
  de imprensa e documentos técnicos. Examina, em particular, o programa funcional
  elaborado por Mindlin com a Divisão de Edifícios Públicos do DASP em 1946 e a atuação
  das comissões internas do Itamaraty, que podem ter influenciado formulações posteriores
  do Palácio dos Arcos. Procura-se demonstrar que esses documentos atuam como “móveis
  imutáveis” (Latour, 2000) — inscrições capazes de estabilizar controvérsias e se
  deslocar em novos contextos sem se alterar. O estudo evidencia outros mecanismos
  de circulação de ideias e saberes na arquitetura moderna brasileira, mostrando como
  trajetórias de projeto se desenvolvem para além das intenções dos autores consagrados
  e revelando processos institucionais de longa duração na formulação de soluções
  projetuais.
keyword: Arquitetura não realizada; Documentação histórica; Translação de ideias
