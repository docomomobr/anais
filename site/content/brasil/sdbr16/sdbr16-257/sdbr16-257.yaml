abstract: Este artigo analisa a relação entre teoria e prática na obra do arquiteto
  Hans Broos, a partir do projeto da Fundação Hermann Hering, construído na década
  de 1970 em Blumenau, Santa Catarina. Busca-se investigar como sua prática articulou
  crítica, referências históricas, contexto urbano e linguagem moderna, contribuindo
  para repensar o papel da arquitetura na construção de Blumenau, marcada nas últimas
  décadas pela valorização de um falso histórico. O trabalho analisa fontes primárias,
  como entrevistas, conferências, documentos e relatos de colaboradores, para traçar
  conexões com o contexto teórico dos anos de formação do arquiteto e discutir como
  sua prática se insere no debate em torno da crítica ao movimento moderno. A proposta
  é que a obra de Broos funcione como um contraponto simbólico ao processo de homogeneização
  cultural pelo qual vem passando Blumenau. O desafio contemporâneo é usar o legado
  da modernidade arquitetônica, expresso não apenas na obra construída, mas também
  nas palavras e na postura intelectual de Hans Broos, como chave crítica para pensar
  uma cidade que reconheça a diversidade de seu patrimônio e a complexidade do preexistente,
  e não como cenário de consumo turístico e reprodução de imagens artificiais. Ao
  analisar a relação entre teoria e prática na obra de Hans Broos, o artigo recupera
  uma dimensão teórico-projetual que também contribui para a revisão da historiografia
  da arquitetura moderna em contextos periféricos. A valorização da Fundação Hermann
  Hering como patrimônio moderno reforça a importância de revisitar práticas arquitetônicas
  que articulam pensamento, lugar e cultura. Em tempos de apagamento simbólico e estetização
  do passado, a obra de Broos permanece como uma contribuição crítica e concreta à
  compreensão do que foi, e do que ainda pode ser, a arquitetura moderna no Brasil.
