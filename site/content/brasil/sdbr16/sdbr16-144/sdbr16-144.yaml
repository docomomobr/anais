abstract: 'A partir da demanda familiar e da preocupação coletiva sobre a importância
  da produção técnica e cultural de não esquecer épocas de crises sociais e apagamentos
  deliberados, este artigo narra o processo de cuidado do arquivo da historiadora
  da arte, arquiteta, fotógrafa, cineasta e urbanista Rachel Sisson (1928-2023). Limpar,
  acondicionar e organizar o arquivo nos levou a desvelar: o que pode entregar um
  arquivo feminino, da última metade do século XX, ao saber técnico e cultural atual?
  Limpando papéis, cartas, recortes de jornais, organizando e guardando fotografias,
  negativos e contatos. Assim como abrindo, catalogando e guardando livros, cadernos
  e revistas, foi possível perceber a abrangência de interesses do mundo de uma intelectual,
  a qual buscava sempre questionar o que lia, mas também o que produzia e observava
  à sua volta. Com essas primeiras aproximações ao mundo material e social da Sisson,
  conjuntos de nuvens começam a formar uma biografia intelectual a partir do material
  organizado. Nessas pequenas nuvens de um arquivo, todos os seus documentos possuem
  histórias a serem reveladas sobre uma determinada época, sobre uma forma de ser
  mulher, pensar e construir conhecimento para o campo da Arquitetura e do Urbanismo.
  Afinal, o arquivo é tomado aqui como um discurso a ser decifrado. Assim, discutir
  e refletir sobre o arquivo da arquiteta Rachel Sisson é uma possibilidade de pensar
  sobre o processo intelectual e exige reconstruir o campo cultural da própria história
  da Arquitetura e Urbanismo, não vista apenas em termos de oposições ou conflitos,
  mas em um sistema de acontecimentos e relações dinâmicas que mudam a configuração
  variável do jogo (Pereira, 2000).'
