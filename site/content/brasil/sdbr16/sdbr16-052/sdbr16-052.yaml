abstract: Este estudo investiga as representações de espaços domésticos transitórios
  no cinema paulista dos anos 1980, tomando como objeto os filmes O homem que virou
  suco (1981), de João Batista de Andrade, e A hora da estrela (1985), de Suzana Amaral.
  O cinema brasileiro moderno comumente retrata personagens errantes, sem rumo, deambulando
  pelas ruas e espaços públicos; no entanto, esta pesquisa se volta aos interiores
  como expressão de modos de vida precários e de acentuada fragilidade. Nas obras
  supracitadas, as casas temporárias são hostis, impessoais, marcadas por improvisos
  e gambiarras como tecnologia, refletindo tanto instabilidades físicas quanto existenciais.
  Ambos os filmes evidenciam como as habitações transitórias constituem parte essencial
  da experiência urbana dos personagens migrantes em São Paulo. As cenografias empreendidas
  nos longas-metragens transformam os interiores em uma espécie de documentação informal
  de um modo de vida marginal, revelando práticas domésticas e uma memória social
  da arquitetura do cotidiano, ainda em processo de investigação.
