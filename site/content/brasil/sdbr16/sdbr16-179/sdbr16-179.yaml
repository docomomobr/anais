abstract: 'Propomos uma arqueologia crítica das exposições, focando na mostra não
  realizada L’art au Brésil: la taba contemporaine de Brasília, concebida por Lucio
  Costa (1962-1963) para o Petit Palais, em Paris. Preservada em seu espólio, a proposta
  expográfica permite pensar as exposições como campo de montagem e fricção anacrônicos,
  relevantes para a historiografia da arquitetura e do urbanismo modernos no Brasil.
  A hipótese central é que a noção de “contiguidades insólitas”, formulada por Costa
  no roteiro curatorial, opera como um princípio constitutivo do seu modo de pensar
  e projetar. O roteiro aproximava expressões heterogêneas, instaurando justaposições
  que suspendiam o tempo linear e abriam brechas para a constituição mítica. A exposição
  começaria com uma maloca do Alto Xingu, levando à construção de Brasília, e se desdobraria
  por afinidades de intenção, opostas à linearidade cronológica. Diferentemente da
  exposição “Brazil Builds: Architecture New and Old 1652–1942”, que foi muitas vezes
  interpretada como a legitimação da arquitetura moderna por uma síntese estilística
  moderno-colonial, “A taba contemporânea de Brasília” nos oferece interpretações
  mais complexas, deslocando tais sínteses ao operar por vizinhanças inesperadas e
  disjunções deliberadas. Propomos interpelar o gesto curatorial de Costa sob a ótica
  da antropofagia oswaldiana: como metáfora, uma operação crítica de ingestão e confronto,
  assimilando formas e conhecimentos de origens variadas. Essa lógica se relacionaria
  ao hasard objectif surrealista, onde encontros de disparidades revelam afinidades
  latentes. Em vez de um progresso civilizatório, Costa tensiona tradição e modernidade,
  vernacular e erudito. Diante de Brasília, a maloca é uma presença sintomática, uma
  imagem dialética EXCURSOS que irrompe no presente. Sua expografia é assim uma prática
  de montagens anacrônicas, onde convivem ruína e projeto, mito e matéria. A exposição
  interrompida emerge como figura desse campo movediço, em que o inacabado e o tempo
  operam como materiais, iluminando o que ainda está por vir.'
