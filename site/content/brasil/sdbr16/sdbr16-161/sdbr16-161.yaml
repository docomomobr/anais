abstract: Cidades Invisíveis, Pessoas Incríveis é um projeto de pesquisa da Universidade
  Federal do Amapá articulado a uma plataforma online (cipesin.com), dedicado à documentação
  e análise de territórios latino-americanos por meio da integração entre arquitetura,
  urbanismo e audiovisual. Desenvolvido a partir de uma experiência piloto interinstitucional,
  o projeto consolidou-se como uma metodologia de investigação e difusão do conhecimento,
  com potencial de aplicação no ensino, na pesquisa e na extensão universitária. Este
  artigo propõe uma revisitação da arquitetura e do urbanismo da Vila Serra do Navio,
  cidade planejada fundada em 1957 no então Território Federal do Amapá — transformado
  em estado em 1988 com a promulgação da Constituição Federal brasileira — pela mineradora
  ICOMI. A vila configura-se como um caso emblemático de company town implantada na
  Amazônia segundo os princípios do urbanismo moderno. O projeto urbano e arquitetônico,
  desenvolvido por Oswaldo Arthur Bratke, constitui um dos mais relevantes legados
  da arquitetura moderna brasileira em território amazônico. A metodologia adotada
  articula revisão bibliográfica, visitas in loco, levantamento fotográfico, entrevistas
  com moradores e ex-moradores e produção audiovisual, integradas ao acervo da plataforma
  Cidades Invisíveis, Pessoas Incríveis. Argumenta-se que o audiovisual, ao articular
  memória material, narrativa humana e registro espacial, opera simultaneamente como
  ferramenta crítica de documentação patrimonial e como dispositivo pedagógico, capaz
  de aproximar estudantes, pesquisadores e comunidades dos processos históricos e
  das transformações contemporâneas do território. A pesquisa evidencia um quadro
  avançado de descaracterização e degradação do conjunto urbano da Vila Serra do Navio
  e aponta para a urgência de estratégias de preservação que articulem formação acadêmica,
  produção de conhecimento e ações de extensão. Conclui-se que o uso do audiovisual
  contribui para a formação de redes de pesquisas, reforçando o papel da universidade
  e do arquiteto na construção de cidades socialmente justas, resilientes e comprometidas
  com a memória coletiva.
