abstract: O presente artigo analisa, de um ponto de vista relacional, as fábricas
  projetadas por Marco Zanuso para a Olivetti na América Latina, localizadas em Merlo
  (Argentina, 1961) e Guarulhos (Brasil, 1963). A pesquisa situa-se no contexto de
  internacionalização da companhia no pós-guerra, quando, sob a liderança de Adriano
  Olivetti, a empresa ampliou sua presença produtiva e cultural nas Américas e associou
  sua imagem à arquitetura de vanguarda, razão pela qual confiou esses projetos ao
  jovem arquiteto milanês. Neles, Zanuso desenvolveu sua reflexão sobre a assimilação
  entre arquitetura e design industrial, explorando técnicas que racionalizassem o
  canteiro e aproximassem a obra de processos de pré-fabricação. Outro aspecto comum
  é a concepção das fábricas como “unidades de produção”, buscando máxima flexibilidade
  por meio da integração entre estrutura e instalações. Em Merlo, isso se materializou
  em uma ampla planta térrea modular, estruturada por pilares cruciformes e vigas
  ocas com coberturas membranares. Em Guarulhos, a solução foi uma malha triangular
  de colunas ocas que sustentava cúpulas intercaladas, articulando tradições construtivas
  italianas a condições ambientais tropicais. Apesar de seu valor enquanto marcos
  da arquitetura industrial latino-americana, ambas enfrentaram dificuldades de preservação.
  A fábrica de Guarulhos, desativada em 1996, sofreu fortes descaracterizações mesmo
  durante o processo de tombamento, restando apenas parte das coberturas. Em Merlo,
  embora a continuidade produtiva após a venda à Philip Morris em 1979 tenha prolongado
  sua vida útil, reformas recentes alteraram significativamente o edifício, que segue
  sem reconhecimento oficial como patrimônio. A análise comparativa evidencia a relevância
  desses projetos não apenas como experimentos arquitetônicos singulares, mas também
  como exemplos da fragilidade do patrimônio industrial moderno, cuja proximidade
  temporal e função utilitária frequentemente dificultam seu reconhecimento cultural.
