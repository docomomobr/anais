abstract: A expansão do turismo cultural / científico nas últimas décadas do século
  XX no Brasil marca um período de reconhecimento do potencial do patrimônio natural
  brasileiro como vetor de desenvolvimento regional, com a expansão na demarcação
  dos Parques Nacionais, importante agente da reorganização territorial, promovendo
  a modernização das paisagens e das formas arquitetônicas. O artigo tem como objetivo
  identificar, através da infraestrutura de caminhos, passarelas, mirantes e acessos
  existentes no Parque Nacional da Serra da Capivara, elementos da modernidade que
  garantem a visitação e a preservação, compreendendo-o como um museu de território.
  Localizado no sudeste do Estado do Piauí, o Parque Nacional foi criado em 1979,
  ampliado em 1990, reconhecido como Patrimônio Cultural da Humanidade pela UNESCO
  em 1991 e como Patrimônio Nacional pelo IPHAN em 1993. Abriga um dos mais significativos
  conjuntos arqueológicos das Américas e importante fonte para a revisão das teorias
  sobre a entrada do homem no continente americano. Com pinturas rupestres que retratam
  a cultura material e espiritual dos grupos que habitaram a região durante milênios.
  O Parque também expressa as tensões e desafios contemporâneos relacionados à conservação.
  A expansão desordenada do entorno, a insuficiência de recursos para manutenção da
  infraestrutura e a oscilação nos fluxos turísticos ameaçam a sustentabilidade dos
  espaços criados nas últimas décadas. Nesse sentido, a Serra da Capivara não é apenas
  um objeto de contemplação e estudo arqueológico, mas também um campo de investigação
  sobre os modos como o turismo e o lazer participam da produção do espaço e do território
  no contexto de uma modernidade tardia, no fim da década de 1970.
