abstract: 'A produção artística de Athos Bulcão (1918–2008) é amplamente reconhecida
  por sua estreita relação com a arquitetura, bem como por sua colaboração com diversos
  arquitetos, sobretudo na modernidade arquitetônica brasileira. Este estudo destaca
  sua colaboração com João Filgueiras Lima, o Lelé (1932–2014), marcada por um processo
  criativo conjunto desde a concepção dos projetos. Nessa parceria, arte e arquitetura
  se fundem de forma homogênea, com obras que mimetizam a arquitetura e vice-versa,
  resultado da permeabilidade entre os modos de fazer dos dois profissionais. Essa
  fusão transcende os conceitos tradicionais de “integração” ou “síntese das artes”,
  frequentemente usados de forma genérica para diferentes tipos de colaboração. São
  percebidas, pelo menos, duas modalidades de colaboração: na primeira, as obras são
  realizadas e inseridas posteriormente na edificação; enquanto, na segunda, as obras
  são pensadas em conjunto com o arquiteto, colocando em xeque o amplo uso do termo.
  Para diferenciar esse fenômeno dos demais, adota-se o conceito de “diálogo das artes”,
  que valoriza a colaboração equitativa e a criação de uma linguagem comum. O estudo
  busca atualizar e ampliar o entendimento sobre a produção de Athos em parceria com
  Lelé, dada a ausência de pesquisas aprofundadas acerca dessa produção conjunta.
  Mesmo havendo alguns autores, que consideram relevante a colaboração, poucos exploram
  o processo colaborativo entre os dois, o que reforça a necessidade de investigação.
  Metodologicamente, o artigo adota o Método Histórico e Comparativo, com pesquisa
  documental, bibliográfica e visitas técnicas. Entre os principais resultados, destaca-se
  a proposta do “diálogo das artes” como conceito aplicável a outras análises, o aprofundamento
  sobre a parceria Athos-Lelé e a identificação da “concriação” como diferencial —
  um processo simultâneo e compartilhado de criação, que vai além da cooperação pontual,
  revelando um método de trabalho conjunto.'
keyword: DIÁLOGO DAS ARTES; ATHOS E LELÉ; ARTE-ARQUITETURA
