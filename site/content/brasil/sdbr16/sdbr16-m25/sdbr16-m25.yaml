abstract: 'uma abordagem qualitativa que une revisão bibliográfica e o estudo de caso
  da Oficina Escola de Restauro do Instituto Federal de Brasília (IFB), o trabalho
  demonstra a aplicação prática destes conceitos. Argumenta-se que a atividade de
  restauro, ao estender a vida útil dos móveis, alinha-se diretamente aos Objetivos
  de Desenvolvimento Sustentável (ODS) 11 e 12 da ONU. Conclui-se que o restauro do
  mobiliário de Zalszupin, exemplificado por projetos em Brasília, não apenas salvaguarda
  um legado do design nacional, mas se afirma como uma ferramenta estratégica para
  a gestão pública sustentável. Palavras-chave: RESTAURO DE'
