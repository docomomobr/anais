abstract: Este artigo trata dos dois eventos do America(no) del Sud, que aconteceram
  em 2013 na Argentina e em 2015 no Paraguai, a partir da reunião de um grupo de seis
  arquitetos de cinco países sul americanos - os argentinos Rafael Iglesia (1952-2015)
  e Ricardo Sargiotti (1966), o paraguaio Solano Benítez (1963), o brasileiro Angelo
  Bucci (1963), o chileno Alejandro Aravena (1967) e o espanhol radicado no Equador
  José María Saéz Vaquero (1963). Na época, nomes reconhecidos no contexto arquitetônico
  regional, com obras de relevância em seus países, importante atuação acadêmica e
  presença em premiações e publicações internacionais - hoje, alguns com carreira
  mundialmente aclamada, incluindo um Leão de Ouro para Benítez, uma final de MCHAP
  para Bucci e um Pritzker para Aravena. O artigo narra os acontecimentos das duas
  edições do evento, contextualizando a formação do grupo e apresentando os principais
  temas abordados nas conferências. Na sequência, analisa o projeto desenvolvido por
  Iglesia no contexto desses encontros, que servirá de argumento para especular a
  respeito das possíveis e prováveis conexões interamericanas na produção desses profissionais.
