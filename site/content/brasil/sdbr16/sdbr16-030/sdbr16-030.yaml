abstract: 'Este trabalho tem como objetivo observar as estratégias de projetos para
  a implantação e urbanização do edifício residencial moderno na quadra tradicional,
  a partir de projetos habitacionais na cidade do Rio de Janeiro tendo quatro estratégias
  de projeto como categorias de análise: o desenho da estrutura como determinante
  da arquitetura a partir da composição de seus planos de fechamento; a construção
  de espaços de grande escala sem usos previamente definidos; o desenho do térreo
  como continuidade do espaço urbano para o interior do edifício residencial e a definição
  de edificações de grandes dimensões estabelecendo relações com a paisagem e a cidade.
  Com base nestas categorias, a pesquisa analisa três edifícios residenciais modernos
  localizados na zona sul do Rio de Janeiro: o edifício MMM Roberto projetado pelos
  Irmãos Roberto em Copacabana (1945); o edifício Nova Cintra, de Lúcio Costa, em
  Laranjeiras (1948) e o edifício Justus Wallerstein, de Sérgio Bernardes, também
  em Copacabana (1953). Essa seleção se justifica a partir de seu contexto histórico,
  em um momento de efervescência do setor imobiliário na zona sul do Rio de Janeiro
  e com o reconhecimento internacional da arquitetura moderna carioca. O trabalho
  parte do redesenho em escala ampliada como ferramenta de análise para a compreensão
  do pensamento projetual dos arquitetos estudados. Assim, o estudo aponta para as
  diferentes soluções advindas das experimentações de sistemas estruturais baseados
  no concreto armado e a busca pela associação de elementos arquitetônicos da tradição
  construtiva nacional aplicada ao edifício em altura, bem como os estudos de inserção
  do edifício moderno na quadra tradicional. Esses aspectos evidenciam a singular
  dimensão urbana da arquitetura moderna carioca.'
