abstract: 'Megaeventos são definidos contemporaneamente como ocasiões itinerantes
  de duração determinada, que atraem elevado número de visitantes, possuem amplo alcance
  midiático, envolvem altos custos e operam grandes impactos sobre o ambiente construído
  e a população. Ao longo dos séculos XIX e XX, esses traços foram reconfigurados
  pelo crescimento do esporte como entretenimento de massa e acompanham, desde a década
  de 1970, o contexto cultural da pós-modernidade, marcado pela intensificação da
  cultura midiática e pela mercantilização do urbano. No campo da arquitetura, os
  megaeventos esportivos têm se destacado pela produção de estádios e equipamentos
  urbanos desenvolvidos como dispositivos para experiências controladas de consumo
  e espetáculo, frequentemente desconectados das necessidades sociais locais e resultando
  em desafios para o uso e integração urbana após o evento. Este artigo propõe uma
  análise crítica de quatro estádios periféricos e seus entornos, construídos em Portugal
  (EURO 2004: Algarve e Aveiro) e no Brasil (Copa 2014: Manaus e Recife), examinados
  em duas escalas: a urbana, a partir das intenções dos promotores e da efetividade
  das intervenções; e a arquitetônica, enfatizando respostas projetuais como o “efeito
  Barcelona”, o repertório pós-moderno de reação e a adoção de soluções high-tech
  com concessões cultural e sustentável. A análise revela que essas infraestruturas
  sintetizam aspectos espetaculares, efêmeros e midiatizados da pós-modernidade urbana,
  evidenciando tensões entre discursos de modernização e os limites derivados da realidade
  local. Ao discutir as intervenções portuguesas e brasileiras como representativas
  da condição urbana pós-moderna, o artigo também problematiza os desafios que se
  impõem ao campo disciplinar da arquitetura diante das demandas de um urbanismo centrado
  no consumo, lazer e turismo.'
keyword: megaeventos esportivos; intervenções urbanas; pós-modernidade
