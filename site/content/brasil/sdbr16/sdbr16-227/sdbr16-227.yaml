abstract: Este artigo apresenta e discute a experiência didática desenvolvida no componente
  Estúdio de Teoria e História da Arquitetura e Urbanismo (ETHAU II) da FAU Mackenzie,
  que tem como premissa utilizar a experiência moderna como base para intervenções
  contemporâneas de caráter abstrato. Partindo do estudo de casas unifamiliares modernas
  (décadas de 1910 a 1950), os estudantes constroem maquetes desmontáveis em escala,
  usando o corpo para um exercício prático de compreensão espacial. Em seguida, realizam
  intervenções plástico-poéticas nessas maquetes, tensionando a linguagem moderna
  a partir de questões contemporâneas como transparência, instabilidade, fluidez e
  flexibilidade. O método não se limita à reprodução formal, mas propõe uma releitura
  crítica e sensível do Moderno, desmistificando suas imagens icônicas ao revelá-las
  como respostas a contextos específicos. A prática estimula uma reflexão profunda
  sobre o potencial transformador da arquitetura, articulando teoria, história e projeto
  em um exercício que interroga tanto o passado moderno quanto os desafios do presente
  no contexto sul-americano.
keyword: pedagogia projetual; leitura crítica; intervenção contemporânea
