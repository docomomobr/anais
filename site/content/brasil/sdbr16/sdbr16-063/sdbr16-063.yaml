abstract: 'As Cidades Universitárias no Brasil foram um grande campo de experimentação
  e atuação da arquitetura moderna, a partir da década de 1930. A Universidade do
  Brasil, hoje Universidade Federal do Rio de Janeiro é um marco nessa trajetória,
  pois configura o ponto de partida do projeto educacional e político na tentativa
  da criação de um modelo para as Cidades Universitárias Brasileiras, encampado por
  Gustavo Capanema quando a frente do Ministério da Educação e Saúde Pública (MES).


  O conjunto urbano e arquitetônico da Cidade Universitária, projetado pelo Arquiteto
  Jorge Machado Moreira e a equipe do Escritório Técnico Universitário (ETUB) e os
  seus edifícios do conjunto inicial (1949-1970) ligados aos programas da saúde, constituem
  uma importante fonte de memória do Movimento Moderno e do Patrimônio da Saúde.


  Neste artigo serão abordados o contexto histórico e o panorama da formação do campus
  da Cidade Universitária da Universidade do Brasil, dando destaque aos edifícios
  da saúde, detalhando a história da construção do Hospital das Clínicas.


  A documentação do antigo Escritório Técnico Universitário (ETUB), sob guarda do
  Núcleo de Pesquisa e Documentação da FAU UFRJ, permite remontar a história da criação
  do campus e do projeto dos edifícios, em suas várias versões. A leitura da documentação
  contribui para o entendimento da concepção inicial do projeto, deste que foi um
  dos exemplares pioneiros de hospital escola no ensino universitário.


  O aprofundamento do conhecimento sobre o plano urbano e o edifício, tanto do ponto
  de vista histórico e documental como do ponto de vista projetual, visa contribuir
  para o entendimento da sua importância para arquitetura moderna, propiciar o reconhecimento
  de seus valores como patrimônio da saúde e afirmar a necessidade da preservação,
  deste que é um dos conjuntos modernistas mais importantes da cidade do Rio de Janeiro.'
