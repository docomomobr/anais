abstract: Hugo Rodríguez Juanotena (1923-2012) diseñó dos casas para sí mismo y su
  hermano en 1954 en Montevideo. Ubicadas cerca de la costa del Río de la Plata, las
  casas se diseñaron para la diversidad de la vida de una familia extendida, que las
  habitó por más de cuarenta años. Esta obra es uno de los primeros diseños destacados
  de la carrera del arquitecto, que formó parte de la “generación de ruptura” de ﬁnes
  de los 40 y principios de los 50 en Uruguay. Fue publicada en su momento por la
  revista de la Sociedad de Arquitectos de Uruguay y hoy forma parte de los bienes
  cautelados por la ciudad. Sin embargo, ha sido poco estudiada y documentada. Desde
  que la familia dejó de vivir en las casas en 1997, estas han recibido alteraciones
  que diﬁcultan su reconocimiento. Este texto comunica un trabajo en proceso, que
  se propone la reconstrucción del interior y la interioridad de las casas de la familia
  Rodríguez Juanotena. Confronta el registro de la arquitectura existente, los planos
  disponibles, con la memoria oral de los miembros de la familia y sus recuerdos fotográﬁcos.
  Esto permitirá arrojar luz sobre un caso de alto valor poco conocido, ofrecer una
  interpretación de la interioridad a partir de los momentos cotidianos de la vida
  doméstica recordados y matizar los frecuentes preconceptos sobre el interior moderno
  que lo conciben como una obra de arte con diﬁcultades para ser habitado. Al estudiar
  el interior desde este punto de vista será posible apreciar sus diferentes grados
  de pureza, medido no tanto en sus formas o estilo, sino en su adopción y transformación
  por los hábitos, celebraciones, memorias y objetos de una familia numerosa que lo
  pobló a lo largo del tiempo, aportando al debate contemporáneo sobre el interior
  moderno sudamericano.
