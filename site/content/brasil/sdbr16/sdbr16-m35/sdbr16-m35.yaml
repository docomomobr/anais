abstract: As bases do Estilo Internacional contaram com os avanços dos sistemas de
  concreto armado para a criação de repertórios formais em países com melhores condições
  tecnológicas. A produção brasileira, por seu turno, consolidou suas conquistas por
  meio de experimentações com técnicas e tecnologias construtivas adaptadas a contextos
  específicos e a abordagens próprias, condicionadas pelas realidades socioeconômicas
  locais. A industrialização incipiente, a abundância de mão de obra de baixo custo
  e o potencial criativo de diversos agentes marcaram os avanços no campo das inovações,
  com a adoção de variados sistemas construtivos em diferentes regiões do país. As
  iniciativas que consolidaram esse modo de atuação foram reconhecidas internacionalmente
  desde as primeiras realizações modernistas, sobretudo pelos modos singulares de
  explorar as possibilidades do concreto armado. Alvo de análises em publicações especializadas,
  a vanguarda impulsionada pela arquitetura e pela engenharia de estruturas no Brasil
  foi destacada como detentora de atributos próprios, em comparação às realizações
  que lhe serviram de referência. A variedade de abordagens adaptativas, a riqueza
  das experimentações plásticas e as soluções que testavam os limites das propriedades
  materiais atestaram, à época, o protagonismo da expressão arquitetônica brasileira,
  fundamentada em inovações que a distinguiam no cenário internacional. Partindo do
  reconhecimento de que esse fenômeno se manifesta como um processo de renovação contínua
  na produção nacional, a presente sessão temática busca discutir as estratégias de
  inovação baseadas na apropriação crítica de técnicas preexistentes e na reinterpretação
  criativa de sistemas construtivos, com ênfase naquelas que empregaram sistemas pré-fabricados
  entre 1920 e 2020. A proposta é orientada pela visão de que, embora ancoradas em
  bases conhecidas, algumas dessas contribuições podem ser caracterizadas como criações
  tipicamente brasileiras, parte de uma tradição moderna, viva e em transformação.
  Interessa refletir sobre como essas experimentações no âmbito do projeto, do pensamento
  arquitetônico e dos modos de produção do espaço construído apontaram novos caminhos,
  não apenas para o aprimoramento das técnicas edilícias, mas também para o desenvolvimento
  do país.
