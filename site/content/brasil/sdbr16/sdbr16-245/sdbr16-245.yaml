abstract: No Brasil, a arquitetura hospitalar moderna tem sido frequentemente compreendida
  de forma restrita, com ênfase quase exclusiva em sua dimensão técnico-funcional,
  o que limita a compreensão de seu potencial simbólico, estético e sensorial. Em
  contraste com essa abordagem, a Rede Sarah de Hospitais de Reabilitação, concebida
  por João Filgueiras Lima, o Lelé, a partir da década de 1980, constitui uma das
  experiências mais relevantes de integração entre arquitetura, arte e cuidado no
  país. Alinhados aos princípios da arquitetura moderna, seus edifícios articulam
  industrialização construtiva, eficiência operacional e atenção à experiência subjetiva
  dos usuários, superando a lógica meramente funcional do espaço hospitalar. Este
  estudo propõe refletir sobre os murais artísticos presentes nas unidades da Rede
  Sarah como parte integrante do processo projetual e da cultura material da arquitetura
  hospitalar moderna. Executadas em diferentes técnicas e escalas, essas obras ocupam
  pontos estratégicos dos edifícios — como circulações, áreas de espera e salas de
  reabilitação — atuando como elementos de orientação espacial, criação de vínculos
  afetivos e estímulo à permanência. Suas geometrias abstratas, cores intensas e inserção
  arquitetônica dialogam diretamente com a percepção sensível dos usuários, contribuindo
  para a construção de ambientes terapêuticos. A arte, nesse contexto, não se apresenta
  como ornamento supérfluo, mas como parte indissociável da linguagem arquitetônica.
  Em consonância com pesquisas da neurociência e da arquitetura, como as de Ulrich
  (1984), Zeisel (2006) e Sussman e Hollander (2021), compreende-se que estímulos
  visuais positivos impactam o sistema límbico, promovendo bem-estar emocional, redução
  do estresse e favorecendo a recuperação clínica. Assim, os murais funcionam como
  dispositivos sensíveis de mediação entre espaço, cultura e cuidado. A abordagem
  de Lelé, ao combinar sistemas construtivos industrializados, soluções passivas de
  ventilação e iluminação natural e atenção à escala humana, reforça uma concepção
  ampliada do edifício hospitalar como artefato cultural, social e urbano, conforme
  destaca Toledo (2006/2022).
