abstract: 'O Módulo Iansã da Faculdade de Arquitetura da Universidade Federal da Bahia
  (FAUFBA) foi construído em 1988 para abrigar as atividades do Programa de Pós-Graduação
  em Arquitetura e Urbanismo da UFBA (PPG-AU), então denominado Mestrado em Arquitetura
  e Urbanismo (MAU UFBA). O edifício seguiu o modelo das escolas de dois pavimentos
  em argamassa armada projetadas para Salvador pelo arquiteto João Filgueiras Lima,
  Lelé, no âmbito da Fábrica de Equipamentos Comunitários (FAEC).


  Entre 2015 e 2017, a demolição de escolas e creches do período da FAEC foi anunciada
  pela Prefeitura Municipal de Salvador, devido a problemas de manutenção. Sendo um
  dos exemplares remanescentes no campus da UFBA, o Módulo Iansã também apresentou
  dificuldades mais agudas para ações de manutenção cerca de vinte e cinco anos depois
  de sua entrada em atividade, o que gerou o seu gradual esvaziamento.


  O artigo trata do processo de estudo, diagnóstico, projeto e obra para recuperação
  e salvaguarda do Módulo Iansã̃ visando à sua transformação no Laboratório de Construção
  e Canteiro Experimental da Faculdade de Arquitetura da UFBA, planejado como espaço
  de experimentação com caráter multiusuário para atendimento das demandas da FAUFBA
  no campo da tecnologia da construção, obra iniciada em 2023 e finalizada em dezembro
  de 2024.


  Compreendendo a base teórica de tal proposição, em confronto com os aspectos práticos
  do processo e os problemas enfrentados, desde o diagnóstico de patologias até sua
  conversão de uso, o artigo realiza um relato crítico da experiência de conservação
  de um importante exemplar do nosso patrimônio moderno pré-fabricado, trabalho de
  recuperação e conservação da obra construída de um dos mais reconhecidos arquitetos
  brasileiros, Lelé.'
