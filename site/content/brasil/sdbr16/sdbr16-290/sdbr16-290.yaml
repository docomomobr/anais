abstract: 'A fotografia poderia ser traduzida de diferentes maneiras: como a tentativa
  de eternizar um instante, como a possibilidade de registrar um fato importante,
  como a experiência de capturar um determinado ângulo da realidade. As possibilidades
  de tradução são múltiplas, assim como os olhares que retêm a imagem observada. Como
  parte de um projeto maior de construção de uma nação, de uma identidade nacional,
  a arquitetura e o urbanismo moderno estiveram presentes nas fotografias que procuraram
  fomentar esse discurso. Vale lembrar que a fotografia também é um jogo de presenças
  e ausências. É nesse contexto que a arquiteta italiana Lina Bo Bardi (1914-2002)
  tenta se inserir e construir sua narrativa visual sobre modernidade e arquitetura
  moderna. Para divulgar sua primeira obra construída, a residência do Morumbi (1949-1951),
  ela convida o fotógrafo Francisco Albuquerque (1917-2000), pioneiro da fotografia
  comercial e responsável pela primeira campanha publicitária fotografada no Brasil.
  Lina estabeleceu parceria também com Peter Scheier (1908-1979), com quem conviveu
  diretamente no MASP e na Revista Habitat. Scheier fotografou a casa do casal Bardi
  e a casa Valéria Cirell. Além de Scheier, Hans Günter Flieg (1923-2024) foi outro
  fotografo com quem Lina trabalhou. Flieg registrou a construção do MASP, em que
  buscou destacar o arrojo do canteiro de obras, suas máquinas, os operários e a técnica
  construtiva adotada. Temos consciência de que a obra de Lina foi vastamente fotografada
  e de que outras parcerias foram feitas, além das identificadas aqui. Decidimos nos
  deter no conjunto de imagens desses três fotógrafos. O objetivo do trabalho é olhar
  essas imagens e indagar o passado, para entender como se deu a parceria entre Lina
  e esses fotógrafos, qual narrativa visual buscaram construir, o que foi revelado
  e o que foi omitido por Lina e por esses fotógrafos para atingir esse fim.'
keyword: Lina Bo Bardi; fotografia; Arquitetura Moderna
