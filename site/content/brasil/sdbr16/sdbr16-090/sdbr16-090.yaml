abstract: 'O artigo tem como objeto a investigação crítica dos processos que resultaram
  na demolição do Centro de Atenção Integral à Criança (CAIC) José Jofilly, localizado
  no bairro das Malvinas, em Campina Grande-PB. A pesquisa centra-se na análise das
  causas que levaram ao abandono e, por fim, à destruição do complexo em 2023. Entre
  os fatores destacados estão as tensões políticas e institucionais que marcaram a
  implantação do programa, bem como as pressões exercidas por empreiteiras, que impuseram
  modificações no projeto original, comprometendo a concepção arquitetônica e a tecnologia
  da argamassa armada. Esses conflitos culminaram no afastamento da equipe de Lelé
  logo após a inauguração do primeiro protótipo, em 1992, acentuados ainda pelo cenário
  de instabilidade política decorrente do impeachment de Fernando Collor de Melo.
  Metodologicamente, o estudo é desenvolvido em três etapas: a análise arquitetônica
  do edifício, a apresentação de propostas de intervenção para requalificação e conservação
  do conjunto e, por fim, a discussão dos entraves políticos e administrativos que
  conduziram à sua demolição. A justificativa da investigação assenta-se na necessidade
  de conferir visibilidade ao abandono de um patrimônio edificado que expressa os
  valores da modernidade clássica e, ao mesmo tempo, abrir possibilidades de reflexão
  sobre estratégias de recuperação e preservação desses equipamentos.'
