abstract: 'O trabalho analisa o caráter político que orientou a arquitetura art déco
  dos edifícios sede das Diretorias Regionais construídos no período Vargas. Entre
  conflitos territoriais e ideológicos do século XX, a arquitetura foi ferramenta
  representativa para muitas campanhas. Se trata de um momento onde coexistiram diferentes
  arquiteturas, como a arquitetura fascista, neoclássica, construtivista, art-déco,
  modernista entre tantas outras. Juntas, compõem a diversidade arquitetônica do período
  moderno. A partir deste entendimento, o trabalho abre a discussão para os arranjos
  políticos que se relacionam com a arquitetura art déco das Diretorias Regionais
  construídas no período Vargas. As diretorias regionais fizeram parte de políticas
  públicas que visavam a construção de uma nação, sendo centros estratégicos de comunicação
  que relacionavam os serviços dos correios e telefonia, na época, estatais. De caráter
  racionalista, o governo varguista centraliza a produção das novas edificações por
  meio de tipologias que são replicadas em todo o país. O trabalho analisa quatro
  sedes: a de Curitiba, a de Belo Horizonte, a de Maceió e a de Belém.'
keyword: ART DÉCO; ERA VARGAS; ARQUITETURA MODERNA
