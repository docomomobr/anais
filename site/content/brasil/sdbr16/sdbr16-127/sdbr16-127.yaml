abstract: João Filgueiras Lima (1932-2014) foi arquiteto fundamental na história recente
  da Arquitetura brasileira, pioneiro na pré-fabricação na arquitetura, em especial
  na tecnologia da argamassa armada. O Centro Administrativo da Bahia foi local privilegiado
  de seus experimentos. Ali, entre 1973 e 1974 realizou três tipos de edifício, que
  podemos compreender como variações no tema dos pilotis, parte da recorrência de
  temas relacionados ao mesmo, em termos da relação indissociável entre arquitetura,
  estrutura portante e infra-estrutura. São os edifícios as Secretarias em plataformas
  (1973-74, o Centro de Exposições (1974) e a Igreja Ascensão do Senhor (1975), com
  uma coda na sua última obra no local, o edifício do Tribunal Regional do Trabalho.
