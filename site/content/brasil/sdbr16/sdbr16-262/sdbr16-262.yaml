abstract: 'Este trabalho investiga o apagamento de Carlos Henrique Heck na historiografia
  da Arquitetura Nova, movimento que emergiu nos anos 1960 como crítica ao modernismo
  brasileiro pós-Brasília. Enquanto a produção de Rodrigo Lefèvre, Sérgio Ferro e
  Flávio Império consolidou-se como cânone, arquitetos como Heck, Júlio Barone e Sérgio
  Souza Lima - que igualmente materializaram os ideais do movimento em práticas pedagógicas
  e de canteiro - permanecem marginalizados nos estudos da área. A pesquisa baseia-se
  em fontes primárias inéditas: entrevista com Heck (2025), registros fotográficos
  de seus projetos e documentos que comprovam sua colaboração com o núcleo do Arquitetura
  Nova. A análise revela três dimensões fundamentais: O apagamento historiográfico
  evidencia um duplo movimento de canonização da tríade principal e invisibilização
  de colaboradores próximos, relegados a notas de rodapé ou menções passageiras. A
  pedagogia radical aplicada por Heck em seus anos de atuação no Brasil, depois em
  Grenoble no período em que lecionou na Unité Pédagogique d''Architecture de Grenoble
  e posteriormente no Brasil, onde a materializou no ensino de arquitetura. As redes
  subterrâneas do movimento revelam-se no episódio emblemático com Mayumi Watanabe,
  quando Heck entregou o desenho diretamente ao mestre de obras, sem mediação técnica
  convencional. A metodologia combina análise crítica de fontes primárias, confronto
  com a bibliografia estabelecida e reconstituição de redes profissionais através
  de novos depoimentos. As contribuições incluem: a sistematização inédita da atuação
  de Heck como um agente do movimento; a documentação de práticas emancipatórias nos
  canteiros de obras; e a revisão crítica do cânone paulista através de fontes nunca
  antes analisadas, demonstrando a necessidade de reavaliar as narrativas consagradas
  sobre autoria e produção arquitetônica no período.'
