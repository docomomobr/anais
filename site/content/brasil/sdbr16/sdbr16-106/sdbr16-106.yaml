abstract: 'Chicago fue, desde finales del siglo XIX, un territorio privilegiado para
  la experimentación estructural en arquitectura. En la segunda mitad del siglo XX,
  esta tradición encontró continuidad tanto en oficinas como Skidmore, Owings & Merrill
  (SOM), como en entornos académicos como el Illinois Institute of Technology (IIT),
  bajo la dirección de Ludwig Mies van der Rohe. Si bien proyectos como el John Hancock
  Center (1969) o la Sears Tower (1973) —con Bruce Graham y Fazlur Khan— redefinieron
  la arquitectura en altura, el verdadero laboratorio donde se gestaron estas ideas
  fue el IIT. En 1962, Myron Goldsmith —exalumno de Mies y arquitecto en SOM— invitó
  a Khan a incorporarse como supervisor estructural en el IIT. Juntos impulsaron una
  docencia centrada en la investigación de sistemas estructurales para edificios en
  altura y grandes luces. Esta lógica experimental, ejemplificada por la tesis de
  Mikio Sasaki (1964), anticipó soluciones que luego serían aplicadas en la Hancock
  Tower y tuvo raíces anteriores: durante veinte años, Mies supervisó 48 tesinas de
  máster, varias de ellas en colaboración con el ingeniero Frank Kornacker, su socio
  habitual. En estos trabajos se ensayaron estructuras aún no construidas, anticipando
  soluciones desarrolladas más tarde en su oficina. La presente comunicación analiza
  tres casos donde este vínculo entre docencia y arquitectura estructural se hace
  explícito, conectando tesinas desarrolladas en el IIT con proyectos de Mies: Brownson
  con Crown Hall, Carter con la Neue Nationalgalerie y Miwa, Kanazawa y Chang con
  el Convention Hall. Estas conexiones encuentran su síntesis en el McCormick Place
  (1971), dirigido por Gene Summers —exalumno de Mies— que retoma principios estructurales
  ensayados en el entorno académico miesiano y los proyecta hacia una resolución contemporánea
  del espacio expositivo, consolidando una cultura interdisciplinar silenciosamente
  cultivada durante décadas en el IIT.'
