abstract: 'Este artigo tem como objetivo apresentar resultados de análise comparativa
  entre dois projetos de espaços expositivos, concebidos por Paulo Mendes da Rocha,
  localizados na Enseada do Suá, em Vitória (Espírito Santo, Brasil): o Centro Krajcberg
  e o Cais das Artes. O primeiro trata-se de projeto não construído enquanto o segundo,
  a nível executivo, encontra-se atualmente em fase de construção. A escolha justifica-se
  pelo estudo de projetos com programas similares e de mesma autoria mas, também,
  pela constatação de que embora desenvolvidos em tempos distintos, tais exemplares
  possuem uma associação visual imediata. Tais fatores, embasados por literatura,
  motivaram o desenvolvimento de uma investigação com objetivo de identificar “estratégias
  projetuais” admitindo-se que, por hipótese, apesar do distanciamento temporal de
  catorze anos entre ambos projetos, há padrões formais e espaciais contidos no Centro
  Krajcberg que se materializaram com a oportunidade de desenvolvimento e execução
  do Cais das Artes. Com base nessa perspectiva, a pesquisa iniciou-se com a identificação
  das principais obras (com o referido perfil programático) desenvolvidas ao longo
  da trajetória de Mendes da Rocha, a partir de autores de referência bem como de
  pesquisas em bases de dados científicas. Em termos conceituais, além da condição
  que envolve os estudos comparativos, reconheceu-se também a pertinência dos procedimentos
  de análise de projetos não construídos, frequentemente esquecidos, mas que revelam
  uma riqueza de informações sobre o arquiteto e o ato criativo. As referências teóricas
  adotadas levaram à análise crítica comparativa e desenhada da arquitetura, empregando-se
  softwares especializados para georreferenciamento, redesenho e modelagem, a fim
  de compor conjunto de dados. Os resultados obtidos revelaram a existência de padrões
  a partir de seis categorias analíticas pois, embora sejam evidentes as variações
  no modo de projetar do arquiteto ao longo do tempo, foi verificada a permanência
  de princípios compositivos.'
