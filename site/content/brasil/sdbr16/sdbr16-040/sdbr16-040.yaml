abstract: 'Atualmente há uma vasta fortuna crítica sobre a obra de Tunga (1952–2016),
  mas pouco se investigam aspectos menos conhecidos de sua formação, especialmente
  aqueles vividos na juventude, fora do Brasil. Entre essas experiências, destaca-se
  seu contato com a Escola de Arquitetura da Pontifícia Universidade Católica de Valparaíso,
  no Chile, cuja pedagogia, desde meados dos anos 1960, integra poesia, artes visuais
  e arquitetura por meio de Atos Poéticos, Travessias e da Ciudad Abierta, espaço
  experimental habitado e construído coletivamente. Em entrevistas e manuscritos,
  Tunga reconhece o impacto dessa vivência, descrevendo Valparaíso como um ambiente
  de profunda integração entre arte, arquitetura e poesia. Em uma de suas anotações,
  afirma que “a arquitetura tem como princípios aqueles mesmos que regem a poesia”,
  síntese tanto de sua experiência pessoal quanto do fundamento pedagógico da escola.
  Embora mencionada em fontes como Spinelli (2016), Lampert (2020) e Lopes Torres
  & Machado Silva (2023), essa relação permanece pouco explorada. A pesquisa em desenvolvimento
  utiliza principalmente o arquivo do artista no Instituto Tunga, composto por cadernos,
  manuscritos, correspondências, registros audiovisuais e documentos pessoais, onde
  se encontram evidências de sua participação em atividades da escola e de vínculos
  com seus professores e colegas. Complementarmente, recorre-se ao Arquivo Histórico
  José Vial Armstrong, da própria PUCV. A análise apoia-se em três referenciais teóricos:
  a “biografia intelectual” de François Dosse, que compreende vida e obra como dimensões
  entrelaçadas; o “biografema” de Roland Barthes, orientado à busca de fragmentos
  significativos; e a noção de “Nebulosas”, de Margareth da Silva Pereira, que permite
  lidar com lacunas e emaranhados na construção de uma cronologia formativa. O objetivo
  é discutir Tunga como artista e arquiteto em trânsito, destacando seus intercâmbios
  educacionais nas Américas. Pergunta-se quais registros ele deixou sobre a escola,
  que redes estabeleceu e como práticas pedagógicas chilenas dos anos 1960 e 1970
  reverberam em sua obra. O estudo busca, assim, iluminar uma faceta pouco conhecida
  de sua trajetória e evidenciar como a experiência chilena contribuiu para sua visão
  integrada de arte, arquitetura e poesia.'
keyword: TUNGA; ESCOLA DE ARQUITETURA DE VALPARAÍSO (CHILE); PEDAGOGIA POÉTICA
