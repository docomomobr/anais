abstract: Lina Bo Bardi (1914 - 1992) criou seu primeiro projeto expositivo, uma mostra
  de tecidos e cortinas, no Palazzo dell’Arte della Triennale di Milano. A lista de
  projetos realizados logo no Brasil não é extensa, mas sua relevância é indiscutível
  no trato de um programa cujo prestígio se firma desde a segunda metade do século
  XX. A primeira sede do Museu de Arte de São Paulo (1947) é reforma dos interiores
  de edifício inacabado de estilo “eclético-acadêmico”, como diria Lucio Costa. A
  segunda sede, concepção integral e radicalmente moderna (1957 1968), é monumento
  consagrado tanto nacional quanto internacionalmente. Lina pioneira como autora singular
  não é mais única. Outras arquitetas comandaram com brilho o espetáculo expositivo
  desde então, fazendo não só obra nova permanente ou efêmera como reuso adaptativo,
  em diferentes escalas, tanto no Brasil quanto no exterior. A sessão quer apresentar
  e discutir um conjunto de estudos de caso que, sob direção feminina como a de Lina,
  exemplifique rigor, vigor e elegância comparáveis no desafio de estereótipos.
