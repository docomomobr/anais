abstract: O edifício da Faculdade de Arquitetura e Urbanismo da Universidade de São
  Paulo (FAUUSP), projetado por Vilanova Artigas e Carlos Cascaldi em 1961 e inaugurado
  em 1969, pode ser analisado sob diversas perspectivas. Na historiografia recente
  prevalece o entendimento de que a questão principal dessa obra reside em sua estrutura
  de concreto armado aparente e na relação com as noções artísticas e políticas de
  Artigas, ligadas à moral construtiva. No entanto, as divergências interpretativas,
  por vezes antagônicas, costumam privilegiar a dimensão aparente do material ao invés
  de sua constituição materialista. A pesquisa da qual este trabalho é fruto examinou
  desenhos técnicos, fotografias do canteiro de obras, documentos administrativos
  e entrevistas com agentes da construção para se compreender como a realidade construtiva
  do edifício se relaciona com a fortuna crítica sobre ele. A conclusão é que as escolhas
  arquitetônicas dos autores indicam uma elaboração representacional sobre a construção,
  o que torna a obra particularmente fecunda para interpretações como as que foram
  consagradas. A especificação de marcas de tábuas horizontais nas empenas externas
  e de chapas de madeira nas faces internas indica decisão de linguagem, e não uma
  consequência técnica. Os pilares em “V”, frequentemente entendidos como expressão
  diagramática da estrutura, sustentam apenas parte da cobertura enquanto a carga
  principal transita por pilares internos e por vigas ocultas dentro de lajes do tipo
  caixão perdido. Assim, em um edifício que parece expor toda sua verdade construtiva,
  o concreto guarda uma representação ambígua da construção, ao mesmo tempo que sugere
  uma construção verossímil e oculta os meios que a tornam possível. Compreender os
  enigmas dessa obra prima da arquitetura brasileira exige voltar-se ao canteiro de
  obras.
keyword: brutalismo; representação; concreto armado
