abstract: 'La concreción del proyecto del Museo Casa Vilamajó (MCV) en la que fuera
  su vivienda propia, construida en el año 1930 en Montevideo, requirió del abordaje
  de múltiples y variados desafíos. El primer paso supuso el rastreo de información
  fidedigna y sobre todos los elementos que definieron la identidad de los ambientes
  cuando fueron habitados por Vilamajó. Para ello el acceso a registros fotográficos
  de época, habitualmente esquivos y escasos, se tornó imprescindible. En este proceso,
  gradualmente se afirmó la convicción de la elocuencia de la imagen como instrumento
  clave de la investigación, se instaló la que dimos en llamar: metodología de investigación
  visual por escenas [VSR /Visual Scene Research], y se activaron recursos heurísticos
  específicos: el conocimiento espacial, geométrico y dimensional de la envolvente
  arquitectónica; el auxilio de una cultura visual informadaen todas las escalas de
  diseño; un amplio entrenamiento en el uso de la analogía como recurso de investigación.
  Se elaboraron así extensos laminarios que describen exhaustiva y meticulosamente
  el proyecto de sus interiores equipados, incluyendo las piezas de mobiliario, las
  obras de arte y los objetos de afecto de sus moradores. En la siguiente etapa, este
  dossier posibilitó el inicio de la recuperación integral de sus ambientes. Hoy día
  el MCV funciona como sede de protocolo de la FADU, es residencia temporal para actividades
  académicas de distintas disciplinas, recibe visitantes nacionales e internacionales,
  mantiene vínculos con otras casas-museo y sirve de modelo de gestión para la apertura
  al público de la Casa del Arq. Antonio Cravotto, construida en 1932, ubicada frente
  por frente con el museo. La metodología de investigación depurada a partir del proyecto
  del Museo Casa Vilamajó fue además aplicada, con muy buenos resultados, en la Casa
  Curutchet de Le Corbusier en La Plata, Argentina (Patrimonio de la Humanidad, Unesco).'
