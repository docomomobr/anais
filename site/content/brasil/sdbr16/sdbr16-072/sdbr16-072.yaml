abstract: 'A arquitetura hospitalar evolui constantemente, impulsionada por avanços
  médicos, normativos e tecnológicos. No Brasil, muitos hospitais são edifícios antigos
  que demandam atualizações e expansões, como o Albert Einstein e o Hospital das Clínicas,
  em São Paulo. Muitos conjuntos, construídos ao longo de décadas, possuem edifícios
  de valor histórico e tornam-se marcos urbanos, interferindo na dinâmica do entorno.
  Assim, arquitetura hospitalar deixa de ser apenas técnica para se tornar estratégica,
  e enfrenta o seguinte desafio: como a modernização hospitalar pode atender às rigorosas
  normas atuais, como a RDC 50 da Anvisa, sem descaracterizar seu patrimônio histórico
  e identidade? A resposta muitas vezes está na própria heterogeneidade dos conjuntos
  e na lógica da arquitetura moderna, que, com sua modularidade e flexibilidade, facilita
  conexões e transformações. O estudo de caso proposto é o Hospital das Clínicas da
  FMUSP, um marco da arquitetura moderna planejado nos anos 1930, e exemplo dessa
  adaptação contínua, integrando-se à malha urbana e atendendo às novas demandas sem
  perder sua identidade histórica.'
