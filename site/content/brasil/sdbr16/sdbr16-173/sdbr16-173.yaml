abstract: Esta apresentação vai abordar a participação feminina nos pavilhões de verão
  da Serpentine Gallery em Londres de 2000 a 2025, com particular atenção da proposta
  da arquiteta mexicana Frida Escobedo. Esta analise geram questões de reflexão sobre
  a tradição paisagística britânica em relações as propostas de projeto apresentadas;
  o que estas estruturas acrescentam ao debate arquitetônico, impacto na produção
  arquitetônica caso seja comercializada como um artefato a ser leiloado no mercado
  das artes plásticas, materialidade com gerador no desenvolvimento de design, questões
  de sustentabilidade nas propostas desenvolvidas e o papel do arquiteto neste momento
  em que vivemos.
