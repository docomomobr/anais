abstract: 'Esta comunicação investiga o potencial de pesquisa em arquitetura e urbanismo
  a partir de material salvaguardado pelo Arquivo Público do Distrito Federal (ArPDF).
  Mais precisamente, interessa explorar um universo projetual pouco estudado e historiografado:
  arquiteturas para a educação pública do Plano Piloto de Brasília.


  Os projetos desenvolvidos para Jardins de Infância, Escolas-Classe, Escolas-Parque
  e Centros de Ensino Médio configuram conjuntos ora autônomos, ora articulados entre
  si, sendo tributários do Plano Educacional concebido por Anísio Teixeira e sua equipe
  para a nova capital. Ao serem examinados, estas propostas podem revelar trajetórias,
  qualidades espaciais e construtivas, mas, sobretudo, diversidade e afinidades de
  pensamento arquitetônico que vão além de sua materialização física, aos edifícios
  que foram efetivamente construídos.


  As fontes primárias inéditas do ArPDF evidenciam uma produção coletiva variada,
  que contribuiu para a consolidação da espacialidade cotidiana de Brasília.  Assim,
  visando ampliar as abordagens sobre a Capital Federal para além de seus programas
  e espaços monumentais de exceção, o presente artigo oportuniza ocasião para explorar
  fração deste conjunto.'
keyword: Plano Piloto de Brasília; arquitetura escolar; Plano Educacional de Brasília
