abstract: Entre 2009 e 2012 realizou-se, em São Paulo, o concurso internacional para
  o Complexo Cultural da Luz, vencido pelo escritório suíço Herzog & de Meuron. A
  proposta se inseria em um processo mais amplo de revitalização da região central
  e refletia a ambição do Governo do Estado de São Paulo e dos organizadores do concurso
  de articular um eixo cultural já consolidado, reunindo importantes instituições
  e incorporando dois novos equipamentos, de modo a criar um destino cultural de escala
  internacional e impulsionar a requalificação urbana da área. Ainda que não tenha
  sido construída, a proposta permanece como hipótese arquitetônica relevante, na
  qual percursos dinâmicos, visualidades cruzadas e espaços de encontro se configuram
  como estratégias projetuais que buscavam enriquecer a experiência arquitetônica
  e a vida urbana. A análise de suas representações gráficas, plantas, cortes e diagramas
  à luz de referências teóricas busca compreender de que modo a sobreposição de espaços,
  percursos, transparências e vazios propõe uma espacialidade dinâmica em continuidade
  com a cidade e oferece subsídios para refletir sobre a arquitetura contemporânea.
