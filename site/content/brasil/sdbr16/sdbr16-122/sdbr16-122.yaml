abstract: A proposta deste trabalho é desenvolver uma primeira análise do Centro Municipal
  de Cultura de Uberlândia, novo equipamento cultural instalado no edifício que abrigou
  por quarenta anos o Fórum de Justiça Abelardo Penna, exemplar da arquitetura brutalista
  localizado no centro da cidade. Projetado pelos arquitetos mineiros José Carlos
  Leander de Castro e Roberto Pinto Manata, o edifício (1972–1977) foi integrado ao
  projeto do Centro Cívico de Uberlândia (1973–1976), elaborado pelo escritório do
  arquiteto Ary Garcia Roza, com paisagismo de Roberto Burle Marx. O projeto previa
  uma ampla praça que reuniria edifícios político-administrativos e equipamentos culturais
  e de lazer no antigo leito ferroviário da Companhia Mogiana, desativado nos anos
  1970. Contudo, apenas a Praça Sérgio Pacheco e o fórum foram construídos, e reformulações
  posteriores, decorrentes de alternância política, fragmentaram e descaracterizaram
  a praça, isolando o edifício, cuja arquitetura se destaca pelo partido e pelo uso
  do concreto aparente pouco comuns no Triângulo Mineiro. O edifício funcionou como
  fórum por quatro décadas e recebeu intervenções que resultaram em descaracterizações,
  como a perda da pavimentação idealizada por Burle Marx e o cercamento do entorno.
  Após a transferência das atividades judiciais para nova sede, o edifício passou
  por um período de incertezas quanto ao destino e ao risco de descaracterização.
  Em 2018, foi cedido ao município para uso cultural e recebeu adaptações para abrigar
  programas como a Secretaria Municipal de Cultura e Turismo, a Biblioteca Municipal
  e a Banda Municipal, além do arquivo do judiciário, ainda presente. Inaugurado em
  2020 como Centro Municipal de Cultura, o equipamento completa cinco anos, permitindo
  avaliar sua adaptação ao novo uso. Entretanto, o isolamento provocado pelo cercamento
  e a ocupação do térreo por estacionamento evidenciam a necessidade de repensar a
  relação entre a intervenção atual, o potencial arquitetônico e uma integração mais
  efetiva com a cidade.
