abstract: 'A arquitetura hospitalar moderna constitui um campo emblemático da modernidade,
  no qual se entrelaçam avanços técnicos, racionalidade espacial e valores simbólicos
  ligados ao cuidado. No Brasil, esse legado produziu edifícios de alto valor projetual
  e institucional, mas hoje sua continuidade é tensionada por transformações tecnológicas,
  normativas e funcionais. O Hospital de Clínicas de Porto Alegre (HCPA) é tomado
  neste estudo como caso paradigmático dessas tensões entre permanência e atualização.
  Projetado por Jorge Machado Moreira em 1942 e implantado a partir de 1971, o Bloco
  A expressa os princípios da escola carioca e da arquitetura moderna, forma prismática,
  pilotis, fachada livre e racionalidade compositiva, que, mesmo após sucessivas reformas,
  permanecem legíveis em sua estrutura e organização espacial. A expansão recente
  do complexo, com os Blocos B e C projetados conforme o Plano Diretor Hospitalar
  e ocupados a partir de 2020, introduziu uma lógica mais normativa e tecnocrática,
  orientada por padrões de eficiência e segurança sanitária. A partir de análise documental,
  projetual e bibliográfica, o presente estudo examina como o conjunto revela os dilemas
  da conservação crítica: a convivência entre valores originais e exigências contemporâneas.
  Nesse contexto, a arquitetura hospitalar moderna é compreendida como uma infraestrutura
  em transformação, cuja vitalidade depende da capacidade de adaptação sem ruptura
  de seus fundamentos espaciais e simbólicos.'
