abstract: 'Este artigo analisa intervenções espaciais desenvolvidas por três escritórios
  de arquitetura contemporâneos – Carla Juaçaba, Vão e Gru.a – realizadas em edifícios
  projetados por Oscar Niemeyer: os Ministérios de Brasília (1958), o Museu de Arte
  Contemporânea de Niterói (1996) e o Pavilhão Ciccillo Matarazzo (1962). Os projetos
  discutidos – Ministry of All (Carla Juaçaba, 2019), De onde não se vê, quando se
  está (Gru.a, 2017) e o projeto expográfico da 35ª Bienal Internacional de Artes
  de São Paulo (Vão, 2023) – configuram um conjunto de obras que compreendem a arquitetura
  existente não somente como suporte, mas como impulsionadora para proposições interpretativas.
  O que realmente se destaca nesses projetos não é tanto sua forma, mas a conexão
  íntima com o local em que estão inseridos.'
