abstract: Em 1986, o artista Daniel Buren realizou uma intervenção no Palais Royal
  em Paris. Construído pelo Cardeal Richelieu (1624-1639), convertido por Victor Louis
  em grande complexo arquitetônico multifuncional, com lojas, alas de apartamentos
  e jardins (1781-1786), restaurado e transformado por Pierre Fontaine (1814-1829),
  o Palais Royal é um exemplo de patrimônio arquitetônico e lugar historicamente constituído,
  firmemente instalado na memória social e coletiva. Entretanto, o Palais sobre o
  qual interferiu Buren já não tinha a Galerie d’Orléans construída por Fontaine,
  demolida em 1935. Em seu lugar, entre a Cour d’Honneur e os jardins, se estende
  uma dupla colunata. Essa colunata, memória do projeto de Louis (que nunca chegou
  a completar-se), é o ponto de partida para a intervenção de Buren, que distribui
  sobre o espaço da Cour d’Honneur uma série de colunas de distintas alturas, regularmente
  dispostas, como peças num jogo de xadrez. A despeito das controvérsias que causou,
  por alterar um monumento histórico, a intervenção convoca um diálogo físico e intelectual
  com a arquitetura do Palais Royal. Além disso, as colunas podem ser em qualquer
  momento retiradas, e tudo pode retornar à condição passada, sem que, contudo, seja
  eliminada a memória do espaço ressignificado pela arte. O objetivo da sessão é buscar,
  no campo do patrimônio moderno, experiências análogas, em que a arquitetura, mais
  que suporte, tenha sido o ponto de partida para a intervenção artística. Esperam-se
  trabalhos que procurem identificar, documentar e analisar intervenções de artistas
  contemporâneos na arquitetura moderna, com especial interesse nas inscrições temporárias,
  tais como instalações, performances, projetos curatoriais, etc., localizados em
  edifícios e espaços arquitetônicos modernos. Partindo da premissa de que uma materialidade
  instável, constituída por elementos e ações que apenas temporariamente são integrados
  à arquitetura de um edifício ou lugar, pode, contudo, formar parte do devir histórico
  deste mesmo lugar, interferindo sobre sua recepção, a sessão quer discutir operações
  artísticas contemporâneas realizadas sobre o patrimônio moderno. O propósito da
  sessão é destacar o papel de renovação e atualização do legado moderno que as intervenções
  artísticas puderam eventualmente exercer, precisamente por sua condição efêmera.
  De que modo a transformação da experiência de um edifício no presente pode contribuir
  para a compreensão de suas estruturas e lógicas formativas, lançando nova luz sobre
  suas hipóteses formais, técnicas e programáticas e atualizando sua relação com o
  público? Convocar outras temporalidades pode produzir experiências novas, passíveis
  de reinstalar o patrimônio moderno na memória coletiva e aproximá-lo a um público
  mais amplo e diverso? Em seus métodos, a sessão espera contar com descrições e análises
  pautadas em evidências materiais concretas, relativas à arquitetura e à intervenção
  artística discutidas, tais como fotografias, documentos de projeto, diagramas, e
  outros elementos que permitam compreender o edifício existente e elucidar as estratégias
  de intervenção praticadas pela intervenção artística contemporânea.
