abstract: 'Pretende-se discutir a persistência do moderno no Brasil, tomando como
  referencias as teses de Hans Ulrich Gumbrecht desenvolvidas em Despues de 1945.
  La Latência como origen del presente (2015a) e Nosso Presente Amplo: o tempo e a
  cultura contemporânea (2015b), nas quais apresenta a hipótese da contemporaneidade
  como um “presente amplo” que se estenderia pelo menos desde o final da segunda grande
  guerra, configurando um regime de temporalidade que engole o passado e paralisa
  o futuro. Tal formulação, a meu ver, implodiria a construção de narrativas de base
  historicista, vigentes na maioria das pesquisas na área de arquitetura, na medida
  inviabiliza as noções de causalidade, influencia, continuidade e ruptura, desenvolvimento,
  progresso, linearidade, e sobretudo anacronismo. O que significaria propor uma possibilidade
  reversa: é a contemporaneidade que se recusa a encerrar o moderno como horizonte
  de expectativas, conservando-o como nos diz Gumbrecht, como um “passageiro clandestino”,
  que irradia e afeta o presente, mas que não pode ser identificado e apreendido.'
