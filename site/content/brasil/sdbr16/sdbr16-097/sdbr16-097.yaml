abstract: 'Este artigo apresenta os resultados da pesquisa “Maceió Moderna: mapeamento
  da arquitetura residencial modernista na capital alagoana”, que teve como objetivo
  principal elaborar um inventário da atual situação da Arquitetura Moderna residencial
  produzida entre os anos de 1950 e 1980 na capital alagoana. Após mapeamento feito
  em 2021, optou-se por analisar o Edifício São Carlos (1964), do arquiteto Walter
  de Azevedo Cunha, primeiro edifício residencial modernista de Maceió. O estudo busca
  contribuir para a valorização e preservação dessa arquitetura, frequentemente invisibilizada
  e ausente das políticas de salvaguarda patrimonial. A investigação adota metodologia
  fundamentada em sete dimensões de análise - normativa, histórica, espacial, tectônica,
  funcional, formal e de conservação -, que permitem compreender o bem em sua totalidade
  física, simbólica e documental. O método foi aplicado por meio de pesquisa qualitativa,
  envolvendo levantamento bibliográfico e iconográfico, análise de registros legais,
  visitas técnicas e entrevistas com moradores. Os resultados evidenciam que a obra
  sintetiza o processo de modernização urbana de Maceió, conciliando princípios estéticos
  e construtivos do movimento moderno às especificidades locais, como o clima e a
  relação com a paisagem marítima. Contudo, o edifício carece de reconhecimento institucional
  e de políticas que assegurem sua preservação. Conclui-se que a aplicação das sete
  dimensões constitui ferramenta eficaz para identificar e interpretar o valor patrimonial
  de obras modernas, articulando aspectos técnicos, históricos e sociais. O estudo
  reforça a urgência de ações sistemáticas de documentação, difusão e valorização
  da Arquitetura Moderna alagoana, entendida como parte essencial da memória urbana
  e da construção da identidade modernista do Nordeste brasileiro.'
