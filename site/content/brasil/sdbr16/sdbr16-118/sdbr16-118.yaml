abstract: 'O artigo resulta de uma pesquisa desenvolvida no âmbito do Mestrado em
  Arquitetura, Urbanismo e Paisagismo da Universidade Federal de Santa Maria1 e investiga
  a permanência de fundamentos da arquitetura moderna na obra recente de Álvaro Siza,
  com ênfase na relação entre projeto e lugar. Parte-se da ideia de que, mesmo após
  a superação das vanguardas modernistas, princípios como a clareza construtiva, a
  funcionalidade e a integração ao entorno permanecem vivos na produção contemporânea,
  sobretudo quando reinterpretados criticamente por arquitetos como Siza. O conceito
  de lugar é tomado como eixo teórico e operatório central, articulando dimensões
  físicas, culturais e simbólicas do contexto. A metodologia combina revisão teórica,
  análise comparativa e leitura crítica de dois projetos paradigmáticos: a Fundação
  Iberê Camargo (Porto Alegre, Brasil) e o Museu de Arte Contemporânea Nadir Afonso
  (Chaves, Portugal). Ambos, concebidos entre 1998 e 2016, revelam como Siza desenvolve
  estratégias projetuais que dialogam com as preexistências naturais e urbanas, reinterpretando
  o legado moderno à luz das singularidades locais. Na Fundação Iberê Camargo, a relação
  com o lugar se expressa na integração entre topografia e percurso, resultando em
  volumetria fluida e contemplativa. No Museu Nadir Afonso, a intervenção é marcada
  pela contenção formal e pela integração ao tecido urbano e à paisagem do rio Tâmega.
  A análise demonstra que, em Siza, o lugar não é mera adequação contextual, mas instância
  crítica do projeto. Sua arquitetura media tradição e inovação, reafirmando o papel
  do arquiteto como intérprete do território. Assim, a obra de Siza revela uma continuidade
  crítica da modernidade, atualizando princípios modernos diante das transformações
  contemporâneas e reafirmando a arquitetura como prática cultural e instrumento de
  afirmação do lugar.'
