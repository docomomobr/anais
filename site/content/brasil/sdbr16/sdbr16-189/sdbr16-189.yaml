abstract: Esta es la historia de tres interiores —dos grandes almacenes y una casa
  privada — todos interrelacionados por ideas de modernidad, tradición, patrimonio
  y moda. Este artículo explora el caso de la Casa Flaño, una reconocida tienda por
  departamentos ubicada en Santiago de Chile a comienzos del siglo XX, como punto
  de inﬂexión en la articulación entre los interiores modernos, la moda femenina y
  la modernización urbana. A través del análisis de fuentes visuales, publicitarias
  y arquitectónicas, se examina cómo esta casa enmarca la idea del cuerpo moderno
  desde un enfoque particular vinculado a la moda y el consumo, especialmente al cruzarla
  con la Casa Flaño, la vivienda donde residía el dueño de estas tiendas. El concepto
  de "contaminaciones modernas" describe la forma en que los interiores comerciales
  — particularmente los escaparates, vitrinas y salas de exhibición— operaron como
  dispositivos que mezclaban imágenes, materiales y objetos diversos que se reﬂejaron
  en la vivienda de su propietario. Se analizan las tensiones entre la cultura visual
  del consumo, las formas arquitectónicas y los elementos contenidos en la casa, que
  disputan el signiﬁcado del habitar moderno mediante la colocación de objetos históricamente
  coyunturales. A través de este caso, se propone pensar los interiores comerciales
  como espacios liminales, contaminados por prácticas y signiﬁcados que exceden su
  función económica, mientras que la vivienda unifamiliar permite complejizar las
  relaciones entre arquitectura, moda y modernidad en el Chile del siglo XX.
