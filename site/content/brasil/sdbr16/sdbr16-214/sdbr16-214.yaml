abstract: 'Este artigo propõe uma reflexão sobre o urbanismo modernista no planalto
  central brasileiro a partir da análise de dois projetos urbanos não construídos:
  a Cidade Marina, idealizada em 1955 por Max Hermann e projetada por Oscar Niemeyer
  na região do Vale do Urucuia (MG), e a “Cidade Desconhecida”, projeto sem autoria
  confirmada, mas potencialmente atribuídas ao mesmo arquiteto, encontradas no Arquivo
  Público do Distrito Federal (ArPDF). A investigação busca dar destaque a essas propostas
  no campo da historiografia do urbanismo moderno, considerando a importância dos
  projetos criados para além do Plano Piloto de Brasília e que, mesmo não materializados,
  expressam visões significativas de desenvolvimento e modernidade. As cidades se
  inserem em um contexto marcado pelo desenvolvimentismo que permeou o Brasil na segunda
  metade do século XX. O projeto de interiorização da capital, mais do que uma decisão
  administrativa, assumiu um papel simbólico ao representar o avanço da modernização
  nacional e a ocupação planejada do território. É nesse cenário que Marina é concebida,
  uma cidade nova pensada para abastecer a capital, unindo o ideal modernizador a
  uma lógica econômica funcional. Já a “Cidade Desconhecida”, descoberta entre documentos
  sem data, localidade ou assinatura, remete a um exercício de síntese dos princípios
  modernistas em um projeto cuja ausência de materialidade amplia seu potencial especulativo.
  A investigação adota como metodologia a busca e análise documental dessas cidades,
  com o objetivo de evidenciar não apenas os aspectos estéticos e formais das propostas,
  mas também os discursos e ideologias que as sustentam. Ao posicionar Marina e a
  Cidade Desconhecida no centro da análise, propõe-se pensar o modernismo urbanístico
  não apenas como uma sequência de realizações monumentais, mas também como um campo
  permeado por tentativas, fracassos e arquivos esquecidos.'
keyword: História do Urbanismo; Cidades Novas; Oscar Niemeyer
