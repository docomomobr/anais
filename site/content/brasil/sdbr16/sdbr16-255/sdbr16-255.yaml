abstract: Este artigo analisa a atuação da arquiteta Mayumi Watanabe de Souza Lima
  (1934-1994), frente à direção do Centro de Desenvolvimento de Equipamentos Urbanos
  e Comunitários (CEDEC), destacando sua colaboração com a pedagoga Marta Grosbaum
  na criação do jornal-mural junto aos operários do Centro. O estudo situa o CEDEC
  no contexto da gestão de Luiza Erundina como prefeita de São Paulo, entre os anos
  1989 a 1992, e a abertura da democracia marcada pela Constituição de 1988, dando
  enfoque na sua proposta de associar a pesquisa e produção seriada de componentes
  de argamassa armada e formação crítica e emancipatória de trabalhadores. Para além
  de um espaço de desenvolvimento e fabricação das diversas tipologias de equipamentos
  públicos, o CEDEC constituiu-se como espaço de formação política e social, promovendo
  práticas educativas, nas quais Arquitetura, Educação e Política convergem na construção
  do saber crítico e da participação popular.
