abstract: A adoção de sistemas pré-moldados obteve uma relação direta com a racionalização
  da construção ligada à Arquitetura Moderna, articulando concepção plástica, avanços
  técnicos e práticas industriais. Esse cenário encontra em Brasília um marco referencial,
  onde os princípios teóricos desenvolvidos pela Escola Carioca encontram uma oportunidade
  de tomar forma. A repetição de elementos poderia ser um impasse para a expressão
  arquitetônica dos edifícios, mas o que foi encontrado consolida um legado que combina
  inventividade, racionalização e identidade própria. Esse artigo investiga os percursos
  da arquitetura pré-fabricada realizada em Brasília entre as décadas de 1960 e 1970
  e como eles se materializaram em obras expressivas. A análise é embasada de forma
  teórica por meio de textos escritos por arquitetos como Lúcio Costa e Oscar Niemeyer,
  e em casos práticos passando pelos primeiros momentos da construção de Brasília
  e da universidade, chegando nos blocos R2 e R3 de Milton Ramos e os edifícios de
  escritório para a Camargo Corrêa no Setor Comercial Sul de João Filgueiras Lima
  (Lelé), que demonstram a consolidação de técnicas e parcerias que representam o
  auge desta construção racionalizada que foi realizada em Brasília.
