abstract: 'Este artigo propõe uma abordagem analítica sobre a possibilidade de espacialidades
  gentis na arquitetura. Com enfoque na análise de três edificações verticais, projetadas
  entre as décadas de 1930 e 1960 na cidade de São Paulo: Edifício Esther, Edifício
  Louveira e Edifício Conjunto Nacional. Parte-se do pressuposto de que valores como
  abertura ao espaço público, promoção da vida urbana, acolhimento ao pedestre e mediação
  qualificada entre as esferas pública e privada já eram mobilizados por arquitetos
  modernos no contexto brasileiro, ainda que sob outros discursos e intenções. O conceito
  de edifício gentil, sistematizado por autores como Gabriela Tenório (2022), tem
  sido apropriado pelo mercado imobiliário como diferencial simbólico e reforçado
  por instrumentos legislativos como o Plano Diretor Estratégico de São Paulo (2014).
  Contudo, é possível traçar paralelos entre a noção contemporânea de gentilezas urbanas,
  e as estratégias adotadas em parte da produção arquitetônica moderna brasileira:
  seja na galeria interna do Esther, que cria uma passagem pública entre ruas; na
  implantação generosa do Louveira, que oferece parte do lote à cidade e estabelece
  uma transição sutil entre o público e o privado; ou mesmo na praça interna coberta
  do Conjunto Nacional, cuja marquise se projeta sobre as calçadas e acolhe diferentes
  fluxos urbanos. Argumenta-se que, nesses projetos, a gentileza decorre tanto do
  pensamento arquitetônico vigente, articulado a valores éticos, sociais e urbanos,
  quanto da intenção de qualificar a relação edifício–cidade. Ao historicizar o conceito
  de gentileza urbana, desloca-se seu uso de uma lógica mercadológica para o campo
  da reflexão arquitetônica orientada ao bem comum, como propõem Montaner e Muxi (2011)
  ao defender que a arquitetura deve assumir função política e fortalecer a cidadania
  e o espaço público. Assim, revisitar o legado moderno sob esse olhar contribui para
  uma base crítica mais consistente para pensar a noção de edifício gentil na contemporaneidade.'
