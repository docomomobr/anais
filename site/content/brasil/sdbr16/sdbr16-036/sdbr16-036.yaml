abstract: A construção de Brasília e a transferência da Capital Federal do litoral
  para o interior enseja a questão do deslocamento por uma nova malha rodoviária.
  Para rearticular a centralidade da nova Capital, o Plano de Metas de Juscelino Kubistchek
  exigirá viadutos, barragens, milhares de metros cúbicos de areia, brita e asfalto
  para pavimentação desta modernização, incluindo infraestrutura complementar de postos
  de gasolina, motéis, restaurantes, etc. O automóvel poderia ser o fator de vivência,
  experimentação e mesmo descoberta deste admirável Brasil novo! Para milhares de
  automóveis circularem livremente pelas novas estradas é imprescindível haver redes
  de postos de gasolina. Assim, o combustível que alimenta estas viagens somente seria
  possível se a Petrobras estivesse consolidada e atuante, sinalizando que a empreitada
  de Brasília é irreversível. Portanto, interessa especular como um posto de combustível
  da Petrobrás na BR-040 (1959-60), a sede do Touring Club (1962-63) e a nova sede
  da Petrobrás (1961-63) podem ser articuladas como fatores da consolidação de Brasília,
  para além dos seus palácios e espaços cívicos. Enquanto as revistas, jornais e mídia
  impressa, rádio e televisão enaltecem a construção da arquitetura simbólica, miríades
  de outras obras foram arquitetadas para a plena consecução do Plano Piloto. Nesta
  perspectiva, outros profissionais tais como o arquiteto José Bina Fonyat Filho —que
  projetou o posto— e o arquiteto Hélio Uchôa —que projetou a sede da Petrobrás— comprovam
  que há muitos outros profissionais em atuação no canteiro de Brasília, para além
  de Oscar Niemeyer, que também desenhou o Touring Club. Assim, entre a campanha nacionalizante
  pelo petróleo, do espírito “on the road” da cultura norte-americana e do caráter
  exclusivo de clube para aficionados por automóveis, é possível ampliar a complexidade
  da questão rodoviarista que está no DNA do Plano Piloto, mas sobretudo refletir
  sobre o caráter estrutural da presença da Petrobrás em Brasília.
