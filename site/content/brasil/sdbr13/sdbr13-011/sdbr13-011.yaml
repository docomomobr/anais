abstract: A Arquitetura Moderna Brasileira, desde o seu início, esteve centrada na
  observância aos conceitos europeus, preconizados por Le Corbusier, como também às
  características do clima local. Já que a excessiva radiação solar e luminosidade
  deviam ser controladas e dar privilégio a ventilação natural. Com o crescente debate
  sobre a preservação do legado do Movimento Moderno, considera-se que as estratégias
  arquitetônicas de edifícios desta época devem ser melhor estudados. Procura-se combater
  intervenções futuras que possam neutralizar ou modificar as estratégias passivas
  originalmente adotadas. Para tanto, o presente artigo tem como objetivo, analisar
  especificamente o Edifício Nova Cintra, um dos três edifícios implantados no Parque
  Guinle, Rio de Janeiro, projetado por Lucio Costa, mestre consagrado da arquitetura
  moderna brasileira. Este conjunto residencial se tornou, em 1986, o único com tombamento
  a nível nacional, fato que demonstra sua importância e peculiaridade. Analisou-
  se de forma qualitativa o conforto ambiental, com ênfase nas soluções projetuais
  propostas pelo arquiteto. Os resultados demonstram a preocupação de Lucio Costa
  com o máximo aproveitamento dos recursos passivos para garantir o conforto ambiental
  da edificação, o que se constitui em exemplo de bioclimatismo aplicado à arquitetura.
