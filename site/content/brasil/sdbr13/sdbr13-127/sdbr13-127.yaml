abstract: 'Este artigo apresenta as ações extensionistas realizadas por professores
  do Laboratório de Maquetes e Protótipos da Universidade Federal do Rio Grande do
  Norte (LABMAQ/UFRN) em conjunto com estudantes bolsistas e voluntários que objetivam
  o desenvolvimento de maquetes de papel como instrumento de educação patrimonial.
  Trata-se de um meio de reconhecimento do patrimônio edificado em favor da sua valorização
  e preservação, em particular a arquitetura moderna potiguar, utilizando a modelagem
  tridimensional em escala reduzida como instrumento de conhecimento e de projeto
  arquitetônico. Objetivou-se proporcionar ao público uma experiência de poder vivenciar
  a confecção de uma maquete de um edifício que lhe fosse familiar e inserido na paisagem
  da cidade, despertando neste, a possibilidade de criar uma relação afetiva com este
  edifício representado e materializado, visando sempre contribuir com a sociedade
  norte rio-grandense de maneira eficaz, no que se refere ao conhecimento e apropriação
  do espaço da cidade de forma consciente, e ao mesmo tempo, divulgar os trabalhos
  desenvolvidos pelo LABMAQ/UFRN. As ações foram realizadas no Estande do LABMAQ nas
  CIENTECs de 2015 a 2018. O público visitante diversificado interagiu bem com proposta,
  participando pessoas de diferentes perfis e faixas etárias, que vão desde crianças
  em grupos escolares, professores, adolescentes, adultos até famílias inteiras. As
  etapas de desenvolvimento foram: escolha do objeto arquitetônico trabalhado sob
  a forma de maquete, modelagem, impressão e corte das peças, testes e montagem. O
  principal critério de seleção do edifício modelado é ser modernistas de valor patrimonial,
  cuja forma possibilite uma fácil montagem de maquete.'
keyword: Educação Patrimonial; Maquete de Papel; Arquitetura Moderna
