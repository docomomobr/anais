abstract: 'Este trabalho apresenta uma análise do caráter tectônico do Tribunal de
  Justiça do Piauí (1972- 1975), concebido pelo arquiteto Acácio Gil Borsoi, para
  a cidade de Teresina - PI, a fim de trazer reflexões sobre a importância da poética
  construtiva na estrutura formal da arquitetura, contribuindo para o debate sobre
  as especificidades e singularidades da arquitetura moderna produzida no Brasil.
  A análise da arquitetura a partir de sua dimensão tectônica permite a compreensão
  de que no fazer arquitetônico, expressividade e materialidade, estão intrinsecamente
  associadas, ou seja, arquitetura enquanto arte não se dissocia das técnicas e materiais
  que a concretizam. Desse modo, a tectônica em sua abordagem analítica estuda a arquitetura
  não apenas como manifestação artística, mas igualmente, como fenômeno tecnológico.
  Investiga-se, portanto, as interações entre a expressividade, intrínseca à arquitetura,
  e a sua materialidade, condição do construtivo. Entretanto, a tectônica, enquanto
  síntese dessas interações essenciais à arquitetura, não prescinde de um fator extrínseco
  igualmente determinante de sua origem: o lugar, enquanto ambiente físico, cultural
  e econômico.'
keyword: Tectônica; Arquitetura Moderna; Tribunal de Justiça
