abstract: A relação entre o crítico de arte brasileiro Mário Pedrosa (1900-1981) e
  Brasília é quase uma constante sobre a história da construção da cidade. Os textos
  do autor sobre a cidade publicados especialmente entre 1957 e 1960 trazem contribuições
  importantes acerca do processo de mudança da capital do país do Rio de Janeiro para
  o Planalto Central. O objetivo deste artigo é apresentar e problematizar as ideias
  expostas por Mário Pedrosa na primeira parte de seu texto Reflexões em torno da
  Nova Capital (1957), intitulada Brasília ou Maracangalha?. Pretende-se recolocar
  algumas das problematizações do autor acerca da construção de Brasília, considerando
  sua atualidade enquanto crítica capaz de embasar a formulação de novas questões
  a partir dos conceitos-chave que constituíram sua “Teoria do Oásis”.
keyword: Brasília; Mário Pedrosa; Lucio Costa
