abstract: 'O presente trabalho se insere na pesquisa Arquiteturas escritas: Investigações
  acerca dos princípios e procedimentos de projeto a partir de textos de autores arquitetos.
  Após os estudos sobre a produção de Vitruvius e de Alberti, o trabalho se debruça
  sobre as publicações de Le Corbusier, com ênfase em Por uma Arquitetura, Precisões
  e O Modulor I e II. A análise desses escritos busca os princípios de qualidade de
  uma obra arquitetônica e os procedimentos necessários para alcançá-los. Tem como
  objetivo procurar os caminhos para as decisões tomadas durante o processo de projeto
  e verificar os possíveis desdobramentos da teoria vitruviana.'
