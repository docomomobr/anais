abstract: 'O presente artigo é parte de uma pesquisa mais abrangente que visa investigar
  a fronteira sutil que divide ou une, o projeto do novo e a conservação do existente.
  Investiga-se as questões teóricas que esse dualismo traz, que podem ser consideradas
  como palavras-chave: tradição, continuidade, história e que se condensam na prática
  projetual através do modus operandi do construir no construído. Isso é feito a partir
  da experiência projetual e da especulação teórica de três mestres do século passado,
  que representam, em primeiro lugar, as duas áreas geográficas da pesquisa, que são
  a Itália e o brasil, com três protagonistas: Lucio costa para o brasil, Ernesto
  Nathan Rogers para a Itália e Lina Bo Bardi como ponte entre os dois países. Nas
  páginas a seguir será aprofundado o conceito chave de tradição.'
