abstract: Da década de 1920, transformações aconteceram na produção da arquitetura
  em Bogotá, decorrentes da “independência” da arquitetura em relação ao exercício
  da engenharia no ensino superior, da profissionalização da atividade construtora
  e da fundação de grêmios locais de arquitetos. Isso, junto aos desdobramentos da
  experiência de firmas dos Estados Unidos mediante jovens formados em faculdades
  norte-americanas e à comissão de obras a parcerias estrangeiras, executadas por
  empreiteiros locais, definiu o critério empresarial que caracterizou boa parte das
  firmas fundadas na capital colombiana durante os cinquenta anos seguintes. Diante
  da carência de estudos sobre as metodologias de trabalho das firmas locais (a historiografia
  tem focado nas biografias dos autores e nas monografias da sua obra), esta comunicação
  faz um panorama dessas firmas, aqui definidas como empresas conformadas por dois
  ou mais sócios, aptos para adiantar trabalhos em áreas diferentes, desenvolvendo
  estruturas organizacionais análogas que permitiram-lhes encarar todas ou quase todas
  as fases de um projeto arquitetônico. Para compreendermos o fenómeno, e baseados
  no exame de fontes primárias (entrevistas, publicações especializadas, publicidade
  e arquivos das firmas), inquire- se a noção de “firma de arquitetura” na Colômbia,
  as suas possíveis origens, os processos paralelos no continente, as adaptações locais,
  a co-participação com instituições estaduais e o trabalho colaborativo no desenvolvimento
  de concursos públicos e particulares, bem como comissões diretas de grande porte.
