abstract: Um dos maiores desafios na preservação do patrimônio de Brasília é conciliar
  a proteção dos aspectos fundamentais do bem com o crescimento e as transformações
  inerentes a qualquer cidade. Inserida nessa temática, apresentamos como estudo de
  caso a proposta da NOVACAP de modernização dos viadutos do Eixo Rodoviário-Residencial,
  compostos pelas tesourinhas. A proposta inicial, contudo, não levou em consideração
  as peculiaridades do sítio urbano tombado e reconhecido como Patrimônio da Humanidade.
  Considerando o patrimônio protegido como um todo indivisível, a substituição do
  elemento original das tesourinhas por barreiras “New Jersey” e defensas metálicas
  modifica a apreensão geral do conjunto. O que está em jogo não é apenas a troca
  de um elemento por outro, mas sim as relações estabelecidas entre esses elementos
  e a paisagem circundante. Levando-se em consideração que Brasília é coberta por
  muitos quilômetros de asfalto e um número considerável de viadutos, a intervenção,
  tal como foi proposta inicialmente pela NOVACAP, abriria um grande precedente com
  a substituição desses elementos, descaracterizando-a em seus aspectos formais. Para
  esse tipo de intervenção, seria necessária uma abordagem respeitosa e criteriosa,
  precedida por estudos técnicos e conceituais que fundamentem e justifiquem a tomada
  de decisão.
