abstract: Este artigo insere-se na temática dos impactos do crescimento socioespacial
  e das mudanças de uso nas edificações com características Art Déco localizadas na
  centralidade urbana da cidade de Passo Fundo/RS – Brasil, mais precisamente dos
  prédios implantados nas Ruas Paissandu, Morom e Avenida Brasil, no trecho entre
  as Ruas Coronel Chicuta e Tiradentes. Nesse sentido, o objetivo deste trabalho foi
  registrar e analisar o repertório Art Déco da referida cidade entre as décadas de
  1930 e 1960. Mais especificadamente, objetivou-se identificar quais foram as mais
  significativas alterações que o crescimento da cidade e as mudanças de uso ocasionaram
  nesses exemplares ao longo dos anos. A identificação das edificações abordadas foi
  realizada por meio de análises bibliográficas e deslocamento peatonal. Pôde-se perceber
  que parte dos prédios registrados se apresentam comprometidos em algum aspecto,
  seja em relação ao seu estado de conservação ou pela anexação de anúncios publicitários
  demasiadamente grandes, comprometendo a visualização de grande parte da volumetria
  e modificando significativamente a percepção da identidade arquitetônica. Sendo
  assim, acredita-se que o presente trabalho possa contribuir com as discussões nesse
  campo e incentivar a valorização dessas edificações e a outorga de legislação patrimonial
  que promova sua preservação no contexto municipal.
