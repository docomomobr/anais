abstract: 'Este artigo pretende elucidar algumas questões a respeito da historiografia
  da arquitetura no Brasil. Através do aporte teórico da disciplina da história, trata
  a periodização enquanto elemento de estruturação narrativa, construído e proposto
  pelos autores, numa leitura referenciada e individualizada de um fragmento do passado.
  Para isso, selecionou três livros de história da arquitetura no Brasil: Arquitetura
  contemporânea no Brasil de Yves Bruand (1981), Arquiteturas no Brasil: 1900-1990
  de Hugo Segawa (1998) e Brasil: arquitetura após 1950 de Maria Alice Junqueira Bastos
  e Ruth Verde Zein (2010). Com o objetivo de analisar graficamente e textualmente
  algumas das questões presentes na seleção dos acontecimentos do passado e de apresentar
  uma leitura do verso da trama narrativa visível, para além da inclusão das temáticas
  omitidas da historiografia. Esse artigo apresenta um de trecho de um trabalho maior
  e mais profundo em desenvolvimento 1.'
keyword: Historiografia; Narrativa; Diagrama; Arquitetura
