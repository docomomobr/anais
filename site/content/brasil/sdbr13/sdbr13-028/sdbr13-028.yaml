abstract: Em 1973 um grupo de arquitetos atuantes em Curitiba venceu o concurso para
  a sede do Banco Nacional de Desenvolvimento Econômico (BNDE) em Brasília. A equipe
  reuniu profissionais de três escritórios recém-criados na capital paranaense, entre
  eles, Alfred Willer, José Hermeto Palma Sanchotene, Oscar Mueller; Joel Ramalho
  Júnior e Leonardo Tossiaki Oba; Ariel Stelle e Rubens Sanchotene, e os estudantes
  Guilherme Zamoner e Edmar Meissner. Este projeto vencedor ainda hoje chama a atenção
  por potencializar certos aspectos da arquitetura modernista. Ao perguntar o que
  caracterizou tal potencialização, este trabalho expõe eventuais referências deste
  projeto e o contextualiza na cultura arquitetônica dos anos 1970. Com base na análise
  formal e apoiado na revisão de literatura, o texto se vale da argumentação lógica
  para evidenciar que a conformação da proposta vencedora promoveu uma atualização
  da arquitetura moderna no país.
