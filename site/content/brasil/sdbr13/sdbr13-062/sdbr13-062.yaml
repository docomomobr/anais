abstract: O trabalho trata de polêmica modalidade de intervenção no patrimônio arquitetônico
  construído (ou desaparecido), que é a reconstrução. O estudo de caso em questão
  é a obra de recuperação do Museu das Missões, transcorrida depois dos graves danos
  causados pela passagem de forte tornado, que o atingiu no ano de 2016. O edifício,
  inaugurado em 1940, fica em sítio tombado em âmbito federal e classificado pela
  UNESCO como Patrimônio da Humanidade. Embora seja usualmente apresentada como restauração,
  a obra aqui em pauta tem ares de reconstrução, já que o resultado da ampla intervenção
  remete à sua imagem anterior, mas com nova materialidade. Além de breve revisão
  sobre precedentes operações análogas, o trabalho analisará e discutirá os resultados
  alcançados na obra de recuperação do museu, a fim de contribuir para a reflexão
  a respeito dos possíveis encaminhamentos para a preservação do legado moderno, que
  tem revelado suas especificidades a cada novo caso de estudo.
keyword: Museu das Missões; reconstrução; restauração; patrimônio
