abstract: 'O trabalho do arquiteto Olavo Redig de Campos carrega um forte caráter
  de sua personalidade: a discrição. Apesar de pouco se conhecer sobre sua obra e
  do escasso registro do trabalho que desenvolveu, alguns de seus projetos fazem parte
  do repertório de obras do movimento moderno brasileiro, sendo o principal deles
  a casa de Walther Moreira Salles, o hoje Instituto Moreira Salles, no Rio de Janeiro.
  Além de outros trabalhos pelo Brasil, dentre os quais diversas residências em Brasília
  e edifícios cívicos em Curitiba, Redig de Campos teve um importante papel como arquiteto
  do Ministério das Relações Exteriores, função que exerceu por cerca de trinta anos.
  No cargo, atuou ativamente junto a Oscar Niemeyer e ao embaixador Wladimir Murtinho
  na composição dos interiores do Palácio Itamaraty em Brasília e no projeto e na
  construção de inúmeras embaixadas brasileiras no exterior. Neste cenário, com o
  objetivo principal de apresentar a pesquisa em curso a respeito da vida e da obra
  do arquiteto, este artigo traz os primeiros desdobramentos do levantamento das documentações
  e da realização de entrevistas com familiares e ex-assessores de Redig de Campos,
  bem como desenhos arquitetônicos de alguns dos projetos de embaixadas redesenhados
  a partir de originais coletados nos arquivos em Brasília e no Rio de Janeiro. Ao
  apresentar e analisar alguns dos projetos mais relevantes de sua carreira, o trabalho
  pretende, finalmente, contribuir para a historiografia da Arquitetura Moderna brasileira
  e suprir a lacuna bibliográfica a respeito do trabalho de Olavo Redig de Campos.'
