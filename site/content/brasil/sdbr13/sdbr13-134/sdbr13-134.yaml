abstract: 'Este artigo propõe alguns marcos para a revisão da historiografia arquitetônica
  da América Latina, lançando um olhar específico para a contribuição das mulheres
  na produção do século XX. Parte do entendimento de que as arquitetas latino-americanas,
  por sua dupla condição de gênero e de posição geográfica, foram empurradas para
  as margens das margens das histórias da arquitetura tradicionais, que adotam como
  centralidades os países europeus e os Estados Unidos. Para tanto opera uma revisão
  crítica e atualizada do trabalho “Arquitetas e Arquiteturas na América Latina do
  Século XX”, de Lima (1999). Constitui ainda base importante da construção da argumentação
  a obra de Marina Waisman, em particular “El Interior de la Historia: historiografia
  para uso de latino-americanos” (1993). O artigo se encerra posicionando os marcos
  propostos em face de contextos mais amplos, que se estendem para além do reconhecimento
  da contribuição das mulheres brancas das classes média e alta, apontando para a
  necessidade também de reconhecimento de outros aportes importantes, como os de origem
  africana e indígena, aos espaços construídos nas diferentes comunidades latino-
  americanas.'
keyword: Arquitetas; América Latina; revisão historiográfica; arquitetura
