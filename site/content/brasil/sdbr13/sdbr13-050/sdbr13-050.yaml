abstract: O presente artigo se propõe a fazer um registro do processo de elaboração
  de diretrizes para a recuperação de trecho do projeto paisagístico de Roberto Burle
  Marx para a Orla de Copacabana, atingido pelas obras de reforma do imóvel 4240,
  ocupado pelo Hotel Fairmont. A partir da autorização, pelos órgãos com tutela sobre
  o bem, de instalação de um tapume para dar suporte às obras, com trânsito de equipamentos
  e maquinário de grande porte, surgiu a necessidade de que, ao fim das obras, a quadra
  fosse recuperada conforme o projeto inicial. Para isso, o Escritório Técnico da
  Paisagem Cultural do IRPH, ETPC, elaborou diretrizes que mais tarde subsidiariam
  o projeto de recuperação da Praça Coronel Eugênio Franco, elaborado pelo escritório
  responsável e com o acompanhamento do INEPAC. A proposta apresentada considerou
  a importância da Orla de Copacabana no contexto do reconhecimento da área como Patrimônio
  Mundial pela UNESCO na categoria Paisagem Cultural, campo de atuação do ETPC.
