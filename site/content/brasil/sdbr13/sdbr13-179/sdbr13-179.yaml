abstract: Este trabalho trata da verticalização no centro do Rio de Janeiro, e mais
  especificamente a Esplanada de Santo Antônio. O trabalho busca compreender a proposição
  de cidade implementada na Esplanada, a partir da apresentação do processo de verticalização
  do centro do Rio de Janeiro, que se deu desde as primeiras décadas do século XX,
  dos diversos projetos urbanísticos para a área, da reconstituição do processo e
  do estado em que esta área extraordinária se encontra, a partir da criação de um
  painel cronológico.
