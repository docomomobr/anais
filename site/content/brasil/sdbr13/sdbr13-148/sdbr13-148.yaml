abstract: 'Em 1962, Niemeyer escreveu o prefácio para Art in Latin American Architecture
  de Paul Damaz, talvez o mais extenso panorama sobre a inclusão da arte na arquitetura
  moderna latino-americana, e começou dizendo que o problema era “mais complexo do
  que a primeira vista podia parecer”. Anos depois, no livro de memórias As curvas
  do tempo, Niemeyer ainda achava a integração das artes na arquitetura um “assunto
  mal compreendido”. É fácil encontrar, na tradição moderna, uma concordância discursiva
  quanto aos benefícios da síntese das artes, ideia que o próprio CIAM oficialmente
  chancelou em Hoddesdon, em 1951. Já as realizações efetivas dessa ideia suscitaram
  não poucas controvérsias. Max Bill não foi o único a condenar a pintura mural na
  arquitetura moderna, e a professar uma visão restritiva sobre a natureza dessa síntese.
  O próprio Damaz achava que a arte abstrata era mais “adaptável” à arquitetura moderna
  do que a arte figurativa. Entretanto, os modos pelos quais Niemeyer manejou o tema
  em sua arquitetura não parecem ter se limitado a essas recomendações apriorísticas.
  O artigo examina a relação entre arte e arquitetura em três de seus projetos: a
  casa para Oswald de Andrade (1938); o monumento a Rui Barbosa (1949); o Museu da
  Cidade de Brasília (1958-60).'
