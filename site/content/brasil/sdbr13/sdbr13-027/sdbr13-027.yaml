abstract: Ao projetar, o arquiteto transforma hipóteses em um conjunto de elementos
  gráficos, o projeto. As hipóteses lançadas durante o desenvolvimento deste conjunto
  de desenhos se tornam tão importantes quanto o próprio produto, visto que possibilitam
  reflexões acerca do ato de projetar, enriquecendo o desenvolvimento e a experimentação
  arquitetônica. A investigação nutre o projeto; o projeto nutre a investigação. Para
  relacionar a investigação em arquitetura com as estratégias de projeto utilizamos
  obras referenciais. Suas imagens e desenhos se tornam fontes primárias de argumentos
  por se tratarem não somente de elementos ilustrativos, mas objetos carregados de
  informações. São, portanto, as informações extraídas destes o principal material
  argumentativo da investigação arquitetônica. Esta investigação, por sua vez, é hipótese
  para a compreensão e o ensino do próprio projeto arquitetônico como disciplina.
  Este artigo abordará a investigação a partir da análise dos desenhos e projetos
  de Le Corbusier, devido a sua influência na arquitetura quanto no ensino desta.
keyword: representação gráfica; ensino de projeto; arquitetônico; Le Corbusier
