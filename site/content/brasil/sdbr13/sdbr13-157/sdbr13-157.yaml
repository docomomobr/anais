abstract: O Centro Cívico de Curitiba foi projetado no Rio de Janeiro por uma equipe
  de arquitetos coordenada pelo professor David Azambuja em 1951, antecipando em meia
  década a Praça dos Três Poderes em Brasília. O projeto de Sergio Rodrigues para
  o Palácio da Justiça teve o acompanhamento de Lucio Costa, com notória referência
  ao Palácio Capanema. Sua atividade como designer teve início em Curitiba em sua
  loja Móveis Artesanal Paranaense na mesma década. Apenas onze pavimentos foram executados
  dos 33 originais previstos para o Palácio da Justiça. O restauro do térreo, mezanino
  e primeiro pavimento restabeleceu as soluções originais de espaço, incluindo a escada
  nobre circular. O sétimo pavimento teve tratamento de “restauro exemplar” para os
  elementos em madeira e para formas curvas originais dos sanitários. Foi desenvolvido
  um trabalho criterioso no restauro dos revestimentos cerâmicos das fachadas, com
  levantamento fotográfico, mapeamento das patologias e recolocação das pastilhas
  2x2cm tipo “miscelânea”. Os brises-soleis foram substituídos por novos com mesmo
  desenho e cor. Com mesma paginação e funcionamento as esquadrias de ferro foram
  substituídas por alumínio em cor natural com vidros incolores, cumprindo exigências
  de segurança e sustentabilidade. Complementando o retrofit foram refeitas as instalações
  hidráulicas e elétricas, introduzindo também um sistema de ar condicionado. O restauro
  do Palácio da Justiça recompôs sua monumentalidade conforme sua ocupação histórica
  junto ao conjunto do Centro Cívico de Curitiba fazendo parte do desenvolvimento
  inicial da arquitetura moderna brasileira.
