abstract: O projeto propôs a articulação da pesquisa e extensão ao ensino, utilizando
  as obras do arquiteto Hans Broos em Santa Catarina que constam no processo de tombamento
  em instrução no IPHAN, que foi a instituição demandante externa. A própria comunidade
  denunciou algumas demolições, que serviram como justificativa para a realização
  da atividade de extensão. Foi possível inserir a discussão sobre a valorização patrimonial
  no ensino, com uma equipe multidisciplinar de bolsistas como protagonistas dessas
  atividades, através das atividades de ensino e da apresentação dos resultados do
  projeto para o público interno e externo ao IFSC, como as instituições de patrimônio
  (IPHAN, FCC, CAU) e demais universidades que pesquisam no campo acadêmico (UFSC,
  FURB, UNIDAVI, UNISOCIESC).
