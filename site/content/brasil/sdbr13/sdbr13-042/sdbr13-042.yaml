abstract: Este trabalho centra-se na análise da Casa da Música do Porto (Rem Koolhaas/OMA,
  1999-2005) e da Cidade das Artes do Rio de Janeiro (Christian de Portzamparc/ACDP,
  2002-2013), salas de concertos municipais concluídas no início deste século por
  arquitetos da geração dos 1940 operando no estrangeiro. Ambos empreendimentos subentendiam
  a realização de edifícios icônicos de suas cidades, capazes de replicar o sucesso
  do Museu Guggenheim de Bilbao (Frank Gehry, 1991-1997). Para além da crítica corrente,
  que as condena sobretudo como exemplos de acontextualismo e arbitrariedade formal,
  este artigo identifica e analisa seus propósitos e projetos com maior profundidade,
  objetivando esclarecer em que medida estas são obras consistentes do ponto de vista
  da cultura disciplinar. O texto se organiza em quatro capítulos, alimentados pelo
  acesso a fontes primárias, pesquisa bibliográfica e visitas às duas obras. O primeiro,
  Dois Arquitetos, circunscreve ambos os arquitetos na conjuntura disciplinar do último
  quarto do século XX, evidenciando suas ligações profissionais e o interesse mútuo
  pela tradição da arquitetura moderna brasileira. O segundo, Casa, apresenta a Casa
  da Música, desde o encargo às distintas fases de projeto e execução. O terceiro,
  Cidade, análogo ao segundo, trata da Cidade das Artes. Por fim, Uma Cultura, conclui
  o texto à luz da descrição precedente e da identificação das estratégias de caracterização
  adotadas, evidenciando o reprocessamento da tradição moderna pela arquitetura contemporânea,
  com particular atenção à contribuição luso-brasileira.
