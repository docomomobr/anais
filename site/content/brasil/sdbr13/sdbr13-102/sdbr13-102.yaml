abstract: O presente trabalho procura entender o papel da habitação coletiva na arquitetura
  modernista através da comparação das propostas verificadas nos movimentos soviético
  e brasileiro. Primeiramente, é analisada a importância dos projetos habitacionais
  dentro do contexto mais amplo da arquitetura moderna, à qual se atribui, a partir
  do segundo CIAM, a missão de atender à crescente carência de habitação voltada aos
  setores de renda mínima. Assim, com o foco não nos resultados formais e sim na produção
  funcional e massificada de moradias, foi proposta a arquitetura como arte social,
  concepção que culmina em diferentes resultados dentre as vanguardas modernistas.
  Enquanto o construtivismo soviético alia a produção arquitetônica aos ideais da
  Revolução de 1917, criando as Complexos Residenciais Comunais, o desenvolvimentismo
  do regime do Estado Novo reflete no modernismo brasileiro e sua produção de habitações
  sociais, majoritariamente financiadas pelos IAPs (BONDUKI, 1999). Desse modo, são
  apontados neste estudo as afinidades e divergências dos dois modelos como evidência
  dos diálogos internacionais que atravessam a produção mundial modernista, sendo
  a principal diferença a ideologia vinculada aos projetos habitacionais, financiados
  em ambos os casos pelo Estado.
keyword: ​habitação coletiva; modernismo; arquitetura brasileira; arquitetura soviética
