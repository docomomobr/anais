abstract: Este artigo toma como objeto de estudo uma amostragem de seis moradias projetadas
  pelo arquiteto Mário Glauco Di Lascio (nasc. 1929), construídas ao longo da Avenida
  Epitácio Pessoa (cidade de João Pessoa/PB). Em meados do século XX, este trajeto
  desempenhou um papel importante na modernização e no direcionamento da expansão
  de João Pessoa. Por um lado, representou a única ligação efetiva entre o centro
  e o mar; e por outro, contribuiu para a redefinição do contexto socioeconômico da
  urbe, transformando-se num caminho das elites rumo às porções litorâneas. Nesse
  processo, a via tornou-se uma espécie de "vitrine" das melhores de formas de morar
  na cidade. Assim, se nos primeiros momentos de ocupação da via averiguamos bangalôs
  e casarões neocoloniais; a partir dos anos 1950, o percurso caracteriza-se como
  ambiente favorável à instalação da arquitetura moderna que se disseminava pelo Brasil,
  contendo obras de arquitetos renomados como Acácio Gil Borsoi, e posteriormente,
  nomes de projeção local, como Mário Di Lascio, nos anos 1960 e 1970. Assim sendo,
  analisamos estas obras de Di Lascio através das categorias "técnica e linguagem"
  e "espaço e movimento", procurando entender o modo como esta arquitetura conciliava
  os princípios modernos difundidos naquela época de transição, com formas de construir
  e de habitar ainda arraigadas em práticas tradicionais. Como resultado desse breve
  estudo, percebemos que estas edificações expressaram várias formas de relacionar
  o antigo e o novo – em certos momentos de modo mais sintético e equilibrado, em
  outros, gerando contradições no espaço doméstico.
