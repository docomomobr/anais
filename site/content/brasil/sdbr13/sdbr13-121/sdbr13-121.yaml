abstract: 'Flávio de Carvalho (1899-1973) foi artista em quase tudo que sua arte pôde
  tocar: arquiteto, engenheiro calculista, urbanista, pintor, desenhista, escultor,
  teatrólogo, cenógrafo, músico, radialista, jornalista, escritor, etnólogo, antropólogo
  e performista; foi um agitador cultural. Um dos mais notáveis personagens do movimento
  moderno brasileiro, teve uma obra de grande abrangência e influência no meio cultural
  do Brasil no século 20. O presente artigo tem suas raízes no Núcleo de Teoria e
  História da Arquitetura e do Urbanismo (NUTHAU) da Faculdade de Arquitetura e Urbanismo
  e Design (FAUeD) da Universidade Federal de Uberlândia (UFU) dentro da pesquisa
  ‘Arquitetura Moderna no Brasil e sua recepção nas revistas europeias e brasileiras
  (1945-1960)’, coordenada pela professora Maria Beatriz Camargo Cappello. O objetivo
  do trabalho é apresentar um levantamento da atuação de Flávio de Carvalho no jornalismo
  cultural brasileiro, analisando suas principais áreas de abrangência, seus interesses
  e influências, seja em jornais, revistas, periódicos e outras mídias da imprensa
  desde o final dos anos 1920 até 1973, ano de seu falecimento.'
keyword: Flávio de Carvalho; Jornalismo Cultural; Imprensa Brasileira
