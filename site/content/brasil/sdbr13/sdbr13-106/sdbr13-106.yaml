abstract: Neste artigo temos por finalidade refletir sobre a cultura arquitetônica
  moderna e a produção de novas arquiteturas sobre tecidos urbanos históricos remanescentes,
  questão que ainda precisa ser explorada em maior profundidade na investigação histórica
  e projetual. Buscaremos entendimentos a partir do estudo da implantação do edifício
  do Hospital Souza Aguiar (1961) e da historicidade do entorno da Praça da República
  onde está localizado, pensando as relações que o projeto deste edifício estabelece
  com o lugar, com as concepções da arquitetura moderna brasileira, assim como com
  as discussões presentes no cenário internacional do Pós-Guerra. Consideramos ainda
  projetos modernos precedentes para o entorno no âmbito da arquitetura brasileira,
  sobretudo da “escola carioca”, e as diversas legislações que implicaram intervenções
  no tecido urbano nesta parcela da cidade. Para tal, iniciamos com uma incursão no
  panorama histórico acerca da ideia de monumento no âmbito da modernidade, para depois
  nos determos em aspectos específicos do tema no contexto de análise.
