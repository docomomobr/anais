abstract: Este artigo apresenta a síntese dos fatos que levaram o governo francês
  a convidar Le Corbusier para realizar um projeto para a Embaixada da França, razão
  pela qual o arquiteto viajou para Brasília em 1962, depois do convite ter sido feito
  ao arquiteto francês Jacques Pilon, até os motivos que levaram à decisão de não
  construir o projeto proposto pelo franco-suíço, após sua morte em agosto de 1965,
  e que teriam levado ao pedido de um “novo” projeto em 1970, elaborado posteriormente
  por um de seus “discípulos”, o arquiteto chileno Guillermo Jullian de la Fuente,
  e construído, finalmente, entre 1972-1974. A presente pesquisa confirma parte das
  informações publicadas a respeito desse assunto, o complementa com mais detalhes,
  revela informações inéditas e desfaz alguns equívocos historiográficos.
