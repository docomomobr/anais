abstract: 'Este artigo tem como tema o azulejo como revestimento de fachada na arquitetura
  do século XX no Brasil, motivada em entender a recepção da técnica de revestimento
  da arquitetura do período colonial e seus desenvolvimentos e desdobramentos na arquitetura
  moderna e contemporânea. A partir da compreensão que o azulejo é ornamento e o fenômeno
  de azulejar as fachadas é fruto da revolução industrial se construiu o referencial
  considerando a obra de teóricos da ornamentação (Ruskin, Semper, Loos). A análise
  de exemplares está dividida em três partes e segue narrativa cronológica abordando:
  os primeiros azulejos na arquitetura moderna brasileira – os marcos consagrados
  pela Historiografia (Edifício do MES, Conjunto da Pampulha e Conjunto Pedregulho),
  relacionando-os aos azulejos tradicionais. Logo após, segue-se estudando a produção
  dos anos 1950, investigando as tramas azulejadas, ou seja, a relação entre as peças
  de azulejo, de vários artistas e arquitetos buscando compreender como esse novo
  surto de utilização do elemento se deu. Por fim, o intervalo entre os anos de 1960
  – 2000, e toma a obra de Delfim Amorim, Athos Bulcão e Petrônio Cunha como objeto
  de investigação pela relevância de seus trabalhos e a particularidade com que encararam
  a trama azulejada. Concluindo que o desenho da peça do azulejo moderno e contemporâneo
  mantém reminiscência do desenho do azulejo tradicional; enquanto a trama é responsável
  pela descontinuidade com tradição quando aparece em esquemas assimétricos, aleatórios
  ou semi-estruturados com elementos aleatórios. Dessa forma, o azulejo do século
  XX é ao mesmo tempo continuidade e descontinuidade da azulejaria tradicional.'
