abstract: O campus Joaquim Amazonas da Universidade do Recife (hoje UFPE), iniciado
  em 1949, é mais um capítulo da rica história dos campi universitários brasileiros,
  que, em sua maioria, seguiram os princípios da arquitetura e urbanismo moderno.
  Apesar de sua incompletude em relação ao plano original, o campus da UFPE, é um
  espaço significativo de nossa herança moderna, congregando diversos exemplares da
  arquitetura moderno em uma sofisticada implantação urbanística moderna. Entretanto,
  hoje ele apresenta grandes problemas para conservar seus edifícios e espaços livres,
  como acontece em outras realizações de conjuntos urbanísticos modernos. Após mostrar
  a criação e a evolução do campus, este texto discute os desafios que envolvem a
  conservação e o planejamento deste espaço hoje, pertinentes também a outros campi
  no país, e aponta algumas sugestões para equacionar estes problemas e garantir sua
  sobrevivência para as próximas gerações .
keyword: Campus universitário; urbanismo moderno; conservação; plano diretor
