abstract: Em Brasília há muitas Brasílias e nem todas cabem em no quadrado. As narrativas
  e histórias sobre a capital costumam enaltecer a empreitada da construção de uma
  cidade em cinco anos, como sonhava Juscelino Kubitschek, sua arquitetura, seus palácios.
  E como cidade inventada que é que só nasceu pelo traço do arquiteto, foi através
  do Concurso para o Plano Piloto de 1957 que o desenho se tornou realidade. E, apesar
  da baixa representatividade, sim, havia mulheres projetando em um dos principais
  concursos de arquitetura e urbanismo da história brasileira. Ainda que a realidade
  do cerrado fosse tão dura, muitas mulheres vieram para a Capital com suas famílias,
  outras desbravadoras, se aventuraram no pó vermelho do cerrado e vieram trabalhar
  e estudar na criação da Universidade de Brasília. Entre os registros da passagem
  feminina pela universidade, temos também os relatos orais, as listas de filiação
  do IAB e as listas dos encontros comemorativos, os quais indicam que em torno de
  30 arquitetas estiveram pela capital nos anos de 1960/70, o período de maior impulso
  na construção local. Mas, não só de arquitetas se construiu a cidade, e a participação
  feminina acompanhou a saga e a violência da capital em construção.
