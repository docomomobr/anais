abstract: Este trabalho analisa como se deu a implantação de exemplares da arquitetura
  moderna na cidade de São João del-Rei (MG), primeira cidade brasileira tombada pelo
  Instituto do Patrimônio Histórico e Artístico Nacional. Reconhecida pelo seu rico
  acervo de arquitetura colonial barroca, a cidade, por não ter passado por períodos
  de estagnação econômica como as demais cidades mineiras tombadas, possui em sua
  paisagem diversos estilos arquitetônicos, entre os quais o moderno. O estudo da
  implantação dessa arquitetura revela relações de poder em torno do patrimônio histórico
  e do desejo de modernização de alguns grupos locais, gerando conflitos entre agentes
  progressistas e preservacionistas. A pesquisa em fontes documentais - arquivo de
  processos do Instituto do Patrimônio Histórico e Artístico Nacional (IPHAN) e da
  Prefeitura Municipal, periódicos locais publicados no período e fotos dos acervos
  do IPHAN e do Museu Regional de São João del-Rei - permitiram a identificação de
  tais conflitos, bem como das posturas dos órgãos de preservação em relação à implantação
  e preservação da arquitetura moderna, além da identificação de agentes construtores
  da cidade.
