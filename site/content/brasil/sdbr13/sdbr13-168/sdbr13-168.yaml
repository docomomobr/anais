abstract: Nos seus termos mais gerais está dedicada ao que decidimos chamar por edifício
  de habitação híbrido. O termo pode soar estranho, composto por dois adjetivos dos
  quais o último - híbrido - deriva de outro campo disciplinar, a biologia e em particular
  da genética. Mais especificamente nos ocuparemos das diferenças e do fenômeno de
  surgimento e desenvolvimento na América Latina do edifício híbrido nos anos 1940,
  1950 e 1970. Entretanto, por trás do propósito de se entender um fenômeno e um tipo
  específico de edifícios, se propõe uma revisão de natureza historiográfica, na qual
  a inclusão “no jogo” de determinados projetos e obras construídos em importantes
  cidades da América Latina alteram um narrativa aparentemente consolidada. Portanto,
  põe-se em evidência como pontos de vista transversais apoiados em análises comparativas
  podem desvelar processos ocultos por perspectivas Norte-Sul, objetivo central dos
  processos de decolonização da história da arquitetura.
keyword: Edifício habitacional híbrido; Edifício de uso misto; América Latina
