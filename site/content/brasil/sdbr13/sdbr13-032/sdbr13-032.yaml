abstract: O município de Juazeiro do Norte, no Ceará, foi palco de um dos maiores
  movimentos religiosos do Brasil, tendo como principal protagonista o Padre Cícero
  Romão Batista. A grande visibilidade nacional que a cidade possuía, juntamente com
  a influência de políticos locais, permitiu a construção de edificações com filiações
  modernistas entre as décadas de 60 e 90, com o intuito de simbolizarem poder e progresso.
  Atualmente, a maior parte destes imóveis encontra-se sucateada, sem ter seu devido
  valor histórico e arquitetônico valorizados. Este artigo tem como objetivo o re/conhecimento
  e análise destas edificações, de forma a identificar a relevância dessas obras no
  repertório da produção da arquitetura brasileira; para tal, foi realizada uma pesquisa
  referencial bibliográfica associada a investigações de registros fotográficos antigos
  e periódicos da época, além de entrevistas com memorialistas locais e pesquisadores
  da produção arquitetônica moderna cearense. Com o estudo, percebeu-se que as edificações
  selecionadas são em sua maioria projetadas por arquitetos que tiveram uma produção
  significativa no Nordeste e marcam o processo de evolução da cidade de Juazeiro
  do Norte, entretanto há um descaso com a documentação das edificações de caráter
  histórico locais, o que pode contribuir para a destruição ou descaracterização destes
  imóveis. Assim, esta pesquisa apresenta-se como um importante passo para o registro
  destas obras, visto que até o presente momento não foram encontrados estudos em
  relação a presença da arquitetura moderna no município.
