abstract: Este trabalho visa relatar sobre o restauro realizado no Palácio da Justiça
  do Paraná a partir de um estudo de caso desenvolvido pelas no ano de 2017. O Palácio
  da Justiça foi restaurado entre os anos de 2014 e 2016, após já completados seus
  60 anos de construção. É considerado um exemplar importante de arquitetura modernista
  dentre o acervo da cidade de Curitiba, que tem um conjunto de procedimentos e técnicas
  capazes de prover conhecimento acerca do tema. Sabe-se que a discussão em torno
  das melhores soluções para intervenções em patrimônios edificados de concreto armado
  ainda é extensa e necessária, visto que muitas são as dúvidas relativas aos princípios
  do restauro quando aplicadas a edifícios construídos com técnicas e materiais tão
  próximos da atual conjuntura. O artigo aponta então os principais aspectos e soluções
  adotadas, especialmente aquelas voltadas para os revestimentos, por serem estes
  os materiais que mais se destacaram ao longo do processo de execução da obra.
