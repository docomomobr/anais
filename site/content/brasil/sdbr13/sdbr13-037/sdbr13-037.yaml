abstract: 'O século XX foi marcado pela consolidação do edifício em altura como tendência
  construtiva, e pelas pesquisas com materiais novos e tradicionais, porém aplicados
  de modos inovadores. Nesse contexto, destaca-se a mudança no modo de se construir
  com a rocha, até então adotada predominantemente na forma de blocos, passando a
  ser utilizada como placas esbeltas a integrar sistemas de revestimento em grandes
  superfícies de fachada. No caso brasileiro, destaca-se o papel fundamental da rocha
  na expressão formal dos Palácios de Brasília, onde o mármore branco configura elemento
  de destaque e de unidade no conjunto monumental. Não obstante, nota-se na bibliografia
  um enfoque na conservação do material rochoso de modo independente do sistema de
  revestimento, o que conduz a diagnósticos inconsistentes. Tornam-se prementes, assim,
  estudos sobre como conservar esses sistemas, somados à dificuldade imposta à inspeção
  e ao monitoramento quando instalados em edifícios altos. Nesse contexto, é proposto
  um método de análise como suporte à investigação do estado de conservação de sistemas
  de revestimento em mármore em edifícios altos do período moderno. De modo específico,
  é apresentada a etapa de levantamento físico por meio de VANT, fotogrametria e prospecções,
  com vistas a se delinear tendências para futuras intervenções no estudo de caso
  escolhido: o Congresso Nacional. Espera-se contribuir para o repertório de estudos
  acerca da conservação do patrimônio moderno e seus sistemas, particularmente no
  tocante às técnicas de inspeção e de monitoramento em edifícios em altura, com a
  possibilidade de transposição dos procedimentos a outros casos semelhantes.'
keyword: sistemas de revestimento em mármore; edifícios altos; estado de conservação;
