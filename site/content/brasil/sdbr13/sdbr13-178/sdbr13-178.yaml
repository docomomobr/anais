abstract: Este projeto propõe-se publicizar o conjunto de documentos referentes ao
  arquiteto Joaquim Guedes que compõe o acervo da Faculdade de Arquitetura e Urbanismo
  da Universidade de São Paulo. A organização deste Fundo promove a pesquisa sobre
  a arquitetura e o urbanismo moderno no Brasil, na medida em que disponibiliza para
  consulta pública uma documentação que registra uma trajetória significativa da arquitetura
  brasileira. Guedes, formado na terceira turma da FAUUSP (1954), contribuiu para
  a alteração do quadro profissional do arquiteto, foi "integrante de uma geração
  que compreendeu a necessidade da teoria para alcançar uma prática útil, (...) traçou
  seu caminho buscando fazer teoria na prática como forma de estudo permanente para
  ação" (CAMARGO, 2000). Além da extensa e premiada obra arquitetônica e urbanística,
  sua produção intelectual também teve relevância no cenário nacional e internacional
  ao longo da segunda metade do século XX.
