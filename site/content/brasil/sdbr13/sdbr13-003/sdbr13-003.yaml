abstract: O morar cearense recebeu uma contribuição inestimável com a passagem de
  um dos mais respeitados arquitetos modernistas brasileiros por Fortaleza entre as
  décadas de 1950 e 1960. Acácio Gil Borsoi soube utilizar e valorizar a tradição
  nordestina de fazer arquitetura, unindo os princípios da Escola Carioca para criar
  um conjunto de residências inovadoras para seu tempo. Infelizmente, esse patrimônio
  está ameaçado com os avanços do mercado imobiliário, visto que boa parte desse acervo
  estava inserido em bairros valorizados da cidade e que, consequentemente, foi demolida
  para a construção de novos empreendimentos. A residência em análise neste artigo
  é uma das poucas que ainda está preservada e atualmente não possui uma função estabelecida,
  apesar de já ter abrigado uma das famílias mais ricas da capital e a sede do grupo
  empresarial da mesma. Este trabalho busca destacar e analisar um exemplar significativo
  do modernismo arquitetônico em Fortaleza, bem como conscientizar a respeito da preservação
  de bens arquitetônicos modernos e da importância de se criarem novos usos a serem
  inseridos nesses espaços, de forma que a história e o valor arquitetônico existentes
  nessas obras permaneçam e sejam respeitados.
keyword: ​Acácio Gil Borsoi; Arquitetura Moderna; Fortaleza; Preservação; Memória
