abstract: 'Como se deu o projeto da praça modernista? Arquitetos modernistas eventualmente
  projetaram espaços livres e este trabalho trata de sondar quais as estratégias projetuais
  e os recursos formais e compositivos empregados nestes projetos. Para tanto, recorre
  a dois estudos de casos em cidades novas planejadas no norte paranaense: a praça
  Napoleão Moreira da Silva projetada por José Augusto Bellucci em Maringá (1957-1962)
  e a praça Santos Dumont idealizada por Ícaro de Castro Mello em Umuarama (1970).
  A partir da análise formal destes projetos e da sua contextualização na cultura
  técnica contemporânea, este trabalho reconhece que os arquitetos aplicaram princípios
  formais da arquitetura no projeto das praças, de modo que a primeira praça analisada
  revela preceitos da composição purista caros à arquitetura da ‘escola carioca’,
  enquanto que a segunda pode ser associa à inflexão percebida na arquitetura brasileira
  pós-Brasília e a recursos formais da escola paulista. Para esta análise foram considerados
  a configuração formal de passeios e canteiros, a vegetação e o mobiliário, e foram
  apreciados desenhos originais e inéditos e registros fotográficos históricos.'
