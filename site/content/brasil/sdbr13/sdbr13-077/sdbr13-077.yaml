abstract: A construção de Brasília suscitou um redimensionamento de fluxos que pôs
  a região Centro-Oeste em um novo patamar social e econômico, com o aumento da infraestrutura
  e industrialização na área. Além disso, mesmo que em menor escala, houve um incremento
  na atividade turística, com setores da cidade específicos à implementação de hotéis.
  Porém, antes mesmo da consolidação da cidade, surgiu o Brasília Palace Hotel (1958),
  de Oscar Niemeyer (1907-2012). Seu caráter pioneiro o consolidou como um marco na
  capital, abrigando importantes acontecimentos até 1978, quando um incêndio provocou
  sua desativação. Após anos de abandono, um projeto de reabilitação recolocou o hotel
  em uma posição de destaque na cidade, onde o mesmo permanece até os dias atuais.
  Neste âmbito, o objetivo do artigo é analisar como as transformações nas práticas
  sociais do turismo condicionaram os processos de construção, destruição e reconstrução
  do hotel, estabelecendo paralelos entre o projeto original e as intervenções contemporâneas.
  A relevância do trabalho se justifica pela necessidade de se discutir a relação
  entre o turismo e a arquitetura moderna, resgatando o legado de importantes hotéis
  na modernização do Brasil, questionando aspectos ligados à sua documentação e conservação
  na contemporaneidade. Para tanto, o artigo esboça inicialmente uma reflexão sobre
  o contexto histórico e social (econômico, político e cultural) à época da construção
  do hotel; na sequência, discute seu processo de apogeu e declínio, para finalmente
  produzir uma análise crítica das intervenções realizadas, utilizando como parâmetros
  as questões relativas ao lugar, ao programa, à construção e à forma.
keyword: Arquitetura Moderna; Brasília; Turismo; Brasília Palace Hotel
