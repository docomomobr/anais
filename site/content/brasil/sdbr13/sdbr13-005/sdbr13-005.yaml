abstract: O objeto de estudo do presente artigo trata de analisar uma obra moderna
  projetada e construída no campus sede da Universidade Federal de Campina Grande
  – PB, durante os anos 70. Trata-se do edifício do bloco administrativo CM, que comporta
  atividades administrativas de graduação e pós- graduação, bem como, laboratórios
  e salas de estudos; integradas ao Centro de Ciências e Tecnologias – CCT, do campus.
  Projetado em 1977 pelo arquiteto recifense Tertuliano Dionísio da Silva (1931, 1983),
  que possuiu um importante papel na difusão da arquitetura moderna no Nordeste e
  na cidade de Campina Grande, a obra adota critérios projetuais da modernidade arquitetônica.
  Justifica-se trazer à tona nesse evento tal obra, pois se observou que a mesma vem
  passando por graves problemas de descaracterizações, perdendo elementos importantes
  de sua composição arquitetônica, uma vez que não é protegida por leis de preservação.
  Como metodologia de investigação, se baseia em uma linha de investigação proposta
  por Afonso (2019) que dialoga com autores clássicos na área da pesquisa arquitetônica,
  onde é proposto como procedimento de análise o trabalho considerando seis dimensões
  da arquitetura, procurando investigar sobre o objeto arquitetônico e sua relação
  com os distintos condicionantes que a originaram. O aporte teórico é fundamentado
  em autores como Bruand (2010) e Segawa (1997) que tratam sobre a produção moderna
  no cenário nacional e o aporte regional é respaldado nos trabalhos elaborados por
  Afonso (2006), Carvalho e Freire (2010), Queiroz e Rocha (2006) e demais pesquisadores
  locais que vem investigando sobre a importância da arquitetura moderna nordestina.
keyword: arquitetura moderna; patrimônio edificado; conservação
