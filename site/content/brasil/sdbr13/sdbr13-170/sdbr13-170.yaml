abstract: 'Este trabalho descreve a intervenção das fachadas do Palácio Governador
  João Alves Filho em Aracaju, sede atual da Assembleia Legislativa de Sergipe (ALESE).
  O edifício era considerado uma das grandes expressões do Movimento Moderno, e mesmo
  sua linguagem Brutalista assegurava um diálogo respeitoso com a Praça Fausto Cardoso
  e com as edificações preexistentes. O artigo também aborda a temática sobre as intervenções
  em preexistência, onde as “novas arquiteturas e /ou fachadismos” aniquilam a estratificação
  histórica inclusive, ao adotar o conceito de “repaginação”. As justificativas para
  as ações projetuais no prédio da ALESE, não considerou o discernimento crítico para
  julgar a potencialidade do edifício e a possibilidade de restauração da Arquitetura
  Moderna, assunto debatido por diversos teóricos. A substituição dos cobogós da fachada
  por pele de vidro, afetou sua integridade material, sua autenticidade, destruiu
  o edifício da década de 80, bem como fragmentou a unidade paisagística existente.
  Logo, o compromisso do arquiteto em entender: a arquitetura de qualquer tipo e época,
  as características físicas, a lógica da arquitetura modernista, seus valores figurativos,
  a leitura da paisagem arquitetônica, ter uma visão histórica e não atuar com arbitrariedade,
  seriam indispensáveis para garantir a pertinência da proposta executada. Por conseguinte,
  a compreensão científica, técnica e teórica proporcionaria uma discussão multidisciplinar
  para uma proposta de intervenção coerente e sobretudo que valorizasse os valores
  estéticos e históricos do edifício. A discussão aqui apresentada não será sobre
  a arquitetura moderna, mas como intervir na preexistência e na imagem consolidada
  dessa preexistência.'
