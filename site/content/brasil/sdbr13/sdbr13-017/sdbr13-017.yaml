abstract: A vida do edifício do Museu de Arte de Brasília pode ser considerada uma
  das mais antigas e conturbadas da história da Capital. Construído em meio aos preparativos
  da inauguração da cidade para servir como restaurante do Anexo do Brasília Palace
  Hotel, o edifício foi rapidamente subutilizado, passando a abrigar outros diversos
  usos, tais como boate, clube e casa de shows, até que foi convertido na primeira
  sede do acervo de arte do Governo do Distrito Federal. A criação do MAB, em 1985,
  representou uma grande conquista para a cidade que, aos seus mais de vinte anos
  após a fundação, ainda não contava com uma própria instituição museal. Quem diria,
  porém, que seria a arquitetura um dos principais desafios para o funcionamento do
  museu. Suas três décadas de existência foram marcadas por inúmeros impasses funcionais
  e políticos, fazendo do edifício o objeto de variados projetos de reforma e de sucessivos
  adiamentos em suas execuções. Fechado há mais de dez anos, o prédio finalmente passa
  por obras de readequação de suas instalações. De ruína abandonada, o MAB talvez
  se reapresente, em breve, como um museu renovado. Mas o que se sabe sobre ele? O
  presente artigo se propõe a divulgar parte dos primeiros insumos de uma intrigante
  pesquisa de resgate historiográfico, ainda em andamento. Serão apresentados alguns
  dos principais episódios e projetos que marcaram a história do edifício, acervo
  e instituição, desde o início da construção de Brasília até as proposições da mais
  recente reforma.
