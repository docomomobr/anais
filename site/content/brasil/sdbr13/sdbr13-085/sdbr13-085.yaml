abstract: O artigo retoma exploratoriamente argumentos de recente tese de doutorado
  sobre o arquiteto Holanda Mendonça apresentada no PROPAR/ UFRGS. Graduado na FNA
  do Rio de Janeiro em 1946, seu deslocamento imediato ao sul sugere aplicação direta
  dos pressupostos da Arquitetura Moderna Brasileira da Escola Carioca. O objeto é
  o estudo de sua obra no Rio Grande do Sul, desde 1948 até morte prematura em 1956,
  e sua contribuição na introdução e difusão da Arquitetura Moderna em Porto Alegre
  e no RS. No início dos anos 50, vinculado a forte construtora local e em escritório
  próprio, produz obras de grande visibilidade, referências no imaginário moderno
  portoalegrense como os edifícios Formac, Consórcio e Santa Cruz, este ainda o mais
  alto da capital. O estudo delimita-se a partir de uma amostragem arquitetônica de
  sua obra, inventariada segundo suas características bidimensionais, volumétricas
  e espaciais, e por seus elementos arquitetônicos, quantitativa e qualitativamente.
  A metodologia contempla pesquisa historiográfica e analítica a partir de relações
  com o contexto teórico, que abrange os ambientes acadêmicos da FNA e da FAU do IBA
  de Porto Alegre, bem como panoramas das arquiteturas produzidas nos dois locais,
  o que permite a configuração de um quadro compreensivo da atividade projetual de
  Holanda Mendonça. A estratégia metodológica, a partir da definição e aplicação de
  quatro categorias de análise- inserção urbana, percursos, estrutura formal e matriz
  de análise-, alia-se à intenção de estabelecer analogias com referenciais da escola
  carioca e que são foco fundamental do trabalho.
