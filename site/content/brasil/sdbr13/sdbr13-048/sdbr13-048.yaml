abstract: O projeto de restauração das Casas Modernistas do Recife, projetadas pelo
  arquiteto modernista Augusto Reynaldo, evidencia as estratégias para o restauro
  ripristino dos imóveis conforme as diretrizes da DPPC/PCR. No projeto, autores procuram
  a conciliação entre as tendências das teorias do restauro na preservação do patrimônio
  arquitetônico moderno e contemporâneo, as legislações de proteção ao patrimônio
  e os interesses particulares dos proprietários dos imóveis especiais. O objetivo
  foi o resgate das Casas Modernistas em razão dos danos a que foram submetidas em
  um curto espaço de tempo. Apresentam-se os procedimentos do mapeamento de danos,
  das técnicas e materiais construtivos e da identificação da hierarquia dos espaços.
  Quanto aos usos, as ações deste projeto se restringiram a apresentação de possibilidades
  de novos usos com a preservação dos espaços, materiais e técnicas, portanto outros
  desafios de ordem técnica se apresentarão para o atendimento de um programa contemporâneo.
  Seja como for, a pretensão é fazer o restauro dessas casas um projeto aberto para
  discussão das medidas de intervenção adotadas e de um canteiro de experimentos para
  as condutas de boas práticas.
