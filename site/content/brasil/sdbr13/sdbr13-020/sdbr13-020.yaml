abstract: O projeto do Conjunto Habitacional Mirante da Taquara, desenvolvido por
  equipe liderada pelo arquiteto Sérgio Ferraz Magalhães e vencedor de concurso em
  1978, representa um destaque entre os exemplares financiados pelo Banco Nacional
  de Habitação pela sua qualidade arquitetônica. O projeto foi premiado em 1986 pelo
  Instituto de Arquitetos do Brasil e citado como exemplar de arquitetura moderna
  em bibliografia específica. Executado com alterações solicitadas por diversas demandas,
  a obra manteve os princípios fundamentais que garantiam sua qualidade arquitetônica.
  Ao longo dos anos, em decorrência da falta de manutenção, os blocos habitacionais
  do conjunto, também conhecido como Cafundá, sofreram desgaste pelo uso e alterações
  improvisadas. O conjunto passou por uma reforma iniciada em 2001, que descaracterizou
  fortemente sua arquitetura. O trabalho pretende contribuir para o reconhecimento
  do Cafundá de acordo com seu projeto original, acreditando na validade da retomada
  de sua proposta arquitetônica, uma vez que o conjunto, tal como se encontra atualmente,
  não mais corresponde ao que foi proposto pela equipe liderada por Sérgio Magalhães.
  Como uma oportunidade perdida, considera-se deformação de uma obra arquitetônica
  que, em seu projeto original, retratava os primórdios da retomada do debate arquitetônico
  no Brasil, trazendo à tona discussões internacionais de revisão do movimento moderno
  com a assimilação de paradigmas urbanísticos dos anos 80.
