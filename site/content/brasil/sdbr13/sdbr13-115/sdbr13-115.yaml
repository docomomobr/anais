abstract: 'O debate que almejamos abrir ao tratar do Edifício Niemeyer, enquanto grande
  expressão do Movimento Moderno, em sua relação com a preexistência historicista
  da Praça da Liberdade, se fundamenta na temática que aborda e discute as interações
  entre novas arquiteturas e preexistências consolidadas a partir da avaliação da
  qualidade dos projetos e suas concretizações – como quesito essencial quando se
  busca interfaces entre a arquitetura e o patrimônio edificado e urbano. Geralmente
  são várias as modalidades de ações projetuais possíveis em cada situação específica,
  cabendo ao arquiteto ter o discernimento crítico para julgar a potencialidade dos
  conjuntos arquitetônicos e urbanos para que sua proposta de intervenção não iniba,
  fragmente ou destrua a unidade paisagística existente, apreendida através da imagem
  emanada pelos objetos afetados. Logo, o conhecimento teórico-crítico e técnico da
  área da salvaguarda do patrimônio material – e mais, especificamente, o arquitetônico
  e o ambiente citadino – é muito importante, mas não basta para garantir a pertinência
  da proposta. A sensibilidade do arquiteto e a sua capacidade de compreensão e apreensão
  das características e dos valores essenciais do lugar são frequentemente mais relevantes
  para alcançar coerência na elaboração do projeto e para contribuir para a qualificação
  do cenário preexistente – seja, preservando-o, alterando- o sutilmente ao criar
  novos focos de atenção, ou promovendo uma redefinição da realidade figurativa capturada
  previamente. Mesmo arquitetos que não são versados no debate teórico-crítico da
  arquitetura e do urbanismo, que não possuem qualquer intimidade com o conhecimento
  da história da arquitetura e da cidade, podem produzir obras que, coerentemente,
  emergem em tecidos urbanos histórico-culturais delicados e consolidados, ação contraída
  através da capacidade ímpar em saber ler a paisagem circundante: em nosso juízo,
  é o caso de Niemeyer e seu projeto para o prédio de apartamentos construído na Praça
  da Liberdade em Belo Horizonte.'
keyword: Praça da Liberdade; Edifício Niemeyer; Oscar Niemeyer; Arquitetura Moderna;
