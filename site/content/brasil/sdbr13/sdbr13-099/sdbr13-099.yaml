abstract: 'A década de 1950 inicia um período determinante para o crescimento urbano
  da cidade de Porto Alegre - RS, no qual o desenvolvimento econômico e o crescimento
  populacional viabilizaram o surgimento de um mercado imobiliário consistente e uma
  relevante produção moderna em arquitetura. O presente trabalho tem como objetivo
  principal a investigação tipológica do edifício de apartamentos em Porto Alegre,
  considerando a produção moderna do período referencial da década de 1950, que também
  se delimita pela vigência de regramento urbano por critérios morfológicos, baseado
  em preceitos da cidade tradicional/figurativa. O estudo se baseia na análise crítico-
  comparativa dos edifícios, examinando também os acontecimentos que transformaram
  os modos de morar através da habitação multifamiliar moderna. Os casos estudados,
  selecionados a partir da consulta à bibliografia de referência, foram pesquisados
  em arquivos e visitas de campo, para produção de desenhos e modelos tridimensionais.
  Além de registro da produção arquitetônica, o material base também foi utilizado
  para o desenvolvimento de esquemas, gráficos e diagramas que auxiliaram na avaliação
  dos seguintes critérios estabelecidos: organização volumétrica, relação exterior/interior,
  sistemas de circulação, setorização e grau de profundidade. Os resultados demonstram
  como, nestes exemplares, arquitetura moderna que transformou as maneiras de ocupar
  os ambientes internos e propiciou novas abordagens conceituais e formais arquitetônicas,
  manteve, ao mesmo tempo, intensa relação com a meio urbano.'
