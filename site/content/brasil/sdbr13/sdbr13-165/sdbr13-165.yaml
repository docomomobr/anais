abstract: O presente artigo analisa o Projeto Morada Nova, uma experiência regional
  de planejamento físico-territorial e arquitetura rural no estado do Ceará, construído
  entre 1972 e 1975. O projeto foi elaborado por arquitetos funcionários do Departamento
  Nacional de Obras a Contra as Secas (DNOCS), premiado na 1 Exposição Nacional de
  Arquitetura do IX Congresso Brasileiro de Arquitetos, em São Paulo, no ano de 1976.
  A proposta é apresentada em quadro sócio-histórico mais amplo, destacando seu caráter
  inovador em muitos de seus princípios. A análise considera as mais diferentes escalas
  de projeto, abrangendo desde o estudo da área de implantação de comunidades rurais
  ao detalhamento das tipologias residenciais. Ênfase especial é conferida ao compromisso
  com as características ambientais e com as possibilidades culturais, técnicas e
  materiais da região. São discutidos o projeto de arquitetura de duas edificações
  emblemáticas, a escola e o clube, destacando o domínio de princípios caros ao modernismo
  arquitetônico conjugado à intenção de criar uma linguagem nova e econômica, considerando
  o emprego do saber construtivo autóctone. Destaca-se a importância do projeto no
  âmbito das novas fronteiras que à época se abriam no campo de atuação dos arquitetos
  e urbanistas, nomeadamente o planejamento rural, concebidos segundo o ideário modernizante.
  Ressalta-se, por fim, a relevância de ampliação da historiografia sobre o tema.
keyword: Projeto de irrigação de Morada Nova; planejamento rural; arquitetura e cultura
