abstract: 'O artigo parte da comparação entre a Sede do Ministério da Educação e Saúde
  – MES e a da Associação Brasileira de Imprensa – ABI, apresentada no livro “Brazil
  Builds: Architecture New and Old 1652-1942” de Philip Goodwin (1943) e reforçada
  em “Arquitetura Moderna no Brasil” de Henrique Mindlin (1956). Localizados no Rio
  de Janeiro, na esplanada resultante do desmonte do Morro do Castelo, são exemplares
  da década de 1930. Apesar do repertório modernista estar presente nos dois edifícios,
  eles são diferenciados devido ao aspecto de “leveza” do MES e “robustez” da ABI.
  Dois lados de um mesmo exercício projetual, estes edifícios demonstram a possibilidade
  de realizar o ideal do Movimento Moderno e, por outro lado, a possibilidade real
  de o concretizar. A crítica à rua corredor foi parte do Movimento Moderno, e representa
  o posicionamento contrário à permanência de estruturas urbanas tradicionais para
  receber a nova arquitetura. A ela foi também atribuída as condições consideradas
  insalubres que resultam em edificações confinadas e com má orientação solar. Entretanto,
  a visão negativa dos edifícios em rua corredor é relativizada ao se referir à determinados
  projetos e edifícios na bibliografia do Movimento Moderno brasileiro. Tendo o caso
  da Sede do MES e da ABI como pano de fundo, são apresentadas e analisadas as condições
  que tornam a diferenciação entre ambos um demonstrativo da própria diversidade da
  arquitetura moderna no período.'
