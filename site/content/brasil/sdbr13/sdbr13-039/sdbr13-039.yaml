abstract: Não restam dúvidas que o brasileiro Roberto Burle Marx é não só absoluto
  protagonista acerca da reflexão sobre o paisagismo no Brasil, mas também um dos
  mais influentes paisagistas do século XX no mundo. Recebeu várias exposições no
  exterior, assim como diversos prêmios pelo conjunto de sua obra, dentre eles o prêmio
  pelo American Institute of Architects (AIA) de Washington (EUA) em 1965, e o título
  de “real criador do jardim moderno”. Este artigo tem como objetivo discutir de que
  forma as narrativas acerca da obra do paisagista vem sendo construídas no Brasil
  e no mundo, apontando para algumas problemáticas e sugerindo algumas chaves de leitura
  possíveis.
keyword: Burle Marx; paisagismo; arquitetura moderna
