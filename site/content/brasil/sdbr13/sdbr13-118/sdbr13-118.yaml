abstract: Ariel Valmaggia é um engenheiro estrutural uruguaio que fez parte como responsável
  técnico da construção de importantes projetos empregando a técnica da cerâmica armada
  no nordeste brasileiro. Valmaggia, que foi aprendiz de Eladio Dieste - o engenheiro
  uruguaio considerado um dos pais da cerâmica armada - chegou em Recife em 1982,
  a convite de arquiteto Paulo Henrique Coelho, que tinha interesse em promover a
  técnica. Durante o período de atividade em Pernambuco, ele contribuiu como consultor
  e responsável técnico em diversos projetos de autoria de arquitetos como Acácio
  Gil Borsoi, Jerônimo & Pontual, Escritório Arquitetura 4, Hélvio Polito, Roberto
  Montezuma, entre outros. Nesses projetos é importante apontar o protagonismo do
  sistema estrutural como elemento definidor da forma do conjunto, e como esse sistema
  alicerça uma clara atitude tecnoestática relacionada ao processo de concepção. Sendo
  assim, esse artigo procura contextualizar e examinar tanto a produção quanto o percurso
  de Valmaggia em Pernambuco, e para tal, recorreu-se a entrevistas a pessoas relacionadas,
  levantamentos em arquivos públicos, bem como entrevista ao próprio Ariel Valmaggia.
keyword: Ariel Valmagia; Eladio Dieste; Pernambuco; cerâmica armada
