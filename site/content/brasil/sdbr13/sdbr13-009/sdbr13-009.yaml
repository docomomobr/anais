abstract: 'Na década de 1970, os arquitetos e urbanistas que se reuniam no Estado
  de São Paulo no Instituto de Arquitetos do Brasil (IAB/SP), passaram a ter outros
  dois espaços de debate. Em 1971, foi criado o Sindicato de Arquitetos do Estado
  de São Paulo (SASP) e, em 1973, a Associação Brasileira de Escolas de Arquitetura
  (ABEA). Objetiva-se com esse artigo levantar a movimentação dos arquitetos paulistas
  em meio às três instituições nos dez primeiros anos do funcionamento do SASP e da
  ABEA (1971 – 1981), elencando os debates nos quais participaram quanto à consolidação
  do Sindicato, ao aumento do número das escolas de arquitetura, às mudanças na profissão
  e aos eventos promovidos pelas Instituições. Por meio do mapeamento do movimento
  dos arquitetos, baseado na Teoria Ator-Rede, identificou-se os nomes de oito profissionais
  presentes simultaneamente nas diretorias de mais de uma entidade. Foram eles: Pedro
  Paulo de Melo Saraiva, Marlene Yurgel, Jon Maitrejean, Alfredo Paesani, Geraldo
  Puntoni, Maria Cecília Closs Scharlach, William Munford e José Carlos Ribeiro de
  Almeida. Diante das atividades dos arquitetos, discussões e eventos dos quais participaram,
  foi possível elencar as controvérsias e debates do período, identificando as relações
  de proximidade e distanciamento entre as instituições e as mudanças no campo profissional
  do arquiteto.'
keyword: IAB/SP; SASP; ABEA; arquiteto e urbanista
