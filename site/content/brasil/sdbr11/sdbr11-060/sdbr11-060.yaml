abstract: O objetivo deste artigo é identificar como a arquiteta e designer italiana
  Lina Bo Bardi evidenciou o pensamento moderno em seus escritos, como resultado da
  articulação entre o seu psicológico e o contexto social em que se encontrava, no
  primeiro período de sua atuação profissional, ainda na Itália. Segundo Harvey (1992),
  na chegada do século XX e início da Primeira Guerra Mundial, o “eterno e imutável”,
  característico das correntes do pensamento feudal e reacionário, não poderia mais
  ser o propósito da arte, e os artistas deveriam exercer um papel criativo na definição
  da nova essência da humanidade, atribuindo um novo impulso ao modernismo cultural.
  Para apreender o lugar ocupado por Lina Bo Bardi neste contexto, foi realizada uma
  análise interpretativa de artigos escritos por ela, como autora ou coautora, para
  revistas italianas, entre 1940 e 1946. A análise de 11 artigos da revista Domus
  e 72 da revista Grazia revela um forte posicionamento da arquiteta com relação às
  suas convicções modernas, características do meio no qual estava inserida e de suas
  escolhas políticas e filosóficas, que a acompanharam por toda a sua carreira.
