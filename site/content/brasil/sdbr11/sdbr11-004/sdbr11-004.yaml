abstract: Sinônimo de transformação e progresso, Brasília foi palco de diferentes
  abordagens. Desde a pedra fundamental até sua inauguração, a nova capital brasileira
  foi o reduto de profissionais que almejavam disseminar ao país a esperança desenvolvimentista.
  E ao mundo, a emergente arquitetura moderna brasileira. Empenhados na difusão de
  tais acontecimentos, jornalistas e fotógrafos foram os atores fundamentais para
  a constituição desta historiografia. Assim, este artigo tem a intenção de evidenciar
  o trabalho de Geraldo Vieira - brasileiro e mineiro - fotógrafo anônimo em um prisma
  nacional, mas que foi de fundamental importância para a documentação da história
  da cidade de Araguari -MG e pôde retratar através de belos ângulos o emergir de
  Brasília.
