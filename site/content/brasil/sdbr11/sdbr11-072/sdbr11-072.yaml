abstract: Este trabalho explora as relações entre os projetos gráficos das revistas
  Summa (Buenos Aires, 1963-1992) e Módulo (Rio de Janeiro, 1955-1989) e a Escola
  de Design de Ulm, na Alemanha. O estudo do design gráfico destas duas revistas permite
  um olhar alternativo sobre o surgimento e amadurecimento da disciplina na América
  Latina, uma vez que ambas as publicações foram criadas em períodos chave do desenvolvimento
  e formalização da profissão de designer sob influência direta dos protagonistas
  deste movimento que estiveram, direta ou indiretamente, ligados à Escola de Max
  Bill e Otl Aicher.
