abstract: Este trabalho analisa o aparecimento, a consolidação e a preservação de
  um sistema de galerias modernas implantadas no térreo de edifícios modernos na cidade
  de São Paulo. Inicia a discussão a partir do levantamento histórico das transformações
  urbanas da área em estudo e do estímulo que foi dado em determinado período para
  a construção das mesmas. Analisa ainda a preservação das construções, seus programas
  e usos recentes e a relação que as mesmas estabelecem hoje com seu contexto urbano.
