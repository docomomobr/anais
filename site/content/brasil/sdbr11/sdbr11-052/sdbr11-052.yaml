abstract: O presente texto pretende debater a questão autoral da arquitetura moderna
  a partir de um projeto específico realizado na década de 1960 em São Paulo, o Parque
  Anhembi, um centro de exposições destinado ao setor das feiras de negócios projetado
  pelo escritório Jorge Wilheim Arquitetos Associados. De 1963 à 1972 o esforço do
  profissional arquiteto urbanista Jorge Wilhem foi o de gerenciar uma equipe especializada
  que pudesse estabelecer a importância da escala urbana do projeto e criar uma estratégia
  que pudesse estimular soluções que visualizassem um futuro da prática profissional
  baseado no binômio planejamento-industrialização. O grupo formado pelos arquitetos
  Jorge Wilheim (1028-2014), Miguel Juliano (1928- 2009), Massimo Fiocchi (?); pelo
  matemático anglo-canadense Cedric Marsh (1924-2013) e pelos engenheiros Jairo Lisboa
  (1924) e Mario Franco (1929), dentre outros tantos colaboradores, trabalharam nesta
  grande empreitada. Alguns projetos foram importantes para o entendimento desse trabalho
  coletivo, como o projeto paisagístico elaborado por Roberto Burle Marx e os projetos
  direcionados ao design, como, o projeto de sinalização e mobiliário urbano realizado
  pelo escritório de Ludovico Martino (1933) e João Carlos Cauduro (1935), o projeto
  de iluminação desenvolvido por Livio Levi (1933-1973), a adoção de alguns móveis
  seriados projetados por Sergio Rodrigues (1927-2014) e até mesmo a proposta de Décio
  Pignatari (1927-2012) na criação do nome do complexo. A análise aqui pretendida
  debruça-se prioritariamente sobre o projeto paisagístico e o projeto de sinalização
  e mobiliário urbano.
