abstract: No início dos anos 1960, o Nordeste brasileiro passava por intensas transformações
  nos campos da economia, política e cultura. Dois personagens apresentam grande importância
  neste cenário de mudanças, são eles a arquiteta ítalo-brasileira Lina Bo Bardi e
  o economista Celso Furtado. Furtado atuou como superintendente da SUDENE, cujos
  objetivos eram melhorar a qualidade de vida da população, aumentar a renda e industrializar
  o Nordeste. A arquiteta atuou no campo cultural restaurando o conjunto arquitetônico
  do Solar do Unhão, dirigindo o Museu de Arte Moderna da Bahia e propondo uma Escola
  de Desenho Industrial e Artesanato, que funcionaria no museu. O projeto da Escola
  foi interrompido pelo golpe militar de 1964, mas o seu projeto mostra que esta seria
  o fruto do pensamento político-econômico de Lina e Furtado para o desenvolvimento
  industrial do Nordeste na época.
