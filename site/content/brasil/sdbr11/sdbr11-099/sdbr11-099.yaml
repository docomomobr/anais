abstract: 'O objetivo deste artigo é analisar aspectos historiográficos e morfológicos
  do Plano Piloto de Brasília como partitura urbana, partindo da identificação de
  elementos de composição e preservação. Metodologicamente, parte-se de um breve panorama
  sobre o modernismo brasileiro e a constituição do campo do patrimônio cultural.
  Numa perspectiva interdisciplinar, destacam-se os aspectos historiográficos das
  manifestações artísticas do movimento moderno brasileiro nos campos da música, arquitetura
  e urbanismo. Por fim, contextualiza-se o processo de reconhecimento de Brasília
  como patrimônio para explicar a noção de escalas. Quanto à bibliografia, destacam-se
  os discursos sobre o ideário estético e o valor nacional como política de Estado,
  conforme abordados por CHUVA (2009), FONSECA (2005), CAVALCANTI (2001; 2006) e PESSÔA
  (1999; 2006). Especificamente sobre o modernismo musical, de Villa-Lobos à Bossa
  Nova, trabalha-se com TRAVASSOS (2002), TONI (2002), CARPEAUX (2009), SANDRONI (1999)
  e CHEDIAK (1990), as análises de ANDRADE (1972; 2015), WISNIK (1977; 2004), NESTROVSKI
  (2000) e a Missão de Pesquisas Folclóricas (SESC-SP, 2006). Para pesquisar Brasília
  como patrimônio: CAMPOFIORITO (1990), PERALVA (1988), os textos de COSTA reunidos
  por LEITÃO (2009), as legislações patrimoniais e as questões sobre historiografia
  e preservação urbana ventiladas por SANT''ANNA (1995), TAVARES (2014) e FERREIRA;
  GOROVITZ (2007).'
