abstract: Este artigo é essencialmente um exercício de memória e resistência, com
  inegável sentido de relato quase jornalístico. Pela memória, presta-se a registrar
  o passo a passo das discussões e querelas que se formaram em torno dos intentos
  de demolição do Hotel Internacional Reis Magos (HIRM), retaliado no último meses
  de 2013. Pela resistência, serve como mapeamento de entre e saídas, dos limites
  e possibilidades de debate sobre as questões arquitetônicas urbanísticas e, em especial,
  dos patrimônios quando assumem a esfera pública, como tão acrônico no Brasil. Como
  pano de questões de fundo, luma-se com a dificuldade de compreensão do acervo da
  arquitetura moderna como patrimônio, cuja possibilidade de restauração, preservação
  e reutilização nem sempre é reconhecida. É caso enfatizar, mas a dificuldade se
  traz, mesmo entre os colegas arquitetos e urbanistas, engenheiros ou do campo das
  artes em geral. Parece que a questão do patrimônio, a despeito de inúmeros avanços
  nas experiências projetuais e do acúmulo de discussões e formulações teóricas e
  conceituais, não consegue escapar, ao menos na esfera pública, da ideia do tombamento.
  É possível construir um novo campo discursivo em prol de uma noção de tombamento
  que possibilite abarcar intervenções contemporâneas?
keyword: Hotel Internacional Reis Magos; Tombamento; Reuso; Preservação; Debate
