abstract: 'Neste artigo analisamos possibilidades anunciadas pela delimitação do conceito
  de patrimônio arquitetônico universitário moderno como campo de ampliação necessário
  à identificação de ações de conservação integrada. Práticas sócio-espaciais associadas
  à vivência cotidiana de frequentadores da Cidade Universitária contribuem para fazer
  desta um território cultural moderno. O cotejamento entre contribuições de autores
  do campo do patrimônio subsidia tanto sua configuração teórico-metodológica como
  sua conservação integrada. Esta análise permite considerar que a inclusão das edificações
  fundadoras da Cidade Universitária, que se queria moderna, acrescenta novos desafios
  aos aspectos já bastante complexos de gestão da preservação deste patrimônio. Dentre
  eles estão: aspectos técnicos relacionados aos métodos construtivos da arquitetura
  moderna e à mecânica do solo de uma ilha constituída por aterros; aspectos funcionais,
  como grandiosidade dos programas; aspectos culturais pertinentes à conservação e
  manutenção destas edificações. Enfatizaremos a análise no caso da FAU cujas demandas
  extrapolam as da unidade para a qual foi construída, fazendo com que suas transformações
  de uso e ocupação não sejam acompanhadas por uma manutenção dos seus espaços dentro
  de uma cultura de falta de conservação. A metodologia utilizada para propor e verificar
  as possibilidades anunciadas busca articular a revisão bibliográfica ao levantamento
  fotográfico do seu estado de conservação.'
