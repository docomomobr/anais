abstract: 'Este estudo compõe a pesquisa em andamento desenvolvida pelo Laboratório
  da Paisagem e do Ambiente do Curso de Arquitetura e Urbanismo da Universidade Estadual
  do Maranhão – UEMA, intitulada “Estudos para o projeto de restauração dos Jardins
  do Palácio dos Leões: Uma Obra de Roberto Burle Marx”. O objetivo da pesquisa é
  de encaminhar os resultados para que o Governo do Maranhão aprecie e assuma o compromisso
  de restaurar os jardins da sua sede governamental, tal qual o projeto de Roberto
  Burle Marx. Apesar de Burle Marx ser um dos principais nomes do paisagismo brasileiro
  e internacional, o seu projeto para o jardim do Palácio dos Leões é quase desconhecido
  pela grande maioria da população, apesar do prédio ser um dos mais importantes pontos
  no cenário artístico, histórico e cultural do estado e muito frequentado por turistas.
  Aqui apresentam-se os resultados preliminares colhidos na pesquisa bibliográfica
  e de campo, com o levantamento e identificação das espécies vegetais, objetos e
  elementos artísticos e decorativos aplicados no jardim ainda existente, mas descaracterizado.
  A intervenção de Burle Marx datada de 1968 e 1973 sofreu uma grande reforma em 1993
  que modificou em muitos aspectos a composição elaborada pelo paisagista. Apesar
  disso os traços persistiram.'
keyword: Palácio dos Leões; Roberto Burle Marx; Jardins históricos
