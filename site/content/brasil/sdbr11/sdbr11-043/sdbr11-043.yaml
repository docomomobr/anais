abstract: Sergio Bernardes foi um dos arquitetos mais importantes da segunda geração
  de modernistas brasileiros. Com o objetivo de explorar sua metodologia de trabalho,
  referências e influências, elegemos o Pavilhão da Companhia Siderúrgica Nacional
  ‐ CSN ‐ como objeto desta pesquisa. Para celebrar o aniversário da cidade de São
  Paulo, a CSN construiu um pavilhão no Parque Ibirapuera. O êxito que o arquiteto
  obteve na Casa Lota lhe abriu as portas a este encargo. Nesse projeto houve um especial
  interesse nas uniões da estrutura, feitas de chapa e soldadas em uma das peças,
  possibilitando seu ligamento com a outra peça estrutural por meio de parafusos e
  porcas. Tudo pensado para mostrar a qualidade técnica do aço que possibilitava a
  desmontagem e montagem do edifício. Bernardes aproveitou a chuva para causar outras
  sensações. As cascatas, introduziram o ruído percebido pela audição, o olor pelo
  olfato e a umidade pelo tato. O projeto se caracterizou pelo ato topológico de cruzar
  o riacho e se desenvolveu buscando a melhora de sua funcionalidade. A técnica ganhou
  espaço no conjunto de forças que influem na forma da arquitetura. O Pavilhão da
  CSN é a primeira das estruturas singulares de Sergio Bernardes e se perpetua como
  uma referência na arquitetura moderna brasileira.
keyword: Sérgio Bernardes; Casa Lota; Pavilhão CSN; Movimento moderno
