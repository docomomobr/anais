abstract: Em 2013, um jornal local publicou matéria sobre a possível demolição do
  Hotel Internacional Reis Magos, em Natal/RN, desencadeando uma série de ações em
  prol da sua preservação. A edificação configura-se como um importante exemplar da
  arquitetura moderna brasileira, um marco para o desenvolvimento do turismo potiguar
  e para o processo de estruturação urbana da orla de Natal. Dentre essas ações, destaca-se
  o pedido de tombamento do Hotel feito pelo Instituto dos Amigos do Patrimônio Histórico
  e Artístico-Cultural e da Cidadania ao Iphan. Diante dessa solicitação, foram iniciados
  os respectivos estudos em parceria com o Departamento de Arquitetura da UFRN. Frente
  a isso, este artigo aborda as contribuições da pesquisa histórica para a preservação
  desse patrimônio edificado, uma vez que esta se coloca de forma transversal, oferecendo
  um panorama para a contextualização do Hotel e também se apresentando como importante
  aspecto inerente ao processo de valoração. Dessa forma, será possível empreender
  uma leitura mais complexa do bem, contemplando os aspectos arquitetônicos, a dimensão
  histórica em sua acepção mais ampla, resultando assim em um processo de tombamento
  que busque abordar as diversas perspectivas relativas ao patrimônio cultural.
