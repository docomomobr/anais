abstract: 'O artigo tem como objetivo investigar a relação entre a inserção da atividade
  turística como estratégia de modernização e integração Amazônica e os princípios
  modernos adotados na primeira proposta para o Tropical Hotel de Manaus (1963), analisando
  como o caráter utópico do projeto concebido por Sérgio Bernardes se alinhava à dimensão
  econômica, política e simbólica dos agentes envolvidos no processo. Para tanto,
  o artigo se organiza em duas partes, a saber: análise da dimensão econômica, política
  e simbólica do projeto, identificando o papel do Estado, da Companhia Tropical de
  Hotéis e do arquiteto no processo de concepção do projeto; análise do projeto utilizando
  como parâmetros: a contextualização e implantação do objeto arquitetônico; espaço
  arquitetônico; interações funcionais; linguagem arquitetônica; aspectosformais;
  sistema estrutural e construtivo; e aspectos ambientais. Por fim, a pertinência
  deste estudo, inserida em uma pesquisa mais ampla sobre a relação entre o turismo
  e a arquitetura moderna, se justifica em função das transformações e dinâmicas socioespaciais
  contemporâneas, que têm provocado e ameaçado gradativamente e aceleradamente a manutenção
  e conservação deste importante legado do modernismo arquitetônico, sendo a documentação
  dos hotéis modernistas no Brasil uma premissa para a preservação do acervo remanescente.'
keyword: Arquitetura Moderna; Turismo; Hotel; Sérgio Bernardes; Tropical Hotel Manaus
