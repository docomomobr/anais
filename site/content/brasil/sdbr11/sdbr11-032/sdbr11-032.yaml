abstract: Em contrapartida à importância dada pela historiografia moderna às grandes
  obras públicas, elementos singulares na paisagem das cidades, a atenção deste artigo
  se volta aos edifícios escolares padronizados, no que poderíamos definir como arquitetura
  de caráter ordinário, ainda muito pouco estudada. Analisa‐se a experiência de duas
  instituições públicas que mais projetaram e construíram edifícios escolares em Minas
  Gerais (1958‐1987) – as autarquias Campanha de Reparo e Restauração dos Prédios
  Escolares do Estado (CARRPE) e Comissão de Construção, Ampliação e Reconstrução
  dos Prédios Escolares do Estado (CARPE) – discutindo sua relevância para a cultura
  arquitetônica. O campo ampliado de atuação das instituições estatais tentou sintetizar
  nos objetos padronizados os conflitos políticos, sociais, pedagógicos, arquitetônicos
  e da construção. A primeira, CARRPE (1958‐1967), inicialmente atribuída para manutenção
  e reforma predial dos grupos escolares se revelou, de fato, como um laboratório
  de experimentações arquitetônicas e construtivas. A segunda, a CARPE, criada em
  substituição da primeira, conseguiu elaborar e avançar de maneira singular a forma
  sistemática de produção das edificações até sua extinção em 1987 elaborando um total
  de aproximadamente 3.100 projetos em 30 anos. Por meio de uma leitura crítica de
  documentos e entendimento dos arranjos institucionais é exposta essa produção arquitetônica.
