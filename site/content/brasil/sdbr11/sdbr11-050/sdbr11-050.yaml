abstract: 'Este trabalho tem o objetivo de examinar as contribuições que o Projeto
  do Bairro residencial da Praia de Belas, elaborado por Edvaldo Pereira Paiva e Carlos
  Maximiliano Fayet, em 1953, traria à cidade Porto Alegre, capital do Rio Grande
  do Sul, Brasil. O projeto não realizado, que provoca o confronto entre a grande
  escala da superquadra moderna e a escala recorrente do quarteirão tradicional, é
  uma das tantas versões pensadas para a enseada da Praia de Belas. Sua existência
  se reduz a duas imagens e um pequeno texto no Plano de 1959, mas o restrito material
  enuncia um espaço e evoca seus tempos: o passado, representado por seus precedentes,
  -- os estudos urbanísticos realizados para a cidade em 1914, 1936, 1942, 1943 e
  1951--, e o futuro desejado em seu próprio tempo: os ideais urbanísticos de Le Corbusier.
  Em termos teórico-metodológicos, parte-se da explicitação dos modelos, da natureza
  utópica do plano urbanístico e da ideia do projeto como ferramenta intelectual que,
  além de realizar a mimese do modelo e a colagem entre tempos e modelos morfológicos,
  mesmo se não realizado, gera novas ideias e sobrevive como fonte histórica.'
keyword: Superquadras; Plano Urbanístico; Praia de Belas; Porto Alegre; Le Corbusier
