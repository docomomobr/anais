abstract: 'O trabalho tem como objetivo identificar os atributos que carregam os valores
  do edifício moderno e definir conceitos que possibilitem um entendimento mais uniforme
  nas etapas de avaliação e julgamento dos atributos. Discute-se também como a ação
  da conservação, pode interferir nos atributos do edifício. Os atributos carregam
  valores e é desejável que sejam expressos com integridade e autenticidade. O Guia
  Operacional para a Aplicação da Convenção do Patrimônio Mundial da UNESCO elenca
  uma série de atributos, mas não os define. A pesquisa utilizou para a identificação
  dos atributos da arquitetura moderna duas categorias de casos: edifícios significativos
  da historiografia e os bens que fazem parte da Lista do Patrimônio Mundial. O método
  utilizado para identificação e construção dos conceitos foi o da análise de conteúdo.
  Partiu-se da hipótese de que existiam atributos que não especificados pela UNESCO.
  O estudo conceitua dez atributos que caracterizam edifícios da arquitetura moderna,
  sendo dois novos: interconexão e interpenetração, e integração das artes. O entendimento
  comum dos atributos é uma contribuição para a construção de uma metodologia para
  auxiliar o julgamento das ações da conservação na integridade e autenticidade do
  edifício moderno.'
keyword: Conservação; Arquitetura moderna; Autenticidade; Integridade; Atributos
