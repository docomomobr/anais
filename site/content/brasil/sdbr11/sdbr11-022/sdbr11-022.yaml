abstract: Este trabalho objetiva discutir a reconstrução “evocativa” das residências
  dos Mestres da Bauhaus (Walter Gropius e László Moholy-Nagy) inaugurada em 2014,
  realizada pelo escritório BFM Architekten Berlin, vencedor do concurso internacional
  coordenado por David Chipperfield e realizado em 2010, cuja proposta inseriu no
  vazio das lacunas deixadas pelo severo bombardeio aliado de 1945 uma interpretação
  contemporânea de ícones da Arquitetura Moderna desaparecidos há 71 anos. Longe de
  refazer as construções originais e destruir evidências históricas importantes através
  da falsificação imitativa exata e fiel do estado conceitual das edificações modernas
  projetadas por Walter Gropius em 1926, a proposta oferece uma terceira via projetual
  distante tanto do refazimento integral, como da conservação do status quo. Reflexões
  filosóficas inspiradas, entre outros, na obra de Jorge Luis Borges e Hiroshi Sugimoto,
  compõem o conceito da unscharfe Erinnerung - lembrança turva, desfocada, imprecisa,
  incompleta, inexata - que reconstrói brandianamente os dados ambientais do conjunto
  das Meisterhäuser Bauhaus-Dessau através de volumetrias e escalas evocativas que
  recuperam a unidade potencial da obra de arte.
keyword: Intervenção no Patrimônio Moderno; Reconstrução evocativa; Residência dos
