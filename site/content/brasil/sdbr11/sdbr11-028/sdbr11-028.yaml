abstract: 'Inaugurado em 1965, o Hotel Internacional Reis Magos (HIRM) foi o primeiro
  estabelecimento de hospedagem de grande porte e de alto nível inaugurado no RN.
  De arquitetura declaradamente modernista, o HIRM encontra-se atualmente abandonado
  e degradado, não obstante as enfáticas reinvindicações da população sobre a destinação
  da edificação. Encontra-se em elaboração nesse momento os estudos do processo de
  tombamento do IPHAN, mas questiona-se também se seria o tombamento o único caminho
  para a proteção do Hotel: É possível conciliar as políticas de desenvolvimento urbano
  e econômico com as políticas de preservação do patrimônio cultural utilizando-se
  dos instrumentos normativos vigentes? Como aplicar os instrumentos de gestão urbana
  previstos no Plano Diretor de Natal para resolver esse tipo de conflito? Nesse sentido,
  este estudo objetiva analisar as potencialidades de aplicação dos instrumentos do
  Plano Diretor de Natal para a construção de uma política urbana que contemple a
  preservação do patrimônio cultural e a memória coletiva; tomando como objeto de
  estudo o Hotel Internacional Reis Magos. Constata-se que o Plano Diretor de Natal
  não concebe o patrimônio cultural como um recurso ao desenvolvimento econômico,
  refletindo uma visão fragmentada de patrimônio urbano, cidade e políticas públicas,
  desconsiderando também o seu sentido social e o direito à memória coletiva urbana.'
