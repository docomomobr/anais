abstract: Román Fresnedo Siri, arquiteto uruguaio nascido no ano de 1903, graduado
  pela Facultad de Arquitectura no ano de 1930, foi também artista plástico, músico,
  fotógrafo, designer de móveis e chegou a desenhar barcos e iates. Com a sua produção
  arquitetônica percorreu as mais diversas tipologias e escalas projetuais como casas,
  hospitais, hipódromos, edifícios institucionais e também a Faculdade de Arquitetura
  de Montevidéu. Este estudo de caso analisa o projeto de urbanização Arroyo Seco,
  onde o Palácio de la Luz está inserido como edifício principal. O texto também estuda
  o edifício em si e as obras de artistas plásticos presentes na edificação. Desenvolvido
  pelo arquiteto como funcionário da UTE (Administración Nacional de Usinas y Trasmisiones
  Eléctricas), o projeto foi da escala urbana aos detalhes de acabamento e desenho
  de mobiliário. O plano urbano acabou não sendo executado, somente o Palácio de la
  Luz, edifício de escritórios, foi construído, entre os anos de 1943-1948. A integração
  entre arquitetura e artes plásticas pode ser observada no interior da edificação,
  onde participaram os escultores Eduardo Yepes e Olímpia Torres, com o mural Energia
  no hall do pavimento térreo, Pablo Serrano, que esculpiu a porta do salão de atos,
  e o pintor José Cuneo.
