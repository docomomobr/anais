abstract: Em meio a um Recife vertical, algumas residências sobrevivem em uma arquitetura
  singular, a Casa de Amorim. Projetadas na década de 60 do século XX sob influências
  do segundo pós-guerra, do resgate de nossas tradições e da busca por uma identidade
  local, a Casa de Amorim é símbolo da arquitetura moderna pernambucana projetada
  pelo português Delfim Amorim e tantos outros arquitetos. Azulejos na fachada, telhado
  levemente inclinado em laje coberta de telhas cerâmicas, pátios internos, setorização
  funcional dos espaços, esquadrias em venezianas de madeira e uma base em pedra que
  eleva o volume do nível do solo, são as principais características que formam a
  imagem desta habitação. Através da análise de 11 projetos compreendidos nos anos
  60 em Recife, este trabalho discorre sobre a recorrência e relevância da Casa de
  Amorim na arquitetura moderna residencial unifamiliar em Pernambuco.
