abstract: O presente artigo tem como objetivo abordar de maneira narrativa a arquitetura
  do brasileiro natural de Curitiba –PR Ayrton Lolô Cornelsen, no sentido de demonstrar
  suas obras realizadas fora do Brasil predominantemente entre meados da década de
  1960 e de 1970. Os trabalhos realizados por este arquiteto incluem obras espalhadas
  em Portugal, Espanha, Angola e Ilha da Madeira, contando com autódromos, hotéis,
  complexos urbanísticos e turísticos. Na Europa do início do século XX o movimento
  modernista já possuía suas características no que era denominado de ‘Nova Arquitetura’,
  porém, no Brasil estes aspectos ainda estavam se formando, e assim, a irreverência
  presente no arquiteto foi livre e espontaneamente expressa em suas obras, no que
  o mesmo abandona a arquitetura eclética e Art déco já existente em sua cidade e
  buscou adequar-se aos meios, aos materiais e aos frequentadores dos lugares a serem
  criados. Ainda cabe complementar que esta arquitetura era oriunda de ideias e fontes
  científicas, econômicas e outras, e não somente do arquiteto e suas técnicas.
