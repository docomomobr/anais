abstract: O presente trabalho pretende estabelecer um paralelo entre edifícios e micronarrativas,
  de acordo com Peter Burke (1992), como importante ferramenta para que historiadores
  confrontem o desafio de relacionar micro e macro histórias, ou circunstâncias locais
  com tendências gerais, utilizando o exemplo da Igreja de Itoupava Seca (1953-1955)
  em Blumenau-SC, do arquiteto teuto-brasileiro Hans Broos (1921-2011) como possibilidade
  de tal leitura. A visão aqui construída é a tomada do edifício como objeto único
  e revelador de aspectos que vão além do campo estritamente arquitetural e que pode
  ser usado para apresentar valores de uma sociedade em um determinado tempo e local.
  O edifício como campo ampliado, condensador e partícipe de estruturas e conexões
  mais profundas da sociedade, que materializa construções sociais, coletivas e históricas
  e também ponto de conversação entre a história do arquiteto, da arquitetura do lugar
  e sua cultura.
keyword: Micronarrativa; Cultura Local; Hans Broos
