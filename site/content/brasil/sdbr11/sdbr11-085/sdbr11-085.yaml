abstract: 'O artigo investiga as composições de fachadas de edificações residenciais
  da classe média da cidade de São Paulo que estão vinculadas às características consideradas
  como representativas da arquitetura moderna, no período entre 1960 e 1990. Os objetos
  selecionados para análise são as residências projetadas por duas gerações de arquitetos:
  Mario Mauro Graziosi e seu filho João Carlos Graziosi. A pesquisa apresenta algumas
  obras residenciais de dois arquitetos participantes da conformação do cenário da
  arquitetura paulistana em períodos consecutivos, e identifica as influências modernas
  nas características compositivas e nos materiais utilizados por ambos em seus projetos
  de volumetria e planos de fachadas das edificações. O objetivo da pesquisa é contribuir
  com a documentação da produção de residências unifamiliares alinhadas com a arquitetura
  moderna adotada pela classe média paulistana, como forma de contribuir com o registro
  da memória de uma tipologia de edificação presente em várias áreas residenciais
  da cidade de São Paulo. A metodologia utilizada apresenta a formação e o desenvolvimento
  profissional de ambos os arquitetos; seleciona e comenta algumas residências; e
  faz uma análise gráfica comparativa de uma residência de cada um dos autores, relacionando
  com obras de arquitetos identificados como referenciais do movimento moderno: Frank
  Lloyd Wright e Le Corbusier.'
keyword: Residências modernas; Residências paulistanas; Moradia da classe média
