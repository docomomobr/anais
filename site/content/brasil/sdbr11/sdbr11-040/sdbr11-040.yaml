abstract: O artigo discutirá a importância do processo construtivo, a valorização
  do trabalho no canteiro de obra e o uso tecnologia alternativa na arquitetura de
  Paulo Cardoso da Silva, em Fortaleza, Ceará. Falar de suas soluções espaciais arquitetônicas
  desconsiderando tais aspectos seria negar sua própria obra. Tais preocupações podem
  ser avaliadas em projetos do arquiteto para a arquitetura residencial, escolar e
  comercial no estado cearense. Nos deteremos na análise do projeto e obra da casa
  do arquiteto - construída no bairro Papicu em 1974, Fortaleza, Ceará - identificando
  os princípios modernistas usados, as técnicas construtivas e a importância atribuída
  ao canteiro de obra.
