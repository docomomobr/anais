abstract: 'Este artigo procura estudar a relação artes plásticas/arquitetura em Pernambuco
  de 1951 a 1976 por meio da análise de seis espaços realizados por arquitetos −como
  Acácio Gil Borsoi, Heitor Maia Neto, Vital Pessoa de Melo, Maurício Castro−, e artistas−
  como Anchises Azevedo, Reynaldo Fonseca, Helio Feijó, Francisco Brennand e Athos
  Bulcão. O recorte temporal se deu principalmente por quatro motivos: representa
  um momento de absorção e realização do vocabulário moderno no Estado; a unidade
  em torno de alguns princípios de projeto mantidos pela produção arquitetônica deste
  período; a efervescência ocorrida nas artes plásticas e a realização de um grande
  número de obras feitas para as edificações; e as parcerias existentes entre artistas
  plásticos e arquitetos. Assim, o objeto deste trabalho não é nem a arte nem a arquitetura,
  mas a integração ocorrida nesses espaços. Dessa forma, aliando-se a análise dos
  espaços selecionados aos escritos f de Merleau-Ponty, Evaldo Coutinho e Juhani Pallasmaa,
  procurou-se responder algumas inquietações: Como era a relação entre o espaço arquitetônico
  e a obra de arte? Como a obra de arte era apreciada? Como era o diálogo entre artistas
  e arquitetos? Como a obra de arte pode conferir valor ao edifício?'
