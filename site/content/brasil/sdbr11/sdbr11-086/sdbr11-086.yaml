abstract: No presente artigo defendemos que sol, o verde e o espaço são temas-chave
  para a obra de João Filgueiras Lima, adaptando estes motes e recursos espaciais.
  Para o verde, realizará uma série de operações para preservá-lo, como transição
  entre o interior e o exterior do edifício e mesmo trazê-lo ao seu interior. O espaço
  era lapidado através da fluidez espacial interna, interpretando as paredes como
  vedações, despojadas ao máximo no peso, e da dissolução d a separação entre interior
  e exterior, pelo recuo da estrutura, uso de jardins laterais como, painéis pivotantes
  substituindo as paredes e, a partir do CTRS, com uma envoltória versátil, em termos
  de isolamento e opacidade. A luz natural é controlada e distribuída por jardins
  laterais e sheds, enquanto re-elabora os solários da tradição modernista. E terá
  ainda espaços típicos e procedimentos projetuais que visam atender sincreticamente
  a tais temas, como sistemas de cobertura, jardins laterais mencionados e principalmente
  por meio dos jardins de ambientação. O arquiteto buscava uma construção leve, tendendo
  ao imaterial e a diafragmas, reguladores de luz e de ar, por meio de elementos de
  arquitetura (um alfabeto de partes construtivas) e elementos de composição (formas
  e espaços) em constante aperfeiçoamento.
keyword: João Filgueiras Lima; Modernismo; Sol; Espaço; Verde
