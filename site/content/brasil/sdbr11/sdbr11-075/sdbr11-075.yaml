abstract: 'O presente artigo tem como objeto de estudo as atividades desenvolvidas
  pelo Grupo de Extensão “Inventário do Patrimônio Cultural Teresinense” em prol do
  acervo arquitetônico moderno de Teresina-PI. O objetivo geral é apresentar o processo
  de construção desse grupo na Universidade Federal do Piauí, contextualizando-o com
  a evolução do conceito e da prática de preservação na cidade de Teresina. Entre
  os objetivos específicos estão: apontar a metodologia de trabalho desenvolvida,
  enumerar os resultados já obtidos e discutir a apropriação desse movimento dentro
  da conjuntura social teresinense. A justificativa para a apresentação deste produto
  é compartilhar junto à comunidade acadêmica bem como a sociedade como um todo, a
  experiência da realização desse tipo de trabalho de cunho inventarial a partir de
  uma iniciativa particular para uma finalidade social. Para o desenvolvimento do
  trabalho utilizou-se a pesquisa histórica, assentado no pensamento de Benévolo(1984)
  que vê esse método como essencial para o entendimento de um objeto analisado. O
  aporte teórico foi encontrado em obras de Argan (1991), Piñon (2006), Pinheiro (2003)
  e Afonso (2016), que abordam com maior enfoque a construção da linguagem moderna
  da arquitetura e o desenvolvimento de conceitos e processos de conservação e preservação
  do acervo moderno.'
keyword: Arquitetura Moderna de Teresina; Memória; Cidade
