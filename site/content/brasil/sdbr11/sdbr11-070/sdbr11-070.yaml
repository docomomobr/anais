abstract: Este trabalho pretende "trazer a luz" e analisar o projeto de uma residência
  e consultório médico datados de 1935, construídos na cidade de Marília-SP, obra
  de autoria do arquiteto Gregori Warchavchik, considerado, por muitos autores, como
  um vanguardista e introdutor da arquitetura modernista no Brasil; em Marília certamente
  ele também será o primeiro a trazer essa linguagem arquitetônica à cidade. Esta
  propriedade, pertencente ao então vereador municipal do Partido Republicano Paulista,
  Aristóteles Ananias Maurício Garcia (1899-?) até então desconhecida mesmo na cronologia
  oficial de obras do arquiteto, é única, em um contexto e período (meados de 1930),
  onde as construções de linguagem mais "futurista", na cidade, eram constituídas
  pelos exemplares Art-Decó. Neste trabalho só será analisado o período da produção
  de Gregori Warchavchik, em que se deu o projeto de Marília, a partir da revolução
  de 1930, e conforme apontam seus biógrafos, momento em que o número de obras do
  arquiteto diminuiu drasticamente. Sem dúvida trata-se de um projeto relevante e
  original que honra a obra de Warchavchik, premente de análise e aprofundamento historiográfico
  e que introduz o modernismo, não só em Marilia, mas em toda região centro-oeste
  do estado de São Paulo.
keyword: Warchavchik; Arquitetura Modernista; Marília
