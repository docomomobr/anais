abstract: Mantendo o foco na questão de raiz do DOCOMOMO - documentação e a preservação
  das criações do Movimento Moderno na arquitetura e no urbanismo – o objetivo deste
  trabalho é debater as múltiplas dimensões dos movimentos artísticos, estéticos e
  culturais que contribuíram no processo de modernização do Brasil, através da reflexão
  sobre os paradoxos colocados pela documentação e preservação da arquitetura do Movimento
  Moderno.
