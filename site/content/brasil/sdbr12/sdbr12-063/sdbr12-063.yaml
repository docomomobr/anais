abstract: 'O artigo apresenta algumas discussões teóricas realizadas no final do século
  XX sobre o restauro da arquitetura moderna na Itália, tomando como exemplo os posicionamentos
  de determinados teóricos italianos quanto a um tema específico: o restauro do Weissenhof
  de Stuttgart, realizado durante os anos 1980. Para tanto, faz-se necessário inicialmente
  assinalar a postura teórica que orienta o restauro em questão, que é referenciada
  por Paolo Marconi, Marco Dezzi Bardeschi e Giovanni Carbonara, os principais autores
  tratados neste texto.'
