abstract: 'O modernismo no Brasil teve grande ascensão a partir da Semana de Arte
  Moderna de 1922, em São Paulo, com inúmeras manifestações culturais que disseminaram
  a proposta que já vinha sendo difundida na Europa, desde o início do século XIX.
  Mesmo que tardio em relação a outros países, o Brasil foi um grande apoiador do
  movimento e de onde se extraiu nomes importantes e marcos da obra modernista mundial
  (BENÉVOLO, 2001).

  No Espírito Santo a modernização da Região Metropolitana da Grande Vitória (RMGV),
  consolidou-se por ação do governo Jones Santos Neves (1951-1955), com a capital
  mais estruturada do que nos governos anteriores. Esse processo teve como base a
  escola moderna carioca, recebendo arquitetos vindos do Rio de Janeiro e de Belo
  Horizonte para elaboração do programa de modernização das cidades capixabas, sendo
  Maria do Carmo de Novaes Schwab, um dos principais nomes desse período da arquitetura
  capixaba (MIRANDA, 2010).'
