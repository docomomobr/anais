abstract: 'Diversas são as reflexões, opiniões, depoimentos e críticas sobre Brasília
  iniciadas antes, durante e após a sua construção. Salvo casos pontuais, é possível
  afirmar que o “olhar latino-americano” sobre a mesma tem sido entendido e/ou referenciado
  a partir das contribuições de Segre e Gutiérrez. Neste artigo, no entanto, propomos
  ampliar esses “olhares” respondendo a dois questionamentos-chave: Qual a visão dos
  arquitetos sul-americanos sobre Brasília? Esses olhares coincidem ou divergem às
  daqueles autores? Para tal, valemo-nos de um conjunto de artigos publicados em sete
  revistas especializadas sul-americanas (Nuestra Arquitectura, PROA, El Arquitecto
  Peruano, Arquitectura, Integral, Punto e Taller). Essa análise mostra-nos que as
  opiniões sobre ela eram diversas, complementares, antagônicas. Isto significa que
  a nova capital sul-americana se apresentava como um “fenômeno” complexo, como uma
  experiência “inédita” que produzia mais dúvidas e incertezas do que respostas.'
