abstract: Neste artigo, a autora aborda a construção da trajetória e o registro do
  azulejo de fachada da segunda metade do século XX em Pernambuco, refletindo sobre
  a documentação da ocorrência do azulejo na historiografia da Arquitetura Moderna
  Brasileira e de Pernambuco. O recorte proposto permite verificar, ainda, os desdobramentos
  do fenômeno nas décadas seguintes após o episódio moderno.
