abstract: 'Se Lúcio Costa contou uma história de poucos heróis, criadores iluminados
  de uma nova linguagem nacional inspirada por um sagrado ideário estrangeiro, os
  periódicos contam outras histórias. As revistas revelam histórias de homens comuns
  dispostos ao embate de ideias e ao trabalho constante de pesquisa projetual/construtiva,
  atentos às possibilidades locais e críticos às soluções importadas, que construíram
  com árduo esforço um campo disciplinar e profissional, cuja grande bandeira foi
  a renovação qualificada da arquitetura brasileira.

  Esse artigo tem como recorte mapear os embates sobre os sentidos, os motivos e as
  formas de ser moderno no Brasil na década de 1920 e início dos anos 1930 nas páginas
  da Revista “A CASA” (periódico brasileiro especializado em arquitetura publicado
  a partir de 1923 no Rio de Janeiro). Aparece nas edições analisadas uma gama variada
  de questões e problemas em torno da arquitetura da primeira metade do século XX
  e da arquitetura moderna em particular, que nos revela um rico debate sobre outras
  reflexões, outros caminhos e outros personagens da renovação da arquitetura no Brasil
  no início do século XX.'
keyword: Revista A CASA; renovação da arquitetura brasileira; história da arquitetura
