abstract: O artigo aborda as complexidades construtivas e simbólicas do projeto de
  Oscar Niemeyer para o conjunto arquitetônico da sede do Quartel General do Exército
  em Brasília, entre 1968-73. Em pleno contexto da Ditadura Militar, o arquiteto desenvolve
  um projeto-limite na experimentação das técnicas de pré-fabricação testadas por
  ele e sua equipe nos canteiros da nova capital, incluindo obras na Universidade
  de Brasília. Embora permaneçam preteridos pela historiografia, o Quartel General
  do Exército e a Praça dos Cristais que integra este conjunto arquitetônico e urbanístico
  com destaque no Setor Militar Urbano do Plano Piloto precisam ser reconsiderados.
  Recentemente, o Quartel e a Praça tornaram-se protagonistas das circunstâncias históricas
  por serem ambiente urbano do discurso antidemocrático e base do acampamento golpista
  da horda que consubstanciou os atos de 8/janeiro/2023 contra os palácios dos Três
  Poderes.
