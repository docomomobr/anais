abstract: O século XX foi marcado pela criação das cidades-capitais modernas, especialmente
  em países com novos regimes políticos, que prezavam por ideais de emancipação cultural
  e nacionalidade. No ano de 1960, Brasília, no Brasil, e Islamabad, no Paquistão
  foram inauguradas a partir das premissas do Urbanismo Moderno. Ambas expressam uma
  tentativa de criação de uma identidade nacional unificada que representasse o desejo
  por modernidade e emancipação nacional. Este trabalho propõe a análise de espaços
  públicos e paisagens monumentais da capital de Islamabad, a partir da investigação
  de estratégias projetuais reconhecidas em Brasília. Desse modo, é proposto uma releitura
  da monumentalidade das novas capitais do século XX desvinculadas das críticas pós-
  modernas e um inventário do patrimônio construído e suas recorrências configuracionais
  nestas cidades.
