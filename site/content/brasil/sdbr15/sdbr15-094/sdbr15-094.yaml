abstract: Este trabalho trata dos desafios encontrados na conservação de edifícios
  habitacionais de grande escala, como os casos do Conjunto Habitacional Mendes de
  Moraes e do Edifício Copan. O objetivo do trabalho é debater acerca dos conflitos
  existentes que levam a degradação avançada desses edifícios e a sua difícil e onerosa
  conservação, a fim de contribuir para um olhar atento das práticas de conservação
  no país e da necessidade de políticas voltadas a implantação planos de conservação
  mais efetivos. Os dois casos são consideravelmente representativos por se tratar
  de edifícios habitacionais icônicos e reconhecidos, de grandes proporções e cujos
  processos de conservação enfrentaram, enfrentam e enfrentarão grandes dificuldades.
  Trata-se da compilação destes desafios com o objetivo de contribuir para ações futuras
  no campo da conservação destes bens.
