abstract: Tentar definir o modernismo é uma tarefa extremamente complexa e muitas
  vezes traiçoeira. A diversidade de enfoques é cada vez maior, assim como a proliferação
  dos autores que buscam compreendê-lo. Esse artigo se propõe a contribuir com os
  estudos de cunho conceitual e refletir especificamente sobre a definição do modernismo
  como expressão artística singular dentro das várias expressões no largo espectro
  das manifestações do moderno e da modernidade no século XX. Nos tempos atuais que
  estamos presenciando uma assustadora exacerbação e um forte recrudescimento do horizonte
  conservador – contra o qual o sentido de ruptura e resistência do modernismo se
  mostrou fundamental – vale revisitá-lo e buscar verificar em que medida as manifestações
  excêntricas ao espaço geográfico de gestação do modernismo, como no Brasil, essas
  expressões modernistas, bem mais que ecos dispersos das fontes europeias, foram
  falas próprias e criativas que refundaram o país através de uma reconfiguração significativa
  da cultura brasileira.
