abstract: As dinâmicas da produção capitalista e a expansão das cidades modernas resultaram
  no processo de esvaziamento, degradação e recuperação de áreas centrais. Para entender
  essa mecânica, as autoras Vargas e Castilho definem as fases de Renovação Urbana
  (1950 a 1970) e Preservação Urbana (1970 a 1990) que aliadas às demandas nacionais,
  ditam o espaço urbano brasileiro. Neste artigo, estuda-se o caso peculiar de Curitiba
  que consolida a “cidade moderna”, mesmo que a dicotomia entre renovação e preservação
  urbana desvaneça, associando o processo de mudanças locais com debates que já haviam
  ocorrido em eventos internacionais. Então, investiga-se o processo que, por um lado,
  buscou a transformação contínua da área central curitibana, transformando-a em um
  canteiro de obras; por outro, instituiu uma nova paisagem de faceta histórica que
  deve ser preservada e ter sua manutenção como princípio essencial.
keyword: Curitiba; Urbanismo; Renovação Urbana
