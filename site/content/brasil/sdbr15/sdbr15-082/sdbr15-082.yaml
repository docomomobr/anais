abstract: “A construção funcional moderna”, livro escrito por Adolf Behne, traz um
  panorama da arquitetura e do pensamento arquitetônico na Europa entre os anos 1890-1923.
  A leitura do livro, que completa 100 anos, oferece um panorama complexo sobre vertentes
  distintas da arquitetura moderna que disputavam espaço naqueles anos, reconhecidas
  por um teórico capaz de interpretar as nuances de pensamento e fazer um prognóstico
  dessas arquiteturas, caso levadas a cabo em sua radicalidade. A pesquisa feita sobre
  a obra constitui uma revisão narrativa de literatura que permanece fiel ao conteúdo
  original do livro. Considera-se que a obra teve pouca repercussão no Brasil, e sua
  leitura é esclarecedora de termos como funcionalismo e racionalismo, abordados por
  um autor contemporâneo aos acontecimentos e inserido no círculo arquitetônico da
  época. Seus esclarecimentos são valiosos para o reconhecimento de vertentes divergentes,
  desfazendo a ideia de que a Arquitetura Moderna ocorreu como uma manifestação monotônica
  e centralizada.
keyword: Funcionalismo alemão; Arquitetura racionalista; História da arquitetura moderna
