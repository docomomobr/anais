abstract: São Paulo foi marcada pela constante expansão e renovação de seu território,
  principalmente sob a vigência do Movimento Moderno, no início do século XX. O mapeamento
  dessa produção documental e espacial sobre a paisagem de São Paulo em uma única
  plataforma constitui um instrumento potente para estudos e para extroversão de pesquisas
  no âmbito da Arquitetura Paulista. A democratização do acesso a essas informações
  abrirá uma oportunidade para a revisão historiográfica e para novas pesquisas. Este
  projeto permitirá a identificação da contribuição dos arquitetos modernos para a
  construção da cidade, assim como será possível compreender as relações sociais,
  as áreas de atuação dos profissionais, as relações com a legislação urbana, a repercussão
  no entorno, e outras frentes de pesquisas. A cartografia é um meio de fácil interação
  com a sociedade, aproximando o conhecimento acadêmico a um público mais amplo e
  diversificado.
