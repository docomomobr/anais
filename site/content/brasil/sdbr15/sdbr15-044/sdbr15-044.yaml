abstract: O trabalho aborda a mobilidade habitacional no Rio de Janeiro durante sua
  reestruturação urbana no século XX, a partir da relação entre a diferenciação social
  e a oferta de moradia - indissociáveis das investigações e processos de formação
  e produção da estrutura espacial. Tem-se como objetivo contribuir para as investigações
  das formas urbanas com foco nas abordagens sobre a produção social das formas espaciais,
  além de ampliar possibilidades de leitura sobre a historiografia da arquitetura
  moderna brasileira e seus limites materializados no espaço e no tempo. Foi realizada
  uma investigação sobre as diferentes dinâmicas recorrentes na cidade, bem como o
  arranjo da modernidade e o programa arquitetônico dos conjuntos de habitação social
  enquanto produto do Estado. Compreendeu-se que a modernização urbana significou
  também a segregação socioespacial nesses novos conjuntos e meios de consumo coletivos,
  além de revelar que existe arquitetura para além daquela projetada advinda da apropriação
  desses espaços.
keyword: Habitação social; Rio de Janeiro; Morfologia urbana
