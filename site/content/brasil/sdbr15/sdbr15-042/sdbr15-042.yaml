abstract: A arquitetura moderna cearense tem início na década de 1950, sendo influenciada
  pela Escola Carioca e disseminada na Faculdade de Arquitetura da Universidade Federal
  do Ceará. Na região do Cariri, a cidade de Juazeiro do Norte passava por um acelerado
  desenvolvimento econômico decorrente das políticas públicas de industrialização
  e urbanização. Nessa circunstância, cresce o turismo religioso em torno do Padre
  Cícero, possibilitando o surgimento do Panorama Hotel, edificação modernista elaborada
  por José Capelo Filho que transformou a paisagem urbana. Diante da escassez de pesquisas
  sobre a obra, o presente estudo teve como objetivo analisar suas características,
  inspirações e contexto histórico, a partir de pesquisa bibliográfica referencial,
  averiguação in loco e análise projetual. Com os resultados obtidos, constatou-se
  o seu papel significativo na formação do movimento moderno regional e na estruturação
  urbana, fazendo-se necessário o reconhecimento de sua relevância arquitetônica e
  histórica.
