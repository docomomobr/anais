abstract: 'No século XX, a arquitetura foi uma manifestação das vicissitudes da sociedade
  moderna, que refletiu aspectos de poderes políticos em obras arquitetônicas, inclusive,
  tumulares. Este artigo objetivou descrever como a ideia de individualidade moderna,
  entendida a partir de Simmel, Foucault e Bauman, foi consolidada no túmulo de Juscelino
  Kubitschek, em Brasília (DF). Para tal, realizou-se a análise de conteúdo de matérias
  publicadas no jornal Correio Braziliense associada à pesquisa bibliográfica. Em
  seguida, elaborou-se o estudo de caso do túmulo com base nos critérios: materiais
  construtivos, condições de manutenção e localização da sepultura no cemitério. Concluiu-se
  que a construção do túmulo – a qual envolveu ações reveladoras de condições diferenciadas
  de manutenção, material construtivo nobre e localização central no cemitério – foi
  atravessada pela individualidade e pelo poder do ex-presidente. Este último, perpetuado
  por atores sociais, outorgou a petrificação das suas qualidades individuais ao mesmo
  tempo em que fora concedido democraticamente pelo povo.'
keyword: Arquitetura cemiterial; Cemitério; Campo da Esperança
