abstract: Nos cinquenta anos desde a promulgação do “Tratado de Itaipu” cabe a reflexão
  territorial do alcance dos planejamentos industriais incutidos para a Região da
  Fronteira Oeste do Paraná, receptora da Hidroelétrica Binacional de Itaipu na década
  de 1970. Sob os objetivos de um projeto de Nação, a implantação da então maior hidroelétrica
  do mundo marcou profundamente a organização do território da região de fronteira
  que se encontrava em disputa desde o século XIX. O artigo, decorrente de análise
  documental, apresenta um panorama sobre as justificativas do projeto de Itaipu em
  contraponto com os planejamentos estaduais para a industrialização. Os vários projetos
  e longos períodos de discussões diplomáticas internacionais, além das diferentes
  visões internas sobre as propostas de industrialização, apontam os desalinhamentos
  entre orientações federais e estaduais, com reflexos físico-territoriais sobre a
  hierarquia da rede de cidades da região de fronteira Oeste do Paraná.
keyword: Usina Itaipu; Integração regional; Eixo Industrial Oeste do Paraná
