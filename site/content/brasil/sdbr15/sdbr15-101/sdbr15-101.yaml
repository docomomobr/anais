abstract: Nas primeiras décadas do século XX, Brasil e Itália produzem suas arquiteturas
  a partir de questões similares, como a construção de suas nacionalidades. O presente
  artigo tem como objetivo mostrar as convergências na formação da arquitetura dos
  dois países no período, segundo o uso da tradição. Na Itália, o clássico, a mediterraineità
  e o vernáculo fazem parte do contexto da realidade local, marcada pela miscigenação
  e amálgama entre o natural e o artificial; no Brasil, inicialmente o neocolonial
  (com base na arquitetura portuguesa e no colonial erudito brasileiro) e o moderno,
  no colonial brasileiro de marca do vernáculo, urbano e rural, registram a tradição
  numa produção nova. Nesse contexto, considera-se que cada um dos países resgata
  as expressões do seu passado para a produção da arquitetura do período e, apesar
  das diferentes razões, contou-se em ambos com a variedade no uso desse passado na
  dimensão das suas respectivas realidades.
