abstract: O presente ensaio procura apresentar as mudanças culturais que ocorreram
  a partir dos anos 1970s, tendo em vista a contribuição teórica e crítica do filósofo
  e sociólogo alemão Jürgen Habermas. A Primeira Bienal de Veneza de Arquitetura de
  1980, conhecida pela Strada Nuovissima de Paolo Portoghesi, possui para Habermas
  características proféticas sobre a configuração da cultura moderna após a Segunda
  Guerra Mundial. Essa condição – resultado de um processo desestabilizador causado
  pela própria modernização sociocultural – também terá consequências políticas profundas.
  Aqui também são apresentadas visões panorâmicas e críticas sobre o desenvolvimento
  do pós-modernismo nesse período a partir de Mary McLeod e Hal Foster, compreendendo
  como tanto a abordagem historicista e desconstrutivista vistos na Arquitetura são
  sinônimos de um sintoma mais profundo da situação cultural contemporânea. Por fim,
  busca-se um encaminhamento para situação tendo em vista as contribuições recentes
  de Kenneth Frampton.
keyword: Modernismo; pós-modernismo; Habermas; arquitetura
