abstract: 'O texto apresenta duas obras: o Centro Cívico de Säynätsalo, Finlândia,
  que ocupa destaque na obra de Alvar Aalto; e o Centro Municipal Distrito Sul de
  Rosário, Argentina, talvez um dos menos conhecidos projetos de Álvaro Siza, seu
  primeiro edifício nas Américas. A escolha se deveu por serem obras afins ao historicamente
  validado e a normas, seguidoras de exemplos e contributivas para o contexto ao qual
  pertencem. Podem ser filiados às revisões críticas realizadas a partir do CIAM VIII,
  como oportunidades de reflexão aos desafios que a cidade contemporânea oferece.'
