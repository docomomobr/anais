abstract: Esta comunicação expõe os resultados preliminares de uma pesquisa desenvolvida
  na Universidade São Judas Tadeu sobre as obras de Arquitetura Moderna construídas
  nos bairros paulistanos de Higienópolis, Santa Cecília, Vila Buarque e Consolação
  entre 1930 e 1985. Já encontramos um significativo acervo construído, distribuído
  em 110 quarteirões, produto da verticalização desses bairros nesse recorte temporal.
  Tal acervo é relativamente homogêneo, ainda que com variações de década para década,
  mas é reconhecível por suas características formais e de implantação, com predomínio
  de edifícios de 12 pavimentos em média, com recuos frontais ou laterais tratados
  de forma paisagística que dialogam com a vegetação pública. O objetivo final da
  pesquisa é produzir um inventário completo dessas obras na área pesquisada. Na etapa
  apresentada aqui, foi listada e mapeada apenas uma parte das obras (aproximadamente
  20%).
keyword: Arquitetura Moderna Paulistana; Verticalização; Bairros de São Paulo
