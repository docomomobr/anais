abstract: O presente trabalho surge na esteira de investigações realizadas no âmbito
  do Programa de Educação Tutorial da Escola de Arquitetura da UFMG, com o desafio
  de compreender as relações estabelecidas pela ditadura com a produção arquitetônica
  nacional no pós-Brasília. Dentre estas relações, a de apropriação de símbolos e
  imagens do movimento moderno brasileiro pelo governo militar revela uma série de
  contradições históricas, políticas e ideológicas trazidas no bojo deste processo.
  Elencamos a representação do Palácio da Alvorada para ilustrar essas contradições
  e melhor compreendê-las à luz de análises críticas e históricas da arquitetura moderna
  brasileira, do projeto político de modernização do país e do processo de escalada
  do autoritarismo.
