abstract: Por intermédio de material jornalístico, principalmente disponível em meio
  digital, recuperamos o enfrentamento das principais questões relacionadas à esfera
  do Patrimônio Histórico e Artístico Nacional (PHAN), durante o último governo federal,
  entre os anos de 2019 e 2022. Entre a incompreensão da atuação deste órgão sob sua
  responsabilidade e a sua apropriação política, é possível identificar as relações
  de poder que o Instituto Patrimônio Histórico e Artístico Nacional IPHAN articulou
  nesta gestão em contraposição a sua trajetória histórica, buscando observar as nuances
  políticas e econômicas que envolveram e envolvem a temática.
