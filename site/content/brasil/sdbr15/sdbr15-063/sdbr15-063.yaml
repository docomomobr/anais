abstract: Propõe-se analisar o discurso do grupo Team X, pós-CIAM, 1960-1970, como
  meio de extrair diretrizes e estratégias projetuais que contribuam para o enfrentamento
  das questões sociais atuais. Busca-se com isso a contribuição do campo da arquitetura
  e urbanismo, como uma de suas responsabilidades sociais. O contínuo debate entre
  o grupo foi pautado por termos e conceitos, que priorizavam o aspecto social, com
  a criação de espaços democráticos e coletivos. O reflexo deste discurso resultou
  na conformação de novos tipos arquitetônicos e novas composições. O artigo foca
  na megaestrutura, tipo caracterizado por formas extensas e espaços interconectados,
  multifuncionalidade e modulação, que sintetiza diretrizes como associação e coletividade.
  Defende-se o resgate do discurso proferido pelo Team X. Suas ideias e soluções podem
  nortear a criação de espaços democráticos, de amplo convívio social que servem como
  base, no campo, para o planejamento de ações e políticas públicas de redução dos
  problemas sociais.
keyword: Team X; Interconexão; Comunidade
