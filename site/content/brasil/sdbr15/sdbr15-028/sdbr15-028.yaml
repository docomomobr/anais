abstract: A azulejaria foi trazida para o Brasil a partir da cultura lusófona. No
  entanto, foi no país que a aplicação de azulejos como revestimento externo ganhou
  destaque, especialmente quando as vantagens desse revestimento cerâmico em relação
  às condições climáticas adversas, como a maresia e fortes chuvas, foram reconhecidas.
  Esta pesquisa parte da chegada dos azulejos ao Brasil à sua incorporação a identidade
  arquitetônica brasileira, durante o movimento modernista, quando artistas como Athos
  Bulcão contribuíram para representar o nacionalismo por meio de painéis azulejares.
  Tem por objetivo analisar, no âmbito do design de superfície, o painel azulejar
  desenvolvido por Athos Bulcão para o edifício da Universidade Regional do Cariri
  — Campus São Miguel, localizado no Crato, Ceará. Dessa forma, busca-se promover
  o reconhecimento e a documentação dos azulejos criados por Athos Bulcão, além de
  contribuir para a historiografia do Nordeste e da região do Cariri.
