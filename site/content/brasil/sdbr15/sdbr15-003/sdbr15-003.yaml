abstract: A atuação do Estado na promoção da arquitetura moderna brasileira é de suma
  importância em se tratando das obras e da modernização enquanto processo. Nesse
  quesito, o Plano de Ação do governo Carvalho Pinto se destaca enquanto planejamento
  estatal e por seu ineditismo e alcance ao promover equipamentos públicos e infraestrutura
  em cidades paulistas. Visando o desenvolvimento estatal, foram milhares de obras
  projetadas e, muitas destas encontram-se de soslaio na historiografia da arquitetura
  moderna. Por essa razão, a valorização do Plano de Ação, na qualidade de projeto
  do governo e de propulsor da arquitetura moderna deve ser efetivada. Entretanto,
  na contramão deste merecido reconhecimento, muitas obras encontram-se à mercê de
  instâncias governamentais, sem uso, sem manutenção ou foram completa ou parcialmente
  modificadas, sem que valesse sua linguagem arquitetônica de origem. É o caso da
  Casa de Lavoura da cidade de São Carlos, apresentada neste trabalho para fins de
  análise.
