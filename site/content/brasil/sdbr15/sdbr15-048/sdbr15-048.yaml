abstract: O movimento moderno brasileiro foi notadamente marcado pela propulsão do
  país a um estado de vanguarda mundial. Essa condição, catalisada pela arquitetura,
  ao mesmo tempo, sua catalisadora, é apoiada por uma série de circunstâncias políticas
  na sua eleição como projeto de país para o novo século. Este texto pretende investigar
  as condições estéticas da consolidação da vanguarda modernista como linguagem oficial
  do Brasil moderno, bem como os fatores em disputa no campo da arquitetura nacional
  a partir da virada do século XX. Paralelamente, observamos aproximações e distanciamentos
  estéticos e semióticos entre a arquitetura moderna brasileira dos anos 1930 e a
  matriz europeia corbusiana. Ambos contribuem para se estabelecer um estudo do êxito
  do modernismo brasileiro como linguagem nacional e como vanguarda no campo da busca
  pela forma moderna, em plena disputa no começo do século passado.
