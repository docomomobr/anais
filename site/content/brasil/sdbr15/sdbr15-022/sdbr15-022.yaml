abstract: 'Acredita-se que os Concursos Públicos de Anteprojetos de Arquitetura, promovidos
  na Argentina, foram influenciados pelo Estado e impulsionaram o desenvolvimento
  da Arquitetura Moderna, especialmente entre os anos 50 e início dos 80. Neste período,
  novos temas e programas foram demandados, por conta de um processo de concentração
  de capital no país, sendo grande parte deles objetos de concursos. Muitos arquitetos
  alçaram relevância por meio das premiações em concursos. Pode-se identificar claramente
  a presença do arquiteto Clorindo Testa nesses anos, tanto pela cronologia de sua
  obra, quanto por premiações em 1° lugar em concursos de anteprojetos: nas décadas
  de 50, 60, 70 e 80 é premiado em cinco, um, nove e dois, respectivamente. Sendo
  assim, este ensaio se propõe apresentar um paralelo dos acontecimentos políticos
  relacionados ao Estado Argentino, entre os anos 50 e início dos 80, com a proposição
  de concursos; além da apreciação de algumas propostas premiadas de Testa.'
keyword: Clorindo Testa; Concurso; Arquitetura Moderna Argentina
