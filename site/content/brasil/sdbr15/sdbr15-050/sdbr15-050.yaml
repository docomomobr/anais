abstract: O CIAM de 1929 foi um marco no debate sobre a produção da habitação moderna.
  Esse evento ocorreu em um momento no qual a demanda por moradia era crescente, não
  apenas pelo avanço da industrialização mas também pela estruturação da URSS. Assim,
  para os arquitetos modernos, a busca por padronização da construção foi o principal
  ponto de partida, mas junto a ela também vieram as ideias de se criar uma forma
  de vida e eliminar a ideia de diferença. Nesse sentido, cabe questionar se a maneira
  de ver os usuários da arquitetura poderia se aproximar do conceito de massas proposto
  por Hannah Arendt. O objeto deste trabalho é confrontar essas ideias, de um lado
  a perspectiva dos arquitetos preocupados com a produção da habitação moderna e de
  outro a análise da autora, que vê na proposta da eliminação da diferença um dos
  requisitos para a formação do Estado totalitário.
