abstract: 'Durante o governo Vargas (1930-1945) é instalada uma rede de equipamentos
  de assistência pública e de saúde em Salvador. Ao se constatar a existência dessa
  rede, questiona-se por quem, como, com quais intenções e com quais características
  arquitetônicas foi instituída. Uma vez que se nota que o Estado tem um papel fundamental
  para a sua realização, realiza-se uma leitura que parte da apresentação das suas
  estruturas políticas, das diretrizes existentes, das intenções dos seus promotores
  e as relaciona com as características arquitetônicas da rede soteropolitana. Assim,
  o texto possui três partes: a primeira apresenta as estruturas políticas existentes
  e as suas diretrizes; a segunda indica como essas se conectam com a rede de equipamentos
  da cidade; a terceira apresenta as soluções arquitetônicas adotadas. Como conclusão
  o texto indica que as políticas adotadas, suas diretrizes e suas respostas arquitetônicas
  se transformam durante o referido período, além de assinalar certas ponderações
  críticas.'
keyword: Era Vargas; Políticas estatais; Arquitetura moderna
