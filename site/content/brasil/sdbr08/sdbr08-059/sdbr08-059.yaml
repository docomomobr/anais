abstract: Este artigo apresenta exemplares do vasto e inédito conjunto da obra do
  arquiteto mineiro Wagner Schroden, em sua trajetória na cidade de Uberaba (MG).
  Filho do fotógrafo alemão Hans Schroden, formou- se em arquitetura com especialização
  em urbanismo na UFMG no ano de 1966 e atuou na capital mineira por dezesseis anos.
  Em seguida, mudou-se para Uberaba - onde permaneceu até seu falecimento, em 1987
  - e realizou inúmeros trabalhos de arquitetura, design e comunicação visual em seu
  escritório particular, paralelamente às atividades de docência e ao trabalho exercido
  na Secretaria Municipal de Planejamento. Sua atuação coincidiu com a repercussão
  no Triângulo Mineiro da política desenvolvimentista implementada por Juscelino Kubitschek,
  bem como a busca da cidade, naquele momento, pela assimilação dos paradigmas modernos
  como símbolo para seu reconhecimento como a “capital nacional do Zebu”. Sua abrangente
  formação – era também pintor, escultor, fotógrafo, designer e músico - incidiu sobre
  a complexidade projetual com a qual se comprometia, tratando a edificação como uma
  peça indissociável entre função, plástica e relação com o entorno, o que resultou
  em edificações marcadas pela monumentalidade e escultoriedade, ressaltada em parcerias
  com profissionais renomados como o paisagista Burle Marx. A qualidade de sua produção,
  que seguiu em grande parte a corrente brutalista, foi responsável pela libertação
  definitiva das amarras historicistas na qual a cidade havia mergulhado durante o
  processo de busca por sua identidade, e marcou a estética arquitetônica dos anos
  de 1980. A síntese artística do arquiteto foi marcada por intensa complexidade,
  que transcendeu o âmbito espacial e penetrou no anseio humano. Sua notória obra
  no Brasil Central foi estampada nas principais revistas do ramo e estendeu-se ao
  cenário internacional, dentre os quais, Paraguai, Austrália, África do Sul e países
  da Europa, onde além de reconhecido, foi bastante premiado.
