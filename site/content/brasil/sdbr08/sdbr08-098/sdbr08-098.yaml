abstract: O presente artigo propõe a reflexão sobre uma necessária revisão do conceito
  de artista colonial formulado pela História e Crítica da Arte Modernista. Entende-se
  que o pressuposto teórico de tal conceito é o conceito romântico do artista-gênio
  criador de obras originais. Como o conceito de artista gênio é extemporâneo ao período
  colonial, busca-se diferenciar as noções românticas de gênio e originalidade das
  categorias humanistas de engenho e novidade. Entende-se que estas últimas foram,
  de fato, as que vigoraram no universo artístico colonial.
