abstract: Alemanha desenvolveu, desde o final do século XIX e ao longo do século XX,
  significativa tradição na realização de exposições de arquitetura. Essas objetivam
  divulgar expressões de vanguarda cultural produzidas no país em termos de arquitetura
  e de planejamento urbano. As diversas exposições realizadas foram peças fundamentais
  no processo de afirmação da arquitetura moderna no país. É através da difusão destes
  projetos relacionados com habitação social que a fórmula ensaiada de modo pioneiro
  nos anos 20 e que, ao longo dos 30 se impôs como solução canônica ao problema da
  moradia moderna, se consolida. Este artigo objetiva, partindo de uma análise das
  mais significativas exposições de arquitetura moderna realizadas na Alemanha, verificar
  os prováveis vínculos entre estes eventos e a fundação e conseqüente difusão da
  arquitetura moderna no país e na Europa. A primeira exposição a ser analisada, realizada
  em 1901 em Darmstadt, já expressava de forma clara essas manifestações de vanguarda.
  Já em 1910, desenvolveu-se, em Berlim, a Exposição Geral de Urbanismo, que objetivou
  realizar um planejamento global de reestruturação do crescimento desordenado da
  cidade. As duas exposições seguintes, a Deutsche Werkbund Ausstellung de 1914 em
  Colônia e a Weißenhofsiedlung de 1927 em Stuttgart, foram promovidas pelo Deutsche
  Werkbund, onde está a ascendência mais próxima da Bauhaus. Em 1931, a Deutsche Bauausstellung,
  em Berlim, dá continuidade às questões de cunho habitacional levantadas nos anos
  anteriores, enquanto a Interbau, realizada em 1957 em Berlim, exemplificou o que
  de melhor a arquitetura e o urbanismo modernos ofereciam em termos de habitação
  social. O trabalho busca, com isso, auxiliar na consolidação da idéia de que o programa
  de habitação coletiva e social encontra-se na origem das bases do projeto moderno
  na Alemanha, e que seus resultados influenciaram uma série de realizações semelhantes
  ocorridas posteriormente, na Alemanha e no restante da Europa.
