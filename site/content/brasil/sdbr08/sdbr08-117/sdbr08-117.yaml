abstract: Em Minas Gerais, a partir dos anos 1930, a discussão dos problemas urbanos
  não se limitava à capital do estado, Belo Horizonte. Percebe-se que a busca de uma
  linguagem moderna, que impõe-se à Capital Mineira repercutiu pelas cidades do interior.
  A modernidade já anunciada com o art déco - conhecido como estilo cubista, futurista
  ou simplesmente moderno –, inicialmente, em intervenções pontuais alterou a fisionomia
  dos centros urbanos. O contraste entre a tradição e a contemporaneidade, esta última
  representada por linguagens cada vez mais desatreladas do historicismo, foi marcante
  para a transformação das cidades. O ambiente cultural propício à introdução de novas
  idéias foi ampliado com a fundação da Escola de Arquitetura, em 1930, por um grupo
  de arquitetos, iniciativa que contou também com a colaboração de artistas, advogados,
  engenheiros e médicos. Em 1933, integrando comissão com o intuito da modernização
  das cidades balneárias, Lincoln Continentino desenvolveu plano de conjunto para
  área de expansão da cidade de Araxá, compreendida pelo Barreiro do Araxá. Este plano
  atendia, assim aos interesses do Governo do Estado na remodelação geral da Estância
  Hidromineral desta cidade balneária. O projeto para as instalações de hospedagem
  e para as termas foi desenvolvido por Luiz Signorelli, um dos fundadores da Escola
  de Arquitetura. Já em 1945, Francisco Bolonha desenvolveu o projeto para a implantação
  de equipamentos públicos em um extenso parque, sendo que o paisagismo ficou a cargo
  de Roberto Burle Marx. A linguagem adotada revela uma proximidade conceitual com
  a Pampulha de Niemeyer, particularmente no que se refere à Casa do Baile, que remete
  ao início dos anos 1940. A solução definida em concreto armado, com sinuosidades
  e pilares estruturais em forma circular, com cobertura em laje plana, inserida na
  margem de um lago, emoldurada pelos jardins de Burle Marx, disputa a cena com o
  partido monumental elaborado por Signorelli. Este conjunto encontra-se protegido
  por tombamento pelo município, através da Fundação Cultural Calmon Barreto e, pelo
  estado, através do Instituto Estadual do Patrimônio Histórico e Artístico - IEPHA.
  Esta proteção, no entanto, não garante a integridade do complexo balneário. Intervenções
  recentes para adequação aos novos usos – em vista da privatização pelo arrendamento
  por parte da rede Ourominas, que transformou o Grande Hotel e as Termas em um resort
  – interferem na ambiência do conjunto, além da conservação precária dos equipamentos
  e dos jardins, particularmente dos equipamentos projetados por Bolonha que compõem
  a Fonte Andrade Júnior. Pretendemos explorar neste trabalho a emergência da restauração
  da Fonte e discutir questões relacionadas aos critérios para a conservação e o restauro
  do conjunto, na atualidade. Neste sentido, buscaremos evidenciar os dilemas para
  a preservação deste complexo balneário – referência fundamental para a Arquitetura
  e o Urbanismo modernos em Minas Gerais – na realidade expressa pela cidade de Araxá.
keyword: Urbanismo Moderno; Minas Gerais; Documentação
