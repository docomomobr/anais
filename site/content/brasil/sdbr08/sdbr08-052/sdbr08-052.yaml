abstract: Olhar para a cidade a partir de seus edifícios para compreensão do processo
  urbano é o percurso proposto pelo encaminhamento desta pesquisa. Nesse sentido,
  a polêmica inserção da arquitetura moderna paulista no centro histórico de cidades
  médias é analisada integrando as perspectivas de Vilanova Artigas e Henry Lefèbvre.
  Assim, o ausente é a cidade que se nega como fenômeno social, a presentificação
  é o desenho (desígnio) e a superação é o projeto. Então, da percepção para a cognição
  do espaço urbano, passando pelas relações do lote e a rua, do público e o privado,
  da centralidade e o lugar, do conservador e o moderno, do clientelismo e as relações
  de poder, discuto o discurso e a prática dessa arquitetura. Esse desígnio se concretizou?
  A obra está fora do lugar? Com o apoio da linguagem do desenho e suas representações,
  no processo da práxis do urbanismo, mediado pela função social do urbanista, faço
  uma reflexão sobre a cidade concebida, vivida e apropriada, e do arranjo possível,
  portanto, da cidade da memória, da imaginação e a ser denunciada. A forma da cidade
  possui um conteúdo não utilizado a ser revelado. Portanto, a cidade é o lugar das
  possibilidades; sendo assim, a cidade da imaginação possibilita uma perspectiva
  da realização do desígnio de Artigas.
