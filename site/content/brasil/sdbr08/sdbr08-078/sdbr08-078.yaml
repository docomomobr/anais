abstract: A obra e a figura de Fábio Moura Penteado ocupa um espaço importante, ainda
  que meio oculto, no cenário da arquitetura moderna paulista e, portanto, brasileira
  em geral. Seu trabalho, que se inicia em 1953, se desenvolve em meio a um período
  convulso da história do Brasil, marcado por turbulências políticas, explosão urbana
  e rediscussão das estratégias da arquitetura nacional. O arquiteto tem declarada
  sua preocupação pela questão das multidões urbanas. No seu projeto, o termo transcende
  a questão meramente quantitativa para assumir uma dimensão humana maior, ligada
  à condição individual no meio metropolitano, da personalidade massificada, da realidade
  do habitante que não chega a cidadão. Ao transferir essas preocupações para o projeto
  de arquitetura, surgem lugares que promovem o encontro, o convívio e o reconhecimento
  mútuo entre os habitantes da cidade, como meio de se opor à atomização que geralmente
  induz o meio urbano. Os espaços idealizados pelo arquiteto são praças, entendidas
  em seu sentido mais abrangente e inclusivo. Ao ser o espaço público por excelência,
  o conceito de praça engloba o número e o significado do povo, acolhe o trato comum
  entre os vizinhos, o mercado, a festa popular. A arquitetura de Fábio Penteado quer
  fazer aflorar a riqueza da vida diversa que a urbanidade contém, mas que se esconde
  sob a deturpação causada pela falta de planejamento, de oportunidades, de fruição
  e de humanidade. Em um exercício de escala adequado às dimensões do horizonte metropolitano,
  sua arquitetura quer criar os pontos de referência que a paisagem amorfa da cidade
  não oferece. Sua obra se confunde com a experiência da chamada “Escola Paulista”,
  dentro da qual se reconhece e se desenvolve com grande liberdade formal e propositiva,
  sugerindo a rediscussão dos cânones que a caracterizam em favor de um reconhecimento
  maior de sua diversidade.
