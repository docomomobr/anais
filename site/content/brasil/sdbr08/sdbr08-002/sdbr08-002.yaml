abstract: 'Pretende compreender os painéis de Campina Grande-PB (décadas de 1950 e
  1960), a partir das abordagens conhecidas sobre os murais modernos no Brasil e de
  um apanhado geral sobre o projeto modernista na construção de uma Arte Nacional,
  tendo a questão do muralismo como extensão do projeto de construção do moderno como
  cultura. Entender a configuração dos painéis de Campina Grande a partir da comparação
  com painéis consagrados pela bibliografia especializada do Brasil torna-se difícil,
  talvez impraticável, se esse tema da difusão for pensado como simples acepção de
  expansão geográfica. Inseri- los nos debates coetâneos que se manifestavam no país
  e refletir sobre o momento em que essa cidade buscava consolidar seu ideário de
  modernidade e progresso, podem elucidar algumas questões em aberto sobre a temática.
  Dessa maneira, o texto está estruturado a partir de três abordagens: a questão da
  Identidade Nacional e das relações entre Estado e projeto modernista na construção
  de uma arte brasileira; um histórico das origens do muralismo no Brasil e sua inserção
  no projeto de construção do moderno como cultura, perpassando os debates sobre a
  “síntese das artes” no Movimento Moderno; e a aproximação dessas reflexões no contexto
  de Campina Grande, através de cinco pinturas murais encontradas em edificações construídas
  no período mencionado, numa tentativa de resgatar as relações que se estabelecem
  entre arte e arquitetura nesses exemplares e incitar o debate para além dos grandes
  centros metropolitanos.'
keyword: síntese das artes. Campina Grande. Murais modernos
