abstract: O trabalho apresenta os resultados de uma investigação que desvenda a singularidade
  na elaboração do projeto de Oscar Niemeyer para o Edifício Itatiaia em Campinas
  inserindo-o na história da arquitetura moderna brasileira. Concluído o estudo preliminar
  do edifício, Oscar Niemeyer impôs o nome do calculista Werner Müller para desenvolver
  o projeto estrutural, trabalho este realizado no ano de 1952 e que permitiu o recurso
  da laje de transição no primeiro andar, tão cara aos modernos. A estrutura do Edifício
  Itatiaia, que recorre a lajes tipo caixão-perdido em todos os 15 pavimentos e é
  única em Campinas explica a imposição por parte de Niemeyer de um calculista de
  seu círculo profissional. A pesquisa, pautada na análise dos projetos estruturais
  dos edifícios habitacionais verticais construídos em Campinas nas décadas de 1950
  e 1960, até então identificados como veiculadores de uma linguagem moderna, revelou
  o caráter singular do Ed ifício Itatiaia, pois desvenda como se procedia ao cálculo
  estrutural dos que, embora mantendo a solução estrutural antiga, fizeram recurso
  à linguagem do movimento moderno. Os resultados das pesquisas permitiram ações no
  campo da preservação do patrimônio arquitetônico moderno e subsidiará a formulação
  do memorial justificativo para o pedido de tombamento do Edifício Itatiaia junto
  ao CONDEPACC- Conselho Municipal de Defesa do Patrimônio de Campinas.
keyword: Oscar Niemeyer; projeto estrutural; linguagem da arquitetura moderna
