abstract: 'A arquitetura da cidade de Anápolis sofreu grandes transformações durante
  a construção de Goiânia e de Brasília, período em que essa cidade funcionou como
  entreposto para os construtores destas novas cidades. Sua localização geográfica
  estratégica, entre estas cidades, e o seu desenvolvimento econômico, na época, o
  maior centro comercial de Goiás, a tornou um ponto de convergência de pessoas e
  decisões que estavam mudando a realidade econômica local e por conseqüência a realidade
  social, arquitetônica e urbanística, não só do Centro-Oeste, mas do Brasil. A cidade
  de Anápolis, que possuía até então feições arquitetônicas predominantemente ecléticas,
  passou a ser influenciada pelos ideais de modernidade, racionalidade e renovação
  das duas novas capitais, o que contribuiu para uma nova produção arquitetônica na
  cidade, a qual se manifestou principalmente nas residências. Apesar da qualidade
  arquitetônica inegável, dessas moradias e do número elevado de exemplares existente,
  ainda não há estudos sobre as casas modernistas produzidas em Anápolis durante esse
  período. Pesquisas nesta linha têm-se mostrado muito importantes no campo da história
  da arquitetura, a qual traria informações como a origem dessas casas, o contexto
  em que foram concebidas, os seus arquitetos e a sua conformação espacial, contribuindo
  diretamente com os estudos sobre a produção modernista no Brasil. A historiografia
  corrente, que trata dessa produção no Centro-Oeste, se limita a Brasília e Goiânia,
  justamente as duas capitais que tanto influenciaram a arquitetura modernista de
  Anápolis e que acabam por sombreá-la, a tornando invisível aos olhos dos historiadores.
  Diante dessa lacuna documental e histórica o presente trabalho se propõe, em um
  primeiro instante, a revelar esses exemplares arquitetônicos, ainda inéditos na
  historiografia, por meio de levantamentos fotográficos e em um segundo momento realizar
  um estudo mais aprofundado dos mesmos, do qual fazem parte: visitas às residências;
  confecção de peças gráficas e conseqüentemente sua análise; levantamento de dados
  históricos e entrevistas com os moradores, no intuito de se construir o quadro da
  arquitetura residencial moderna anapolina. Tal trabalho contribuirá no descortinamento
  dos bastidores do modo de viver de pessoas que estiveram direta ou indiretamente
  envolvidas com o processo de mudanças que essa região viveu, adicionalmente cumprirá
  o seu principal papel de identificar as transformações espaciais, estruturais e
  formais ocorridas nas casas em função das influências externas e as origens arquitetônicas
  a elas associadas. Por todo o exposto acredita-se contribuir assim para o enriquecimento
  da historiografia vigente que há tempos lança o seu olhar sobre essa região para
  falar da qualidade arquitetônica dessas duas capitais, Brasília e Goiânia, e dos
  seus respectivos projetos urbanos, mas que poderá contar a partir desse trabalho
  com informações que ampliarão a sua visão sobre a produção modernista no Centro-Oeste
  do país.'
keyword: Anápolis; casa modernista; historiografia
