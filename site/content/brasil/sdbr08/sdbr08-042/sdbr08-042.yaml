abstract: 'Este trabalho aborda a maneira como o movimento moderno na America Latina
  foi difundido em duas publicações do Museum of Modern Art (MoMA): Brazil Builds:
  Architecture New and Old (1943) e Latin American Architecture since 1945 (1955).
  Nessas publicações os historiadores e críticos da arquitetura norte-americanos apresentaram
  uma hipotética difusão da arquitetura moderna na América Latina. A revisão dessa
  literatura na contemporaneidade nos apresenta as seguintes perguntas: a arquitetura
  latino- americana estava realmente de acordo com as questões da modernidade internacional?
  Ou para os historiados e críticos americanos e para os arquitetos locais tudo isso
  não passou de uma modernidade inventada?'
