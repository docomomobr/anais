abstract: A relação entre os espaços modernos e as soluções estruturais que os tornaram
  possíveis é, com freqüência, identificada com a questão do plano livre corbusiano.
  Se nele vemos representado o esforço de liberar o espaço arquitetônico, observamos
  também certa simplificação do papel da estrutura, algo especialmente verdadeiro
  no paradigma do sistema Dom-ino. A própria obra de Le Corbusier aponta para uma
  maior complexidade do problema. Ainda assim, o plano livre sintetiza uma série de
  esforços da época, entre os quais o desejo de convergir espaço arquitetônico e necessidades
  sociais – problema que oscilará entre o determinismo de certas correntes políticas
  e o funcionalismo. Um desenho de Oscar Niemeyer publicado em Works in Progress (1956),
  no qual a figura humana é justaposta a diferentes soluções estruturais, demonstra
  que a vontade de síntese permanece como um problema central no pós-guerra. A imagem
  é acompanhada de um diagrama que propõe a arquitetura como resultante da convergência
  entre “possibilidades técnicas” e “condições sociais”. Esta equação, que permanecera
  frágil durante as décadas anteriores, será objeto de uma profunda revisão na década
  seguinte por parte de Lina Bo Bardi, entre outros. O desejo de utilizar a técnica
  para viabilizar as condições sociais permanecerá; o que muda é a percepção de que
  as atividades humanas desenvolvem-se, às vezes, ao largo, ou mesmo apesar da arquitetura.
  Estas são as heterotopias dos anos 60. Dois projetos recentes – a Biblioteca Pública
  de Seattle, de Rem Koolhaas, e a Midiateca Sendai, de Toyo Ito – retomam o legado
  do plano livre e possibilitam seu desdobramento através de soluções estruturais
  singulares. A análise desses exemplos contemporâneos permite rever aspectos da espacialidade
  moderna.
keyword: Arquitetura Moderna – Estruturas; Plano Livre; Heterotopia
