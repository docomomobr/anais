abstract: Este artigo procura estabelecer relações temáticas e compositivas entre
  a Cidade Contemporânea para 3 Milhões de Habitantes, modelo de cidade apresentado
  por Le Corbusier em 1922, e a pintura purista de Jeanneret, verdadeiro nome do arquiteto
  franco-suíço com o qual assinava suas telas. São investigadas as relações entre
  os discursos e práticas do arquiteto-pintor em ambos os campos de atuação e o intercâmbio
  de experiências entre eles. O purismo foi uma vanguarda artística pós-cubista fundada
  por Jeanneret e Ozenfant cujo principal forma de divulgação foi a revista L’Esprit
  Nouveau, editada na década de 1920. Trabalhava com temática figurativa mas selecionando
  como tema determinados objetos-tipo como garrafas, pratos e instrumentos musicais.
  Para os puristas, estes objetos já haviam passado por um processo de aprimoramento
  da forma regido pela lei de seleção mecânica, que considerava que a forma de um
  objeto seria gradualmente evoluída em direção a um ponto ideal entre a máxima utilidade
  do objeto, atendimento eficiente de suas funções, e a máxima economia de produção.
  Segundo esse princípio, a forma evoluída tenderia invariavelmente à conformação
  com as leis da natureza e da geometria. Além da escolha dos objetos representados,
  a organização dos mesmos na tela purista segue uma estrutura igualmente baseada
  na geometria, na simetria e na proporção áurea. Consideram os puristas que a beleza
  surge da geometria, em primeiro lugar porque expressa a razão, a organização e o
  domínio sobre o caos. Por outro lado, estando o corpo humano, a natureza e o universo
  construídos sobre leis geométricas, o homem reconhecerá na arte assim concebida
  a mesma estrutura superior que rege seu próprio corpo, e por isso ela lhe será bela.
  Da mesma forma, no processo de composição de sua Cidade Contemporânea, Le Corbusier
  concede-se um terreno plano, como uma tela branca a ser pintada, e nele dispõe seus
  edifícios sobre uma estrutura geométrica, baseada na simetria e na proporção áurea,
  como se distribuindo objetos-tipo em uma tela purista. Na realidade, para o arquiteto,
  seus módulos habitacionais e seus arranha-céus são eles mesmos habitações-tipo e
  torres-tipo, uma vez que tiveram sua forma aprimorada segundo a lei de seleção mecânica,
  ou seja, sua forma correspondia à sua máxima utilização, garantida por uma visão
  funcional do objeto arquitetônico, enquanto o sistema modular de estrutura pré-fabricada
  atingia maior economia no processo de produção através da substituição dos ultrapassados
  métodos da construção civil pela moderna produção industrial fordista. A intercambialidade
  de métodos e procedimentos entre o arquiteto e o pintor, duas faces do mesmo artista
  moderno, faz com que Le Corbusier atribua à sua arquitetura os mesmos valores de
  eternidade, verdade e legítima modernidade atribuídos à sua vanguarda pictórica.
  O artigo encerra-se analisando esses desdobramentos na tentativa de abordar o urbanismo
  da Cidade Contemporânea pelos olhos do pintor Jeanneret e das artes plásticas.
keyword: Le Corbusier; urbanismo; purismo; modernismo
