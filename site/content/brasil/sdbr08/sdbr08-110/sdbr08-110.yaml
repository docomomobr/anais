abstract: 'O Modernismo pode ser definido como um movimento estético surgido na década
  de 20 do século passado, notadamente caracterizado por uma nova visão de mundo e
  por uma mentalidade inovadora, expressas nas artes plásticas, na literatura e na
  arquitetura. A cidade e a arquitetura assumem papéis especiais e devem espalhar
  uma nova ordem. A modernização, o embelezamento, o saneamento significam credibilidade,
  investimentos e mão-de-obra qualificada. Podemos dizer que a arquitetura moderna
  brasileira nasceu no Ministério da Educação e Saúde, Rio de Janeiro em 1937; mas
  foi batizada, na Pampulha, capital mineira em 1942. O projeto de Oscar Niemeyer
  deu início a história da arquitetura moderna em Minas Gerais. Os arquitetos mineiros
  se voltaram para o novo vocabulário de formas e caminhos abertos, e isso se repercutiu
  em algumas cidades menores do interior mineiro, dentre elas: Viçosa, que se esforçava
  em seguir as pegadas das capitais. O processo de reprodução pode ser refletido no
  espaço da cidade através da propriedade privada do solo, que transforma o espaço
  em raridade. Este processo ocorreu e ainda vem ocorrendo em cidades mineiras de
  médio porte com uma velocidade assustadora, e isso, causando alguns danos aos poucos
  exemplares da arquitetura moderna na região da Zona da Mata Mineira. O trabalho
  tem como objetivo problematizar a falta de preservação de certos edifícios, em especial
  as residências unifamiliares, e a forma de uso e ocupação do solo em algumas cidades
  do interior mineiro. Os exemplares de edifícios encontrados são importantes na história
  da arquitetura moderna brasileira e estão seriamente ameaçados a desaparecer. Pretendemos
  tomar parte do debate sobre a preservação da arquitetura e do urbanismo modernos
  a partir da produção/reprodução do espaço urbano, enfrentando as formas de uso e
  ocupação do solo nas cidades contemporâneas. Preservar ou Produzir?'
