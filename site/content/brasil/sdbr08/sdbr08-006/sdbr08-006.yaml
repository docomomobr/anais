abstract: 'O presente trabalho tem por objetivo o estudo acerca da produção paisagística
  brasileira, especificamente no que se refere à obra do paisagista Ney Dutra Ururahy,
  cujo acervo constitui uma riqueza ainda não documentada, pois possui apenas os registros
  originais manuscritos de suas obras. Através da pesquisa intitulada “Caracterização
  da produção do paisagista Ney Ururahy” pretendeu-se levantar e catalogar essa produção,
  digitalizando-a, a fim de alimentar um banco de dados que servirá de fonte de pesquisa
  para estudantes, professores e pesquisadores da área. O paisagista Ney Ururahy iniciou
  seu trabalho em Brasília durante o modernismo, quando foi responsável pela implantação
  de alguns projetos de Burle Marx. Seguiu as mudanças do paisagismo até os dias atuais,
  criando uma linguagem de projeto própria, que incorporou características desses
  diferentes períodos. Ney Ururahy tem projetos desenvolvidos em residências, jardins
  suspensos, aeroportos, universidades, hotéis, clubes, sítios, fazendas, edifícios
  residenciais e embaixadas, muitos deles projetados e construídos durante o Modernismo.
  Ney Ururahy, aos 86 anos e em plena produtividade, é um nome de grande importância
  para o paisagismo brasileiro, sendo responsável, atualmente, dentre outros, pelo
  projeto dos espaços livres em um projeto de Oscar Niemeyer em Brasília. A observação
  de projetos paisagísticos de Ney Ururahy permitiu a coleta de dados para a análise
  da paisagem por meio do estudo de uma de suas manifestações: a identificação de
  aspectos relevantes à construção de espaços livres de edificação. Ao examinar seus
  projetos e confrontá-los ao entorno, é revelada uma linha de pensamento que identifica
  a combinação entre o projeto paisagístico e a vizinhança – característica da produção
  moderna e contemporânea.'
keyword: paisagismo; paisagista; espaços livres de edificação
