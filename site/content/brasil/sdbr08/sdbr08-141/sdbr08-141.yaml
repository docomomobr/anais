abstract: O artigo apresenta uma pesquisa que se baseou em estudos de autores ligados
  às áreas de arquitetura, arte pública, sociologia, filosofia, antropologia e psicologia,
  reforçando a interdisciplinaridade do tema, que trata da presença de arte no metrô
  e alguns aspectos de interações das obras de arte com o público que utiliza as estações,
  como um possível recorte de estudos sobre conceitos de arte pública.
