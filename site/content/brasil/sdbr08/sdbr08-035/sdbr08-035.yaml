abstract: O trabalho aborda a busca da síntese das artes pelo movimento moderno, suas
  rupturas, desdobramentos e paradoxos na cidade contemporânea. A primeira seção,
  “A flor e o cristal lapidado”, apresentará diferentes conceitos de síntese das artes
  do movimento moderno, antes e depois da segunda guerra. Serão discutidas e ilustradas
  visões contraditórias sobre a colaboração entre urbanismo, arquitetura, escultura
  e pintura. A segunda seção “Por que os construtivos não usaram black tie ?” apresentará
  as concepções sobre a síntese das artes dos críticos, artistas e arquitetos participantes
  do Congresso Extraordinário Internacional de Críticos de Arte de 1959, no Brasil.
  Serão também levantadas hipóteses sobre a não participação dos artistas construtivos
  na edificação de Brasília e sobre peculiaridades do projeto construtivo e do movimento
  moderno brasileiros. A terceira seção “Entre a redenção e a rendição” abordará o
  confronto das artes com o movimento moderno durante as décadas de 60, 70, 80 e 90.
  E sublinhará alguns paradoxos das artes na cidade contemporânea, particularmente
  do uso de grafites, instalações e intervenções para a espetacularização e gentrificação
  de determinadas áreas urbanas.
keyword: síntese das artes; movimento moderno
