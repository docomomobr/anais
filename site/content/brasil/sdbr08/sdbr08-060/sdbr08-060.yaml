abstract: 'A circulação de jovens arquitetos constituiu num vetor de expansão de novas
  idéias no Brasil em meados do século XX, o que impulsionou o aparecimento de grandes
  empreendimentos da ordem modernista. A partir da década de 1960 a capital do estado
  do Paraná, Curitiba, foi também “invadida” por arquitetos de todas as partes, com
  destaque para um grupo de egressos da Universidade Mackenzie, que perceberam uma
  oportunidade e elegeram um ideal: alçar novas possibilidades profissionais, buscando
  um reconhecimento do meio intelectual e arquitetônico através da participação em
  concursos de arquitetura, imagem que consolida-se a partir de 1962. Este trabalho
  pretende debater a colaboração dos arquitetos paulistas e suas obras na ampliação
  do panorama da arquitetura moderna brasileira desse período, muito devido à migração
  desses arquitetos no início da década de 1960. O foco da análise é o primeiro grande
  trabalho realizado pelo grupo, a sede do Clube Santa Mônica (1962), que determinou
  seus destinos no momento seguinte, considerando também o projeto de maior prestígio
  nacional realizado por esses “novos” arquitetos paranaenses: o edifício sede da
  Petrobrás (1968), no Rio de Janeiro.'
