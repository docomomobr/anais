abstract: A arquitetura e a arte moderna estiveram associadas à idéia de um re-ordenamento
  da sociedade. Processos estes que levaram à discussão da dimensão social no programa
  destas duas vertentes do modernismo brasileiro. No Brasil, a questão social foi
  precedida pela idéia do nacional desenvolvimentismo, quando entra em voga a discussão
  da adoção de uma cultura nacional como elemento estrutural da uma aspirada identidade
  brasileira. Fez-se necessário então a busca pelas raízes de “qualidades positivas”
  e passíveis de legitimar o estado-nação no país. Configura-se a partir daí uma reação
  romântica frente à modernização vigente, tornando pertinente a busca de um “saber”
  popular que legitimasse a nação como referência para viabilizar o progresso. A arte
  brasileira segue este anseio por renovação, que surgiu apenas em meados da década
  de 1920, onde artistas procuravam não apenas absorver as influências européias,
  mas também adaptá-las de maneira coerente com a realidade social brasileira. Seguindo
  o ideário dessa almejada identidade, artistas buscam por uma nova linguagem, tanto
  escrita quanto visual que fornecesse subsídio para tal. Desde então, as noções de
  “espontaneidade” e “resistência” enquanto manifestação das “camadas populares” destacam-se
  no âmbito da vida cotidiana contemporânea e na concretização da multiplicidade de
  tempos sociais. O ato de se executar o graffiti sobre os espaços públicos da cidade
  e/ou sobre os muros privados sem prévia autorização configura-se como uma ação ilícita
  que vai contra a lei de apropriação indevida desses espaços, mas também de uma arte
  autônoma e descompromissada com o mercado. O graffiti surge dentro do universo da
  transgressão nas ruas e vai colocar em questão o regime de coordenadas que correntemente
  distribui as relações entre escrita, desenho e suporte. Configura um modo próprio
  de subjetivar-se no mundo e de intervir em seu mosaico sócio-cultural. É sob essa
  ordem de transgressão urbana que o graffiti vem sendo percebido continuamente e
  inserido no contexto de periferia das metrópoles, tornando-se uma grande questão
  cultural no Brasil. Ele está dentro e fora dessa voga em que, de forma generalizada,
  todas as atividades cotidianas ou não, viraram objeto ou expressão de cultura. A
  cidade, enquanto objeto cultural é mercantilizada e, portanto, vinculada á emergência
  de novos e complexos processos de acumulação. O termo „graffiti‟ é entendido como
  algo próximo, familiar, e muitas vezes banalizado quando, no entanto, por trás dele
  existe toda uma complexidade histórica que se desdobra em diversas dimensões. O
  Graffiti se encontra no cruzamento de várias políticas institucionais, que passam
  pela política compensatória neoliberal, pelo novo assistencialismo (ONGs que fazem
  seus trabalhos com jovens de periferia), e assim também serve como matéria prima
  para o circuito artístico e a indústria cultural. Nesse contexto contemporâneo,
  pretende-se sondar as formas de textualização do graffiti no meio ambiente construído
  da cidade contemporânea e entender como essa manifestação se insere no imaginário
  urbano. As diversas formas de apropriação desse fenômeno e sua influência no processo
  evolutivo da cidade fazem parte desta proposta em andamento, de levantar e mapear
  as dimensões então envolvidas.
keyword: graffiti; arte urbana; arte contemporânea
