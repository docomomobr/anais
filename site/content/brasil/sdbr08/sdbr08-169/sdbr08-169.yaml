abstract: 'Este texto discute os principais desafios que temos pela frente em relação
  à conservação da arquitetura moderna. Nos últimos quinze ou vinte anos, assistimos
  muitos casos de intervenções e restaurações de edifícios modernos, algumas bem sucedidas
  e outras que comprometeram irreversivelmente o valor dos bens. O envelhecimento
  dos edifícios modernos e as intervenções que estão sendo feitas colocam uma série
  de desafios que merecem uma reflexão mais cuidadosa. Estes desafios referem-se a:
  1) a própria atenção que arquitetos modernos dispensaram à funcionalidade que, conjugada
  com a rápida obsolescência funcional, traz dificuldades para se encontrar e introduzir
  novos usos; 2) a dimensão material do edifício que inclui problemas como o uso de
  materiais novos sem tradição construtiva, o uso de materiais tradicionais de forma
  inovadora, a falta de entendimento do desempenho dos materiais a longo prazo, as
  falhas na construção, os problemas de detalhamento e o uso de materiais fabricados
  em série; 3) os sistemas infra-estruturais (aquecimento, ar condicionado, água,
  eletricidade, etc), que precisam ser substituídos para que o edifício continue em
  uso, o que geralmente acarreta problemas de adequação; 4) a ausência de uma cultura
  da manutenção, que afeta diretamente os edifícios modernos; 5) a dificuldade de
  aceitação da pátina nos edifícios modernos, visto que os materiais e superfícies
  reluzentes das publicações de época fizeram com que os sinais deste envelhecimento
  não fossem compreendidos como um valor; 6) as dificuldades enfrentadas pelos conjuntos
  habitacionais que não conseguiram acompanhar as transformações sociais como o envelhecimento,
  enriquecimento e empobrecimento de suas populações; e 7) os problemas existentes
  no reconhecimento e tombamento desta arquitetura. Apesar de estes desafios questionarem
  o arcabouço teórico da conservação, não acreditamos que a conservação da arquitetura
  moderna deva ser diferente da conservação de obras de um passado mais distante.'
