abstract: O papel das viagens de estudo para a formação cultural de Le Corbusier já
  é bastante conhecido. Mas ao mesmo tempo, o grande número de desenhos, repletos
  de detalhes e sugestões que o jovem Jeanneret produziu durante esse período, é um
  valioso legado que pode nos levar a refletir de forma mais alargada, sobre a arquitetura
  e um mundo de formas, sobre a cidade e seu desenho; que nos pertence como herança;
  colocando-nos diante de questões importantíssimas que dizem respeito à educação
  e a formação de arquiteto. Em suas viagens de estudo, diante de paisagens, cidades,
  edifícios e pessoas, acostumou-se a fazer vários desenhos e encher cadernos e cadernos
  de notas, com croquis e comentários de toda ordem. Transformando esse seu confronto
  direto com a obra em prerrogativa de trabalho que supera o momento de formação para
  permanecer como estratégia ao longo de sua atuação profissional. Seus inúmeros desenhos
  de observação se transformam ao longo de suas viagens, tanto quanto o seu olhar.
  Revisitando hoje esse percurso e lendo alguns dos desenhos e textos de sua primeira
  viagem de 1907, procuramos nas obras que, mais fortemente tocam Jeanneret a determinação
  do momento de constituição de uma particular alternativa de abordagem, análise e
  idéia da arquitetura. Suas anotações, croquis e desenhos surgem assim, como lampejos,
  iluminando aspectos ainda obscuros ou promovendo novos e possíveis vínculos.
keyword: Arquitetura moderna; Representação; Formação
