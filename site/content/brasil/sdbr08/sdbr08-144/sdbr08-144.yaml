abstract: Trata-se do levantamento dos projetos urbanísticos elaborados após o desmonte
  o Morro de Santo Antônio, no Centro da cidade do Rio de Janeiro. Estes projetos
  foram publicados durante três décadas, de forma intercalada, sendo que dos três
  o que mais determina as feições viária da esplanada é a proposta modernista de Affonso
  Eduardo Reidy, embora em termos construtivos, a realidade criada décadas mais tarde,
  tenha sido completamente diferente. Este artigo busca entender as razões de tamanhas
  alterações, concluindo tratar-se de uma proposta que poderia ter feito sentido quando
  o Rio de Janeiro era capital da República brasileira, mas perde consistência no
  período em que a cidade perde esta condição.
