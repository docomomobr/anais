abstract: 'Este estudo tem como eixo central a análise do processo de elaboração do
  (possível) plano urbanístico definitivo da Cidade anexa à Base Naval de Aratú em
  Salvador. Marcadamente um processo, pois se configura pela elaboração de cinco proposições
  realizadas pelos engenheiros urbanistas José de Oliveira Reis e Stelio Moraes no
  início da década de 1950. O primeiro plano, denominado de “Esquema Geral do Plano
  Diretor”, cuja elaboração estava sob a responsabilidade da Companhia Brasileira
  de Engenharia (chefiada pelo engenheiro Eduardo Agostini), foi apresentado ao Chefe
  da Comissão Construtora da Base Naval de Aratú em 1951. Outros três planos são elaborados
  no âmbito de atuação do Consórcio Técnico de Planejamento (COTEPLA – Ltda), criado
  em 1952 como uma “Sociedade por Quotas de Responsabilidade”, figurando entre suas
  empresas a Urba Sociedade de Urbanismo e Arquitetura (chefiada por José de Oliveira
  Reis) - responsável pelos três planos urbanísticos apresentados no relatório “O
  Problema da Habitação do Pessoal Civil e Militar da Base Naval de Aratú”, cujas
  denominações representam conceitualmente suas concepções: “concentração numa cidade
  naval”; “dispersão na cidade de Salvador” e “dispersão ao longo das vias de acesso”.
  Particularmente no plano definido pela “concentração numa cidade naval” existe uma
  explícita interlocução dos engenheiros com os pressupostos do urbanismo modernista,
  por definirem que esta concentração “urbanisticamente se enquadra dentro dos princípios
  da Carta de Atenas que estabelece a última ligação entre: habitação, trabalho, circulação
  e recreação”. Um quinto plano foi elaborado pela Urba Ltda no relatório “Urbanismo
  – Plano da Cidade Anexa à Base, na Península do Paripe”. Neste, a solução pautou-se
  pela elaboração de um plano urbanístico de cidade anexa à Base, cujo critério adotado
  foi o da “construção da cidade próxima à Base”, recuperando uma das especificidades
  do plano definido conceitualmente pela “Concentração numa Cidade Naval”: proximidade
  com a Base.'
keyword: Engenharia; Urbanismo Moderno; Cidade Moderna
