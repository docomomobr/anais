abstract: O artigo trata da análise arquitetônica do Edifício “Banco Sul-Americano
  do Brasil”, projetado entre 1961 e 1963, de autoria do escritório Rino Levi Arquitetos
  Associados, elaborado a partir do trabalho de “Investigación I”, do Doutorado em
  “Proyectos Arquitectónicos, Línea 1 – La Forma Moderna, ETSAB/UPC (Escuela Técnica
  Superior de Arquitectura de Barcelona de la Universidad Politécnica de Cataluña).
  Tal análise é feita a partir do método do re-desenho, colocando-se no ponto de vista
  do projetista, esforçando- se para experimentar o projeto através da solução dos
  seus problemas, cálculos e ajustes, evitando vê-lo como resultado de uma inspiração
  ou idéia, e buscando identificar o problema projetual que foi relevante para o autor,
  com o objetivo de destacar as principais contribuições arquitetônicas, de maneira
  que, além de documentar um exemplo de edifício considerado até hoje marco expressivo
  da arquitetura moderna paulista, possa servir de modelo para projetos atuais, não
  no sentido de mera cópia, mas como exemplo de critérios projetuais dentro da linguagem
  moderna a serem seguidos, investigados e desenvolvidos. A qualidade arquitetônica
  do edifício justifica o seu estudo e documentação, ainda que tenha uma clara vinculação
  formal com a Lever House (Gordon Bushaft, New York, 1952) o projeto do edifício
  é totalmente adequado às condições técnicas, sociais e climáticas de onde está inserido,
  sendo hoje considerado pelo IPT (Instituto de Pesquisa Tecnológica da Universidade
  de São Paulo) como o edifício mais eficiente em consumo elétrico da Avenida Paulista,
  pois mesmo tendo suas principais fachadas em situação desfavorável em relação ao
  sol, devido ao tratamento das fachadas com brise-soleil, praticamente não é necessário
  o uso de ar-condicionado. E as qualidades arquitetônicas inerentes a ele justificaram
  há pouco tempo uma reforma para a construção de outro subsolo com o objetivo de
  aumentar o número de vagas de estacionamento, obra de elevado custo em um edifício
  já construído.
