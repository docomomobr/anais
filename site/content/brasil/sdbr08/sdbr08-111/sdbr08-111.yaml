abstract: O artigo trata do paralelismo e divergência entre o Brasil, que exerce uma
  atracção singular sobre os arquitectos portugueses desde o início do moderno, e
  as colônias portuguesas em África - como a ambição em construir ‘moderno’, desejo
  mais viável em África do que em Portugal. Verifica-se em África uma proliferação
  de traçados de cidades novas, expansões de cidades ou de embriões de cidades, num
  período que começa nos anos 20 e se intensifica nos anos 40. Quanto à obra edificada,
  expressa-se num ‘boom’ construtivo dos últimos 25 anos da presença portuguesa no
  continente. As marcas da modernidade estão presentes no urbanismo, na arquitectura
  e na inclusão de peças de artistas plásticos nos espaços edificados. Enquanto o
  Brasil atingia o auge do ideário moderno com Brasília, na África Portuguesa a marca
  da modernidade surge de forma mais descontínua, mas com intensidade. Com o desencadear
  em 1961 das guerras coloniais, contraditoriamente, se avoluma o afã construtivo
  e as cidades adquirem o aspecto da cidade moderna, verticalizada e desenvolvida.
  Além das cidades principais, produzem-se planos para numerosas pequenas povoações
  e procura-se dotá-las de equipamentos públicos de grande visibilidade e modernidade.
  Nunca nos territórios africanos de jurisdição portuguesa o Estado assume a modernidade
  como um desígnio, embora o use como imagem. Quando a assume, já as independências
  estão ao virar da esquina.
