abstract: O trabalho resulta de projeto “Cultura Visual e a Primeira república”, que
  investiga a relação entre a construção do Estado e o amplo campo das artes plásticas
  e visuais (arquitetura, escultura, pintura, vitrais). O texto pretende discutir
  como o trabalho de construção do Brasil republicano valeu-se tanto de lugares-comuns
  da mitologia nacional quanto de recursos tomados de empréstimo de diversas fontes
  européias, estes, às vezes, de forma incoerente com os desígnios da própria República.
  Focalizando o caso dos vitrais do terminal de passageiros do Porto do Rio de Janeiro,
  o trabalho procura apontar algumas das referidas incoerências e discutir aspectos
  da complexidade sublinhando a elaboração de uma sintaxe visual pré-modernista manifestada
  na chamada arquitetura dos 1920s.
