abstract: 'O processo de “síntese das artes” se dá de duas maneiras na arquitetura
  do século XX: uma a partir das vanguardas do começo do século e que de alguma forma
  vai marcar toda essência da arquitetura daí em diante, outra com os desdobramentos
  da arquitetura moderna a partir dos anos 30. A primeira acontece a partir de sua
  essencial dimensão artística através de modelos e ideais comuns entre os diversos
  campos da arte. A segunda através do diálogo ou fusão das várias manifestações artísticas
  ou “obras de arte” em um – ou com um - espaço arquitetônico e urbano. A primeira
  se dá a partir de uma “deshumanização” da arte. A segunda vai em busca de uma nova
  “humanização” que preencha a lacuna existente entre a cultura e a sociedade. Na
  arquitetura moderna brasileira ocorre uma simultaneidade dessas duas abordagens.
  É uma arquitetura que nasce desse diálogo em comum entre os campos artísticos que
  está na gênese da arquitetura moderna e que a partir da ruptura com a idéia de representação
  e mimese propõe uma nova maneira na construção da forma. Mas também se dá uma busca,
  no trabalho integrado de pintores, escultores, arquitetos e paisagistas e através
  do diálogo com a cultura local, da satisfação dos ideais humanistas de um fenômeno
  artístico constituído como “manifestação normal da vida”.'
