abstract: 'O presente artigo investiga a inserção da arquitetura art déco na cidade
  de Caruaru, Pernambuco, como contribuição para o conhecimento do patrimônio moderno
  no interior nordestino. Com respaldo teórico-metodológico voltado para a historiografia
  da arte e da arquitetura, o foco de análise recai sobre três edifícios de uso público
  construídos na zona central dessa cidade entre as décadas de 1940 e 1950: o Cine-Teatro
  Caruaru (comunicação e diversão), a Rádio Difusora de Caruaru (comunicação) e a
  Igreja de Nossa Senhora das Dores (oração). Busca-se contribuir para a valorização
  do acervo art déco ainda existente nessa cidade, em face de sua crescente descaracterização.'
