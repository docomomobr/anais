abstract: 'A farta produção encontrada em publicações que tratam da arquitetura monumental
  de Brasília contrasta com a escassez de estudos que tomem por base as fontes primárias
  de documentação e realizem a confrontação deste material com as obras construídas.
  As pesquisas realizadas para suprir esta lacuna têm como base os desenhos técnicos
  produzidos no período inicial da construção de Brasília e apresentam resultados
  em duas vertentes que contribuem para o entendimento edilício: a primeira relaciona-se
  aos subsídios para a manutenção e preservação dos bens arquitetônicos, a partir
  da sistematização de suas informações e principais características construtivas;
  a segunda vincula-se à historiografia dominante, complementando-a ou servindo de
  base para a revisão de dados que se repetiram sem a necessária revisão crítica.
  Em ambos os casos, os passos iniciais se baseiam nos estudos fundamentados em documentação
  cadastral disponível e complementados por levantamento físico dos edifícios. Este
  artigo apresenta as primeiras análises desta documentação técnica relacionada aos
  palácios projetados e construídos em Brasília entre 1957 e 1960: o Palácio da Alvorada,
  o Supremo Tribunal Federal, o Palácio do Planalto e, em mais detalhes, o Congresso
  Nacional.'
keyword: Congresso Nacional; arquitetura; documentação
