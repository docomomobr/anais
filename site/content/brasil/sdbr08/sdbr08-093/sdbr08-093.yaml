abstract: 'No panorama da arquitetura brasileira um elemento construtivo permanece
  atuando com funcionalidade e imponência: o azulejo. Com papel coadjuvante nos sistemas
  principais da obra, persiste como intérprete dos distintos tempos que produziram
  nosso patrimônio. Da ambientação do período colonial à ruptura e inovação do modernismo,
  adapta-se criando inesperadas situações sob a direção de novos autores. Em 1808,
  quando da chegada da família real, existiam no Brasil os mesmos motivos, estilos
  e fabricantes de azulejos existentes em Portugal. Predominavam os painéis figurativos
  com cenas religiosas e épicas que revestiam paredes de igrejas, conventos e solares
  residenciais. Com a chegada da Missão Francesa ao Brasil, em 1816, coincidindo com
  a liberação das importações e com a guerra civil em Portugal, fato que impediu sua
  fabricação, são importados azulejos inicialmente da França, Inglaterra e Holanda
  e, posteriormente da Bélgica, Espanha e Alemanha. Após a guerra civil, com a desativação
  da fábricas portuguesas e a concorrência de outros países, os azulejos provenientes
  de Portugal são na maioria com padrões de tapeçaria. Seja como painel narrativo
  religioso, sob a forma de tapetes ou unidades padrões, mantiveram sua capacidade
  de associar comunicação visual e informação à função de revestir espaços como ambientes
  cenográficos. A passagem do interior para as fachadas ocorre a partir do início
  do Século XIX, principalmente em cidades litorâneas. Conforme Dora Alcântara, a
  ocorrência dos primeiros azulejamentos de fachadas em São Luiz do Maranhão acontece
  a partir do primeiro quartel do Século XIX, A nova utilização de azulejos importados
  agora da Inglaterra, Alemanha, França e Bélgica, entre o final do Século XIX e início
  do XX, corresponde à alteração da arquitetura de características coloniais ao requinte
  das Neoclássicas e Ecléticas, atingindo também manifestações Art Nouveau e Art Deco.
  Entre 1920 e 1930, painéis de azulejos são incorporados à arquitetura assumindo
  o papel de ilustração de referência histórica do neocolonial brasileiro ou luso-brasileiro,
  formulado principalmente nas obras Victor Dubugras e Wasth Rodrigues. É na ruptura
  estabelecida pelo modernismo que acontece sua virada criativa adotando o "nacional"
  como tema, impulsionada nas autorias de Athos Bulcão, Portinari, Burle Marx, Djanira,
  Paulo Rossi-Ozir, entre outros. O azulejo assegura participação neste importante
  momento da arquitetura brasileira sob novas linguagens. Permanecem os grandes painéis
  narrativos religiosos e temas populares, na forma de tapetes ou unidades padrões
  repetidas. Composições geometrizadas, unidades modulares e elementos gráficos estilizados
  asseguram a anterior capacidade de associar comunicação visual e informação à função
  de revestir espaços como ambientes cenográficos, agora em paredes cegas ou entre
  os pilotis da nova arquitetura. Os temas reforçam a nacionalidade brasileira e a
  afirmação de sua identidade em contraponto com o receituário do movimento moderno
  internacional.'
keyword: Burle Marx; paisagismo; natureza
