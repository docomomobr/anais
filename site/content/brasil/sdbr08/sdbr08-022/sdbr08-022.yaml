abstract: O objetivo desse trabalho é, principalmente através dos discursos de Lucio
  Costa e de Le Corbusier sobre a Síntese das Artes, além da análise da aplicação
  dessas idéias às obras da Arquitetura Moderna nos anos 1940 e 1950 no Brasil, revelar
  e enfatizar o importante papel desempenhado pelas Artes Menores, e pelas Artes Aplicadas
  no processo da Síntese das Artes, como "veículos" das expressões maiores da arte
  que se propõe integrar à arquitetura, considerando elementos como azulejos, mosaicos,
  vitrais, tijolos, combogós, entre outros.
