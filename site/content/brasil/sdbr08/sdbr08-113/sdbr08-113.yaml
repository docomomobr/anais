abstract: São escassos os livros e os ensaios sobre o edifício do Ministério da Educação
  e Saúde Pública (MESP) que aprofundam as suas inovações de adequação climática e
  tecnológicas, com exceção do estudo da autora norte-americana Elisabeth D. Harris
  e do professor Oscar Corbella, que detalham a significação e a utilidade dos brise-soleil.
  Em geral, as análises aprofundam o caráter inédito da tipologia arquitetônica para
  a sede de um edifício público, e as qualidades urbanas, formais e espaciais que
  o colocam entre as primeiras obras importantes do Movimento Moderno no Brasil e
  na América Latina. No entanto, o edifício contém uma série de contribuições tanto
  no seu condicionamento ambiental quanto nas infra-estruturas técnicas que não eram
  difundidas nos edifícios de escritórios construídos no Rio de Janeiro na década
  dos anos trinta, e menos ainda nos prédios públicos construídos pelo governo Vargas.
  Nesse sentido, destaca-se o desenho da estrutura de concreto armado, elaborada pelo
  engenheiro Emílio Baumgart. Para eliminar a presença de vigas no interior dos espaços
  de escritórios, permitir a continuidade dos ambientes e a possibilidade de organizar
  as funções na planta livre, foi utilizado um sistema de lajes tipo piltz-decken
  com os cogumelos de suporte invertidos e absorvidos na espessura da laje de 30cm,
  que também permitia a inserção das tubulações horizontais da instalação elétrica.
  Ao mesmo tempo, os pilares modulados foram recuados e separados da fachada, o que
  permitia a imagem leve do volume principal. A adequação climática do edifício ao
  seu sítio é o tema mais conhecido, em particular pela utilização dos brise-soleil
  cobrindo a totalidade da fachada, desenvolvidos por Le Corbusier, mas que nunca
  tinham aparecido em uma fachada de um edifício daquele porte. Tampouco tinha sido
  executada uma fachada totalmente envidraçada – a curtain wall - posteriormente desenvolvida
  nos edifícios de escritórios nos Estados Unidos, que permitia a ventilação natural
  cruzada no interior, evitando assim o uso do incipiente ar condicionado, somente
  presente no pavimento do Ministro. Além disso, a contribuição mais original do projeto
  foi o desenho do sistema elétrico, telefônico e da iluminação artificial, baseados
  em uma modulação de 1.50m x 1.50m, que cobria todo o pavimento, permitindo a livre
  disposição dos funcionários. Para garantir tal versatilidade, foi criado um sistema
  de distribuição baseado na presença de pequenas caixas metálicas associadas aos
  corrimãos, que corriam ao longo das fachadas, com a localização dos fios em seu
  interior. Para obter uma iluminação artificial homogênea foram colocadas luminárias
  de origem inglesa, no teto de cada andar que criavam uma luz uniforme, já que não
  existiam paredes divisórias que chegavam até o teto, conservando-se a unidade do
  espaço contínuo. Em função das características ligadas ao conforto ambiental e ao
  uso de soluções tecnológicas inovadoras, pode-se afirmar que o edifício do MESP,
  à época de sua inauguração na década de quarenta, foi o mais moderno edifício de
  escritórios do Rio de Janeiro e do Brasil.
