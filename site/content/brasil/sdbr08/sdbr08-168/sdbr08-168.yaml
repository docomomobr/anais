abstract: Desde a Antiguidade clássica, a vinculação entre as diferentes artes não
  se constituiu um problema do fazer artístico. No século das Luzes, com o advento
  da Revolução Industrial e os novos procedimentos de formalização da matéria, a crise
  da arte se instaura desvelando questões que foram recolocadas até às vanguardas
  artísticas européias, como a síntese das artes. A idéia da síntese ou obra de arte
  total foi central na poética do Romantismo alemão. A síntese das artes é um tema
  que se configura na teoria da arte moderna, desde a sua formação iluminista até
  às vanguardas do início do século passado. O tema da síntese apareceu em diferentes
  poéticas modernas, com origens e entendimentos diferenciados. O trabalho apresentado
  examina o problema da síntese das artes, entendida como dialética da separação das
  esferas artísticas a partir de suas especificidades, mas não como antitética. A
  noção de separação das linguagens artísticas analisada foi a formulada pelo crítico
  norte-americano Clement Greenberg, uma visão diferenciada da teoria européia, em
  um momento que se constituiu nos extertores da arte moderna em meados do Século
  XX, também chamado de último modernismo. O recorte baseia-se na polêmica travada
  nos Estados Unidos na década de 1950, especificamente na cidade de Nova York, entre
  pintores norte-americanos, especialmente aqueles vinculados ao Expressionismo Abstrato,
  junto com os agentes do campo das Fine Arts versus o arquiteto Frank LLoyd Wright,
  autor do criticado projeto do Museu Solomon R. Guggenheim. O trabalho examina a
  noção de síntese das artes proposta pelo arquiteto, bem com as formulações greenbergianas
  sobre a pintura planar moderna, pontuando tanto as divergências entre as concepções
  arquitetônica e pictórica, quanto as similaridades existentes no âmbito da Arte
  Moderna norte-americana.
keyword: Síntese das Artes; Expressionismo Abstrato; Frank LLoyd Wright
