abstract: 'Antonio Virzi (1882-1954) contribuiu enormemente para o desenvolvimento
  arquitetônico e cultural do Rio de Janeiro no início do século XX. Pioneiro na construção
  de uma estética inovadora e original em consonância com o espírito de um novo tempo,
  seus projetos romperam com o academicismo historicista dominante e estabeleceram
  uma importante transição entre dois séculos. Apesar disso, o arquiteto ainda recebe
  pouco destaque na historiografia arquitetônica disponível. Desse modo, este trabalho
  pretende lançar luz à sua produção arquitetônica, contribuindo para a divulgação
  e preservação de sua obra e o reconhecimento da mesma como patrimônio (ameaçado)
  de uma moderna arquitetura carioca. Para isso, o artigo foi elaborado em três etapas
  distintas: a primeira apresenta um panorama geral sobre Antonio Virzi e seu tempo;
  a segunda ressalta a influência do movimento Arts and Crafts, do Art Nouveau e do
  Art Déco em sua obra, destacando sua importância na passagem do Ecletismo em direção
  ao Modernismo; a terceira e última realiza um estudo de caso do Villino Silveira
  (1915), abrindo perspectivas sobre a sua preservação.'
keyword: Antonio Virzi; Arquitetura; Rio de Janeiro
