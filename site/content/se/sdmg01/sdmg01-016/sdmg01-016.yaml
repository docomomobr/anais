abstract: O presente trabalho faz parte de uma pesquisa maior que tem como objetivo
  documentar e catalogar a historiografia e iconografia da arquitetura moderna brasileira
  presente nas revistas de arquitetura de 1945 a 1960, período que se destacou pelo
  desenvolvimento de uma identidade arquitetônica brasileira. Defendendo a interpretação
  de obras, como base para a formulação das relações do edifício e seu entorno e das
  conseqüências das aplicações estéticas para o período atuante, o presente projeto
  de pesquisa coleta um material que possibilita fazer uma comparação da repercussão
  da arquitetura moderna brasileira em revistas nacionais e internacionais selecionadas,
  revelando seu reconhecimento em ambas esferas. A partir da catalogação feita, enfatiza-se
  aqui o Complexo da Pampulha em Belo Horizonte, obra de Oscar Niemeyer que atingiu
  maior repercussão na imprensa especializada da época. Através de sua repercussão
  nas publicações revela-se a importância da obra para o movimento moderno brasileiro.
