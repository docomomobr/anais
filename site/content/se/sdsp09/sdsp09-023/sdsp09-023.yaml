abstract: Esta comunicação apresenta, analisa e discute o longo processo da abertura
  de tombamento de imóveis no bairro paulistano de Higienópolis, proposto pelo Departamento
  de Patrimônio Histórico da Cidade de São Paulo, em 1992, que só veio a se encerrar
  mais de 20 anos depois. Durante o longo processo, argumentamos que se foram perdendo
  as perspectivas de um entendimento da paisagem ambiental urbana do conjunto dos
  bens que pretendiam ser protegidos pelo tombamento. Essa perda de uma visão geral
  sobre a cidade, centrando o processo do tombamento em edifícios tomados isoladamente,
  reduz a capacidade de entendimento da cidade e privilegia interesses do mercado
  que pode, então, se concentrar na luta por cada edificação. Pretende-se, também,
  refletir sobre a importância das tendências políticas das administrações municipais
  que comandam as políticas públicas de preservação, afetando o desenvolvimento dos
  processos de salvaguarda e desenvolvimento dos remanescentes construídos pelas sociedades
  passadas, mas ainda vivos entre nós.
