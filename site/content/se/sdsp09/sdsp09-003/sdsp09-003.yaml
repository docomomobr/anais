abstract: A implementação do Plano de Ação (PAGE) na gestão do governador Carvalho
  Pinto no Estado de São Paulo (1959-1963) teve um impacto profundo na difusão e afirmação
  da arquitetura moderna em todo Estado, incluindo o litoral paulista, com a produção
  de mais de 1.000 equipamentos públicos. Até o Plano as obras públicas, na sua imensa
  maioria, eram projetadas pelo Departamento de Obras Públicas com uma arquitetura
  de extração eclética, neocolonial ou ainda possuíam uma linguagem corrente de difícil
  definição. As obras do PAGE foram implantadas quando a Arquitetura Moderna já conhecia
  ampla aceitação e há um ano da inauguração de Brasília, além de alinharem a produção
  estatal paulista com a produção arquitetônica em geral, não se restringindo a replicar
  soluções consagradas e existentes. A especulação arquitetônica propiciada e estimulada
  pelo PAGE deu vazão a um conjunto de concepções que renovavam a proposição da dimensão
  pública dos equipamentos através de uma pluralidade arquitetônica substantiva. Essa
  produção colocou em relevo a dimensão social da própria arquitetura moderna, e foi
  o terreno no qual se constituiu a corrente que veio a ser conhecida como escola
  paulista, uma das expressões da pluralidade arquitetônica.
