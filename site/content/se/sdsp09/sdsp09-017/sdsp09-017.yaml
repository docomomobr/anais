abstract: Este artigo faz uma breve análise do edifício SULACAP localizado em Santos/SP,
  projetado pelo arquiteto Roberto Capello enquanto profissional responsável pela
  elaboraçao dos projetos arquitetônicos das sedes da empresa Sul América. A análise
  reflete sobre a representatividade desses edifícios no espaço urbano da cidade de
  Santos e no contexto da modernidade arquitetônica brasileira. Além disso, o artigo
  discorre sobre a trajetória profissional de Roberto Capello, arquiteto pouco referenciado
  na historiografia da arquitetura brasileira. Capello foi um arquiteto italiano que
  migrou para o Brasil no início do século XX, com a responsabilidade de coordenar
  o Departamento de Propriedades e Hypotecas da empresa Sul América, estruturado para
  a elaboração dos projetos arquitetônicos das novas sedes que a empresa viria a construir
  nas principais cidades brasileiras, como a sede SULACAP de Santos.
