abstract: 'A trajetória pessoal de Abrahão Velvu Sanovicz, sua obra de arquitetura
  e sua atuação como professor, permite identificar em seus projetos, aquela que foi
  sua principal tese: o projeto como pesquisa. Abrahão, nascido em Santos SP, em 19331,
  formou-se arquiteto, em 1958, pela Faculdade de Arquitetura e Urbanismo da Universidade
  de São Paulo, onde foi professor de 1962 a 1999, atividade que exerceu até os últimos
  dias de sua vida. Ao estabelecer as determinações que orientaram o arquiteto a cada
  obra analisada; ao explicitar as condições e reflexões que o levaram à realização
  das propostas; ao investigar o que há de comum, permanente ou essencial na postura
  de Abrahão Sanovicz quando elabora seus projetos; e, ainda, ao investigar como ocorreu
  a síntese dos conhecimentos na invenção do objeto – a arquitetura; busca-se a compreensão
  da totalidade do processo de elaboração do projeto.'
keyword: Arquitetura moderna – Brasil; Sanovicz, Abrahão Velvu, 1934 – 1999
