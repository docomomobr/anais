abstract: O presente artigo pretende apresentar a história da construção de uma centralidade
  na metrópole industrial paulistana, a Cinelândia Paulistana, a partir da relação
  de suas salas de cinema modernas com os projetos e planos urbanísticos modernos
  de Prestes Maia (Plano de Avenidas, a partir da década de 1930, Prefeito entre 1938-1945).
