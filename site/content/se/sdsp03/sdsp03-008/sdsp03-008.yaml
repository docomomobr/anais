abstract: O déficit habitacional no Brasil de 5,6 milhões de unidades exige a participação
  da universidade na busca de soluções técnicas para a questão habitacional. A temática
  da habitação social tem sido objeto de reflexão sobre a produção arquitetônica em
  São Paulo no século XX, em disciplina de Planejamento Urbano no 7º semestre da Faculdade
  de Arquitetura e Urbanismo da Universidade Presbiteriana Mackenzie. A Era Vargas,
  o debate sobre habitação social e a produção dos IAPs são abordados pela pesquisa
  desenvolvida em conjunto com os alunos. Em especial será abordado o projeto do Edifício
  Japurá, desenvolvido pelo arquiteto Eduardo Kneese de Mello para o Instituto de
  Aposentadoria e Pensões dos Industriários. Neste projeto foram empregados de forma
  pioneira no Brasil os princípios da “unité d’habitation”, como modelo para a habitação
  vertical de interesse social. Esse edifício se destacou em termos arquitetônicos
  e urbanísticos, entre as iniciativas de padrão vertical realizadas pelo IAPI.
keyword: Habitação Social; Urbanismo; IAPs
