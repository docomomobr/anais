abstract: 'A monumentalidade é o moto da arquitetura clássica. No Movimento Moderno
  ela é banida, por ser um valor da tradição. Por diversos caminhos, vê-se como fundamental
  sua reincorporação – cautelosa, a partir da inauguração de uma “nova monumentalidade”,
  baseada na estética moderna e em seus recursos plástico-visuais. No MM estavam presentes
  as questões: A monumentalidade não compromete os princípios da arquitetura moderna?
  A monumentalidade clássica, por sua vez, não é um valor superado e pior, essencialmente
  “aparência”, manipulável e manipulada por ideologias? A importância de Auguste Perret
  é incontestável quando se trata de avaliar os primeiros experimentos com o concreto
  armado na arquitetura, ou as bases sobre as quais Le Corbusier construiu sua poética.
  Porém, no Brasil quase nada é sabido sobre sua obra, seja na França ou fora dela.
  Marcelo Piacentini é reconhecido como arquiteto proeminente na Itália do período
  facista, com inúmeros projetos então realizados em Roma ou encomendados no Brasil,
  sempre causando desconforto quanto às suas filiações ideológico-estilísticas. Jacques
  Pilon tem um percurso marginal na historiografia oficial do Movimento Moderno, mais
  associado que está a uma produção empresarial na área da construção civil, por intermédio
  da empresa Pilmat, da qual era titular. As obras de Pilon transitam por um espectro
  largo, que vai do clássico-moderno ao moderno com “pedigree” de Franz Heep, que
  teve passagem por seu escritório, como é de amplo conhecimento. Finalmente, a firma
  Severo & Villares, sucessora do escritório Técnico Ramos de Azevedo, está mais ligada
  à São Paulo tradicional, da arquitetura pragmática e acadêmica de seus quadros egressos
  de cursos de engenheiros-arquitetos da Escola Politécnica, do que à discussão proposta
  pelas vanguardas. As linhas arquitetônicas seguidas por estes arquitetos e as marcas
  por eles deixadas, uma vez que suas filiações ideológicas, posicionamento em face
  do Movimento Moderno oficial e produção arquitetônica e urbanística vêm de encontro
  e conflitam com as tendências “modernistas” do período, são as reflexões propostas.'
