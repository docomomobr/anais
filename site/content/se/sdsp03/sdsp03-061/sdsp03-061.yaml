abstract: O artigo apresenta uma reflexão sobre a influência e permanência de alguns
  princípios do urbanismo moderno em planos diretores municipais e seus impasses diante
  de contextos econômicos e políticos profundamente modificados pelos processos decorrentes
  uma economia globalizada e onde os espaços urbanos locais assumem importância destacada
  na articulação de novos arranjos produtivos e políticos. A relevância desta questão
  acentua-se pela presença dos marcos institucionais atuais de regulação urbanística
  inseridos na Constituição Federal de 1988 em seu Capítulo Política Urbana que fortalece
  o papel do município como unidade básica de planejamento urbano, estabelecendo a
  obrigatoriedade de elaboração do Plano Diretor aos municípios com mais de 20.000
  habitantes e pelo Estatuto da Cidade, Lei nº 10.257/2001 que regulamenta as diretrizes
  constitucionais e estabelece novos instrumentos específicos de política urbana representando
  inegável avanço de desenvolvimento local. No Estatuto da Cidade, a figura de o Plano
  Diretor é reforçada, porém com uma visão bastante distinta dos modelos difundidos
  pelo Movimento Moderno e amplamente assimilada no Brasil nas décadas de 60 e 70.
  O objetivo deste artigo é conduzir esta reflexão na análise do Plano Diretor de
  Limeira de 1998, município paulista localizado na Região de Campinas, de modo a
  aferir o caráter deste instrumento urbanístico vigente, apontando a persistência
  de princípios do urbanismo moderno e seus impasses diante da necessidade de readequação
  às novas composições econômicas locais e aos marcos institucionais citados. Este
  município constitui um caso exemplar por evidenciar a presença de um Arranjo Produtivo
  Local – APL, em ourivesaria e bijuteria, reunindo médias e pequenas empresas, baseado
  em formas inovadoras de articulação participativa e cooperativa do setor privado
  e outras instâncias institucionais. Sobretudo, os reflexos positivos e inovadores
  destas articulações sobre o ambiente urbano também dependem da adoção de instrumentos
  urbanísticos contemporâneos.
keyword: Plano diretor municipal; legislação urbana; município de Limeira
