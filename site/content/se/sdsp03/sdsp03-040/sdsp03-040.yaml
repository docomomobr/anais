abstract: A história consolidada da arquitetura moderna brasileira considera determinantes
  as políticas que cercam seus pressupostos e produção. Incontáveis pesquisas ampliam
  o conhecimento dessa história moderna e acrescentam precisão e curiosidades, sem,
  no entanto, enfrentar declarada descontinuidade e divergência conceitual. Na década
  de 1960, o brutalismo paulista substituiu a sensibilidade artística mais próxima
  à atingida pelo Intenational Style e desencadeou profunda repulsa à forma, inexplicavelmente
  esquecida pelo entendimento de fenômenos que procuravam provar a linearidade do
  progresso moderno. A aceitação irrestrita da arquitetura como tributária da razão
  e da ética fecha o cerco ideológico que exclui estética e forma modernas do processo
  e avaliação artísticos. A combinação da plástica e partido favorece prescindir da
  forma moderna intelectiva. O ensaio suspende algumas dessas certezas e procura demonstrar
  que também é factível entender o brutalismo como degradação do processo moderno
  de concepção e, mais ainda, como uma espécie de realismo artístico que retrocede
  à experiência estética mais emotiva e convencional ao considerar mecanismos originais
  e estrutura simbólica; A obstrução do juízo visual na arquitetura começou com as
  rebeliões juvenis do continente europeu e desembocaria no rebaixamento da arquitetura
  paulistana, todavia orientada para aprofundar ainda mais seus efeitos radicais.
  Para entender a fratura formidável que representou o ataque brutalista ao pensamento
  moderno do século XX, parece necessário reativar a categoria da forma moderna como
  parâmetro eficaz que distingue objetos criados segundo critérios de semelhança e
  aparência e artefatos concebidos segundo uma ordem interna que lhes fornece legalidade
  e estrutura.
keyword: brutalismo; estética; arquitetura paulista
