abstract: Para analisar duas concepções diferentes de urbanismo moderno – a embrionária,
  de origem inglesa, denominada culturalista e a progressista (CHOAY, 1965)1, esta
  última, consolidada também como Urbanismo Modernista , tem-se como objeto de estudo
  o bairro Pacaembu. Pretende-se discutir quais são os preceitos do urbanismo culturalista
  que determinaram a ocupação do Pacaembu e até que ponto algumas características
  deste bairro, caracterizadas como inovadoras para a época, já incorporam traços
  do urbanismo progressista que viria a se consolidar alguns anos depois.
