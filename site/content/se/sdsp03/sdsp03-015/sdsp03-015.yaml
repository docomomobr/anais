abstract: 'Oswaldo Arthur Bratke realiza na década de 40 e 50 vários projetos na chamada
  “Cidade Nova”: a época novo pólo de negócios e serviços na área central de São Paulo.
  Os edifícios destinavam-se, sobretudo, ao uso residencial, comercial e de serviço:
  eles foram concebidos sob a estratégia de verticalização proposta para a área e
  também sob o impacto do Plano de Avenidas de Prestes Maia. Dentre eles destacam-se
  os três edifícios de esquina de Bratke, construídos no decorrer de uma década, na
  confluência das ruas Araújo e Major Sertório, são eles: o Jaçatuba, o ABC e o Renata
  Sampaio Ferreira. Os três encontram-se protegidos como bens culturais arquitetônicos
  com interesse de preservação, pela lei Municipal nº 8.328/75, fazendo parte da denominada
  “mancha 11: São Paulo Moderna “. No início dos anos 40, coincidem e convivem de
  maneira intensa e singular nesta região da cidade, as políticas de verticalização,
  as mudanças do traçado do sistema viário conferido pelo Plano Avenidas, as alterações
  de leis nos códigos urbanísticos, e as elaborações mais programáticas e consistentes
  de uma linguagem estilística moderna para a arquitetura brasileira e paulista. Este
  estudo examina estas esquinas e estes três edifícios, este momento peculiar da área
  central de São Paulo, descrevendo este entrelaçamento mútuo de fatores, atendo-se
  às circunstâncias que os engendraram, tanto na qualificação e configuração do espaço
  público, quanto nas particularidades da arquitetura de Bratke: naquilo que lhe é
  própria, que a marca, que a distingue das generalidades de um ideário de época tão
  caro ao arquiteto. Em outros termos, procura-se descrever aquilo que é tecido junto:
  o texto-ideário de um arquiteto e o contexto-cidade de suas intervenções. O encontro
  e reciprocidade entre uma linguagem moderna que se constrói expressando novos valores
  e o urbanismo modernizador que a conforma por meio de novas normativas e lógicas
  urbanísticas.'
keyword: Oswaldo Bratke; Arquitetura Moderna
