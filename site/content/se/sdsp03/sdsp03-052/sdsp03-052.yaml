abstract: 'Este estudo pretende analisar a arquitetura paulista divulgada fartamente
  nas publicações da Revista Habitat durante o período em que esteve sob a direção
  de Lina Bo Bardi e Pietro Maria Bardi. A Revista Habitat como fonte documental primária
  e sua permanência no cenário cultural paulistano entre 1950 e 1965, foi dirigida
  por diferentes personalidades. Podemos considerar três diferentes etapas de sua
  publicação: a primeira - de 1950 a 1954 - a qual este trabalho dará ênfase, corresponde
  a uma “fase experimental da revista”. A reflexão sobre os arquitetos divulgados
  pela Revista, a partir dos projetos de arquitetura publicados, bem como os críticos
  e teóricos que os apresentam, é entendida como escolha de um pensamento (olhar)
  moderno sobre uma sociedade em transformação, nos seus aspectos político, social
  e cultural, na qual São Paulo aparece como protagonista. A análise em conjunto destes
  artigos, forma um importante recorte da Arquitetura Moderna Brasileira produzida
  nos anos 50 e indicam a formação de uma consciência artística e cultural, construída
  a partir da tarefa a que Habitat se dispõe, entre outras, a crítica de arquitetura
  brasileira.'
keyword: arquitetura; Habitat; década de 50
