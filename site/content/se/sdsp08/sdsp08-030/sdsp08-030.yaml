abstract: Lineu Castello, em seu livro “A percepção de lugar”, introduz a escrita
  com uma interessante frase de uma entrevista de Denise Scott Brown e Robert Venturi
  à Hans Obrist e Rem Koolhaas que menciona que os arquitetos, ao serem sensíveis
  ao seu tempo, gostam de analisar o que lhes estimula, pois, esse estímulo será relevante.
  Este artigo partiu de uma pesquisa que busca artifícios para promover um caráter
  identitário à cidade, através de um Promenade Urbano que valoriza a arquitetura
  moderna de Curitiba. A partir de tais análises, o centro da cidade de Curitiba é
  escolhido para abrigar um passeio deambulatório pela arquitetura moderna com intenção
  de instigar a percepção dos transeuntes ao os levar para espaços de encontro, com
  a arquitetura e com o outro. Um modesto e despojado convite à reflexão de como os
  arquitetos poderão entregar resultados pertinentes para os prementes desafios arquitetônicos.
