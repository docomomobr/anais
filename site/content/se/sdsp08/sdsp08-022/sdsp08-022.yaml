abstract: O presente artigo tem como objetivo descrever de forma narrativa algumas
  obras do arquiteto paranaense Ayrton Lolô Cornelsen para posteriormente demonstrar
  a preservação de suas edificações. Arquiteto nascido em 1922, ainda é pouco conhecido
  fora do âmbito da arquitetura paranaense, embora possa ser comparado quantitativamente
  e qualitativamente a outros arquitetos brasileiros contemporâneos a este. A importância
  desse trabalho surge da observância da destruição de algumas obras do arquiteto,
  tanto demolições percebidas ao longo de sua carreira, mas sobretudo da significativa
  perda de edificações nos últimos anos. O anexo do restaurante do passeio público
  em Curitiba e o Autódromo Internacional do Paraná construído na década de 1960 são
  exemplo de construções que foram demolidas nos últimos cinco anos. Além disso a
  própria morte do arquiteto em 2020, mostra a real lacuna desse legado. Assim o presente
  trabalho pretende ressaltar e documentar as recentes perdas desse acervo construído,
  bem como atentar para a importância de criar mecanismos de preservação para evitar
  futuras destruições das edificações do arquiteto.
