abstract: 'A pesquisa "Centro Histórico de São Paulo: documentação e estudos de reabilitação"
  apresentada aqui, tem como objetivos principais avaliar o potencial de aproveitamento
  e reabilitação das estruturas urbanas e arquitetônicas da área central a partir
  do início do século XIX, e contribuir para preservação e gestão do patrimônio construído
  do Centro Histórico de São Paulo. Os dados e informações reunidos a partir do levantamento
  sistemático das edificações e da estrutura urbana, de estudos bibliográficos, dos
  levantamentos de fontes arquivísticas e de levantamentos de campo, são organizados
  no Banco de Dados do Centro Histórico de São Paulo.'
