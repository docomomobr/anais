abstract: Com a perspectiva da apreensão e cognição das multiplicidades, heterogeneidades
  e diversidades espaciais, se reconhecem as potencialidades do conjunto modernista
  do Patrimônio Ferroviário de Birigui. Esse bem patrimonial foi construído no início
  da década de 1970. Seu processo, marcado pelas territorialidades, desterritorialidades
  e reterritorialidades, foram identificadas pela experimentação espacial. Desse modo,
  o conjunto arquitetônico ferroviário é apreendido por meio das práticas de derivas
  juntamente com a realização de cartografias expressivas de forças e afetos mapeando
  as relações entre os indivíduos e sua ambiência, com suas multiplicidades presentes
  nos seus territórios, em constante movimento e transformação. Assim, a possibilidade
  de ativar esse espaço com seus corpos singulares atravessados pelos afetos, identificados
  e reconhecidos, pode estimular as sensações de pertencimento com o lugar, potencializando
  a valorização, conservação e preservação do patrimônio ferroviário da cidade.
keyword: Patrimônio; Deriva; Cartografia
