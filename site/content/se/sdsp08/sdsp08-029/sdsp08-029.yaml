abstract: 'Apresenta os processos e resultados de investigação empreendida para a
  identificação de exemplares representativos da Arquitetura Moderna no centro da
  cidade de Ribeirão Preto, a partir de metodologia envolvendo levantamentos de campo
  em plataformas digitais e pesquisas em banco de dados da Prefeitura Municipal de
  Ribeirão Preto. Utiliza como estudo de caso o trabalho de Iniciação Científica intitulado
  “Uma história não contada: o reconhecimento da Arquitetura Moderna no Quadrilátero
  Central de Ribeirão Preto entre as décadas de 1940 e 1960”, desenvolvido ao longo
  dos anos 2019 e 2020, junto ao curso de Arquitetura e Urbanismo da Universidade
  Paulista, em Ribeirão Preto. Além do mapeamento das edificações modernas existentes,
  foi possível analisar a diversa configuração formal e programática assumida por
  essa produção e verificar os principais períodos de sua concepção no centro de Ribeirão
  Preto.'
keyword: Arquitetura Moderna; Levantamentos digitais; Ribeirão Preto
