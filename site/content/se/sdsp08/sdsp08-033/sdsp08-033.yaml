abstract: Ao longo da última década, a recente valorização do Móvel Moderno Brasileiro
  vem sendo abordada no campo do resgate histórico e preservação da produção. Entretanto,
  o cenário geral se caracteriza pela ausência de publicações, exposições e pesquisas
  relacionadas ao mercado de design do Brasil no mesmo período. A tradição das casas
  de antiguidades e o tempo de mercado consolidaram as galerias, mas ainda existem
  poucas iniciativas de discussões acerca da salvaguarda, memória e identidade da
  rica produção brasileira da década de 1950. O presente artigo pretende abordar a
  experiência da galeria de atuação internacional Bossa Furniture, investigando suas
  iniciativas de preservação, comunicação e pesquisa referente à sua coleção de mobiliário
  moderno brasileiro.
