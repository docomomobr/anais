abstract: O Departamento de São Paulo do Instituto de Arquitetos do Brasil (IABsp)
  constituiu, ao longo de sua história, um valoroso acervo documental. Os recentes
  esforços da equipe responsável por seu acervo têm reconhecido a importância de sua
  preservação e, da mesma forma, têm discutido sobre as especificidades das coleções
  de arquitetura e urbanismo. O presente artigo pretende, a partir do caso do IABsp,
  apresentar seu acervo e as estratégias empreendidas no âmbito de sua gestão e extroversão,
  em vias de refletir sobre os desafios colocados a arquitetas, arquitetos e urbanistas
  pelos acervos de nosso campo disciplinar.
