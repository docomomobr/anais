abstract: 'Este artigo tem como principal objetivo relatar a história do conjunto
  original e o seu processo de recuperação. O trabalho foi estruturado em partes:
  antecedentes, projetos originais e projetos de restauro e é baseado em trabalhos
  anteriores realizados pela autora, depoimentos e material fornecido pelos arquitetos
  Tibau, Corona, Elito e Faccio. Dessa forma, pretende contribuir com o Docomomo em
  seus objetivos de documentação e com a preservação das criações do Movimento Moderno
  na arquitetura paulistana.'
