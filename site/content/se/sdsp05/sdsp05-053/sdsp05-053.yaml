abstract: 'Com ênfase no tema da arquitetura moderna e do patrimônio, este artigo
  analisa a produção de dois projetos arquitetônicos de estádios na cidade de São
  Paulo produzidos pelo arquiteto Vilanova Artigas em parceira com Carlos Cascaldi,
  mais especificamente nas décadas de 50 e 60 do século XX: o projeto e obra executada
  do estádio do Morumbi e a elaboração do projeto do estádio do Canindé. Este último
  acabou não sendo construído, e o estádio do Morumbi se tornou um dos marcos postais
  da cidade de São Paulo, tanto por sua relevância arquitetônica quanto por sua monumentalidade
  na paisagem. Inicialmente este artigo trata das questões que nortearam ambos os
  projetos, assim como as transformações ocorridas no estádio do Morumbi ao longo
  do tempo, afim de que o mesmo se adaptasse às novas solicitações e exigências que
  um local deste tipo necessita para se manter presente e ativo. Inseridos em um momento
  histórico singular da arquitetura brasileira, de experimentação do concreto armado
  na construção civil em obras de grande escala e o aparecimento do movimento brutalista
  paulista, os objetos de estudo deste artigo serão analisados, caso a caso, a partir
  de uma metodologia de análise dos cortes dos estádios, utilizando para isso modelos
  virtuais tridimensionais, nos quais pode se verificar as características do traço
  arquitetônico de ambas as obras. E por fim, além da análise dos estádios, o artigo
  busca de fato manter viva a importância da produção arquitetônica de Vilanova Artigas
  e de seus colaboradores, sendo que a sua produção arquitetônica tanto construída
  como também projetual, permanecem até hoje como referência na arquitetura brasileira.'
keyword: Vilanova Artigas; Estádios; Brutalismo; Morumbi; Canindé
