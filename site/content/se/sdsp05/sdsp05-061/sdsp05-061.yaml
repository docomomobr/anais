abstract: O artigo mostra a formação do Centro Histórico da Cidade de São Paulo, seu
  intenso crescimento, verticalização e lento, mas progressivo declínio econômico
  à partir de 1939, com centenas de edifícios de escritórios ocupados apenas no térreo,
  mas vazios nos andares superiores. Apesar de abundante infraestrutura, pois é cruzado
  por duas linhas de Metrô, água, luz, energia, telefones, coleta de lixo e segurança
  pública, bem como pela pedestrianização de muitas ruas o Centro Velho é vazio à
  noite e nos horários não comerciais. Por esse motivo os últimos prefeitos de São
  Paulo, a começar pela gestão Marta Suplicy (2000-04) tem procurado ocupar o centro,
  oferecendo trabalho e moradia. Na sua gestão levou a sede da Prefeitura para o antigo
  edifício das Indústrias Reunidas Matarazzo e muitas secretarias para edifícios vazios
  no centro. Essa iniciativa da Prefeitura foi seguida pelo Governo do Estado. No
  entretanto poucos edifícios foram efetivamente transformados em habitações de interesse
  social. A legislação proposta pelo prefeito Fernando Haddad (2012-16) em outubro
  de 2016, pode tornar-se o instrumento de uma revitalização mais extensa do Centro
  Histórico. A aplicação desses instrumentos legais a um edifício privado, mas vazio
  na Rua Direita pode ser um indicador dessa tendência e um exemplo das tipologias
  possíveis naquela região central de São Paulo.
