abstract: Este artigo realiza uma reflexão crítica da casa Tomie Ohtake, projetada
  por Ruy Ohtake em 1966, e oferece uma perspectiva a partir do projeto dos móveis
  fixos que existem nesse projeto. A prática arquitetônica frequentemente engloba
  design de interiores e design de móveis, e no projeto da casa Tomie Ohtake observa-se
  superposição dessas duas disciplinas; o resultado são móveis de concreto integrados
  à arquitetura da casa. Esse recurso projetual é recorrente na produção de residências
  de arquitetura moderna em São Paulo realizadas entre 1955 e 1975, e a casa Tomie
  Ohtake é um exemplo de grande ocorrência de móveis fixos. Trata-se de um projeto
  isolado, uma única casa unifamiliar, que é concebida seguindo a mesma tese da arquitetura
  e do urbanismo moderno, que aposta na transformação social a partir do projeto de
  conteúdo programático, que estava em voga no discurso de filiação modernista no
  período. Este artigo analisa a visualidade e os modos de morar que o projeto da
  casa Tomie Ohtake propõe a partir da análise centrada na mobília fixa existente
  nessa residência.
keyword: Móvel fixo; Casa Tomie Ohtake; Arquitetura moderna paulista
