abstract: O balanço entre as diversas escalas, desde a cotidiana e comum até a metropolitana,
  fez parte da trajetória projetual do arquiteto Rino Levi e teve seu apogeu na proposta
  elaborada para o concurso da nova Capital Federal. Entretanto, alguns anos antes
  o arquiteto paulista já havia apresentado um ensaio sobre este assunto, que introduziu
  a questão da sociabilidade e vizinhança, posteriormente utilizado em Brasília. Este
  ensaio foi iniciado com o projeto para o Setor Residencial de Estudantes para a
  Cidade Universitária Armando Salles Oliveira da Universidade de São Paulo, apresentado
  em 1953 como parte de uma série de projetos para a comemoração do IV Centenário
  da cidade de São Paulo, ocorrido em 1954.
