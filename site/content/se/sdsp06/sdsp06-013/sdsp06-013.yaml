abstract: O objetivo principal deste artigo é documentar e analisar o projeto do Conjunto
  Residencial Cidade Jardim de autoria do arquiteto Eduardo Kneese de Mello (1906-1994)
  e equipe, desenvolvido entre 1944-1946, em São Paulo, para o Instituto de Aposentadoria
  e Pensões dos Comerciários (IAPC). A pesquisa analisa, de maneira minuciosa, as
  propostas elaboradas pela equipe, buscando divulgar um projeto que ainda permanece
  desconhecido por grande parte dos arquitetos e estudantes. Do mesmo modo, a pesquisa
  demonstra como este conjunto residencial representa a divulgação, apropriação e
  adequação de paradigmas do movimento moderno, em especial a Carta de Atenas (CIAM,
  1933) para o contexto brasileiro.
