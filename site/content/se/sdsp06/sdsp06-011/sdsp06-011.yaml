abstract: Essa pesquisa apresenta parte da trajetória profissional do arquiteto Eduardo
  Augusto Kneese de Mello (1906–1994) por meio de sua produção arquitetônica e teórica,
  com foco nas obras e textos voltados para a questão da habitação de interesse social.
  Busca-se, portanto, visualizar nos percursos do arquiteto a importância das relações
  entre teoria e prática da Arquitetura. Ao intentar o estudo das relações entre os
  textos e palestras proferidas por Kneese com seus projetos e obras de arquitetura,
  pôde-se traduzir como ideias e conceitos incorporaram-se à produção arquitetônica.
  Expõe sua contribuição para a arquitetura brasileira relacionando a qualidade de
  sua obra, com os textos que produziu e com seu aguerrido empenho no processo de
  divulgação dos preceitos da Arquitetura Moderna.
keyword: Habitação de interesse social; Movimento Moderno; Teoria
